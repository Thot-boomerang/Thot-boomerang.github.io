    contenu: `
<h3>1. Le terreau : défaite, humiliation, violence</h3>
<p>La République de Weimar naît en 1919 d’une double blessure : une défaite militaire que l’état-major impute aussitôt à l’arrière — c’est la légende du <strong>« coup de poignard dans le dos »</strong> —, et un traité de Versailles perçu comme un <em>Diktat</em>. L’Allemagne perd 13 % de son territoire, ses colonies, et se voit imputer par l’<strong>article 231</strong> la responsabilité de la guerre. La jeune République est ainsi chargée d’appliquer ce que ses adversaires lui reprochent.</p>
<p>Dans ce climat naît à Munich, en janvier 1919, le <strong>Parti ouvrier allemand</strong> (DAP), groupuscule nationaliste et antisémite qu’<strong>Adolf Hitler</strong>, alors agent de propagande de l’armée, rejoint à l’automne. Rebaptisé <strong>NSDAP</strong> en 1920, doté d’un programme en vingt-cinq points et d’un service d’ordre, la <strong>SA</strong>, il tente le <strong>putsch de la Brasserie</strong> les 8 et 9 novembre 1923, en pleine crise de la Ruhr et de l’hyperinflation. L’échec est complet, mais le procès offre à Hitler une tribune nationale : condamné à cinq ans, il en purge neuf mois et rédige <em>Mein Kampf</em>.</p>

<h3>2. La « voie légale » et l’échec des années de prospérité</h3>
<p>Le putsch a enseigné une leçon stratégique : on ne prend pas le pouvoir contre l’armée et la police. Refondé en 1925, le parti adopte la <strong>voie électorale</strong>, non par conversion démocratique mais par calcul — il s’agit d’entrer légalement dans l’État pour le détruire de l’intérieur. Le NSDAP se dote d’un appareil national, d’organisations de jeunesse, de paysans, d’étudiants.</p>
<p>Le résultat, pendant les années de stabilisation, est dérisoire : aux élections de <strong>mai 1928</strong>, le parti réunit à peine <strong>2,6 % des voix</strong> et douze députés. C’est la démonstration la plus claire du lien entre nazisme et crise : tant que l’économie tient, le mouvement reste marginal.</p>

<h3>3. La crise fait le parti (1930-1932)</h3>
<p>Le krach de 1929 frappe une économie qui vivait des capitaux américains à court terme. Le chômage passe de 1,3 million en 1929 à plus de <strong>6 millions au début de 1932</strong>. Le chancelier <strong>Brüning</strong>, sans majorité, gouverne par <strong>décrets présidentiels</strong> fondés sur l’article 48 de la Constitution et impose une politique de déflation qui aggrave la contraction. Le Reichstag ne légifère presque plus : la démocratie parlementaire est morte avant l’arrivée d’Hitler.</p>
<p>Le vote nazi explose : <strong>18,3 % en septembre 1930</strong>, puis <strong>37,3 % en juillet 1932</strong>, qui font du NSDAP le premier parti du Reichstag. Sa sociologie est celle d’un <strong>parti attrape-tout de la protestation</strong> : surreprésenté chez les protestants, les ruraux, les classes moyennes indépendantes, les jeunes ; nettement plus faible chez les catholiques pratiquants, encadrés par le Zentrum, et chez les ouvriers syndiqués, fidèles au SPD et au KPD. Ces derniers s’affrontent d’ailleurs entre eux, le KPD, sur consigne de Moscou, désignant les socialistes comme « sociaux-fascistes ».</p>

<p>La rue compte autant que les urnes. L’année 1932 est la plus violente de la République : affrontements quotidiens entre SA, militants communistes et sociaux-démocrates, avec plusieurs centaines de morts. Le pouvoir répond en frappant la démocratie plutôt que ses adversaires : le <strong>20 juillet 1932</strong>, von Papen destitue par décret le gouvernement prussien dirigé par les sociaux-démocrates, qui contrôlait la plus grande police d’Allemagne. Ce coup de force, accepté sans résistance, prive le camp républicain de son dernier bastion institutionnel six mois avant l’arrivée d’Hitler.</p>

<h3>4. Une nomination, pas une conquête</h3>
<p>En novembre 1932, le NSDAP recule à 33,1 % et ses finances vacillent : le mouvement plafonne. C’est alors que les intrigues de palais lui ouvrent la porte. <strong>Franz von Papen</strong>, écarté de la chancellerie, convainc le président <strong>Hindenburg</strong> de nommer Hitler chancelier dans un cabinet où les nazis ne détiennent que trois portefeuilles sur onze, persuadé de pouvoir l’« encadrer ». Le <strong>30 janvier 1933</strong>, Hitler est nommé selon des formes parfaitement constitutionnelles.</p>
<p>Les historiens ont beaucoup débattu de la part des structures et des hommes. La thèse d’une « voie particulière » allemande vers la modernité, le <em>Sonderweg</em>, a été contestée dans les années 1980 ; mais un constat demeure : l’arrivée d’Hitler au pouvoir ne résulte ni d’une victoire électorale majoritaire, ni d’un coup de force, mais d’un <strong>calcul d’élites conservatrices</strong> convaincues de se servir de lui.</p>
<p><strong>Fil rouge.</strong> Reste à comprendre comment, en dix-huit mois, un chancelier minoritaire détruit toutes les contre-forces du pays : partis, syndicats, États régionaux, justice, et jusqu’à ses propres troupes.</p>
`,

<h3>1. L’incendie du Reichstag et la fin des libertés</h3>
<p>Dans la nuit du <strong>27 février 1933</strong>, le Reichstag brûle. Un militant communiste néerlandais, <strong>Marinus van der Lubbe</strong>, est arrêté sur place ; la thèse aujourd’hui majoritaire chez les historiens est celle d’un incendiaire isolé, le régime ayant exploité l’occasion plutôt que de l’avoir créée. Le lendemain, le <strong>décret « pour la protection du peuple et de l’État »</strong> suspend les libertés fondamentales garanties par la Constitution : liberté de la presse, de réunion, secret de la correspondance, inviolabilité du domicile, et surtout garanties contre l’arrestation arbitraire.</p>
<p>Ce décret ne sera <strong>jamais abrogé</strong> : le Troisième Reich vivra douze ans sous un état d’exception permanent. Dans les semaines suivantes, des milliers de communistes et de socialistes sont arrêtés. Les élections du 5 mars 1933, tenues dans ces conditions, ne donnent pourtant au NSDAP que 43,9 % des voix.</p>

<h3>2. La loi des pleins pouvoirs</h3>
<p>Le <strong>23 mars 1933</strong>, la loi dite <strong>« de plein pouvoir »</strong> autorise le gouvernement à légiférer sans le Parlement, y compris contre la Constitution. Elle exige une majorité des deux tiers : le NSDAP l’obtient en faisant arrêter les députés communistes, en encadrant la salle de SA en armes et en promettant au <strong>Zentrum</strong> catholique des garanties pour les écoles confessionnelles et un futur concordat. Seuls les 94 députés <strong>sociaux-démocrates</strong> votent contre, leur chef Otto Wels prononçant un discours d’opposition dans une salle hostile.</p>
<p>Le mécanisme est essentiel à comprendre : le Parlement s’est lui-même dessaisi, par un vote régulier. La dictature s’installe avec des textes, des procès-verbaux et des majorités.</p>

<h3>3. La mise au pas (Gleichschaltung)</h3>
<p>Suit une opération méthodique de <strong>mise au pas</strong> de la société, en quelques mois :</p>
<ul>
<li>les <strong>Länder</strong> perdent leur autonomie au profit de gouverneurs du Reich (mars-avril 1933) ;</li>
<li>les <strong>syndicats</strong> sont dissous le 2 mai 1933, leurs biens transférés au <strong>Front du travail</strong> ;</li>
<li>les <strong>partis</strong> sont interdits ou se sabordent ; la loi du 14 juillet 1933 fait du NSDAP le parti unique ;</li>
<li>associations, fédérations sportives, ordres professionnels sont absorbés ou alignés ;</li>
<li>un <strong>concordat</strong> est signé avec le Vatican le 20 juillet 1933, qui garantit le culte en échange du retrait des catholiques de la vie politique.</li>
</ul>
<p>La rapidité s’explique autant par la contrainte que par l’<strong>alignement volontaire</strong> : d’innombrables institutions se « mettent au pas » d’elles-mêmes, par opportunisme, conformisme ou adhésion. C’est ce que Kershaw analysera comme le fait de <strong>« travailler en direction du Führer »</strong> : anticiper la volonté supposée du chef sans attendre d’ordre.</p>

<p>La justice et l’administration sont atteintes par les mêmes textes. La loi du 7 avril 1933 sur la fonction publique sert à écarter non seulement les « non-aryens » mais aussi les fonctionnaires jugés politiquement douteux ; les magistrats prêtent serment, une <strong>Cour du peuple</strong> est créée en 1934 pour les affaires de trahison, et des tribunaux d’exception jugent sans appel. Le régime organise par ailleurs des <strong>plébiscites</strong> — sur la sortie de la SDN en novembre 1933, sur le cumul des fonctions en août 1934 — dont les résultats écrasants, obtenus sans campagne contradictoire, servent d’attestation démocratique à l’usage de l’étranger.</p>

<h3>4. La Nuit des longs couteaux et la fusion des pouvoirs</h3>
<p>Reste un problème interne. La <strong>SA</strong> d’<strong>Ernst Röhm</strong>, forte de plusieurs millions d’hommes, réclame une « seconde révolution » et son intégration à l’armée, ce que la <strong>Reichswehr</strong> et les milieux conservateurs refusent. Les <strong>30 juin et 1<sup>er</sup> juillet 1934</strong>, Hitler fait assassiner Röhm et les principaux chefs SA, ainsi que des adversaires sans rapport avec eux — dont l’ancien chancelier Kurt von Schleicher. Une loi du 3 juillet déclare rétroactivement ces meurtres <strong>« légitime défense de l’État »</strong>.</p>
<p>Les conséquences sont décisives : la SA est neutralisée au profit de la <strong>SS</strong> de Himmler, l’armée est rassurée, et le pouvoir s’affranchit de la légalité pénale. À la mort de <strong>Hindenburg</strong>, le 2 août 1934, Hitler cumule chancellerie et présidence sous le titre de <strong>Führer</strong> ; les soldats prêtent serment non plus à la Constitution, mais à sa personne.</p>
<p><strong>Fil rouge.</strong> Restait à bâtir l’instrument de cette souveraineté sans loi : une police politique affranchie des juges, et un système de camps.</p>

    contenu: `
<h3>1. Une police détachée du droit</h3>
<p>L’outil central du régime est la <strong>« détention de protection »</strong> (<em>Schutzhaft</em>), fondée sur le décret du 28 février 1933 : la police peut interner sans inculpation, sans durée fixée et sans recours. Le juge est simplement contourné. Un détenu acquitté par un tribunal peut être repris à la sortie du prétoire par la police politique.</p>
<p>Cette police est d’abord dispersée. La <strong>Gestapo</strong>, créée par Göring en Prusse en avril 1933, passe sous le contrôle de <strong>Heinrich Himmler</strong>, qui unifie progressivement toutes les polices allemandes et devient en <strong>1936 chef de la police allemande</strong>, tout en dirigeant la <strong>SS</strong>. La fusion de la SS, organisation de parti, et de la police d’État donne naissance à un appareil hybride, doté en 1939 d’un état-major commun, le <strong>RSHA</strong>, dirigé par <strong>Reinhard Heydrich</strong>.</p>

<h3>2. Le camp comme institution</h3>
<p>Le premier camp permanent ouvre à <strong>Dachau</strong> en mars 1933. Sous l’autorité de <strong>Theodor Eicke</strong>, il devient le modèle du système : règlement standardisé, hiérarchie de détenus, terreur méthodique, garde assurée par des unités SS spécialisées, les « Têtes de mort ».</p>
<p>La population des camps évolue par vagues. En 1933, elle est massivement <strong>politique</strong> — on estime que plus de 100 000 opposants sont internés dans l’année. Le nombre chute ensuite : vers 1937, il ne reste que quelques milliers de détenus, les organisations de gauche ayant été détruites. Mais la logique change : à partir de 1936-1938, les camps s’emplissent d’<strong>« asociaux »</strong>, de « criminels d’habitude », de Tziganes, d’homosexuels, de Témoins de Jéhovah — c’est-à-dire de catégories désignées par leur <strong>nature supposée</strong> et non par leurs actes. De nouveaux camps ouvrent : Sachsenhausen, Buchenwald, Mauthausen, Ravensbrück pour les femmes.</p>

<p>La SS elle-même cesse d’être un simple service d’ordre : de quelques centaines d’hommes en 1929, elle passe à plusieurs dizaines de milliers et se dote de ses propres bureaux raciaux, de ses entreprises économiques et, dès 1935, d’un office de « sélection » chargé d’encourager la naissance d’enfants jugés conformes. Elle constitue progressivement un <strong>État dans l’État</strong>, avec sa police, ses camps, ses troupes et sa doctrine.</p>

<h3>3. De quoi vit la surveillance</h3>
<p>Contrairement à l’image d’une société quadrillée par des agents omniprésents, la Gestapo est <strong>numériquement faible</strong> : quelques dizaines de fonctionnaires suffisent à couvrir des régions entières de centaines de milliers d’habitants. Les travaux de <strong>Robert Gellately</strong> sur les archives de police ont établi que la majorité des affaires naissent de <strong>dénonciations spontanées</strong> émanant de simples particuliers — voisins, collègues, parfois membres de la même famille —, souvent motivées par des conflits privés sans rapport avec la politique.</p>
<p>La conclusion est dérangeante et centrale : la terreur nazie n’a pas fonctionné contre la société, mais <strong>avec une partie de la société</strong>. Elle frappait des minorités clairement désignées, ce qui laissait à la majorité le sentiment de n’avoir rien à craindre tant qu’elle se tenait tranquille.</p>

<p>Dès mars 1933, <strong>Joseph Goebbels</strong> dirige un <strong>ministère de l’Éducation du peuple et de la Propagande</strong> qui contrôle presse, radio, cinéma, théâtre, édition et arts plastiques. La <strong>Chambre de culture du Reich</strong> (septembre 1933) impose l’adhésion à tout professionnel de la culture : qui en est exclu ne peut plus exercer. Le <strong>10 mai 1933</strong>, des étudiants brûlent publiquement des livres à Berlin et dans une vingtaine de villes.</p>

<h3>1. Un antisémitisme racial, non religieux</h3>
<p>L’antisémitisme nazi se distingue de l’hostilité chrétienne traditionnelle envers les Juifs : il ne vise pas une croyance que l’on pourrait abandonner, mais un <strong>caractère biologique</strong> réputé indélébile. Nourri du darwinisme social et des théories raciales du XIX<sup>e</sup> siècle, il fait du Juif l’ennemi intérieur par nature. <strong>Johann Chapoutot</strong> a montré comment cette vision s’appuie sur une « loi du sang » présentée comme scientifique : préserver la race devient un devoir moral, et la conversion ne change rien à la « race ».</p>

<h3>2. Exclure par la loi (1933-1937)</h3>
<p>Les mesures commencent dès le printemps 1933. Le <strong>1<sup>er</sup> avril 1933</strong>, un <strong>boycott</strong> des commerces juifs est organisé par le parti ; il est mal accueilli par une partie de la population et vite arrêté, ce qui enseigne au régime à préférer la voie administrative. Le <strong>7 avril 1933</strong>, la loi sur la « restauration du corps des fonctionnaires » exclut les « non-aryens » de la fonction publique. Suivent la limitation du nombre d’élèves et d’étudiants juifs, l’éviction des professions libérales, de la presse et de la culture.</p>
<p>Le <strong>15 septembre 1935</strong>, les <strong>lois de Nuremberg</strong> franchissent un seuil : la loi sur la citoyenneté du Reich distingue le « citoyen du Reich », de sang allemand, du simple « ressortissant » ; la loi « pour la protection du sang et de l’honneur allemands » interdit mariages et relations entre Juifs et « Aryens ». Un décret de novembre 1935 définit administrativement qui est juif, par le nombre de grands-parents de religion juive — preuve que la « race » devait être établie par des registres paroissiaux, faute de tout critère biologique.</p>
<p>L’année <strong>1936</strong> connaît une pause tactique : l’Allemagne accueille les <strong>Jeux olympiques</strong> et fait disparaître provisoirement les pancartes antisémites. Le régime sait parfaitement ce qu’il montre et ce qu’il cache.</p>

<h3>3. 1938 : l’accélération et la Nuit de Cristal</h3>
<p>L’année 1938 change de rythme. L’<strong>Anschluss</strong> de mars s’accompagne à Vienne de violences antisémites publiques et de la mise en place d’un bureau d’émigration forcée confié à <strong>Adolf Eichmann</strong>, qui devient un modèle. En Allemagne, l’<strong>« aryanisation »</strong> des entreprises s’accélère : les biens juifs sont vendus à vil prix.</p>

<p>Comment relier ces étapes à l’extermination engagée à partir de 1941 ? Les <strong>intentionnalistes</strong> (Lucy Dawidowicz, Eberhard Jäckel) soulignent la cohérence idéologique d’un projet énoncé très tôt. Les <strong>fonctionnalistes</strong> (Martin Broszat, Hans Mommsen) insistent sur l’absence de plan écrit, sur l’improvisation et sur la dynamique d’un appareil polycratique. La position dominante aujourd’hui, formulée notamment par <strong>Ian Kershaw</strong> et <strong>Christopher Browning</strong>, combine les deux : une <strong>intention idéologique constante</strong>, mais sans calendrier, réalisée par une radicalisation progressive où le contexte de guerre à l’Est joue un rôle décisif.</p>

/* =====================================================================
   4. LOGIQUE DE L'APPLICATION
   ---------------------------------------------------------------------
   Sommaire :
     4.1  Reglages et etat persistant (localStorage + export/import)
     4.2  Fonctions de progression (seance disponible, cours en cours...)
     4.3  Utilitaires d'affichage
     4.4  Onglet Accueil
     4.5  Onglet Cours (catalogue, fiche, lecture)
     4.6  Moteur de QCM (construction, validation, correction)
     4.7  Onglet Quiz (QCM de seance et quiz compose)
     4.8  Navigation et evenements
   ===================================================================== */

/* ---------- 4.1  Reglages et etat persistant ---------- */

/* Valeur par defaut du rythme : la seance suivante ne se debloque que le
   lendemain. Modifiable dans les reglages de l'onglet Accueil. */
const UNE_SEANCE_PAR_JOUR = true;

/* Nombre de seances par cours, et donc duree d'une << semaine Clio >> :
   une semaine se compte en seances, pas en jours de calendrier. */
const SEANCES_PAR_COURS = 6;

const CLE_STOCKAGE = "clio.progression.v1";

/* Etat vierge. Toute lecture de l'etat passe par cet objet de reference,
   ce qui evite les undefined lors d'une montee de version. */
function etatVierge(){
  return {
    v: 1,
    reglages: { uneSeanceParJour: UNE_SEANCE_PAR_JOUR },
    cours: {},          // { idCours: { seances:{ "1":{...} }, termine:"AAAA-MM-JJ"|null } }
    historique: [],     // [{ d, type, coursId, seance, justes, total }]
    questions: {},      // { "idCours#seance#index": { r:ratees, j:reussies } }
    dernier: null       // { coursId, seance } : derniere seance ouverte
  };
}

let ETAT = chargerEtat();

function chargerEtat(){
  const base = etatVierge();
  try{
    const brut = localStorage.getItem(CLE_STOCKAGE);
    if(!brut) return base;
    const lu = JSON.parse(brut);
    if(!lu || typeof lu !== "object") return base;
    return fusionnerEtat(base, lu);
  }catch(e){
    // localStorage indisponible (navigation privee, fichier local bride...)
    console.warn("Clio : progression illisible, on repart d'un etat vierge.", e);
    return base;
  }
}

function fusionnerEtat(base, lu){
  const e = base;
  if(lu.reglages && typeof lu.reglages === "object"){
    e.reglages.uneSeanceParJour = lu.reglages.uneSeanceParJour !== false;
  }
  if(lu.cours && typeof lu.cours === "object") e.cours = lu.cours;
  if(Array.isArray(lu.historique)) e.historique = lu.historique;
  if(lu.questions && typeof lu.questions === "object") e.questions = lu.questions;
  if(lu.dernier && typeof lu.dernier === "object") e.dernier = lu.dernier;
  return e;
}

function sauverEtat(){
  try{
    localStorage.setItem(CLE_STOCKAGE, JSON.stringify(ETAT));
    return true;
  }catch(e){
    console.warn("Clio : sauvegarde impossible.", e);
    return false;
  }
}

/* ---------- 4.2  Progression ---------- */

function aujourdhui(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}

function coursParId(id){ return COURS.find(c => c.id === id) || null; }

function fiche(coursId){
  if(!ETAT.cours[coursId]) ETAT.cours[coursId] = { seances:{}, termine:null };
  return ETAT.cours[coursId];
}

function estFaite(coursId, numero){
  const f = ETAT.cours[coursId];
  return !!(f && f.seances && f.seances[numero]);
}

function nbFaites(coursId){
  const f = ETAT.cours[coursId];
  if(!f || !f.seances) return 0;
  return Object.keys(f.seances).length;
}

/* Premiere seance non faite d'un cours ; null si le cours est termine. */
function prochaineSeance(coursId){
  const c = coursParId(coursId);
  if(!c) return null;
  for(const s of c.seances){ if(!estFaite(coursId, s.numero)) return s.numero; }
  return null;
}

function coursTermine(coursId){ return prochaineSeance(coursId) === null; }
function coursCommence(coursId){ return nbFaites(coursId) > 0; }

/* Date de la derniere seance validee, tous cours confondus. */
function dateDerniereSeance(){
  let max = null;
  for(const id in ETAT.cours){
    const f = ETAT.cours[id];
    if(!f || !f.seances) continue;
    for(const n in f.seances){
      const d = f.seances[n].date;
      if(d && (!max || d > max)) max = d;
    }
  }
  return max;
}

/* Verrou de rythme : vrai si une seance a deja ete validee aujourd'hui
   et que le reglage << une seance par jour >> est actif. */
function verrouDuJour(){
  if(!ETAT.reglages.uneSeanceParJour) return false;
  return dateDerniereSeance() === aujourdhui();
}

/* Cours actuellement suivi : le dernier ouvert s'il n'est pas termine,
   sinon le premier cours commence et non termine, sinon le premier
   cours jamais commence. */
function coursEnCours(){
  if(ETAT.dernier && ETAT.dernier.coursId){
    const c = coursParId(ETAT.dernier.coursId);
    if(c && !coursTermine(c.id)) return c;
  }
  const entame = COURS.find(c => coursCommence(c.id) && !coursTermine(c.id));
  if(entame) return entame;
  const neuf = COURS.find(c => !coursCommence(c.id));
  return neuf || null;
}

/* Suggestion apres un cours termine : meme periode d'abord, puis
   n'importe quel cours non commence. */
function coursSuggere(apresId){
  const ref = coursParId(apresId);
  const libres = COURS.filter(c => c.id !== apresId && !coursCommence(c.id));
  if(ref){
    const memePeriode = libres.find(c => c.periode === ref.periode);
    if(memePeriode) return memePeriode;
  }
  return libres[0] || null;
}

/* Etat d'une seance : "faite" | "disponible" | "demain" | "verrouillee" */
function etatSeance(coursId, numero){
  if(estFaite(coursId, numero)) return "faite";
  const p = prochaineSeance(coursId);
  if(p !== numero) return "verrouillee";
  return verrouDuJour() ? "demain" : "disponible";
}

/* Score moyen, en pourcentage, sur tous les QCM enregistres. */
function scoreMoyen(){
  const h = ETAT.historique;
  if(!h.length) return null;
  let j = 0, t = 0;
  h.forEach(x => { j += x.justes; t += x.total; });
  return t ? Math.round(100*j/t) : null;
}

function cleQuestion(coursId, seance, index){ return coursId + "#" + seance + "#" + index; }

/* ---------- 4.3  Utilitaires d'affichage ---------- */

function esc(s){
  return String(s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]
  ));
}

function filet(texte){
  return texte ? `<div class="filet"><span>${esc(texte)}</span></div>`
               : `<div class="filet"><span class="losange">&#9670;</span></div>`;
}

function jauge(fait, total){
  const pc = total ? Math.round(100*fait/total) : 0;
  return `<div class="jauge"><div style="width:${pc}%"></div></div>`;
}

function dateLisible(iso){
  if(!iso) return "";
  const [a,m,j] = iso.split("-");
  return j + "/" + m + "/" + a;
}

function melanger(tab){
  const t = tab.slice();
  for(let i=t.length-1;i>0;i--){
    const k = Math.floor(Math.random()*(i+1));
    [t[i],t[k]] = [t[k],t[i]];
  }
  return t;
}

/* ---------- 4.4  Onglet Accueil ---------- */

function rendreAccueil(){
  const c = coursEnCours();
  const parts = [];

  /* -- Seance du jour -- */
  parts.push(`<div class="filet"><span>Séance du jour</span></div>`);
  if(!c){
    parts.push(`<div class="carte"><h2>Tout est terminé</h2>
      <p class="secondaire">Vous avez achevé tous les cours disponibles. Les quiz composés restent
      accessibles pour réviser, et de nouveaux cours pourront être ajoutés dans la constante
      <strong>COURS</strong>.</p></div>`);
  }else{
    const n = prochaineSeance(c.id);
    const s = c.seances.find(x => x.numero === n);
    const etat = etatSeance(c.id, n);
    parts.push(`<div class="carte">
      <p class="minuscule">${esc(c.periode)} &#8226; ${esc(c.dates)}</p>
      <h2>${esc(c.titre)}</h2>
      <p class="secondaire" style="margin-bottom:10px">Séance ${n} sur ${SEANCES_PAR_COURS} &#8212; ${esc(s.titre)}</p>
      ${jauge(nbFaites(c.id), SEANCES_PAR_COURS)}
      <p class="minuscule" style="margin-bottom:14px">${nbFaites(c.id)} séance(s) validée(s) &#8212; environ 10 minutes par séance</p>
      ${ etat === "demain"
        ? `<div class="avis">Vous avez déjà travaillé aujourd’hui. La séance suivante se débloque demain.
             Ce rythme se règle plus bas, dans <strong>Réglages</strong>.</div>
           <button class="bouton" disabled>Reprendre</button>`
        : `<button class="bouton-plein" data-action="reprendre" data-cours="${esc(c.id)}" data-seance="${n}">Reprendre</button>`}
    </div>`);
  }

  /* -- Progression -- */
  const termines = COURS.filter(x => coursTermine(x.id));
  const moy = scoreMoyen();
  parts.push(filet("Progression"));
  parts.push(`<div class="carte">
    <div class="stats">
      <div class="stat"><div class="v">${c ? nbFaites(c.id) + "/" + SEANCES_PAR_COURS : "&#8212;"}</div><div class="l">Cours en cours</div></div>
      <div class="stat"><div class="v">${termines.length}</div><div class="l">Cours terminés</div></div>
      <div class="stat"><div class="v">${moy === null ? "&#8212;" : moy + "%"}</div><div class="l">Score moyen</div></div>
    </div>
    <p class="minuscule" style="margin:12px 0 0">
      ${ETAT.historique.length} QCM enregistré(s).
      ${moy === null ? "Le score moyen apparaîtra après votre premier QCM." : ""}
    </p>
  </div>`);

  /* -- Rythme -- */
  const faitesCoursCourant = c ? nbFaites(c.id) : 0;
  parts.push(`<div class="carte">
    <h3>Rythme</h3>
    <p class="secondaire" style="margin-bottom:8px">
      Une semaine Clio se compte en séances, non en jours : <strong>${faitesCoursCourant} séance(s) sur ${SEANCES_PAR_COURS}</strong>
      pour la semaine en cours. Un jour oublié ne se rattrape pas, on reprend simplement à la séance suivante.
    </p>
    ${jauge(faitesCoursCourant, SEANCES_PAR_COURS)}

/* ---------- 4.6  Moteur de QCM ---------- */

/* QUIZ courant :
   { type, coursId, seance, items:[...], reponses:{i:[indices]}, corrige:bool, resultat:{} }
   Chaque item : { coursId, seance, index, q, ordre }  (ordre = ordre
   d'affichage melange des 4 propositions, pour eviter la memorisation
   d'une position). */
let QUIZ = null;

function faireItem(coursId, seance, index, q){
  return { coursId, seance, index, q, ordre: melanger([0,1,2,3]) };
}

/* QCM de seance : les 5 questions de la seance + les 5 de la precedente. */
function construireQuizSeance(coursId, numero){
  const c = coursParId(coursId);
  const items = [];
  const s = c.seances.find(x => x.numero === numero);
  s.questions.forEach((q,i) => items.push(faireItem(coursId, numero, i, q)));
  if(numero > 1){
    const p = c.seances.find(x => x.numero === numero-1);
    if(p) p.questions.forEach((q,i) => items.push(faireItem(coursId, numero-1, i, q)));
  }
  return { type:"seance", coursId, seance:numero, items, reponses:{}, corrige:false, resultat:null };
}

/* Quiz compose : tirage parmi les questions des cours coches.
   Les questions deja ratees sont remontees en priorite. */
function construireQuizCompose(ids, nombre, toutInclure){
  let pool = [];
  ids.forEach(id => {
    const c = coursParId(id);
    if(!c) return;
    c.seances.forEach(s => {
      if(!toutInclure && !estFaite(id, s.numero)) return;
      s.questions.forEach((q,i) => pool.push(faireItem(id, s.numero, i, q)));
    });
  });
  if(!pool.length) return null;

  /* Priorite = (nombre d'echecs) - (nombre de reussites) sur la question.
     Tri decroissant, avec un aleatoire pour departager les ex aequo. */
  pool = pool.map(it => {
    const st = ETAT.questions[cleQuestion(it.coursId, it.seance, it.index)] || {r:0,j:0};
    return { it, p: (st.r||0) - (st.j||0), h: Math.random() };
  }).sort((a,b) => (b.p - a.p) || (a.h - b.h)).map(x => x.it);

  const n = (nombre === "toutes") ? pool.length : Math.min(Number(nombre), pool.length);
  const choisies = melanger(pool.slice(0, n));
  return { type:"compose", coursId:null, seance:null, items:choisies, reponses:{}, corrige:false, resultat:null };
}

function rendreQuizEnCours(){
  const q = QUIZ;
  const parts = [];
  const titreQuiz = q.type === "seance"
    ? esc(coursParId(q.coursId).titre) + " &#8212; séance " + q.seance
    : "Quiz composé";

  parts.push(`<div class="fil"><button class="bouton petit discret" data-action="quiz-abandonner">&#8592; Quitter</button></div>`);
  parts.push(`<div class="carte">
    <p class="minuscule">${q.items.length} questions</p>
    <h2>${titreQuiz}</h2>
    <p class="secondaire" style="margin:0">Chaque question peut appeler une ou plusieurs bonnes réponses.
    Toutes les questions doivent recevoir au moins une coche.</p>
  </div>`);

  q.items.forEach((it,i) => {
    const revision = (q.type === "seance" && it.seance !== q.seance);
    const coches = q.reponses[i] || [];
    parts.push(`<div class="question" id="q-${i}">
      <p class="enonce">${i+1}. ${esc(it.q.enonce)}</p>
      <p class="consigne">${revision ? "Révision &#8212; séance " + it.seance + " &#8226; " : ""}plusieurs réponses possibles</p>
      ${it.ordre.map(oi => `<label class="option">
          <input type="checkbox" data-question="${i}" data-option="${oi}" ${coches.indexOf(oi) >= 0 ? "checked" : ""}>
          <span>${esc(it.q.options[oi])}</span>
        </label>`).join("")}
      <p class="erreur" id="err-${i}" style="display:none">Cochez au moins une proposition pour cette question.</p>
    </div>`);
  });

  parts.push(`<div class="saut"></div>`);
  parts.push(`<button class="bouton-plein" data-action="quiz-valider">Valider</button>`);
  parts.push(`<div id="avis-validation"></div>`);
  document.getElementById("vue-quiz").innerHTML = parts.join("");
}

/* Validation : refus si une question est sans reponse. */
function validerQuiz(){
  const q = QUIZ;
  let premierManque = -1;
  q.items.forEach((it,i) => {
    const coches = q.reponses[i] || [];
    const err = document.getElementById("err-"+i);
    const bloc = document.getElementById("q-"+i);
    if(!coches.length){
      if(premierManque < 0) premierManque = i;
      if(err) err.style.display = "block";
      if(bloc) bloc.classList.add("en-erreur");
    }else{
      if(err) err.style.display = "none";
      if(bloc) bloc.classList.remove("en-erreur");
    }
  });

  if(premierManque >= 0){
    const avis = document.getElementById("avis-validation");
    if(avis) avis.innerHTML = `<div class="avis">Quiz incomplet : ${
      q.items.filter((it,i) => !(q.reponses[i]||[]).length).length
    } question(s) sans réponse.</div>`;
    const cible = document.getElementById("q-"+premierManque);
    if(cible) cible.scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }

  /* Correction : une question n'est juste que si l'ensemble coche est
     exactement l'ensemble correct. */
  const details = q.items.map((it,i) => {
    const coches = (q.reponses[i]||[]).slice().sort((a,b)=>a-b);
    const bonnes = it.q.correctes.slice().sort((a,b)=>a-b);
    const juste = coches.length === bonnes.length && coches.every((v,k) => v === bonnes[k]);
    return { it, i, coches, bonnes, juste };
  });

  const justes = details.filter(d => d.juste).length;
  q.corrige = true;
  q.resultat = { justes, total: details.length, details };

  enregistrerResultat(q);
  rendreCorrection();
}

function enregistrerResultat(q){
  const jour = aujourdhui();

  /* Statistiques par question, pour remonter les ratees dans les quiz composes. */
  q.resultat.details.forEach(d => {
    const cle = cleQuestion(d.it.coursId, d.it.seance, d.it.index);
    const st = ETAT.questions[cle] || {r:0,j:0};
    if(d.juste) st.j = (st.j||0)+1; else st.r = (st.r||0)+1;
    ETAT.questions[cle] = st;
  });

  if(q.type === "seance"){
    /* Note de la seance : uniquement ses propres questions, hors revision. */
    const propres = q.resultat.details.filter(d => d.it.seance === q.seance);
    const j = propres.filter(d => d.juste).length;
    const f = fiche(q.coursId);
    const ancienne = f.seances[q.seance];
    f.seances[q.seance] = {
      date: jour,
      justes: j,
      total: propres.length,
      tentatives: (ancienne && ancienne.tentatives ? ancienne.tentatives : 0) + 1,
      meilleur: Math.max(j, ancienne && ancienne.meilleur ? ancienne.meilleur : 0)
    };
    if(coursTermine(q.coursId) && !f.termine) f.termine = jour;
    ETAT.dernier = { coursId:q.coursId, seance:q.seance };
  }

  ETAT.historique.push({
    d: jour, type: q.type, coursId: q.coursId, seance: q.seance,
    justes: q.resultat.justes, total: q.resultat.total
  });
  if(ETAT.historique.length > 300) ETAT.historique = ETAT.historique.slice(-300);
  sauverEtat();
}

function listeReponses(it, indices, classe){
  if(!indices.length) return `<span class="rep ${classe}">aucune</span>`;
  return indices.map(k => `<span class="rep ${classe}">${esc(it.q.options[k])}</span>`).join("");
}

function blocCorrection(d){
  return `<div class="corr">
    <p class="enonce">${d.i+1}. ${esc(d.it.q.enonce)}</p>
    ${d.juste ? "" : `<p class="ligne-rep"><b>Vous avez coché</b>${listeReponses(d.it, d.coches, "faux")}</p>`}
    <p class="ligne-rep"><b>${d.juste ? "Réponse" : "Bonne réponse"}</b>${listeReponses(d.it, d.bonnes, "juste")}</p>
    <p class="expl">${esc(d.it.q.explication)}</p>
  </div>`;
}

function rendreCorrection(){
  const q = QUIZ, r = q.resultat;
  const pc = r.total ? Math.round(100*r.justes/r.total) : 0;
  const faux = r.details.filter(d => !d.juste);
  const bons = r.details.filter(d => d.juste);
  const parts = [];

  parts.push(`<div class="score">
    <div class="chiffre">${r.justes} / ${r.total}</div>
    <p class="minuscule" style="margin:6px 0 0">${pc} % de réponses exactes</p>
    <p class="secondaire" style="margin:8px 0 0">${
      faux.length ? faux.length + " question(s) à revoir ci-dessous." : "Aucune erreur : tout est juste."
    }</p>
  </div>`);

  if(q.type === "seance"){
    const propres = r.details.filter(d => d.it.seance === q.seance);
    const jp = propres.filter(d => d.juste).length;
    parts.push(`<p class="minuscule" style="text-align:center;margin:-8px 0 16px">
      Séance ${q.seance} : ${jp}/${propres.length}${
        r.details.length > propres.length
          ? " &#8226; révision séance " + (q.seance-1) + " : " + (r.justes-jp) + "/" + (r.details.length-propres.length)
          : ""}
    </p>`);
  }

  if(faux.length){
    parts.push(filet("Ce qu’il faut reprendre"));
    parts.push(faux.map(blocCorrection).join(""));
  }
  if(bons.length){
    parts.push(`<details class="justes"><summary>Voir les ${bons.length} question(s) juste(s)</summary>
      ${bons.map(blocCorrection).join("")}</details>`);
  }

  parts.push(`<div class="rang-boutons" style="margin-top:16px">
    <button class="bouton-plein" data-action="quiz-terminer">Terminer</button>
    <button class="bouton" data-action="quiz-menu">Nouveau quiz composé</button>
  </div>`);

  document.getElementById("vue-quiz").innerHTML = parts.join("");
  window.scrollTo(0,0);
}

    </select>

    <label class="coche" style="margin-top:10px">
      <input type="checkbox" id="compose-tout" ${COMPOSE.tout ? "checked" : ""}>
      <span>Inclure tout<br><span class="minuscule">Par défaut, seules les séances déjà faites sont tirées.</span></span>
    </label>

    <div class="saut"></div>
    <button class="bouton-plein" data-action="quiz-composer">Lancer le quiz</button>
    <div id="avis-compose"></div>
  </div>`);

  /* Historique. */
  if(ETAT.historique.length){
    parts.push(filet("Historique"));
    const h = ETAT.historique.slice(-12).reverse();
    parts.push(`<div class="carte"><ul class="liste">` + h.map(x => {
      const co = coursParId(x.coursId);
      const nom = x.type === "compose" ? "Quiz composé" : (co ? esc(co.titre) + " &#8212; séance " + x.seance : "Séance");
      const pc = x.total ? Math.round(100*x.justes/x.total) : 0;
      return `<li class="ligne" style="cursor:default">
        <span class="num"><span>${pc}</span></span>
        <span class="corps"><span class="t">${nom}</span>
        <span class="minuscule">${x.justes}/${x.total} &#8226; ${dateLisible(x.d)}</span></span></li>`;
    }).join("") + `</ul></div>`);
  }

  document.getElementById("vue-quiz").innerHTML = parts.join("");
}

/* ---------- 4.8  Navigation et evenements ---------- */

let ONGLET = "accueil";

function rendre(){
  document.body.dataset.onglet = ONGLET;   /* pilote l'en-tete compact */
  if(ONGLET === "accueil") rendreAccueil();
  else if(ONGLET === "cours") rendreCours();
  else rendreQuiz();
  document.querySelectorAll(".onglets button").forEach(b => {
    if(b.dataset.onglet === ONGLET) b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
  });
  document.querySelectorAll(".vue").forEach(v => v.classList.remove("active"));
  document.getElementById("vue-" + ONGLET).classList.add("active");
}

function aller(onglet, haut){
  ONGLET = onglet;
  rendre();
  if(haut !== false) window.scrollTo(0,0);
}

/* Ouvre la lecture d'une seance depuis n'importe quel onglet. */
function ouvrirSeance(coursId, numero){
  ECRAN = { nom:"lecture", coursId, seance:Number(numero) };
  aller("cours");
}

document.addEventListener("click", function(ev){
  const el = ev.target.closest("[data-action]");
  if(!el) return;
  const a = el.dataset.action;

  /* -- Navigation dans les cours -- */
  if(a === "catalogue"){ ECRAN = {nom:"catalogue"}; aller("cours"); }
  else if(a === "filtre"){ FILTRE = el.dataset.periode; rendreCours(); }
  else if(a === "fiche"){ ECRAN = {nom:"fiche", coursId:el.dataset.cours}; aller("cours"); }
  else if(a === "lire" || a === "reprendre"){ ouvrirSeance(el.dataset.cours, el.dataset.seance); }

  /* -- Quiz -- */
  else if(a === "quiz-seance"){
    QUIZ = construireQuizSeance(el.dataset.cours, Number(el.dataset.seance));
    aller("quiz");
  }
  else if(a === "quiz-seance-choisie"){
    const v = document.getElementById("sel-seance").value.split("|");
    QUIZ = construireQuizSeance(v[0], Number(v[1]));
    aller("quiz");
  }
  else if(a === "quiz-composer"){
    const nombre = document.getElementById("sel-nombre").value;
    const tout = document.getElementById("compose-tout").checked;
    COMPOSE.nombre = nombre; COMPOSE.tout = tout;
    if(!COMPOSE.coches.length){
      document.getElementById("avis-compose").innerHTML =
        `<div class="avis">Cochez au moins un cours.</div>`;
      return;
    }
    const q = construireQuizCompose(COMPOSE.coches, nombre, tout);
    if(!q){
      document.getElementById("avis-compose").innerHTML =
        `<div class="avis">Aucune question disponible : ces cours n’ont pas encore de séance faite.
         Cochez « Inclure tout » pour tirer parmi toutes les séances.</div>`;
      return;
    }
    QUIZ = q; aller("quiz");
  }
  else if(a === "quiz-valider"){ validerQuiz(); }
  else if(a === "quiz-abandonner"){
    if(QUIZ && !QUIZ.corrige && !confirm("Quitter ce quiz ? Les réponses seront perdues.")) return;
    QUIZ = null; aller("quiz");
  }
  else if(a === "quiz-terminer"){ QUIZ = null; aller("accueil"); }
  else if(a === "quiz-menu"){ QUIZ = null; aller("quiz"); }

  /* -- Reglages -- */
  else if(a === "bascule-rythme"){
    ETAT.reglages.uneSeanceParJour = !ETAT.reglages.uneSeanceParJour;
    sauverEtat(); rendreAccueil();
  }
  else if(a === "exporter"){ exporterFichier(); }
  else if(a === "afficher-json"){ afficherJson(); }
  else if(a === "importer-fichier"){ document.getElementById("champ-fichier").click(); }
  else if(a === "importer-texte"){ zoneImportTexte(); }
  else if(a === "valider-import-texte"){
    const t = document.getElementById("json-import");
    appliquerImport(t ? t.value : "");
  }
  else if(a === "effacer"){
    if(confirm("Effacer toute la progression ? Cette action est définitive.") &&
       confirm("Confirmez une seconde fois : toutes les séances et tous les scores seront perdus.")){
      ETAT = etatVierge(); sauverEtat(); aller("accueil");
    }
  }
});

/* Cases a cocher : QCM et quiz compose. */
document.addEventListener("change", function(ev){
  const t = ev.target;
  if(t.dataset && t.dataset.question !== undefined && QUIZ){
    const i = Number(t.dataset.question), o = Number(t.dataset.option);
    const l = QUIZ.reponses[i] || [];
    const k = l.indexOf(o);
    if(t.checked && k < 0) l.push(o);
    if(!t.checked && k >= 0) l.splice(k,1);
    QUIZ.reponses[i] = l;
    /* Efface le message d'erreur des qu'une case est cochee. */
    if(l.length){
      const err = document.getElementById("err-"+i);
      const bloc = document.getElementById("q-"+i);
      if(err) err.style.display = "none";
      if(bloc) bloc.classList.remove("en-erreur");
    }
  }
  else if(t.dataset && t.dataset.compose !== undefined){
    const id = t.dataset.compose;
    const k = COMPOSE.coches.indexOf(id);
    if(t.checked && k < 0) COMPOSE.coches.push(id);
    if(!t.checked && k >= 0) COMPOSE.coches.splice(k,1);
  }
  else if(t.id === "champ-fichier" && t.files && t.files[0]){
    const lecteur = new FileReader();
    lecteur.onload = e => appliquerImport(e.target.result);
    lecteur.readAsText(t.files[0]);
  }
});

/* Onglets du bas. L'onglet Cours revient toujours au catalogue : la
   lecture en cours se reprend depuis l'accueil, bouton << Reprendre >>. */
document.querySelectorAll(".onglets button").forEach(b => {
  b.addEventListener("click", () => {
    if(b.dataset.onglet === "cours") ECRAN = {nom:"catalogue"};
    aller(b.dataset.onglet);
  });
});

/* ---------- Export / import ---------- */

function paquetExport(){
  return JSON.stringify({ app:"clio", version:1, exporte:new Date().toISOString(), etat:ETAT }, null, 2);
}

function exporterFichier(){
  const texte = paquetExport();
  try{
    const blob = new Blob([texte], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "clio-progression-" + aujourdhui() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    avisAccueil("Fichier exporté. S’il ne s’est pas téléchargé, utilisez « Afficher le JSON ».", true);
  }catch(e){
    afficherJson();
  }
}

function afficherJson(){
  const z = document.getElementById("zone-json");
  if(!z) return;
  z.innerHTML = `<p class="minuscule">Sélectionnez ce texte et copiez-le pour le conserver.</p>
    <textarea readonly style="width:100%;min-height:170px;background:var(--noir-3);color:var(--creme);
      border:1px solid var(--laiton);padding:10px;font-size:12px;font-family:monospace">${esc(paquetExport())}</textarea>`;
}

function zoneImportTexte(){
  const z = document.getElementById("zone-json");
  if(!z) return;
  z.innerHTML = `<p class="minuscule">Collez ici un export Clio, puis validez.</p>
    <textarea id="json-import" style="width:100%;min-height:150px;background:var(--noir-3);color:var(--creme);
      border:1px solid var(--laiton);padding:10px;font-size:12px;font-family:monospace"></textarea>
    <div class="saut"></div>
    <button class="bouton petit" data-action="valider-import-texte">Importer ce JSON</button>`;
}

function appliquerImport(texte){
  let lu;
  try{ lu = JSON.parse(texte); }
  catch(e){ return avisAccueil("Import impossible : ce n’est pas un JSON valide.", false); }
  const donnees = (lu && lu.etat) ? lu.etat : lu;
  if(!donnees || typeof donnees !== "object" || (!donnees.cours && !donnees.historique)){
    return avisAccueil("Import impossible : ce fichier ne ressemble pas à une progression Clio.", false);
  }
  if(!confirm("Remplacer la progression actuelle par celle du fichier ?")) return;
  ETAT = fusionnerEtat(etatVierge(), donnees);
  sauverEtat();
  aller("accueil");
  avisAccueil("Progression importée.", true);
}

/* Petit message affiche en haut de l'onglet Accueil. */
function avisAccueil(texte, ok){
  if(ONGLET !== "accueil"){ aller("accueil"); }
  const vue = document.getElementById("vue-accueil");
  const d = document.createElement("div");
  d.className = "avis" + (ok ? " ok" : "");
  d.textContent = texte;
  vue.insertBefore(d, vue.firstChild);
  window.scrollTo(0,0);
}

/* ---------- Demarrage ---------- */
rendre();
</script>
