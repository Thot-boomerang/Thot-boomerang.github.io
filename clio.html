<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Clio — culture historique quotidienne : mini-cours et QCM, hors ligne.">
<title>Clio — culture historique quotidienne</title>

<!--
  =====================================================================
  CLIO — application personnelle de culture historique quotidienne
  ---------------------------------------------------------------------
  Fichier unique, autonome, hors ligne. HTML + CSS + JS « vanilla ».
  Aucune dependance obligatoire : les polices Google Fonts sont
  chargees de maniere non bloquante et remplacees par des polices
  systeme si le reseau est absent.

  Organisation du fichier :
    1. CSS (charte Art deco)
    2. Structure HTML des trois onglets
    3. const COURS  — TOUT le contenu pedagogique (cours, seances, QCM)
    4. Logique      — etat, progression, rendu, quiz, correction
  =====================================================================
-->

<!-- Polices : chargement non bloquant. Hors ligne, les replis systeme
     definis dans --police-titre / --police-texte prennent le relais. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap">

<style>
/* =====================================================================
   1. CHARTE ART DECO — annees 1920
   Noir profond, or/laiton, creme (papier ancien), accents bordeaux et
   vert bouteille. Geometrie : eventails, chevrons, lignes rayonnantes.
   ===================================================================== */
:root{
  --noir:#0d0c0a;
  --noir-2:#14120e;        /* fond des cartes */
  --noir-3:#1c1913;        /* fond des elements actifs */
  --or:#c9a227;
  --or-clair:#e6c96f;
  --laiton:#8a7233;
  --creme:#f3e9d6;
  --creme-2:#c8bda6;       /* texte secondaire */
  --bordeaux:#8c2432;
  --vert:#1f4a3c;
  --rouge-faux:#e0665f;
  --vert-juste:#7fc09b;

  --police-titre:'Poiret One','Josefin Sans','Century Gothic',
                 'Futura','Trebuchet MS',sans-serif;
  --police-texte:'Playfair Display','Libre Baskerville',Georgia,
                 'Times New Roman',serif;

  --rayon:2px;             /* l'Art deco aime les angles nets */
  --large:min(100%,720px);
  --barre:62px;            /* hauteur de la barre d'onglets */
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--noir);
  color:var(--creme);
  font-family:var(--police-texte);
  font-size:17px;
  line-height:1.72;
  min-height:100vh;
  position:relative;
}
/* Rayonnement discret derriere l'en-tete, facon affiche 1925. Le degrade
   de masque evite toute limite franche en bas des rayons. */
body::before{
  content:"";position:absolute;top:0;left:0;right:0;height:300px;z-index:-1;
  pointer-events:none;
  background:repeating-conic-gradient(from 180deg at 50% 0%,
    rgba(201,162,39,.075) 0deg 2.5deg, transparent 2.5deg 9deg);
  -webkit-mask-image:linear-gradient(#000 10%,transparent 100%);
  mask-image:linear-gradient(#000 10%,transparent 100%);
}
img{max-width:100%}
h1,h2,h3,h4{font-family:var(--police-titre);font-weight:400;line-height:1.25;margin:0}
p{margin:0 0 1em}
a{color:var(--or-clair)}
button{font:inherit;color:inherit}

/* --- Ossature ------------------------------------------------------ */
.app{width:var(--large);margin:0 auto;padding:0 16px calc(var(--barre) + 28px + env(safe-area-inset-bottom));}
.vue{display:none}
.vue.active{display:block}

/* --- En-tete facon affiche / journal -------------------------------- */
.entete{text-align:center;padding:22px 0 14px;position:relative}
.entete .filet-haut{height:3px;background:var(--or);opacity:.85}
.entete .filet-bas{height:1px;background:var(--laiton);margin-top:3px}
.entete h1{
  font-size:clamp(38px,13vw,58px);letter-spacing:.22em;
  text-indent:.22em;color:var(--or);margin:10px 0 2px;
  text-shadow:0 0 18px rgba(201,162,39,.18);
}
.entete .sous{
  font-family:var(--police-titre);font-size:11px;letter-spacing:.34em;
  text-transform:uppercase;color:var(--creme-2);margin:0 0 10px;
}
.eventail{
  height:26px;margin:0 auto 8px;width:132px;
  background:repeating-conic-gradient(from 180deg at 50% 100%,
    var(--or) 0deg 1.2deg, transparent 1.2deg 7deg);
  -webkit-mask-image:linear-gradient(to top,#000 20%,transparent 100%);
  mask-image:linear-gradient(to top,#000 20%,transparent 100%);
  opacity:.9;
}

/* En-tete compact hors de l'accueil : la lecture doit commencer haut. */
body[data-onglet="cours"] .entete,
body[data-onglet="quiz"] .entete{padding:10px 0 8px}
body[data-onglet="cours"] .entete h1,
body[data-onglet="quiz"] .entete h1{font-size:clamp(24px,7vw,32px);margin:6px 0 0}
body[data-onglet="cours"] .entete .sous,
body[data-onglet="quiz"] .entete .sous{display:none}
body[data-onglet="cours"] .eventail,
body[data-onglet="quiz"] .eventail{height:13px;width:84px;margin-bottom:2px}
body[data-onglet="cours"] .entete>div[style],
body[data-onglet="quiz"] .entete>div[style]{height:6px!important}

/* Filet dore avec losange central : separateur recurrent */
.filet{display:flex;align-items:center;gap:10px;margin:22px 0 14px}
.filet::before,.filet::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--laiton),transparent)}
.filet span{
  font-family:var(--police-titre);font-size:12px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--or);white-space:nowrap;
}
.losange{color:var(--or);opacity:.8}

/* --- Cartes --------------------------------------------------------- */
.carte{
  background:var(--noir-2);
  border:1px solid rgba(138,114,51,.5);
  border-radius:var(--rayon);
  padding:16px;margin:0 0 14px;position:relative;
}
.carte::before{ /* chevrons discrets en haut de carte */
  content:"";position:absolute;inset:0 0 auto 0;height:4px;
  background:repeating-linear-gradient(135deg,
    rgba(201,162,39,.45) 0 2px, transparent 2px 7px);
}
.carte h2,.carte h3{color:var(--or-clair)}
.carte h2{font-size:24px;letter-spacing:.06em;margin-bottom:6px}
.carte h3{font-size:19px;letter-spacing:.05em;margin-bottom:6px}
.secondaire{color:var(--creme-2);font-size:15px}
.minuscule{font-size:13px;color:var(--creme-2);letter-spacing:.04em}

/* --- Boutons -------------------------------------------------------- */
.bouton,.bouton-plein{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:10px 20px;width:100%;
  font-family:var(--police-titre);font-size:16px;letter-spacing:.16em;
  text-transform:uppercase;cursor:pointer;border-radius:var(--rayon);
  background:transparent;border:1px solid var(--or);color:var(--or-clair);
  text-align:center;
}
.bouton-plein{background:var(--or);border-color:var(--or);color:#17140c;font-weight:700}
.bouton:active,.bouton-plein:active{transform:translateY(1px)}
.bouton[disabled],.bouton-plein[disabled]{opacity:.42;cursor:not-allowed}
.bouton.petit,.bouton-plein.petit{width:auto;min-height:40px;padding:6px 14px;font-size:13px;letter-spacing:.12em}
.bouton.discret{border-color:var(--laiton);color:var(--creme-2)}
.rang-boutons{display:flex;flex-wrap:wrap;gap:8px}

/* --- Pastilles (filtres de periode) --------------------------------- */
.pastilles{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.pastille{
  font-family:var(--police-titre);font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;padding:8px 14px;min-height:40px;
  border:1px solid var(--laiton);color:var(--creme-2);
  background:transparent;border-radius:999px;cursor:pointer;
}
.pastille[aria-pressed="true"]{background:var(--or);border-color:var(--or);color:#17140c;font-weight:700}

/* --- Etiquettes ----------------------------------------------------- */
.etiq{
  display:inline-block;font-family:var(--police-titre);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;
  border:1px solid var(--laiton);color:var(--creme-2);border-radius:999px;
  vertical-align:middle;
}
.etiq.or{border-color:var(--or);color:var(--or-clair)}
.etiq.faite{border-color:var(--vert-juste);color:var(--vert-juste)}
.etiq.bientot{border-color:var(--bordeaux);color:#e5a3ab}

/* --- Liste des seances / cours -------------------------------------- */
.liste{list-style:none;margin:0;padding:0}
.ligne{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 12px;margin:0 0 8px;background:var(--noir-3);
  border:1px solid rgba(138,114,51,.38);border-radius:var(--rayon);
  cursor:pointer;color:var(--creme);font-family:var(--police-texte);
  font-size:16px;line-height:1.4;
}
.ligne[disabled]{cursor:not-allowed;opacity:.5}
.ligne .num{
  flex:0 0 34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--or);color:var(--or);font-family:var(--police-titre);
  font-size:15px;transform:rotate(45deg);
}
.ligne .num span{transform:rotate(-45deg)}
.ligne .corps{flex:1;min-width:0}
.ligne .corps .t{display:block}
.ligne.faite .num{border-color:var(--vert-juste);color:var(--vert-juste)}
.ligne .etat{flex:0 0 auto;font-size:12px;color:var(--creme-2);letter-spacing:.08em;font-family:var(--police-titre);text-transform:uppercase}

/* --- Lecture d'une seance ------------------------------------------- */
.lecture{font-size:17.5px}
.lecture h3{
  font-size:21px;color:var(--or-clair);margin:26px 0 8px;letter-spacing:.04em;
  padding-bottom:5px;border-bottom:1px solid rgba(138,114,51,.45);
}
.lecture p{margin:0 0 1.05em;text-align:left}
.lecture ul{margin:0 0 1.1em;padding-left:1.1em}
.lecture li{margin:0 0 .5em}
.lecture strong{color:var(--or-clair);font-weight:700}
.lecture blockquote{
  margin:1.2em 0;padding:2px 0 2px 16px;border-left:3px solid var(--bordeaux);
  font-style:italic;color:var(--creme-2);
}
.probleme{
  border:1px solid var(--or);border-left-width:5px;padding:12px 14px;
  margin:0 0 20px;background:rgba(201,162,39,.06);font-style:italic;
}
.anecdote{
  border:1px solid var(--vert);border-left-width:5px;background:rgba(31,74,60,.28);
  padding:14px;margin:26px 0 8px;
}
.anecdote .titre{
  font-family:var(--police-titre);font-size:12px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--or-clair);display:block;margin-bottom:6px;
}
.anecdote p{margin:0;font-size:16.5px}

/* --- QCM ------------------------------------------------------------ */
.question{border:1px solid rgba(138,114,51,.45);background:var(--noir-2);padding:14px;margin:0 0 14px}
.question .enonce{font-weight:600;margin:0 0 4px}
.question .consigne{font-family:var(--police-titre);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--creme-2);margin:0 0 10px}
.option{
  display:flex;gap:11px;align-items:flex-start;padding:11px 10px;margin:0 0 7px;
  border:1px solid rgba(138,114,51,.35);cursor:pointer;background:rgba(0,0,0,.18);
}
.option:has(input:checked){border-color:var(--or);background:rgba(201,162,39,.10)}
.option input{
  appearance:none;-webkit-appearance:none;margin:2px 0 0;flex:0 0 20px;height:20px;
  border:1px solid var(--or);background:transparent;cursor:pointer;position:relative;
}
.option input:checked::after{
  content:"";position:absolute;inset:3px;background:var(--or);
}
.option input:focus-visible{outline:2px solid var(--or-clair);outline-offset:2px}
.erreur{color:var(--rouge-faux);font-size:14.5px;margin:8px 0 0;font-style:italic}
.question.en-erreur{border-color:var(--rouge-faux)}

/* --- Correction ----------------------------------------------------- */
.score{
  text-align:center;border:1px solid var(--or);padding:16px;margin:0 0 18px;
  background:rgba(201,162,39,.07);
}
.score .chiffre{font-family:var(--police-titre);font-size:46px;color:var(--or);line-height:1}
.corr{border-left:4px solid var(--rouge-faux);background:var(--noir-2);padding:13px 14px;margin:0 0 13px}
.corr .ligne-rep{margin:0 0 4px;font-size:15.5px}
.corr .ligne-rep b{font-family:var(--police-titre);letter-spacing:.1em;font-size:12px;text-transform:uppercase;color:var(--creme-2);display:block}
.corr .rep{display:block;padding-left:16px;position:relative;margin:2px 0}
.corr .rep::before{content:"\25C6";position:absolute;left:0;font-size:9px;top:.45em;opacity:.8}
.corr .faux{color:var(--rouge-faux)}
.corr .juste{color:var(--vert-juste)}
.corr .expl{margin:9px 0 0;font-size:16px;border-top:1px solid rgba(138,114,51,.4);padding-top:9px}
details.justes{border:1px solid rgba(138,114,51,.4);padding:10px 12px;margin:18px 0}
details.justes summary{cursor:pointer;font-family:var(--police-titre);letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--vert-juste)}
details.justes .corr{border-left-color:var(--vert-juste);margin-top:12px}

/* --- Formulaires (reglages, quiz compose) --------------------------- */
.champ{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(138,114,51,.25)}
.champ:last-child{border-bottom:0}
.champ .txt{flex:1}
.champ .txt small{display:block;color:var(--creme-2);font-size:13.5px;line-height:1.45}
.interrupteur{flex:0 0 auto;width:54px;height:30px;border:1px solid var(--or);background:transparent;cursor:pointer;position:relative;border-radius:999px}
.interrupteur::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:var(--laiton);border-radius:50%;transition:left .15s,background .15s}
.interrupteur[aria-checked="true"]::after{left:27px;background:var(--or)}
.coche{display:flex;gap:11px;align-items:flex-start;padding:11px 8px;border:1px solid rgba(138,114,51,.35);margin:0 0 7px;cursor:pointer;background:rgba(0,0,0,.18)}
.coche input{appearance:none;-webkit-appearance:none;margin:3px 0 0;flex:0 0 20px;height:20px;border:1px solid var(--or);background:transparent;position:relative;cursor:pointer}
.coche input:checked::after{content:"";position:absolute;inset:3px;background:var(--or)}
.coche:has(input:checked){border-color:var(--or);background:rgba(201,162,39,.10)}
select,input[type=file]{font:inherit;color:var(--creme);background:var(--noir-3);border:1px solid var(--laiton);padding:10px;border-radius:var(--rayon);min-height:44px}
select{width:100%}

/* --- Tableau de progression ----------------------------------------- */
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 30%;min-width:96px;border:1px solid rgba(138,114,51,.45);padding:11px 8px;text-align:center;background:rgba(0,0,0,.2)}
.stat .v{font-family:var(--police-titre);font-size:28px;color:var(--or);line-height:1.1}
.stat .l{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--creme-2);font-family:var(--police-titre)}
.jauge{height:8px;background:rgba(0,0,0,.45);border:1px solid rgba(138,114,51,.5);margin:10px 0 4px}
.jauge div{height:100%;background:linear-gradient(90deg,var(--laiton),var(--or))}

/* --- Barre d'onglets ------------------------------------------------- */
.onglets{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;background:rgba(10,9,7,.97);
  border-top:1px solid var(--or);
  padding-bottom:env(safe-area-inset-bottom);
  backdrop-filter:blur(6px);
}
.onglets button{
  flex:1;background:transparent;border:0;padding:9px 4px 11px;cursor:pointer;
  font-family:var(--police-titre);font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--creme-2);
}
.onglets button .ic{display:block;font-size:17px;line-height:1.5;color:var(--laiton)}
.onglets button[aria-current="page"]{color:var(--or)}
.onglets button[aria-current="page"] .ic{color:var(--or)}

/* --- Divers ---------------------------------------------------------- */
.fil{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.fil .bouton{width:auto}
.vide{text-align:center;color:var(--creme-2);padding:26px 10px;font-style:italic}
.avis{border:1px solid var(--bordeaux);background:rgba(140,36,50,.15);padding:11px 13px;margin:0 0 14px;font-size:15.5px}
.avis.ok{border-color:var(--vert-juste);background:rgba(127,192,155,.1)}
.sources li{margin-bottom:.45em;font-size:15.5px}
.pied{text-align:center;color:var(--creme-2);font-size:12.5px;letter-spacing:.1em;padding:22px 0 6px}
.saut{height:10px}
@media (min-width:640px){
  body{font-size:18px}
  .app{padding-bottom:calc(var(--barre) + 40px)}
  .stat{flex:1 1 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <header class="entete">
    <div class="filet-haut"></div><div class="filet-bas"></div>
    <div style="height:14px"></div>
    <div class="eventail" aria-hidden="true"></div>
    <h1>CLIO</h1>
    <p class="sous">Culture historique &#8226; une seance par jour</p>
    <div class="filet-bas"></div>
  </header>

  <!-- ================= ONGLET 1 : ACCUEIL ================= -->
  <main id="vue-accueil" class="vue active" role="tabpanel" aria-label="Accueil"></main>

  <!-- ================= ONGLET 2 : COURS =================== -->
  <main id="vue-cours" class="vue" role="tabpanel" aria-label="Cours"></main>

  <!-- ================= ONGLET 3 : QUIZ ==================== -->
  <main id="vue-quiz" class="vue" role="tabpanel" aria-label="Quiz"></main>

  <p class="pied">&#9670; CLIO &#9670;</p>
</div>

<nav class="onglets" role="tablist" aria-label="Navigation principale">
  <button type="button" data-onglet="accueil" aria-current="page"><span class="ic" aria-hidden="true">&#9650;</span>Accueil</button>
  <button type="button" data-onglet="cours"><span class="ic" aria-hidden="true">&#9670;</span>Cours</button>
  <button type="button" data-onglet="quiz"><span class="ic" aria-hidden="true">&#9679;</span>Quiz</button>
</nav>

<script>
"use strict";
/* =====================================================================
   3. CONTENU PEDAGOGIQUE
   ---------------------------------------------------------------------
   Tout le contenu vit ici, separe de la logique. Pour ajouter un cours,
   il suffit de coller un objet supplementaire dans le tableau COURS, en
   respectant exactement ce gabarit :

   {
     id: "identifiant-unique-sans-espace",
     titre: "Titre du cours",
     periode: "1914-1945",        // doit figurer dans PERIODES ci-dessous
     dates: "1919-1939",
     note: "",                    // facultatif : precision affichee en gris
     problematique: "Une phrase.",
     sources: [ "Auteur, Titre, editeur, annee", ... ],   // 3 a 5
     seances: [                   // EXACTEMENT 6
       {
         numero: 1,
         titre: "Titre de la seance",
         problematique: "Une phrase.",
         contenu: ` ... HTML simple : h3, p, ul, strong, blockquote ... `,
         anecdote: ` ... HTML simple, jamais evalue ... `,
         questions: [             // EXACTEMENT 5
           {
             enonce: "...",
             options: ["...","...","...","..."],   // exactement 4
             correctes: [0,2],                     // 1 a 4 indices
             explication: "2 a 3 phrases renvoyant au mecanisme du cours."
           }, ...
         ]
       }, ...
     ]
   }

   Conventions de redaction :
   - notions cles en <strong>, dates et acteurs precis ;
   - 3 ou 4 parties titrees (h3) : causes, mecanismes, consequences ;
   - un paragraphe final << Fil rouge >> qui annonce la seance suivante ;
   - anecdote vraie et verifiable ; si elle releve de la legende, le dire ;
   - un point douteux se signale par un commentaire <!-- A VERIFIER -->.
   ===================================================================== */

/* Ordre d'affichage des periodes dans l'onglet Cours. Une periode sans
   aucun cours reste visible et porte la mention << bientot >>. */
const PERIODES = ["Antiquite","Moyen Age","Epoque moderne","XIXe siecle",
                  "1914-1945","Depuis 1945"];

const COURS = [

/* ====================== COURS 1 ====================== */
{
  id: "france-1920-1930",
  titre: "La France des années 1920-1930",
  periode: "1914-1945",
  dates: "1919-1939",
  note: "",
  problematique: "Comment une France victorieuse en 1918, mais saignée et endettée, en vient-elle en vingt ans à douter de son régime, de sa monnaie et de sa sécurité ?",
  sources: [
    "Jean-Jacques Becker et Serge Berstein, Victoire et frustrations, 1914-1929, Seuil, coll. « Nouvelle histoire de la France contemporaine », 1990",
    "Dominique Borne et Henri Dubief, La Crise des années 30, 1929-1938, Seuil, coll. « Nouvelle histoire de la France contemporaine », 1989",
    "Jean-Noël Jeanneney, Leçon d’histoire pour une gauche au pouvoir. La faillite du Cartel (1924-1926), Seuil, 1977",
    "Julian Jackson, The Popular Front in France. Defending Democracy, 1934-1938, Cambridge University Press, 1988",
    "Robert Frank, Le Prix du réarmement français, 1935-1939, Publications de la Sorbonne, 1982"
  ],
  seances: [
  /* ---------- Cours 1, séance 1 ---------- */
  {
    numero: 1,
    titre: "Le Bloc national (1919-1924) : la victoire et ses comptes",
    problematique: "Pourquoi la France victorieuse de 1918 a-t-elle fondé sa reconstruction sur l’argent allemand, et qu’advient-il quand ce pari échoue ?",
    contenu: `
<h3>1. Une Chambre « bleu horizon »</h3>
<p>Les élections législatives du <strong>16 novembre 1919</strong> sont les premières depuis 1914. Le pays sort de la guerre avec près de <strong>1,4 million de morts</strong>, dix départements dévastés et une dette publique multipliée par cinq. Le <strong>mode de scrutin</strong> adopté en juillet 1919 est décisif : on vote pour des <strong>listes départementales</strong>, et toute liste qui obtient la majorité absolue emporte l’ensemble des sièges du département ; sinon, la répartition se fait à la proportionnelle. Ce système récompense les coalitions et punit l’isolement.</p>
<p>Les droites et le centre s’allient donc dans le <strong>Bloc national</strong>, sur un programme de fermeté envers l’Allemagne et de défense de l’ordre social, agitant la peur du bolchevisme — l’affiche de « l’homme au couteau entre les dents » date de cette campagne. Les socialistes, eux, se présentent seuls. Résultat : le Bloc rassemble près des deux tiers des 613 sièges, tandis que la <strong>SFIO</strong> tombe sous les 70 députés alors qu’elle réunit plus d’un cinquième des suffrages. On surnomme cette assemblée la <strong>« Chambre bleu horizon »</strong>, du nom de la couleur des uniformes : plus du tiers des élus sont d’anciens combattants.</p>

<h3>2. La gauche coupée en deux : Tours, décembre 1920</h3>
<p>Au <strong>congrès de Tours</strong> (25-30 décembre 1920), la SFIO débat de l’adhésion à l’<strong>Internationale communiste</strong> fondée par Lénine, qui impose <strong>21 conditions</strong> : discipline de fer, exclusion des « réformistes », soumission des élus au parti. La majorité l’emporte par environ <strong>3 200 mandats contre 1 000</strong> et fonde la Section française de l’Internationale communiste, futur <strong>Parti communiste français</strong>, qui emporte avec elle le journal <em>L’Humanité</em>. La minorité, autour de <strong>Léon Blum</strong>, reste dans ce qu’il appelle « la vieille maison » et conserve le sigle SFIO.</p>
<p>La fracture gagne le syndicalisme : après l’échec de la grande grève des cheminots de 1920, la CGT se divise à son tour et une <strong>CGTU</strong> proche des communistes naît en 1921-1922. Conséquence durable : pendant quinze ans, la gauche française additionne des voix mais pas des sièges, et le Bloc national gouverne sans véritable alternative parlementaire.</p>

<h3>3. « L’Allemagne paiera » : le pari financier de la victoire</h3>
<p>Le traité de Versailles n’a pas fixé le montant des réparations ; il l’a renvoyé à une commission, qui arrête la somme de <strong>132 milliards de marks-or</strong> en <strong>mai 1921</strong>, dont 52 % pour la France. Or l’État a déjà engagé la reconstruction : il indemnise les sinistrés et reconstruit routes, mines et usines en empruntant, inscrivant ces sommes dans un <strong>budget des dépenses « recouvrables »</strong>, c’est-à-dire censées être remboursées plus tard par Berlin. Le mot d’ordre que l’on prête au ministre des Finances <strong>Louis-Lucien Klotz</strong>, « l’Allemagne paiera », n’est donc pas un slogan : c’est une <strong>architecture budgétaire</strong>.</p>
<p>Elle repose sur un enchaînement fragile. La France doit rembourser ses propres <strong>dettes interalliées</strong> aux États-Unis et au Royaume-Uni, qui refusent de les lier aux réparations allemandes. Si l’Allemagne paie mal, Paris doit malgré tout payer : le déficit se creuse, la dette flottante gonfle, le franc s’affaiblit. Le problème allemand est ainsi devenu, mécaniquement, un problème <strong>intérieur</strong> français.</p>

<h3>4. La Ruhr : la force sans les alliés (1923-1924)</h3>
<p>En janvier 1922, <strong>Raymond Poincaré</strong> revient à la présidence du Conseil avec l’intention d’appliquer le traité à la lettre. Un défaut allemand sur des livraisons de bois et de charbon lui sert de fondement juridique : le <strong>11 janvier 1923</strong>, troupes françaises et belges occupent la <strong>Ruhr</strong>, cœur industriel du Reich, accompagnées d’ingénieurs chargés de prélever charbon et coke à la source.</p>
<p>Berlin réplique par la <strong>résistance passive</strong> : grèves payées par l’État allemand, qui fait tourner la planche à billets et provoque l’<strong>hyperinflation</strong> de 1923. L’opération devient ruineuse pour tout le monde. Londres et Washington la désapprouvent ; la spéculation se retourne contre le franc au début de 1924, et Poincaré doit imposer le <strong>« double décime »</strong>, une hausse d’impôts de 20 %, pour sauver la monnaie. L’Allemagne cède sur la résistance passive en septembre 1923, mais la sortie de crise est confiée à un comité d’experts : le <strong>plan Dawes</strong> (août 1924) allège les annuités, prête des capitaux américains à l’Allemagne et prépare l’évacuation de la Ruhr en 1925.</p>
<p>Le bilan est amer : la France a obtenu de l’argent, mais a perdu le droit d’agir seule. Les réparations sont désormais une affaire internationale, arbitrée par les banquiers américains. Aux élections du <strong>11 mai 1924</strong>, le <strong>Cartel des gauches</strong> l’emporte. Le président de la République <strong>Alexandre Millerand</strong>, qui s’était engagé publiquement pour le Bloc, se heurte à une « grève des ministères » : aucun dirigeant du Cartel n’accepte de former un gouvernement sous lui. Il démissionne le <strong>11 juin 1924</strong> et Gaston Doumergue lui succède. Le précédent est capital : sous la III<sup>e</sup> République, un président ne gouverne pas contre la Chambre.</p>
<p><strong>Fil rouge.</strong> Le Cartel arrive donc au pouvoir avec une double hypothèque : un budget bâti sur des recettes allemandes incertaines et une dette à court terme qu’il faut renouveler chaque mois. C’est sur ce terrain financier — et non sur son programme — qu’il va se briser.</p>

<h3>1. Une majorité mal ajustée</h3>
<p>Le <strong>Cartel des gauches</strong>, victorieux le 11 mai 1924, associe le <strong>Parti radical</strong> d’<strong>Édouard Herriot</strong> et la <strong>SFIO</strong>. Mais l’accord est bancal : les socialistes pratiquent le <strong>« soutien sans participation »</strong> — ils votent la confiance sans entrer au gouvernement — tandis que les radicaux, attachés à la petite propriété, refusent leur principale proposition, un <strong>prélèvement sur le capital</strong>. La majorité est donc soudée sur les questions morales et laïques, et divisée sur la seule question qui compte alors : l’argent.</p>
<p>Herriot commence donc par ce qui unit sa majorité : amnistie politique, réintégration des cheminots révoqués de 1920, transfert des cendres de <strong>Jean Jaurès au Panthéon</strong> (novembre 1924), <strong>reconnaissance de l’URSS</strong> (octobre 1924). Sa tentative d’étendre les lois laïques à l’<strong>Alsace-Moselle</strong>, restées sous régime concordataire depuis 1918, déclenche en revanche une mobilisation catholique massive et doit être abandonnée.</p>

<p>Le mécanisme financier est décisif. La guerre a été financée par l’emprunt, et une grande partie de la dette est à <strong>court terme</strong> : les <strong>bons de la Défense nationale</strong>, souscrits par des centaines de milliers d’épargnants, arrivent sans cesse à échéance. L’État ne vit donc que si les porteurs <strong>renouvellent</strong> leurs bons chaque mois. Qu’ils cessent de le faire, et le Trésor doit trouver des liquidités immédiates : il se tourne alors vers les <strong>avances de la Banque de France</strong>, plafonnées par la loi.</p>
<p>Or les détenteurs de bons, effrayés par les rumeurs d’impôt sur le capital, se retirent. Pour tenir, la Banque de France dépasse secrètement le plafond légal, puis révèle l’irrégularité : ce sont les « faux bilans » du printemps 1925. Le <strong>10 avril 1925</strong>, le Sénat renverse Herriot. En un an, cinq ou six ministères se succèdent sans parvenir à faire voter un plan financier ; le franc s’effondre jusqu’à près de <strong>240 francs pour une livre sterling en juillet 1926</strong>, contre 25 avant 1914.</p>

<h3>4. Poincaré et le franc de 1928</h3>
<p>Le <strong>23 juillet 1926</strong>, Raymond Poincaré revient à la tête d’un gouvernement d’<strong>union nationale</strong> réunissant six anciens présidents du Conseil, Herriot compris. L’effet est d’abord psychologique : la confiance revient avant même les mesures. Suivent des hausses d’impôts, surtout indirects, des économies, et la création d’une <strong>caisse autonome d’amortissement</strong> (août 1926) alimentée notamment par le monopole des tabacs, qui isole le remboursement de la dette des aléas du budget. Les capitaux rentrent, le franc remonte, et le gouvernement choisit de le <strong>stabiliser</strong> plutôt que de le ramener à sa valeur d’avant-guerre.</p>

<p><strong>Fil rouge.</strong> Cette stabilisation réussie fait naître un dogme : le franc Poincaré devient intouchable, et l’on refusera de le dévaluer à nouveau quand la crise mondiale arrivera. Mais avant la crise, la même équipe tente de stabiliser l’Europe elle-même : c’est la diplomatie d’Aristide Briand.</p>

<h3>1. Après la Ruhr : la sécurité par la négociation</h3>
<p>L’échec de 1923 a montré que la France ne pouvait plus contraindre seule l’Allemagne. <strong>Aristide Briand</strong>, ministre des Affaires étrangères presque sans interruption de 1925 à 1932, en tire la conséquence : puisque la force est hors de portée, il faut obtenir de l’Allemagne qu’elle accepte librement ce que le traité lui imposait.</p>
<p>C’est le sens des accords de <strong>Locarno</strong>, paraphés le <strong>16 octobre 1925</strong> et signés à Londres le 1<sup>er</sup> décembre. L’Allemagne de <strong>Gustav Stresemann</strong> reconnaît définitivement ses frontières occidentales avec la France et la Belgique, ainsi que la <strong>démilitarisation de la Rhénanie</strong> ; le Royaume-Uni et l’Italie se portent garants. En 1926, l’Allemagne entre à la <strong>Société des Nations</strong> et Briand comme Stresemann reçoivent le prix Nobel de la paix.</p>

<h3>2. Une garantie asymétrique</h3>
<p>Locarno comporte pourtant un vice de construction : <strong>seules les frontières de l’Ouest sont garanties</strong>. À l’Est, l’Allemagne accepte seulement des traités d’arbitrage avec la <strong>Pologne</strong> et la <strong>Tchécoslovaquie</strong> — c’est-à-dire l’engagement de discuter, non celui de ne pas réviser. Stresemann ne s’en cache pas : la révision pacifique des frontières orientales reste son objectif.</p>
<p>Or la France a signé une alliance avec la Pologne en 1921 et avec la Tchécoslovaquie en 1924. Pour les secourir, elle devrait attaquer l’Allemagne à l’ouest — et se retrouverait alors agresseur au regard de Locarno, contre la garantie britannique. Le système de sécurité français est donc, dès 1925, <strong>logiquement contradictoire</strong>. S’y ajoute la faiblesse des instruments : le <strong>pacte Briand-Kellogg</strong> du <strong>27 août 1928</strong>, signé par une soixantaine d’États, « condamne le recours à la guerre » mais ne prévoit <strong>aucune sanction</strong>. Le droit international de l’entre-deux-guerres proclame beaucoup et contraint peu.</p>

<h3>1. Une crise tardive, atténuée… et interminable</h3>
<p>La dépression née du krach de Wall Street en octobre 1929 n’atteint la France qu’en <strong>1931-1932</strong>. Le pays est protégé un temps par une économie moins ouverte, une population encore rurale pour un tiers, un système bancaire moins exposé et un <strong>franc sous-évalué</strong> depuis 1928. Mais la protection se retourne : quand la <strong>livre sterling</strong> se détache de l’or en septembre 1931, puis le <strong>dollar</strong> en 1933, le franc devient soudain la monnaie la plus chère du monde industriel. Les exportations françaises s’effondrent.</p>
<p>Le choix monétaire commande tout le reste. Fidèle au <strong>franc Poincaré</strong> devenu dogme, la France s’enferme dans le <strong>bloc-or</strong> avec la Belgique, les Pays-Bas et la Suisse, et cherche à restaurer sa compétitivité par la <strong>déflation</strong> : baisse des prix, des salaires et des dépenses publiques. Les <strong>décrets-lois de Pierre Laval</strong>, en juillet 1935, amputent ainsi de 10 % les traitements des fonctionnaires et les pensions. Résultat : la crise française est moins profonde qu’en Allemagne ou aux États-Unis, mais beaucoup plus longue — la production de 1929 ne sera pas retrouvée avant la guerre.</p>

<h3>2. Un régime qui s’use</h3>
<p>Les élections de 1932 donnent une majorité de gauche, mais la SFIO refuse à nouveau de participer : entre juin 1932 et février 1934, <strong>six gouvernements</strong> se succèdent, incapables de faire adopter un plan financier. Herriot tombe en décembre 1932 parce qu’il veut honorer l’échéance de la <strong>dette américaine</strong> que la Chambre refuse de payer. L’instabilité n’est pas nouvelle sous la III<sup>e</sup> République ; ce qui est nouveau, c’est qu’elle se produit alors que la crise exige des décisions.</p>
<p>Ce vide nourrit les <strong>ligues</strong> : l’<strong>Action française</strong> de Charles Maurras et ses Camelots du roi, les <strong>Jeunesses patriotes</strong>, la <strong>Solidarité française</strong> financée par le parfumeur François Coty, le <strong>Francisme</strong> de Marcel Bucard, et surtout les <strong>Croix-de-Feu</strong> du colonel de La Rocque, association d’anciens combattants devenue mouvement de masse. Leur nature fait l’objet d’un <strong>débat historiographique</strong> vif : <strong>René Rémond</strong> y voyait la survivance d’un nationalisme français autoritaire, distinct du fascisme ; <strong>Zeev Sternhell</strong> a soutenu au contraire l’existence d’une matrice fasciste française ; <strong>Robert Soucy</strong>, <strong>Brian Jenkins</strong> ou <strong>Kevin Passmore</strong> ont rouvert le dossier en insistant sur le caractère para-militaire des Croix-de-Feu. Le débat porte moins sur les faits que sur la définition du fascisme.</p>

<h3>3. Stavisky, ou le scandale comme révélateur</h3>

<p><strong>Édouard Daladier</strong> lui succède et commet l’erreur décisive : il déplace le préfet de police de Paris, <strong>Jean Chiappe</strong>, réputé bienveillant envers les ligues et très populaire à droite. Le geste est interprété comme une provocation.</p>

<h3>4. Le 6 février 1934 et son onde de choc</h3>
<p>Le soir du <strong>6 février 1934</strong>, jour de présentation du gouvernement Daladier, ligues et associations d’anciens combattants — y compris, par un autre itinéraire, l’organisation communiste ARAC — convergent vers la <strong>place de la Concorde</strong>, face au Palais-Bourbon. La police, débordée, tire : on compte une <strong>quinzaine de morts</strong> et plus d’un millier de blessés. Le lendemain, bien qu’ayant obtenu la confiance de la Chambre, Daladier démissionne. <strong>Gaston Doumergue</strong> forme un gouvernement d’union nationale.</p>
<p>L’événement a été longtemps lu comme une tentative de coup d’État fasciste. L’historiographie, notamment <strong>Serge Berstein</strong>, a établi qu’il n’y eut ni plan concerté, ni volonté commune de renverser le régime : les cortèges étaient hétérogènes et sans commandement unique. Mais la <strong>perception</strong> a compté davantage que la réalité. Pour la gauche, la République a failli tomber : le 12 février 1934, une <strong>grève générale</strong> et des cortèges socialistes et communistes se rejoignent spontanément à la place de la Nation. Le 27 juillet 1934, SFIO et PCF signent un <strong>pacte d’unité d’action</strong>. Pour la première fois depuis Tours, la gauche se recompose.</p>
<p>Il faut noter le paradoxe : un gouvernement renversé par la rue affaiblit le parlementarisme, mais l’émotion produite consolide l’attachement républicain d’une large partie de l’opinion. La crise des années 1930 en France n’a pas emporté le régime ; elle l’a durablement fragilisé.</p>
<p><strong>Fil rouge.</strong> De cette peur commune naît une coalition inédite — communistes, socialistes, radicaux — qui va gagner les élections de 1936 et gouverner : le Front populaire.</p>

<h3>1. La fabrique d’une alliance</h3>
<p>Le rapprochement des gauches n’a rien d’évident : depuis 1920, le PCF dénonce les socialistes comme « sociaux-traîtres ». Trois facteurs le rendent possible. La <strong>peur du fascisme</strong> après le 6 février 1934 ; le <strong>tournant de l’Internationale communiste</strong>, qui adopte à l’été 1935 la stratégie des fronts populaires antifascistes ; enfin le <strong>rapprochement diplomatique</strong> entre Paris et Moscou, scellé par le pacte du 2 mai 1935.</p>
<p>Le 14 juillet 1935, un immense cortège réunit à Paris les trois partis et la CGT réunifiée : c’est le <strong>Rassemblement populaire</strong>. Son programme, publié en janvier 1936, reste modéré — « le pain, la paix, la liberté » —, écartant les nationalisations massives pour ne pas effrayer les radicaux. Aux élections des <strong>26 avril et 3 mai 1936</strong>, la coalition l’emporte : la <strong>SFIO devient le premier parti de la Chambre</strong> avec près de 150 élus, le <strong>PCF passe de 10 à 72 députés</strong> mais refuse de participer au gouvernement, et les radicaux reculent. Le 4 juin 1936, <strong>Léon Blum</strong> devient le premier socialiste — et le premier juif — président du Conseil.</p>

<h3>2. Mai-juin 1936 : la grève qui précède la loi</h3>
<p>Un fait capital : le mouvement social <strong>précède</strong> l’arrivée de Blum. Dès la mi-mai, des grèves <strong>avec occupation d’usines</strong> se déclenchent, forme inédite en France ; en juin, près de <strong>deux millions de grévistes</strong> cessent le travail dans une atmosphère souvent festive. Le patronat, craignant une révolution, accepte de négocier.</p>
<p>Les <strong>accords Matignon</strong> du 7 au 8 juin 1936, signés à l’hôtel Matignon entre la CGT, la Confédération générale de la production française et le gouvernement, accordent des hausses de salaires de 7 à 15 %, la reconnaissance du droit syndical, des <strong>délégués du personnel</strong> et la généralisation des <strong>conventions collectives</strong>. Les lois suivent en quelques jours : <strong>40 heures</strong> hebdomadaires, <strong>deux semaines de congés payés</strong>, conventions collectives. S’y ajoutent la scolarité obligatoire jusqu’à 14 ans, la réforme du statut de la <strong>Banque de France</strong>, la nationalisation des industries de guerre, l’<strong>Office du blé</strong>, et la <strong>dissolution des ligues</strong>.</p>

<h3>3. Les limites : le mur économique et le mur extérieur</h3>
<p>L’économie sanctionne l’ordre des décisions. Le gouvernement augmente les salaires et réduit la durée du travail <strong>avant</strong> d’ajuster la monnaie : les prix montent, la hausse nominale des salaires est vite absorbée, et la production ne suit pas. La <strong>dévaluation</strong>, longtemps refusée pour des raisons politiques, n’intervient que le <strong>1<sup>er</sup> octobre 1936</strong> — trop tard pour produire l’effet de relance espéré. Les capitaux fuient ; en février 1937, Blum doit annoncer une <strong>« pause »</strong> dans les réformes.</p>
<p>La <strong>guerre d’Espagne</strong>, commencée en juillet 1936, divise la majorité : Blum choisit la <strong>non-intervention</strong> par crainte d’un conflit européen et sous pression britannique, au prix d’une profonde déchirure à gauche. En juin 1937, le Sénat lui refuse les pleins pouvoirs financiers et il démissionne. Un second gouvernement Blum, en mars 1938, ne dure qu’un mois. Avec <strong>Édouard Daladier</strong>, revenu en avril 1938, les décrets-lois de Paul Reynaud détricotent les 40 heures à l’automne ; l’échec de la <strong>grève générale du 30 novembre 1938</strong> marque la fin de la séquence.</p>

<p>Le bilan social et culturel, lui, est durable : congés payés, conventions collectives, délégués du personnel, billets de train à tarif réduit, auberges de jeunesse et politique des loisirs de <strong>Léo Lagrange</strong> font entrer les classes populaires dans des pratiques dont elles étaient exclues. Le Front populaire n’a pas résolu la crise ; il a modifié le rapport des Français à l’État et au travail.</p>
<p><strong>Fil rouge.</strong> Deux institutions ont traversé toute cette période sans dépendre des majorités : l’armée et l’école. Elles engagent l’avenir plus sûrement qu’un décret-loi — et c’est là que la France joue, sans le savoir, l’année 1940.</p>

<h3>1. Compter ses hommes : la contrainte démographique</h3>
<p>Toute la politique militaire française part d’un chiffre : <strong>1,4 million de morts</strong> en 1914-1918, et surtout les <strong>« classes creuses »</strong>, ces générations nées pendant la guerre, deux fois moins nombreuses, qui atteignent l’âge du service vers 1935-1939. Face à une Allemagne de 65 millions d’habitants contre 41 millions de Français, la doctrine adopte une conclusion simple : <strong>économiser le sang</strong>, substituer la puissance de feu et le béton au nombre.</p>
<p>La durée du <strong>service militaire</strong> raconte la même histoire. Ramenée de trois ans à <strong>dix-huit mois en 1923</strong>, puis à <strong>un an en 1928</strong>, elle laisse une armée d’active squelettique : l’essentiel de la force réside dans les réservistes, donc dans la <strong>mobilisation</strong>, qui demande plusieurs semaines. En mars 1935, face au réarmement allemand, le service est <strong>rétabli à deux ans</strong>.</p>

<h3>2. La ligne Maginot : une logique, pas une lâcheté</h3>
<p>Les crédits de fortification sont votés en janvier 1930, à l’initiative du ministre de la Guerre <strong>André Maginot</strong>. L’ouvrage n’a pas pour but de rendre la France invulnérable : il doit <strong>couvrir la mobilisation</strong>, protéger les régions industrielles de Lorraine et du Nord-Est reprises en 1918, et permettre de tenir la frontière avec peu d’hommes afin d’en libérer d’autres pour la manœuvre. <!-- A VERIFIER : date exacte et montant de la loi de crédits de 1930 --></p>
<p>Deux failles, pourtant. La fortification ne se prolonge pas le long de la <strong>frontière belge</strong> : le coût est immense, le terrain peu favorable, la zone très industrialisée, et la Belgique est alors une alliée qu’on ne peut se résoudre à abandonner derrière un mur — elle redeviendra neutre en 1936. Ensuite, le massif des <strong>Ardennes</strong> est jugé difficilement praticable par les blindés, appréciation partagée par <strong>Philippe Pétain</strong>, qui en tire l’idée qu’il suffit de forces légères pour l’interdire. C’est précisément là que passera la percée allemande de mai 1940.</p>
<p>La doctrine correspond à cette architecture : la <strong>« bataille méthodique »</strong>, héritée de 1918, privilégie le feu, la préparation d’artillerie et le contrôle étroit du mouvement. Les propositions de <strong>Charles de Gaulle</strong> dans <em>Vers l’armée de métier</em> (1934), reprises par le député <strong>Paul Reynaud</strong>, sont écartées : elles heurtent la tradition républicaine de la nation en armes, coûtent cher et supposent une armée de professionnels jugée politiquement suspecte. Les historiens (<strong>Robert Doughty</strong>, <strong>Martin Alexander</strong>) ont montré que 1940 s’explique moins par un manque de chars — la France en possède beaucoup — que par leur <strong>emploi dispersé</strong> et par la lenteur de la chaîne de commandement.</p>

<h3>3. L’école : ouvrir sans unifier</h3>
<p>L’école de la III<sup>e</sup> République est organisée en <strong>deux ordres parallèles</strong>, et non en degrés successifs : d’un côté l’enseignement <strong>primaire</strong>, gratuit, avec son prolongement (cours complémentaires, écoles primaires supérieures) menant à l’école normale ; de l’autre l’enseignement <strong>secondaire</strong>, payant, avec ses propres petites classes, menant au baccalauréat et à l’université. On ne passe pratiquement pas de l’un à l’autre : la barrière est sociale autant que pédagogique.</p>
<p>La <strong>gratuité progressive du secondaire</strong>, mise en place classe après classe au tournant des années 1930, fait sauter l’obstacle financier. Mais elle ne supprime pas la dualité des filières, que les <strong>Compagnons de l’Université nouvelle</strong>, anciens combattants réformateurs, dénonçaient depuis 1918 en réclamant l’<strong>« école unique »</strong>. La conséquence est double : le nombre de lycéens augmente nettement, mais le recrutement social du baccalauréat se modifie lentement.</p>

<h3>4. Jean Zay, ou la réforme interrompue</h3>
<p>Ministre de l’Éducation nationale de juin 1936 à septembre 1939, <strong>Jean Zay</strong>, radical de 31 ans, porte le projet le plus cohérent de l’entre-deux-guerres. La loi du 9 août 1936 <strong>prolonge la scolarité obligatoire jusqu’à 14 ans</strong>. Il introduit des <strong>classes d’orientation</strong> expérimentales en sixième pour retarder le choix de filière, fait entrer le sport et les activités dirigées dans l’emploi du temps, soutient la recherche — dont sortira le CNRS en 1939 — et lance le projet d’un festival de cinéma à Cannes. Son projet global de réforme de l’enseignement n’aboutit pas : la guerre l’interrompt.</p>
<p>Le destin de Zay dit aussi la violence du temps : arrêté en 1940, condamné par Vichy pour désertion à l’issue d’un procès politique, il est assassiné par des miliciens en juin 1944.</p>
<p><strong>Fil rouge.</strong> Ce cours s’achève sur une France affaiblie mais non totalitaire : elle a connu la crise, l’instabilité et les ligues, sans que le régime parlementaire soit renversé. C’est cette différence qu’il faut désormais mesurer, en regardant comment, ailleurs en Europe, des régimes ont détruit le pluralisme — à commencer par l’URSS de Staline.</p>

<h3>1. Une succession sans règle</h3>
<p>Quand <strong>Lénine</strong> meurt le <strong>21 janvier 1924</strong>, aucun texte ne prévoit qui doit lui succéder : le parti bolchevique n’a pas de procédure de dévolution du pouvoir. La compétition se joue donc à l’intérieur d’un cercle étroit — <strong>Trotski</strong>, auréolé de la création de l’Armée rouge, <strong>Zinoviev</strong> et <strong>Kamenev</strong>, dirigeants de Leningrad et de Moscou, <strong>Boukharine</strong>, théoricien de la NEP, et <strong>Staline</strong>, <strong>secrétaire général</strong> du parti depuis avril 1922.</p>
<p>Lénine avait pourtant averti. Dans les notes dictées fin 1922 et début 1923, connues sous le nom de <strong>« Testament »</strong>, il juge Staline trop brutal et suggère de le déplacer du secrétariat. Le texte est lu aux délégations du congrès de mai 1924, puis écarté : les autres dirigeants, qui craignent davantage Trotski, préfèrent maintenir Staline. C’est la première des erreurs d’appréciation qui jalonnent cette séquence.</p>

<h3>2. L’appareil comme arme</h3>
<p>Le secrétariat général semble une fonction de bureau : il enregistre, affecte, nomme. C’est précisément sa force. Staline contrôle la <strong>distribution des postes</strong> dans un parti devenu l’unique voie d’accès aux responsabilités, et place dans les fédérations régionales des hommes qui lui devront leur carrière. Avec la <strong>« promotion Lénine »</strong> de 1924 — plus de 200 000 adhésions ouvrières encadrées par l’appareil —, il façonne une base militante peu politisée, hostile aux querelles doctrinales des vieux bolcheviks.</p>
<p>Un second instrument vient de Lénine lui-même : l’<strong>interdiction des fractions</strong>, votée au X<sup>e</sup> congrès en mars 1921. Toute opposition organisée devient une faute disciplinaire. Il suffit donc à Staline de faire qualifier ses adversaires de « fractionnistes » pour les exclure sans débat public. Le mécanisme est décisif : ce n’est pas le débat d’idées qui tranche, c’est la procédure interne.</p>

<h3>3. Trois batailles successives</h3>
<p>Staline ne combat jamais tout le monde à la fois. De 1923 à 1925, allié à Zinoviev et Kamenev, il isole <strong>Trotski</strong>, accusé de vouloir imposer une <strong>« révolution permanente »</strong> hasardeuse. De 1926 à 1927, appuyé cette fois sur Boukharine et la droite du parti, il écrase l’<strong>« opposition unifiée »</strong> que Trotski, Zinoviev et Kamenev forment trop tard : tous sont exclus en décembre 1927, Trotski est déporté à Alma-Ata en 1928, puis expulsé d’URSS en 1929.</p>
<p>De 1928 à 1929, il se retourne enfin contre ses alliés de la veille — <strong>Boukharine</strong>, <strong>Rykov</strong>, <strong>Tomski</strong> — désignés comme la <strong>« déviation de droite »</strong> pour avoir voulu prolonger la NEP. L’enjeu doctrinal est le <strong>« socialisme dans un seul pays »</strong> : puisque la révolution mondiale tarde, l’URSS doit bâtir seule sa puissance. La formule a l’avantage d’être à la fois une théorie et un programme national.</p>

<p>Un facteur extérieur accélère le durcissement : l’<strong>« alerte de guerre » de 1927</strong>. L’écrasement des communistes chinois à Shanghai, la rupture des relations diplomatiques par Londres en mai, puis l’assassinat de l’ambassadeur soviétique à Varsovie en juin donnent à croire que l’URSS est menacée d’une attaque imminente. La population se rue sur les magasins ; les dirigeants y voient la confirmation que le pays doit s’industrialiser sans délai, et que toute opposition devient une trahison en temps de péril. L’argument de l’encerclement, réutilisé pendant vingt-cinq ans, apparaît ici pour la première fois dans sa pleine efficacité.</p>

<h3>4. La crise des grains, ou le prétexte du tournant</h3>
<p>Une crise économique transforme la victoire politique en révolution d’en haut. À l’hiver <strong>1927-1928</strong>, les paysans, faute de produits industriels à acheter et devant des prix d’achat trop bas, livrent moins de céréales : les villes et l’armée risquent la disette. Staline se rend en <strong>Sibérie en janvier 1928</strong> et impose des <strong>« méthodes extraordinaires »</strong> — réquisitions, poursuites pour spéculation. Le marché de la NEP est de fait suspendu.</p>
<p>Le choix est alors politique : revenir à l’équilibre marchand, comme le veut Boukharine, ou briser l’autonomie paysanne pour financer l’industrie. Staline choisit la seconde voie et proclame en novembre 1929 l’<strong>« année du grand tournant »</strong>. En décembre, son cinquantième anniversaire donne lieu aux premières manifestations organisées du culte. Le pouvoir personnel est établi, mais son contenu reste à inventer.</p>
<p><strong>Fil rouge.</strong> Ce tournant a un nom et un instrument : la collectivisation des campagnes, qui doit fournir à la fois les grains, les devises et la main-d’œuvre de l’industrialisation.</p>

    contenu: `
<h3>1. Une décision politique, non une nécessité technique</h3>
<p>Fin 1929, le pouvoir décide de <strong>collectiviser</strong> massivement les campagnes : les terres, le bétail et les outils sont versés dans des <strong>kolkhozes</strong> — fermes collectives — ou des sovkhozes d’État. L’objectif n’est pas d’abord agronomique. Il s’agit de rendre le <strong>prélèvement</strong> des grains automatique : là où l’État devait acheter des millions de paysans, il n’aura plus qu’à imposer des livraisons à quelques milliers de kolkhozes. Staline le dit sans détour au comité central : la paysannerie doit acquitter un <strong>tribut</strong> pour financer l’industrie.</p>
<p>Le 27 décembre 1929, il annonce la <strong>« liquidation des koulaks en tant que classe »</strong>. Le mot « koulak », qui désignait un paysan aisé, devient une catégorie administrative élastique : est koulak celui que la commission locale désigne. De 1930 à 1931, environ <strong>1,8 million de personnes</strong> sont déportées vers des « peuplements spéciaux » de l’Oural, de Sibérie ou du Grand Nord, où la mortalité est très élevée.</p>

<h3>2. Résistances et reculs tactiques</h3>
<p>Les campagnes résistent : l’OGPU recense plus de <strong>13 000 troubles</strong> pour la seule année 1930, souvent menés par des femmes — les « révoltes de bonnes femmes », <em>babi bounty</em>, que les autorités hésitent à réprimer. Surtout, les paysans <strong>abattent leur bétail</strong> plutôt que de le livrer — le cheptel bovin et équin met vingt ans à s’en relever. Devant l’ampleur du désordre, Staline publie le 2 mars 1930 l’article <strong>« Le vertige du succès »</strong>, où il impute les excès au zèle des cadres locaux. Des millions de paysans quittent aussitôt les kolkhozes, avant que la pression ne reprenne : en 1937, plus de 90 % des exploitations sont collectivisées.</p>
<p>Le contrôle passe par des institutions nouvelles : les <strong>stations de machines et tracteurs</strong> (MTS), qui détiennent le matériel et surveillent les kolkhozes ; la <strong>loi du 7 août 1932</strong>, dite « loi des épis », qui punit de dix ans de camp, voire de mort, le vol de la propriété socialiste ; enfin le <strong>passeport intérieur</strong> (décembre 1932), refusé aux ruraux, qui les attache à la terre.</p>

<p>Le kolkhoze lui-même organise la dépendance. Le paysan n’y touche pas un salaire mais des <strong>journées de travail</strong> — les <em>troudodni</em> —, payées en nature sur ce qui <strong>reste</strong> une fois acquittées les livraisons obligatoires à l’État, la rémunération des MTS et la réserve de semences. Le producteur est donc payé en dernier, sur le résidu : quand la récolte est faible, sa part tend vers zéro. Seul le <strong>lopin individuel</strong> attenant à l’isba, toléré à partir de 1935, lui permet de survivre et fournira longtemps une part majeure des légumes, du lait et de la viande du pays.</p>

<h3>3. La famine de 1932-1933</h3>
<p>La conjonction de la désorganisation, de l’abattage du bétail et de <strong>plans de collecte maintenus malgré des récoltes insuffisantes</strong> provoque une famine massive en 1932-1933. Les régions les plus frappées sont l’<strong>Ukraine</strong>, le <strong>Kouban</strong>, le bassin de la Volga, la Sibérie occidentale et le <strong>Kazakhstan</strong>. Le bilan, estimé à partir des archives et des recensements, se situe entre <strong>5 et 7 millions de morts</strong>, dont près de 4 millions en Ukraine et environ 1,5 million au Kazakhstan — soit, pour la population kazakhe nomade, la perte proportionnellement la plus lourde.</p>
<p>Des décisions aggravent délibérément la crise : blocage des villages « en retard » sur leurs livraisons, interdiction faite aux paysans ukrainiens de gagner les villes en janvier 1933, poursuite des exportations de céréales. L’État savait et n’a pas cessé de prélever.</p>

<h3>4. Le débat sur la qualification : le Holodomor</h3>
<p>La nature de cette famine fait l’objet d’une <strong>controverse historiographique</strong> majeure. L’Ukraine et de nombreux États la qualifient de <strong>génocide</strong> — le terme ukrainien <em>Holodomor</em> signifie « extermination par la faim ». <strong>Robert Conquest</strong> a soutenu dès 1986 la thèse d’une famine délibérément provoquée contre la nation ukrainienne. <strong>Andrea Graziosi</strong> défend une position intermédiaire : famine née des politiques de collectivisation, elle devient, à partir de l’automne 1932, un instrument de <strong>châtiment national</strong> visant les Ukrainiens et leurs cadres. <strong>R. W. Davies</strong> et <strong>Stephen Wheatcroft</strong> insistent au contraire sur l’aveuglement idéologique et les objectifs de collecte, sans intention exterminatrice. <strong>Nicolas Werth</strong> parle de crime contre l’humanité et souligne la dimension antiukrainienne sans trancher pour le mot génocide.</p>
<p>Le désaccord porte sur l’<strong>intention</strong>, difficile à établir, et sur la définition juridique du génocide, qui suppose la volonté de détruire un groupe comme tel. Les faits, eux, ne sont plus discutés depuis l’ouverture des archives.</p>
<p><strong>Fil rouge.</strong> Ces millions de morts ont une contrepartie voulue : les grains, les devises et les bras qui alimentent la construction accélérée d’une industrie lourde.</p>
`,

<h3>1. Planifier : un système de contrainte plus qu’un calcul</h3>
<p>Le <strong>premier plan quinquennal</strong> couvre 1928-1932 ; il sera déclaré accompli « en quatre ans et trois mois ». Le <strong>Gosplan</strong> fixe des objectifs chiffrés par branche, avec une priorité absolue au <strong>groupe A</strong>, l’industrie lourde : charbon, acier, électricité, machines-outils. En 1929-1930, ces objectifs sont revus fortement à la hausse, au-delà de toute faisabilité technique.</p>
<p>Le plan fonctionne alors moins comme une prévision que comme un <strong>ordre de mobilisation</strong>. Ne pas atteindre la cible n’est pas une erreur de gestion mais une faute politique : les directeurs gonflent les résultats, cachent des stocks, se volent mutuellement des matériaux. Le système produit ainsi sa propre opacité, que les historiens de l’économie soviétique (<strong>R. W. Davies</strong>, <strong>Mark Harrison</strong>) ont documentée à partir des archives.</p>

<h3>2. D’où vient l’argent</h3>
<p>Sans capitaux étrangers durables ni marché financier, l’investissement est prélevé sur la population : céréales arrachées aux campagnes et exportées, <strong>emprunts d’État obligatoires</strong> retenus sur les salaires, monopole de la vodka, vente d’or et d’œuvres d’art des musées. La consommation est comprimée, le <strong>rationnement</strong> rétabli de 1929 à 1935.</p>
<p>Un apport extérieur compte cependant : la <strong>technologie occidentale</strong>. Des cabinets américains conçoivent les grandes usines — la firme d’<strong>Albert Kahn</strong> dessine ainsi l’usine de tracteurs de Stalingrad et des centaines d’autres installations —, tandis que des milliers d’ingénieurs étrangers viennent travailler en URSS, souvent au plus fort de la crise mondiale de 1929, qui rend le modèle soviétique attirant.</p>

<h3>3. Les hommes du plan</h3>
<p>La main-d’œuvre vient des campagnes : des millions de paysans déracinés deviennent ouvriers en quelques semaines, sans qualification, logés dans des baraquements, changeant sans cesse d’usine. L’État répond par la <strong>discipline</strong> — livret de travail, sanctions pour absentéisme — et par l’émulation.</p>
<p>Le <strong>stakhanovisme</strong> naît dans la nuit du <strong>30 au 31 août 1935</strong>, quand le mineur <strong>Alexeï Stakhanov</strong> extrait 102 tonnes de charbon en moins de six heures. Le record, préparé et assisté, devient un modèle national : les stakhanovistes reçoivent primes, logements, honneurs. La mesure divise plus qu’elle ne mobilise — elle sert à relever les normes de production pour tous, ce que les ouvriers ordinaires comprennent aussitôt.</p>
<p>Le régime cherche aussi des coupables à ses échecs : le <strong>procès de Chakhty</strong> en 1928, puis celui du « Parti industriel » en 1930, accusent des ingénieurs de sabotage. La conséquence est durable : la peur remplace l’expertise, et personne n’ose signaler un objectif irréalisable.</p>

<p>Le bouleversement est aussi démographique : la population urbaine passe d’environ <strong>26 millions d’habitants en 1926 à 56 millions en 1939</strong>. Des villes entières sortent de terre, sans logements ni égouts suffisants. Le <strong>deuxième plan</strong> (1933-1937), moins délirant que le premier, consolide l’acquis : le rationnement est levé en 1935, la production de biens de consommation reprend modestement, et Staline peut lancer en novembre 1935 une formule aussitôt reprise partout :</p>
<blockquote>La vie est devenue meilleure, camarades, la vie est devenue plus gaie.</blockquote>
<p>La phrase est authentique et son succès révélateur : elle ne décrit pas la situation, elle ordonne de la percevoir ainsi.</p>

<h3>4. Résultats et coûts</h3>
<p>Le bilan matériel est réel : production de charbon, d’acier, d’électricité et de machines multipliée en une décennie, complexe sidérurgique de <strong>Magnitogorsk</strong>, barrage du <strong>Dniepr</strong>, combinat du Kouznetsk, métro de Moscou en 1935. À la veille de la guerre, l’URSS dispose d’une base industrielle lourde qui lui permettra de produire des chars en masse et de déplacer ses usines vers l’Oural en 1941.</p>
<p>Le <strong>troisième plan</strong>, lancé en 1938, est d’emblée réorienté vers l’armement et vers l’implantation d’usines de réserve à l’est de la Volga et dans l’Oural, hors de portée d’une invasion venue de l’ouest. Cette décision, prise pour des raisons militaires trois ans avant l’attaque allemande, se révélera décisive en 1941-1942.</p>
<p>Le coût, lui, est triple : niveau de vie effondré, campagnes exsangues, et recours massif au <strong>travail forcé</strong> pour les chantiers que nul ne rejoindrait volontairement — canal de la mer Blanche, mines de la Kolyma, coupes forestières du Grand Nord. L’industrialisation stalinienne n’est pas seulement rapide : elle est structurellement liée à la contrainte.</p>
<p><strong>Fil rouge.</strong> Ce travail forcé a une administration, un budget et des objectifs de production. Elle porte un sigle : le Goulag.</p>

    contenu: `
<h3>1. Naissance d’une administration</h3>
<p>Les camps soviétiques ne datent pas de Staline : dès 1918, la guerre civile voit naître des camps de concentration, et le monastère des <strong>Solovki</strong>, en mer Blanche, devient en 1923 le prototype du camp à vocation économique. Le tournant est administratif : en <strong>1930</strong> est créée la <strong>Direction générale des camps</strong>, en russe <em>Glavnoïe oupravlenie lagereï</em>, dont l’acronyme — <strong>GOULAG</strong> — finira par désigner l’ensemble du système.</p>
<p>Ce système est d’emblée pensé comme un <strong>instrument économique</strong>. L’URSS veut exploiter des régions que nul n’habite volontairement : l’or de la <strong>Kolyma</strong>, le charbon de <strong>Vorkouta</strong>, le nickel de <strong>Norilsk</strong>, le bois du Grand Nord. Le détenu y est une main-d’œuvre déplaçable, nourrie selon son rendement.</p>

<h3>2. Qui sont les détenus</h3>
<p>Contrairement à une idée répandue, les « politiques » condamnés au titre de l’<strong>article 58</strong> du code pénal ne forment pas toujours la majorité. On trouve aussi des <strong>condamnés de droit commun</strong>, qui dominent la hiérarchie interne des camps, et une masse de gens frappés par des lois répressives ordinaires : retards répétés au travail, glanage d’épis, vol de quelques kilos de pommes de terre.</p>
<p>Il faut en outre distinguer le camp du <strong>« peuplement spécial »</strong> : les koulaks déportés en 1930-1931 ne sont pas détenus derrière des barbelés, mais assignés à résidence dans des villages du Nord ou de Sibérie, sous surveillance, avec une mortalité parfois supérieure à celle des camps. Au total, selon les statistiques établies depuis l’ouverture des archives, quelque <strong>18 millions de personnes</strong> passent par les camps et colonies entre 1930 et 1953, auxquelles s’ajoutent environ 6 millions de déportés spéciaux. Le nombre de détenus présents simultanément dépasse 1,5 million à la veille de la guerre.</p>

<h3>3. Mourir au Goulag</h3>
<p>La mortalité varie fortement selon les années et les lieux. Elle culmine lors des grandes crises alimentaires : 1933, puis surtout <strong>1942-1943</strong>, où elle atteint environ un détenu sur cinq. Les archives recensent près de <strong>1,6 million de décès</strong> en détention entre 1930 et 1953, chiffre qui n’inclut ni les exécutions hors camp, ni les morts pendant les transports, ni celles qui suivent une libération pour cause de maladie — pratique courante qui améliorait les statistiques.</p>
<p>Une distinction s’impose : le Goulag n’est pas un système d’<strong>extermination</strong> au sens des camps nazis de mise à mort. On n’y entre pas pour être tué, mais pour travailler ; on y meurt de froid, de faim, d’épuisement et de violence. Cette différence de finalité n’atténue pas la responsabilité : elle définit un autre type de crime.</p>

<p>Le quotidien obéit à une règle simple et meurtrière : la <strong>ration dépend du rendement</strong>. Qui n’atteint pas sa norme mange moins, donc s’affaiblit, donc produit moins le lendemain — la spirale porte un nom dans l’argot des camps, celui du « crevard ». Pour y échapper, détenus et gardiens s’accordent sur la <strong>falsification des bordereaux</strong>, la <em>toufta</em>, qui gonfle le travail déclaré : le système ment donc aussi à lui-même sur sa propre production. Après 1945, le Goulag atteint son apogée, avec plus de deux millions et demi de détenus au début des années 1950, avant que la mort de Staline, en mars 1953, n’ouvre les amnisties et les grandes révoltes de camps.</p>

<h3>4. Une rentabilité douteuse</h3>
<p>Le paradoxe est que ce vaste appareil productif <strong>produit mal</strong>. Une main-d’œuvre sous-alimentée, sans qualification ni motivation, encadrée par des gardiens eux-mêmes peu qualifiés, fournit un travail de faible rendement ; les chantiers absorbent des investissements considérables pour des résultats médiocres. <strong>Oleg Khlevniouk</strong> a montré que les dirigeants soviétiques en étaient conscients dès les années 1940 sans pouvoir renoncer à un système devenu une pièce de l’économie et de l’administration.</p>
<p>La connaissance de ce monde a d’abord reposé sur les <strong>témoignages</strong> — <em>L’Archipel du Goulag</em> d’Alexandre Soljenitsyne, publié en 1973, en est le plus célèbre, mais il s’agit d’une « expérience littéraire » construite sur des récits, non d’une étude d’archives. Depuis 1991, les fonds du NKVD ont permis d’en établir les effectifs, les budgets et les mouvements : les ordres de grandeur ont été précisés, la réalité du système confirmée.</p>
<p><strong>Fil rouge.</strong> Reste une question : pourquoi, en 1937-1938, la machine répressive s’emballe-t-elle au point de frapper le parti, l’armée et le NKVD eux-mêmes ?</p>

    contenu: `
<h3>1. Du meurtre de Kirov aux procès de Moscou</h3>
<p>Le <strong>1<sup>er</sup> décembre 1934</strong>, <strong>Sergueï Kirov</strong>, dirigeant du parti à Leningrad, est assassiné. Le jour même, une procédure d’exception est instituée : instruction en dix jours, pas d’avocat, pas de recours, exécution immédiate. L’événement sert de matrice à un récit — un complot terroriste, dirigé de l’étranger par Trotski, aurait infiltré le parti.</p>
<p>Trois <strong>procès publics</strong> se tiennent à Moscou : en <strong>août 1936</strong> contre Zinoviev, Kamenev et quatorze autres ; en janvier 1937 contre Piatakov et le prétendu « centre trotskiste parallèle » ; en <strong>mars 1938</strong> contre Boukharine, Rykov et l’ancien chef du NKVD Iagoda. Les accusés avouent des crimes invraisemblables — sabotage, espionnage, projets d’assassinat — obtenus par la torture, dont le Politburo autorisera explicitement l’usage. Le procureur <strong>Vychinski</strong> requiert la mort avec une violence verbale qui fait partie du dispositif.</p>

<h3>2. L’armée décapitée</h3>
<p>En juin 1937, le maréchal <strong>Toukhatchevski</strong> et sept généraux sont jugés à huis clos et fusillés pour complot avec l’Allemagne. La purge s’étend ensuite à toute la hiérarchie : trois maréchaux sur cinq, la quasi-totalité des commandants d’armée et de corps d’armée disparaissent. Les conséquences se mesureront en <strong>1941</strong>, quand l’Armée rouge affrontera l’invasion allemande avec des cadres inexpérimentés et terrorisés par l’initiative.</p>

<h3>3. Les opérations de masse : le cœur du système</h3>
<p>L’essentiel de la Grande Terreur n’est pourtant pas dans les procès spectaculaires. Il tient dans des <strong>ordres secrets</strong>. L’<strong>ordre 00447</strong>, du 30 juillet 1937, vise les « anciens koulaks, criminels et autres éléments antisoviétiques » : chaque région reçoit un <strong>quota</strong> chiffré, réparti en deux catégories — la première signifiant l’exécution, la seconde le camp. Des <strong>troïkas</strong>, commissions de trois hommes, condamnent par milliers sans audience véritable.</p>
<p>S’y ajoutent les <strong>opérations nationales</strong> visant des minorités soupçonnées de liens avec l’étranger : Polonais, Allemands, Lettons, Coréens. Au total, entre août 1937 et novembre 1938, environ <strong>1,6 million d’arrestations</strong> et près de <strong>682 000 condamnations à mort</strong> sont enregistrées — soit près de mille exécutions par jour pendant seize mois.</p>
<p>Le mécanisme social est aussi important que l’ordre initial : des responsables locaux <strong>demandent des quotas supplémentaires</strong> pour prouver leur vigilance, des voisins dénoncent pour obtenir un logement, des accusés livrent des noms pour faire cesser les coups. La terreur se nourrit d’elle-même.</p>

<h3>4. Qui décide ? Un débat historiographique</h3>
<p>La question a longtemps divisé les historiens. <strong>Robert Conquest</strong> voyait dans la Terreur le produit de la volonté d’un seul homme. Les « révisionnistes », comme <strong>J. Arch Getty</strong>, ont insisté sur le désordre, les rivalités d’appareil et les dynamiques locales, jusqu’à décrire un « dictateur faible ». L’ouverture des archives a largement tranché : les ordres, les quotas et les <strong>listes nominatives</strong> de condamnés signées par Staline et ses proches établissent l’impulsion venue du sommet, tandis que les mécanismes locaux expliquent l’ampleur et le désordre de l’exécution. <strong>Oleg Khlevniouk</strong> et <strong>Nicolas Werth</strong> proposent cette synthèse : une terreur décidée en haut, amplifiée en bas.</p>
<p>Le parti lui-même est décimé. Sur les 1 966 délégués du XVII<sup>e</sup> congrès de 1934, célébré comme le « congrès des vainqueurs », plus de 1 100 sont arrêtés dans les années suivantes, et près des trois quarts des membres du comité central élu alors sont fusillés — chiffres révélés par Khrouchtchev dans son rapport de 1956 et confirmés depuis. Le NKVD n’est pas épargné : les exécutants de 1937 sont abattus en 1938-1939 par leurs successeurs, ce qui supprime les témoins. Les places vacantes sont occupées par de très jeunes cadres, formés par le régime et promus d’un coup à trente ans : cette génération — celle de Brejnev ou de Kossyguine — dirigera l’URSS jusque dans les années 1980.</p>
<p>Elle s’arrête comme elle avait commencé, par décision : en novembre 1938, <strong>Ejov</strong> est remplacé par <strong>Beria</strong>, les « excès » sont imputés aux exécutants, et Ejov est fusillé en 1940. Le régime a détruit sa propre élite révolutionnaire et promu une génération de jeunes cadres qui lui devront tout.</p>
<p><strong>Fil rouge.</strong> Comment un pouvoir capable de cela obtient-il, en même temps, l’adhésion, l’enthousiasme et parfois la sincérité de millions de citoyens ? C’est l’objet de la dernière séance.</p>

    contenu: `
<h3>1. Fabriquer le Vojd</h3>
<p>Le <strong>culte de Staline</strong> s’organise à partir de son cinquantième anniversaire, en décembre 1929, et se déploie dans toutes les formes disponibles : portraits, statues, poèmes, chansons, noms de villes et d’usines. Le slogan « Staline, c’est Lénine aujourd’hui » assure la filiation, indispensable dans un régime où la légitimité vient de la révolution d’Octobre.</p>
<p>L’image est corrigée en permanence. Les <strong>photographies sont retouchées</strong> pour effacer les dirigeants tombés en disgrâce ; les manuels sont réécrits. En 1938 paraît le <strong>Précis d’histoire du Parti communiste (bolchevik)</strong>, diffusé à des dizaines de millions d’exemplaires, qui fixe la version officielle du passé : Trotski y devient un agent de l’étranger, Staline le compagnon constant de Lénine. Le contrôle est institutionnel : censure du <strong>Glavlit</strong>, agitprop, monopole de la presse et de la radio.</p>

<h3>2. Un art d’État</h3>
<p>Le congrès des écrivains soviétiques de <strong>1934</strong> consacre le <strong>réalisme socialiste</strong> : l’artiste doit représenter la réalité « dans son développement révolutionnaire », c’est-à-dire telle qu’elle devrait être. Peinture, roman, cinéma et architecture célèbrent la construction, la moisson et le chef. Cette esthétique n’est pas seulement décorative : elle propose un <strong>modèle de conduite</strong>, celui du militant, du stakhanoviste, du pilote ou de l’explorateur polaire — héros très populaires des années 1930.</p>

<h3>3. L’« homme nouveau » et le retour des valeurs anciennes</h3>
<p>Former un homme nouveau suppose d’encadrer toute la vie sociale : <strong>Pionniers</strong> pour les enfants, <strong>Komsomol</strong> pour les jeunes, syndicats, culture physique, parades sur la place Rouge. L’alphabétisation progresse réellement et massivement, ce qui constitue l’un des rares acquis incontestés de la période.</p>
<p>Mais, à partir du milieu des années 1930, le régime opère un retour partiel aux <strong>valeurs traditionnelles</strong> : l’enseignement de l’histoire nationale est rétabli en 1934, les héros russes — Alexandre Nevski, Pierre le Grand — sont réhabilités, la famille est valorisée et l’avortement, légal depuis 1920, est <strong>interdit en 1936</strong>. Le sociologue Nicolas Timasheff a nommé ce mouvement la « grande retraite ». L’État découvre que le patriotisme et l’ordre familial mobilisent mieux que l’utopie révolutionnaire.</p>
<p>Le contraste culmine en <strong>décembre 1936</strong> : la nouvelle <strong>Constitution</strong>, présentée comme « la plus démocratique du monde », proclame le suffrage universel et les libertés, au moment précis où s’engage la Grande Terreur. Ce n’est pas une contradiction accidentelle : la façade juridique fait partie du système.</p>

<p>La diffusion passe par trois canaux nouveaux. L’<strong>école</strong> d’abord : l’alphabétisation, très minoritaire dans l’Empire russe, devient quasi générale en une génération, et c’est sur des lecteurs neufs que s’exerce la propagande. Le <strong>cinéma</strong> ensuite, que Lénine tenait, selon le témoignage de Lounatcharski, pour le plus important de tous les arts : projections itinérantes dans les campagnes, grandes fresques historiques dans les villes. La <strong>radio</strong> enfin, diffusée par haut-parleurs sur les places et dans les usines plutôt que par postes individuels — un choix technique qui dit tout, puisqu’on ne change pas de station sur un haut-parleur public.</p>

<h3>4. Croire, faire semblant, s’arranger</h3>
<p>Que croyaient les Soviétiques ? La question a renouvelé l’historiographie. <strong>Sheila Fitzpatrick</strong> a décrit un quotidien fait d’adaptation, de débrouille et de résistances passives, où l’on apprend à manier le vocabulaire officiel. <strong>Stephen Kotkin</strong> a montré, à partir de Magnitogorsk, que « parler bolchevique » était moins une conviction qu’une compétence sociale nécessaire pour obtenir un logement ou une promotion. <strong>Jochen Hellbeck</strong>, étudiant des journaux intimes, a mis en évidence des individus qui travaillaient sincèrement à se transformer eux-mêmes selon le modèle officiel.</p>
<p>Le culte se dépose enfin dans les objets et les lieux : portrait du chef dans chaque bureau, chaque école et chaque atelier, « coin rouge » aménagé dans les logements collectifs, buste sur la place du village. La présence de l’image rend l’absence d’image remarquable, et donc suspecte.</p>
<p>Ces approches ne s’excluent pas : dans une même vie, on pouvait dénoncer un voisin, pleurer un proche arrêté, croire à la construction du socialisme et se procurer des chaussures au marché noir. C’est cette épaisseur que l’expression « régime totalitaire » risque d’aplatir si on l’emploie sans précaution — le mot décrit un projet de contrôle total, non une société entièrement contrôlée.</p>
<p><strong>Fil rouge.</strong> Ce projet de transformation de l’homme se retrouve, avec d’autres fondements et une autre cible, dans les régimes fascistes européens : c’est là qu’il faut porter la comparaison.</p>
