<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Clio — culture historique quotidienne : mini-cours et QCM, hors ligne.">
<title>Clio — culture historique quotidienne</title>

<!--
  =====================================================================
  CLIO — application personnelle de culture historique quotidienne
  ---------------------------------------------------------------------
  Fichier unique, autonome, hors ligne. HTML + CSS + JS « vanilla ».
  Aucune dependance obligatoire : les polices Google Fonts sont
  chargees de maniere non bloquante et remplacees par des polices
  systeme si le reseau est absent.

  Organisation du fichier :
    1. CSS (charte Art deco)
    2. Structure HTML des trois onglets
    3. const COURS  — TOUT le contenu pedagogique (cours, seances, QCM)
    4. Logique      — etat, progression, rendu, quiz, correction
  =====================================================================
-->

<!-- Polices : chargement non bloquant. Hors ligne, les replis systeme
     definis dans --police-titre / --police-texte prennent le relais. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap">

<style>
/* =====================================================================
   1. CHARTE ART DECO — annees 1920
   Noir profond, or/laiton, creme (papier ancien), accents bordeaux et
   vert bouteille. Geometrie : eventails, chevrons, lignes rayonnantes.
   ===================================================================== */
:root{
  --noir:#0d0c0a;
  --noir-2:#14120e;        /* fond des cartes */
  --noir-3:#1c1913;        /* fond des elements actifs */
  --or:#c9a227;
  --or-clair:#e6c96f;
  --laiton:#8a7233;
  --creme:#f3e9d6;
  --creme-2:#c8bda6;       /* texte secondaire */
  --bordeaux:#8c2432;
  --vert:#1f4a3c;
  --rouge-faux:#e0665f;
  --vert-juste:#7fc09b;

  --police-titre:'Poiret One','Josefin Sans','Century Gothic',
                 'Futura','Trebuchet MS',sans-serif;
  --police-texte:'Playfair Display','Libre Baskerville',Georgia,
                 'Times New Roman',serif;

  --rayon:2px;             /* l'Art deco aime les angles nets */
  --large:min(100%,720px);
  --barre:62px;            /* hauteur de la barre d'onglets */
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--noir);
  color:var(--creme);
  font-family:var(--police-texte);
  font-size:17px;
  line-height:1.72;
  min-height:100vh;
  position:relative;
}
/* Rayonnement discret derriere l'en-tete, facon affiche 1925. Le degrade
   de masque evite toute limite franche en bas des rayons. */
body::before{
  content:"";position:absolute;top:0;left:0;right:0;height:300px;z-index:-1;
  pointer-events:none;
  background:repeating-conic-gradient(from 180deg at 50% 0%,
    rgba(201,162,39,.075) 0deg 2.5deg, transparent 2.5deg 9deg);
  -webkit-mask-image:linear-gradient(#000 10%,transparent 100%);
  mask-image:linear-gradient(#000 10%,transparent 100%);
}
img{max-width:100%}
h1,h2,h3,h4{font-family:var(--police-titre);font-weight:400;line-height:1.25;margin:0}
p{margin:0 0 1em}
a{color:var(--or-clair)}
button{font:inherit;color:inherit}

/* --- Ossature ------------------------------------------------------ */
.app{width:var(--large);margin:0 auto;padding:0 16px calc(var(--barre) + 28px + env(safe-area-inset-bottom));}
.vue{display:none}
.vue.active{display:block}

/* --- En-tete facon affiche / journal -------------------------------- */
.entete{text-align:center;padding:22px 0 14px;position:relative}
.entete .filet-haut{height:3px;background:var(--or);opacity:.85}
.entete .filet-bas{height:1px;background:var(--laiton);margin-top:3px}
.entete h1{
  font-size:clamp(38px,13vw,58px);letter-spacing:.22em;
  text-indent:.22em;color:var(--or);margin:10px 0 2px;
  text-shadow:0 0 18px rgba(201,162,39,.18);
}
.entete .sous{
  font-family:var(--police-titre);font-size:11px;letter-spacing:.34em;
  text-transform:uppercase;color:var(--creme-2);margin:0 0 10px;
}
.eventail{
  height:26px;margin:0 auto 8px;width:132px;
  background:repeating-conic-gradient(from 180deg at 50% 100%,
    var(--or) 0deg 1.2deg, transparent 1.2deg 7deg);
  -webkit-mask-image:linear-gradient(to top,#000 20%,transparent 100%);
  mask-image:linear-gradient(to top,#000 20%,transparent 100%);
  opacity:.9;
}

/* En-tete compact hors de l'accueil : la lecture doit commencer haut. */
body[data-onglet="cours"] .entete,
body[data-onglet="quiz"] .entete{padding:10px 0 8px}
body[data-onglet="cours"] .entete h1,
body[data-onglet="quiz"] .entete h1{font-size:clamp(24px,7vw,32px);margin:6px 0 0}
body[data-onglet="cours"] .entete .sous,
body[data-onglet="quiz"] .entete .sous{display:none}
body[data-onglet="cours"] .eventail,
body[data-onglet="quiz"] .eventail{height:13px;width:84px;margin-bottom:2px}
body[data-onglet="cours"] .entete>div[style],
body[data-onglet="quiz"] .entete>div[style]{height:6px!important}

/* Filet dore avec losange central : separateur recurrent */
.filet{display:flex;align-items:center;gap:10px;margin:22px 0 14px}
.filet::before,.filet::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--laiton),transparent)}
.filet span{
  font-family:var(--police-titre);font-size:12px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--or);white-space:nowrap;
}
.losange{color:var(--or);opacity:.8}

/* --- Cartes --------------------------------------------------------- */
.carte{
  background:var(--noir-2);
  border:1px solid rgba(138,114,51,.5);
  border-radius:var(--rayon);
  padding:16px;margin:0 0 14px;position:relative;
}
.carte::before{ /* chevrons discrets en haut de carte */
  content:"";position:absolute;inset:0 0 auto 0;height:4px;
  background:repeating-linear-gradient(135deg,
    rgba(201,162,39,.45) 0 2px, transparent 2px 7px);
}
.carte h2,.carte h3{color:var(--or-clair)}
.carte h2{font-size:24px;letter-spacing:.06em;margin-bottom:6px}
.carte h3{font-size:19px;letter-spacing:.05em;margin-bottom:6px}
.secondaire{color:var(--creme-2);font-size:15px}
.minuscule{font-size:13px;color:var(--creme-2);letter-spacing:.04em}

/* --- Boutons -------------------------------------------------------- */
.bouton,.bouton-plein{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:10px 20px;width:100%;
  font-family:var(--police-titre);font-size:16px;letter-spacing:.16em;
  text-transform:uppercase;cursor:pointer;border-radius:var(--rayon);
  background:transparent;border:1px solid var(--or);color:var(--or-clair);
  text-align:center;
}
.bouton-plein{background:var(--or);border-color:var(--or);color:#17140c;font-weight:700}
.bouton:active,.bouton-plein:active{transform:translateY(1px)}
.bouton[disabled],.bouton-plein[disabled]{opacity:.42;cursor:not-allowed}
.bouton.petit,.bouton-plein.petit{width:auto;min-height:40px;padding:6px 14px;font-size:13px;letter-spacing:.12em}
.bouton.discret{border-color:var(--laiton);color:var(--creme-2)}
.rang-boutons{display:flex;flex-wrap:wrap;gap:8px}

/* --- Pastilles (filtres de periode) --------------------------------- */
.pastilles{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.pastille{
  font-family:var(--police-titre);font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;padding:8px 14px;min-height:40px;
  border:1px solid var(--laiton);color:var(--creme-2);
  background:transparent;border-radius:999px;cursor:pointer;
}
.pastille[aria-pressed="true"]{background:var(--or);border-color:var(--or);color:#17140c;font-weight:700}

/* --- Etiquettes ----------------------------------------------------- */
.etiq{
  display:inline-block;font-family:var(--police-titre);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;
  border:1px solid var(--laiton);color:var(--creme-2);border-radius:999px;
  vertical-align:middle;
}
.etiq.or{border-color:var(--or);color:var(--or-clair)}
.etiq.faite{border-color:var(--vert-juste);color:var(--vert-juste)}
.etiq.bientot{border-color:var(--bordeaux);color:#e5a3ab}

/* --- Liste des seances / cours -------------------------------------- */
.liste{list-style:none;margin:0;padding:0}
.ligne{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 12px;margin:0 0 8px;background:var(--noir-3);
  border:1px solid rgba(138,114,51,.38);border-radius:var(--rayon);
  cursor:pointer;color:var(--creme);font-family:var(--police-texte);
  font-size:16px;line-height:1.4;
}
.ligne[disabled]{cursor:not-allowed;opacity:.5}
.ligne .num{
  flex:0 0 34px;height:34px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--or);color:var(--or);font-family:var(--police-titre);
  font-size:15px;transform:rotate(45deg);
}
.ligne .num span{transform:rotate(-45deg)}
.ligne .corps{flex:1;min-width:0}
.ligne .corps .t{display:block}
.ligne.faite .num{border-color:var(--vert-juste);color:var(--vert-juste)}
.ligne .etat{flex:0 0 auto;font-size:12px;color:var(--creme-2);letter-spacing:.08em;font-family:var(--police-titre);text-transform:uppercase}

/* --- Lecture d'une seance ------------------------------------------- */
.lecture{font-size:17.5px}
.lecture h3{
  font-size:21px;color:var(--or-clair);margin:26px 0 8px;letter-spacing:.04em;
  padding-bottom:5px;border-bottom:1px solid rgba(138,114,51,.45);
}
.lecture p{margin:0 0 1.05em;text-align:left}
.lecture ul{margin:0 0 1.1em;padding-left:1.1em}
.lecture li{margin:0 0 .5em}
.lecture strong{color:var(--or-clair);font-weight:700}
.lecture blockquote{
  margin:1.2em 0;padding:2px 0 2px 16px;border-left:3px solid var(--bordeaux);
  font-style:italic;color:var(--creme-2);
}
.probleme{
  border:1px solid var(--or);border-left-width:5px;padding:12px 14px;
  margin:0 0 20px;background:rgba(201,162,39,.06);font-style:italic;
}
.anecdote{
  border:1px solid var(--vert);border-left-width:5px;background:rgba(31,74,60,.28);
  padding:14px;margin:26px 0 8px;
}
.anecdote .titre{
  font-family:var(--police-titre);font-size:12px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--or-clair);display:block;margin-bottom:6px;
}
.anecdote p{margin:0;font-size:16.5px}

/* --- QCM ------------------------------------------------------------ */
.question{border:1px solid rgba(138,114,51,.45);background:var(--noir-2);padding:14px;margin:0 0 14px}
.question .enonce{font-weight:600;margin:0 0 4px}
.question .consigne{font-family:var(--police-titre);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--creme-2);margin:0 0 10px}
.option{
  display:flex;gap:11px;align-items:flex-start;padding:11px 10px;margin:0 0 7px;
  border:1px solid rgba(138,114,51,.35);cursor:pointer;background:rgba(0,0,0,.18);
}
.option:has(input:checked){border-color:var(--or);background:rgba(201,162,39,.10)}
.option input{
  appearance:none;-webkit-appearance:none;margin:2px 0 0;flex:0 0 20px;height:20px;
  border:1px solid var(--or);background:transparent;cursor:pointer;position:relative;
}
.option input:checked::after{
  content:"";position:absolute;inset:3px;background:var(--or);
}
.option input:focus-visible{outline:2px solid var(--or-clair);outline-offset:2px}
.erreur{color:var(--rouge-faux);font-size:14.5px;margin:8px 0 0;font-style:italic}
.question.en-erreur{border-color:var(--rouge-faux)}

/* --- Correction ----------------------------------------------------- */
.score{
  text-align:center;border:1px solid var(--or);padding:16px;margin:0 0 18px;
  background:rgba(201,162,39,.07);
}
.score .chiffre{font-family:var(--police-titre);font-size:46px;color:var(--or);line-height:1}
.corr{border-left:4px solid var(--rouge-faux);background:var(--noir-2);padding:13px 14px;margin:0 0 13px}
.corr .ligne-rep{margin:0 0 4px;font-size:15.5px}
.corr .ligne-rep b{font-family:var(--police-titre);letter-spacing:.1em;font-size:12px;text-transform:uppercase;color:var(--creme-2);display:block}
.corr .rep{display:block;padding-left:16px;position:relative;margin:2px 0}
.corr .rep::before{content:"\25C6";position:absolute;left:0;font-size:9px;top:.45em;opacity:.8}
.corr .faux{color:var(--rouge-faux)}
.corr .juste{color:var(--vert-juste)}
.corr .expl{margin:9px 0 0;font-size:16px;border-top:1px solid rgba(138,114,51,.4);padding-top:9px}
details.justes{border:1px solid rgba(138,114,51,.4);padding:10px 12px;margin:18px 0}
details.justes summary{cursor:pointer;font-family:var(--police-titre);letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--vert-juste)}
details.justes .corr{border-left-color:var(--vert-juste);margin-top:12px}

/* --- Formulaires (reglages, quiz compose) --------------------------- */
.champ{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(138,114,51,.25)}
.champ:last-child{border-bottom:0}
.champ .txt{flex:1}
.champ .txt small{display:block;color:var(--creme-2);font-size:13.5px;line-height:1.45}
.interrupteur{flex:0 0 auto;width:54px;height:30px;border:1px solid var(--or);background:transparent;cursor:pointer;position:relative;border-radius:999px}
.interrupteur::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:var(--laiton);border-radius:50%;transition:left .15s,background .15s}
.interrupteur[aria-checked="true"]::after{left:27px;background:var(--or)}
.coche{display:flex;gap:11px;align-items:flex-start;padding:11px 8px;border:1px solid rgba(138,114,51,.35);margin:0 0 7px;cursor:pointer;background:rgba(0,0,0,.18)}
.coche input{appearance:none;-webkit-appearance:none;margin:3px 0 0;flex:0 0 20px;height:20px;border:1px solid var(--or);background:transparent;position:relative;cursor:pointer}
.coche input:checked::after{content:"";position:absolute;inset:3px;background:var(--or)}
.coche:has(input:checked){border-color:var(--or);background:rgba(201,162,39,.10)}
select,input[type=file]{font:inherit;color:var(--creme);background:var(--noir-3);border:1px solid var(--laiton);padding:10px;border-radius:var(--rayon);min-height:44px}
select{width:100%}

/* --- Tableau de progression ----------------------------------------- */
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 30%;min-width:96px;border:1px solid rgba(138,114,51,.45);padding:11px 8px;text-align:center;background:rgba(0,0,0,.2)}
.stat .v{font-family:var(--police-titre);font-size:28px;color:var(--or);line-height:1.1}
.stat .l{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--creme-2);font-family:var(--police-titre)}
.jauge{height:8px;background:rgba(0,0,0,.45);border:1px solid rgba(138,114,51,.5);margin:10px 0 4px}
.jauge div{height:100%;background:linear-gradient(90deg,var(--laiton),var(--or))}

/* --- Barre d'onglets ------------------------------------------------- */
.onglets{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;background:rgba(10,9,7,.97);
  border-top:1px solid var(--or);
  padding-bottom:env(safe-area-inset-bottom);
  backdrop-filter:blur(6px);
}
.onglets button{
  flex:1;background:transparent;border:0;padding:9px 4px 11px;cursor:pointer;
  font-family:var(--police-titre);font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--creme-2);
}
.onglets button .ic{display:block;font-size:17px;line-height:1.5;color:var(--laiton)}
.onglets button[aria-current="page"]{color:var(--or)}
.onglets button[aria-current="page"] .ic{color:var(--or)}

/* --- Divers ---------------------------------------------------------- */
.fil{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.fil .bouton{width:auto}
.vide{text-align:center;color:var(--creme-2);padding:26px 10px;font-style:italic}
.avis{border:1px solid var(--bordeaux);background:rgba(140,36,50,.15);padding:11px 13px;margin:0 0 14px;font-size:15.5px}
.avis.ok{border-color:var(--vert-juste);background:rgba(127,192,155,.1)}
.sources li{margin-bottom:.45em;font-size:15.5px}
.pied{text-align:center;color:var(--creme-2);font-size:12.5px;letter-spacing:.1em;padding:22px 0 6px}
.saut{height:10px}
@media (min-width:640px){
  body{font-size:18px}
  .app{padding-bottom:calc(var(--barre) + 40px)}
  .stat{flex:1 1 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <header class="entete">
    <div class="filet-haut"></div><div class="filet-bas"></div>
    <div style="height:14px"></div>
    <div class="eventail" aria-hidden="true"></div>
    <h1>CLIO</h1>
    <p class="sous">Culture historique &#8226; une seance par jour</p>
    <div class="filet-bas"></div>
  </header>

  <!-- ================= ONGLET 1 : ACCUEIL ================= -->
  <main id="vue-accueil" class="vue active" role="tabpanel" aria-label="Accueil"></main>

  <!-- ================= ONGLET 2 : COURS =================== -->
  <main id="vue-cours" class="vue" role="tabpanel" aria-label="Cours"></main>

  <!-- ================= ONGLET 3 : QUIZ ==================== -->
  <main id="vue-quiz" class="vue" role="tabpanel" aria-label="Quiz"></main>

  <p class="pied">&#9670; CLIO &#9670;</p>
</div>

<nav class="onglets" role="tablist" aria-label="Navigation principale">
  <button type="button" data-onglet="accueil" aria-current="page"><span class="ic" aria-hidden="true">&#9650;</span>Accueil</button>
  <button type="button" data-onglet="cours"><span class="ic" aria-hidden="true">&#9670;</span>Cours</button>
  <button type="button" data-onglet="quiz"><span class="ic" aria-hidden="true">&#9679;</span>Quiz</button>
</nav>

<script>
"use strict";
/* =====================================================================
   3. CONTENU PEDAGOGIQUE
   ---------------------------------------------------------------------
   Tout le contenu vit ici, separe de la logique. Pour ajouter un cours,
   il suffit de coller un objet supplementaire dans le tableau COURS, en
   respectant exactement ce gabarit :

   {
     id: "identifiant-unique-sans-espace",
     titre: "Titre du cours",
     periode: "1914-1945",        // doit figurer dans PERIODES ci-dessous
     dates: "1919-1939",
     note: "",                    // facultatif : precision affichee en gris
     problematique: "Une phrase.",
     sources: [ "Auteur, Titre, editeur, annee", ... ],   // 3 a 5
     seances: [                   // EXACTEMENT 6
       {
         numero: 1,
         titre: "Titre de la seance",
         problematique: "Une phrase.",
         contenu: ` ... HTML simple : h3, p, ul, strong, blockquote ... `,
         anecdote: ` ... HTML simple, jamais evalue ... `,
         questions: [             // EXACTEMENT 5
           {
             enonce: "...",
             options: ["...","...","...","..."],   // exactement 4
             correctes: [0,2],                     // 1 a 4 indices
             explication: "2 a 3 phrases renvoyant au mecanisme du cours."
           }, ...
         ]
       }, ...
     ]
   }

   Conventions de redaction :
   - notions cles en <strong>, dates et acteurs precis ;
   - 3 ou 4 parties titrees (h3) : causes, mecanismes, consequences ;
   - un paragraphe final << Fil rouge >> qui annonce la seance suivante ;
   - anecdote vraie et verifiable ; si elle releve de la legende, le dire ;
   - un point douteux se signale par un commentaire <!-- A VERIFIER -->.
   ===================================================================== */

/* Ordre d'affichage des periodes dans l'onglet Cours. Une periode sans
   aucun cours reste visible et porte la mention << bientot >>. */
const PERIODES = ["Antiquite","Moyen Age","Epoque moderne","XIXe siecle",
                  "1914-1945","Depuis 1945"];

const COURS = [

/* ====================== COURS 1 ====================== */
{
  id: "france-1920-1930",
  titre: "La France des années 1920-1930",
  periode: "1914-1945",
  dates: "1919-1939",
  note: "",
  problematique: "Comment une France victorieuse en 1918, mais saignée et endettée, en vient-elle en vingt ans à douter de son régime, de sa monnaie et de sa sécurité ?",
  sources: [
    "Jean-Jacques Becker et Serge Berstein, Victoire et frustrations, 1914-1929, Seuil, coll. « Nouvelle histoire de la France contemporaine », 1990",
    "Dominique Borne et Henri Dubief, La Crise des années 30, 1929-1938, Seuil, coll. « Nouvelle histoire de la France contemporaine », 1989",
    "Jean-Noël Jeanneney, Leçon d’histoire pour une gauche au pouvoir. La faillite du Cartel (1924-1926), Seuil, 1977",
    "Julian Jackson, The Popular Front in France. Defending Democracy, 1934-1938, Cambridge University Press, 1988",
    "Robert Frank, Le Prix du réarmement français, 1935-1939, Publications de la Sorbonne, 1982"
  ],
  seances: [
  /* ---------- Cours 1, séance 1 ---------- */
  {
    numero: 1,
    titre: "Le Bloc national (1919-1924) : la victoire et ses comptes",
    problematique: "Pourquoi la France victorieuse de 1918 a-t-elle fondé sa reconstruction sur l’argent allemand, et qu’advient-il quand ce pari échoue ?",
    contenu: `
<h3>1. Une Chambre « bleu horizon »</h3>
<p>Les élections législatives du <strong>16 novembre 1919</strong> sont les premières depuis 1914. Le pays sort de la guerre avec près de <strong>1,4 million de morts</strong>, dix départements dévastés et une dette publique multipliée par cinq. Le <strong>mode de scrutin</strong> adopté en juillet 1919 est décisif : on vote pour des <strong>listes départementales</strong>, et toute liste qui obtient la majorité absolue emporte l’ensemble des sièges du département ; sinon, la répartition se fait à la proportionnelle. Ce système récompense les coalitions et punit l’isolement.</p>
<p>Les droites et le centre s’allient donc dans le <strong>Bloc national</strong>, sur un programme de fermeté envers l’Allemagne et de défense de l’ordre social, agitant la peur du bolchevisme — l’affiche de « l’homme au couteau entre les dents » date de cette campagne. Les socialistes, eux, se présentent seuls. Résultat : le Bloc rassemble près des deux tiers des 613 sièges, tandis que la <strong>SFIO</strong> tombe sous les 70 députés alors qu’elle réunit plus d’un cinquième des suffrages. On surnomme cette assemblée la <strong>« Chambre bleu horizon »</strong>, du nom de la couleur des uniformes : plus du tiers des élus sont d’anciens combattants.</p>

<h3>2. La gauche coupée en deux : Tours, décembre 1920</h3>
<p>Au <strong>congrès de Tours</strong> (25-30 décembre 1920), la SFIO débat de l’adhésion à l’<strong>Internationale communiste</strong> fondée par Lénine, qui impose <strong>21 conditions</strong> : discipline de fer, exclusion des « réformistes », soumission des élus au parti. La majorité l’emporte par environ <strong>3 200 mandats contre 1 000</strong> et fonde la Section française de l’Internationale communiste, futur <strong>Parti communiste français</strong>, qui emporte avec elle le journal <em>L’Humanité</em>. La minorité, autour de <strong>Léon Blum</strong>, reste dans ce qu’il appelle « la vieille maison » et conserve le sigle SFIO.</p>
<p>La fracture gagne le syndicalisme : après l’échec de la grande grève des cheminots de 1920, la CGT se divise à son tour et une <strong>CGTU</strong> proche des communistes naît en 1921-1922. Conséquence durable : pendant quinze ans, la gauche française additionne des voix mais pas des sièges, et le Bloc national gouverne sans véritable alternative parlementaire.</p>

<h3>3. « L’Allemagne paiera » : le pari financier de la victoire</h3>
<p>Le traité de Versailles n’a pas fixé le montant des réparations ; il l’a renvoyé à une commission, qui arrête la somme de <strong>132 milliards de marks-or</strong> en <strong>mai 1921</strong>, dont 52 % pour la France. Or l’État a déjà engagé la reconstruction : il indemnise les sinistrés et reconstruit routes, mines et usines en empruntant, inscrivant ces sommes dans un <strong>budget des dépenses « recouvrables »</strong>, c’est-à-dire censées être remboursées plus tard par Berlin. Le mot d’ordre que l’on prête au ministre des Finances <strong>Louis-Lucien Klotz</strong>, « l’Allemagne paiera », n’est donc pas un slogan : c’est une <strong>architecture budgétaire</strong>.</p>
<p>Elle repose sur un enchaînement fragile. La France doit rembourser ses propres <strong>dettes interalliées</strong> aux États-Unis et au Royaume-Uni, qui refusent de les lier aux réparations allemandes. Si l’Allemagne paie mal, Paris doit malgré tout payer : le déficit se creuse, la dette flottante gonfle, le franc s’affaiblit. Le problème allemand est ainsi devenu, mécaniquement, un problème <strong>intérieur</strong> français.</p>

<h3>4. La Ruhr : la force sans les alliés (1923-1924)</h3>
<p>En janvier 1922, <strong>Raymond Poincaré</strong> revient à la présidence du Conseil avec l’intention d’appliquer le traité à la lettre. Un défaut allemand sur des livraisons de bois et de charbon lui sert de fondement juridique : le <strong>11 janvier 1923</strong>, troupes françaises et belges occupent la <strong>Ruhr</strong>, cœur industriel du Reich, accompagnées d’ingénieurs chargés de prélever charbon et coke à la source.</p>
<p>Berlin réplique par la <strong>résistance passive</strong> : grèves payées par l’État allemand, qui fait tourner la planche à billets et provoque l’<strong>hyperinflation</strong> de 1923. L’opération devient ruineuse pour tout le monde. Londres et Washington la désapprouvent ; la spéculation se retourne contre le franc au début de 1924, et Poincaré doit imposer le <strong>« double décime »</strong>, une hausse d’impôts de 20 %, pour sauver la monnaie. L’Allemagne cède sur la résistance passive en septembre 1923, mais la sortie de crise est confiée à un comité d’experts : le <strong>plan Dawes</strong> (août 1924) allège les annuités, prête des capitaux américains à l’Allemagne et prépare l’évacuation de la Ruhr en 1925.</p>
<p>Le bilan est amer : la France a obtenu de l’argent, mais a perdu le droit d’agir seule. Les réparations sont désormais une affaire internationale, arbitrée par les banquiers américains. Aux élections du <strong>11 mai 1924</strong>, le <strong>Cartel des gauches</strong> l’emporte. Le président de la République <strong>Alexandre Millerand</strong>, qui s’était engagé publiquement pour le Bloc, se heurte à une « grève des ministères » : aucun dirigeant du Cartel n’accepte de former un gouvernement sous lui. Il démissionne le <strong>11 juin 1924</strong> et Gaston Doumergue lui succède. Le précédent est capital : sous la III<sup>e</sup> République, un président ne gouverne pas contre la Chambre.</p>
<p><strong>Fil rouge.</strong> Le Cartel arrive donc au pouvoir avec une double hypothèque : un budget bâti sur des recettes allemandes incertaines et une dette à court terme qu’il faut renouveler chaque mois. C’est sur ce terrain financier — et non sur son programme — qu’il va se briser.</p>

<h3>1. Une majorité mal ajustée</h3>
<p>Le <strong>Cartel des gauches</strong>, victorieux le 11 mai 1924, associe le <strong>Parti radical</strong> d’<strong>Édouard Herriot</strong> et la <strong>SFIO</strong>. Mais l’accord est bancal : les socialistes pratiquent le <strong>« soutien sans participation »</strong> — ils votent la confiance sans entrer au gouvernement — tandis que les radicaux, attachés à la petite propriété, refusent leur principale proposition, un <strong>prélèvement sur le capital</strong>. La majorité est donc soudée sur les questions morales et laïques, et divisée sur la seule question qui compte alors : l’argent.</p>
<p>Herriot commence donc par ce qui unit sa majorité : amnistie politique, réintégration des cheminots révoqués de 1920, transfert des cendres de <strong>Jean Jaurès au Panthéon</strong> (novembre 1924), <strong>reconnaissance de l’URSS</strong> (octobre 1924). Sa tentative d’étendre les lois laïques à l’<strong>Alsace-Moselle</strong>, restées sous régime concordataire depuis 1918, déclenche en revanche une mobilisation catholique massive et doit être abandonnée.</p>

<p>Le mécanisme financier est décisif. La guerre a été financée par l’emprunt, et une grande partie de la dette est à <strong>court terme</strong> : les <strong>bons de la Défense nationale</strong>, souscrits par des centaines de milliers d’épargnants, arrivent sans cesse à échéance. L’État ne vit donc que si les porteurs <strong>renouvellent</strong> leurs bons chaque mois. Qu’ils cessent de le faire, et le Trésor doit trouver des liquidités immédiates : il se tourne alors vers les <strong>avances de la Banque de France</strong>, plafonnées par la loi.</p>
<p>Or les détenteurs de bons, effrayés par les rumeurs d’impôt sur le capital, se retirent. Pour tenir, la Banque de France dépasse secrètement le plafond légal, puis révèle l’irrégularité : ce sont les « faux bilans » du printemps 1925. Le <strong>10 avril 1925</strong>, le Sénat renverse Herriot. En un an, cinq ou six ministères se succèdent sans parvenir à faire voter un plan financier ; le franc s’effondre jusqu’à près de <strong>240 francs pour une livre sterling en juillet 1926</strong>, contre 25 avant 1914.</p>

<h3>4. Poincaré et le franc de 1928</h3>
<p>Le <strong>23 juillet 1926</strong>, Raymond Poincaré revient à la tête d’un gouvernement d’<strong>union nationale</strong> réunissant six anciens présidents du Conseil, Herriot compris. L’effet est d’abord psychologique : la confiance revient avant même les mesures. Suivent des hausses d’impôts, surtout indirects, des économies, et la création d’une <strong>caisse autonome d’amortissement</strong> (août 1926) alimentée notamment par le monopole des tabacs, qui isole le remboursement de la dette des aléas du budget. Les capitaux rentrent, le franc remonte, et le gouvernement choisit de le <strong>stabiliser</strong> plutôt que de le ramener à sa valeur d’avant-guerre.</p>

<p><strong>Fil rouge.</strong> Cette stabilisation réussie fait naître un dogme : le franc Poincaré devient intouchable, et l’on refusera de le dévaluer à nouveau quand la crise mondiale arrivera. Mais avant la crise, la même équipe tente de stabiliser l’Europe elle-même : c’est la diplomatie d’Aristide Briand.</p>

<h3>1. Après la Ruhr : la sécurité par la négociation</h3>
<p>L’échec de 1923 a montré que la France ne pouvait plus contraindre seule l’Allemagne. <strong>Aristide Briand</strong>, ministre des Affaires étrangères presque sans interruption de 1925 à 1932, en tire la conséquence : puisque la force est hors de portée, il faut obtenir de l’Allemagne qu’elle accepte librement ce que le traité lui imposait.</p>
<p>C’est le sens des accords de <strong>Locarno</strong>, paraphés le <strong>16 octobre 1925</strong> et signés à Londres le 1<sup>er</sup> décembre. L’Allemagne de <strong>Gustav Stresemann</strong> reconnaît définitivement ses frontières occidentales avec la France et la Belgique, ainsi que la <strong>démilitarisation de la Rhénanie</strong> ; le Royaume-Uni et l’Italie se portent garants. En 1926, l’Allemagne entre à la <strong>Société des Nations</strong> et Briand comme Stresemann reçoivent le prix Nobel de la paix.</p>

<h3>2. Une garantie asymétrique</h3>
<p>Locarno comporte pourtant un vice de construction : <strong>seules les frontières de l’Ouest sont garanties</strong>. À l’Est, l’Allemagne accepte seulement des traités d’arbitrage avec la <strong>Pologne</strong> et la <strong>Tchécoslovaquie</strong> — c’est-à-dire l’engagement de discuter, non celui de ne pas réviser. Stresemann ne s’en cache pas : la révision pacifique des frontières orientales reste son objectif.</p>
<p>Or la France a signé une alliance avec la Pologne en 1921 et avec la Tchécoslovaquie en 1924. Pour les secourir, elle devrait attaquer l’Allemagne à l’ouest — et se retrouverait alors agresseur au regard de Locarno, contre la garantie britannique. Le système de sécurité français est donc, dès 1925, <strong>logiquement contradictoire</strong>. S’y ajoute la faiblesse des instruments : le <strong>pacte Briand-Kellogg</strong> du <strong>27 août 1928</strong>, signé par une soixantaine d’États, « condamne le recours à la guerre » mais ne prévoit <strong>aucune sanction</strong>. Le droit international de l’entre-deux-guerres proclame beaucoup et contraint peu.</p>

<h3>1. Une crise tardive, atténuée… et interminable</h3>
<p>La dépression née du krach de Wall Street en octobre 1929 n’atteint la France qu’en <strong>1931-1932</strong>. Le pays est protégé un temps par une économie moins ouverte, une population encore rurale pour un tiers, un système bancaire moins exposé et un <strong>franc sous-évalué</strong> depuis 1928. Mais la protection se retourne : quand la <strong>livre sterling</strong> se détache de l’or en septembre 1931, puis le <strong>dollar</strong> en 1933, le franc devient soudain la monnaie la plus chère du monde industriel. Les exportations françaises s’effondrent.</p>
<p>Le choix monétaire commande tout le reste. Fidèle au <strong>franc Poincaré</strong> devenu dogme, la France s’enferme dans le <strong>bloc-or</strong> avec la Belgique, les Pays-Bas et la Suisse, et cherche à restaurer sa compétitivité par la <strong>déflation</strong> : baisse des prix, des salaires et des dépenses publiques. Les <strong>décrets-lois de Pierre Laval</strong>, en juillet 1935, amputent ainsi de 10 % les traitements des fonctionnaires et les pensions. Résultat : la crise française est moins profonde qu’en Allemagne ou aux États-Unis, mais beaucoup plus longue — la production de 1929 ne sera pas retrouvée avant la guerre.</p>

<h3>2. Un régime qui s’use</h3>
<p>Les élections de 1932 donnent une majorité de gauche, mais la SFIO refuse à nouveau de participer : entre juin 1932 et février 1934, <strong>six gouvernements</strong> se succèdent, incapables de faire adopter un plan financier. Herriot tombe en décembre 1932 parce qu’il veut honorer l’échéance de la <strong>dette américaine</strong> que la Chambre refuse de payer. L’instabilité n’est pas nouvelle sous la III<sup>e</sup> République ; ce qui est nouveau, c’est qu’elle se produit alors que la crise exige des décisions.</p>
<p>Ce vide nourrit les <strong>ligues</strong> : l’<strong>Action française</strong> de Charles Maurras et ses Camelots du roi, les <strong>Jeunesses patriotes</strong>, la <strong>Solidarité française</strong> financée par le parfumeur François Coty, le <strong>Francisme</strong> de Marcel Bucard, et surtout les <strong>Croix-de-Feu</strong> du colonel de La Rocque, association d’anciens combattants devenue mouvement de masse. Leur nature fait l’objet d’un <strong>débat historiographique</strong> vif : <strong>René Rémond</strong> y voyait la survivance d’un nationalisme français autoritaire, distinct du fascisme ; <strong>Zeev Sternhell</strong> a soutenu au contraire l’existence d’une matrice fasciste française ; <strong>Robert Soucy</strong>, <strong>Brian Jenkins</strong> ou <strong>Kevin Passmore</strong> ont rouvert le dossier en insistant sur le caractère para-militaire des Croix-de-Feu. Le débat porte moins sur les faits que sur la définition du fascisme.</p>

<h3>3. Stavisky, ou le scandale comme révélateur</h3>

<p><strong>Édouard Daladier</strong> lui succède et commet l’erreur décisive : il déplace le préfet de police de Paris, <strong>Jean Chiappe</strong>, réputé bienveillant envers les ligues et très populaire à droite. Le geste est interprété comme une provocation.</p>

<h3>4. Le 6 février 1934 et son onde de choc</h3>
<p>Le soir du <strong>6 février 1934</strong>, jour de présentation du gouvernement Daladier, ligues et associations d’anciens combattants — y compris, par un autre itinéraire, l’organisation communiste ARAC — convergent vers la <strong>place de la Concorde</strong>, face au Palais-Bourbon. La police, débordée, tire : on compte une <strong>quinzaine de morts</strong> et plus d’un millier de blessés. Le lendemain, bien qu’ayant obtenu la confiance de la Chambre, Daladier démissionne. <strong>Gaston Doumergue</strong> forme un gouvernement d’union nationale.</p>
<p>L’événement a été longtemps lu comme une tentative de coup d’État fasciste. L’historiographie, notamment <strong>Serge Berstein</strong>, a établi qu’il n’y eut ni plan concerté, ni volonté commune de renverser le régime : les cortèges étaient hétérogènes et sans commandement unique. Mais la <strong>perception</strong> a compté davantage que la réalité. Pour la gauche, la République a failli tomber : le 12 février 1934, une <strong>grève générale</strong> et des cortèges socialistes et communistes se rejoignent spontanément à la place de la Nation. Le 27 juillet 1934, SFIO et PCF signent un <strong>pacte d’unité d’action</strong>. Pour la première fois depuis Tours, la gauche se recompose.</p>
<p>Il faut noter le paradoxe : un gouvernement renversé par la rue affaiblit le parlementarisme, mais l’émotion produite consolide l’attachement républicain d’une large partie de l’opinion. La crise des années 1930 en France n’a pas emporté le régime ; elle l’a durablement fragilisé.</p>
<p><strong>Fil rouge.</strong> De cette peur commune naît une coalition inédite — communistes, socialistes, radicaux — qui va gagner les élections de 1936 et gouverner : le Front populaire.</p>

<h3>1. La fabrique d’une alliance</h3>
<p>Le rapprochement des gauches n’a rien d’évident : depuis 1920, le PCF dénonce les socialistes comme « sociaux-traîtres ». Trois facteurs le rendent possible. La <strong>peur du fascisme</strong> après le 6 février 1934 ; le <strong>tournant de l’Internationale communiste</strong>, qui adopte à l’été 1935 la stratégie des fronts populaires antifascistes ; enfin le <strong>rapprochement diplomatique</strong> entre Paris et Moscou, scellé par le pacte du 2 mai 1935.</p>
<p>Le 14 juillet 1935, un immense cortège réunit à Paris les trois partis et la CGT réunifiée : c’est le <strong>Rassemblement populaire</strong>. Son programme, publié en janvier 1936, reste modéré — « le pain, la paix, la liberté » —, écartant les nationalisations massives pour ne pas effrayer les radicaux. Aux élections des <strong>26 avril et 3 mai 1936</strong>, la coalition l’emporte : la <strong>SFIO devient le premier parti de la Chambre</strong> avec près de 150 élus, le <strong>PCF passe de 10 à 72 députés</strong> mais refuse de participer au gouvernement, et les radicaux reculent. Le 4 juin 1936, <strong>Léon Blum</strong> devient le premier socialiste — et le premier juif — président du Conseil.</p>

<h3>2. Mai-juin 1936 : la grève qui précède la loi</h3>
<p>Un fait capital : le mouvement social <strong>précède</strong> l’arrivée de Blum. Dès la mi-mai, des grèves <strong>avec occupation d’usines</strong> se déclenchent, forme inédite en France ; en juin, près de <strong>deux millions de grévistes</strong> cessent le travail dans une atmosphère souvent festive. Le patronat, craignant une révolution, accepte de négocier.</p>
<p>Les <strong>accords Matignon</strong> du 7 au 8 juin 1936, signés à l’hôtel Matignon entre la CGT, la Confédération générale de la production française et le gouvernement, accordent des hausses de salaires de 7 à 15 %, la reconnaissance du droit syndical, des <strong>délégués du personnel</strong> et la généralisation des <strong>conventions collectives</strong>. Les lois suivent en quelques jours : <strong>40 heures</strong> hebdomadaires, <strong>deux semaines de congés payés</strong>, conventions collectives. S’y ajoutent la scolarité obligatoire jusqu’à 14 ans, la réforme du statut de la <strong>Banque de France</strong>, la nationalisation des industries de guerre, l’<strong>Office du blé</strong>, et la <strong>dissolution des ligues</strong>.</p>

<h3>3. Les limites : le mur économique et le mur extérieur</h3>
<p>L’économie sanctionne l’ordre des décisions. Le gouvernement augmente les salaires et réduit la durée du travail <strong>avant</strong> d’ajuster la monnaie : les prix montent, la hausse nominale des salaires est vite absorbée, et la production ne suit pas. La <strong>dévaluation</strong>, longtemps refusée pour des raisons politiques, n’intervient que le <strong>1<sup>er</sup> octobre 1936</strong> — trop tard pour produire l’effet de relance espéré. Les capitaux fuient ; en février 1937, Blum doit annoncer une <strong>« pause »</strong> dans les réformes.</p>
<p>La <strong>guerre d’Espagne</strong>, commencée en juillet 1936, divise la majorité : Blum choisit la <strong>non-intervention</strong> par crainte d’un conflit européen et sous pression britannique, au prix d’une profonde déchirure à gauche. En juin 1937, le Sénat lui refuse les pleins pouvoirs financiers et il démissionne. Un second gouvernement Blum, en mars 1938, ne dure qu’un mois. Avec <strong>Édouard Daladier</strong>, revenu en avril 1938, les décrets-lois de Paul Reynaud détricotent les 40 heures à l’automne ; l’échec de la <strong>grève générale du 30 novembre 1938</strong> marque la fin de la séquence.</p>

<p>Le bilan social et culturel, lui, est durable : congés payés, conventions collectives, délégués du personnel, billets de train à tarif réduit, auberges de jeunesse et politique des loisirs de <strong>Léo Lagrange</strong> font entrer les classes populaires dans des pratiques dont elles étaient exclues. Le Front populaire n’a pas résolu la crise ; il a modifié le rapport des Français à l’État et au travail.</p>
<p><strong>Fil rouge.</strong> Deux institutions ont traversé toute cette période sans dépendre des majorités : l’armée et l’école. Elles engagent l’avenir plus sûrement qu’un décret-loi — et c’est là que la France joue, sans le savoir, l’année 1940.</p>

/* =====================================================================
   4. LOGIQUE DE L'APPLICATION
   ---------------------------------------------------------------------
   Sommaire :
     4.1  Reglages et etat persistant (localStorage + export/import)
     4.2  Fonctions de progression (seance disponible, cours en cours...)
     4.3  Utilitaires d'affichage
     4.4  Onglet Accueil
     4.5  Onglet Cours (catalogue, fiche, lecture)
     4.6  Moteur de QCM (construction, validation, correction)
     4.7  Onglet Quiz (QCM de seance et quiz compose)
     4.8  Navigation et evenements
   ===================================================================== */

/* ---------- 4.1  Reglages et etat persistant ---------- */

/* Valeur par defaut du rythme : la seance suivante ne se debloque que le
   lendemain. Modifiable dans les reglages de l'onglet Accueil. */
const UNE_SEANCE_PAR_JOUR = true;

/* Nombre de seances par cours, et donc duree d'une << semaine Clio >> :
   une semaine se compte en seances, pas en jours de calendrier. */
const SEANCES_PAR_COURS = 6;

const CLE_STOCKAGE = "clio.progression.v1";

/* Etat vierge. Toute lecture de l'etat passe par cet objet de reference,
   ce qui evite les undefined lors d'une montee de version. */
function etatVierge(){
  return {
    v: 1,
    reglages: { uneSeanceParJour: UNE_SEANCE_PAR_JOUR },
    cours: {},          // { idCours: { seances:{ "1":{...} }, termine:"AAAA-MM-JJ"|null } }
    historique: [],     // [{ d, type, coursId, seance, justes, total }]
    questions: {},      // { "idCours#seance#index": { r:ratees, j:reussies } }
    dernier: null       // { coursId, seance } : derniere seance ouverte
  };
}

let ETAT = chargerEtat();

function chargerEtat(){
  const base = etatVierge();
  try{
    const brut = localStorage.getItem(CLE_STOCKAGE);
    if(!brut) return base;
    const lu = JSON.parse(brut);
    if(!lu || typeof lu !== "object") return base;
    return fusionnerEtat(base, lu);
  }catch(e){
    // localStorage indisponible (navigation privee, fichier local bride...)
    console.warn("Clio : progression illisible, on repart d'un etat vierge.", e);
    return base;
  }
}

function fusionnerEtat(base, lu){
  const e = base;
  if(lu.reglages && typeof lu.reglages === "object"){
    e.reglages.uneSeanceParJour = lu.reglages.uneSeanceParJour !== false;
  }
  if(lu.cours && typeof lu.cours === "object") e.cours = lu.cours;
  if(Array.isArray(lu.historique)) e.historique = lu.historique;
  if(lu.questions && typeof lu.questions === "object") e.questions = lu.questions;
  if(lu.dernier && typeof lu.dernier === "object") e.dernier = lu.dernier;
  return e;
}

function sauverEtat(){
  try{
    localStorage.setItem(CLE_STOCKAGE, JSON.stringify(ETAT));
    return true;
  }catch(e){
    console.warn("Clio : sauvegarde impossible.", e);
    return false;
  }
}

/* ---------- 4.2  Progression ---------- */

function aujourdhui(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}

function coursParId(id){ return COURS.find(c => c.id === id) || null; }

function fiche(coursId){
  if(!ETAT.cours[coursId]) ETAT.cours[coursId] = { seances:{}, termine:null };
  return ETAT.cours[coursId];
}

function estFaite(coursId, numero){
  const f = ETAT.cours[coursId];
  return !!(f && f.seances && f.seances[numero]);
}

function nbFaites(coursId){
  const f = ETAT.cours[coursId];
  if(!f || !f.seances) return 0;
  return Object.keys(f.seances).length;
}

/* Premiere seance non faite d'un cours ; null si le cours est termine. */
function prochaineSeance(coursId){
  const c = coursParId(coursId);
  if(!c) return null;
  for(const s of c.seances){ if(!estFaite(coursId, s.numero)) return s.numero; }
  return null;
}

function coursTermine(coursId){ return prochaineSeance(coursId) === null; }
function coursCommence(coursId){ return nbFaites(coursId) > 0; }

/* Date de la derniere seance validee, tous cours confondus. */
function dateDerniereSeance(){
  let max = null;
  for(const id in ETAT.cours){
    const f = ETAT.cours[id];
    if(!f || !f.seances) continue;
    for(const n in f.seances){
      const d = f.seances[n].date;
      if(d && (!max || d > max)) max = d;
    }
  }
  return max;
}

/* Verrou de rythme : vrai si une seance a deja ete validee aujourd'hui
   et que le reglage << une seance par jour >> est actif. */
function verrouDuJour(){
  if(!ETAT.reglages.uneSeanceParJour) return false;
  return dateDerniereSeance() === aujourdhui();
}

/* Cours actuellement suivi : le dernier ouvert s'il n'est pas termine,
   sinon le premier cours commence et non termine, sinon le premier
   cours jamais commence. */
function coursEnCours(){
  if(ETAT.dernier && ETAT.dernier.coursId){
    const c = coursParId(ETAT.dernier.coursId);
    if(c && !coursTermine(c.id)) return c;
  }
  const entame = COURS.find(c => coursCommence(c.id) && !coursTermine(c.id));
  if(entame) return entame;
  const neuf = COURS.find(c => !coursCommence(c.id));
  return neuf || null;
}

/* Suggestion apres un cours termine : meme periode d'abord, puis
   n'importe quel cours non commence. */
function coursSuggere(apresId){
  const ref = coursParId(apresId);
  const libres = COURS.filter(c => c.id !== apresId && !coursCommence(c.id));
  if(ref){
    const memePeriode = libres.find(c => c.periode === ref.periode);
    if(memePeriode) return memePeriode;
  }
  return libres[0] || null;
}

/* Etat d'une seance : "faite" | "disponible" | "demain" | "verrouillee" */
function etatSeance(coursId, numero){
  if(estFaite(coursId, numero)) return "faite";
  const p = prochaineSeance(coursId);
  if(p !== numero) return "verrouillee";
  return verrouDuJour() ? "demain" : "disponible";
}

/* Score moyen, en pourcentage, sur tous les QCM enregistres. */
function scoreMoyen(){
  const h = ETAT.historique;
  if(!h.length) return null;
  let j = 0, t = 0;
  h.forEach(x => { j += x.justes; t += x.total; });
  return t ? Math.round(100*j/t) : null;
}

function cleQuestion(coursId, seance, index){ return coursId + "#" + seance + "#" + index; }

/* ---------- 4.3  Utilitaires d'affichage ---------- */

function esc(s){
  return String(s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]
  ));
}

function filet(texte){
  return texte ? `<div class="filet"><span>${esc(texte)}</span></div>`
               : `<div class="filet"><span class="losange">&#9670;</span></div>`;
}

function jauge(fait, total){
  const pc = total ? Math.round(100*fait/total) : 0;
  return `<div class="jauge"><div style="width:${pc}%"></div></div>`;
}

function dateLisible(iso){
  if(!iso) return "";
  const [a,m,j] = iso.split("-");
  return j + "/" + m + "/" + a;
}

function melanger(tab){
  const t = tab.slice();
  for(let i=t.length-1;i>0;i--){
    const k = Math.floor(Math.random()*(i+1));
    [t[i],t[k]] = [t[k],t[i]];
  }
  return t;
}

/* ---------- 4.4  Onglet Accueil ---------- */

function rendreAccueil(){
  const c = coursEnCours();
  const parts = [];

  /* -- Seance du jour -- */
  parts.push(`<div class="filet"><span>Séance du jour</span></div>`);
  if(!c){
    parts.push(`<div class="carte"><h2>Tout est terminé</h2>
      <p class="secondaire">Vous avez achevé tous les cours disponibles. Les quiz composés restent
      accessibles pour réviser, et de nouveaux cours pourront être ajoutés dans la constante
      <strong>COURS</strong>.</p></div>`);
  }else{
    const n = prochaineSeance(c.id);
    const s = c.seances.find(x => x.numero === n);
    const etat = etatSeance(c.id, n);
    parts.push(`<div class="carte">
      <p class="minuscule">${esc(c.periode)} &#8226; ${esc(c.dates)}</p>
      <h2>${esc(c.titre)}</h2>
      <p class="secondaire" style="margin-bottom:10px">Séance ${n} sur ${SEANCES_PAR_COURS} &#8212; ${esc(s.titre)}</p>
      ${jauge(nbFaites(c.id), SEANCES_PAR_COURS)}
      <p class="minuscule" style="margin-bottom:14px">${nbFaites(c.id)} séance(s) validée(s) &#8212; environ 10 minutes par séance</p>
      ${ etat === "demain"
        ? `<div class="avis">Vous avez déjà travaillé aujourd’hui. La séance suivante se débloque demain.
             Ce rythme se règle plus bas, dans <strong>Réglages</strong>.</div>
           <button class="bouton" disabled>Reprendre</button>`
        : `<button class="bouton-plein" data-action="reprendre" data-cours="${esc(c.id)}" data-seance="${n}">Reprendre</button>`}
    </div>`);
  }

  /* -- Progression -- */
  const termines = COURS.filter(x => coursTermine(x.id));
  const moy = scoreMoyen();
  parts.push(filet("Progression"));
  parts.push(`<div class="carte">
    <div class="stats">
      <div class="stat"><div class="v">${c ? nbFaites(c.id) + "/" + SEANCES_PAR_COURS : "&#8212;"}</div><div class="l">Cours en cours</div></div>
      <div class="stat"><div class="v">${termines.length}</div><div class="l">Cours terminés</div></div>

/* ---------- 4.6  Moteur de QCM ---------- */

/* QUIZ courant :
   { type, coursId, seance, items:[...], reponses:{i:[indices]}, corrige:bool, resultat:{} }
   Chaque item : { coursId, seance, index, q, ordre }  (ordre = ordre
   d'affichage melange des 4 propositions, pour eviter la memorisation
   d'une position). */
let QUIZ = null;

function faireItem(coursId, seance, index, q){
  return { coursId, seance, index, q, ordre: melanger([0,1,2,3]) };
}

/* QCM de seance : les 5 questions de la seance + les 5 de la precedente. */
function construireQuizSeance(coursId, numero){
  const c = coursParId(coursId);
  const items = [];
  const s = c.seances.find(x => x.numero === numero);
  s.questions.forEach((q,i) => items.push(faireItem(coursId, numero, i, q)));
  if(numero > 1){
    const p = c.seances.find(x => x.numero === numero-1);
    if(p) p.questions.forEach((q,i) => items.push(faireItem(coursId, numero-1, i, q)));
  }
  return { type:"seance", coursId, seance:numero, items, reponses:{}, corrige:false, resultat:null };
}

/* Quiz compose : tirage parmi les questions des cours coches.
   Les questions deja ratees sont remontees en priorite. */
function construireQuizCompose(ids, nombre, toutInclure){
  let pool = [];
  ids.forEach(id => {
    const c = coursParId(id);
    if(!c) return;
    c.seances.forEach(s => {
      if(!toutInclure && !estFaite(id, s.numero)) return;
      s.questions.forEach((q,i) => pool.push(faireItem(id, s.numero, i, q)));
    });
  });
  if(!pool.length) return null;

  /* Priorite = (nombre d'echecs) - (nombre de reussites) sur la question.
     Tri decroissant, avec un aleatoire pour departager les ex aequo. */
  pool = pool.map(it => {
    const st = ETAT.questions[cleQuestion(it.coursId, it.seance, it.index)] || {r:0,j:0};
    return { it, p: (st.r||0) - (st.j||0), h: Math.random() };
  }).sort((a,b) => (b.p - a.p) || (a.h - b.h)).map(x => x.it);

  const n = (nombre === "toutes") ? pool.length : Math.min(Number(nombre), pool.length);
  const choisies = melanger(pool.slice(0, n));
  return { type:"compose", coursId:null, seance:null, items:choisies, reponses:{}, corrige:false, resultat:null };
}

function rendreQuizEnCours(){
  const q = QUIZ;
  const parts = [];
  const titreQuiz = q.type === "seance"
    ? esc(coursParId(q.coursId).titre) + " &#8212; séance " + q.seance
    : "Quiz composé";

  parts.push(`<div class="fil"><button class="bouton petit discret" data-action="quiz-abandonner">&#8592; Quitter</button></div>`);
  parts.push(`<div class="carte">
    <p class="minuscule">${q.items.length} questions</p>
    <h2>${titreQuiz}</h2>
    <p class="secondaire" style="margin:0">Chaque question peut appeler une ou plusieurs bonnes réponses.
    Toutes les questions doivent recevoir au moins une coche.</p>
  </div>`);

  q.items.forEach((it,i) => {
    const revision = (q.type === "seance" && it.seance !== q.seance);
    const coches = q.reponses[i] || [];
    parts.push(`<div class="question" id="q-${i}">
      <p class="enonce">${i+1}. ${esc(it.q.enonce)}</p>
      <p class="consigne">${revision ? "Révision &#8212; séance " + it.seance + " &#8226; " : ""}plusieurs réponses possibles</p>
      ${it.ordre.map(oi => `<label class="option">
          <input type="checkbox" data-question="${i}" data-option="${oi}" ${coches.indexOf(oi) >= 0 ? "checked" : ""}>
          <span>${esc(it.q.options[oi])}</span>
        </label>`).join("")}
      <p class="erreur" id="err-${i}" style="display:none">Cochez au moins une proposition pour cette question.</p>
    </div>`);
  });

  parts.push(`<div class="saut"></div>`);
  parts.push(`<button class="bouton-plein" data-action="quiz-valider">Valider</button>`);
  parts.push(`<div id="avis-validation"></div>`);
  document.getElementById("vue-quiz").innerHTML = parts.join("");
}

/* Validation : refus si une question est sans reponse. */
function validerQuiz(){
  const q = QUIZ;
  let premierManque = -1;
  q.items.forEach((it,i) => {
    const coches = q.reponses[i] || [];
    const err = document.getElementById("err-"+i);
    const bloc = document.getElementById("q-"+i);
    if(!coches.length){
      if(premierManque < 0) premierManque = i;
      if(err) err.style.display = "block";
      if(bloc) bloc.classList.add("en-erreur");
    }else{
      if(err) err.style.display = "none";
      if(bloc) bloc.classList.remove("en-erreur");
    }
  });

  if(premierManque >= 0){
    const avis = document.getElementById("avis-validation");
    if(avis) avis.innerHTML = `<div class="avis">Quiz incomplet : ${
      q.items.filter((it,i) => !(q.reponses[i]||[]).length).length
    } question(s) sans réponse.</div>`;
    const cible = document.getElementById("q-"+premierManque);
    if(cible) cible.scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }

  /* Correction : une question n'est juste que si l'ensemble coche est
     exactement l'ensemble correct. */
  const details = q.items.map((it,i) => {
    const coches = (q.reponses[i]||[]).slice().sort((a,b)=>a-b);
    const bonnes = it.q.correctes.slice().sort((a,b)=>a-b);
    const juste = coches.length === bonnes.length && coches.every((v,k) => v === bonnes[k]);
    return { it, i, coches, bonnes, juste };
  });

  const justes = details.filter(d => d.juste).length;
  q.corrige = true;
  q.resultat = { justes, total: details.length, details };

  enregistrerResultat(q);
  rendreCorrection();
}

function enregistrerResultat(q){
  const jour = aujourdhui();

  /* Statistiques par question, pour remonter les ratees dans les quiz composes. */
  q.resultat.details.forEach(d => {
    const cle = cleQuestion(d.it.coursId, d.it.seance, d.it.index);
    const st = ETAT.questions[cle] || {r:0,j:0};
    if(d.juste) st.j = (st.j||0)+1; else st.r = (st.r||0)+1;
    ETAT.questions[cle] = st;
  });

  if(q.type === "seance"){
    /* Note de la seance : uniquement ses propres questions, hors revision. */
    const propres = q.resultat.details.filter(d => d.it.seance === q.seance);
    const j = propres.filter(d => d.juste).length;
    const f = fiche(q.coursId);
    const ancienne = f.seances[q.seance];
    f.seances[q.seance] = {
      date: jour,
      justes: j,
      total: propres.length,
      tentatives: (ancienne && ancienne.tentatives ? ancienne.tentatives : 0) + 1,
      meilleur: Math.max(j, ancienne && ancienne.meilleur ? ancienne.meilleur : 0)
    };
    if(coursTermine(q.coursId) && !f.termine) f.termine = jour;
    ETAT.dernier = { coursId:q.coursId, seance:q.seance };
  }

  ETAT.historique.push({
    d: jour, type: q.type, coursId: q.coursId, seance: q.seance,
    justes: q.resultat.justes, total: q.resultat.total
  });
  if(ETAT.historique.length > 300) ETAT.historique = ETAT.historique.slice(-300);
  sauverEtat();
}

function listeReponses(it, indices, classe){
  if(!indices.length) return `<span class="rep ${classe}">aucune</span>`;
  return indices.map(k => `<span class="rep ${classe}">${esc(it.q.options[k])}</span>`).join("");
}

function blocCorrection(d){
  return `<div class="corr">
    <p class="enonce">${d.i+1}. ${esc(d.it.q.enonce)}</p>
    ${d.juste ? "" : `<p class="ligne-rep"><b>Vous avez coché</b>${listeReponses(d.it, d.coches, "faux")}</p>`}
    <p class="ligne-rep"><b>${d.juste ? "Réponse" : "Bonne réponse"}</b>${listeReponses(d.it, d.bonnes, "juste")}</p>
    <p class="expl">${esc(d.it.q.explication)}</p>
  </div>`;
}

function rendreCorrection(){
  const q = QUIZ, r = q.resultat;
  const pc = r.total ? Math.round(100*r.justes/r.total) : 0;
  const faux = r.details.filter(d => !d.juste);
  const bons = r.details.filter(d => d.juste);
  const parts = [];

  parts.push(`<div class="score">
    <div class="chiffre">${r.justes} / ${r.total}</div>
    <p class="minuscule" style="margin:6px 0 0">${pc} % de réponses exactes</p>
    <p class="secondaire" style="margin:8px 0 0">${
      faux.length ? faux.length + " question(s) à revoir ci-dessous." : "Aucune erreur : tout est juste."
    }</p>
  </div>`);

  if(q.type === "seance"){
    const propres = r.details.filter(d => d.it.seance === q.seance);
    const jp = propres.filter(d => d.juste).length;
    parts.push(`<p class="minuscule" style="text-align:center;margin:-8px 0 16px">
      Séance ${q.seance} : ${jp}/${propres.length}${
        r.details.length > propres.length
          ? " &#8226; révision séance " + (q.seance-1) + " : " + (r.justes-jp) + "/" + (r.details.length-propres.length)
          : ""}
    </p>`);
  }

  if(faux.length){
    parts.push(filet("Ce qu’il faut reprendre"));
    parts.push(faux.map(blocCorrection).join(""));
  }
  if(bons.length){
    parts.push(`<details class="justes"><summary>Voir les ${bons.length} question(s) juste(s)</summary>
      ${bons.map(blocCorrection).join("")}</details>`);
  }

  parts.push(`<div class="rang-boutons" style="margin-top:16px">
    <button class="bouton-plein" data-action="quiz-terminer">Terminer</button>
    <button class="bouton" data-action="quiz-menu">Nouveau quiz composé</button>
  </div>`);

  document.getElementById("vue-quiz").innerHTML = parts.join("");
  window.scrollTo(0,0);
}

function rendreMenuQuiz(){
  const parts = [];
  const c = coursEnCours();

  parts.push(`<div class="filet"><span>QCM de séance</span></div>`);
  if(c){
    const n = prochaineSeance(c.id);
    const e = etatSeance(c.id, n);
    parts.push(`<div class="carte">
      <h3>${esc(c.titre)}</h3>
      <p class="secondaire">Le QCM d’une séance s’ouvre à la fin de sa lecture : cinq questions de la séance,
      et cinq de la précédente en révision.</p>
      ${ e === "disponible"
        ? `<button class="bouton" data-action="reprendre" data-cours="${esc(c.id)}" data-seance="${n}">Lire la séance ${n}</button>`
        : `<p class="minuscule">${e === "demain" ? "Séance suivante disponible demain." : "Cours terminé."}</p>`}
    </div>`);
  }

  /* Refaire le QCM d'une seance deja faite. */
  const faites = [];
  COURS.forEach(co => co.seances.forEach(s => {
    if(estFaite(co.id, s.numero)) faites.push({co, s});
  }));
  if(faites.length){
    parts.push(`<div class="carte">
      <h3>Refaire un QCM de séance</h3>
      <select id="sel-seance">
        ${faites.map(f => `<option value="${esc(f.co.id)}|${f.s.numero}">${esc(f.co.titre)} &#8212; séance ${f.s.numero}</option>`).join("")}
      </select>
      <div class="saut"></div>
      <button class="bouton" data-action="quiz-seance-choisie">Lancer ce QCM</button>
    </div>`);
  }

  parts.push(filet("Quiz composé"));
  parts.push(`<div class="carte">
    <p class="secondaire">Cochez un ou plusieurs cours. Les questions sont tirées au hasard parmi ceux-ci,
    en remontant en priorité celles que vous avez déjà ratées.</p>
    ${COURS.map(co => {
      const dispo = nbFaites(co.id);
      return `<label class="coche">
        <input type="checkbox" data-compose="${esc(co.id)}" ${COMPOSE.coches.indexOf(co.id) >= 0 ? "checked" : ""}>
        <span>${esc(co.titre)}<br><span class="minuscule">${dispo} séance(s) faite(s) &#8226; ${co.seances.length*5} questions au total</span></span>
      </label>`;
    }).join("")}

    <div class="champ">
      <span class="txt"><strong>Nombre de questions</strong></span>
    </div>
    <select id="sel-nombre">
      <option value="10" ${COMPOSE.nombre === "10" ? "selected" : ""}>10 questions</option>
      <option value="20" ${COMPOSE.nombre === "20" ? "selected" : ""}>20 questions</option>
      <option value="toutes" ${COMPOSE.nombre === "toutes" ? "selected" : ""}>Toutes les questions</option>
    </select>

    <label class="coche" style="margin-top:10px">
      <input type="checkbox" id="compose-tout" ${COMPOSE.tout ? "checked" : ""}>
      <span>Inclure tout<br><span class="minuscule">Par défaut, seules les séances déjà faites sont tirées.</span></span>
    </label>

    <div class="saut"></div>
    <button class="bouton-plein" data-action="quiz-composer">Lancer le quiz</button>
    <div id="avis-compose"></div>
  </div>`);

  /* Historique. */
  if(ETAT.historique.length){
    parts.push(filet("Historique"));
    const h = ETAT.historique.slice(-12).reverse();
    parts.push(`<div class="carte"><ul class="liste">` + h.map(x => {
      const co = coursParId(x.coursId);
      const nom = x.type === "compose" ? "Quiz composé" : (co ? esc(co.titre) + " &#8212; séance " + x.seance : "Séance");
      const pc = x.total ? Math.round(100*x.justes/x.total) : 0;
      return `<li class="ligne" style="cursor:default">
        <span class="num"><span>${pc}</span></span>
        <span class="corps"><span class="t">${nom}</span>
        <span class="minuscule">${x.justes}/${x.total} &#8226; ${dateLisible(x.d)}</span></span></li>`;
    }).join("") + `</ul></div>`);
  }

  document.getElementById("vue-quiz").innerHTML = parts.join("");
}

/* ---------- 4.8  Navigation et evenements ---------- */

let ONGLET = "accueil";

function rendre(){
  document.body.dataset.onglet = ONGLET;   /* pilote l'en-tete compact */
  if(ONGLET === "accueil") rendreAccueil();
  else if(ONGLET === "cours") rendreCours();
  else rendreQuiz();
  document.querySelectorAll(".onglets button").forEach(b => {
    if(b.dataset.onglet === ONGLET) b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
  });
  document.querySelectorAll(".vue").forEach(v => v.classList.remove("active"));
  document.getElementById("vue-" + ONGLET).classList.add("active");
}

function aller(onglet, haut){
  ONGLET = onglet;
  rendre();
  if(haut !== false) window.scrollTo(0,0);
}

/* Ouvre la lecture d'une seance depuis n'importe quel onglet. */
function ouvrirSeance(coursId, numero){
  ECRAN = { nom:"lecture", coursId, seance:Number(numero) };
  aller("cours");
}

document.addEventListener("click", function(ev){
  const el = ev.target.closest("[data-action]");
  if(!el) return;
  const a = el.dataset.action;

  /* -- Navigation dans les cours -- */
  if(a === "catalogue"){ ECRAN = {nom:"catalogue"}; aller("cours"); }
  else if(a === "filtre"){ FILTRE = el.dataset.periode; rendreCours(); }
  else if(a === "fiche"){ ECRAN = {nom:"fiche", coursId:el.dataset.cours}; aller("cours"); }
  else if(a === "lire" || a === "reprendre"){ ouvrirSeance(el.dataset.cours, el.dataset.seance); }

  /* -- Quiz -- */
  else if(a === "quiz-seance"){
    QUIZ = construireQuizSeance(el.dataset.cours, Number(el.dataset.seance));
    aller("quiz");
  }
  else if(a === "quiz-seance-choisie"){
    const v = document.getElementById("sel-seance").value.split("|");
    QUIZ = construireQuizSeance(v[0], Number(v[1]));
    aller("quiz");
  }
  else if(a === "quiz-composer"){
    const nombre = document.getElementById("sel-nombre").value;
    const tout = document.getElementById("compose-tout").checked;
    COMPOSE.nombre = nombre; COMPOSE.tout = tout;
    if(!COMPOSE.coches.length){
      document.getElementById("avis-compose").innerHTML =
        `<div class="avis">Cochez au moins un cours.</div>`;
      return;
    }
    const q = construireQuizCompose(COMPOSE.coches, nombre, tout);
    if(!q){
      document.getElementById("avis-compose").innerHTML =
        `<div class="avis">Aucune question disponible : ces cours n’ont pas encore de séance faite.
         Cochez « Inclure tout » pour tirer parmi toutes les séances.</div>`;
      return;
    }
    QUIZ = q; aller("quiz");
  }
  else if(a === "quiz-valider"){ validerQuiz(); }
  else if(a === "quiz-abandonner"){
    if(QUIZ && !QUIZ.corrige && !confirm("Quitter ce quiz ? Les réponses seront perdues.")) return;
    QUIZ = null; aller("quiz");
  }
  else if(a === "quiz-terminer"){ QUIZ = null; aller("accueil"); }
  else if(a === "quiz-menu"){ QUIZ = null; aller("quiz"); }

  /* -- Reglages -- */
  else if(a === "bascule-rythme"){
    ETAT.reglages.uneSeanceParJour = !ETAT.reglages.uneSeanceParJour;
    sauverEtat(); rendreAccueil();
  }
  else if(a === "exporter"){ exporterFichier(); }
  else if(a === "afficher-json"){ afficherJson(); }
  else if(a === "importer-fichier"){ document.getElementById("champ-fichier").click(); }
  else if(a === "importer-texte"){ zoneImportTexte(); }
  else if(a === "valider-import-texte"){
    const t = document.getElementById("json-import");
    appliquerImport(t ? t.value : "");
  }
  else if(a === "effacer"){
    if(confirm("Effacer toute la progression ? Cette action est définitive.") &&
       confirm("Confirmez une seconde fois : toutes les séances et tous les scores seront perdus.")){
      ETAT = etatVierge(); sauverEtat(); aller("accueil");
    }
  }
});

/* Cases a cocher : QCM et quiz compose. */
document.addEventListener("change", function(ev){
  const t = ev.target;
  if(t.dataset && t.dataset.question !== undefined && QUIZ){
    const i = Number(t.dataset.question), o = Number(t.dataset.option);
    const l = QUIZ.reponses[i] || [];
    const k = l.indexOf(o);
    if(t.checked && k < 0) l.push(o);
    if(!t.checked && k >= 0) l.splice(k,1);
    QUIZ.reponses[i] = l;
    /* Efface le message d'erreur des qu'une case est cochee. */
    if(l.length){
      const err = document.getElementById("err-"+i);
      const bloc = document.getElementById("q-"+i);
      if(err) err.style.display = "none";
      if(bloc) bloc.classList.remove("en-erreur");
    }
  }
  else if(t.dataset && t.dataset.compose !== undefined){
    const id = t.dataset.compose;
    const k = COMPOSE.coches.indexOf(id);
    if(t.checked && k < 0) COMPOSE.coches.push(id);
    if(!t.checked && k >= 0) COMPOSE.coches.splice(k,1);
  }
  else if(t.id === "champ-fichier" && t.files && t.files[0]){
    const lecteur = new FileReader();
    lecteur.onload = e => appliquerImport(e.target.result);
    lecteur.readAsText(t.files[0]);
  }
});

/* Onglets du bas. L'onglet Cours revient toujours au catalogue : la
   lecture en cours se reprend depuis l'accueil, bouton << Reprendre >>. */
document.querySelectorAll(".onglets button").forEach(b => {
  b.addEventListener("click", () => {
    if(b.dataset.onglet === "cours") ECRAN = {nom:"catalogue"};
    aller(b.dataset.onglet);
  });
});

/* ---------- Export / import ---------- */

function paquetExport(){
  return JSON.stringify({ app:"clio", version:1, exporte:new Date().toISOString(), etat:ETAT }, null, 2);
}

function exporterFichier(){
  const texte = paquetExport();
  try{
    const blob = new Blob([texte], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "clio-progression-" + aujourdhui() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    avisAccueil("Fichier exporté. S’il ne s’est pas téléchargé, utilisez « Afficher le JSON ».", true);
  }catch(e){
    afficherJson();
  }
}

function afficherJson(){
  const z = document.getElementById("zone-json");
  if(!z) return;
  z.innerHTML = `<p class="minuscule">Sélectionnez ce texte et copiez-le pour le conserver.</p>
    <textarea readonly style="width:100%;min-height:170px;background:var(--noir-3);color:var(--creme);
      border:1px solid var(--laiton);padding:10px;font-size:12px;font-family:monospace">${esc(paquetExport())}</textarea>`;
}

function zoneImportTexte(){
  const z = document.getElementById("zone-json");
  if(!z) return;
  z.innerHTML = `<p class="minuscule">Collez ici un export Clio, puis validez.</p>
    <textarea id="json-import" style="width:100%;min-height:150px;background:var(--noir-3);color:var(--creme);
      border:1px solid var(--laiton);padding:10px;font-size:12px;font-family:monospace"></textarea>
    <div class="saut"></div>
    <button class="bouton petit" data-action="valider-import-texte">Importer ce JSON</button>`;
}

function appliquerImport(texte){
  let lu;
  try{ lu = JSON.parse(texte); }
  catch(e){ return avisAccueil("Import impossible : ce n’est pas un JSON valide.", false); }
  const donnees = (lu && lu.etat) ? lu.etat : lu;
  if(!donnees || typeof donnees !== "object" || (!donnees.cours && !donnees.historique)){
    return avisAccueil("Import impossible : ce fichier ne ressemble pas à une progression Clio.", false);
  }
  if(!confirm("Remplacer la progression actuelle par celle du fichier ?")) return;
  ETAT = fusionnerEtat(etatVierge(), donnees);
  sauverEtat();
  aller("accueil");
  avisAccueil("Progression importée.", true);
}

/* Petit message affiche en haut de l'onglet Accueil. */
function avisAccueil(texte, ok){
  if(ONGLET !== "accueil"){ aller("accueil"); }
  const vue = document.getElementById("vue-accueil");
  const d = document.createElement("div");
  d.className = "avis" + (ok ? " ok" : "");
  d.textContent = texte;
  vue.insertBefore(d, vue.firstChild);
  window.scrollTo(0,0);
}

/* ---------- Demarrage ---------- */
rendre();
</script>
