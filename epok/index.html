        document.getElementById("avis-compose").innerHTML =
          `<div class="avis">Aucune question disponible&#8239;: ces cours n’ont pas encore de séance lue.
           Cochez « Inclure tout » pour tirer parmi toutes les séances.</div>`;
        return;
      }
      QUIZ = q; aller("quiz");
    }, perdus => avisQuizPerdu(perdus));
  }
  else if(a === "quiz-valider"){ validerQuiz(); }
  else if(a === "quiz-abandonner"){
    if(QUIZ && !QUIZ.corrige && !confirm("Quitter ce quiz ? Les réponses seront perdues.")) return;
    QUIZ = null; aller("quiz");
  }
  else if(a === "quiz-terminer"){ QUIZ = null; aller("accueil"); }
  else if(a === "quiz-menu"){ QUIZ = null; aller("quiz"); }

  /* -- Reglages -- */
  else if(a === "relecture"){ ECRAN = {nom:"relecture"}; aller("cours"); }
  else if(a === "bascule-relecture"){
    ETAT.reglages.relecture = !ETAT.reglages.relecture;
    sauverEtat(); rendreCours();
  }
  else if(a === "bascule-rythme"){
    ETAT.reglages.uneSeanceParJour = !ETAT.reglages.uneSeanceParJour;
    sauverEtat(); rendre();  /* l'ecran ou l'on est : les reglages, le plus souvent */
  }
  else if(a === "theme"){
    ETAT.reglages.theme = el.dataset.theme;
    sauverEtat(); appliquerCharte(); rendre();  /* l'ecran ou l'on est : les reglages, le plus souvent */
  }
  else if(a === "echelle"){
    ETAT.reglages.echelle = Number(el.dataset.echelle);
    sauverEtat(); appliquerCharte(); rendre();  /* l'ecran ou l'on est : les reglages, le plus souvent */
  }
  else if(a === "police"){
    ETAT.reglages.police = el.dataset.police;
    sauverEtat(); appliquerCharte(); rendre();  /* l'ecran ou l'on est : les reglages, le plus souvent */
  }
  /* Deux raccourcis offerts pendant la lecture, la ou le besoin se fait
     sentir : basculer en veillee, et changer de corps de texte. */
  else if(a === "bascule-theme"){
    const sombre = document.documentElement.getAttribute("data-theme") === "sombre"
      || (ETAT.reglages.theme === "auto" && window.matchMedia
          && window.matchMedia("(prefers-color-scheme: dark)").matches);
    ETAT.reglages.theme = sombre ? "clair" : "sombre";
    sauverEtat(); appliquerCharte();
  }
  else if(a === "cycle-echelle"){
    const k = ECHELLES.indexOf(ETAT.reglages.echelle);
    ETAT.reglages.echelle = ECHELLES[(k + 1) % ECHELLES.length];
    sauverEtat(); appliquerCharte();
  }
  else if(a === "exporter"){ exporterFichier(); }
  else if(a === "afficher-json"){ afficherJson(); }
  else if(a === "importer-fichier"){ document.getElementById("champ-fichier").click(); }
  else if(a === "importer-texte"){ zoneImportTexte(); }
  else if(a === "valider-import-texte"){
    const t = document.getElementById("json-import");
    appliquerImport(t ? t.value : "");
  }
  else if(a === "effacer"){
    if(confirm("Effacer toute la progression ? Cette action est définitive.") &&
       confirm("Confirmez une seconde fois : toutes les séances et tous les scores seront perdus.")){
      ETAT = etatVierge(); sauverEtat(); appliquerCharte(); aller("accueil");
    }
  }
});

/* Cases a cocher : QCM et quiz compose. */
document.addEventListener("change", function(ev){
  const t = ev.target;
  if(t.dataset && t.dataset.action === "choisir-voix"){
    VOIX.choisirVoix(t.value);
    return;
  }
  if(t.dataset && t.dataset.action === "qcm-cours"){
    QCM_COURS = t.value;
    rendreQuiz();
    return;
  }
  if(t.dataset && t.dataset.action === "avancement"){
    AVANCEMENT = t.value;
    rendreCours();
    return;
  }
  if(t.dataset && t.dataset.question !== undefined && QUIZ){
    const i = Number(t.dataset.question), o = Number(t.dataset.option);
    const l = QUIZ.reponses[i] || [];
    const k = l.indexOf(o);
    if(t.checked && k < 0) l.push(o);
    if(!t.checked && k >= 0) l.splice(k,1);
    QUIZ.reponses[i] = l;
    /* Efface le message d'erreur des qu'une case est cochee. */
    if(l.length){
      const err = document.getElementById("err-"+i);
      const bloc = document.getElementById("q-"+i);
      if(err) err.style.display = "none";
      if(bloc) bloc.classList.remove("en-erreur");
    }
    majAvancement();
  }
  else if(t.dataset && t.dataset.verif !== undefined){
    const cle = t.dataset.verif;
    if(t.checked) ETAT.verifies[cle] = true; else delete ETAT.verifies[cle];
    sauverEtat();
    /* On ne redessine que la ligne : redessiner la liste entiere ferait
       sauter la page sous le doigt, au milieu d'une serie de coches. */
    const l = t.closest(".verif-ligne");
    if(l) l.classList.toggle("fait", t.checked);
  }
  else if(t.dataset && t.dataset.giga !== undefined){
    const id = t.dataset.giga;
    const k = GIGA.coches.indexOf(id);
    if(t.checked && k < 0) GIGA.coches.push(id);
    if(!t.checked && k >= 0) GIGA.coches.splice(k,1);
    const avis = document.getElementById("avis-giga");
    if(avis) avis.innerHTML = GIGA.coches.length > GIGA_MAX
      ? `<div class="avis">${GIGA_MAX} cours au plus dans un giga quiz.</div>` : "";
  }
  else if(t.dataset && t.dataset.compose !== undefined){
    const id = t.dataset.compose;
    const k = COMPOSE.coches.indexOf(id);
    if(t.checked && k < 0) COMPOSE.coches.push(id);
    if(!t.checked && k >= 0) COMPOSE.coches.splice(k,1);
  }
  else if(t.id === "champ-fichier" && t.files && t.files[0]){
    const lecteur = new FileReader();
    lecteur.onload = e => appliquerImport(e.target.result);
    lecteur.readAsText(t.files[0]);
    /* Remis a zero pour pouvoir reimporter deux fois le meme fichier. */
    t.value = "";
  }
});

/* Recherche : seule la liste des resultats est redessinee, pour que le
   champ garde le curseur et le clavier reste ouvert. */
document.addEventListener("input", function(ev){
  if(!ev.target || ev.target.id !== "champ-recherche") return;
  RECHERCHE = ev.target.value;
  const croix = document.querySelector('[data-action="vider-recherche"]');
  if(croix) croix.style.display = RECHERCHE ? "block" : "none";
  rendreResultats();
});

/* Copier un passage ne doit pas copier les tirets conditionnels : ils
   sont invisibles ici mais ressortent dans certains editeurs, et ce
   serait une mauvaise surprise pour qui colle une citation dans sa
   preparation de cours. */
document.addEventListener("copy", function(ev){
  const sel = window.getSelection ? String(window.getSelection()) : "";
  if(!sel || sel.indexOf("\u00ad") === -1) return;
  if(!ev.clipboardData) return;
  ev.clipboardData.setData("text/plain", CESURE.oter(sel));
  ev.preventDefault();
});

/* Onglets du bas. L'onglet Cours revient toujours au catalogue : la
   lecture en cours se reprend depuis l'accueil, bouton << Reprendre >>. */
document.querySelectorAll(".onglets button").forEach(b => {
  b.addEventListener("click", () => {
    if(b.dataset.onglet === "cours") ECRAN = {nom:"catalogue"};
    aller(b.dataset.onglet);
  });

/* Retour en haut de page. */
(function(){
  const h = document.getElementById("haut");
  if(h) h.addEventListener("click", () => window.scrollTo({top:0, behavior:"smooth"}));
})();

/* ---------- Export / import ---------- */

function paquetExport(){
  return JSON.stringify({ app:"epok", version:2, exporte:new Date().toISOString(), etat:ETAT }, null, 2);
}

function exporterFichier(){
  const texte = paquetExport();
  const nom = "epok-progression-" + aujourdhui() + ".json";
  /* Deux contextes possibles :
     - fichier ouvert depuis le disque ou depuis l'application Android :
       un lien <a download> suffit ;
     - page publiee sur claude.ai : le lien y est sans effet, il faut
       passer par la capacite « downloads » de la visionneuse.
     On detecte le second cas et on retombe sur le premier sinon. */
  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("downloads").then(outil => {
      if(!outil){ telechargerBlob(texte, nom); return; }
      outil.save({ filename: nom, data: texte })
        .then(() => avisAccueil("Progression exportée.", true))
        .catch(err => {
          if(err && err.code === "declined") avisAccueil("Export annulé.", true);
          else afficherJson();
        });
    }).catch(() => telechargerBlob(texte, nom));
    return;
  }
  telechargerBlob(texte, nom);
}

/* Telechargement classique, pour le fichier ouvert depuis le disque. */
function telechargerBlob(texte, nom){
  try{
    const blob = new Blob([texte], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nom;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    avisAccueil("Fichier exporté. S’il ne s’est pas téléchargé, utilisez « Afficher le code de sauvegarde ».", true);
  }catch(e){
    afficherJson();
  }
}

function afficherJson(){
  const z = document.getElementById("zone-json");
  if(!z) return;
  z.innerHTML = `<p class="minuscule">Sélectionnez ce texte et copiez-le pour le conserver.</p>
    <textarea readonly style="width:100%;min-height:170px;font-size:12px;font-family:monospace"
      >${esc(paquetExport())}</textarea>`;
}

function zoneImportTexte(){
  const z = document.getElementById("zone-json");
  if(!z) return;
  z.innerHTML = `<p class="minuscule">Collez ici un export Epok, puis validez.</p>
    <textarea id="json-import" style="width:100%;min-height:150px;font-size:12px;font-family:monospace"></textarea>
    <div class="saut"></div>
    <button class="bouton petit" data-action="valider-import-texte">Importer ce code</button>`;
}

function appliquerImport(texte){
  let lu;
  try{ lu = JSON.parse(texte); }
  catch(e){ return avisAccueil("Import impossible : ce n’est pas un code de sauvegarde valide.", false); }
  const donnees = (lu && lu.etat) ? lu.etat : lu;
  if(!donnees || typeof donnees !== "object" || (!donnees.cours && !donnees.historique)){
    return avisAccueil("Import impossible : ce fichier ne ressemble pas à une progression Epok.", false);
  }
  if(!confirm("Remplacer la progression actuelle par celle du fichier ?")) return;
  ETAT = fusionnerEtat(etatVierge(), donnees);
  migrerPalier();
  sauverEtat();
  appliquerCharte();
  aller("accueil");
  avisAccueil("Progression importée.", true);
}

/* Petit message affiche en haut de l'onglet Accueil. */
function avisAccueil(texte, ok){
  /* L'avis se pose la ou l'action a ete faite. L'import, l'export et
     l'effacement sont passes sur l'ecran des reglages : y renvoyer le
     lecteur a l'accueil pour lui lire une confirmation lui ferait perdre
     sa place et la liste de commandes qu'il etait en train d'utiliser. */
  if(ONGLET !== "accueil" && ONGLET !== "reglages"){ aller("accueil"); }
  const vue = document.getElementById("vue-" + ONGLET);
  const d = document.createElement("div");
  d.className = "avis" + (ok ? " ok" : "");
  d.textContent = texte;
  vue.insertBefore(d, vue.firstChild);
  window.scrollTo(0,0);
}

/* ---------- Demarrage ---------- */
migrerPalier();
noterVisite();
if(typeof document !== "undefined") document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") noterVisite();
});
/* Un lien peut choisir le mode d'avance : .../epok/?mode=brevet, a
   donner aux eleves, ouvre directement les revisions du brevet. Il ne
   joue qu'au premier lancement ; ensuite, le mode se change dans les
   reglages. */
(function(){
  let m = null;
  try{ m = new URLSearchParams(location.search).get("mode"); }catch(e){}
  if(!ETAT.reglages.mode && (m === "culture" || m === "brevet")){ ETAT.reglages.mode = m; sauverEtat(); }
})();
/* Version web (https) : fonctionnement hors ligne par le service worker,
   et stockage persistant, pour que le navigateur n'efface pas la
   progression. Sans objet dans l'APK et en fichier local. */
if(typeof location !== "undefined" && location.protocol === "https:"){
  /* Pas d'Epok dans le cadre d'un autre site, qui pourrait faire toucher
     des boutons a l'insu du joueur (« clickjacking ») : la page sort du
     cadre, ou se masque si elle ne le peut pas. */
  if(window.top !== window.self){
    try{ window.top.location.replace(location.href); }catch(e){ document.documentElement.style.display = "none"; }
  }
  if("serviceWorker" in navigator){
    /* Une nouvelle version publiee : son service worker prend la main
       sans recharger la page. Elle vient deja du reseau (sw.js la sert
       toujours fraiche) : le rechargement d'autrefois ne servait a rien et
       tombait au milieu d'un appui, quelques secondes apres l'ouverture. */
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
  }
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
appliquerCharte();
rendre();
/* L'accueil est la premiere entree : c'est de la que Retour sort. */
try{ history.replaceState(etatNav(), ""); }catch(e){}

/* L'ecran d'ouverture a fini son fondu : on le retire du DOM plutot que
   de le laisser, invisible, par-dessus la page. */
(function(){
  const ouverture = document.getElementById("ouverture");
  if(ouverture) setTimeout(() => ouverture.remove(), 2200);
})();
</script>
