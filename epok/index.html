<style>
/* =====================================================================
   1. CHARTE << XIXe SIECLE >> — papier, encre et dorure
   ---------------------------------------------------------------------
   Le modele n'est pas l'affiche, c'est le LIVRE : papier verge jauni,
   encre brune, filets graves, fleurons typographiques, lettrines. La
   page se lit comme une revue illustree du second XIXe siecle.

   Tout est nomme par son role (--fond, --texte...) et jamais par sa
   couleur : la charte « veillee » (mode sombre) redefinit les memes
   noms sans qu'aucune regle de mise en page ne bouge.
   ===================================================================== */
:root{
  /* -- Charte « papier » (jour) -- */
  /* Le papier a ete eclairci et desature en octobre 2026 : il passait de
     16,3 % de saturation a 7,8 %, et le contraste avec l'encre de 11,4 a
     12,6. Le ton reste chaud -- ce n'est pas du blanc -- mais le jaune ne
     mange plus les deliés. */
  --fond:#f4eee1;           /* papier verge, a peine chaud */
  --fond-2:#fbf7f0;         /* fond des cartes : feuillet plus clair */
  --fond-3:#eae1d0;         /* fond des elements en creux */
  --texte:#332719;          /* encre brune */
  --texte-2:#645238;        /* texte secondaire, encre delavee */
  --or:#7d5e18;             /* dorure lisible sur papier (texte) */
  --or-vif:#a8801f;         /* dorure pour les aplats et ornements */
  --laiton:#b39a5e;         /* filets discrets */
  --bordeaux:#7d1d26;       /* maroquin : accent principal */
  --bordeaux-pale:#a85560;
  --vert:#2c4a33;           /* vert bouteille : gardes du livre */
  --rouge-faux:#9e2b1e;
  --vert-juste:#2f6b45;

  /* Texture du papier et vignettage, variables pour que la veillee les
     inverse sans dupliquer les regles de body::before / body::after. */
  --verge-a:rgba(116,88,44,.05);
  --verge-b:rgba(116,88,44,.045);
  --vignettage:rgba(94,68,32,.08);
  --ombre:rgba(70,48,22,.10);
  --ombre-forte:rgba(70,48,22,.18);
  --voile:rgba(255,252,246,.60);   /* fond des options cochables */

  --police-titre:'Playfair Display','Didot','Bodoni MT','Big Caslon',
                 Georgia,serif;
  /* Deux polices de texte, au choix du lecteur.
     << papier >> est la serif d'origine : c'est le livre du XIXe.
     << ecran >> est la police du systeme, celle que l'appareil emploie
     pour tout le reste. Elle n'est pas chargee, elle n'est pas choisie :
     c'est celle que le lecteur voit toute la journee, donc celle a
     laquelle son oeil est fait. Une linéale a graisse uniforme garde ses
     delies a 17 pixels la ou une serif a forte modulation les perd. */
  --police-papier:'Libre Baskerville','Baskerville','Hoefler Text',
                  Georgia,'Times New Roman',serif;
  --police-ecran:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',
                 'Helvetica Neue',Arial,sans-serif;
  --police-texte:var(--police-ecran);

  --rayon:2px;
  --large:min(100%,720px);
  --barre:64px;             /* hauteur de la barre d'onglets */
  --echelle:1;              /* taille du texte, reglable par le lecteur */
  --cr-encre:#3a3020;       /* encre par defaut des croquis */
}
html[data-police="papier"]{ --police-texte:var(--police-papier) }
html[data-police="ecran"]{ --police-texte:var(--police-ecran) }

/* -- Mode nuit (octobre 2026) : noir et blanc, classique -------------
   Le maroquin sombre et l'encre doree d'origine manquaient de contraste
   pour beaucoup de lecteurs. Fond presque noir, texte blanc, accents
   clairs : un mode nuit comme on en a l'habitude. Les memes noms de roles
   changent de valeur ; aucune regle de mise en page ne bouge. Le mode
   suit le systeme par defaut, et le lecteur peut forcer l'un ou l'autre
   depuis les reglages (attribut data-theme sur <html>). */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="clair"]){
    --fond:#0b0b0b; --fond-2:#171717; --fond-3:#242424;
    --texte:#f5f5f5; --texte-2:#c4c4c4;
    --or:#f0cf7a; --or-vif:#f0cf7a; --laiton:#4a4a4a;
    --bordeaux:#f2f2f2; --bordeaux-pale:#5a5a5a;
    --vert:#9fd9ad; --rouge-faux:#ff8a7a; --vert-juste:#8fe0a8;
    --verge-a:transparent;
    --verge-b:transparent;
    --vignettage:transparent;
    --ombre:rgba(0,0,0,.6);
    --ombre-forte:rgba(0,0,0,.75);
    --voile:rgba(255,255,255,.06);
    --cr-encre:#3a3020;
    color-scheme:dark;
  }
}
:root[data-theme="sombre"]{
    --fond:#0b0b0b; --fond-2:#171717; --fond-3:#242424;
    --texte:#f5f5f5; --texte-2:#c4c4c4;
    --or:#f0cf7a; --or-vif:#f0cf7a; --laiton:#4a4a4a;
    --bordeaux:#f2f2f2; --bordeaux-pale:#5a5a5a;
    --vert:#9fd9ad; --rouge-faux:#ff8a7a; --vert-juste:#8fe0a8;
    --verge-a:transparent;
    --verge-b:transparent;
    --vignettage:transparent;
    --ombre:rgba(0,0,0,.6);
    --ombre-forte:rgba(0,0,0,.75);
    --voile:rgba(255,255,255,.06);
    --cr-encre:#3a3020;
    color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--fond);
  color:var(--texte);
  font-family:var(--police-texte);
  font-size:calc(16.5px * var(--echelle));
  line-height:1.74;
  min-height:100vh;
  position:relative;
}
/* Papier verge : les vergeures (fines lignes rapprochees laissees par
   la forme du papetier) et les pontuseaux (chainettes plus espacees,
   perpendiculaires). Deux degrades repetes suffisent, sans aucun
   fichier ni requete. Purement decoratif, donc insensible au toucher. */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg, var(--verge-a) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, var(--verge-b) 0 1px, transparent 1px 27px);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 38%,
             transparent 52%, var(--vignettage) 100%);
}
img{max-width:100%}
h1,h2,h3,h4{font-family:var(--police-titre);font-weight:700;line-height:1.24;margin:0}
p{margin:0 0 1em}
a{color:var(--bordeaux)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--or-vif);outline-offset:2px}

/* --- Ossature ------------------------------------------------------ */
.app{width:var(--large);margin:0 auto;
     padding:0 16px calc(var(--barre) + 28px + env(safe-area-inset-bottom));}
.vue{display:none}
.vue.active{display:block;animation:apparition .22s ease-out both}
@keyframes apparition{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* --- Filets graves ---------------------------------------------------
   Le filet double — un trait gras, un trait maigre — est l'ornement de
   base de la typographie du XIXe. Il revient partout. */
.filet-double{height:0;border-top:2.5px solid var(--bordeaux);
  border-bottom:1px solid var(--laiton);padding-bottom:3px}
.filet-double.bas{border-top-width:1px;border-bottom:2.5px solid var(--bordeaux);
  padding-bottom:0;padding-top:3px;border-top-color:var(--laiton)}

/* --- En-tete facon page de titre ------------------------------------ */
.entete{text-align:center;padding:18px 0 10px;position:relative}
.entete h1{
  font-size:clamp(40px,13.5vw,62px);font-weight:900;letter-spacing:.10em;
  text-indent:.10em;color:var(--bordeaux);margin:2px 0 2px;
}
.entete .sous{
  font-family:var(--police-titre);font-style:italic;font-weight:400;
  font-size:13.5px;letter-spacing:.06em;color:var(--texte-2);margin:0 0 10px;line-height:1.35;
}
/* Le meme en-tete sur tous les onglets, lecture comprise : la marque a
   gauche, l'insigne de rang a droite, a la meme taille, tous deux centres
   entre les deux grands filets (l'en-tete a 18 px de marge en haut et 10
   en bas, d'ou les 4 px) ; le titre et son sous-titre au milieu. */
.vignette{position:absolute;left:4px;top:calc(50% + 4px);transform:translateY(-50%);
  color:var(--or-vif);line-height:1;margin:0}
.vignette .marque{width:52px;height:52px;display:block}


/* Separateur de section, avec fleuron et titre en petites capitales. */
.filet{display:flex;align-items:center;gap:12px;margin:26px 0 14px}
.filet::before,.filet::after{content:"";flex:1;height:0;
  border-top:1px solid var(--laiton);border-bottom:1px solid var(--laiton);
  opacity:.75;padding-bottom:2px}
.filet span{
  font-family:var(--police-titre);font-size:12.5px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--bordeaux);font-weight:700;
  text-align:center;max-width:76%;
}
.losange{color:var(--or-vif);opacity:.95;font-size:14px}

/* --- Cartes : un feuillet contrecolle -------------------------------- */
.carte{
  background:var(--fond-2);
  border:1px solid var(--laiton);
  border-radius:var(--rayon);
  padding:16px;margin:0 0 16px;position:relative;
  box-shadow:0 0 0 3px var(--fond-2), 0 0 0 4px var(--bordeaux-pale),
             0 2px 6px var(--ombre);
}
.carte h2,.carte h3{color:var(--bordeaux)}
.carte h2{font-size:25px;letter-spacing:.01em;margin-bottom:6px}
.carte h3{font-size:19.5px;letter-spacing:.01em;margin-bottom:6px}
/* Carte sans le double encadrement : pour les listes, ou le cadre
   repete toutes les six lignes deviendrait du bruit. */
.carte.nue{box-shadow:0 1px 3px var(--ombre)}
.secondaire{color:var(--texte-2);font-size:15px}
.minuscule{font-size:13px;color:var(--texte-2);letter-spacing:.02em}
.capitales{font-family:var(--police-titre);font-size:11.5px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--texte-2)}

/* --- Boutons : le cachet imprime ------------------------------------- */
.bouton,.bouton-plein{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:10px 20px;width:100%;
  font-family:var(--police-titre);font-size:15px;letter-spacing:.14em;
  text-transform:uppercase;cursor:pointer;border-radius:var(--rayon);
  background:var(--fond-2);border:1px solid var(--bordeaux);color:var(--bordeaux);
  text-align:center;font-weight:700;
  transition:transform .08s, background .14s;
}
.bouton-plein{background:var(--bordeaux);border-color:var(--bordeaux);color:var(--fond-2)}
.bouton:active,.bouton-plein:active{transform:translateY(1px)}
.bouton[disabled],.bouton-plein[disabled]{opacity:.42;cursor:not-allowed}
.bouton.petit,.bouton-plein.petit{width:auto;min-height:40px;padding:6px 14px;
  font-size:12.5px;letter-spacing:.1em}
.bouton.discret{border-color:var(--laiton);color:var(--texte-2);background:transparent}
.rang-boutons{display:flex;flex-wrap:wrap;gap:8px}

/* --- Commande segmentee : deux ou trois entrees exclusives ------------
   Remplace deux pastilles la ou le choix est binaire : on voit d'un
   coup d'oeil qu'il n'y a qu'une position possible a la fois. */
.seg{display:flex;border:1px solid var(--laiton);border-radius:999px;
  overflow:hidden;background:var(--fond-3);margin:0 0 14px}
.seg button{
  flex:1;min-height:40px;padding:8px 10px;border:0;background:transparent;
  font-family:var(--police-titre);font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;font-weight:700;color:var(--texte-2);cursor:pointer;
  transition:background .16s,color .16s;
}
.seg button[aria-pressed="true"]{background:var(--bordeaux);color:var(--fond-2)}

/* --- Barre de tri du catalogue ---------------------------------------
   Le catalogue portait cinq rangs de commandes avant le premier cours :
   recherche, entree, pastilles de theme, pastilles d'avancement, puis un
   bouton de tirage flanque d'une bascule << jamais commence >> dont rien
   ne disait si elle etait active. Les deux rangs de pastilles commencaient
   l'un et l'autre par un << tous >> rouge et se lisaient donc comme un
   seul reglage double. L'avancement passe en liste deroulante -- un
   controle qui dit son etat sans qu'on le touche, et que le telephone
   presente a sa facon -- et la bascule devient l'interrupteur des
   reglages, avec sa phrase a cote. */
.choix{
  min-height:40px;margin:0;padding:8px 34px 8px 15px;
  font-family:var(--police-titre);font-size:11.5px;letter-spacing:.07em;
  text-transform:uppercase;font-weight:700;color:var(--texte-2);
  border:1px solid var(--laiton);border-radius:999px;background-color:var(--fond-2);
  appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--laiton) 50%),
                   linear-gradient(135deg,var(--laiton) 50%,transparent 50%);
  background-position:calc(100% - 20px) calc(50% + 1px),calc(100% - 15px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
/* Une seule rangee sous le classement : le filtre d'avancement a gauche,
   << tout deplier >> a droite. */
.barre-cat{display:flex;align-items:center;justify-content:space-between;
  gap:14px;margin:0 0 20px}
.barre-cat .lien{background:none;border:0;cursor:pointer;padding:8px 2px;
  font-family:var(--police-titre);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;color:var(--texte-2);white-space:nowrap;
  text-decoration:underline;text-underline-offset:3px}
.barre-cat .lien:hover{color:var(--bordeaux)}

/* Le tirage au hasard a sa carte, en bas du catalogue : le choix
   << jamais commences / tous >> se lit DANS la carte du bouton qu'il
   regle, au lieu de flotter a l'autre bout d'une rangee. */
.seg.seg-petit{margin:0 0 14px}
.seg.seg-petit button{min-height:36px;font-size:11px;letter-spacing:.08em;padding:6px 8px}
.carte.hasard .secondaire{margin:0 0 12px}

/* --- Sommaire repliable du catalogue ---------------------------------
   Cinquante-six cours a la file faisaient un rouleau de vingt-trois mille
   pixels : on ne cherche pas dans un rouleau, on le subit. Sans filtre ni
   recherche, les sections se replient et l'onglet s'ouvre sur un sommaire
   d'une dizaine de lignes, chacune disant combien de cours elle contient
   et combien sont commences. Des qu'une recherche ou un filtre reduit la
   liste, le sommaire disparait et les resultats s'affichent a plat : on ne
   demande pas a quelqu'un qui vient de chercher de deplier son resultat. */
/* Chaque section est un feuillet : titre en romain, compte dessous,
   chevron dans un rond a droite. Les capitales espacees d'avant
   passaient sur trois lignes des que le theme etait long. */
.section-cat{background:var(--fond-2);border:1px solid var(--laiton);
  border-radius:var(--rayon);margin:0 0 12px;box-shadow:0 1px 3px var(--ombre);
  transition:border-color .16s}
.section-cat.ouverte{border-color:var(--bordeaux-pale)}
.pli{display:flex;align-items:center;gap:14px;width:100%;margin:0;
  padding:15px 16px;text-align:left;cursor:pointer;background:transparent;border:0;
  color:var(--texte)}
.pli-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pli-nom{font-family:var(--police-titre);font-size:17px;font-weight:700;
  color:var(--texte);line-height:1.25}
.pli-compte{font-size:13px;color:var(--texte-2)}
.pli-compte b{color:var(--or);font-weight:700}
.pli-fleche{flex:0 0 auto;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--laiton);display:flex;align-items:center;justify-content:center;
  color:var(--or);transition:transform .2s,border-color .2s,color .2s}
.pli-fleche svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.pli[aria-expanded="true"] .pli-fleche{transform:rotate(90deg);
  border-color:var(--bordeaux);color:var(--bordeaux)}
/* Dans une section ouverte, les cours sont poses sur le papier de la page,
   pour se detacher du feuillet qui les porte. */
.section-cat .grille{padding:2px 12px 14px;margin:0}
.section-cat .cours-carte{background:var(--fond);box-shadow:none}
/* Titre de periode dans le sommaire par theme : les themes s'y rangent
   sous la periode ou ils s'ancrent. */
.nobr{white-space:nowrap}
.cat-periode{font-family:var(--police-titre);font-size:11.5px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--bordeaux);
  margin:22px 2px 10px;padding-bottom:6px;border-bottom:1px solid var(--laiton)}
#resultats .cat-periode:first-child{margin-top:4px}
.bientot{text-align:center;margin:18px 0 0;font-size:13px;color:var(--texte-2);line-height:1.7}

/* --- Insigne de rang, en haut a droite de l'en-tete -------------------
   Present sur chaque ecran, il montre le badge du rang et les points
   juste dessous. Un appui mene au detail du rang. Il a pris, en octobre
   2026, la place de la roue des reglages, devenus un onglet du bas. */
.insigne{position:absolute;top:calc(50% + 4px);transform:translateY(-50%);right:4px;display:flex;flex-direction:column;
  align-items:center;gap:1px;padding:2px 4px;border:0;background:transparent;
  cursor:pointer;line-height:1;border-radius:8px}
.insigne .pts{font-family:var(--police-titre);font-size:12px;font-weight:700;
  color:var(--texte-2);letter-spacing:.03em;white-space:nowrap}

/* --- Champ de recherche ---------------------------------------------- */
.recherche{position:relative;margin:0 0 14px}
.recherche .loupe{position:absolute;left:15px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;fill:none;stroke:var(--texte-2);stroke-width:2;
  stroke-linecap:round;pointer-events:none}
.recherche input{
  width:100%;min-height:46px;padding:10px 40px 10px 42px;font:inherit;
  font-size:15.5px;color:var(--texte);background:var(--fond-2);
  border:1px solid var(--laiton);border-radius:999px;
}
/* La croix d'effacement est la notre : celle du navigateur la doublait. */
.recherche input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.recherche input::placeholder{color:var(--texte-2);opacity:.85;font-style:italic}
.recherche .effacer{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border:0;background:transparent;color:var(--texte-2);
  font-size:19px;cursor:pointer;line-height:1;
}

/* --- Etiquettes ------------------------------------------------------ */
.etiq{
  display:inline-block;font-family:var(--police-titre);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;font-weight:700;
  border:1px solid var(--laiton);color:var(--texte-2);border-radius:999px;
  vertical-align:middle;background:var(--fond-2);
}
.etiq.or{border-color:var(--or-vif);color:var(--or)}
.etiq.faite{border-color:var(--vert-juste);color:var(--vert-juste)}
.etiq.lue{border-color:var(--or-vif);color:var(--or)}
.etiq.bientot{border-color:var(--bordeaux-pale);color:var(--bordeaux)}
.etiq.sombre{background:var(--bordeaux);border-color:var(--bordeaux);color:var(--fond-2)}

/* --- Anneau de progression -------------------------------------------
   Un cercle grave plutot qu'une barre : il tient dans un coin de carte,
   se lit d'un coup d'oeil et porte son chiffre au centre. */
.anneau{flex:0 0 auto;position:relative;display:inline-block;line-height:0}
.anneau svg{display:block;transform:rotate(-90deg)}
.anneau .fond{fill:none;stroke:var(--fond-3);stroke-width:5}
.anneau .trait{fill:none;stroke:var(--or-vif);stroke-width:5;stroke-linecap:round;
  transition:stroke-dashoffset .5s ease}
.anneau.fini .trait{stroke:var(--vert-juste)}
.anneau .chiffre{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--police-titre);font-weight:700;font-size:14px;color:var(--bordeaux);
  line-height:1;
}
.anneau.fini .chiffre{color:var(--vert-juste);font-size:17px}

/* Anneau de cours, a deux niveaux : la bande exterieure compte les
   seances lues, la bande interieure celles dont le QCM est passe. Les
   epaisseurs sont portees par l'attribut du SVG (d'ou des classes a part,
   qui ne croisent pas les regles de l'anneau simple ci-dessus). */
.anneau .bande-fond{fill:none;stroke:var(--fond-3)}
.anneau .bande{fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.anneau .bande.lues{stroke:var(--or-vif)}
.anneau .bande.faites{stroke:var(--bordeaux)}
.anneau.fini .bande.faites,.anneau.maitre .bande.faites{stroke:var(--vert-juste)}
/* Le chiffre du centre compte les seances lues : il prend donc la couleur
   de la bande exterieure (or), pas celle des QCM (bordeaux). */
.anneau.double .chiffre{font-size:11px;color:var(--or)}
.anneau.double.grand .chiffre{font-size:14px}
.anneau.double.fini .chiffre{color:var(--vert-juste);font-size:15px}
.anneau.double.maitre .chiffre{color:var(--or-vif);font-size:17px}
.puce{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 5px 0 0;
  vertical-align:baseline;background:var(--or-vif)}
.puce.bd{background:var(--bordeaux)}
.etiq.maitre{background:var(--or-vif);border-color:var(--or-vif);color:#1b150e}
/* Termine, mais l'epreuve finale reste a reussir. */
.etiq.a-valider{border-color:var(--bordeaux);color:var(--bordeaux);border-style:dashed}
.carte.a-valider{border-color:var(--bordeaux)}
.ligne.fermee{opacity:.62}
.ligne.refaire .etat{color:var(--bordeaux)}
.qcm-seances{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.qcm-num{min-height:44px;border:1px solid var(--bordeaux);border-radius:var(--rayon);background:var(--fond-2);
  color:var(--bordeaux);font:700 15px/1 var(--police-titre);cursor:pointer}
.qcm-num.faite{border-color:var(--vert-juste);color:var(--vert-juste)}
.qcm-num.refaire{background:var(--bordeaux);color:var(--fond-2)}
.qcm-num:disabled{border-style:dashed;border-color:var(--laiton);color:var(--texte-2);opacity:.6;cursor:default}
.carte.a-valider .ligne{width:100%;margin:6px 0 0}
.bonus-restants li{padding:10px 0;border-bottom:1px dotted var(--laiton);list-style:none}
.bonus-restants li:last-child{border-bottom:0}
.bonus-restants .t{margin:0 0 8px;font-family:var(--police-titre);font-weight:700;color:var(--bordeaux)}
.bonus-duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bonus-case{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;padding:8px 6px;
  border:1px solid var(--bordeaux);border-radius:var(--rayon);background:var(--fond-2);color:var(--bordeaux);
  font:inherit;cursor:pointer;text-align:center}
.bonus-case .bc-nom{font-family:var(--police-titre);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.bonus-case .bc-pts{font-size:12px;color:var(--texte-2)}
.bonus-case.faite{border-color:var(--vert-juste);color:var(--vert-juste)}
.bonus-case:disabled{border-style:dashed;border-color:var(--laiton);color:var(--texte-2);cursor:default}
.carte.maitrise{border-color:var(--or-vif);box-shadow:0 0 0 1px var(--or-vif) inset}

/* --- Rang : un ecusson hexagonal a la couleur du rang, le niveau (1 a 3)
   en son centre. Les couleurs sont portees par le SVG : un rang se
   reconnait a sa teinte, qui ne change pas avec le theme clair ou sombre. */
.emb{display:inline-block;flex:0 0 auto;line-height:0}
.emb svg{display:block}
.emb text{font-family:var(--police-titre);font-weight:900}
.rang-tete{display:flex;align-items:center;gap:14px}
.rang-tete .corps{flex:1;min-width:0}
.rang-tete h2{margin:0;font-size:22px}
.rang-bas{display:flex;justify-content:space-between;gap:10px;margin:0}
.rang details{margin:14px 0 0;border-top:1px solid var(--laiton);padding-top:10px}
.rang summary{cursor:pointer;font-family:var(--police-titre);font-size:12px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--bordeaux);font-weight:700}
.echelle{list-style:none;margin:10px 0 0;padding:0}
/* Le bareme est un tableau de chiffres : justifie en phrase, il creusait
   des trous entre les nombres. Une ligne par gain, les points a droite. */
.bareme{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);gap:5px 14px;margin:0;
  font-size:13.5px;color:var(--texte-2)}
.bareme dt{margin:0}
.bareme dd{margin:0;text-align:right;font-weight:700;color:var(--or);
  font-variant-numeric:tabular-nums;max-width:12em}
.echelle li{display:flex;align-items:center;gap:12px;padding:6px 0;
  border-bottom:1px dotted var(--laiton)}
.echelle li:last-child{border-bottom:0}
.echelle .nom{flex:1;font-family:var(--police-titre);font-weight:700}
.echelle .seuil{font-size:12.5px;color:var(--texte-2);white-space:nowrap}
.echelle li.actuel{background:var(--fond-3);margin:0 -8px;padding:6px 8px;border-radius:4px}
.echelle li.atteint .nom{color:var(--bordeaux)}
.echelle li:not(.atteint) .emb{opacity:.6;filter:grayscale(.45)}
.gain{display:flex;align-items:center;gap:14px}
.gain .corps{flex:1}
.gain h3{margin:0 0 2px}

/* --- Carte de cours du catalogue ------------------------------------- */
.grille{display:grid;grid-template-columns:1fr;gap:12px;margin:0 0 18px}
@media (min-width:620px){ .grille{grid-template-columns:1fr 1fr} }
.cours-carte{
  display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
  background:var(--fond-2);border:1px solid var(--laiton);border-radius:var(--rayon);
  padding:15px;cursor:pointer;color:var(--texte);font-family:var(--police-texte);
  box-shadow:0 1px 3px var(--ombre);transition:transform .1s,box-shadow .16s;
}
.cours-carte:active{transform:translateY(1px)}
.cours-carte .corps{flex:1;min-width:0}
.cours-carte .dates{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  font-family:var(--police-titre);font-weight:700;color:var(--or)}
/* La note d'un cours (<< 1er volume d'une trilogie >>) est une phrase :
   en petites capitales elle criait a cote des dates. */
.cours-carte .note{display:block;font-size:12px;font-style:italic;
  color:var(--texte-2);line-height:1.3;margin-top:1px}
.cours-carte .t{display:block;font-family:var(--police-titre);font-weight:700;
  font-size:17.5px;color:var(--bordeaux);line-height:1.22;margin:2px 0 4px}
.cours-carte .pb{font-size:13.5px;color:var(--texte-2);line-height:1.45;margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cours-carte .bas{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* --- Frise chronologique ---------------------------------------------
   Troisieme entree du catalogue, apres le theme et la periode : les
   cours poses sur un axe, du plus ancien au plus recent. Une colonne
   verticale, parce qu'un telephone defile vers le bas et non de cote. */
.frise{position:relative;margin:0 0 20px;padding-left:34px}
.frise::before{
  content:"";position:absolute;left:11px;top:4px;bottom:4px;width:3px;
  background:linear-gradient(180deg,var(--laiton),var(--or-vif),var(--laiton));
  border-radius:2px;
}
.frise-ere{position:relative;margin:0 0 6px;padding:2px 0 2px 2px}
.frise-ere .nom{
  font-family:var(--police-titre);font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--bordeaux);font-weight:700;
}
.frise-ere::before{
  content:"";position:absolute;left:-29px;top:7px;width:17px;height:17px;
  background:var(--bordeaux);border-radius:50%;
  box-shadow:0 0 0 3px var(--fond), 0 0 0 4px var(--laiton);
}
.frise-item{position:relative;margin:0 0 10px}
.frise-item::before{
  content:"";position:absolute;left:-26px;top:16px;width:11px;height:11px;
  background:var(--fond-2);border:2px solid var(--or-vif);border-radius:50%;
  box-shadow:0 0 0 3px var(--fond);
}
.frise-item.fait::before{background:var(--vert-juste);border-color:var(--vert-juste)}
.frise-item.entame::before{background:var(--or-vif)}

/* --- Liste des seances ------------------------------------------------ */
.liste{list-style:none;margin:0;padding:0}
.ligne{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 12px;margin:0 0 8px;background:var(--fond-2);
  border:1px solid var(--laiton);border-radius:var(--rayon);
  cursor:pointer;color:var(--texte);font-family:var(--police-texte);
  font-size:15.5px;line-height:1.45;transition:transform .1s,border-color .16s;
}
.ligne:active{transform:translateY(1px)}
.ligne[disabled]{cursor:not-allowed;opacity:.5}
/* Medaillon grave : le numero de seance, comme un chiffre de tomaison. */
.ligne .num{
  flex:0 0 38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--laiton);
  box-shadow:0 0 0 2px var(--fond-2),0 0 0 3px var(--laiton);
  color:var(--texte-2);font-family:var(--police-titre);font-weight:700;font-size:15px;
  background:var(--fond-2);
}
.ligne .corps{flex:1;min-width:0}
.ligne .corps .t{display:block}
.ligne .etat{flex:0 0 auto;font-size:10.5px;color:var(--texte-2);letter-spacing:.08em;
  font-family:var(--police-titre);text-transform:uppercase;font-weight:700;
  text-align:right;max-width:5.4em;line-height:1.3}
/* Trois etats, trois couleurs : jamais ouverte (sourd), lue mais sans
   QCM (or), validee (vert). Le fil conseille porte en plus un lisere. */
.ligne.lue .num{border-color:var(--or-vif);color:var(--or);box-shadow:0 0 0 2px var(--fond-2),0 0 0 3px var(--or-vif)}
.ligne.lue .etat{color:var(--or)}
.ligne.faite .num{border-color:var(--vert-juste);color:var(--vert-juste);box-shadow:0 0 0 2px var(--fond-2),0 0 0 3px var(--vert-juste)}
.ligne.faite .etat{color:var(--vert-juste)}
.ligne.fil{border-color:var(--bordeaux);border-left-width:4px}
.ligne.fil .etat{color:var(--bordeaux)}
/* Une seance jamais ouverte reste parfaitement accessible : elle est
   seulement signalee comme telle, jamais barree. */
.ligne.neuve .num{border-style:dashed}

/* --- Lecture d'une seance -------------------------------------------- */
.lecture{font-size:calc(17px * var(--echelle))}
.lecture h3{
  font-size:21px;color:var(--bordeaux);margin:30px 0 10px;letter-spacing:.005em;
  padding-bottom:6px;scroll-margin-top:16px;
  border-bottom:1px solid var(--laiton);
  box-shadow:0 3px 0 -2px var(--laiton);
}
.lecture p{margin:0 0 1.05em}

/* --- Justification du texte courant ----------------------------------
   Le livre du XIXe justifie ses colonnes. Sur un telephone, justifier
   sans couper les mots creuse des rivieres blanches entre les mots :
   la cesure automatique est donc indissociable de la justification.
   Elle s'appuie sur lang="fr" declare sur <html>, et z0c_cesure.js pose
   les tirets conditionnels a la main sur exactement ces blocs-ci.

   Pas de text-wrap:pretty ici, et c'est delibere. L'algorithme de
   Chromium cherche a eviter les coupures de mots sur les dernieres
   lignes d'un bloc ; sur un bloc court -- une problematique de quatre
   lignes, une anecdote, une legende de carte --, ces dernieres lignes
   sont le bloc entier, et plus un seul mot n'est coupe. La
   justification doit alors ouvrir entre les mots tout le blanc que la
   cesure aurait absorbe. Mesure faite sur trois cours, au drapeau,
   blanc a combler par ligne : la mediane passe de 18,3 a 16,6 px et le
   neuvieme decile de 50,1 a 40,5 px des qu'on retire la propriete. Ce
   qu'elle fait gagner sur un orphelin, elle le perd en rivieres. */
.lecture p, .lecture li,
.probleme, .anecdote p,
.corr .expl,
.lecture figure.croquis figcaption,
.carte > .secondaire,
/* Et les autres textes de plusieurs lignes hors des seances : bareme des
   rangs, lignes de progression, rappels, avis, problematiques des cartes.
   Une ligne seule n'est jamais etiree (c'est la derniere du bloc), et un
   centrage pose en style direct l'emporte toujours. */
.carte p.minuscule:not(.rang-bas), .carte .corps .secondaire,
.hors-fil, .avis, .cours-carte .pb{
  text-align:justify;
  text-justify:inter-word;
  hyphens:auto;-webkit-hyphens:auto;
  overflow-wrap:break-word;
}
/* Lettrine sur le premier paragraphe : l'ouverture d'un chapitre. */
.lecture h3:first-of-type + p::first-letter{
  float:left;font-family:var(--police-titre);font-weight:900;
  font-size:3.2em;line-height:.82;margin:.04em .09em 0 0;
  color:var(--bordeaux);
}
.lecture ul{margin:0 0 1.1em;padding-left:1.2em}
.lecture li{margin:0 0 .5em}
.lecture li::marker{color:var(--or-vif)}
.lecture strong{color:var(--bordeaux);font-weight:700}
.lecture blockquote{
  margin:1.3em 0;padding:4px 0 4px 18px;
  border-left:3px double var(--bordeaux);
  font-style:italic;color:var(--texte-2);
}

/* --- Jauge de lecture ------------------------------------------------
   Un filet d'or en haut de l'ecran, qui avance avec le defilement :
   on sait toujours ou l'on en est dans une seance de huit cents mots. */
#jauge-lecture{
  position:fixed;left:0;top:0;height:3px;width:0;z-index:40;
  background:linear-gradient(90deg,var(--or-vif),var(--bordeaux));
  display:none;transition:width .1s linear;
}
body[data-lecture="1"] #jauge-lecture{display:block}

/* --- Sommaire d'une seance -------------------------------------------
   Les trois ou quatre parties titrees, repliables. Sur telephone, c'est
   le seul moyen de revenir a la partie II sans faire defiler a l'aveugle. */
.sommaire{border:1px solid var(--laiton);background:var(--fond-2);
  padding:7px 13px;margin:0 0 14px;border-radius:var(--rayon)}
.sommaire summary{
  cursor:pointer;font-family:var(--police-titre);font-size:12px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--bordeaux);font-weight:700;
}
.sommaire ol{margin:10px 0 2px;padding-left:1.3em}
.sommaire li{margin:0 0 .4em;font-size:15px}
.sommaire li::marker{color:var(--or-vif);font-family:var(--police-titre);font-weight:700}
.sommaire a{color:var(--texte);text-decoration:none;border-bottom:1px solid var(--laiton)}

/* --- Bandeau d'une lecture hors fil -----------------------------------
   Lire la seance 5 avant la 2 est permis ; l'application doit alors dire
   clairement ce qui reste non lu, sans le reprocher. */
.hors-fil{
  border:1px solid var(--or-vif);border-left:4px solid var(--or-vif);
  background:var(--fond-2);padding:11px 13px;margin:0 0 16px;font-size:15px;
}
.hors-fil strong{color:var(--or)}

/* --- Mode relecture ---------------------------------------------------
   Les points douteux signales par la redaction, rendus visibles dans la
   marge du texte. Volontairement voyants : ils ne doivent pas se fondre
   dans la prose qu'ils mettent en doute. */
.verif{
  display:block;margin:10px 0;padding:8px 11px;
  border:1px dashed var(--or-vif);border-left:3px solid var(--or-vif);
  background:var(--fond-3);border-radius:var(--rayon);
  font-family:var(--police-texte);font-size:14px;font-style:normal;
  line-height:1.5;color:var(--texte-2);text-align:left;
}
.verif b{
  display:inline-block;min-width:1.5em;margin-right:6px;
  font-family:var(--police-titre);color:var(--or);font-weight:700;
}
/* Une ligne de la liste de relecture : la case, le numero, le texte. */
.verif-ligne{align-items:flex-start}
.verif-ligne.fait{opacity:.55}
.verif-ligne.fait .num-verif{background:var(--vert-juste);border-color:var(--vert-juste)}
.num-verif{
  display:inline-block;min-width:20px;height:20px;line-height:19px;text-align:center;
  margin-right:8px;border:1px solid var(--or-vif);background:var(--or-vif);
  color:var(--fond-2);border-radius:50%;
  font-family:var(--police-titre);font-size:11.5px;font-weight:700;
}

/* --- Lecture a voix haute ---------------------------------------------
   Le bloc en cours de lecture est marque d'un filet d'or dans la marge et
   d'un fond a peine plus clair : assez pour suivre des yeux pendant qu'on
   ecoute, trop peu pour gener celui qui lit en silence. */
.dit{
  position:relative;background:var(--voile);
  box-shadow:-10px 0 0 0 var(--voile), 10px 0 0 0 var(--voile);
  transition:background .2s ease;
}
.dit::before{
  content:"";position:absolute;left:-14px;top:2px;bottom:2px;width:3px;
  background:var(--or-vif);border-radius:2px;
}

/* La barre du lecteur, posee au-dessus de la barre d'onglets. */
#barre-voix{
  position:fixed;left:0;right:0;z-index:25;
  bottom:calc(var(--barre) + env(safe-area-inset-bottom));
  display:none;flex-direction:column;gap:6px;
  padding:8px 12px 10px;
  background:var(--fond-2);border-top:1px solid var(--laiton);
  box-shadow:0 -2px 8px var(--ombre);
}
body[data-voix="1"] #barre-voix{display:flex}

/* Rang du haut : reculer, pause, avancer. Des cibles larges, parce qu'on
   s'en sert en marchant ou en conduisant. */
.voix-transport{display:flex;gap:6px;align-items:center;justify-content:center}
.voix-transport .saut{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;min-width:52px;padding:5px 6px;line-height:1.05;font-size:15px;
}
.voix-transport .saut b{font-size:10.5px;font-weight:700;letter-spacing:.04em}
.voix-transport .pause{
  min-width:62px;padding:9px 12px;font-size:17px;line-height:1;
  background:var(--bordeaux);color:var(--fond-2);border-color:var(--bordeaux);
}

/* Rang du bas : arreter, le minutage, la vitesse. */
.voix-pied{display:flex;gap:8px;align-items:center;justify-content:space-between}
.voix-temps{
  font-family:var(--police-titre);font-size:12.5px;font-weight:700;
  letter-spacing:.06em;color:var(--texte-2);font-variant-numeric:tabular-nums;
}
/* Pendant l'ecoute, le bas de la seance doit rester atteignable. */
body[data-voix="1"] .vue{padding-bottom:calc(var(--barre) + 110px)}

/* --- Bouton flottant : revenir en haut -------------------------------- */
/* Il se pose forcement sur la colonne de texte, qui occupe toute la
   largeur du telephone. Il doit donc etre franchement opaque : a
   demi transparent, le texte qui le traverse le faisait passer pour un
   defaut d'affichage plutot que pour une commande. Le halo de papier
   le detache de la ligne qu'il couvre. */
#haut{
  position:fixed;right:14px;bottom:calc(var(--barre) + 16px + env(safe-area-inset-bottom));
  width:46px;height:46px;border-radius:50%;z-index:30;
  border:1.5px solid var(--bordeaux);background:var(--fond-2);color:var(--bordeaux);
  font-size:18px;line-height:1;cursor:pointer;display:none;
  box-shadow:0 0 0 5px var(--fond), 0 2px 10px var(--ombre-forte);
}
body[data-haut="1"] #haut{display:block}

/* --- Ecran d'ouverture -----------------------------------------------
   Plat de reliure : maroquin sombre et dorure. Le logo monte en fondu,
   puis l'ecran s'efface. Tout est en CSS, donc joue meme si le script
   tarde ; pointer-events:none garantit qu'il ne bloque jamais un geste. */
#ouverture{
  position:fixed;inset:0;z-index:200;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 42%,
              #5a3f22 0%, #402c17 44%, #24180c 100%);
  animation:ouv-sortie .6s ease-in 1.3s forwards;
}
#ouverture svg{
  width:min(74vw,330px);height:auto;
  animation:ouv-entree .8s cubic-bezier(.2,.75,.3,1) both;
}
@keyframes ouv-entree{
  from{opacity:0;transform:scale(.92) translateY(10px)}
  to  {opacity:1;transform:scale(1) translateY(0)}
}
@keyframes ouv-sortie{ to{opacity:0;visibility:hidden} }
@media (prefers-reduced-motion:reduce){
  #ouverture{animation:ouv-sortie .3s linear .3s forwards}
  #ouverture svg{animation:ouv-fondu .3s linear both}
  @keyframes ouv-fondu{from{opacity:0}to{opacity:1}}
}

/* --- Tableaux ---------------------------------------------------------
   Mis en page comme un tableau imprime : filets fins, en-tete en petites
   capitales sur fond legerement teinte, pas de quadrillage complet. Sur
   telephone, un tableau trop large defile horizontalement dans son propre
   cadre plutot que de pousser la page entiere. */
.lecture .tableau{overflow-x:auto;margin:22px 0;-webkit-overflow-scrolling:touch}
.lecture table{border-collapse:collapse;width:100%;min-width:300px;
  font-size:15px;line-height:1.45}
@media (max-width:560px){
  .lecture table{font-size:13.5px}
  .lecture thead th{font-size:10.5px;letter-spacing:.06em;padding:6px 7px}
  .lecture tbody td,.lecture tbody th{padding:6px 7px}
}
.lecture caption{caption-side:top;text-align:left;font-style:italic;
  color:var(--texte-2);font-size:13.5px;padding:0 0 7px}
.lecture thead th{
  font-family:var(--police-titre);font-size:11.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--bordeaux);
  background:var(--fond-3);
  border-top:1.5px solid var(--bordeaux);
  border-bottom:1px solid var(--bordeaux);
  padding:7px 9px;text-align:left;vertical-align:bottom;
}
.lecture tbody td,.lecture tbody th{
  border-bottom:1px solid var(--laiton);
  padding:7px 9px;text-align:left;vertical-align:top;
}
.lecture tbody tr:last-child td,.lecture tbody tr:last-child th{
  border-bottom:1.5px solid var(--bordeaux);
}
/* Colonne de chiffres : alignee a droite et chasse fixe, pour que les
   ordres de grandeur se comparent d'un coup d'oeil. */
.lecture td.n,.lecture th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lecture tbody th{font-weight:700;color:var(--texte)}

/* --- Croquis : cartes et schemas (SVG inline) -------------------------
   Planche gravee contrecollee dans la page : double filet, fond de papier
   plus clair, legende en italique.

   Les couleurs d'un croquis sont ecrites en clair dans son SVG, et non en
   variables : une figure doit rester lisible hors de cette page. Le
   nuancier est donne dans le commentaire en tete de COURS. Les fleches et
   les hachures sont definies UNE SEULE FOIS dans #croquis-defs. */
#croquis-defs{position:absolute;width:0;height:0;overflow:hidden}
.lecture figure.croquis{
  margin:26px auto;max-width:540px;
  padding:10px 10px 8px;background:#f3ead2;
  border:1px solid var(--laiton);border-radius:var(--rayon);
  box-shadow:0 0 0 3px #f3ead2, 0 0 0 4px var(--bordeaux-pale),
             0 3px 8px var(--ombre);
}
.lecture figure.croquis svg{display:block;width:100%;height:auto;
  border:1px solid rgba(58,48,32,.35)}
.lecture figure.croquis figcaption{
  font-family:var(--police-texte);font-style:italic;font-size:13px;
  color:#6d5b41;margin-top:9px;line-height:1.5;
  padding-top:8px;border-top:1px solid rgba(179,154,94,.6);
}
.lecture figure.croquis figcaption b{color:#332719;font-style:normal}
/* Un appui ouvre la figure en grand (ouvrirFigure, dans z1_app.js). */
.lecture figure.croquis[data-action]{cursor:zoom-in}
.fz-ouvrir{display:block;margin:8px auto 0;min-height:32px;padding:0 14px;
  border:1px solid var(--laiton);border-radius:16px;background:rgba(243,234,210,.94);
  color:#5a4526;font:700 11px/1 var(--police-titre);letter-spacing:.06em;text-transform:uppercase;cursor:zoom-in}
/* --- Quiz du jour (z0k_quotidien.js) : un ecran pose par-dessus tout ---- */
#quiz-jour{position:fixed;inset:0;z-index:70;overflow-y:auto;background:var(--fond);
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
#quiz-jour .qj-boite{max-width:var(--large);margin:0 auto}
#quiz-jour h2{margin:10px 0 12px}
#quiz-jour .avis{text-align:left;hyphens:manual}
#quiz-jour h3{margin:0 0 8px;font-size:19px}
#quiz-jour .bouton.petit{width:auto}
.qj-regles{margin:0 0 18px;padding-left:20px}
.qj-regles li{margin:0 0 8px}
.qj-tete{display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--police-titre);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:700;color:var(--texte-2)}
.qj-sec{font-size:26px;letter-spacing:0;color:var(--bordeaux);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.qj-barre{height:6px;background:var(--fond-3);border:1px solid var(--laiton);margin:6px 0 0;overflow:hidden}
.qj-barre i{display:block;height:100%;background:var(--bordeaux);transition:width .2s linear}
.qj-onglets{margin:16px 0 12px}
.qj-onglets button{font-size:11px;padding:6px 4px}
.qj-corr.ok{border-left-color:var(--vert-juste)}
.carte.quiz-jour{border-color:var(--bordeaux-pale)}
/* Encart du Quiz of the Day, en tete de l'accueil. */
.carte.quiz-jour.vedette{position:relative;margin-top:18px;border:2px solid var(--or-vif);
  background:linear-gradient(135deg,var(--fond-2) 0%,var(--fond-3) 100%);box-shadow:0 4px 14px var(--ombre-forte)}
.qj-vedette-titre{font-family:var(--police-titre);font-weight:900;font-size:1.35rem;color:var(--bordeaux);margin:0 0 6px}
.qj-bulles{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.qj-choix{display:flex;flex-direction:column;gap:4px;margin:0 0 12px}
.qj-choix select{width:100%}
/* Bulles : un chiffre qui saute aux yeux, a la place d'une phrase. */
.bulle{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:700;line-height:1.3;white-space:nowrap}
.bulle-pts{position:absolute;top:-13px;right:12px;background:var(--bordeaux);color:var(--fond-2);font-size:13.5px;
  padding:4px 11px;box-shadow:0 2px 6px var(--ombre-forte);transform:rotate(3deg)}
.bulle-or{background:var(--or-vif);color:#1d1606}
.carte.avec-bulle{position:relative;margin-top:16px}
.bulle-gris{position:absolute;top:-12px;right:12px;background:var(--fond-3);color:var(--texte-2);border:1px solid var(--laiton)}
/* Brevet : deux validations par chapitre, deux points a remplir. */
.b-val{display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 7px;border-radius:999px;border:1.5px solid var(--laiton);
  background:var(--fond-3);font-size:12.5px;font-weight:800;color:var(--texte-2);white-space:nowrap;flex:0 0 auto}
.b-val i{width:11px;height:11px;border-radius:50%;border:2px solid var(--laiton);display:inline-block}
.b-val.n1 i:first-child,.b-val.n2 i{background:var(--or-vif);border-color:var(--or-vif)}
.b-val.n1{border-color:var(--or-vif);color:var(--or)}
.b-val.n2{background:var(--vert-juste);border-color:var(--vert-juste);color:#fff}
.b-val.n2 i{background:#fff;border-color:#fff}
.b-val b{margin-left:2px}
.b-val-avis{display:flex;gap:10px;align-items:center}
.b-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0 0}
.b-case{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:9px 10px;text-align:left;font:inherit;font-size:13px;line-height:1.3;
  color:var(--texte);background:var(--fond-2);border:1.5px solid var(--laiton);border-radius:8px;cursor:pointer}
.b-case.n1{border-color:var(--or-vif)}
.b-case.n2{border-color:var(--vert-juste);background:color-mix(in srgb,var(--vert-juste) 10%,var(--fond-2))}
/* Espace professeur : une grille de chapitres a toucher. */
.b-grille-prof{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:6px}
.b-puce{display:flex;gap:6px;align-items:flex-start;padding:7px 8px;text-align:left;font:inherit;font-size:12.5px;line-height:1.25;
  color:var(--texte-2);background:var(--fond-3);border:1.5px dashed var(--laiton);border-radius:8px;cursor:pointer}
.b-puce.ouvert{color:var(--texte);background:color-mix(in srgb,var(--vert-juste) 14%,var(--fond-2));border:1.5px solid var(--vert-juste)}
.b-puce-etat{flex:0 0 20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;
  background:var(--fond-2);border:1.5px solid var(--laiton)}
.b-puce.ouvert .b-puce-etat{background:var(--vert-juste);border-color:var(--vert-juste);color:#fff}
/* Moderation : liste des comptes du professeur, messages au joueur. */
.st-comptes{list-style:none;margin:0;padding:0}
.st-comptes li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--laiton)}
.st-comptes li:last-child{border-bottom:none}
.st-comptes li.suspect{background:color-mix(in srgb,var(--rouge-faux) 10%,transparent);margin:0 -8px;padding:9px 8px}
.st-comptes .st-nom{flex:1 1 220px;min-width:0}
.st-comptes .st-nom small{white-space:normal;word-break:break-all}
.st-actions{display:flex;gap:6px;flex-wrap:wrap}
.st-etiq{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--fond-3);color:var(--texte-2)}
.st-etiq.rouge{background:var(--rouge-faux);color:#fff}
.st-etiq.or{background:var(--or-vif);color:#1d1606}
.st-etiq.vert{background:var(--vert-juste);color:#fff}
.bouton.danger{color:var(--rouge-faux)}
.carte.avis-sanction{border:2px solid var(--rouge-faux)}
.fenetre{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.fenetre-boite{width:min(100%,460px);margin:0}
/* Aide en bulle : le « ? », puis la bulle qui eclate et la fenetre qui
   en jaillit (animations en JS, voir ouvrirEnBulle). */
.aide-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin:0 0 0 8px;padding:0;vertical-align:middle;
  border-radius:50%;border:1.5px solid var(--or-vif);background:var(--fond-2);color:var(--or);font:800 13px/1 var(--police-ecran);
  letter-spacing:0;text-transform:none;cursor:pointer;box-shadow:0 1px 3px var(--ombre);flex:0 0 auto}
.aide-btn:active{transform:scale(.9)}
.aide-btn.statique{margin:0 8px 0 0;cursor:default}
.filet .aide-btn{width:20px;height:20px;font-size:12px}
.carte.avec-aide{position:relative}
.aide-coin{position:absolute;top:10px;right:10px}
.aide-titre{display:flex;align-items:center;margin:0 0 10px}
.aide-liste{margin:0 0 12px;padding-left:1.1em}
.aide-liste li{margin:0 0 8px;line-height:1.45}
.aide-liste .bulle{font-size:12px;padding:1px 7px}
.eclat{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;
  overflow-y:auto;padding:24px 12px}
.eclat-boite{width:min(100%,540px);margin:auto 0;position:relative}
.eclat .fr-fermer{float:right;margin:-4px -4px 6px 8px}
#fenetre-aide .eclat-boite{width:min(100%,440px)}
.eclat.eclat-ferme{pointer-events:none}
.eclat-bulle{position:fixed;z-index:66;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 10%,rgba(255,255,255,.3) 12% 50%,rgba(226,196,124,.35) 72%,rgba(168,128,31,.75) 100%);
  border:2px solid rgba(168,128,31,.85)}
.eclat-goutte{position:fixed;z-index:66;border-radius:50%;pointer-events:none;background:var(--or-vif);opacity:0;
  box-shadow:0 0 4px rgba(226,196,124,.8)}
/* Fenetre des rangs, ouverte depuis l'insigne de l'en-tete. */
#fenetre-rangs{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;
  overflow-y:auto;padding:24px 12px}
#fenetre-rangs .fr-boite{width:min(100%,560px);margin:0;position:relative}
#fenetre-rangs .fr-fermer{float:right;margin:-4px -4px 6px 8px}
#fenetre-rangs .fr-corps{margin-top:14px}
/* Pendant une question : pas de selection de texte a copier. */
body.qj-actif #quiz-jour{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.qj-actif{overflow:hidden}
#figure-zoom{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  background:var(--fond);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#figure-zoom .fz-barre{display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--laiton)}
#figure-zoom .fz-barre .bouton,#figure-zoom .fz-barre .bouton-plein{width:auto;margin:0}
#figure-zoom .fz-barre .carre{min-width:40px;font-size:18px}
#figure-zoom .fz-aide{flex:1;font-size:12px;color:var(--texte-2);text-align:center}
#figure-zoom .fz-zone{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#f3ead2}
#figure-zoom .fz-contenu{padding:8px;box-sizing:border-box}
#figure-zoom .fz-contenu svg{display:block;width:100%;height:auto}
#figure-zoom .fz-legende{max-height:28vh;overflow:auto;padding:10px 14px;font-size:13px;
  font-style:italic;line-height:1.5;color:var(--texte-2);border-top:1px solid var(--laiton)}
#figure-zoom .fz-legende b{font-style:normal;color:var(--texte)}
/* Le << e >> des ordinaux reste en bas de casse dans les libelles en capitales. */
.ord{text-transform:none!important}   /* plus fort que les << .filet span >> et consorts */
.b-ferme-avis{text-align:center;margin:0 0 14px}
.note-brevet{margin:0 0 14px;padding:10px 14px;border-left:3px solid var(--or);background:var(--fond-2);
  font-size:13.5px;line-height:1.5;color:var(--texte-2)}
.note-brevet strong{color:var(--texte)}
/* En veillee, la planche gardee telle quelle eblouirait : on l'assombrit
   d'un cran sans toucher a ses couleurs, qui restent celles du nuancier. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="clair"]) .lecture figure.croquis{filter:brightness(.82) saturate(.92)}
}
:root[data-theme="sombre"] .lecture figure.croquis{filter:brightness(.82) saturate(.92)}
/* Classes de texte des croquis : evite de repeter font-family.

   Ces regles ne donnent que des valeurs par defaut, d'ou les :not().
   Un attribut de presentation -- le fill="#8c2432" ecrit dans le SVG --
   perd contre n'importe quelle regle de la feuille, fut-elle la moins
   specifique. Sans le :not([fill]), tout texte de croquis rendait donc
   en encre : les couleurs du nuancier, ecrites dans les cent cinquante
   figures, ne servaient a rien, et deux planches perdaient purement et
   simplement leurs numeros, poses en creme sur des pastilles sombres et
   donc sombres sur sombre. Verifie au navigateur avant et apres.

   La taille, elle, reste a la feuille et ignore volontairement
   l'attribut du SVG : 9 px est le plancher de lisibilite sur un
   telephone de 390 px de large, et les tailles ecrites dans les figures
   -- souvent 7 ou 7,5 px -- n'ont jamais ete calibrees puisqu'elles
   n'ont jamais rendu. Une planche qui veut de plus grandes lettres
   prend la classe cr-pays ou cr-region. */
.lecture figure.croquis text{font-family:Georgia,"Times New Roman",serif}
.lecture figure.croquis text:not([fill]){fill:var(--cr-encre)}
.lecture figure.croquis text.cr-eau:not([fill]){fill:#4b6066}
.cr-pays{font-size:12px;letter-spacing:2px}
.cr-region{font-size:11px;letter-spacing:1.2px;font-weight:700}
.cr-ville{font-size:9px}
.cr-titre{font-size:11px}
.cr-eau{font-size:9.5px;font-style:italic}
.cr-leg{font-size:8.5px}
.cr-note{font-size:9px;font-style:italic}

/* --- Problematique et anecdote ---------------------------------------- */
.probleme{
  border:1px solid var(--laiton);border-left:4px solid var(--bordeaux);
  padding:12px 14px;margin:0 0 20px;background:var(--fond-2);font-style:italic;
}
.probleme strong{font-style:normal;color:var(--bordeaux)}
.anecdote{
  border:1px solid var(--vert);border-left-width:4px;
  background:var(--fond-2);
  padding:14px;margin:28px 0 8px;
}
.anecdote .titre{
  font-family:var(--police-titre);font-size:12px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--vert);display:block;margin-bottom:6px;
  font-weight:700;
}
.anecdote p{margin:0;font-size:16px}

/* --- QCM -------------------------------------------------------------- */
.question{border:1px solid var(--laiton);background:var(--fond-2);padding:14px;
  margin:0 0 14px;border-radius:var(--rayon);scroll-margin-top:16px}
.question .enonce{font-weight:700;margin:0 0 4px}
.question .consigne{font-family:var(--police-titre);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--texte-2);margin:0 0 10px;font-weight:700}
.option{
  display:flex;gap:11px;align-items:flex-start;padding:11px 10px;margin:0 0 7px;
  border:1px solid var(--laiton);cursor:pointer;background:var(--voile);
  border-radius:var(--rayon);transition:border-color .14s,background .14s;
}
.option:has(input:checked){border-color:var(--bordeaux);background:var(--fond-3)}
.option input{
  appearance:none;-webkit-appearance:none;margin:2px 0 0;flex:0 0 20px;height:20px;
  border:1px solid var(--bordeaux);background:var(--fond-2);cursor:pointer;position:relative;
}
.option input:checked::after{content:"";position:absolute;inset:3px;background:var(--bordeaux)}
.option input[type="radio"],.option input[type="radio"]:checked::after{border-radius:50%}
.erreur{color:var(--rouge-faux);font-size:14.5px;margin:8px 0 0;font-style:italic}
.question.en-erreur{border-color:var(--rouge-faux)}
/* Avancement du QCM : combien de questions ont recu au moins une coche. */
.avancement{
  position:sticky;top:0;z-index:15;margin:0 0 14px;padding:8px 0 9px;
  background:var(--fond);border-bottom:1px solid var(--laiton);
}
.avancement .texte{display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--police-titre);font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;color:var(--texte-2);margin-bottom:6px}
.avancement .texte b{color:var(--bordeaux)}

/* --- Correction -------------------------------------------------------- */
.score{
  text-align:center;border:1px solid var(--laiton);padding:18px 16px;margin:0 0 18px;
  background:var(--fond-2);
  box-shadow:0 0 0 3px var(--fond-2), 0 0 0 4px var(--bordeaux-pale);
}
.score .chiffre{font-family:var(--police-titre);font-size:48px;font-weight:900;
  color:var(--bordeaux);line-height:1}
.score.parfait .chiffre{color:var(--vert-juste)}
.corr{border:1px solid var(--laiton);border-left:4px solid var(--rouge-faux);
  background:var(--fond-2);padding:13px 14px;margin:0 0 13px}
.corr .ligne-rep{margin:0 0 4px;font-size:15.5px}
.corr .ligne-rep b{font-family:var(--police-titre);letter-spacing:.1em;font-size:11.5px;
  text-transform:uppercase;color:var(--texte-2);display:block;font-weight:700}
.corr .rep{display:block;padding-left:16px;position:relative;margin:2px 0}
/* Tiret cadratin : les ornements de la table Dingbats manquent a Georgia
   comme a Baskerville et s'affichent alors en carre de code. */
.corr .rep::before{content:"\2014";position:absolute;left:0;font-size:13px;top:-.06em;
  opacity:.85;color:var(--or-vif)}
.corr .faux{color:var(--rouge-faux)}
.corr .juste{color:var(--vert-juste)}
.corr .expl{margin:9px 0 0;font-size:15.5px;border-top:1px solid var(--laiton);padding-top:9px}
details.justes{border:1px solid var(--laiton);padding:10px 12px;margin:18px 0;background:var(--fond-2)}
details.compose-autres{border:1px solid var(--laiton);padding:10px 12px;margin:10px 0 0;background:var(--fond-2)}
details.compose-autres summary{cursor:pointer;min-height:32px;display:flex;align-items:center;
  font-family:var(--police-titre);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--bordeaux)}
details.compose-autres[open] summary{margin-bottom:8px}
details.justes summary{cursor:pointer;font-family:var(--police-titre);letter-spacing:.12em;
  text-transform:uppercase;font-size:12.5px;color:var(--vert-juste);font-weight:700}
details.justes .corr{border-left-color:var(--vert-juste);margin-top:12px}

/* --- Formulaires (reglages, quiz compose) ----------------------------- */
.champ{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--laiton)}
.champ:last-child{border-bottom:0}
.champ .txt{flex:1}
.champ .txt small{display:block;color:var(--texte-2);font-size:13.5px;line-height:1.45}
.interrupteur{flex:0 0 auto;width:54px;height:30px;border:1px solid var(--bordeaux);
  background:var(--fond-3);cursor:pointer;position:relative;border-radius:999px}
.interrupteur::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;
  background:var(--laiton);border-radius:50%;transition:left .18s,background .18s}
.interrupteur[aria-checked="true"]{background:var(--fond-3)}
.interrupteur[aria-checked="true"]::after{left:27px;background:var(--bordeaux)}
/* --- Choix du mode, au premier lancement ------------------------------ */
body[data-choix="1"]{overflow:hidden}
#choix-mode{position:fixed;inset:0;z-index:60;background:var(--fond);overflow-y:auto;
  display:flex;align-items:center;justify-content:center;padding:24px 16px}
.choix-corps{width:100%;max-width:440px;text-align:center}
.choix-marque svg{width:64px;height:64px}
#choix-mode h1{font-family:var(--police-titre);font-size:44px;letter-spacing:.14em;color:var(--bordeaux);margin:6px 0 4px}
.choix-question{font-family:var(--police-titre);font-style:italic;font-size:18px;color:var(--texte-2);margin:0 0 24px}
.choix-bouton{display:block;width:100%;text-align:left;margin:0 0 14px;padding:20px 20px;cursor:pointer;
  background:var(--fond-2);color:var(--texte);border:2px solid var(--laiton);font:inherit}
.choix-bouton:hover,.choix-bouton:focus-visible{border-color:var(--bordeaux)}
.choix-bouton.brevet{border-color:var(--bordeaux)}
.choix-titre{display:block;font-family:var(--police-titre);font-weight:700;font-size:22px;color:var(--bordeaux);margin:0 0 6px}
.choix-texte{display:block;font-size:15px;line-height:1.45;color:var(--texte-2)}
.choix-note{font-size:13px;color:var(--texte-2);margin:8px 0 0}
/* --- Compte : ecran du premier lancement et formulaire ----------------- */
#ecran-compte{position:fixed;inset:0;z-index:61;background:var(--fond);overflow-y:auto;
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px}
.compte-corps{margin:auto 0}
.compte-duree{display:inline-block;margin:0 0 14px;padding:4px 14px;border:1px solid var(--bordeaux);border-radius:999px;
  font-weight:700;font-size:14.5px;color:var(--bordeaux);background:var(--fond-2)}
.compte-onglets{margin:0 0 14px}
.champ-compte{display:block;margin:0 0 12px}
.champ-compte span{display:block;font-size:13.5px;color:var(--texte-2);margin:0 0 4px}
.champ-compte input{width:100%;box-sizing:border-box;min-height:46px;padding:8px 12px;font:inherit;color:var(--texte);
  background:var(--fond-2);border:1px solid var(--laiton);border-radius:var(--rayon)}
.champ-compte input:focus{outline:2px solid var(--bordeaux);outline-offset:1px}
.form-compte .bouton-plein,.form-compte .bouton{width:100%}
.form-compte button[disabled]{opacity:.6}
.compte-ou{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--texte-2);font-size:13px}
.compte-ou::before,.compte-ou::after{content:"";flex:1;border-top:1px solid var(--laiton)}
.b-code-ligne{display:flex;gap:8px;align-items:stretch}
.b-code-ligne input{flex:1;min-width:0;min-height:46px;padding:8px 12px;font:inherit;color:var(--texte);
  background:var(--fond-2);border:1px solid var(--laiton);border-radius:var(--rayon)}
.compte-info{border:1px solid var(--laiton);background:var(--fond-2);padding:10px 12px;font-size:14.5px;line-height:1.45}

/* --- Tutoriel : visite guidee ----------------------------------------- */
#tuto{position:fixed;inset:0;z-index:80}
#tuto .tuto-trou{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(18,12,6,.74);
  outline:2px solid var(--or-vif);outline-offset:0;transition:all .25s ease;pointer-events:none}
#tuto.sans-cible{background:rgba(18,12,6,.74)}
#tuto.sans-cible .tuto-trou{display:none}
#tuto.attente .tuto-bulle{opacity:0}
#tuto .tuto-bulle{position:fixed;left:50%;top:50%;transform:none;width:min(340px,calc(100vw - 24px));
  background:var(--fond-2);color:var(--texte);border:1px solid var(--laiton);border-top:4px solid var(--bordeaux);
  padding:14px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:opacity .15s}
#tuto.sans-cible .tuto-bulle{left:50%;top:50%;transform:translate(-50%,-50%)}
#tuto .tuto-pas{margin:0 0 4px;font-size:12px;letter-spacing:.08em;color:var(--texte-2)}
#tuto h3{margin:0 0 6px;font-family:var(--police-titre);color:var(--bordeaux);font-size:19px}
#tuto .tuto-texte{margin:0 0 12px;font-size:15px;line-height:1.5}
#tuto .tuto-boutons{display:flex;gap:8px;align-items:center;justify-content:flex-end}
#tuto .tuto-boutons .bouton,#tuto .tuto-boutons .bouton-plein{width:auto;padding:0 14px;min-height:40px;margin:0}
#tuto .tuto-passer{margin-right:auto;font-size:14px;padding:8px 4px}

/* --- Plan du jour (accueil Brevet) ------------------------------------ */
.b-etapes{list-style:none;margin:0;padding:0}
.b-etapes li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--laiton)}
.b-etapes li:first-child{border-top:none;padding-top:2px}
.b-coche{flex:0 0 28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--police-titre);font-weight:700;font-size:14px;border:2px solid var(--laiton);color:var(--texte-2)}
.b-etapes li.suivante .b-coche{border-color:var(--bordeaux);color:var(--bordeaux)}
.b-etapes li.fait .b-coche{background:var(--vert-juste);border-color:var(--vert-juste);color:#fff}
.b-etape{flex:1;min-width:0}
.b-etape strong{display:block;font-size:15.5px}
.b-etapes li.fait .b-etape strong{color:var(--texte-2)}
.b-etape small{display:block;font-size:13.5px;color:var(--texte-2);margin:2px 0 0}
.b-etape .bouton-plein{margin-top:10px}
.visuellement-cache{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* --- Statistiques de mes élèves (professeur) ---------------------------- */
#stats-prof{position:fixed;inset:0;z-index:62;background:var(--fond);overflow-y:auto;padding:16px}
.st-corps{max-width:640px;margin:0 auto 40px}
.st-tete{display:flex;justify-content:space-between;gap:8px}
.st-classes{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.st-puce{font:inherit;font-size:13.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--laiton);
  background:var(--fond-2);color:var(--texte);cursor:pointer}
.st-puce.actif{background:var(--bordeaux);border-color:var(--bordeaux);color:#fff}
.st-tuiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.st-tuile{border:1px solid var(--laiton);background:var(--fond-2);padding:10px 12px}
.st-tuile b{display:block;font-family:var(--police-titre);font-size:28px;line-height:1.1;color:var(--texte)}
.st-tuile span{display:block;font-size:13.5px;color:var(--texte)}
.st-tuile small{display:block;font-size:12px;color:var(--texte-2);margin-top:2px}
.st-graphe{display:block;width:100%;height:auto}
.st-graphe .st-plein{fill:var(--bordeaux)}
.st-graphe .choisi .st-plein{fill:var(--or-vif)}
.st-graphe .st-barre{cursor:pointer}
.st-graphe .st-axe{stroke:var(--laiton);stroke-width:1}
.st-graphe .st-lettre{font-size:10px;fill:var(--texte-2)}
.st-classement{list-style:none;margin:0;padding:0}
.st-classement li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--laiton)}
.st-classement li:last-child{border-bottom:none}
.st-num{flex:0 0 30px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
  border:1.5px solid var(--laiton);font-family:var(--police-titre);font-weight:700;font-size:14px;color:var(--bordeaux);font-variant-numeric:tabular-nums}
/* Les trois premiers : medailles d'or, d'argent et de bronze. */
.st-classement li:nth-child(1) .st-num{background:radial-gradient(circle at 35% 30%,#fff3c4,#e2b93b 55%,#a77d12);border-color:#8a6510;color:#4a3405;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.st-classement li:nth-child(2) .st-num{background:radial-gradient(circle at 35% 30%,#ffffff,#c9ced6 55%,#8b929c);border-color:#6f7680;color:#2f343a;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.st-classement li:nth-child(3) .st-num{background:radial-gradient(circle at 35% 30%,#ffe2c4,#cd8a4a 55%,#8f5523);border-color:#7a4519;color:#3d2008;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.qj-histo{list-style:none;margin:0;padding:0}
.qj-histo li{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--laiton);font-size:14px}
.qj-histo li:last-child{border-bottom:none}
.qj-histo li span:first-child{flex:1;min-width:0}
.qj-histo li span:nth-child(2){flex:0 0 auto;color:var(--texte-2);font-variant-numeric:tabular-nums}
.qj-histo li span:nth-child(3){flex:0 0 7.5em;text-align:right;font-variant-numeric:tabular-nums}
.st-nom{flex:1;min-width:0}
.st-nom strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-nom small{display:block;font-size:12.5px;color:var(--texte-2)}
.st-pts{flex:0 0 5.6em;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14px;color:var(--texte)}
.st-badge{flex:0 0 36px;width:36px;display:inline-flex;justify-content:center;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.25))}
.qj-badge{display:contents}
#carte-classement li.moi{background:var(--fond);margin:0 -8px;padding:8px;border-radius:var(--rayon)}
#carte-classement li.moi strong{color:var(--bordeaux)}
.st-table{width:100%;border-collapse:collapse;font-size:13.5px}
.st-table th{text-align:left;font-weight:700;color:var(--texte-2);font-size:12px;padding:4px 6px;border-bottom:1px solid var(--laiton)}
.st-table td{padding:6px;line-height:1.35;border-bottom:1px solid rgba(0,0,0,.08);vertical-align:top;color:var(--texte)}
.st-table td:not(:first-child),.st-table th:not(:first-child){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

/* --- Mode Brevet ------------------------------------------------------ */
.b-chap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;
  color:inherit;cursor:pointer}
.b-chap .corps{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.b-chap .t{font-family:var(--police-titre);font-weight:700;font-size:16.5px;line-height:1.3;color:var(--bordeaux)}
.b-chap.ferme{cursor:default;opacity:.7}
.b-chap.ferme .t{color:var(--texte-2)}
.b-essentiel{margin:0 0 6px}
.b-retenir p{font-size:16px;line-height:1.55}
.b-frise{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--laiton)}
.b-frise li{position:relative;padding:6px 0 8px 10px}
.b-frise li::before{content:"";position:absolute;left:-21px;top:12px;width:10px;height:10px;
  border-radius:50%;background:var(--fond-2);border:2px solid var(--or-vif)}
.b-frise li.cle::before{background:var(--bordeaux);border-color:var(--bordeaux)}
.b-frise .d{display:block;font-family:var(--police-titre);font-weight:700;color:var(--bordeaux)}
.b-frise li.cle .d::after{content:" \2605";color:var(--or-vif)}
.b-def{margin:0}
.b-def dt{font-weight:700;margin:10px 0 2px}
.b-def dt:first-child{margin-top:0}
.b-def dd{margin:0;color:var(--texte-2)}
.b-carte{text-align:center;min-height:190px}
.b-recto{font-family:var(--police-titre);font-size:24px;font-weight:700;color:var(--bordeaux);margin:8px 0 0;line-height:1.25}
.b-verso{font-size:17px;margin:18px 0 0;padding-top:16px;border-top:1px solid var(--laiton)}
.b-compte{text-align:center}
.b-j{font-family:var(--police-titre);font-size:44px;font-weight:900;color:var(--bordeaux);margin:0 0 6px;line-height:1}
.b-date{width:100%;min-height:46px;padding:8px 12px;font:inherit;color:var(--texte);
  background:var(--fond-2);border:1px solid var(--laiton);border-radius:10px}
.ligne-bilan{display:flex;justify-content:space-between;gap:12px;margin:0 0 8px}
.ligne-bilan b{color:var(--bordeaux);white-space:nowrap}
button.lien{background:none;border:0;padding:0;font:inherit;color:var(--bordeaux);
  text-decoration:underline;cursor:pointer}

.b-astuces ul{margin:0;padding-left:20px}
.b-astuces li{margin:0 0 8px;line-height:1.5}
.b-astuces li:last-child{margin-bottom:0}
.b-astuces li::marker{color:var(--or-vif)}

/* Frise a completer : la frise a gauche, les cases a droite, la reserve
   d'etiquettes en dessous. */
.bq-frise{list-style:none;margin:0 0 16px;padding:0 0 0 16px;border-left:3px solid var(--laiton)}
.bq-frise li{position:relative;display:flex;align-items:center;gap:10px;padding:7px 0}
.bq-frise li::before{content:"";position:absolute;left:-24px;top:50%;margin-top:-7px;width:10px;height:10px;
  border-radius:50%;background:var(--fond-2);border:2px solid var(--or-vif)}
.bq-frise li.juste::before{background:var(--vert-juste);border-color:var(--vert-juste)}
.bq-frise li.faux::before{background:var(--bordeaux);border-color:var(--bordeaux)}
.bq-frise .fixe{flex:0 0 38%;font-family:var(--police-titre);font-weight:700;color:var(--bordeaux);line-height:1.25}
.bq-frise.par-date .fixe{flex-basis:52%;font-family:inherit;font-weight:400;color:var(--texte)}
/* Geographie : des lieux a associer, sans ligne du temps */
.b-frise.lieux,.bq-frise.lieux{border-left:none;padding-left:0}
.b-frise.lieux li::before,.bq-frise.lieux li::before{display:none}
.b-frise.lieux li{padding-left:0;border-bottom:1px solid var(--laiton)}
.b-frise.lieux li:last-child{border-bottom:none}
.bq-frise.lieux li{border-bottom:1px dashed var(--laiton)}
.bq-case{flex:1;min-height:46px;padding:8px 10px;font:inherit;font-size:15px;text-align:left;cursor:pointer;
  background:var(--fond-2);color:var(--texte-2);border:2px dashed var(--laiton);border-radius:8px}
.bq-case.pleine{border-style:solid;color:var(--texte);background:var(--fond)}
.bq-case.survol{border-color:var(--bordeaux);background:var(--fond-3)}
.bq-case.juste{border:2px solid var(--vert-juste);color:var(--vert-juste);font-weight:700}
.bq-case.faux{border:2px solid var(--bordeaux);color:var(--bordeaux)}
.bq-case .barre{display:block;text-decoration:line-through;font-size:13.5px}
.bq-case .bq-bon{display:block;font-weight:700;color:var(--vert-juste);margin-top:2px}
.bq-banque{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:12px;border:1px solid var(--laiton);
  background:var(--fond-2);border-radius:10px;min-height:40px}
.bq-jeton{padding:9px 12px;font:inherit;font-size:15px;cursor:grab;touch-action:none;user-select:none;
  -webkit-user-select:none;background:var(--fond);color:var(--texte);border:2px solid var(--or-vif);border-radius:999px}
.bq-jeton.choisi{background:var(--bordeaux);border-color:var(--bordeaux);color:var(--fond-2)}
.bq-jeton.parti{opacity:.35}
.bq-jeton.fantome{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-60%);
  box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:.95}

/* Bilan d'un giga quiz : une ligne par cours, ce qu'il a rapporte. */
.giga-bilan{list-style:none;margin:0;padding:0}
.giga-bilan li{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--laiton)}
.giga-bilan li:first-child{border-top:0}
.giga-bilan .t{font-weight:700}
.coche{display:flex;gap:11px;align-items:flex-start;padding:11px 8px;
  border:1px solid var(--laiton);margin:0 0 7px;cursor:pointer;background:var(--voile)}
.coche input{appearance:none;-webkit-appearance:none;margin:3px 0 0;flex:0 0 20px;height:20px;
  border:1px solid var(--bordeaux);background:var(--fond-2);position:relative;cursor:pointer}
.coche input:checked::after{content:"";position:absolute;inset:3px;background:var(--bordeaux)}
.coche:has(input:checked){border-color:var(--bordeaux);background:var(--fond-3)}
select,input[type=file],textarea{font:inherit;color:var(--texte);background:var(--fond-2);
  border:1px solid var(--laiton);padding:10px;border-radius:var(--rayon);min-height:44px}
select{width:100%}
/* Reglage de la taille du texte : trois crans, A petit a A grand. */
.corps-texte{display:flex;gap:8px;align-items:center}
.corps-texte button{
  flex:1;min-height:44px;border:1px solid var(--laiton);background:var(--fond-2);
  color:var(--texte-2);font-family:var(--police-titre);font-weight:700;cursor:pointer;
  border-radius:var(--rayon);
}
.corps-texte button[aria-pressed="true"]{border-color:var(--bordeaux);color:var(--bordeaux);
  background:var(--fond-3)}
.corps-texte button:nth-child(1){font-size:13px}
.corps-texte button:nth-child(2){font-size:16px}
.corps-texte button:nth-child(3){font-size:20px}

/* --- Tableau de bord de l'accueil ------------------------------------- */
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 30%;min-width:96px;border:1px solid var(--laiton);padding:11px 8px;
  text-align:center;background:var(--fond-2)}
.stat .v{font-family:var(--police-titre);font-size:29px;font-weight:900;color:var(--bordeaux);line-height:1.1}
.stat .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-2);
  font-family:var(--police-titre);font-weight:700}
.jauge{height:9px;background:var(--fond-3);border:1px solid var(--laiton);margin:10px 0 4px;
  border-radius:999px;overflow:hidden}
.jauge div{height:100%;background:linear-gradient(90deg,var(--or-vif),var(--bordeaux));
  transition:width .5s ease}

/* Carte de reprise : l'element le plus important de l'accueil. */
.reprise{display:flex;gap:14px;align-items:flex-start}
.reprise .corps{flex:1;min-width:0}

/* Ruban des sept derniers jours : une pastille par jour, pleine si une
   seance y a ete validee. Le calendrier d'un almanach, en miniature. */
.ruban{display:flex;gap:6px;justify-content:space-between;margin:12px 0 4px}
.ruban .jour{flex:1;text-align:center}
.ruban .pt{
  width:100%;max-width:34px;aspect-ratio:1;margin:0 auto 4px;border-radius:50%;
  border:1px solid var(--laiton);background:var(--fond-3);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--police-titre);font-size:12px;font-weight:700;color:var(--texte-2);
}
.ruban .jour.actif .pt{background:var(--bordeaux);border-color:var(--bordeaux);color:var(--fond-2)}
.ruban .jour.aujourdhui .pt{box-shadow:0 0 0 2px var(--fond-2),0 0 0 3px var(--or-vif)}
.ruban .nom{font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--texte-2);font-family:var(--police-titre);font-weight:700}

/* Serie en cours : le chiffre qui donne envie de ne pas rompre la chaine. */
.serie{display:flex;align-items:center;gap:14px}
.serie .flamme{flex:0 0 auto;width:28px;height:36px;fill:none;
  stroke:var(--or-vif);stroke-width:1.5;stroke-linejoin:round}
.serie.vive .flamme{fill:var(--or-vif);fill-opacity:.22}
.serie .n{font-family:var(--police-titre);font-size:34px;font-weight:900;
  color:var(--bordeaux);line-height:1}

/* --- Barre d'onglets : le bas de reliure ------------------------------- */
.onglets{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;background:var(--fond);
  border-top:2.5px solid var(--bordeaux);
  box-shadow:0 -3px 0 -1px var(--laiton);
  padding-bottom:env(safe-area-inset-bottom);
}
.onglets button{
  flex:1;background:transparent;border:0;padding:8px 4px 10px;cursor:pointer;
  position:relative;
  font-family:var(--police-titre);font-size:11.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--texte-2);font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.onglets button svg{width:21px;height:21px;fill:none;stroke:var(--laiton);
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .16s}
.onglets button[aria-current="page"]{color:var(--bordeaux)}
.onglets button[aria-current="page"] svg{stroke:var(--bordeaux)}
/* Pastille de rappel : une seance attend d'etre lue. */
/* Quatre libelles sur un ecran de 320 px : REGLAGES touchait le bord. */
@media (max-width:359px){ .onglets button{font-size:10.5px;letter-spacing:.05em} }
.onglets button .point{
  position:absolute;top:6px;left:50%;margin-left:7px;width:8px;height:8px;border-radius:50%;
  background:var(--or-vif);box-shadow:0 0 0 2px var(--fond);
}

/* --- Divers ------------------------------------------------------------ */
.fil{display:flex;align-items:center;gap:8px;margin:14px 0 10px;flex-wrap:nowrap}
.fil .bouton{width:auto}
/* Le titre du cours peut faire soixante caracteres : il prend la place
   qui reste et se coupe, au lieu de pousser les deux boutons a la ligne. */
.fil .retour{flex:1 1 auto;min-width:0;justify-content:flex-start;
  text-transform:none;letter-spacing:.01em;font-size:13.5px;
  font-family:var(--police-texte);gap:6px}
.fil .retour .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fil .carre{flex:0 0 42px;width:42px;padding:6px 0;font-size:15px;letter-spacing:0}
/* La commande d'ecoute garde toujours sa largeur : c'est le titre du
   cours, a cote, qui se coupe -- un titre tronque reste lisible, un
   bouton tronque en << EC... >> ne veut plus rien dire. En dessous de
   360 px, la commande se reduit au seul triangle. */
.fil .ecoute{flex:0 0 auto;gap:5px;padding-left:10px;padding-right:11px;
  font-size:11.5px;letter-spacing:.09em;white-space:nowrap;
  border-color:var(--bordeaux);color:var(--bordeaux)}
@media (max-width:359px){ .fil .ecoute .nom{display:none} .fil .ecoute{padding:6px 11px} }
.vide{text-align:center;color:var(--texte-2);padding:26px 10px;font-style:italic}
.avis{border:1px solid var(--bordeaux);background:var(--fond-2);
  border-left-width:4px;padding:11px 13px;margin:0 0 14px;font-size:15.5px}
.avis.ok{border-color:var(--vert-juste)}
.sources li{margin-bottom:.5em;font-size:15px}
.sources li::marker{color:var(--or-vif)}
.pied{display:flex;align-items:center;justify-content:center;gap:12px;
  color:var(--texte-2);font-size:13px;letter-spacing:.06em;
  padding:22px 0 6px;font-family:var(--police-titre);font-style:italic}
.pied .fleuron{width:42px;height:21px;color:var(--or);flex:0 0 auto}
.pied .fleuron.miroir{transform:scaleX(-1)}
.saut{height:10px}
@media (min-width:640px){
  body{font-size:calc(17.5px * var(--echelle))}
  .app{padding-bottom:calc(var(--barre) + 40px)}
  .stat{flex:1 1 0}
  /* Sur grand ecran, la barre d'onglets reste alignee sur la colonne de texte. */
