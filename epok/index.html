t la plus grande partie du territoire, mais n’abritent qu’environ un tiers de la population, dans les communes rurales.</p>\n<p>Une large bande peu peuplée traverse la France des Ardennes aux Landes : on l’appelle la « <strong>diagonale du vide</strong> ». La Lozère, dans le Massif central, est le département le moins peuplé de France. Ces espaces sont pourtant très divers : certains perdent des habitants, d’autres, proches des villes ou des littoraux, en gagnent.</p>"},{"titre":"Des atouts à valoriser","html":"\n<p>Ces espaces ont de nombreux atouts. L’<strong>agriculture</strong> et la forêt y occupent de grandes surfaces, avec des produits de qualité, comme les fromages ou les vins d’appellation. Le <strong>tourisme</strong> y est important : sports d’hiver dans les grandes stations des Alpes, randonnée, tourisme vert. Beaucoup de citadins y possèdent des <strong>résidences secondaires</strong>.</p>\n<p>Des <strong>néoruraux</strong>, citadins venus s’installer à la campagne, recherchent un cadre de vie calme et moins cher, d’autant que le télétravail se développe. Ces espaces produisent aussi des énergies renouvelables, avec les éoliennes ou le solaire. Leur patrimoine naturel est protégé par des <strong>parcs nationaux</strong>, comme celui des Cévennes, et par des <strong>parcs naturels régionaux</strong>.</p>"},{"titre":"Des difficultés et des réponses","html":"\n<p>Beaucoup de ces espaces souffrent du départ des jeunes et du <strong>vieillissement</strong> de leur population. Les services publics reculent : écoles, bureaux de poste, médecins, d’où des <strong>déserts médicaux</strong>. Certains territoires sont <strong>enclavés</strong>, loin des grands axes de transport.</p>\n<p>Les pouvoirs publics cherchent des réponses : maisons France services qui regroupent des services publics, maisons de santé, déploiement du très haut débit pour Internet, aides de l’Union européenne au développement rural. Les communes se regroupent en intercommunalités pour mieux s’équiper. Ces territoires ne sont donc pas condamnés : beaucoup se transforment et gagnent de nouveaux habitants.</p>"}],"retenir":"Les espaces de faible densité, ruraux, montagnards ou touristiques peu urbanisés, couvrent la plus grande partie du territoire mais abritent une minorité de la population. Ils ont des atouts : agriculture, tourisme, cadre de vie qui attire des néoruraux, énergies renouvelables, patrimoine naturel protégé. Mais ils souffrent souvent du vieillissement, de l’enclavement et du recul des services, auxquels les pouvoirs publics tentent de répondre.","astuces":["Faible densité ne veut pas dire « vide » ni « en déclin » : présentez toujours à la fois les atouts et les difficultés.","La diagonale du vide se retient comme une bande des Ardennes aux Landes, en passant par le Massif central.","Pour les réponses, citez une mesure concrète : maisons France services, maisons de santé, très haut débit."],"reperes":[{"date":"Diagonale du vide","ev":"bande peu peuplée des Ardennes aux Landes","cle":true},{"date":"Lozère","ev":"département le moins peuplé de France"},{"date":"Massif central","ev":"moyenne montagne rurale, terre d’élevage","cle":true},{"date":"Alpes","ev":"haute montagne, grandes stations de sports d’hiver","cle":true},{"date":"Cévennes","ev":"parc national habité, en moyenne montagne"},{"date":"Landes","ev":"vaste forêt de pins plantée par l’homme"}],"notions":[{"terme":"Densité de population","def":"Nombre moyen d’habitants par kilomètre carré."},{"terme":"Espace de faible densité","def":"Espace peu peuplé : espace rural, montagne, secteur touristique peu urbanisé."},{"terme":"Espace rural","def":"Espace où dominent les paysages agricoles et naturels et les petites communes."},{"terme":"Diagonale du vide","def":"Bande de faibles densités qui traverse la France des Ardennes aux Landes."},{"terme":"Néorural","def":"Citadin qui s’installe à la campagne."},{"terme":"Résidence secondaire","def":"Logement occupé seulement pendant les vacances ou les week-ends."},{"terme":"Tourisme vert","def":"Tourisme tourné vers la nature et la campagne : randonnée, gîtes, découverte."},{"terme":"Parc national","def":"Espace naturel protégé par l’État, aux règles strictes."},{"terme":"Parc naturel régional","def":"Territoire rural habité qui protège son patrimoine et favorise son développement."},{"terme":"Désert médical","def":"Territoire où il manque des médecins et des soins de proximité."},{"terme":"Enclavement","def":"Situation d’un territoire isolé, mal relié aux grands axes de transport."},{"terme":"Intercommunalité","def":"Regroupement de communes pour gérer ensemble des services et des projets."}],"acteurs":[{"nom":"Les communes et les intercommunalités","role":"Elles gèrent les services de proximité et portent les projets locaux."},{"nom":"L’État","role":"Il ouvre des maisons France services et finance le très haut débit."},{"nom":"Les régions et les départements","role":"Ils financent les transports, les routes, les collèges et les lycées."},{"nom":"L’Union européenne","role":"Elle finance le développement rural par des fonds européens."},{"nom":"Les habitants et les néoruraux","role":"Ils font vivre ces territoires et y créent des activités."}],"questions":[{"enonce":"Quels espaces sont des espaces de faible densité ?","options":["Les espaces ruraux","Les montagnes","Les secteurs touristiques peu urbanisés","Les centres des métropoles"],"c":"z1awP9ZcfVz1xOuFL6VtVomETrDsZpjUr0ePJwaSDhriUBfm0g2JLqBxpvLWAAySopegde9kv+z6C+TeOu6EZdBuaInDgLudhqy9mxd3SP6ME83D+PgpJ0qISW/wgtOWfmQANqoBzg9Cjyv14MpJbTXhW/adtq1ka+KEoqcAXRmON5o/U6KGGGsfgipkxOjO+YCYmoEzi+GvW29zSUGRrw3pbJcTzcdSTztpHHXicR3q/84/+ulLKgfzuc2mFiJ83eI5D4tITA=="},{"enonce":"Qu’est-ce que la diagonale du vide ?","options":["Une bande peu peuplée des Ardennes aux Landes","Une autoroute qui traverse la France","Une frontière entre 2 régions","Un désert au sud de la France"],"c":"yf4JhRt3VTYXVnsas1PTuWlIAAd8pmMIjWKaR2Pw7l8r535XJBZjlG9WE6t34FJGACeKncT8FIGqaPswRRfP6r4F s</strong>. À l’échelle nationale, l’<strong>Île-de-France</strong> rassemble moins d’un habitant sur 5 mais produit près d’un tiers de la richesse du pays. Les grandes métropoles, l’Ouest et le Sud attirent habitants et emplois, tandis que d’anciennes régions industrielles et de nombreux espaces ruraux perdent des habitants, des emplois et des services.</p>\n<p>Les inégalités existent aussi à l’intérieur des villes. Des quartiers aisés côtoient des <strong>quartiers prioritaires</strong> de la politique de la ville, environ 1 500 en France, où le chômage et la pauvreté sont plus élevés qu’ailleurs. Enfin, les territoires d’outre-mer restent nettement moins riches que la moyenne nationale.</p>"},{"titre":"Aménager le territoire","html":"\n<p>L’<strong>aménagement du territoire</strong> consiste à organiser l’espace pour réduire ces inégalités et rendre les territoires plus attractifs. Dans les années 1960, l’État crée la <strong>DATAR</strong> (1963), qui soutient des « métropoles d’équilibre » face à Paris et construit des villes nouvelles. Les <strong>lignes à grande vitesse</strong>, à partir de Paris-Lyon en 1981, et les autoroutes rapprochent les régions de la capitale.</p>\n<p>Aujourd’hui, les priorités ont changé : désenclaver les espaces ruraux, déployer le très haut débit, revitaliser les petites villes et les villes moyennes avec des programmes comme « Action cœur de ville », rénover les quartiers en difficulté. Depuis 2020, l’<strong>Agence nationale de la cohésion des territoires</strong> (ANCT) coordonne ces politiques. Autour de Paris, le <strong>Grand Paris Express</strong>, un réseau d’environ 200 kilomètres de métro automatique, doit mieux relier les banlieues entre elles.</p>"},{"titre":"De nombreux acteurs, des projets débattus","html":"\n<p>Depuis les lois de <strong>décentralisation</strong> de 1982, l’État partage l’aménagement avec les <strong>collectivités territoriales</strong> : régions, départements, communes et intercommunalités. Depuis 2016, la France métropolitaine compte 13 régions, plus grandes, chargées notamment des transports et du développement économique. L’<strong>Union européenne</strong> finance aussi des projets par ses fonds régionaux, comme le FEDER.</p>\n<p>Les grands projets d’aménagement suscitent parfois de fortes oppositions. Des habitants et des associations défendent l’environnement ou leur cadre de vie. Le projet d’aéroport de <strong>Notre-Dame-des-Landes</strong>, près de Nantes, a été abandonné en 2018 après des années de contestation. Aménager, c’est donc aussi concilier développement, justice entre les territoires et protection de l’environnement.</p>"}],"retenir":"Les inégalités entre territoires se creusent à toutes les échelles : entre l’Île-de-France et le reste du pays, entre métropoles et espaces ruraux, entre quartiers d’une même ville. Pour les réduire, l’État, aidé depuis 1982 par les collectivités territoriales et par l’Union européenne, aménage le territoire : transports, très haut débit, services, rénovation urbaine. Les grands projets sont souvent débattus, voire contestés.","astuces":["Pensez « à toutes les échelles » : une inégalité nationale (Île-de-France), une régionale (métropole et campagne), une locale (quartiers d’une ville).","Pour chaque aménagement, demandez-vous qui décide, qui paie et à qui il profite : c’est le cœur de la réponse.","Notre-Dame-des-Landes est l’exemple à citer d’un projet abandonné après une contestation."],"reperes":[{"date":"Île-de-France","ev":"région la plus riche, qui produit près d’un tiers de la richesse nationale","cle":true},{"date":"Ligne Paris-Lyon","ev":"première ligne à grande vitesse, ouverte en 1981","cle":true},{"date":"Grand Paris Express","ev":"nouveau réseau de métro automatique autour de Paris"},{"date":"Notre-Dame-des-Landes","ev":"projet d’aéroport près de Nantes, abandonné en 2018"},{"date":"Seine-Saint-Denis","ev":"département jeune et populaire, aux nombreux quartiers prioritaires"}],"notions":[{"terme":"Inégalité territoriale","def":"Différence de richesse, d’emplois ou d’accès aux services entre des territoires."},{"terme":"Aménagement du territoire","def":"Action d’organiser l’espace pour le rendre plus efficace et réduire les inégalités."},{"terme":"Attractivité","def":"Capacité d’un territoire à attirer habitants, entreprises et touristes."},{"terme":"Désenclavement","def":"Action de mieux relier un territoire isolé aux grands axes de transport et de communication."},{"terme":"Décentralisation","def":"Transfert de pouvoirs de l’État vers les collectivités territoriales, engagé par les lois de 1982."},{"terme":"Collectivité territoriale","def":"Région, département ou commune, administrée par des élus locaux."},{"terme":"Région","def":"Collectivité territoriale ; la France métropolitaine en compte 13 depuis 2016."},{"terme":"Intercommunalité","def":"Regroupement de communes pour gérer ensemble des services et des projets."},{"terme":"Quartier prioritaire","def":"Quartier urbain pauvre qui reçoit des aides particulières de la politique de la ville."},{"terme":"Rénovation urbaine","def":"Transformation de quartiers dégradés : démolitions, reconstructions, nouveaux équipements."},{"terme":"Métropole d’équilibre","def":"Grande ville régionale soutenue par l’État dans les années 1960 pour faire contrepoids à Paris."},{"terme":"FEDER","def":"Fonds européen de développement régional, qui finance des projets dans les régions de l’Union."}],"acteurs":[{"nom":"L’État","role":"Il définit les grandes orientations, finance les grands équipements et coordonne l’action par l’ANCT."},{"nom":"Les régions","role":"Elles organisent les transports régionaux et soutiennent le développement économique."},{"nom":"Les départements et les communes","role":"Ils gèrent routes, collèges, écoles, urbanisme et services de proximité."},{"nom":"L’Union européenne","role":"Elle finance des projets dans les régions par le FEDER."},{"nom":"Les citoyens et les associations","role":"Ils participent pwg2vErEfHldt2Tuu/+qdKvtOzsbxUdVfAXVjMHToswdS8Bhrn1Mo="},{"enonce":"Que s’est-il passé à Notre-Dame-des-Landes ?","options":["Un projet d’aéroport a été abandonné en 2018 après une forte contestation","Une ligne à grande vitesse y a été inaugurée","Un parc national y a été créé en 1963","Une métropole y a été fondée"],"c":"sr2PU6fdgglk1WLcTWonPhKJV7wfLSt74WIgFy4GmES1IP06QxCp3ExJdtVMoeaUtHqp4z9MFJ0Ra9w7MZfxq3+Zhkd92X0j7Hw/qKKD/E0d+YdC5QKU5cbna2+pn0j6clKXxySURyFyx7oZ32rPcS6P7u5WQQtSgcq7XBlb1lrRSf5SEq99M0JgafFqnywMVVnsNsHPHs/NAmg3UGPOmBPaoi9ulSXi4NaDCgf2+WlYqpPNAscIdGSt7qwVz0ogoIH2wxB1e4fOfHJKpvDq8Q1fVeW2ig=="},{"enonce":"Combien la France métropolitaine compte-t-elle de régions depuis 2016 ?","options":["13","22","5","101"],"c":"iJyPIQszNvWyUbJe/06IfatB3tz3sBRVAFHAXihJmJzVz32ifaquERaHxRt7uTtLb7I1ijuOj+Di5AML7vQTlJtqqgj8OqioggNRxhSRKmrC9C3WVAA81BXvfrcTgAYiF/WBoADB7z5sdMii2THuV3EKWNkpOvBykxN1sF+uQysf5gxG+kNG0+xKWdGpCrFebvyfu4ux0OiRSGlRLHgIW/t40SUIZoLWIFRNo/eNsLsVWm+bTqAN1w=="}]},"g-outre-mer":{"essentiel":[{"titre":"Des territoires dispersés dans le monde","html":"\n<p>Les <strong>territoires ultramarins</strong> sont les territoires français situés hors d’Europe, dans les océans Atlantique, Indien et Pacifique. Ils comptent environ 2,8 millions d’habitants. 5 sont des <strong>départements et régions d’outre-mer</strong> (DROM) : la Guadeloupe, la Martinique, la Guyane, La Réunion et Mayotte, devenue département en 2011. Les autres sont des collectivités au statut particulier, comme la Polynésie française, ou la <strong>Nouvelle-Calédonie</strong>, dont l’avenir institutionnel reste débattu : 3 référendums, en 2018, 2020 et 2021, ont donné une majorité au maintien dans la France.</p>\n<p>Grâce à eux, la France possède la 2e <strong>zone économique exclusive</strong> (ZEE) du monde, après celle des États-Unis : environ 10 millions de kilomètres carrés d’espaces maritimes.</p>"},{"titre":"Des atouts pour la France","html":"\n<p>Les outre-mer offrent à la France une présence dans tous les océans, des bases militaires et un rôle diplomatique dans plusieurs régions du monde. Leur <strong>biodiversité</strong> est exceptionnelle : forêt amazonienne en Guyane, récifs coralliens et lagons de Nouvelle-Calédonie. Le <strong>Centre spatial guyanais</strong> de Kourou, proche de l’équateur, lance les fusées européennes. La Nouvelle-Calédonie possède de grandes réserves de <strong>nickel</strong>.</p>\n<p>Le <strong>tourisme</strong> y est important, aux Antilles, à La Réunion ou en Polynésie. Les DROM font partie de l’Union européenne comme <strong>régions ultrapériphériques</strong> (RUP) : ils utilisent l’euro et reçoivent des aides européennes.</p>"},{"titre":"Des contraintes et des inégalités spécifiques","html":"\n<p>Ces territoires sont marqués par l’<strong>éloignement</strong> de la métropole, souvent l’<strong>insularité</strong>, et par des <strong>risques naturels</strong> : cyclones, éruptions volcaniques, séismes. En décembre 2024, le cyclone Chido a ravagé Mayotte. Le chômage et la pauvreté y sont bien plus élevés qu’en métropole : à Mayotte, environ 3 habitants sur 4 vivent sous le seuil de pauvreté national. Les prix sont aussi plus élevés, ce qui provoque des mouvements contre la « vie chère ».</p>\n<p>Les économies dépendent beaucoup de la métropole, pour les importations comme pour les emplois publics. La forte croissance démographique et l’immigration, à Mayotte ou en Guyane, posent des défis d’équipement. L’État et l’Union européenne aménagent ces territoires : ports, aéroports, logements, écoles, et aides à la <strong>continuité territoriale</strong> pour réduire le coût des trajets vers la métropole.</p>"}],"retenir":"Les territoires ultramarins, dispersés dans tous les océans, donnent à la France la 2e zone économique exclusive du monde, une présence stratégique, une biodiversité exceptionnelle et des ressources comme le nickel ou la base spatiale de Kourou. Mais ils subissent l’éloignement, l’insularité et les risques naturels, et restent plus pauvres que la métropole. Leur aménagement est une problématique spécifique, soutenue par l’État et l’Union européenne.","astuces":["Retenez les 5 DROM avec un moyen simple : 2 îles des Antilles (Guadeloupe, Martinique), la Guyane en Amérique du Sud, 2 îles de l’océan Indien (La Réunion, Mayotte).","Construisez toujours un raisonnement en 2 temps : des atouts pour la France, puis des contraintes pour les habitants.","ZEE : pensez « zone de 200 milles marins le long des côtes, où la France exploite seule les ressources »."],"reperes":[{"date":"Guyane","ev":"Centre spatial de Kourou, forêt amazonienne","cle":true},{"date":"La Réunion","ev":"département d’outre-mer le plus peuplé, dans l’océan Indien","cle":true},{"date":"Mayotte","ev":"département depuis 2011, le plus pauvre de France"},{"date":"Nouvelle-Calédonie","ev":"grandes réserves de nickel, avenir institutionnel débattu"},{"date":"Antilles","ev":"Guadeloupe et Martinique, îles de la mer des Caraïbes"},{"date":"Polynésie française","ev":"archipels du Pacifique, qui donnent à la France une immense ZEE"}],"notions":[{"terme":"Territoire ultramarin","def":"Territoire français situé hors d’Europe, dans un océan lointain."},{"terme":"DROM","def":"Département et région d’outre-mer : Guadeloupe, Martinique, Guyane, La Réunion, Mayotte."},{"terme":"Collectivité d’outre-mer","def":"Territoire ultramarin au statut particulier, avec une large autonomie, comme la Polynésie française."},{"terme":"Zone économique exclusive","def":"Espace maritime de 200 milles marins le long des côtes, dont un État exploite seul les ressources."},{"terme":"Région ultrapériphérique","def":"Territoire de l’Union européenne très éloigné du continent européen, qui reçoit des aides particulières."},{"terme":"Insularité","def":"Situation d’un territoire qui est une île, avec les contraintes qui en découlent."},{"terme":"Éloignement","def":"Grande distance qui sépare un territoire de la métropole et rend les échanges coûteux."},{"terme":"Risque naturel","def":"Danger qu’un phénomène naturel, comme un cyclone ou une éruption, fait peser sur une population."},{"terme":"Biodiversité","def":"Diversité des espèces vivantes et des milieux naturels."},{"terme":"Continuité territoriale","def":"Aides de l’État pour réduire le coût des transports entre l’outre-mer et la métropole."},{"terme":"Métropole","def":"Ici, la France située en Europe, par opposition à l’outre-mer."},{"terme":"Vie chère","def":"Niveau des prix plus élevé qu’en métropole, lié notamment aux importations."}],"acteurs":[{"nom":"L’État","role":"Il finance les équipements, les services publics et la continuité territoriale."},{"nom":"Les collectivités ultramarines","role":"Elles gèrent l’aménagement local, avec plus ou moins d’autonomie selon leur statut."},{"nom":"L’Union européenne","role":"Elle soutient les régions ultrapériphériques par des fonds européens."},{"nom":"Le Centre national d’études spatiales","role":"Il exploite le Centre spatial guyanais de Kourou."},{"nom":"Les habitants","role":"Ils font vivre ces territoires et se mobilisent parfois contre la vie chère."}],"questions":[{"enonce":"Quels territoires sont des départements et régions d’outre-mer ?","options":["La Guadeloupe et la Martinique","La Guyane","La Réunion et Mayotte","La Polynésie française"],"c":"vhcN8zzgts81hP6YFx6u5drU2twBxEPrXHUadWhHAjteInS7eLCdW7xed/hVuuZlKzO1y+So8ut+ROFptziLL7WwQ25vN2oQKC5ndPqfF0IWR8P+YbimgOvRQcjhDdw8iFSNu59sZl2AovM6Nl+hGuCh1jWKNvqYFA84RcPlhP4WKQxX7biFbCl8Rkw1FDETCsV7XgcklqWQ7NBT+IYsFxB2GW4VJoEsjhdpnJEa4RDJU2ArwtEwz1KlmsQ49b7r/e1O"},{"enonce":"Quel rang la France occupe-t-elle pour la taille de sa zone économique exclusive ?","options":["2e du monde","10e du monde","Premier d’Europe seulement grâce à la Corse","Elle n’a pas de ZEE"],"c":"KmJK8Tcb6wne2SDH8EU7fmvjDOgpWTSt7RAowRgMg8yGqwjEYJMjNFm4Mx+5BJIkl6MhVGSkOo+sEA3kZrC97TUXrKokfhyBZ86Glx0sGhzmL4SSj49ibYMZvgaSX0NN4SQSoWqNhTEW2NksfxFPTiLNR+sVesvowtLp8QgQK7Sqq/pBesDqFMPK4OnY4fU "g-union-europeenne":{"essentiel":[{"titre":"Un territoire construit pas à pas","html":"\n<p>L’<strong>Union européenne</strong> (UE) rassemble 27 États et environ 450 millions d’habitants. Elle est née de la construction européenne engagée après la Seconde Guerre mondiale : la France fait partie des 6 pays fondateurs de la Communauté économique européenne, créée par le traité de Rome en 1957. Le traité de Maastricht, en 1992, fonde l’Union européenne et crée la <strong>citoyenneté européenne</strong>. L’UE s’est élargie à de nombreux pays, surtout vers l’Est en 2004 ; le Royaume-Uni l’a quittée en 2020.</p>\n<p>Ses institutions se répartissent entre plusieurs villes : la <strong>Commission européenne</strong> à Bruxelles, le <strong>Parlement européen</strong> à Strasbourg, la <strong>Banque centrale européenne</strong> à Francfort, la Cour de justice à Luxembourg.</p>"},{"titre":"Un territoire de référence et d’appartenance","html":"\n<p>L’UE est un espace où les hommes, les marchandises, les capitaux et les services circulent librement : c’est le <strong>marché unique</strong>. Dans l’<strong>espace Schengen</strong>, qui regroupe la plupart des pays de l’UE et quelques voisins comme la Suisse ou la Norvège, les contrôles aux frontières intérieures ont été supprimés. L’<strong>euro</strong> est la monnaie commune d’une vingtaine de pays.</p>\n<p>Les Européens partagent des symboles, un drapeau et un hymne, et élisent leurs députés européens. Le programme <strong>Erasmus</strong>, créé en 1987, permet à des millions de jeunes d’étudier ou de se former dans un autre pays. Les frontières intérieures deviennent des espaces de coopération : de nombreux travailleurs <strong>transfrontaliers</strong> vivent en France et travaillent au Luxembourg, en Suisse ou en Allemagne.</p>"},{"titre":"Un territoire inégal, que l’UE cherche à rendre plus solidaire","html":"\n<p>Le territoire européen est inégal. Le cœur de l’UE est la <strong>mégalopole européenne</strong>, un axe urbain et industriel très peuplé et très riche qui s’étend de Londres à Milan, en passant par le Benelux et la vallée du Rhin. Les périphéries, à l’Est et au Sud, sont souvent moins riches, même si certaines rattrapent leur retard.</p>\n<p>Pour réduire ces écarts, l’UE mène une <strong>politique de cohésion</strong> : ses fonds, comme le FEDER, financent routes, voies ferrées, réseaux numériques et formations dans les régions en retard. La <strong>politique agricole commune</strong> soutient les agriculteurs. La France, État fondateur et l’un des plus peuplés de l’Union, y joue un rôle majeur ; ses régions reçoivent aussi des aides européennes, notamment les outre-mer.</p>"}],"retenir":"L’Union européenne réunit 27 États et environ 450 millions d’habitants. C’est un territoire de référence, avec des institutions communes, un marché unique, l’espace Schengen et l’euro, et un territoire d’appartenance, avec la citoyenneté européenne et des programmes comme Erasmus. Ce territoire reste inégal, entre la mégalopole européenne et les périphéries, ce que l’UE cherche à corriger par sa politique de cohésion. La France, pays fondateur, y joue un rôle majeur.","astuces":["Retenez les sièges des institutions avec une chaîne simple : Commission à Bruxelles, Parlement à Strasbourg, Banque centrale à Francfort, Cour de justice à Luxembourg.","Ne confondez pas : l’UE (27 États), la zone euro (ceux qui ont l’euro) et l’espace Schengen (sans contrôle aux frontières intérieures).","Sur un croquis de l’UE, tracez d’abord la mégalopole européenne, de Londres à Milan : c’est le centre."],"reperes":[{"date":"Bruxelles","ev":"siège de la Commission européenne","cle":true},{"date":"Strasbourg","ev":"siège du Parlement européen","cle":true},{"date":"Francfort","ev":"siège de la Banque centrale européenne"},{"date":"Luxembourg","ev":"siège de la Cour de justice de l’Union européenne"},{"date":"Mégalopole européenne","ev":"axe le plus riche et le plus peuplé, de Londres à Milan","cle":true},{"date":"Espace Schengen","ev":"espace sans contrôle aux frontières intérieures"}],"notions":[{"terme":"Union européenne","def":"Union de 27 États européens qui partagent des institutions, des règles et des politiques communes."},{"terme":"Citoyenneté européenne","def":"Droits des citoyens des États membres : circuler, s’installer, voter aux élections européennes."},{"terme":"Marché unique","def":"Espace où marchandises, personnes, services et capitaux circulent librement."},{"terme":"Espace Schengen","def":"Ensemble de pays européens qui ont supprimé les contrôles aux frontières intérieures."},{"terme":"Zone euro","def":"Ensemble des pays de l’UE qui utilisent l’euro comme monnaie."},{"terme":"Frontière extérieure","def":"Limite entre l’Union européenne et les pays qui n’en font pas partie."},{"terme":"Travailleur transfrontalier","def":"Personne qui vit dans un pays et travaille dans un pays voisin."},{"terme":"Mégalopole européenne","def":"Axe urbain très peuplé et très riche de Londres à Milan, cœur économique de l’Europe."},{"terme":"Périphérie","def":"Espace éloigné du centre et souvent moins riche et moins bien relié."},{"terme":"Politique de cohésion","def":"Politique de l’UE qui aide les régions en retard pour réduire les inégalités."},{"terme":"Politique agricole commune","def":"Politique de l’UE qui soutient les agriculteurs des États membres."},{"terme":"Erasmus","def":"Programme européen, créé en 1987, qui permet d’étudier ou de se former dans un autre pays."}],"acteurs":[{"nom":"La Commission européenne","role":"Elle propose les lois européennes et veille à leur application."},{"nom":"Le Parlement européen","role":"Élu par les citoyens tous les 5 ans, il vote les lois et le budget de l’Union."},{"nom":"Le Conseil européen","role":"Il réunit les chefs d’État et de gouvernement, qui fixent les grandes orientations."},{"nom":"La Banque centrale européenne","role":"Elle gère l’euro depuis Francfort."},{"nom":"Les États membres","role":"Ils décident ensemble e GMBMXNWolyd69o6ckgLCzNaFDh+Yxsl/RDXfdLTy1hPpeKNqwWTzfzjuMdBInCPP+Wz6IMOndAqRIZxnPO4PBrKXXP41zBST/afMDh3cq2Q1xr8CT7XvkbDQTqK5n9cx/J6DKYjZ4p5q5LK1xuN0/WriCnb2U4pB1ywWV/cURt6XtXh6KvWyJWe28udJ57YuWcxWIG8ZnorVYWHJApA=="},{"enonce":"Qu’est-ce que le programme Erasmus ?","options":["Un programme qui permet d’étudier ou de se former dans un autre pays européen","Une monnaie européenne","Un traité de paix","Une fusée européenne"],"c":"k1YVFbOB/2s36hA0CPEyS7f8DxTk+GHlUTCGxgj1cQJmED806ZTEfF+nmmjKORFmpSAfCmgfBHqPCFyHexE7CErOgnwKURdjKxCSFjRMHDnA0MpvsOfvcaLbZjZievfxsizM4hFj4MJ4KI3kRgP0oiCvzoq33qD81g0JCbuK4OsbEKdpEAF0dbRBhFN+ZSUyiECrxz1CGwf57pGbahusik/oqWnGfllfgwhjstAN6E7R63yceQ=="}]},"g-france-monde":{"essentiel":[{"titre":"Une puissance politique et militaire","html":"\n<p>La France est une <strong>puissance</strong> qui compte dans le monde. Elle est l’un des 5 <strong>membres permanents du Conseil de sécurité de l’ONU</strong>, avec un droit de veto. Elle possède l’arme nucléaire depuis 1960 et une armée capable d’intervenir loin de ses frontières, grâce à des bases à l’étranger, comme à Djibouti ou à Abou Dhabi. Ses territoires ultramarins lui assurent une présence dans tous les océans et la 2e zone économique exclusive du monde.</p>\n<p>Elle dispose d’un des plus grands réseaux diplomatiques au monde et participe aux grandes organisations internationales : ONU, Union européenne, OTAN, G7.</p>"},{"titre":"Une puissance économique et culturelle","html":"\n<p>La France compte parmi les 10 premières puissances économiques mondiales. Ses entreprises exportent des avions, des produits de luxe, des vins, des médicaments et des armes. Elle est la première <strong>destination touristique</strong> du monde.</p>\n<p>Son <strong>rayonnement culturel</strong> s’appuie sur sa langue, sa culture et son patrimoine : la <strong>francophonie</strong> rassemble environ 320 millions de locuteurs du français, surtout en Afrique, et l’Organisation internationale de la Francophonie réunit des dizaines d’États. Paris accueille le siège de l’<strong>Unesco</strong>. Les écoles et instituts français à l’étranger, les films, la gastronomie et le sport participent à cette influence, qu’on appelle parfois <strong>soft power</strong>.</p>"},{"titre":"L’Union européenne, une puissance incomplète","html":"\n<p>L’<strong>Union européenne</strong> est une grande puissance économique : un marché de 450 millions de consommateurs, l’une des premières puissances commerciales du monde, une monnaie, l’<strong>euro</strong>, qui est la 2e monnaie de réserve après le dollar. Avec ses États membres, elle est le premier donateur d’<strong>aide au développement</strong> du monde. Elle impose aussi ses normes, par exemple sur la protection des données personnelles.</p>\n<p>Mais c’est une <strong>puissance incomplète</strong> : elle n’a pas d’armée commune, ses États ne sont pas toujours d’accord en politique étrangère, elle dépend d’autres pays pour son énergie et reste en retard face aux géants américains et chinois du numérique. La France, de son côté, est une puissance moyenne, dont l’influence dépend de plus en plus de l’Europe.</p>"}],"retenir":"La France est une puissance mondiale : membre permanent du Conseil de sécurité de l’ONU, puissance nucléaire présente dans tous les océans, grande économie exportatrice, première destination touristique, au cœur de la francophonie. L’Union européenne est une puissance économique et commerciale, avec l’euro et le premier budget d’aide au développement du monde, mais une puissance politique et militaire incomplète.","astuces":["Classez les signes de puissance en 4 familles : politique et diplomatique, militaire, économique, culturelle.","Pour l’UE, construisez toujours la réponse en 2 temps : une puissance économique, mais une puissance politique incomplète.","N’oubliez pas les limites : la France est une puissance moyenne, dont l’influence passe aussi par l’Europe."],"reperes":[{"date":"New York","ev":"siège de l’ONU, où la France est    l'application sait verifier : les connaissances et les reperes.

   Chaque chapitre porte :
     essentiel   trois parties courtes, au vocabulaire du programme
     retenir     le resume a savoir par coeur
     reperes     dates a connaitre ; « cle » marque les incontournables

     acteurs     personnages, nom et role
     questions   QCM du chapitre (quatre options, une ou plusieurs justes)
     plusLoin    cours du catalogue qui approfondissent le chapitre
   Un chapitre sans « essentiel » est annonce et non encore redige.

   Progression, dans ETAT.brevet :
     chapitres  { id: { lu:"AAAA-MM-JJ", qcm:{ date, justes, total, tentatives, meilleur },
                        validations:[ms, ms], tour:{ qcm: ms, frise: ms } } }
     cartes     { "id#n#k" | "id#a#k" | "id#r#k": { b: boite 1 a 5, p:"AAAA-MM-JJ", d: derniere revue } }
     dateExamen ancien champ, plus utilise : depuis octobre 2026, la date de
                l'epreuve est fixee par le professeur (config/brevet).
   ====================================================================== */

/* ---------- Ouverture des chapitres par le professeur ----------
   Toutes les fiches sont redigees d'avance, mais l'eleve ne voit que les
   chapitres que son professeur a ouverts, une fois traites en classe.

   La liste des chapitres ouverts est un document Firestore public en
   lecture, config/brevet, que seul le professeur peut modifier (regles
   dans serveur/firestore.rules ; son adresse dans config-compte.js,
   « professeurs »). L'application le relit a l'ouverture et quand elle
   revient au premier plan, et garde la derniere liste connue pour
   fonctionner hors ligne. Tant qu'aucun projet n'est configure, ou
   avant la premiere lecture, c'est DEBLOCAGE_DEFAUT qui s'applique ; il
   suffit alors de le modifier et de republier.

   Le professeur, connecte avec son compte, voit tous les chapitres et
   les ouvre ou les ferme depuis les reglages (« Espace professeur »). */
const DEBLOCAGE_DEFAUT = ["b-guerre-1914"];
const CLE_DEBLOCAGE = "epok.deblocage.v1";
let DEBLOCAGE = lireDeblocage();        // { ids:[...], maj:"ISO" | null, date:"AAAA-MM-JJ" | null }
const PROF = { enCours: false, message: null, lu: 0 };

function lireDeblocage(){
  try{
    const x = JSON.parse(localStorage.getItem(CLE_DEBLOCAGE));
    if(x && Array.isArray(x.ids) && x.maj) return x;
  }catch(e){}
  return { ids: DEBLOCAGE_DEFAUT.slice(), maj: null };
}
function retenirDeblocage(ids, date){
  DEBLOCAGE = { ids: ids.slice(), maj: new Date().toISOString(), date: date === undefined ? (DEBLOCAGE && DEBLOCAGE.date) || null : date };
  try{ localStorage.setItem(CLE_DEBLOCAGE, JSON.stringify(DEBLOCAGE)); }catch(e){}
}
function estProfesseur(){
  if(typeof compteConnecte !== "function" || !compteConnecte()) return false;
  const moi = (COMPTE.user.email || "").toLowerCase();
  return !!moi && (CONFIG_COMPTE.professeurs || []).some(a => String(a).toLowerCase() === moi);
}
/* Ouvert : pour le professeur connecte, ou pour tous par le serveur. */
function chapitreOuvert(id){ return estProfesseur() || DEBLOCAGE.ids.indexOf(id) >= 0; }
function ouvertAuxEleves(id){ return DEBLOCAGE.ids.indexOf(id) >= 0; }

function urlDeblocage(){
  return "https://firestore.googleapis.com/v1/projects/" + encodeURIComponent(CONFIG_COMPTE.projectId)
    + "/databases/(default)/documents/config/brevet";
}
/* Relit la liste sur le serveur (lecture publique, sans connexion). */
function chargerDeblocage(){
  if(typeof compteConfigure !== "function" || !compteConfigure() || typeof fetch !== "function") return Promise.resolve(false);
  PROF.lu = Date.now();
  return fetch(urlDeblocage() + "?key=" + encodeURIComponent(CONFIG_COMPTE.apiKey))
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if(!j || !j.fields) return false;
      const valeurs = ((j.fields.debloques || {}).arrayValue || {}).values || [];
      const ids = valeurs.map(v => v.stringValue).filter(Boolean);
      const dv = (j.fields.dateExamen || {}).stringValue;
      const date = /^\d{4}-\d{2}-\d{2}$/.test(dv || "") ? dv : null;
      const change = JSON.stringify(ids) !== JSON.stringify(DEBLOCAGE.ids) || date !== (DEBLOCAGE.date || null);
      retenirDeblocage(ids, date);
      if(change && ETAT.reglages.mode === "brevet" && !(QUIZ && !QUIZ.corrige) && !BCARTES && !(BFRISE && !BFRISE.verifie)) rendre();
      return true;
    }).catch(() => false);
}
/* Date de l'epreuve : fixee par le professeur pour tous (octobre 2026). */
function dateEpreuve(){ return (DEBLOCAGE && DEBLOCAGE.date) || null; }
/* Le professeur enregistre la nouvelle liste (ecriture reservee), et,
   s'il la donne, la date de l'epreuve. */
function enregistrerDeblocage(ids, date){
  PROF.enCours = true; PROF.message = null; majCarteProfesseur();
  /* Le serveur exige une adresse confirmee. Si le lien de confirmation a
     ete clique depuis la connexion, on relit le compte et on demande un
     jeton neuf, qui porte cette confirmation. */
  const u = COMPTE.user;
  const relu = (u.emailVerified === false && typeof u.reload === "function")
    ? u.reload().then(() => {
        if(!COMPTE.user.emailVerified) throw new Error("adresse pas encore confirmée : cliquez sur le lien reçu par e-mail à la création du compte (regardez dans vos spams), puis réessayez");
        return COMPTE.user.getIdToken(true);
      })
    : u.getIdToken();
  const avecDate = date !== undefined;
  const champs = { debloques: { arrayValue: { values: ids.map(s => ({ stringValue: s })) } },
                   maj: { timestampValue: new Date().toISOString() } };
  if(avecDate) champs.dateExamen = date ? { stringValue: date } : { nullValue: null };
  return relu.then(jeton => fetch(urlDeblocage()
    + "?updateMask.fieldPaths=debloques&updateMask.fieldPaths=maj" + (avecDate ? "&updateMask.fieldPaths=dateExamen" : ""), {
    method: "PATCH",
    headers: { "Authorization": "Bearer " + jeton, "Content-Type": "application/json" },
    body: JSON.stringify({ fields: champs })
  })).then(r => {
    if(r.status === 403) throw new Error("Firebase refuse l’écriture pour " + (COMPTE.user && COMPTE.user.email)
      + ". Vérifiez dans la console Firebase, Firestore, onglet Règles, que cette adresse y figure exactement, puis cliquez Publier");
    if(!r.ok) return r.json().catch(() => ({})).then(j => { throw new Error((j.error && j.error.message) || "réponse " + r.status); });
    retenirDeblocage(ids, avecDate ? date : undefined);
    PROF.message = "Enregistré : les élèves verront le changement à leur prochaine ouverture d’Epok.";
  }).catch(e => {
    PROF.message = "Échec de l’enregistrement : " + (e && e.message ? e.message : "erreur inconnue") + ".";
  }).finally(() => { PROF.enCours = false; majCarteProfesseur(); });
}

/* ---------- Acces aux donnees ---------- */

function modeBrevet(){ return ETAT.reglages.mode === "brevet"; }
/* Un chapitre = son entree dans BREVET (titre, place dans le programme)
   + sa fiche, si elle est redigee (FICHES_BREVET, fichiers z0f1 et z0f2). */
function tousChapitres(){
  const l = [];
  BREVET.forEach(t => t.chapitres.forEach(c =>
    l.push(Object.assign({ theme: t.theme, matiere: t.matiere }, c, FICHES_BREVET[c.id] || {}))));
  return l;
}
/* Redigees : toutes les fiches ecrites, ouvertes ou non (les points y
   restent acquis meme si le professeur referme un chapitre). Pretes :
   celles que l'eleve peut ouvrir. */
function chapitresRediges(){ return tousChapitres().filter(c => c.essentiel); }
function chapitresPrets(){ return chapitresRediges().filter(c => chapitreOuvert(c.id)); }
/* Le chapitre ouvert dont la fiche renvoie a ce cours (<< Pour aller plus
   loin >>) : en mode Brevet, la fiche du cours y ramene plutot qu'au
   catalogue, que l'eleve n'a jamais vu. */
/* Tous les chapitres, ouverts ou non, dont la fiche renvoie a ce cours :
   la fiche du cours le signale par une note. */
function chapitresAvecCours(coursId){
  return chapitresRediges().filter(c => (c.plusLoin || []).indexOf(coursId) >= 0);
}
function chapitrePourCours(coursId){
  return chapitresRediges().find(c => (c.plusLoin || []).indexOf(coursId) >= 0 && chapitreOuvert(c.id)) || null;
}
function chapitreParId(id){ return tousChapitres().find(c => c.id === id) || null; }
function etatChapitre(id){ return (ETAT.brevet.chapitres || {})[id] || {}; }
function ficheBrevet(id){
  if(!ETAT.brevet.chapitres[id]) ETAT.brevet.chapitres[id] = {};
  return ETAT.brevet.chapitres[id];
}
/* ---------- Validation d'un chapitre (octobre 2026) ----------
   Un chapitre se valide en deux fois. Une validation demande, dans un
   meme tour, un QCM a 10/10 ET la frise des reperes du chapitre sans
   faute (dans l'ordre que l'on veut). La seconde ne peut commencer que 24
   heures apres la premiere : on revient sur le chapitre un autre jour,
   ce qui ancre vraiment les connaissances. Deux validations : chapitre
   maitrise. Etat : validations = [ms, ms], tour = { qcm: ms, frise: ms }. */
const B_VALIDATIONS = 2, B_ECART = 24 * 3600 * 1000;
function validationsChapitre(id){ const v = etatChapitre(id).validations; return Array.isArray(v) ? Math.min(v.length, B_VALIDATIONS) : 0; }
function chapitreMaitrise(id){ return validationsChapitre(id) >= B_VALIDATIONS; }
/* Ancien nom, garde pour les ecrans et les statistiques : « reussi » veut
   desormais dire maitrise (2 validations sur 2). */
function chapitreReussi(id){ return chapitreMaitrise(id); }
/* Temps a attendre avant que le tour suivant compte (0 : tout de suite). */
function attenteValidation(id){
  const v = etatChapitre(id).validations || [];
  if(!v.length || v.length >= B_VALIDATIONS) return 0;
  return Math.max(0, v[v.length - 1] + B_ECART - Date.now());
}
function tourChapitre(id){ return etatChapitre(id).tour || {}; }
/* Une epreuve reussie (« qcm » ou « frise ») fait avancer le tour.
   Renvoie « etape », « valide », « attente » ou null (deja maitrise). */
function avancerValidation(id, epreuve){
  const f = ficheBrevet(id);
  const v = f.validations = Array.isArray(f.validations) ? f.validations : [];
  if(v.length >= B_VALIDATIONS) return null;
  if(attenteValidation(id) > 0) return "attente";
  const t = f.tour = f.tour || {};
  t[epreuve] = Date.now();
  if(t.qcm && t.frise){ v.push(Date.now()); f.tour = {}; return "valide"; }
  return "etape";
}
function dureeLisible(ms){
  const h = Math.ceil(ms / 3600000);
  return h >= 2 ? h + " h" : Math.max(1, Math.ceil(ms / 60000)) + " min";
}
/* Les deux points du chapitre : 0/2, 1/2, 2/2, d'un coup d'oeil. */
function pastilleValidation(id){
  const n = validationsChapitre(id);
  return `<span class="b-val n${n}" title="${n === 2 ? "Chapitre maîtrisé" : n + " validation" + (n > 1 ? "s" : "") + " sur 2"}"><i></i><i></i><b>${n}/2</b></span>`;
}
/* Ce que l'on dit apres une epreuve reussie. */
function messageValidation(id, res, epreuve){
  if(!res) return "";
  const n = validationsChapitre(id);
  if(res === "attente") return `Bravo&#8239;! La 2<sup>e</sup> validation de ce chapitre sera possible dans ${dureeLisible(attenteValidation(id))}&#8239;: 24 heures après la première, pour bien ancrer le cours.`;
  if(res === "valide") return n >= B_VALIDATIONS ? `<strong>Chapitre maîtrisé&#8239;: 2/2&#8239;!</strong>`
    : `<strong>Chapitre validé&#8239;: 1/2.</strong> Revenez dans 24 heures pour la 2<sup>e</sup> validation (QCM 10/10 et frise sans faute).`;
  return epreuve === "qcm" ? `QCM à 10/10 &#10003;. Il reste la frise des repères sans faute pour valider le chapitre.`
    : `Frise sans faute &#10003;. Il reste le QCM à 10/10 pour valider le chapitre.`;
}

/* ---------- Cartes memoire (systeme de Leitner) ----------
   Chaque notion, chaque acteur et chaque repere est une carte. Une carte
   sue monte d'une boite et revient plus tard ; une carte ratee retourne
   en boite 1 et revient le lendemain. Intervalles, en jours, par boite. */
const B_INTERVALLES = [0, 1, 2, 4, 8, 16];
const B_MAITRISE = 4;               // boite a partir de laquelle une carte est sue
const B_SEANCE_CARTES = 15;         // cartes par seance de revision

function cartesChapitre(ch){
  if(!ch || !ch.essentiel) return [];
  const l = [];
  ch.notions.forEach((n,k) => l.push({ cle: ch.id + "#n#" + k, sorte: "Notion", recto: n.terme, verso: n.def, chap: ch.id }));
  ch.acteurs.forEach((a,k) => l.push({ cle: ch.id + "#a#" + k, sorte: "Acteur", recto: a.nom, verso: a.role, chap: ch.id }));
  const sorte = estGeo(ch) ? "Lieu" : "Repère";
  ch.reperes.forEach((r,k) => l.push({ cle: ch.id + "#r#" + k, sorte, recto: r.ev, verso: r.date, chap: ch.id }));
  return l;
}
/* En geographie, les reperes sont des lieux : « date » porte le lieu. */
function estGeo(ch){ return !!ch && ch.matiere === "Géographie"; }
function toutesCartes(){ let l = []; chapitresPrets().forEach(c => { l = l.concat(cartesChapitre(c)); }); return l; }
function etatCarte(cle){ return (ETAT.brevet.cartes || {})[cle] || null; }
function carteSue(cle){ const e = etatCarte(cle); return !!(e && e.b >= B_MAITRISE); }
function carteDue(cle){ const e = etatCarte(cle); return !e || e.p <= aujourdhui(); }
function jourPlus(n){
  const d = new Date(aujourdhui() + "T12:00:00");
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function noterCarte(cle, su){
  const e = etatCarte(cle) || { b: 0 };
  const b = su ? Math.min(5, (e.b || 0) + 1) : 1;
  ETAT.brevet.cartes[cle] = { b, p: jourPlus(B_INTERVALLES[b]), d: aujourdhui() };   // d : derniere revue, pour le ruban de la semaine
}
/* Cartes a revoir aujourd'hui : les dues d'abord (boite la plus basse en
   tete), puis les nouvelles, dans la limite d'une seance. */
function cartesDues(chapId){
  const l = (chapId ? cartesChapitre(chapitreParId(chapId)) : toutesCartes()).filter(c => carteDue(c.cle));
  const vues = melanger(l.filter(c => etatCarte(c.cle))).sort((a,b) => etatCarte(a.cle).b - etatCarte(b.cle).b);
  const neuves = l.filter(c => !etatCarte(c.cle));
  return vues.concat(neuves);
}

/* ---------- Points ----------
   Fiche lue : 2 ; QCM du chapitre : 1, plus 3 par bonne reponse (le meme
   PTS_BONNE que le catalogue), plus 5 si sans-faute (meilleur score
   seulement). Ils s'ajoutent aux points du catalogue et font monter le
   meme rang. Les cartes memoire ne rapportent rien (octobre 2026) : on
   s'y declare soi-meme « su », ce serait des points trop faciles. */
const B_PTS_LUE = 2, B_PTS_QCM = 1, B_PTS_SANS_FAUTE = 5;
function pointsBrevet(){
  if(!ETAT.brevet) return 0;
  let p = 0;
  chapitresRediges().forEach(c => {
    const e = etatChapitre(c.id);
    if(e.lu) p += B_PTS_LUE;
    if(e.qcm && typeof e.qcm.meilleur === "number"){
      p += B_PTS_QCM + PTS_BONNE * e.qcm.meilleur;
      if(e.qcm.total > 0 && e.qcm.meilleur >= e.qcm.total) p += B_PTS_SANS_FAUTE;
    }
  });
  return p;
}

/* ---------- Quiz ---------- */

function construireQuizBrevet(chapId){
  const ch = chapitreParId(chapId);
  const items = ch.questions.map((q,i) => faireItem(chapId, "q", i, q));
  return { type:"b-qcm", coursId: chapId, seance:null, items: melanger(items), reponses:{}, corrige:false, resultat:null };
}

/* Entrainement aux reperes : dix questions au plus, tirees parmi les
   reperes des chapitres rediges, les moins bien sus d'abord. Une
   question demande la date d'un evenement, ou l'evenement d'une date ;
   les mauvaises reponses sont d'autres reperes de la meme matiere. En
   geographie, le lieu remplace la date. */
function construireQuizReperes(chapId){
  const tous = [];
  chapitresPrets().forEach(c => c.reperes.forEach((r,k) => tous.push({ r, k, c })));
  let pool = chapId ? tous.filter(x => x.c.id === chapId) : tous.slice();
  pool = melanger(pool).sort((a,b) => {
    const ea = etatCarte(a.c.id + "#r#" + a.k), eb = etatCarte(b.c.id + "#r#" + b.k);
    return (ea ? ea.b : 0) - (eb ? eb.b : 0);
  }).slice(0, 10);
  const items = pool.map(x => {
    const parDate = Math.random() < 0.5;
    const geo = estGeo(x.c);
    const autres = melanger(tous.filter(y => y.c.matiere === x.c.matiere && y.r.date !== x.r.date && y.r.ev !== x.r.ev)).slice(0, 3);
    const bon = parDate ? x.r.date : x.r.ev;
    const options = melanger([bon].concat(autres.map(y => parDate ? y.r.date : y.r.ev)));
    const q = {
      enonce: geo ? (parDate ? "Quel lieu correspond à : " + x.r.ev + " ?" : "Que faut-il savoir de : " + x.r.date + " ?")
                  : (parDate ? "Quelle est la date : " + x.r.ev + " ?" : "Quel événement correspond à la date : " + x.r.date + " ?"),
      options, correctes: [options.indexOf(bon)],
      explication: x.r.date + " : " + x.r.ev + " (" + x.c.titre + ")."
    };
    return faireItem(x.c.id, "r", x.k, q);
  });
  return { type:"b-reperes", coursId: chapId || null, seance:null, items, reponses:{}, corrige:false, resultat:null };
}

function titreQuizBrevet(q){
  if(q.type === "b-qcm") return tx(chapitreParId(q.coursId).titre) + " &#8212; QCM";
  return "Entraînement aux repères";
}

/* Appele par enregistrerResultat() pour les deux quiz du mode Brevet. */
function enregistrerBrevet(q, jour){
  if(q.type === "b-qcm"){
    const f = ficheBrevet(q.coursId);
    const e = f.qcm || {};
    const r = q.resultat;
    f.qcm = { date: jour, justes: r.justes, total: r.total,
              tentatives: (e.tentatives || 0) + 1, meilleur: Math.max(r.justes, e.meilleur || 0) };
    if(!f.lu) f.lu = jour;
    q.validation = r.total > 0 && r.justes >= r.total ? avancerValidation(q.coursId, "qcm") : null;
  }else if(q.type === "b-reperes"){
    q.resultat.details.forEach(d => noterCarte(d.it.coursId + "#r#" + d.it.index, d.juste));
  }
}

/* ---------- Seance de cartes memoire ---------- */

let BCARTES = null;   // { liste, i, montre, sues, revoir, ptsAvant, rangAvant }

function lancerCartes(chapId){
  const liste = cartesDues(chapId).slice(0, B_SEANCE_CARTES);
  if(!liste.length) return false;
  QUIZ = null;
  BCARTES = { liste, i: 0, montre: false, sues: 0, revoir: 0, ptsAvant: pointsTotal(), rangAvant: rangActuel().i, chap: chapId || null };

}

  </div>`);

    ? `<div class="rang-boutons"><button class="bouton" data-action="b-carte-revoir" style="flex:1">À revoir</button>

    : `<button class="bouton-plein" data-action="b-carte-montrer">${c.sorte === "Repère" ? "Voir la date" : c.sorte === "Lieu" ? "Voir le lieu" : "Voir la réponse"}</button>`);
  vue.innerHTML = parts.join("");

/* ---------- Frise a completer ----------
   Les reperes d'un chapitre (ou de tous) sur une frise verticale, dans
   l'ordre chronologique. Dans un sens, les dates sont posees et il faut
   y placer les evenements ; dans l'autre, l'inverse. On fait glisser une
   etiquette sur sa case, ou, plus sur sur un petit ecran, on la touche
   puis on touche la case. La correction met a jour les cartes des
   reperes, comme l'entrainement en QCM. En geographie, les reperes sont
   des lieux : l'exercice consiste a les associer, sans ordre chronologique. */
let BFRISE = null;   // { sens, chap, geo, cases, jetons, place, choisi, verifie, ptsAvant, rangAvant }
const B_FRISE_MAX = 6;

function anneeRepere(r){ const m = /\d{4}/.exec(r.date); return m ? Number(m[0]) : 0; }

function lancerFrise(chapId, sens, matiere){
  const pool = [];
  const ch = chapId ? chapitreParId(chapId) : null;
  const geo = ch ? estGeo(ch) : matiere === "Géographie";
  (ch ? [ch] : chapitresPrets().filter(c => estGeo(c) === geo)).forEach(c =>
    (c && c.reperes || []).forEach((r,k) => pool.push({ c: c.id, k, date: r.date, ev: r.ev, an: anneeRepere(r) })));
  const boite = x => { const e = etatCarte(x.c + "#r#" + x.k); return e ? e.b : 0; };
  const choisis = melanger(pool).sort((a,b) => boite(a) - boite(b)).slice(0, B_FRISE_MAX);
  if(!geo) choisis.sort((a,b) => a.an - b.an || (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  if(choisis.length < 2) return false;
  QUIZ = null; BCARTES = null;
  BFRISE = { sens: sens === "date" ? "date" : "ev", chap: chapId || null, geo, cases: choisis,
             jetons: melanger(choisis.map((x,i) => i)), place: {}, choisi: null, verifie: false,
             ptsAvant: pointsTotal(), rangAvant: rangActuel().i };
  return true;
}

function texteJeton(i){ const c = BFRISE.cases[i]; return BFRISE.sens === "ev" ? c.ev : c.date; }
function texteFixe(i){ const c = BFRISE.cases[i]; return BFRISE.sens === "ev" ? c.date : c.ev; }

/* Pose l'etiquette j sur la case i ; si elle etait deja ailleurs, elle
   en part, et ce qui occupait la case retourne dans la reserve. */
function poserJeton(i, j){
  const f = BFRISE;
  Object.keys(f.place).forEach(k => { if(f.place[k] === j) delete f.place[k]; });
  f.place[i] = j;
  f.choisi = null;
}

function rendreFrise(){
  const f = BFRISE, vue = document.getElementById("vue-quiz");
  const poses = new Set(Object.keys(f.place).map(k => f.place[k]));
  const parts = [`<div class="fil"><button class="bouton petit discret" data-action="b-frise-quitter">&#8592; Quitter</button></div>`];
  if(f.verifie){
    const justes = f.cases.filter((c,i) => f.place[i] === i).length;
    const g = pointsTotal() - f.ptsAvant;
    const avant = rangDe(f.ptsAvant, f.rangAvant), apres = rangActuel();
    parts.push(`<div class="score${justes === f.cases.length ? " parfait" : ""}">
      <div class="chiffre">${justes} / ${f.cases.length}</div>
      <p class="secondaire" style="margin:8px 0 0">${justes === f.cases.length ? "Toute la frise est juste&#8239;!"
        : "Les cases en rouge montrent la bonne réponse." + (f.chap ? " Il faut une frise sans faute pour valider le chapitre." : "")}</p></div>`);
    if(f.validation) parts.push(`<div class="carte b-val-avis">${pastilleValidation(f.chap)}<p style="margin:0">${messageValidation(f.chap, f.validation, "frise")}</p></div>`);
    if(g > 0) parts.push(`<div class="carte${apres.i > avant.i ? " maitrise" : ""} gain">${emblemeRang(apres.i, 46)}
      <div class="corps"><h3>${apres.i > avant.i ? "Rang supérieur&#8239;!" : "+" + g + " point" + (g > 1 ? "s" : "")}</h3>
      <p class="secondaire" style="margin:0">${apres.libelle} &#8226; ${pointsTotal().toLocaleString("fr-FR")} points</p></div></div>`);
  }else{
    parts.push(`<div class="carte"><p class="minuscule">${f.cases.length} repères</p>
      <h2 style="margin:4px 0 6px">${f.geo ? "Associer les lieux" : "Frise à compléter"}</h2>
      <p class="secondaire" style="margin:0">${f.geo
        ? (f.sens === "ev" ? "Associez à chaque lieu ce qu’il faut en savoir" : "Retrouvez le lieu de chaque description")
        : (f.sens === "ev" ? "Placez chaque événement à sa date" : "Placez chaque date sur son événement")}&#8239;:
        faites glisser l’étiquette sur ${f.geo ? "sa case" : "la frise"}, ou touchez-la puis touchez une case.</p></div>`);
  }
  parts.push(`<ol class="bq-frise${f.sens === "date" ? " par-date" : ""}${f.geo ? " lieux" : ""}">` + f.cases.map((c,i) => {
    const j = f.place[i];
    const etat = f.verifie ? (j === i ? " juste" : " faux") : "";
    return `<li class="${etat.trim()}"><span class="fixe">${tx(texteFixe(i))}</span>
      <button type="button" class="bq-case${j !== undefined ? " pleine" : ""}${etat}" data-action="b-frise-case" data-case="${i}"${
        f.verifie ? " disabled" : ""}>${f.verifie && j !== i
          ? `<span class="barre">${tx(texteJeton(j))}</span><span class="bq-bon">${tx(texteJeton(i))}</span>`
          : j !== undefined ? tx(texteJeton(j)) : "&#8230;"}</button></li>`;
  }).join("") + `</ol>`);
  if(!f.verifie){
    const reste = f.jetons.filter(j => !poses.has(j));
    parts.push(`<div class="bq-banque">${reste.length ? reste.map(j => `<button type="button" class="bq-jeton${
      f.choisi === j ? " choisi" : ""}" data-action="b-frise-jeton" data-jeton="${j}">${tx(texteJeton(j))}</button>`).join("")
      : `<p class="minuscule" style="margin:0">Tout est placé&#8239;: vérifiez&#8239;!</p>`}</div>`);
    parts.push(`<button class="bouton-plein" data-action="b-frise-verifier"${reste.length ? " disabled" : ""}>Vérifier</button>`);
  }else{
    parts.push(`<div class="rang-boutons" style="margin-top:16px">
      <button class="bouton-plein" data-action="b-frise" data-sens="${f.sens === "ev" ? "date" : "ev"}"${
        f.chap ? ` data-chap="${esc(f.chap)}"` : f.geo ? ` data-matiere="Géographie"` : ""} style="flex:1 1 100%">${
        f.geo ? "Nouvel exercice" : "Nouvelle frise"}</button>
      <button class="bouton" data-action="b-frise-quitter" style="flex:1 1 100%">Retour aux révisions</button></div>`);
  }
  vue.innerHTML = parts.join("");
}

function verifierFrise(){
  const f = BFRISE;
  if(!f || f.verifie || Object.keys(f.place).length < f.cases.length) return;
  f.verifie = true;
  let justes = 0;
  f.cases.forEach((c,i) => {
    const ok = f.place[i] === i;
    if(ok) justes++;
    noterCarte(c.c + "#r#" + c.k, ok);
    const cle = cleQuestion(c.c, "r", c.k);
    const st = ETAT.questions[cle] || { r: 0, j: 0 };
    if(ok) st.j = (st.j || 0) + 1; else st.r = (st.r || 0) + 1;
    ETAT.questions[cle] = st;
  });
  ETAT.historique.push({ d: aujourdhui(), type: "b-frise", coursId: f.chap, seance: null, justes, total: f.cases.length });
  f.validation = f.chap && justes === f.cases.length ? avancerValidation(f.chap, "frise") : null;
  if(ETAT.historique.length > 300) ETAT.historique = ETAT.historique.slice(-300);
  sauverEtat();
  rendreFrise();
  window.scrollTo(0, 0);
}

/* Glisser-deposer, au doigt comme a la souris (evenements « pointer »).
   Un simple toucher n'est pas un glisser : il reste un clic, que traite
   actionBrevet. */
(function(){
  if(typeof document === "undefined") return;
  let g = null;
  const nettoyer = () => document.querySelectorAll(".bq-case.survol").forEach(c => c.classList.remove("survol"));
  document.addEventListener("pointerdown", ev => {
    const j = ev.target.closest && ev.target.closest(".bq-jeton");
    if(!j || !BFRISE || BFRISE.verifie) return;
    g = { jeton: Number(j.dataset.jeton), x: ev.clientX, y: ev.clientY, el: j, fantome: null };
  });
  document.addEventListener("pointermove", ev => {
    if(!g) return;
    if(!g.fantome){
      if(Math.hypot(ev.clientX - g.x, ev.clientY - g.y) < 8) return;
      g.fantome = g.el.cloneNode(true);
      g.fantome.classList.add("fantome");
      document.body.appendChild(g.fantome);
      g.el.classList.add("parti");
    }
    g.fantome.style.left = ev.clientX + "px";
    g.fantome.style.top = ev.clientY + "px";
    nettoyer();
    const sous = document.elementFromPoint(ev.clientX, ev.clientY);
    const c = sous && sous.closest(".bq-case");
    if(c) c.classList.add("survol");
    ev.preventDefault();
  }, { passive: false });
  const finir = ev => {
    if(!g) return;
    const fin = g; g = null;
    if(!fin.fantome) return;
    fin.fantome.remove(); fin.el.classList.remove("parti"); nettoyer();
    const sous = ev.type === "pointerup" ? document.elementFromPoint(ev.clientX, ev.clientY) : null;
    const c = sous && sous.closest(".bq-case");
    if(c && BFRISE && !BFRISE.verifie) poserJeton(Number(c.dataset.case), fin.jeton);
    /* Le clic qui suit un glisser ne doit pas compter comme un toucher. */
    if(BFRISE){ BFRISE.sansClic = true; setTimeout(() => { if(BFRISE) BFRISE.sansClic = false; }, 0); }
    if(BFRISE) rendreFrise();
  };
  document.addEventListener("pointerup", finir);
  document.addEventListener("pointercancel", finir);
})();

/* Accueil du mode Brevet : compte a rebours, travail du jour, progression. */
function rendreAccueilBrevet(){
  const parts = [];
  const prets = chapitresPrets(), tous = tousChapitres();
  const dues = cartesDues().length;
  const cartes = toutesCartes(), sues = cartes.filter(c => carteSue(c.cle)).length;
  const lus = prets.filter(c => etatChapitre(c.id).lu).length;
  const reussis = prets.filter(c => chapitreMaitrise(c.id)).length;
  const moitie = prets.filter(c => validationsChapitre(c.id) === 1).length;
  /* Chapitre du jour : d'abord une 2e validation devenue possible, puis un
     tour deja commence, puis un chapitre neuf ; les chapitres qui
     attendent leurs 24 heures sont laisses de cote. */
  const libre = c => !chapitreMaitrise(c.id) && !attenteValidation(c.id);
  const commence = c => { const t = tourChapitre(c.id); return !!(t.qcm || t.frise); };
  const conseil = prets.find(c => libre(c) && validationsChapitre(c.id) === 1)
    || prets.find(c => libre(c) && commence(c)) || prets.find(c => libre(c) && etatChapitre(c.id).lu)
    || prets.find(libre) || null;
  const attente = prets.filter(c => attenteValidation(c.id) > 0).sort((a, b) => attenteValidation(a.id) - attenteValidation(b.id));
  const d = dateEpreuve();

  if(!STOCKAGE_OK) parts.push(`<div class="avis"><strong>Ce navigateur n’enregistre pas votre progression.</strong>
    Elle sera perdue en fermant la page.</div>`);

  parts.push(rappelCompte());
  /* Le Quiz of the Day en tete : un encart a part, qu'on ne peut pas manquer. */
  parts.push(carteQuizJour());
  /* Compte a rebours en tete quand la date est connue : c'est ce qui
     donne le rythme. Sinon, la date se demande plus bas, sans insister. */
  if(d && d >= aujourdhui()){
    const j = Math.round((new Date(d + "T12:00:00") - new Date(aujourdhui() + "T12:00:00")) / 864e5);
    /* Le rythme se calcule sur tout le programme, chapitres a venir
       compris : c'est l'epreuve entiere qu'il faut preparer. */
    const reste = tous.filter(c => !chapitreMaitrise(c.id)).length;
    const jours = j - 7;
    const rythme = jours <= 0 || !reste ? ""
      : jours >= reste ? (Math.floor(jours / reste) === 1 ? "environ un par jour"
                          : "environ un tous les " + Math.floor(jours / reste) + " jours")
      : "environ " + Math.ceil(reste / jours) + " par jour";
    parts.push(filet("Brevet d’histoire-géographie"));

        action: `data-action="b-qcm" data-chap="${esc(conseil.id)}"`, bouton: e.qcm ? "Refaire le QCM" : "Faire le QCM" },
      { fait: !!t.frise, titre: geoC ? "Lieux associés sans faute" : "Frise des repères sans faute",
        detail: "Obligatoire pour valider le chapitre.",
        action: `data-action="b-frise" data-chap="${esc(conseil.id)}"`, bouton: geoC ? "Associer les lieux" : "Compléter la frise" },

/* Actions propres au mode Brevet. Renvoie vrai si l'action est traitee. */
function actionBrevet(a, el){
  if(a === "mode"){
    ETAT.reglages.mode = el.dataset.mode === "brevet" ? "brevet" : "culture";
    QUIZ = null; BCARTES = null; BFRISE = null; ECRAN = { nom:"catalogue" };
    sauverEtat(); aller("accueil");
    return true;
  }
  if(a.slice(0, 2) !== "b-") return false;
  if(typeof actionStats === "function" && actionStats(a, el)) return true;
  const chap = el.dataset.chap;
  if(a === "b-fiche"){ ECRAN = { nom:"b-fiche", coursId: chap }; aller("cours"); }
  else if(a === "b-lue"){ ficheBrevet(chap).lu = aujourdhui(); sauverEtat(); rendre(); }
  else if(a === "b-qcm" || a === "b-qcm-choisi"){
    const id = a === "b-qcm" ? chap : document.getElementById("b-sel-chap").value;
    BCARTES = null; BFRISE = null; QUIZ = construireQuizBrevet(id); aller("quiz");
  }
  else if(a === "b-reperes"){ BCARTES = null; BFRISE = null; QUIZ = construireQuizReperes(chap || null); aller("quiz"); }
  else if(a === "b-cartes"){ BFRISE = null; if(lancerCartes(chap || null)) aller("quiz"); }
  else if(a === "b-carte-montrer"){ BCARTES.montre = true; rendreCartesBrevet(); }
  else if(a === "b-carte-sue" || a === "b-carte-revoir"){
    const su = a === "b-carte-sue";
    noterCarte(BCARTES.liste[BCARTES.i].cle, su);
    if(su) BCARTES.sues++; else BCARTES.revoir++;
    BCARTES.i++; BCARTES.montre = false;
    sauverEtat(); rendreCartesBrevet();
  }
  else if(a === "b-cartes-quitter"){ BCARTES = null; aller("quiz"); }
  else if(a === "b-prof-verif-envoyer"){
    const u = COMPTE.user; if(!u || PROF.enCours) return true;
    PROF.enCours = true; PROF.message = null; majCarteProfesseur();
    u.sendEmailVerification().then(() => { PROF.message = "E-mail de confirmation envoyé à " + u.email + ". Regardez dans vos spams, cliquez sur le lien qu’il contient, puis sur « J’ai cliqué sur le lien »."; },
      e => { PROF.message = "Échec de l’envoi : " + (typeof messageErreurCompte === "function" ? messageErreurCompte(e) : (e && e.message)); })
      .finally(() => { PROF.enCours = false; majCarteProfesseur(); });
  }
  else if(a === "b-prof-verif-relire"){
    const u = COMPTE.user; if(!u || PROF.enCours) return true;
    PROF.enCours = true; PROF.message = null; majCarteProfesseur();
    u.reload().then(() => COMPTE.user.getIdToken(true)).then(() => {
      PROF.message = COMPTE.user.emailVerified ? "Adresse confirmée : vous pouvez ouvrir les chapitres."
        : "Échec : l’adresse n’est pas encore confirmée. Ouvrez le lien de l’e-mail, puis réessayez.";
    }, e => { PROF.message = "Échec : " + (e && e.message ? e.message : "erreur inconnue") + "."; })
      .finally(() => { PROF.enCours = false; majCarteProfesseur(); });
  }
  else if(a === "b-prof-bascule"){
    if(!estProfesseur() || PROF.enCours) return true;
    const ids = DEBLOCAGE.ids.filter(x => x !== chap);
    if(!ouvertAuxEleves(chap)) ids.push(chap);
    const ordre = tousChapitres().map(c => c.id);
    ids.sort((x, y) => ordre.indexOf(x) - ordre.indexOf(y));
    enregistrerDeblocage(ids);
  }
  else if(a === "b-frise"){
    const sens = el.dataset.sens || (Math.random() < 0.5 ? "ev" : "date");
    if(lancerFrise(chap || null, sens, el.dataset.matiere)) aller("quiz");
  }
  else if(a === "b-frise-jeton"){
    if(!BFRISE || BFRISE.sansClic) return true;
    const j = Number(el.dataset.jeton);
    BFRISE.choisi = BFRISE.choisi === j ? null : j;
    rendreFrise();
  }
  else if(a === "b-frise-case"){
    if(!BFRISE || BFRISE.sansClic || BFRISE.verifie) return true;
    const i = Number(el.dataset.case);
    if(BFRISE.choisi !== null) poserJeton(i, BFRISE.choisi);
    else if(BFRISE.place[i] !== undefined) delete BFRISE.place[i];   /* toucher une case pleine la vide */
    rendreFrise();
  }
  else if(a === "b-frise-verifier"){ verifierFrise(); }
  else if(a === "b-frise-quitter"){ BFRISE = null; aller("quiz"); }
  else if(a === "b-prof-date"){
    if(!estProfesseur() || PROF.enCours) return true;
    const v = (document.getElementById("b-prof-date") || {}).value || "";
    enregistrerDeblocage(DEBLOCAGE.ids.slice(), /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null);
  }
  else return false;
  return true;
}
/* ======================================================================
   COMPTE GOOGLE ET SYNCHRONISATION (octobre 2026)

   La progression vit dans le telephone (localStorage). Un compte la copie
   sur un serveur, pour la retrouver apres une reinstallation, un
   changement de telephone, ou sur la version web. Le serveur est un
   projet Firebase (Google) : Firebase Authentication pour la connexion
   Google, Cloud Firestore pour garder, par eleve, un seul document qui
   contient sa progression. Les regles de securite (serveur/firestore.rules)
   ne laissent chacun lire et ecrire que le sien.

   La configuration du projet est dans config-compte.js, a cote de la
   page (window.EPOK_COMPTE). Tant qu'elle est vide, rien de tout cela
   n'apparait et la bibliotheque Firebase n'est meme pas chargee :
   l'application fonctionne exactement comme avant, sans reseau.

   Fusion. Tout dans la progression ne fait que croitre : une seance lue
   le reste, un meilleur score ne baisse pas, une carte sue ne s'oublie
   pas. Quand le telephone et le serveur divergent (deux appareils, une
   seance faite hors ligne), on garde donc le meilleur des deux, champ par
   champ, et rien ne se perd. Les reglages (theme, taille, mode) restent
   propres a chaque appareil et ne sont pas envoyes.

   Connexion. Sur la version web, une fenetre Google s'ouvre par-dessus la
   page (signInWithPopup). Dans l'APK, Google refuse de s'ouvrir dans un
   WebView : l'application ouvre dans le navigateur du telephone la page
   connexion.html de la version web, qui fait la connexion et renvoie le
   jeton Google par le lien fr.epok.histoire://auth ; l'application le rend
   a la page (compteRetour), qui ouvre la session avec ce jeton.

   On peut aussi creer un compte avec une adresse e-mail et un mot de
   passe, ce qui marche partout, APK compris, sans passer par le
   navigateur. Le mot de passe n'est jamais vu par Epok au-dela de la
   saisie : Firebase le garde (hache) et gere seul la reinitialisation,
   en envoyant un lien sur l'adresse du compte (« mot de passe oublie »).

   Le compte est obligatoire : des que le serveur est configure, un ecran
   demande, juste apres le choix du mode, de creer un compte ou de se
   connecter, et revient tant que l'on n'est pas connecte (apres une
   deconnexion par exemple).
   ====================================================================== */

/* Configuration Firebase (apiKey, authDomain, projectId, appId) : des
   valeurs publiques par nature, ce sont les regles de securite du serveur
   qui protegent les donnees. */
const CONFIG_COMPTE = Object.assign({ apiKey: "", authDomain: "", projectId: "", appId: "" },
  (typeof window !== "undefined" && window.EPOK_COMPTE) || {});
const PAGE_CONNEXION = "https://thot-boomerang.github.io/epok/connexion.html";
const DELAI_SYNCHRO = 1500;    // ms entre une sauvegarde et l'envoi

const COMPTE = {
  auth: null,          // service d'authentification Firebase
  user: null,          // utilisateur connecte, ou null
  enCours: false,      // une synchronisation tourne
  encore: false,       // une sauvegarde est arrivee pendant ce temps
  minuteur: null,
  derniere: null,      // Date de la derniere synchronisation reussie
  erreur: null,        // message lisible, ou null
  retours: [],         // retours de connexion arrives avant l'initialisation
  etaitProf: false,    // le compte connecte etait-il celui du professeur
  etatConnu: false,    // Firebase a-t-il dit si une session etait ouverte
  forme: "creer",      // formulaire : "creer" | "connexion" | "oubli"
  email: "",           // adresse saisie, gardee d'un affichage a l'autre
  nom: "",             // prenom et nom saisis a la creation du compte
  classe: "",          // classe saisie a la creation du compte (facultatif)
  info: null,          // message de reussite (e-mail envoye...)
  attente: false       // une demande au serveur est en cours
};
const MDP_MIN = 8;

function compteConfigure(){ return !!(CONFIG_COMPTE.apiKey && CONFIG_COMPTE.projectId); }
function compteDisponible(){ return !!COMPTE.auth; }
function compteConnecte(){ return !!COMPTE.user; }

/* ---------- Fusion de deux progressions ---------- */

function plusTot(a, b){ return !a ? (b || null) : !b ? a : (a < b ? a : b); }
function copie(x){ return x === undefined ? undefined : JSON.parse(JSON.stringify(x)); }

/* Fusion d'une note : seance ({ lu, date, justes, total, tentatives,
   meilleur }), epreuve, grand quiz, QCM de chapitre. La lecture garde sa
   date la plus ancienne ; le dernier passage est celui dont la date est
   la plus recente ; le meilleur score et le nombre d'essais, le plus
   grand des deux. */
function fusionnerNote(a, b){
  const oa = a && typeof a === "object", ob = b && typeof b === "object";
  if(!oa) return ob ? copie(b) : (a || b || null);
  if(!ob) return copie(a);
  const r = Object.assign({}, copie(b), copie(a));
  if("lu" in a || "lu" in b) r.lu = plusTot(a.lu, b.lu);
  const qa = typeof a.justes === "number", qb = typeof b.justes === "number";
  if(qa || qb){
    const recent = !qb ? a : !qa ? b : ((b.date || "") > (a.date || "") ? b : a);
    r.date = recent.date; r.justes = recent.justes; r.total = recent.total;
    const m = x => typeof x.justes === "number" ? Math.max(x.justes, x.meilleur || 0) : (x.meilleur || 0);
    r.meilleur = Math.max(m(a), m(b));
    r.tentatives = Math.max(a.tentatives || 0, b.tentatives || 0) || 1;
    /* QCM de seance : un sans-faute acquis d'un cote l'est pour les deux. */
    if(typeof a.parfait === "boolean" || typeof b.parfait === "boolean") r.parfait = a.parfait === true || b.parfait === true;
    if("qj" in a || "qj" in b) r.qj = Math.max(a.qj || 0, b.qj || 0);
  }
  return r;
}

function cles(a, b){ return Array.from(new Set(Object.keys(a || {}).concat(Object.keys(b || {})))); }

function fusionnerCours(a, b){
  const r = {};
  cles(a, b).forEach(id => {
    const x = (a || {})[id] || {}, y = (b || {})[id] || {};
    const f = Object.assign({}, copie(y), copie(x));
    f.seances = {};
    cles(x.seances, y.seances).forEach(n => { f.seances[n] = fusionnerNote((x.seances || {})[n], (y.seances || {})[n]); });
    f.termine = plusTot(x.termine, y.termine);
    if(x.maitrise || y.maitrise) f.maitrise = plusTot(x.maitrise, y.maitrise);
    if(x.epreuve || y.epreuve) f.epreuve = fusionnerNote(x.epreuve, y.epreuve);
    if(x.grand || y.grand) f.grand = fusionnerNote(x.grand, y.grand);
    if(x.giga || y.giga){
      /* Le giga garde le passage qui rapporte le plus, pas le plus recent. */
      const ga = x.giga, gb = y.giga;
      const mieux = !ga ? gb : !gb ? ga : (ptsGiga(gb) > ptsGiga(ga) ? gb : ga);
      f.giga = Object.assign({}, copie(mieux),
        { tentatives: Math.max((ga || {}).tentatives || 0, (gb || {}).tentatives || 0) });
    }
    r[id] = f;
  });
  return r;
}

/* Fusionne la progression distante dans la locale. Les deux ont deja ete
   validees par fusionnerEtat. Renvoie un nouvel etat ; les reglages sont
   ceux de l'appareil. */
function fusionnerProgressions(local, distant){
  const r = copie(local);
  r.cours = fusionnerCours(local.cours, distant.cours);

  const vus = new Set(), h = [];
  (local.historique || []).concat(distant.historique || []).forEach(x => {
    const k = JSON.stringify([x.d, x.type, x.coursId, x.seance, x.justes, x.total]);
    if(!vus.has(k)){ vus.add(k); h.push(copie(x)); }
  });
  h.sort((x, y) => (x.d || "") < (y.d || "") ? -1 : (x.d || "") > (y.d || "") ? 1 : 0);
  r.historique = h.slice(-300);

  r.questions = {};
  cles(local.questions, distant.questions).forEach(k => {
    const x = (local.questions || {})[k] || {}, y = (distant.questions || {})[k] || {};
    r.questions[k] = { r: Math.max(x.r || 0, y.r || 0), j: Math.max(x.j || 0, y.j || 0) };
  });

  r.verifies = Object.assign({}, copie(distant.verifies || {}), copie(local.verifies || {}));
  r.dernier = local.dernier || copie(distant.dernier) || null;
  r.palierMax = Math.max(local.palierMax || 0, distant.palierMax || 0);
  /* Visites : par jour, le plus grand des deux comptes (deux appareils
     ne s'additionnent pas, pour ne pas compter deux fois une ouverture). */
  const lv = local.visites || {}, dv = distant.visites || {};
  r.visites = {};
  cles(lv, dv).forEach(k => { r.visites[k] = Math.max(lv[k] || 0, dv[k] || 0); });
  if(typeof nettoyerVisites === "function") r.visites = nettoyerVisites(r.visites);
  r.classe = local.classe || distant.classe || "";
  if(typeof fusionnerQuotidien === "function")
    r.quotidien = nettoyerQuotidien(fusionnerQuotidien(local.quotidien, distant.quotidien));
  if(typeof fusionnerSemainesQJ === "function")
    r.qjSemaines = nettoyerSemainesQJ(fusionnerSemainesQJ(local.qjSemaines, distant.qjSemaines));

  r.collection = fusionnerCollection(local.collection, distant.collection);

  const lb = local.brevet || {}, db = distant.brevet || {};
  r.brevet = { chapitres: {}, cartes: {}, dateExamen: lb.dateExamen || db.dateExamen || null };
  cles(lb.chapitres, db.chapitres).forEach(id => {
    const x = (lb.chapitres || {})[id] || {}, y = (db.chapitres || {})[id] || {};
    const c = {};
    if(x.lu || y.lu) c.lu = plusTot(x.lu, y.lu);
    if(x.qcm || y.qcm) c.qcm = fusionnerNote(x.qcm, y.qcm);
    /* Validations : on garde l'appareil qui en a le plus (a egalite, la
       plus ancienne) ; le tour en cours suit le meme appareil, complete
       par l'autre s'ils en sont au meme point. */
    const vx = Array.isArray(x.validations) ? x.validations : [], vy = Array.isArray(y.validations) ? y.validations : [];
    if(vx.length || vy.length){
      const prendX = vx.length > vy.length || (vx.length === vy.length && (vx[0] || 0) <= (vy[0] || 0));
      c.validations = (prendX ? vx : vy).slice(0, 2);
    }
    const tx2 = x.tour || {}, ty2 = y.tour || {};
    const tour = vx.length === vy.length ? { qcm: Math.max(tx2.qcm || 0, ty2.qcm || 0), frise: Math.max(tx2.frise || 0, ty2.frise || 0) }
      : (vx.length > vy.length ? tx2 : ty2);
    if(tour.qcm || tour.frise) c.tour = { qcm: tour.qcm || 0, frise: tour.frise || 0 };
    r.brevet.chapitres[id] = c;
  });
  /* Une carte garde la boite la plus haute ; a boite egale, le prochain
     passage le plus lointain. */
  cles(lb.cartes, db.cartes).forEach(k => {
    const x = (lb.cartes || {})[k], y = (db.cartes || {})[k];
    r.brevet.cartes[k] = copie(!x ? y : !y ? x
      : (y.b > x.b || (y.b === x.b && (y.p || "") > (x.p || ""))) ? y : x);
  });
  return r;
}

/* Ce qui part sur le serveur : la progression, sans les reglages. */
function progressionAEnvoyer(){
  const e = copie(ETAT);
  delete e.reglages;
  /* Le nom et l'adresse voyagent avec la progression : le professeur
     reconnait ainsi ses eleves dans ses statistiques. */
  if(compteConnecte()) e.profil = { email: COMPTE.user.email || "", nom: (COMPTE.user.displayName || "").trim() };
  return e;
}

/* Charge la bibliotheque Firebase (app, puis authentification) quand un
   projet est configure et qu'elle n'est pas deja la. */
function chargerScript(src){
  return new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = ko;
    document.head.appendChild(s);
  });
}

function compteInit(){
  if(COMPTE.auth || !compteConfigure()) return;
  const pret = (window.firebase && window.firebase.auth) ? Promise.resolve()
    : chargerScript("vendor/firebase-app-compat.js").then(() => chargerScript("vendor/firebase-auth-compat.js"));
  pret.then(() => {
    const fb = window.firebase;
    const app = (fb.apps || []).find(a => a.name === "epok") || fb.initializeApp(CONFIG_COMPTE, "epok");
    COMPTE.auth = app.auth();
    COMPTE.auth.languageCode = "fr";   /* e-mails de Firebase en francais */
    COMPTE.auth.onAuthStateChanged(u => {
      const avant = compteConnecte();
      COMPTE.user = u || null;
      COMPTE.etatConnu = true;
      if(u) cacherEcranCompte();
      else if(doitProposerCompte()) afficherEcranCompte();
      if(compteConnecte() && !avant) synchroniser();
      if(!compteConnecte()) COMPTE.derniere = null;
      majVuesCompte();
    });
    /* De retour en ligne : on rattrape ce qui n'a pas pu partir. */
    window.addEventListener("online", () => { if(compteConnecte()) planifierSynchro(500); });
    /* Appareils toujours d'accord : on relit le serveur des qu'on revient
       sur l'application (retour au premier plan, focus, reprise de l'APK)
       et toutes les 15 secondes tant qu'elle est ouverte ; on envoie sans
       attendre en la quittant. Les points sont deduits de la progression,
       donc fusionner la progression suffit a les rendre identiques. */
    const rattraper = () => { if(compteConnecte() && !document.hidden) synchroniser(); };
    document.addEventListener("visibilitychange", () => { if(document.hidden){ if(compteConnecte()) synchroniser(); } else rattraper(); });
    window.addEventListener("focus", rattraper);
    window.addEventListener("pageshow", rattraper);
    window.epokReprise = rattraper;
    window.epokSynchro = () => { if(compteConnecte()) synchroniser(); };
    setInterval(rattraper, 15000);
    COMPTE.retours.splice(0).forEach(compteRetour);
    majVuesCompte();
  }).catch(e => console.warn("Epok : compte indisponible.", e));
}

/* L'application Android rend ici l'adresse de retour de la connexion :
   fr.epok.histoire://auth?id_token=..., ou ?error=... */
function compteRetour(adresse){
  if(!COMPTE.auth){ COMPTE.retours.push(adresse); return; }
  let jeton = null, erreur = null;
  try{
    const u = new URL(adresse);
    jeton = u.searchParams.get("id_token");
    erreur = u.searchParams.get("error");
  }catch(e){ erreur = "adresse de retour illisible"; }
  if(!jeton){
    COMPTE.erreur = "Connexion interrompue" + (erreur ? " : " + erreur : ".");
    majVuesCompte();
    return;
  }
  const cred = window.firebase.auth.GoogleAuthProvider.credential(jeton);
  COMPTE.auth.signInWithCredential(cred).catch(e => {
    COMPTE.erreur = "Connexion refusée : " + (e && e.message ? e.message : "erreur inconnue");
    majVuesCompte();
  });
}
if(typeof window !== "undefined") window.compteRetour = compteRetour;

function connexionGoogle(){
  if(!compteDisponible()) return;
  COMPTE.erreur = null;
  const pont = window.PontEpok;
  if(pont && typeof pont.ouvrirNavigateur === "function"){
    pont.ouvrirNavigateur(PAGE_CONNEXION + "?appli=1");
    return;
  }
  const fournisseur = new window.firebase.auth.GoogleAuthProvider();
  COMPTE.auth.signInWithPopup(fournisseur).catch(e => {
    const code = e && e.code;
    if(code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment"){
      COMPTE.auth.signInWithRedirect(fournisseur);
      return;
    }
    if(code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") return;
    COMPTE.erreur = "Connexion impossible : " + (e && e.message ? e.message : "erreur inconnue");
    majVuesCompte();
  });
}
