  .onglets{justify-content:center}
  .onglets button{max-width:200px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}

/* ---------- Cartes EPOK (z0l_cartes.js) ---------- */
/* Cinq onglets : des libelles un peu plus serres. */
.onglets button{font-size:10.5px;letter-spacing:.06em}
@media (max-width:359px){ .onglets button{font-size:9.5px;letter-spacing:.02em} }
.pli-carte{text-align:center}
.pli-ferme{position:relative;display:block;margin:14px auto 10px;padding:0;border:0;background:none;cursor:pointer;width:170px;height:120px}
.pli-lueur{position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,var(--rar) 0%,transparent 62%);

.pli-papier::before{content:"";position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(#e8d6ab,#cdb27a);

  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--rar) 55%,#fff),var(--rar) 55%,color-mix(in srgb,var(--rar) 55%,#000));

.pli-papier.grand{width:230px;height:152px}

.pli-texte{margin:4px 0 12px;color:var(--texte-2)}
.pli-jour{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto}
.c-mini{position:relative;display:block;padding:0;border:0;background:#1a1612;cursor:pointer;aspect-ratio:9/20;border-radius:8px;

.c-cadre{position:relative;display:block;width:100%;height:100%}
.c-img{display:block;width:100%;height:100%;object-fit:cover}
.c-repli{display:none}
.c-cadre.sans-image .c-img{display:none}
.c-cadre.sans-image .c-repli{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;

  font-family:var(--police-titre);line-height:1.15}
.c-cadre.sans-image .c-repli b{font-size:12px}.c-cadre.sans-image .c-repli small{font-size:10.5px;opacity:.85}
/* Nombre d'exemplaires : petite bulle jaune, chiffre noir (a partir de 2),
   en bas a droite pour ne pas cacher les PV. */
.c-nb{position:absolute;bottom:4px;right:4px;min-width:22px;padding:1px 6px;border-radius:999px;background:#f7cf3d;color:#111;
  font:800 12px/1.35 var(--police-ecran);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.45)}
.c-nb.en-ligne{position:static;display:inline-block;vertical-align:middle}
/* Carte pas encore trouvee (vue « toutes ») : grisee, non cliquable. */
.c-grise{cursor:default;box-shadow:0 0 0 1.5px rgba(128,128,128,.55)}
.c-grise .c-img{filter:grayscale(1) brightness(.75);opacity:.45}
.album-vues{display:flex;gap:0;margin:2px 0 8px;border:1.5px solid var(--bordeaux);border-radius:999px;overflow:hidden}
.album-vues button{flex:1;padding:8px 6px;border:0;background:transparent;color:var(--bordeaux);font:700 12.5px var(--police-titre);
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.album-vues button[aria-pressed="true"]{background:var(--bordeaux);color:#fff}
/* Tampon « Deja tiree » : en plein milieu de la carte, a l'ouverture. */
.c-tampon{position:absolute;left:50%;top:46%;z-index:3;padding:6px 14px;transform:translate(-50%,-50%) rotate(-14deg);
  border:4px double #c21f2b;border-radius:8px;color:#c21f2b;background:rgba(255,250,240,.82);
  font:800 clamp(20px,6.5vw,30px)/1 var(--police-titre);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
  box-shadow:0 2px 10px rgba(0,0,0,.35);animation:tampon .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes tampon{from{transform:translate(-50%,-50%) rotate(-14deg) scale(2.4);opacity:0}to{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:1}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:9px}
.album-chiffres{margin:0 0 6px}
.album-filtres .st-puce{border-color:var(--rar,var(--laiton))}
.fenetre-carte{text-align:center}
.c-grande{display:block;width:min(74vw,330px);aspect-ratio:9/20;max-height:72vh;margin:6px auto 0;border-radius:14px;overflow:hidden;
  box-shadow:0 0 0 2px var(--rar),0 0 26px color-mix(in srgb,var(--rar) 60%,transparent)}
.c-grande .c-img{object-fit:contain;background:#15110d}
/* L'ouverture du pli, en plein ecran. */
body.ouv-active{overflow:hidden}
.ouv{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;color:#f6efe2;user-select:none;-webkit-user-select:none;
  background:#090706;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--rar) 32%,#0b0908) 0%,#060505 72%);
  transition:background .6s}
.ouv-passer{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:3;color:#f6efe2;border-color:rgba(246,239,226,.4)}
.ouv-scene{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  perspective:1300px;overflow:hidden;padding:56px 16px 24px}
.ouv-pli{position:relative;cursor:pointer}
.ouv-pli .pli-lueur.grande{inset:-60%}
.ouv-pli.casse{animation:pli-casse .6s cubic-bezier(.5,0,.75,0) forwards}
@keyframes pli-casse{40%{transform:scale(1.12)}100%{transform:scale(.2);opacity:0}}
.ouv-consigne{margin:46px 0 0;font:600 15px var(--police-titre);letter-spacing:.12em;text-transform:uppercase;opacity:.8;animation:pli-lueur 1.2s ease-in-out infinite alternate}

.ouv-carte{position:relative;height:min(64vh,138vw);aspect-ratio:9/20;transform-style:preserve-3d;
  transition:transform var(--duree,400ms) cubic-bezier(.3,.7,.2,1),opacity .5s;z-index:2}
.ouv-carte.cachee{opacity:0;transform:scale(.55)}
.ouv-carte.tournee{transform:rotateY(180deg)}
.ouv-face{position:absolute;inset:0;border-radius:14px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ouv-dos{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#3a1418,#120a0a 75%);
  border:3px solid var(--rar);box-shadow:0 0 34px color-mix(in srgb,var(--rar) 55%,transparent);font:700 30px var(--police-titre);letter-spacing:.2em;color:#d9b45a}
.ouv-recto{transform:rotateY(180deg);background:#15110d;box-shadow:0 0 40px color-mix(in srgb,var(--rar) 65%,transparent)}
.ouv-recto .c-img{object-fit:contain}
.holo.revelee .ouv-recto::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.55;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 44%,rgba(255,120,210,.35) 50%,rgba(110,220,255,.4) 56%,transparent 70%);
  background-size:260% 100%;animation:holo 2.6s linear infinite}
@keyframes holo{from{background-position:130% 0}to{background-position:-130% 0}}
.ouv-faisceaux{position:absolute;inset:-60%;z-index:0;opacity:.6;animation:faisceaux 7s linear infinite;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rar) 60%,transparent) 0 5deg,transparent 5deg 22deg);
  -webkit-mask-image:radial-gradient(circle,#000 12%,transparent 58%);mask-image:radial-gradient(circle,#000 12%,transparent 58%)}
@keyframes faisceaux{to{transform:rotate(360deg)}}

.ouv-decoupe{display:block;margin:0 auto 14px;background-repeat:no-repeat;border-radius:8px;

<!-- Charte et taille du texte appliquees AVANT le premier affichage :
     lues ici, elles evitent le clignotement d'une page claire qui
     passerait en veillee une fois le script principal charge. Le bloc
     est volontairement minuscule et tolerant a l'echec : un navigateur
     qui refuse localStorage affiche simplement la charte par defaut. -->
<script>
(function(){
  try{
    var r = JSON.parse(localStorage.getItem("epok.progression.v1") || "{}");
    var g = (r && r.reglages) || {};
    if(g.theme === "clair" || g.theme === "sombre"){
      document.documentElement.setAttribute("data-theme", g.theme);
    }
    if(typeof g.echelle === "number" && g.echelle >= 0.85 && g.echelle <= 1.3){
      document.documentElement.style.setProperty("--echelle", g.echelle);
    }
    if(g.police === "papier" || g.police === "ecran"){
      document.documentElement.setAttribute("data-police", g.police);
    }
  }catch(e){ /* charte par defaut */ }
})();
</script>

<!-- Filet d'or du defilement : visible seulement pendant la lecture
     d'une seance (body[data-lecture="1"]). -->
<div id="jauge-lecture" aria-hidden="true"></div>

<div class="app">

<script>
"use strict";
/* =====================================================================
   3. CONTENU PEDAGOGIQUE
   ---------------------------------------------------------------------
   Tout le contenu vit ici, separe de la logique. Pour ajouter un cours,
   il suffit de coller un objet supplementaire dans le tableau COURS, en
   respectant exactement ce gabarit :

   {
     id: "identifiant-unique-sans-espace",
     titre: "Titre du cours",
     periode: "Le monde bipolaire (1945-1991)",   // doit figurer dans PERIODES
     theme: "La guerre froide (1947-1991)",       // le << nom >> d'un THEMES
                                  // voir plus bas les REGLES DE CLASSEMENT
     dates: "1919-1939",
     note: "",                    // facultatif : precision affichee en gris
     problematique: "Une phrase.",
     sources: [ "Auteur, Titre, editeur, annee", ... ],   // 3 a 5
     seances: [                   // EXACTEMENT 6
       {
         numero: 1,
         titre: "Titre de la seance",
         problematique: "Une phrase.",
         contenu: ` ... HTML simple : h3, p, ul, strong, blockquote,
                    un <table> quand des chiffres se comparent mieux
                    alignes, et une <figure class="croquis"> quand un
                    trace vaut mieux qu'une phrase ... `,
         anecdote: ` ... HTML simple, jamais evalue ... `,
         questions: [             // EXACTEMENT 5
           {
             enonce: "...",
             options: ["...","...","...","..."],   // exactement 4
             correctes: [0,2],                     // 1 a 4 indices
             explication: "2 a 3 phrases renvoyant au mecanisme du cours."
           }, ...
         ]
       }, ...
     ]
   }

   Conventions de redaction :
   - notions cles en <strong>, dates et acteurs precis ;
   - 3 ou 4 parties titrees (h3) : causes, mecanismes, consequences ;
   - un paragraphe final << Fil rouge >> qui annonce la seance suivante ;
   - anecdote vraie et verifiable ; si elle releve de la legende, le dire ;
   - tout chiffre est source : estimation attribuee a son auteur ou
     fourchette, debat nomme s'il existe ; un point douteux se verifie
     avant publication, et aucun marqueur A VERIFIER ne reste dans un
     cours publie (valider.js le refuse).

   Longueur d'une seance : de 550 a 1100 mots, autour de 750.
   C'est une fourchette, pas une cible a atteindre. Une demonstration qui
   demande mille mots les prend ; une mise au point qui tient en six
   cents s'arrete a six cents. Le plancher interdit de bacler, le plafond
   interdit de delayer, et entre les deux c'est le sujet qui commande,
   non le compteur. La regle precedente, 700 a 900, a produit l'inverse :
   la moitie des seances se sont rangees dans une bande de 54 mots, et
   Yalta recevait exactement le meme developpement que le plan Schlieffen.
   Le validateur affiche l'ecart interquartile du corpus et proteste s'il
   se resserre a nouveau.

   Tableaux (la ou des chiffres se comparent) : un <table> ordinaire,
   avec <thead> et <th> pour l'en-tete. Le CSS le met en page comme un
   tableau imprime : filets fins, en-tete en petites capitales, colonnes
   de chiffres alignees a droite si on leur donne class="n" -- reserve
   aux nombres que l'on compare, car cette classe interdit la coupure
   et peut faire deborder le tableau si on l'applique a des dates. Sur
   telephone, un tableau trop large defile horizontalement plutot que
   de deborder. Ne pas y mettre de phrases longues : un tableau sert a
   comparer, pas a raconter.

   Cartes et schemas (facultatif, la ou ils eclairent vraiment le propos) :
   inseres dans contenu sous la forme

     <figure class="croquis">
       <svg viewBox="0 0 360 236" role="img" aria-label="...">...</svg>
       <figcaption><b>Titre.</b> Une ou deux phrases.</figcaption>
     </figure>

   Regles :
   - une carte se calcule, elle ne se dessine pas d'imagination. Les
     points viennent de coordonnees reelles, la projection est lineaire
     et l'aspect corrige par le cosinus de la latitude moyenne, faute de
     quoi la France est etiree d'un tiers en largeur. Le trait de cote
     et les fleuves sortent de source/cartes/cotes.json et fleuves.json,
     tires de Natural Earth (domaine public) ; les scripts de
     source/cartes/ les projettent et ecrivent le SVG. Les frontieres
     politiques, elles, se posent a la main et se datent : celles de
     1789 ne sont pas celles de 1799. Aucune carte n'entre dans un cours
     sans avoir ete regardee a l'ecran ;
   - largeur de reference 360 unites, hauteur libre (200 a 340) ;
   - couleurs : #ece1c4 fond, #e4d6ae / #d8c896 / #cdbc8a les sols,
     #aac0c2 l'eau, #3a3020 l'encre, #8c2432 le camp A, #1f4a3c le
     camp B, #a9761f l'axe decisif, #6b5a34 le neutre ;
   - fleches : marker-end="url(#f-a)" (bordeaux), #f-b (vert), #f-or
     (or), #f-n (encre) ; hachures : fill="url(#h-a)", #h-b, #h-or,
     #h-n ; pointilles : url(#p-a), url(#p-b). Tous ces motifs sont
     definis une seule fois dans #croquis-defs, au debut du <body> :
     ne PAS redefinir de <defs> dans la figure (les id seraient en
     double) ;
   - textes : classes .cr-pays, .cr-region, .cr-ville, .cr-eau,
     .cr-leg, .cr-note (la police est deja posee par le CSS) ;
   - legende encadree en bas de la figure, fond #f3ead2 ;
   - ne jamais mettre d'espace devant ; : ? ! dans une balise : la
     fonction typo() y glisserait une espace insecable et casserait
     l'attribut SVG.
   ===================================================================== */

/* Le catalogue se parcourt selon deux entrees, au choix du lecteur.

   1. La periode : un decoupage chronologique date, qui reprend les grandes
      periodes scolaires mais coupe le XXe siecle en trois. Une periode sans
      aucun cours reste visible et porte la mention << bientot >>.
   2. Le theme : ce qui rapproche des cours que la chronologie separe. Dans
      l'onglet Cours, les themes sont ranges sous la periode ou ils
      s'ancrent, pour que le sommaire reste lisible quand il comptera des
      centaines de themes.

   REGLES DE CLASSEMENT -- a relire avant chaque nouveau cours.

   Periode. Celle qui contient le coeur du sujet : les evenements que les
   seances traitent, non l'arriere-plan qu'elles rappellent. La partition
   de l'Inde (1947) va dans le monde bipolaire meme si le cours remonte a
   1885. En cas de doute, on compte les seances : la periode qui en
   contient le plus l'emporte ; a egalite, celle du milieu des dates.

   Theme. Un ensemble qu'un enseignant reconnaitrait comme un chapitre :
   un nom precis, un adjectif qui le situe, et des dates. << Revolution >>
   ne dit rien ; << La Revolution francaise et l'Empire (1787-1815) >> dit
   de quoi il s'agit et quand. On cree un theme des qu'un cours n'entre
   dans aucun sans etre force ; un theme qui depasse une trentaine de cours
   se scinde (valider.js le signale). Chaque theme porte la periode ou il
   s'ancre ; un cours peut appartenir a une autre periode que son theme,
   et c'est l'interet des deux entrees.

   Le libelle << Regimes totalitaires et autoritaires >> est volontairement
   double : l'Espagne franquiste est le plus souvent rangee parmi les
   regimes autoritaires, non totalitaires, et le cours expose ce debat.
   Ranger ces quatre cours ensemble n'affirme donc pas qu'ils sont de meme
   nature : cela invite a les comparer.

   Pour ajouter un theme, il suffit de l'ajouter ici, a sa place
   chronologique, et de le porter sur les cours concernes : l'onglet Cours
   s'y adapte seul. */
const PERIODES = ["Préhistoire", "Antiquité (jusqu’en 476)", "Moyen Âge (476-1492)",
                  "Époque moderne (1492-1789)", "Le long XIXe siècle (1789-1914)",
                  "L’âge des guerres mondiales (1914-1945)", "Le monde bipolaire (1945-1991)",
                  "Le monde depuis 1991"];

/* ==========================================================================
   Voile des reponses. Les fichiers publies (cours, Quiz of the Day, fiches
   du Brevet) ne portent plus les bonnes reponses ni les explications en
   clair : elles sont melangees a un flux pseudo-aleatoire propre a chaque
   question (ou a chaque jour), puis ecrites en base64. L'application les
   devoile en memoire, au chargement.

   Ce n'est pas un coffre-fort : la cle est dans le code, et un developpeur
   decide peut la retrouver. C'est un voile : plus rien ne se lit d'un coup
   d'oeil sur GitHub ou dans les outils du navigateur.

   Le meme fichier sert aux outils de fabrication (Node : decouper.js,
   quotidien/planifier.js, fiches du Brevet), d'ou l'export en bas.
   ========================================================================== */
const VOILE = (function(){
  const CLE = "Epok·voile·1848·Quarante-Huit";
  function empreinte(t){
    let h1 = 0x9e3779b9 ^ t.length, h2 = 0x85ebca6b;
    for(let i = 0; i < t.length; i++){
      const c = t.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    return h1 >>> 0;
  }
  function flux(sel){
    let a = empreinte(CLE + "|" + sel);
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) & 255;
    };
  }
  /* UTF-8 et base64 ecrits a la main : le module tourne a l'identique dans
     le navigateur, l'application Android, Node et le bac a sable de
     valider.js, sans dependre de TextEncoder, atob ou Buffer. */
  const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  function versOctets(t){
    const b = unescape(encodeURIComponent(t)), o = new Uint8Array(b.length);
    for(let i = 0; i < b.length; i++) o[i] = b.charCodeAt(i);
    return o;
  }
  function depuisOctets(o){
    let b = "";
    for(let i = 0; i < o.length; i += 8192) b += String.fromCharCode.apply(null, Array.from(o.subarray(i, i + 8192)));
    return decodeURIComponent(escape(b));
  }
  function enB64(o){
    let r = "";
    for(let i = 0; i < o.length; i += 3){
      const n = (o[i] << 16) | ((o[i + 1] || 0) << 8) | (o[i + 2] || 0);
      r += B64[(n >> 18) & 63] + B64[(n >> 12) & 63] + (i + 1 < o.length ? B64[(n >> 6) & 63] : "=") + (i + 2 < o.length ? B64[n & 63] : "=");
    }
    return r;
  }
  function deB64(t){
    const s = t.replace(/=+$/, ""), o = new Uint8Array(Math.floor(s.length * 3 / 4));
    let k = 0;
    for(let i = 0; i < s.length; i += 4){
      const n = (B64.indexOf(s[i]) << 18) | (B64.indexOf(s[i + 1]) << 12) | ((B64.indexOf(s[i + 2]) & 63) << 6) | (B64.indexOf(s[i + 3]) & 63);
      o[k++] = (n >> 16) & 255; if(k < o.length) o[k++] = (n >> 8) & 255; if(k < o.length) o[k++] = n & 255;
    }
    return o;
  }
  function melanger(octets, sel){
    const f = flux(sel), r = new Uint8Array(octets.length);
    for(let i = 0; i < octets.length; i++) r[i] = octets[i] ^ f();
    return r;
  }
  return {
    voiler(objet, sel){ return enB64(melanger(versOctets(JSON.stringify(objet)), sel)); },
    devoiler(texte, sel){ return JSON.parse(depuisOctets(melanger(deB64(texte), sel))); },
    /* Une question { enonce, options, c } retrouve correctes et explication. */
    question(q, sel){
      if(q && typeof q.c === "string"){ Object.assign(q, this.devoiler(q.c, sel)); delete q.c; }
      return q;
    }
  };
})();
if(typeof module !== "undefined" && module.exports) module.exports = VOILE;

/* ====================== 5.  LECTURE À VOIX HAUTE ======================

   Epok ne transporte aucun fichier audio : les 276 séances feraient près
   de trois cents mégaoctets, soit deux cents fois l'application entière.
   La voix est donc celle de l'appareil, et tout le travail consiste à lui
   donner un texte qu'elle puisse dire correctement.

   Trois opérations, dans cet ordre :

   1. NORMALISER. Le texte affiché est composé pour l'œil : espaces fines
      insécables devant les ponctuations doubles, guillemets français,
      tirets cadratins, chiffres romains, ordinaux abrégés. Une synthèse
      vocale bute sur tout cela — une espace fine avant un point
      d'interrogation suffit à lui faire perdre la question. On rend donc
      au texte une ponctuation ordinaire avant de le lui confier.

   2. DÉCOUPER EN PHRASES. Chaque phrase est dite séparément, et un
      silence calibré la suit : court après un point, plus long en fin de
      paragraphe, plus long encore avant un titre de partie. Les moteurs
      marquent la ponctuation trop faiblement pour un texte de cours ;
      c'est ici qu'on la leur impose. Découper évite en outre la coupure
      des énoncés longs, défaut connu de l'API du navigateur.

   3. DIRE. Deux moteurs possibles, la même interface : le pont natif de
      l'application Android, et à défaut l'API du navigateur.            */

/* ---------- 5.1  Nombres en toutes lettres ---------- */

const VOIX_UNITES = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf",
  "dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
const VOIX_DIZAINES = ["","","vingt","trente","quarante","cinquante",
  "soixante","soixante","quatre-vingt","quatre-vingt"];

function voixEnLettres(n){
  n = Number(n);
  if(!isFinite(n) || n < 0 || n > 999 || n !== Math.floor(n)) return String(n);
  if(n < 20) return VOIX_UNITES[n];
  if(n < 100){
    const d = Math.floor(n/10), u = n % 10;
    /* Soixante-dix et quatre-vingt-dix se construisent sur la dizaine
       précédente : soixante + onze, quatre-vingt + treize. */
    if(d === 7 || d === 9) return VOIX_DIZAINES[d] + (d === 7 && u === 1 ? " et " : "-") + VOIX_UNITES[10 + u];
    if(u === 0) return VOIX_DIZAINES[d] + (d === 8 ? "s" : "");
    if(u === 1) return VOIX_DIZAINES[d] + (d === 8 ? "-un" : " et un");
    return VOIX_DIZAINES[d] + "-" + VOIX_UNITES[u];
  }
  const c = Math.floor(n/100), r = n % 100;
  const tete = (c === 1 ? "cent" : VOIX_UNITES[c] + " cent") + (c > 1 && r === 0 ? "s" : "");
  return r === 0 ? tete : tete + " " + voixEnLettres(r);
}

function voixOrdinal(n, feminin){
  n = Number(n);
  if(n === 1) return feminin ? "première" : "premier";
  let mot = voixEnLettres(n);
  if(mot === "cinq") mot = "cinqu";
  else if(/neuf$/.test(mot)) mot = mot.slice(0, -1) + "v";
  else if(/e$/.test(mot)) mot = mot.slice(0, -1);
  else if(/ts$/.test(mot)) mot = mot.slice(0, -1);
  return mot + "ième";
}

/* ---------- 5.2  Chiffres romains ---------- */

const VOIX_ROMAIN = { I:1, V:5, X:10, L:50, C:100, D:500, M:1000 };
const VOIX_VERS_ROMAIN = [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],
  [50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];

function voixRomainEcrit(n){
  let out = "";
  for(const [v, s] of VOIX_VERS_ROMAIN){ while(n >= v){ out += s; n -= v; } }
  return out;
}

/* Rend 0 pour tout ce qui n'est pas un chiffre romain canonique : on
   refuse ainsi IIII, VV, et surtout les sigles qui n'emploient que des
   lettres romaines sans en être. */
function voixRomainLu(s){
  let total = 0, max = 0;
  for(let i = s.length - 1; i >= 0; i--){
    const v = VOIX_ROMAIN[s[i]];
    if(!v) return 0;
    if(v < max) total -= v; else { total += v; max = v; }
  }
  return voixRomainEcrit(total) === s ? total : 0;
}

/* ---------- 5.3  Lexique de prononciation ----------
   À n'employer que pour ce qu'une voix française lit visiblement de
   travers. Chaque entrée est une réécriture phonétique approximative :
   la liste est faite pour grandir à l'oreille, pas pour être exhaustive. */
const VOIX_LEXIQUE = [
  [/Diên Biên Phu/g,  "Dièn Bièn Fou"],
  [/\bquôc ngu\b/g,   "kouok ngou"],
  [/\bNghê-Tinh\b/g,  "Nghé-Tinh"],
  [/\bsatyagraha\b/g, "satyagraha"],
  [/\bkhadi\b/g,      "kadi"],
  [/\bkafilas\b/g,    "kafilas"],
  [/\bBao Dai\b/g,    "Bao Daï"],
  [/\bGiap\b/g,       "Giap"],
  [/\bwilaya I\b/g,   "wilaya un"],
  [/\bwilaya II\b/g,  "wilaya deux"]
];

/* ---------- 5.4  Du texte écrit au texte dit ---------- */

/* Abréviations après lesquelles un point ne termine pas la phrase. */
const VOIX_ABREGES = ["av","apr","cf","env","etc","ill","éd","vol","p","M","Mme","Mlle","Dr","St","Ste"];

function voixNormaliser(t){
  let s = String(t);

  /* Tirets conditionnels : posés dans le texte pour la justification, ils
     sont invisibles à l'œil mais pas au moteur de parole, qui peut les
     prendre pour une césure et hacher le mot. */
  s = s.replace(/\u00ad/g, "");

  /* Espaces fines et insécables : devant une ponctuation elles la rendent
     méconnaissable au moteur, ailleurs elles collent des mots. */
  s = s.replace(/[   ]/g, " ");

  /* Les groupes de chiffres séparés par une espace forment un seul
     nombre : 350 000 doit se dire trois cent cinquante mille. */
  s = s.replace(/(\d) (?=\d{3}(?!\d))/g, "$1").replace(/(\d) (?=\d{3}(?!\d))/g, "$1");

  /* Une fourchette d'années se dit, elle ne s'épelle pas. */
  s = s.replace(/(\d{4})\s*[-–]\s*(\d{4})/g, "$1 à $2");

  /* Guillemets : le moteur les nomme ou les avale. On les retire, la
     citation reste portée par la phrase qui l'introduit. */
  s = s.replace(/[«»"]/g, " ");

  /* Le tiret cadratin sert ici d'incise : une virgule en tient lieu. */
  s = s.replace(/\s*—\s*/g, ", ");
  /* Entre crochets, les points de suspension marquent une coupure dans
     une citation : ils se taisent, ils ne se disent pas. */
  s = s.replace(/\[\s*…\s*\]/g, ", ").replace(/…/g, ",");

  /* Ordinaux abrégés : 1er, 17e, 1re. */
  s = s.replace(/(\d+)(er|re|es|e)(?![\wÀ-ÿ])/g, (tout, n, suf) =>
    (suf === "es" || suf === "e") ? voixOrdinal(n, false)
                                  : voixOrdinal(n, suf === "re"));

  /* Chiffres romains d'au moins deux lettres, avec ou sans suffixe
     d'ordinal. La capture du caractère précédent remplace une limite de
     mot, qu'un É ou un Ê prendrait en défaut. */
  s = s.replace(/(^|[^\wÀ-ÿ])([IVXLCDM]{2,})(er|re|es|e)?(?![\wÀ-ÿ])/g,
    (tout, avant, rom, suf) => {
      const n = voixRomainLu(rom);
      if(!n) return tout;
      if(!suf) return avant + voixEnLettres(n);
      return avant + ((suf === "re") ? voixOrdinal(n, true) : voixOrdinal(n, false));
    });

  for(const [motif, dit] of VOIX_LEXIQUE) s = s.replace(motif, dit);

  return s.replace(/\s+/g, " ").trim();
}

/* Longueur du silence à ménager selon ce qui ferme la phrase. */
function voixSilence(fin){
  if(/[?!]$/.test(fin)) return 420;
  if(/[.]$/.test(fin))  return 360;
  return 240;
}

/* Une phrase de trois cents signes dure plus de vingt secondes, et l'on
   ne peut reprendre la lecture qu'au début d'une phrase : reculer de dix
   secondes en ferait alors remonter vingt. On coupe donc les plus longues
   sur leur ponctuation interne, au plus près du milieu. La voix y gagne
   aussi de respirer, ce que les longues périodes françaises demandent. */
const VOIX_LONGUEUR = 180;

function voixDecouper(phrase){
  if(phrase.length <= VOIX_LONGUEUR) return [phrase];
  const milieu = phrase.length / 2;
  let coupe = -1, ecart = Infinity;
  const motif = /[;:,]\s/g;
  let m;
  while((m = motif.exec(phrase)) !== null){
    const p = m.index + m[0].length;
    /* Ni trop tôt ni trop tard : un fragment de dix signes se dirait
       comme un hoquet. */
    if(p < 60 || phrase.length - p < 60) continue;
    const d = Math.abs(p - milieu);
    if(d < ecart){ ecart = d; coupe = p; }
  }
  if(coupe < 0) return [phrase];
  return voixDecouper(phrase.slice(0, coupe).trim())
    .concat(voixDecouper(phrase.slice(coupe).trim()));
}

/* Découpe un paragraphe déjà normalisé en phrases dites séparément.
   On ne coupe pas après une initiale (W. H. Auden) ni après une
   abréviation connue. */
function voixPhrases(t){
  const s = voixNormaliser(t);
  if(!s) return [];
  const out = [];
  /* Un fragment coupé au milieu d'une phrase ne se termine pas : le
     silence qui le suit est court, celui qui ferme la phrase est plein. */
  const pousser = (liste, phrase, silence) => {
    const bouts = voixDecouper(phrase);
    bouts.forEach((b, k) =>
      liste.push({ dit:b, silence: k === bouts.length - 1 ? silence : 160 }));
  };
  let debut = 0;
  const motif = /([.!?]+)(\s+)(?=[«"(“]?[A-ZÀ-ÞÉÈÊ0-9])/g;
  let m;
  while((m = motif.exec(s)) !== null){
    const avant = s.slice(debut, m.index);
    const dernier = (avant.match(/([\wÀ-ÿ°]+)$/) || [])[1] || "";
    const initiale = dernier.length === 1 && dernier === dernier.toUpperCase();
    if(initiale || VOIX_ABREGES.indexOf(dernier) >= 0) continue;
    const phrase = s.slice(debut, m.index + m[1].length).trim();
    if(phrase) pousser(out, phrase, voixSilence(m[1]));
    debut = m.index + m[0].length;
  }
  const reste = s.slice(debut).trim();
  if(reste) pousser(out, reste, voixSilence(reste.slice(-1)));
  return out;
}

/* ---------- 5.4 bis  Annoncer les titres ----------
   Lu tel quel, un titre de partie donne << un point Une Union, cinq pays >>,
   qui ne s'entend pas comme un titre. On le dit donc comme on le dirait a
   l'oral : Grand un. Le catalogue ne comporte que des parties numerotees de
   1 a 4, sans sous-partie ; le cas du sous-titre est prevu malgre tout. */
function voixTitrePartie(texte){
  const s = String(texte).trim();
  const m = s.match(/^(\d+)\s*[.)]\s*(.*)$/);
  if(m) return "Grand " + voixEnLettres(Number(m[1])) + ". " + m[2];
  const sous = s.match(/^([a-z])\s*[.)]\s*(.*)$/);
  if(sous) return "Petit " + sous[1] + ". " + sous[2];
  return s;
}

/* ---------- 5.4 ter  Annoncer et dire une figure ----------
   Une figure s'annonce par son genre et son titre, puis sa legende est
   lue en entier : c'est elle qui dit ce que la carte ou la frise montre,
   et sans elle l'auditeur perdait l'information. Les etiquettes posees
   sur la carte, elles, restent muettes : lues une a une, hors de leur
   place, elles ne voudraient rien dire. */
const VOIX_FIGURES = [
  ["carte", "une carte"], ["plan", "un plan"], ["coupe", "une coupe"],
  ["frise", "une frise"], ["chronologie", "une chronologie"],
  ["organigramme", "un organigramme"], ["diagramme", "un diagramme"],
  ["graphique", "un graphique"], ["courbe", "une courbe"],
  ["pyramide", "une pyramide"], ["schéma", "un schéma"], ["croquis", "un croquis"]
];

function voixGenreFigure(aria){
  const a = String(aria || "").toLowerCase();
  let dit = null, rang = Infinity;
  for(const [mot, article] of VOIX_FIGURES){
    const p = a.indexOf(mot);
    if(p >= 0 && p < rang){ rang = p; dit = article; }
  }
  return dit || "un schéma";
}

/* Le titre d'une figure est le gras qui ouvre sa legende. A defaut, on
   prend sa premiere phrase, qui en tient lieu. */
function voixTitreFigure(legende){
  if(!legende) return "";
  const fort = legende.querySelector("strong, b");
  const brut = fort ? fort.textContent : String(legende.textContent).split(". ")[0];
  return String(brut).trim().replace(/[.:;,\s]+$/, "");
}

/* La legende sans son titre en gras, deja dit par l'annonce. */
function voixLegendeFigure(el){
  const leg = el.querySelector("figcaption");
  if(!leg) return "";
  const copie = leg.cloneNode(true);
  const fort = copie.querySelector("strong, b");
  if(fort) fort.remove();
  return String(copie.textContent).replace(/^[\s.:;,]+/, "").trim();
}

/* Un tableau se lit ligne a ligne : l'intitule de la ligne, puis chaque
   case precedee du nom de sa colonne. << Poids d'or legal : franc
   germinal, 322,58 mg ; franc Poincare, 65,5 mg. >> */
function voixLignesTableau(table){
  const nettoie = n => String(n ? n.textContent : "").replace(/\s+/g, " ").trim();
  const tete = table.querySelector("thead tr");
  const noms = tete ? [...tete.children].map(nettoie) : [];
  const lignes = [];
  table.querySelectorAll("tbody tr, tfoot tr").forEach(tr => {
    const cases = [...tr.children].map(nettoie);
    if(!cases.some(Boolean)) return;
    const [premiere, ...reste] = cases;
    const dits = reste.map((v, j) => noms[j + 1] ? noms[j + 1] + ", " + v : v).filter(Boolean);
    lignes.push({ tr, texte: (noms[0] && premiere ? noms[0] + " " : "") + premiere + (dits.length ? " : " + dits.join(" ; ") : "") + "." });
  });
  return lignes;
}

function voixAnnonceFigure(el){
  const svg = el.querySelector("svg");
  const genre = voixGenreFigure(svg ? svg.getAttribute("aria-label") : "");
  const titre = voixTitreFigure(el.querySelector("figcaption"));
  return titre ? "Ici, " + genre + " : " + titre + "." : "Ici, " + genre + ".";
}

/* ---------- 5.5  Les blocs d'une séance ----------
   On lit tout le texte de la séance : le titre, la problématique, les
   parties, les paragraphes, les listes, les citations, les tableaux ligne
   à ligne, la légende des figures, l'anecdote. Rien de ce qui porte une
   information ne doit manquer à qui écoute sans regarder. Seuls les
   repères du mode relecture, qui ne sont pas du texte de cours, et les
   étiquettes posées sur les cartes restent muets. */
function voixBlocs(){
  const vue = document.getElementById("vue-cours");
  if(!vue) return [];
  const blocs = [];
  const ajouter = (el, texte, avant) => {
    const phrases = voixPhrases(texte);
    if(phrases.length) blocs.push({ el, phrases, avant: avant || 0 });
  };

  const titre = vue.querySelector(".carte h2");
  if(titre) ajouter(titre, "Séance " + ECRAN.seance + ". " + titre.textContent + ".", 0);

  const pb = vue.querySelector(".probleme");
  if(pb) ajouter(pb, pb.textContent, 500);

  const art = vue.querySelector("article.lecture");
  if(art){
    for(const el of art.children){
      const nom = el.tagName.toLowerCase();
      if(nom === "h3"){ ajouter(el, voixTitrePartie(el.textContent), 800); continue; }
      if(nom === "figure"){
        ajouter(el, voixAnnonceFigure(el), 500);
        const suite = voixLegendeFigure(el);
        if(suite) ajouter(el.querySelector("figcaption"), suite, 300);
        continue;
      }
      if(el.classList && el.classList.contains("tableau")){
        const leg = el.querySelector("caption");
        const titre = leg ? String(leg.textContent).trim().replace(/[.\s]+$/, "") : "";
        ajouter(el, titre ? "Ici, un tableau : " + titre + "." : "Ici, un tableau.", 500);
        const table = el.querySelector("table");
        if(table) voixLignesTableau(table).forEach(l => ajouter(l.tr, l.texte, 300));
        /* Une note sous le tableau, s'il y en a une. */
        el.querySelectorAll(":scope > p").forEach(n => ajouter(n, n.textContent, 300));
        continue;
      }
      if(nom === "h4"){ ajouter(el, voixTitrePartie(el.textContent), 600); continue; }
      if(nom === "ul" || nom === "ol"){
        [...el.children].forEach((li, i) => ajouter(li, (nom === "ol" ? (i + 1) + ". " : "") + li.textContent, 300));
        continue;
      }
      if(nom === "blockquote"){ ajouter(el, "Citation. " + el.textContent, 500); continue; }
      /* Tout autre bloc de texte : lu tel quel, plutot que saute. */
      const copie = el.cloneNode(true);
      copie.querySelectorAll(".verif").forEach(n => n.remove());
      if(String(copie.textContent).trim()) ajouter(el, copie.textContent, 500);
    }
  }

  const an = vue.querySelector(".anecdote");
  if(an){
    const copie = an.cloneNode(true);
    copie.querySelectorAll(".verif,.titre").forEach(n => n.remove());
    ajouter(an, "Anecdote. " + copie.textContent, 900);
  }
  return blocs;
}

/* ---------- 5.6  Les deux moteurs ----------

   Le pont natif reçoit la séance entière d'un coup, phrases et silences
   mêlés, et la joue lui-même : la voix ne dépend alors plus des minuteurs
   de la page, que le système ralentit dès qu'on quitte l'écran. Le
   navigateur, lui, n'a pas d'équivalent de la pause programmée ; on y
   enchaîne phrase à phrase depuis la page. D'où le drapeau << pilote >> :
   il dit lequel des deux tient la file.                                 */

const VITESSES = [0.8, 1, 1.2, 1.5];
const SAUTS = [-20000, -10000, 10000, 20000];

/* Combien de signes une voix française dit par seconde, à vitesse 1. La
   valeur sert à placer le curseur et à sauter de dix secondes ; elle est
   recalée sur ce que l'appareil fait réellement, car un moteur bavard et
   un moteur posé ne tiennent pas le même débit. */
const SIGNES_PAR_SECONDE = 14.5;

/* Les voix ne se valent pas. Sans pouvoir les écouter, on les classe sur
   ce que leur nom et leurs attributs annoncent : une voix dite neuronale
   ou rehaussée vaut mieux qu'une voix compacte, faite pour tenir dans peu
   de mémoire et qui sonne mécanique. */
function voixNote(nom, langue, reseau, qualite){
  let note = 0;
  const n = String(nom || "").toLowerCase();
  if(/neural|natural|enhanced|premium|wavenet|siri|google/.test(n)) note += 4;
  if(/compact|espeak|e-speak|pico|robot|basic/.test(n)) note -= 6;
  if(/^fr[-_]fr/i.test(String(langue || ""))) note += 1;
  if(typeof qualite === "number") note += Math.round((qualite - 300) / 100);
  if(reseau) note += 1;
  return note;
}

/* ---------- Des noms de voix lisibles ----------
   Android livre les voix de Google sous leur nom technique : << fr-fr-x-
   fra-network >>, << fr-fr-x-fra-local >>, << fr-ca-x-caa-network >>,
   << fr-FR-language >>. Une vingtaine de lignes illisibles, dont chaque
   voix en double (en ligne et hors ligne). On les presente par pays et
   par numero, une seule fois chacune : la version hors ligne d'abord, qui
   marche partout ; la version en ligne seulement si elle est seule. Les
   noms de Windows (<< Microsoft Paul - French (France) >>) sont raccourcis
   en << Paul (France) >>. */
const VOIX_PAYS = { fr:"France", ca:"Canada", be:"Belgique", ch:"Suisse", lu:"Luxembourg" };
function voixPresentees(voix){
  const groupes = new Map(), autres = [];
  let defaut = null;
  voix.forEach(v => {
    const n = String(v.nom || "");
    const g = /^([a-z]{2})[-_]([a-z]{2})[-_]x[-_]([a-z]{3})[-_](network|local)$/i.exec(n);
    if(/^[a-z]{2}[-_][a-z]{2}[-_]language$/i.test(n)){
      defaut = { noms:[n], nom:n, libelle:"Voix par défaut de l’appareil", ordre:0 };
      return;
    }
    if(g){
      const pays = g[2].toLowerCase(), cle = pays + "|" + g[3].toLowerCase();
      const local = g[4].toLowerCase() === "local";
      const e = groupes.get(cle) || { pays, noms:[], nom:null, local:false };
      e.noms.push(n);
      if(local || !e.nom){ e.nom = local || !e.local ? n : e.nom; e.local = e.local || local; }
      groupes.set(cle, e);
      return;
    }
    const ms = /^Microsoft (.+?) - .*\((.+)\)$/i.exec(n);
    autres.push({ noms:[n], nom:n, libelle:(ms ? ms[1] + " (" + ms[2] + ")" : n) + (v.reseau ? " — en ligne" : ""), ordre:3 });
  });
  const parPays = {};
  const google = [...groupes.values()].sort((a, b) =>
    (a.pays === "fr" ? 0 : 1) - (b.pays === "fr" ? 0 : 1) || a.pays.localeCompare(b.pays) || a.noms[0].localeCompare(b.noms[0]))
    .map(e => {
      parPays[e.pays] = (parPays[e.pays] || 0) + 1;
      return { noms:e.noms, nom:e.nom, ordre: e.pays === "fr" ? 1 : 2,
               libelle: (VOIX_PAYS[e.pays] || e.pays.toUpperCase()) + " — voix " + parPays[e.pays] + (e.local ? "" : " (Internet nécessaire)") };
    });
  return (defaut ? [defaut] : []).concat(google, autres);
}

const VOIX_PONT = {
  nom: "pont",
  pilote: true,
  dispo(){
    try { return !!(window.PontEpok && PontEpok.voixPrete && PontEpok.voixPrete()); }
    catch(e){ return false; }
  },
  liste(){
    try {
      const brut = PontEpok.voixListe ? PontEpok.voixListe() : "[]";
      return JSON.parse(brut || "[]").map(v => ({
        nom:v.nom, langue:v.langue,
        note: voixNote(v.nom, v.langue, v.reseau, v.qualite),
        reseau: !!v.reseau
      }));
    } catch(e){ return []; }
  },
  choisir(nom){ try { PontEpok.voixChoisir(nom || ""); } catch(e){} },
  jouer(etapes, depuis, vitesse, decalage){
    const file = etapes.slice(depuis).map((e, k) => ({
      t: k === 0 && decalage ? e.dit.slice(decalage) : e.dit,
      p: e.silence, i: depuis + k
    }));
    PontEpok.voixJouer(JSON.stringify(file), vitesse);
  },
  arreter(){ try { PontEpok.voixArreter(); } catch(e){} }
};

const VOIX_WEB = {
  nom: "web",
  pilote: false,
  /* L'API peut exister sans qu'aucune voix ne soit installée : le
     navigateur accepte alors de parler et ne dit rien. On exige donc une
     voix réelle, faute de quoi l'application annonce honnêtement qu'elle
     ne peut pas lire. */
  dispo(){
    if(typeof window === "undefined"
       || typeof window.speechSynthesis !== "object" || window.speechSynthesis === null
       || typeof window.SpeechSynthesisUtterance !== "function") return false;
    try { return (window.speechSynthesis.getVoices() || []).length > 0; }
    catch(e){ return false; }
  },
  brutes(){
    try { return (window.speechSynthesis.getVoices() || []); } catch(e){ return []; }
  },
  liste(){
    const toutes = this.brutes();
    const fr = toutes.filter(v => /^fr/i.test(v.lang || ""));
    return (fr.length ? fr : toutes).map(v => ({
      nom:v.name, langue:v.lang,
      note: voixNote(v.name, v.lang, v.localService === false),
      reseau: v.localService === false
    }));
  },
  choisir(){},
  jouer(etapes, depuis, vitesse, decalage){
    const e = etapes[depuis];
    if(!e) return;
    const base = decalage || 0;
    const u = new window.SpeechSynthesisUtterance(base ? e.dit.slice(base) : e.dit);
    const v = VOIX.voixRetenue(this);
    u.lang = (v && v.lang) || "fr-FR";
    u.rate = vitesse;
    if(v) u.voice = v;
    /* Le navigateur annonce chaque mot qu'il attaque : c'est ce qui
       permet de reprendre une pause là où la voix s'est arrêtée. */
    u.onboundary = (ev) => {
      if(ev && typeof ev.charIndex === "number") VOIX.mot(depuis, base + ev.charIndex);
    };
    u.onend = () => VOIX.avance(depuis);
    u.onerror = () => VOIX.avance(depuis);
    window.speechSynthesis.speak(u);
  },
  arreter(){ try { window.speechSynthesis.cancel(); } catch(e){} }
};

function voixMoteur(){
  if(VOIX_PONT.dispo()) return VOIX_PONT;
  if(VOIX_WEB.dispo())  return VOIX_WEB;
  return null;
}

/* ---------- 5.7  Le lecteur ----------

   Une synthèse vocale ne sait pas dire où elle en est. Pour offrir une
   pause et un saut de dix secondes, le lecteur tient donc sa propre
   horloge : chaque phrase reçoit une durée estimée d'après sa longueur,
   et l'estimation se corrige sur ce qui est réellement observé. Sauter en
   arrière replace au début d'une phrase, jamais au milieu d'un mot.     */

const VOIX = {
  moteur:null, cle:null, etapes:[], blocs:[], i:0,
  actif:false, enPause:false, minuteur:null, horloge:null, tour:0,
  debutPhrase:0, duree:0, decalage:0, motAtteint:0,

  disponible(){ return !!voixMoteur(); },

  vitesse(){
    const v = ETAT.reglages.vitesseVoix;
    return VITESSES.indexOf(v) >= 0 ? v : 1;
  },

  signes(){
    const c = ETAT.reglages.signesSeconde;
    return (typeof c === "number" && c > 5 && c < 40) ? c : SIGNES_PAR_SECONDE;
  },

  /* La liste des voix de l'appareil, la meilleure en tête. */
  voix(){
    const m = this.moteur || voixMoteur();
    if(!m || !m.liste) return [];
    return m.liste().sort((a, b) => b.note - a.note || a.nom.localeCompare(b.nom));
  },

  /* L'objet voix du navigateur correspondant au choix enregistré. */
  voixRetenue(moteur){
    const voulue = ETAT.reglages.voixNom;
    const toutes = moteur.brutes ? moteur.brutes() : [];
    if(voulue){
      const exacte = toutes.filter(v => v.name === voulue)[0];
      if(exacte) return exacte;
    }
    const classees = this.voix();
    if(!classees.length) return null;
    return toutes.filter(v => v.name === classees[0].nom)[0] || null;
  },

  choisirVoix(nom){
    ETAT.reglages.voixNom = nom || "";
    sauverEtat();
    const m = this.moteur || voixMoteur();
    if(m && m.choisir) m.choisir(nom);
    if(this.actif) this.relancer();
  },

  /* Aplatit les blocs en une file de phrases, chacune sachant de quel
     bloc elle vient, combien de temps elle doit durer, et à quelle
     seconde de la séance elle commence. */
  preparer(){
    this.blocs = voixBlocs();
    this.etapes = [];
    const sps = this.signes() * this.vitesse();
    let cumul = 0;
    this.blocs.forEach((b, nb) => {
      b.debut = this.etapes.length;
      b.phrases.forEach((p, np) => {
        const suivant = this.blocs[nb + 1];
        const dernier = (np === b.phrases.length - 1);
        const silence = dernier && suivant ? Math.max(p.silence, suivant.avant) : p.silence;
        const duree = Math.round(p.dit.length / sps * 1000);
        this.etapes.push({ dit:p.dit, bloc:nb, silence, duree, debut:cumul });
        cumul += duree + silence;
      });
    });
    this.duree = cumul;
    return this.etapes.length > 0;
  },

  /* Où en est la lecture, en millisecondes depuis le début. */
  /* Où en est la lecture, en millisecondes depuis le début. Le décalage
     est la part de la phrase déjà dite au moment d'une pause : sans lui,
     le curseur reculerait à chaque reprise. */
  position(){
    const e = this.etapes[this.i];
    if(!e) return this.duree;
    const dejaDit = (this.decalage && e.dit.length)
      ? Math.round(e.duree * this.decalage / e.dit.length) : 0;
    if(!this.actif || this.enPause) return e.debut + dejaDit;
    const coule = Date.now() - this.debutPhrase;
    return e.debut + Math.min(dejaDit + coule, e.duree + e.silence);
  },

  demarrer(){
    this.arreter(true);
    this.decalage = 0; this.motAtteint = 0;
    this.moteur = voixMoteur();
    if(!this.moteur) return false;
    if(this.moteur.choisir) this.moteur.choisir(ETAT.reglages.voixNom || "");
    if(!this.preparer()) return false;
    this.cle = ECRAN.coursId + "#" + ECRAN.seance;
    this.i = 0; this.actif = true; this.enPause = false;
    this.battre();
    this.peindre();
    this.lancer();
    return true;
  },

  lancer(){
    if(!this.actif || this.enPause) return;
    this.tour++;
    this.debutPhrase = Date.now();
    this.surligner(this.etapes[this.i]);
    try { this.moteur.jouer(this.etapes, this.i, this.vitesse(), this.decalage); }
    catch(e){ this.arreter(); }
  },

  /* Le moteur annonce le mot qu'il attaque, par son rang dans la phrase.
     On ne retient que la phrase en cours : une annonce en retard, venue
     d'une file abandonnée, ne doit pas déplacer le curseur. */
  mot(i, debut){
    if(!this.actif || this.enPause) return;
    if(Number(i) !== this.i) return;
    const d = Number(debut);
    if(isFinite(d) && d >= 0) this.motAtteint = d;
  },

  /* Le moteur signale que la phrase i est dite. On en profite pour
     recaler le débit observé : c'est lui qui rend le saut de dix
     secondes juste sur cet appareil-là. */
  avance(i){
    if(!this.actif || this.enPause) return;
    i = Number(i);
    if(!isFinite(i) || i < this.i) return;
    const e = this.etapes[i];
    if(e && this.debutPhrase){
      const mesure = Date.now() - this.debutPhrase - (i > this.i ? 0 : 0);
      const signes = e.dit.length / Math.max(0.2, (mesure / 1000)) * this.vitesse();
      if(signes > 5 && signes < 40){
        const ancien = this.signes();
        ETAT.reglages.signesSeconde = Math.round((ancien * 0.85 + signes * 0.15) * 10) / 10;
      }
    }
    this.i = i + 1;
    this.decalage = 0; this.motAtteint = 0;
    if(this.i >= this.etapes.length) return this.terminer();
    this.debutPhrase = Date.now();
    this.surligner(this.etapes[this.i]);
    this.peindre();
    if(this.moteur.pilote) return;   /* la suite est déjà programmée */
    const tour = this.tour;
    const attente = e ? e.silence : 300;
    this.minuteur = setTimeout(() => {
      this.minuteur = null;
      if(this.actif && !this.enPause && tour === this.tour)
        this.moteur.jouer(this.etapes, this.i, this.vitesse());
    }, attente);
  },

  /* ----- Pause ----- */

  /* Aucun moteur de synthèse ne reprend proprement au milieu d'un mot. On
     s'arrête donc sur place et l'on repart au début de la phrase en
     cours : à la reprise, on réentend la phrase entamée, ce qui est aussi
     ce qu'on veut quand on a été interrompu. */
  /* On retient le dernier mot annoncé par le moteur : la reprise repart
     de là, et non du début de la phrase. Si le moteur n'annonce pas les
     mots -- certains ne le font pas --, le décalage reste nul et la
     phrase entamée se redit en entier, faute de mieux. */
  pause(){
    if(!this.actif || this.enPause) return;
    this.silence();
    this.tour++;
    this.moteur.arreter();
    const e = this.etapes[this.i];
    /* Le dernier mot annoncé est celui que la voix venait d'attaquer :
       on repart de son début, pour ne pas le couper en deux. */
    this.decalage = (e && this.motAtteint > 0 && this.motAtteint < e.dit.length)
      ? this.motAtteint : this.decalage;
    this.enPause = true;
    this.peindre();
  },
  reprendre(){
    if(!this.actif || !this.enPause) return;
    this.enPause = false;
    this.peindre();
    this.lancer();
  },
  basculerPause(){
    if(!this.actif) return;
    this.enPause ? this.reprendre() : this.pause();
  },

  /* ----- Sauter dans le temps -----
     On ne peut reprendre qu'au début d'une phrase : un moteur de synthèse
     ne sait pas entrer au milieu d'un mot. On vise donc la frontière de
     phrase la plus proche de la seconde demandée, et non celle qui
     précède -- sans quoi un saut de vingt secondes n'en ferait parfois
     que huit, parce qu'il retomberait au début de la phrase en cours. */
  sauter(delta){
    if(!this.actif) return;
    const ici = this.position();
    const e = this.etapes[this.i];
    const entame = e ? ici - e.debut : 0;
    const cible = Math.max(0, Math.min(ici + delta, this.duree));
    let k = 0;
    for(let j = 0; j < this.etapes.length; j++){
      if(this.etapes[j].debut <= cible) k = j; else break;
    }
    if(delta > 0){
      /* En avant, on vise la frontière la plus proche, et l'on avance
         toujours d'au moins une phrase. */
      const suite = this.etapes[k + 1];
      if(suite && Math.abs(suite.debut - cible) < Math.abs(this.etapes[k].debut - cible)) k++;
      if(k <= this.i) k = Math.min(this.etapes.length - 1, this.i + 1);
    } else if(k >= this.i){
      /* En arrière, on reprend la phrase entamée ; si elle vient juste de
         commencer, on remonte à la précédente. */
      k = entame > 1200 ? this.i : Math.max(0, this.i - 1);
    }
    this.i = k;
    this.decalage = 0; this.motAtteint = 0;
    if(this.enPause){ this.surligner(this.etapes[k]); this.peindre(); return; }
    this.relancer();
  },

  relancer(){
    this.silence();
    this.tour++;
    this.moteur.arreter();
    this.peindre();
    this.lancer();
  },

  basculer(){
    if(this.actif){ this.arreter(); return; }
    if(!this.demarrer()){
      const z = document.getElementById("avis-voix");
      if(z) z.innerHTML = `<div class="avis" style="margin:10px 0 0">Aucune voix
        n’est disponible sur cet appareil. Sur Android, elle s’installe par
        Réglages &#8250; Général &#8250; Synthèse vocale.</div>`;
    }
  },

  silence(){
    if(this.minuteur !== null){ clearTimeout(this.minuteur); this.minuteur = null; }
  },

  /* Le curseur avance tout seul : il faut donc le redessiner. */
  battre(){
    if(this.horloge !== null) return;
    this.horloge = setInterval(() => {
      if(!this.actif){ clearInterval(this.horloge); this.horloge = null; return; }
      if(!this.enPause) this.majCurseur();
    }, 500);
  },

  arreter(discret){
    this.silence();
    this.tour++;
    if(this.horloge !== null){ clearInterval(this.horloge); this.horloge = null; }
    if(this.moteur) this.moteur.arreter();
    this.actif = false; this.enPause = false;
    this.decalage = 0; this.motAtteint = 0;
    this.surligner(null);
    if(!discret){ sauverEtat(); this.peindre(); }
  },

  terminer(){
    const cours = ECRAN.coursId, seance = ECRAN.seance;
    this.arreter();
    /* Écouter une séance jusqu'au bout, c'est l'avoir lue. */
    if(cours && marquerLue(cours, seance)) rendre();
  },

  /* Surligne le bloc de l'étape donnée, et le ramène à l'écran s'il en
     est sorti -- mais pas s'il y est déjà, pour ne pas arracher la page
     des mains de celui qui suit du doigt. */
  surligner(etape){
    const el = etape ? (this.blocs[etape.bloc] || {}).el : null;
    document.querySelectorAll(".dit").forEach(n => n.classList.remove("dit"));
    if(!el) return;
    el.classList.add("dit");
    const r = el.getBoundingClientRect();
    if(r.top < 70 || r.bottom > window.innerHeight - 190){
      el.scrollIntoView({ block:"center", behavior:"smooth" });
    }
  },

  majCurseur(){
    const z = document.getElementById("voix-temps");
    if(z) z.textContent = minutage(this.position()) + " / " + minutage(this.duree);
  },

  peindre(){
    const barre = document.getElementById("barre-voix");
    if(!barre) return;
    document.body.dataset.voix = this.actif ? "1" : "0";
    if(!this.actif){ barre.innerHTML = ""; return; }
    const sauts = SAUTS.map(d => `<button class="bouton petit discret saut" data-action="voix-saut"
        data-delta="${d}" aria-label="${d < 0 ? "Reculer" : "Avancer"} de ${Math.abs(d)/1000} secondes"
        >${d < 0 ? "&#8630;" : "&#8631;"}<b>${Math.abs(d)/1000}</b></button>`);
    barre.innerHTML = `
      <div class="voix-transport">
        ${sauts[0]}${sauts[1]}
        <button class="bouton pause" data-action="voix-pause"
          aria-label="${this.enPause ? "Reprendre" : "Mettre en pause"}"
          >${this.enPause ? "&#9654;" : "&#9208;"}</button>
        ${sauts[2]}${sauts[3]}
      </div>
      <div class="voix-pied">
        <button class="bouton petit discret" data-action="voix-stop">Arrêter</button>
        <span class="voix-temps" id="voix-temps">${minutage(this.position())} / ${minutage(this.duree)}</span>
        <button class="bouton petit discret" data-action="voix-vitesse"
          aria-label="Changer la vitesse">${String(this.vitesse()).replace(".", ",")}&#215;</button>
      </div>`;
  },

  changerVitesse(){
    const i = VITESSES.indexOf(this.vitesse());
    ETAT.reglages.vitesseVoix = VITESSES[(i + 1) % VITESSES.length];
    sauverEtat();
    if(!this.actif) return this.peindre();
    /* Les durées estimées dépendent de la vitesse : on refait la file en
       gardant la position atteinte. */
    const ou = this.position();
    this.preparer();
    let k = 0;
    for(let j = 0; j < this.etapes.length; j++){ if(this.etapes[j].debut <= ou) k = j; else break; }
    this.i = k;
    this.decalage = 0; this.motAtteint = 0;
    this.enPause ? this.peindre() : this.relancer();
  },

  /* Toute navigation hors de la séance écoutée interrompt la voix. */
  verifierEcran(){
    if(!this.actif) return;
    const cle = ECRAN.coursId + "#" + ECRAN.seance;
    if(ONGLET !== "cours" || ECRAN.nom !== "lecture" || cle !== this.cle) this.arreter();
  },

  essayer(){
    const m = voixMoteur();
    if(!m) return false;
    m.arreter();
    if(m.choisir) m.choisir(ETAT.reglages.voixNom || "");
    const essai = voixPhrases(voixTitrePartie("1. Une Union, cinq pays, trois statuts")
      + " En 1954, au XXe siècle, la bataille de Diên Biên Phu dure cinquante-six jours.");
    m.jouer(essai.map(p => ({ dit:p.dit, silence:p.silence })), 0, this.vitesse());
    return true;
  }
};

/* Minutes et secondes, pour le curseur du lecteur. */
function minutage(ms){
  const t = Math.max(0, Math.round(ms / 1000));
  return Math.floor(t / 60) + "\u2009:\u2009" + String(t % 60).padStart(2, "0");
}

/* La liste des voix du navigateur se remplit de façon différée : on la
   demande une première fois dès le chargement pour qu'elle soit prête
   quand le lecteur appuiera sur Écouter. */
try {
  if(typeof window !== "undefined" && window.speechSynthesis
     && typeof window.speechSynthesis.getVoices === "function"){
    window.speechSynthesis.getVoices();
    if(typeof window.speechSynthesis.addEventListener === "function"){
      window.speechSynthesis.addEventListener("voiceschanged", () => {
        if(!VOIX.actif) VOIX.peindre();
      });
    }
  }
} catch(e){}

/* Le moteur natif rappelle ici après chaque phrase dite. */
window.EpokVoix = {
  avance(i){ VOIX.avance(i); },
  mot(i, debut){ VOIX.mot(i, debut); }
};

/* Deux lettres au minimum avant la coupure, trois apres : l'usage
   francais refuse de rejeter moins de trois lettres a la ligne
   suivante. Le fichier TeX n'impose que deux ; on est plus severe. */
const CESURE_GAUCHE = 2, CESURE_DROITE = 3;
const CESURE_PLUS_LONG = 14;      /* longueur du plus long motif, en lettres */
const CESURE_MINI = 5;            /* on ne coupe pas un mot plus court */
const DOUX = "\u00ad";            /* le tiret conditionnel */

/* La table des motifs : lettres -> chiffres, un de plus que de lettres.
   Construite au premier besoin, jamais au demarrage : une seance ouverte
   la paie une fois, celui qui n'en ouvre aucune ne la paie pas. */
let CESURE_TABLE = null;

function cesureTable(){
  if(CESURE_TABLE) return CESURE_TABLE;
  const t = new Map();
  for(const motif of CESURE_MOTIFS.split(" ")){
    let lettres = "";
    const chiffres = [0];
    for(const c of motif){
      if(c >= "0" && c <= "9") chiffres[lettres.length] = Number(c);
      else { lettres += c; chiffres[lettres.length] = chiffres[lettres.length] || 0; }
    }
    t.set(lettres, chiffres);
  }
  CESURE_TABLE = t;
  return t;
}

/* Memoire des mots deja coupes. Le corpus repete beaucoup : la seconde
   seance ne recalcule presque rien. Bornee, pour ne pas enfler sans fin. */
const CESURE_MEMOIRE = new Map();
const CESURE_MEMOIRE_MAX = 6000;

/* L'algorithme de Liang. On encadre le mot de points, on superpose les
   chiffres de tous les motifs qui s'y trouvent en gardant le plus fort a
   chaque position, et un chiffre impair ouvre une coupure. */
function cesureMot(mot){
  const vu = CESURE_MEMOIRE.get(mot);
  if(vu !== undefined) return vu;
  const t = cesureTable();
  const m = "." + mot.toLowerCase().replace(/’/g, "'") + ".";
  const n = m.length;
  const points = new Array(n + 1).fill(0);
  for(let i = 0; i < n; i++){
    const fin = Math.min(n, i + CESURE_PLUS_LONG);
    for(let j = i + 1; j <= fin; j++){
      const p = t.get(m.slice(i, j));
      if(!p) continue;
      for(let k = 0; k < p.length; k++)
        if(p[k] > points[i + k]) points[i + k] = p[k];
    }
  }
  let sortie = "";
  for(let i = 1; i < n - 1; i++){
    /* i compte dans le mot encadre : i vaut 1 devant la premiere lettre. */
    if(i > CESURE_GAUCHE && i < n - CESURE_DROITE && points[i] % 2) sortie += DOUX;
    sortie += mot[i - 1];
  }
  if(CESURE_MEMOIRE.size >= CESURE_MEMOIRE_MAX) CESURE_MEMOIRE.clear();
  CESURE_MEMOIRE.set(mot, sortie);
  return sortie;
}

/* Un mot coupable : au moins CESURE_MINI lettres, pas de chiffre, pas
   tout en capitales. On ne coupe ni 1914, ni URSS, ni XIXe -- un sigle
   coupe en deux ne se relit pas. */
const CESURE_MOT = /[A-Za-zÀ-ÖØ-öø-ÿŒœ'’]+/g;

function cesureChaine(s){
  if(s.indexOf(DOUX) !== -1) return s;      /* deja fait */
  /* Une adresse e-mail ou web ne se coupe pas : << prof.his-toire@... >>
     ne se relirait pas. */
  if(/@|:\/\//.test(s)) return s.replace(/\S+/g, t => /@|:\/\//.test(t) ? t : cesureChaine(t));
  return s.replace(CESURE_MOT, (mot) => {
    const lettres = mot.replace(/['’]/g, "");
    if(lettres.length < CESURE_MINI) return mot;
    if(lettres === lettres.toUpperCase()) return mot;
    return cesureMot(mot);
  });
}

/* Pose les tirets conditionnels dans les blocs que la feuille de style
   justifie, et seulement dans ceux-la : la liste ci-dessous reprend mot
   pour mot celle du CSS. Les croquis et les tableaux sont laisses
   tranquilles -- un libelle de carte n'est pas de la prose, et une
   cellule de tableau est trop etroite pour qu'une coupure y aide. */
const CESURE_BLOCS = ".lecture p, .lecture li, .probleme, .anecdote p," +
                     " .corr .expl, .lecture figure.croquis figcaption," +
                     " .carte > .secondaire," +
                     " .carte p.minuscule:not(.rang-bas), .carte .corps .secondaire," +
                     " .hors-fil, .avis, .cours-carte .pb";

const CESURE = {
  poser(racine){
    if(!racine) return;
    const blocs = racine.querySelectorAll(CESURE_BLOCS);
    for(const bloc of blocs){
      if(bloc.closest("svg, table")) continue;
      const marche = document.createTreeWalker(bloc, NodeFilter.SHOW_TEXT, {
        acceptNode(noeud){
          return noeud.parentElement && noeud.parentElement.closest("svg, table")
            ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
        }
      });
      const textes = [];
      for(let n = marche.nextNode(); n; n = marche.nextNode()) textes.push(n);
      for(const n of textes){
        const coupe = cesureChaine(n.nodeValue);
        if(coupe !== n.nodeValue) n.nodeValue = coupe;
      }
    }
  },
  /* Pour les essais et pour la voix. */
  mot: cesureMot,
  chaine: cesureChaine,
  oter(s){ return String(s).split(DOUX).join(""); }
};

/* =====================================================================
   3 bis. CHARGEMENT DES COURS A LA DEMANDE
   ---------------------------------------------------------------------
   COURS ne contient au demarrage que le catalogue : de quoi dresser la
   liste, remplir une fiche et compter les points a verifier. Le contenu
   des seances et leurs questions arrivent fichier par fichier, quand on
   ouvre le cours.

   Pourquoi : a cent trente-quatre cours, tout embarquer ferait un fichier
   de 9,5 Mo et vingt-huit megaoctets d'objets en memoire. Sur un telephone
   modeste, une application aussi lourde se fait vider de la memoire des
   qu'elle passe en arriere-plan, et se recharge entierement au retour.

   Comment : une balise <script src> plutot qu'un fetch. Dans un WebView
   Android la page vit sous file://, ou fetch est interdit par la politique
   d'origine mais ou le chargement d'un sous-script reste permis. Le
   fichier appelle EPOK.recevoir, qui verse ses champs dans l'objet de
   catalogue deja present : l'identite des objets ne change pas, et tout le
   code qui tient une reference a un cours continue de voir le meme.

   Si jamais un WebView refusait ce sous-script, l'application Android
   offre un second chemin : PontEpok.lireCours rend le texte du fichier,
   lu par le code Java qui, lui, a le droit d'ouvrir ses propres
   ressources. On ne l'evalue pas : le fichier produit par decouper.js est
   exactement EPOK.recevoir( ... ); et l'on n'en lit que la partie entre
   parentheses, par JSON.parse. Hors de l'application -- un navigateur,
   le site web -- ce pont n'existe pas et rien n'est tente.

   Le mode monobloc -- un seul fichier contenant tout, que l'assembleur
   sait encore produire -- se reconnait de lui-meme : si la premiere
   seance du premier cours porte deja son contenu, rien n'est a charger.
   ===================================================================== */
const EPOK = (function(){

  const DOSSIER = "cours/";
  const DELAI = 10000;          /* au-dela, on considere le fichier perdu */

  const charges = Object.create(null);
  const encours = Object.create(null);
  const perdus = Object.create(null);

  /* Monobloc : tout est deja la, rien ne sera jamais charge. */
  const monobloc = !!(COURS.length && COURS[0].seances.length
                      && typeof COURS[0].seances[0].contenu === "string");
  if(monobloc) COURS.forEach(c => { charges[c.id] = true; });

  function parId(id){
    for(let i = 0; i < COURS.length; i++){ if(COURS[i].id === id) return COURS[i]; }
    return null;
  }

  /* Verse le contenu recu dans les seances du catalogue. On ne remplace
     jamais l'objet : la fiche affichee et le quiz en cours tiennent des
     references dessus. */
  function recevoir(paquet){
    if(!paquet || !paquet.id) return;
    const c = parId(paquet.id);
    if(!c) return;
    (paquet.seances || []).forEach(recue => {
      const s = c.seances.find(x => x.numero === recue.numero);
      if(!s) return;
      s.problematique = recue.problematique;
      s.contenu = recue.contenu;
      s.anecdote = recue.anecdote;
      s.questions = (recue.questions || []).map((q, i) => VOILE.question(q, paquet.id + "#" + recue.numero + "#" + i));
    });
    charges[paquet.id] = true;
  }

  function estCharge(id){ return !!charges[id]; }
  function estPerdu(id){ return !!perdus[id]; }

  /* Charge un cours. La promesse rend vrai si le contenu est la, faux si
     le fichier manque ou n'a pas repondu -- jamais d'echec silencieux :
     l'ecran qui attendait affichera qu'il n'a pas pu lire ce cours. */
  function charger(id){
    if(charges[id]) return Promise.resolve(true);
    if(encours[id]) return encours[id];

    const promesse = new Promise(function(fini){
      const balise = document.createElement("script");
      let rendu = false;
      const rendre = ok => {
        if(rendu) return;
        rendu = true;
        clearTimeout(minuteur);
        if(!ok) perdus[id] = true;
        delete encours[id];
        fini(ok);
      };
      const minuteur = setTimeout(() => rendre(secours(id)), DELAI);
      balise.onload = () => rendre(charges[id] || secours(id));
      balise.onerror = () => rendre(secours(id));
      balise.src = DOSSIER + encodeURIComponent(id) + ".js";
      document.head.appendChild(balise);
    });
    encours[id] = promesse;
    return promesse;
  }

  /* Le second chemin, propre a l'application Android : le fichier est lu
     par le code Java et rendu tel quel. Rend vrai si le cours est arrive. */
  function secours(id){
    if(charges[id]) return true;
    if(typeof PontEpok === "undefined" || !PontEpok.lireCours) return false;
    try{
      const texte = PontEpok.lireCours(id);
      if(!texte) return false;
      const debut = texte.indexOf("(") + 1, fin = texte.lastIndexOf(")");
      if(debut <= 0 || fin <= debut) return false;
      recevoir(JSON.parse(texte.slice(debut, fin)));
    }catch(illisible){ return false; }
    return !!charges[id];
  }

  /* Charge plusieurs cours et rend la liste de ceux qui ont echoue. */
  function chargerTous(ids){
    return Promise.all(ids.map(id => charger(id).then(ok => ok ? null : id)))
                  .then(r => r.filter(Boolean));
  }

  return { recevoir, charger, chargerTous, estCharge, estPerdu,
           monobloc, DOSSIER };
})();

/* ---------- Badges de rang ----------

   Onze rangs, chacun avec sa SILHOUETTE et son MOTIF tire de l'histoire,
   de sorte qu'on reconnait un rang a sa forme avant de lire son nom :

     Bois         tablette de cire et stylet     (l'ecriture)
     Fer          epee                           (l'age du fer)
     Bronze       couronne de laurier            (le triomphe romain)
     Argent       temple grec                    (la cite)
     Or           couronne                       (la royaute)
     Platine      rose des vents                 (les grandes decouvertes)
     Diamant      rosace de cathedrale           (le gothique)
     Elite        fleur de lys                   (la monarchie)
     Master       plume sur un livre ouvert      (l'erudition)
     SuperMaster  aigle aux ailes deployees      (l'empire)
     God          soleil et sablier              (le temps lui-meme)

   Les trois niveaux d'un rang ne changent pas de forme : ils s'enrichissent.
     niveau 1   le badge nu
     niveau 2   un liseré clair court le long du cadre
     niveau 3   un halo derriere, des etincelles, un reflet plus vif
   Et trois petits losanges, sous le badge, disent le niveau d'un coup d'oeil :
   allumes en or autant que le niveau, eteints au-dela.

   Tout est calcule : une teinte de base par rang, dont on tire les clairs,
   les ombres et le liseré. Du relief par des degrades, pas d'image. Chaque
   badge porte ses propres identifiants de degrade (plusieurs sont affiches
   ensemble, et deux SVG qui partagent un id se volent leurs defs). */

let BADGE_N = 0;

function melangerTeinte(a, b, t){
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const x = p(a), y = p(b);
  return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join("");
}

/* Points d'un polygone regulier ou etoile autour de (32,31). */
function rayons(n, rExt, rInt, depart){
  const pts = [];
  for(let k = 0; k < n * (rInt ? 2 : 1); k++){
    const r = rInt ? (k % 2 ? rInt : rExt) : rExt;
    const a = (depart || -90) * Math.PI / 180 + k * Math.PI / (rInt ? n : n / 2);
    pts.push([32 + r * Math.cos(a), 31 + r * Math.sin(a)]);
  }
  return pts;
}
const polyD = pts => "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L") + " Z";
/* Miroir autour de l'axe vertical, en inversant l'ordre : deux sous-trajets
   de sens opposes s'annuleraient (regle du zero) la ou ils se recouvrent. */
const miroir = pts => pts.map(p => [64 - p[0], p[1]]).reverse();

/* Quatre branches d'une etincelle, centree en (x,y). */
const etincelle = (x, y, r) =>
  `<path d="M${x} ${y - r} Q${x + r * .16} ${y - r * .16} ${x + r} ${y} Q${x + r * .16} ${y + r * .16} ${x} ${y + r}
     Q${x - r * .16} ${y + r * .16} ${x - r} ${y} Q${x - r * .16} ${y - r * .16} ${x} ${y - r} Z"
     fill="#fff" stroke="rgba(110,82,24,.6)" stroke-width=".5" stroke-linejoin="round"/>`;

/* k : indice du rang (0 = Bois) ; niveau : 1, 2 ou 3 ; taille : largeur en px. */
function dessinerBadge(k, niveau, taille){
  const B = BADGES[k], nom = RANGS[k].nom;
  const n = ++BADGE_N, id = "bd" + n;
  const t = taille || 46, h = Math.round(t * 72 / 64);
  const M = B.M;
  const clair = melangerTeinte(M, "#ffffff", .62), tres = melangerTeinte(M, "#ffffff", .85);
  const sombre = melangerTeinte(M, "#000000", .42), bord = melangerTeinte(M, "#000000", .66);
  const champ = B.champ || melangerTeinte(M, "#000000", .52);
  const champ2 = melangerTeinte(champ, "#000000", .45);
  const motif = B.motif, motif2 = melangerTeinte(motif, M, .45);
  const forme = B.forme();
  const lisere = melangerTeinte(M, "#ffffff", .8);

  const pions = [0, 1, 2].map(j => {
    const x = 22 + j * 10, allume = j < niveau;
    return `<path d="M${x} 63.6 L${x + 3.8} 67.4 L${x} 71.2 L${x - 3.8} 67.4 Z"
      fill="${allume ? `url(#${id}p)` : "rgba(128,118,104,.34)"}"
      stroke="${allume ? "#7a5a14" : "rgba(128,118,104,.85)"}" stroke-width=".7" stroke-linejoin="round"/>`;
  }).join("");

  return `<span class="emb" role="img" aria-label="Rang ${nom}, niveau ${niveau}" style="width:${t}px;height:${h}px">
  <svg viewBox="0 0 64 72" width="${t}" height="${h}" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="${id}c" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${tres}"/><stop offset=".3" stop-color="${M}"/>
        <stop offset=".52" stop-color="${sombre}"/><stop offset=".75" stop-color="${M}"/>
        <stop offset="1" stop-color="${clair}"/></linearGradient>
      <linearGradient id="${id}f" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${champ2}"/><stop offset="1" stop-color="${champ}"/></linearGradient>
      <linearGradient id="${id}m" x1="0" y1="0" x2="0" y2="1">

Object.assign(FICHES_BREVET, {"b-guerre-1914":{"dates":"1914-1919","essentiel":[{"titre":"Une guerre de masse d’une violence inédite","html":"\n<p>À l’été 1914, l’Europe bascule dans la guerre. D’un côté, la <strong>Triple-Entente</strong> : la France, le Royaume-Uni et la Russie ; de l’autre, les <strong>puissances centrales</strong> : l’Allemagne et l’Autriche-Hongrie, rejointes par l’Empire ottoman. Des millions d’hommes sont mobilisés.</p>\n<p>Après quelques mois de guerre de mouvement, le front se fige à la fin de 1914 : c’est la <strong>guerre de position</strong>. Les soldats, que l’on surnomme en France les <strong>poilus</strong>, vivent dans des <strong>tranchées</strong> creusées de la mer du Nord à la Suisse, dans la boue, le froid et la peur.</p>\n<p>Les armes industrielles, artillerie lourde, mitrailleuses, gaz employés à partir de 1915, puis chars et avions, rendent les combats très meurtriers. La bataille de <strong>Verdun</strong>, de février à décembre 1916, fait plus de 300 000 morts français et allemands. En 1917, après l’échec sanglant de l’offensive du Chemin des Dames, des soldats français refusent de monter à l’assaut : ce sont les <strong>mutineries</strong>.</p>"},{"titre":"Les civils dans la guerre totale","html":"\n<p>La guerre mobilise toute la société : c’est une <strong>guerre totale</strong>. L’État dirige une <strong>économie de guerre</strong> : les usines fabriquent des obus et des canons, et l’on emprunte de l’argent aux citoyens. Les <strong>femmes</strong> remplacent les hommes partis au front, dans les champs et dans les usines d’armement, où on les surnomme les munitionnettes. Les colonies fournissent aussi des soldats et des travailleurs.</p>\n<p>Pour que le pays tienne, l’État contrôle l’information : la <strong>censure</strong> supprime les nouvelles qui pourraient décourager, la <strong>propagande</strong> exalte le courage des soldats et la haine de l’ennemi. En France, les partis politiques s’unissent dans l’<strong>Union sacrée</strong>.</p>\n<p>Les civils sont aussi des victimes. Le nord-est de la France et la Belgique sont occupés, des villes sont bombardées. Dans l’Empire ottoman, le gouvernement des Jeunes-Turcs organise en 1915-1916 l’extermination des <strong>Arméniens</strong>, accusés de soutenir la Russie : plus d’un million de personnes sont tuées. C’est un <strong>génocide</strong>.</p>"},{"titre":"1917-1919 : de la révolution russe à la paix","html":"\n<p>L’année <strong>1917</strong> est un tournant. En avril, les <strong>États-Unis</strong> entrent en guerre aux côtés de l’Entente. En Russie, épuisée par la guerre, une première révolution renverse le tsar Nicolas II en février ; en octobre, les <strong>bolcheviks</strong> de <strong>Lénine</strong> prennent le pouvoir. Ils signent une paix séparée avec l’Allemagne en mars 1918.</p>\n<p>Épuisée à son tour, l’Allemagne signe l’<strong>armistice</strong> le <strong>11 novembre 1918</strong>. Le <strong>traité de Versailles</strong>, signé le 28 juin 1919, la désigne comme responsable de la guerre : elle perd l’Alsace-Moselle, doit payer des réparations et réduire son armée. Une <strong>Société des Nations</strong> (SDN) est créée pour préserver la paix.</p>\n<p>Le bilan est terrible : près de 10 millions de soldats tués, dont près de 1,4 million de Français, et des millions de blessés, comme les <strong>gueules cassées</strong>, défigurés. Dans presque toutes les communes de France, un monument aux morts rappelle ce sacrifice.</p>"}],"retenir":"La Première Guerre mondiale (1914-1918) est une guerre totale : elle mobilise les soldats, mais aussi les civils, l’économie et les esprits. Elle est marquée par une violence de masse contre les combattants, comme à Verdun en 1916, et contre les civils, avec le génocide des Arméniens. Elle bouleverse l’Europe : révolutions russes de 1917, chute des empires, traité de Versailles en 1919.","astuces":["Pour définir la guerre totale, pensez aux 3 « tout » : tous les hommes (soldats et civils), toute l’économie, tous les esprits (propagande).","Ne confondez pas l’armistice (11 novembre 1918), qui arrête les combats, et le traité de Versailles (28 juin 1919), qui fait la paix.","Verdun, c’est 1916 : une année entière, de février à décembre, pour presque rien gagner. C’est le symbole de l’enfer des tranchées."],"reperes":[{"date":"1914-1918","ev":"Première Guerre mondiale","cle":true},{"date":"1915-1916","ev":"génocide des Arméniens"},{"date":"1916","ev":"bataille de Verdun","cle":true},{"date":"1917","ev":"révolutions russes","cle":true},{"date":"11 novembre 1918","ev":"armistice","cle":true},{"date":"28 juin 1919","ev":"traité de Versailles"}],"notions":[{"terme":"Guerre totale","def":"Guerre qui mobilise toutes les forces d’un pays : les soldats, mais aussi les civils, l’économie et les esprits."},{"terme":"Guerre de position","def":"Guerre où les armées, enterrées dans des tranchées, se font face sans parvenir à avancer."},{"terme":"Poilu","def":"Surnom donné aux soldats français de la Première Guerre mondiale."},{"terme":"Violence de masse","def":"Violence qui frappe un très grand nombre de personnes, soldats ou civils."},{"terme":"Économie de guerre","def":"Économie dirigée par l’État pour produire avant tout des armes et des munitions."},{"terme":"Propagande","def":"Moyens utilisés pour influencer l’opinion : affiches, journaux, films, discours."},{"terme":"Censure","def":"Contrôle par l’État de ce qui est publié, pour supprimer les informations jugées dangereuses."},{"terme":"Union sacrée","def":"Union de tous les partis politiques français pour défendre le pays pendant la guerre."},{"terme":"Génocide","def":"Extermination volontaire et organisée d’un peuple, en raison de ce qu’il est."},{"terme":"Armistice","def":"Accord qui met fin aux combats, en attendant la signature d’un traité de paix."},{"terme":"Bolcheviks","def":"Révolutionnaires communistes russes, dirigés par Lénine, qui prennent le pouvoir en octobre 1917."},{"terme":"Gueules cassées","def":"Soldats gravement blessés au visage pendant la guerre."}],"acteurs":[{"nom":"Lénine","role":"Chef des bolcheviks, il prend le pouvoir en Russie en octobre 1917."},{"nom":"Georges Clemenceau","role":"Président du Conseil à partir de novembre 1917, surnommé « le Père la Victoire »."},{"nom":"Philippe Pétain","role":"Général qui dirige la défense de Verdun au début de la bataille, en 1916, puis l’armée française après les mutineries de 1917."},{"nom":"Woodrow Wilson","role":"Président des États-Unis, qui fait entrer son pays dans la guerre en 1917 et propose la création de la SDN."},{"nom":"Nicolas II","role":"Dernier tsar de Russie, renversé par la révolution de février 1917."}],"questions":[{"enonce":"Qu’appelle-t-on la guerre de position ?","options":["Une guerre où les armées, enterrées dans des tranchées, ne parviennent plus à avancer","Une guerre menée uniquement sur mer","Les premières semaines de la guerre, où les armées avancent vite","Une guerre menée seulement par des avions"],"c":"YW8BkQkgCKhOEazEfTBZDmask7RXsUxMFCdr/baK9S4m+FjRxzJ8wJmunTGUBwX9aEv+q8JRnPMw+CgUvuweTJ1VG73mvt7KBOgF7gQnUMl/7K3h9Aoev29kTR4TNwJTzUMY342nkWBAOW7Si2n7e1/oRnNuP132WJmrOjIayWec8uzGQ//YHnDJG5hOBZIQIC9Ibv0LQ1ImO7YAdKee5S+QjpLvhLPu3JM5OYKQ0uiZvWpa0rbKosjC4gufvogMpWgSRFGpeUHjpHNlRxUTMO1Ft8GhMY9rkgmoVw=="},{"enonce":"Quand se déroule la bataille de Verdun ?","options":["En 1914","En 1916","En 1918","En 1919"],"c":"oQvSNpjMgcvZDzIIV3vlY6FsU0y72BppJ2MI1jyWDo7A/H9mOAlnmtFhXeaCkY0pndsMK7VVzp52hi00cXQAXvXY34Uj3EgrdG19z005+YB7Uk8l0M5AykFlkIlkrg46c3vsnZD6R3/EbTP9X2fi39gTag4+8EUAYRYmDyRmGRflXQeC2hZSJhsijTO/u4ZdzIiQpOZ57/pKUrNJl8MF8U0uqX/gHSw4XdEefhU6LKuC9YRCtMSt7oYG8JenDfX1aFJKoWOaOQn6"},{"enonce":"Pourquoi parle-t-on de guerre totale ?","options":["L’économie et les usines sont mobilisées pour la guerre","Les civils, et notamment les femmes, participent à l’effort de guerre","Elle ne concerne que les soldats du front","Elle dure moins d’un an"],"c":"vnTuXuDqrnMCtAfRLURnUlNZ8pXyVhw
