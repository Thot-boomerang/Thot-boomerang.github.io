/* ==========================================================================
   Cartes EPOK : un pli de 3 cartes de personnages historiques par jour,
   ouvert « facon FIFA », et l'album de la collection.

   Les cartes (CARTES, z0l0_cartes_donnees.js) sont des images : la grande
   pour l'ouverture et la fiche, la miniature pour l'album. La version web
   les sert a cote de la page (cartes/) ; l'APK les telecharge depuis le
   site, pour ne pas peser 30 Mo de plus.

   Le pli du jour est tire au sort a partir d'une graine propre au joueur
   et de la date : recharger la page redonne les memes cartes. Une fois
   ouvert, il est inscrit dans la progression (ETAT.collection.plis), qui
   suit le joueur d'un appareil a l'autre. Les cartes ne rapportent aucun
   point : le classement reste celui du travail, pas de la chance.
   ========================================================================== */

const RARETES = [
  { k: "commune",     nom: "Commune",     c: "#b27a3d" },
  { k: "peu-commune", nom: "Peu commune", c: "#4d7fb0" },
  { k: "rare",        nom: "Rare",        c: "#2e9150" },
  { k: "epique",      nom: "Épique",      c: "#8a45c4" },
  { k: "legendaire",  nom: "Légendaire",  c: "#d9a62e" },
  { k: "mythique",    nom: "Mythique",    c: "#d22f36" }
];
/* Chances, en pour mille, des cartes 1 et 2 ; la 3e est garantie rare ou
   mieux, comme le meilleur emplacement d'un pack. */
const PLI_CHANCES = [550, 270, 120, 45, 12, 3];
const PLI_CHANCES_3E = [0, 0, 700, 210, 70, 20];
const PLI_NB = 3;
const CARTES_SITE = "https://thot-boomerang.github.io/epok/cartes/";

/* « <img » n'est jamais ecrit tel quel dans le code : le prechargeur du
   navigateur, qui parcourt la page en avance, le prenait pour une vraie
   image et demandait l'adresse « ${...} » encore non calculee. */
const IMG = "<" + "img";
function rangRarete(k){ return RARETES.findIndex(r => r.k === k); }
function carteN(n){ return CARTES_PAR_N[n] || null; }
const CARTES_PAR_N = {};
(typeof CARTES !== "undefined" ? CARTES : []).forEach(c => { CARTES_PAR_N[c.n] = c; });
function dossierCartes(){
  return (typeof location !== "undefined" && location.protocol === "file:") ? CARTES_SITE : "cartes/";
}
function imageCarte(n, mini){ return dossierCartes() + (mini ? "mini/" : "grandes/") + n + ".webp"; }
/* Zones de la carte (en pixels de l'original, 1170 x 2600) montrees comme
   indices pendant la « sortie » : decoupees dans l'image elle-meme, donc
   toujours exactes. */
const CARTE_L = 1170, CARTE_H = 2600;
const ZONES = {
  dates:    { x: 240, y: 1345, l: 690, h: 135 },
  pv:       { x: 830, y: 165,  l: 245, h: 155 },
  portrait: { x: 200, y: 390,  l: 750, h: 905 }
};
function decoupe(n, z, classe){
  const Z = ZONES[z];
  return `<span class="ouv-decoupe ${classe || ""}" style="aspect-ratio:${Z.l}/${Z.h};background-image:url('${imageCarte(n)}');`
    + `background-size:${(CARTE_L / Z.l * 100).toFixed(2)}% auto;`
    + `background-position:${(Z.x / (CARTE_L - Z.l) * 100).toFixed(2)}% ${(Z.y / (CARTE_H - Z.h) * 100).toFixed(2)}%"></span>`;
}

/* ---------- Ce qui est garde ---------- */

function nettoyerCollection(c){
  const r = { graine: "", plis: {} };
  if(!c || typeof c !== "object") return r;
  if(typeof c.graine === "string" && /^[0-9a-z]{4,16}$/.test(c.graine)) r.graine = c.graine;
  Object.keys(c.plis || {}).forEach(d => {
    const p = c.plis[d];
    if(/^\d{4}-\d{2}-\d{2}$/.test(d) && Array.isArray(p) && p.length === PLI_NB && p.every(n => Number.isInteger(n) && carteN(n)))
      r.plis[d] = p.slice();
  });
  return r;
}
/* Deux appareils : les plis s'additionnent ; un meme jour ouvert des deux
   cotes garde celui de l'appareil local. */
function fusionnerCollection(l, d){
  const a = nettoyerCollection(l), b = nettoyerCollection(d);
  return { graine: a.graine || b.graine, plis: Object.assign({}, b.plis, a.plis) };
}
function collection(){
  if(!ETAT.collection) ETAT.collection = nettoyerCollection(null);
  if(!ETAT.collection.graine) ETAT.collection.graine = Math.random().toString(36).slice(2, 10) || "epok";
  return ETAT.collection;
}
/* { numero: nombre d'exemplaires } */
function cartesPossedees(){
  const m = {};
  Object.values(collection().plis).forEach(p => p.forEach(n => { m[n] = (m[n] || 0) + 1; }));
  return m;
}
function scoreCollection(m){
  return Object.keys(m || cartesPossedees()).reduce((s, n) => s + ((carteN(+n) || {}).pv || 0), 0);
}

/* ---------- Le tirage ---------- */

/* Generateur pseudo-aleatoire reproductible (mulberry32) seme par une
   empreinte de la chaine (cyrb53). */
function hasardSeme(texte){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i = 0; i < texte.length; i++){
    const ch = texte.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  let a = (Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909)) >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function tirerRarete(alea, chances){
  const total = chances.reduce((s, x) => s + x, 0);
  let x = alea() * total;
  for(let i = 0; i < chances.length; i++){ if(x < chances[i]) return i; x -= chances[i]; }
  return 0;
}
/* Les 3 cartes d'un jour, sans doublon dans le meme pli. Une rarete sans
   carte (tant que la collection n'est pas complete) cede a la suivante en
   dessous. */
function tirerPli(date){
  const alea = hasardSeme(collection().graine + "|" + date), pli = [];
  for(let i = 0; i < PLI_NB; i++){
    let r = tirerRarete(alea, i === PLI_NB - 1 ? PLI_CHANCES_3E : PLI_CHANCES);
    let pile = [];
    for(; r >= 0; r--){ pile = CARTES.filter(c => c.r === RARETES[r].k && pli.indexOf(c.n) < 0); if(pile.length) break; }
    if(pile.length) pli.push(pile[Math.floor(alea() * pile.length)].n);
  }
  return pli;
}
function pliDuJour(){
  const d = aujourdhui();
  return collection().plis[d] || tirerPli(d);
}
function pliOuvert(){ return !!collection().plis[aujourdhui()]; }

/* ---------- L'onglet ---------- */

/* vue : « miennes » (mes cartes seulement) ou « toutes » (les absentes en
   grise). Toujours de la meilleure a la moins bonne : PV, puis rarete. */
const ALBUM = { filtre: "*", vue: "miennes" };
function ordreAlbum(a, b){ return (b.pv - a.pv) || (rangRarete(b.r) - rangRarete(a.r)) || (a.n - b.n); }

function miniCarte(n, nb, classe){
  const c = carteN(n), ri = rangRarete(c.r);
  return `<button type="button" class="c-mini ${classe || ""}" data-action="carte-voir" data-n="${n}" style="--rar:${RARETES[ri].c}"
      aria-label="${esc(c.nom)}, ${RARETES[ri].nom.toLowerCase()}, ${c.pv} PV">
    <span class="c-cadre">${IMG} class="c-img" src="${imageCarte(n, true)}" alt="" loading="lazy" decoding="async">
      <span class="c-repli"><b>${esc(c.nom)}</b><small>PV ${c.pv}</small></span></span>
    ${nb > 1 ? `<span class="c-nb" aria-label="${nb} exemplaires">&times;${nb}</span>` : ""}</button>`;
}
/* Carte pas encore trouvee, dans la vue « toutes » : grisee. */
function miniGrise(n){
  const c = carteN(n), ri = rangRarete(c.r);
  return `<span class="c-mini c-grise" style="--rar:${RARETES[ri].c}" aria-label="${esc(c.nom)}, pas encore trouvée">
    <span class="c-cadre">${IMG} class="c-img" src="${imageCarte(n, true)}" alt="" loading="lazy" decoding="async">
      <span class="c-repli"><b>${esc(c.nom)}</b><small>PV ${c.pv}</small></span></span></span>`;
}

function rendreCartes(){
  const vue = document.getElementById("vue-cartes");
  if(!vue) return;
  if(typeof CARTES === "undefined" || !CARTES.length){ vue.innerHTML = `<div class="carte"><p>Les cartes arrivent bientôt.</p></div>`; return; }
  const m = cartesPossedees(), ouvert = pliOuvert(), pli = pliDuJour();
  const meilleure = Math.max(...pli.map(n => rangRarete(carteN(n).r)));
  const parts = [];
  parts.push(`<div class="carte pli-carte${ouvert ? " ouvert" : ""}" style="--rar:${RARETES[meilleure].c}">
    <p class="capitales" style="margin:0 0 8px">Pack du jour${aideBouton("cartes")}</p>
    ${ouvert
      ? `<div class="pli-jour">${pli.map(n => miniCarte(n, 1)).join("")}</div>
         <p class="minuscule" style="margin:10px 0 0">Nouveau pack dans ${typeof qjAvantMinuit === "function" ? qjAvantMinuit() : "quelques heures"}.</p>`
      : `<button type="button" class="pli-ferme" data-action="pli-ouvrir" aria-label="Ouvrir le pack du jour : 3 cartes">
           <span class="pli-lueur" aria-hidden="true"></span><span class="pli-papier" aria-hidden="true"><span class="pli-sceau">E</span></span></button>
         <p class="pli-texte"><span class="bulle bulle-or">3 cartes</span> La lueur trahit la meilleure&#8239;!</p>
         <button class="bouton-plein" data-action="pli-ouvrir">Ouvrir le pack</button>`}
  </div>`);

  const total = CARTES.length, nbDiff = Object.keys(m).length;
  const liste = CARTES.filter(c => (ALBUM.filtre === "*" || c.r === ALBUM.filtre) && (ALBUM.vue === "toutes" || m[c.n]))
    .slice().sort(ordreAlbum);
  parts.push(`<div class="carte">
    <p class="capitales" style="margin:0 0 4px">Album</p>
    <p class="album-chiffres"><b>${nbDiff}</b>/${total} cartes &#8226; <b>${scoreCollection(m).toLocaleString("fr-FR")}</b> PV</p>
    <div class="st-classes album-filtres" role="group" aria-label="Filtrer par rareté">
      <button class="st-puce${ALBUM.filtre === "*" ? " actif" : ""}" data-action="album-filtre" data-r="*">Toutes</button>
      ${RARETES.map(r => { const n = CARTES.filter(c => c.r === r.k).length, a = CARTES.filter(c => c.r === r.k && m[c.n]).length;
        return `<button class="st-puce${ALBUM.filtre === r.k ? " actif" : ""}" data-action="album-filtre" data-r="${r.k}" style="--rar:${r.c}">${r.nom} ${a}/${n}</button>`; }).join("")}
    </div>
    <div class="album-vues" role="group" aria-label="Cartes affichées">
      <button type="button" data-action="album-vue" data-vue="miennes" aria-pressed="${ALBUM.vue === "miennes"}">Mes cartes</button>
      <button type="button" data-action="album-vue" data-vue="toutes" aria-pressed="${ALBUM.vue === "toutes"}">Toutes les cartes</button>
    </div>
    <p class="minuscule" style="margin:0 0 10px">De la meilleure à la moins bonne${ALBUM.vue === "toutes" ? "&#8239;; en gris, celles qui vous manquent" : ""}.</p>
    ${liste.length ? `<div class="album">${liste.map(c => m[c.n] ? miniCarte(c.n, m[c.n]) : miniGrise(c.n)).join("")}</div>`
      : `<p class="secondaire" style="margin:6px 0 0">${nbDiff ? "Aucune carte de cette rareté pour l’instant." : "Pas encore de carte&#8239;: ouvrez votre premier pack."}</p>`}
  </div>`);
  vue.innerHTML = parts.join("");
}

/* Fiche d'une carte : la grande image, en bulle. */
function voirCarte(n, el){
  const c = carteN(n);
  if(!c) return;
  const nb = cartesPossedees()[n] || 0, r = RARETES[rangRarete(c.r)];
  ouvrirEnBulle("fenetre-carte", `<button class="bouton petit discret fr-fermer" data-action="carte-fermer">&#10005; Fermer</button>
    <div class="c-grande" style="--rar:${r.c}"><span class="c-cadre">${IMG} class="c-img" src="${imageCarte(n)}" alt="${esc(c.nom)}">
      <span class="c-repli"><b>${esc(c.nom)}</b><small>PV ${c.pv}</small></span></span></div>
    <p class="minuscule" style="text-align:center;margin:10px 0 0">${r.nom} &#8226; PV ${c.pv}${nb > 1 ? ` &#8226; ${nb} exemplaires` : ""}</p>`, "carte fenetre-carte", el);
}

/* ---------- L'ouverture, facon FIFA ----------
   Le pli, dont la lueur annonce la meilleure carte ; on brise le sceau ;
   les cartes viennent de la plus faible a la plus forte. Commune et peu
   commune se retournent aussitot, la rare un peu plus lentement ; a partir
   d'epique, la « sortie » : faisceaux de la couleur, puis les indices
   (dates, nationalite, PV) avant la carte, qui se retourne lentement. */
let OUV = null;

function ouvrirPli(){
  if(OUV) return;
  const avant = cartesPossedees(), pli = pliDuJour();
  const ordre = pli.slice().sort((a, b) => rangRarete(carteN(a).r) - rangRarete(carteN(b).r) || carteN(a).pv - carteN(b).pv);
  /* Inscrit des l'ouverture : quitter en cours de route garde les cartes. */
  collection().plis[aujourdhui()] = pli;
  sauverEtat();
  const meilleure = rangRarete(carteN(ordre[ordre.length - 1]).r);
  OUV = { ordre, i: -1, avant, minuteurs: [] };
  const v = document.createElement("div");
  v.id = "ouverture-pli";
  v.className = "ouv";
  v.setAttribute("role", "dialog"); v.setAttribute("aria-modal", "true"); v.setAttribute("aria-label", "Ouverture du pack du jour");
  v.style.setProperty("--rar", RARETES[meilleure].c);
  v.innerHTML = `<button class="bouton petit discret ouv-passer" data-action="ouv-passer">Passer &#187;</button>
    <div class="ouv-scene" data-action="ouv-suite">
      <div class="ouv-pli"><span class="pli-lueur grande" aria-hidden="true"></span>
        <span class="pli-papier grand" aria-hidden="true"><span class="pli-sceau">E</span></span></div>
      <p class="ouv-consigne">Touchez le sceau</p>
    </div>`;
  document.body.appendChild(v);
  document.body.classList.add("ouv-active");
}

function ouvMinuteur(f, ms){ if(OUV) OUV.minuteurs.push(setTimeout(f, ms)); }
function ouvArreter(){ if(OUV) OUV.minuteurs.forEach(clearTimeout), OUV.minuteurs = []; }

function ouvSuite(){
  if(!OUV) return;
  const scene = document.querySelector("#ouverture-pli .ouv-scene");
  if(!scene) return;
  /* Le sceau : il eclate, puis vient la 1re carte. */
  if(OUV.i === -1){
    if(OUV.casse) return;
    OUV.casse = true;
    const sceau = scene.querySelector(".pli-sceau"), r = sceau.getBoundingClientRect();
    if(typeof eclatEnPlus === "function" && typeof anime === "function"){
      const x = r.left + r.width / 2, y = r.top + r.height / 2, coul = getComputedStyle(document.getElementById("ouverture-pli")).getPropertyValue("--rar");
      for(let i = 0; i < 16; i++){
        const a = (i / 16) * Math.PI * 2, d = 70 + Math.random() * 60;
        const g = eclatEnPlus("eclat-goutte ouv-goutte", x, y, 5 + Math.random() * 6);
        g.style.background = coul;
        anime(g, [{ transform: "translate(0,0)", opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) scale(.2)`, opacity: 0 }],
          { duration: 650, easing: "cubic-bezier(.12,.75,.3,1)" });
        setTimeout(() => g.remove(), 700);
      }
    }
    scene.querySelector(".ouv-pli").classList.add("casse");
    ouvMinuteur(() => ouvCarte(0), 650);
    return;
  }
  const carte = scene.querySelector(".ouv-carte");
  if(carte && !carte.classList.contains("revelee")) return;   // on ne saute pas une sortie en cours : « Passer » est la pour ca
  if(OUV.i < OUV.ordre.length - 1) ouvCarte(OUV.i + 1);
  else ouvBilan();
}

function ouvCarte(i){
  if(!OUV) return;
  ouvArreter();
  OUV.i = i;
  const n = OUV.ordre[i], c = carteN(n), ri = rangRarete(c.r), r = RARETES[ri];
  const scene = document.querySelector("#ouverture-pli .ouv-scene");
  const v = document.getElementById("ouverture-pli");
  v.style.setProperty("--rar", r.c);
  v.dataset.niveau = ri;
  const sortie = ri >= 3;
  scene.innerHTML = `${sortie ? `<div class="ouv-faisceaux" aria-hidden="true"></div>` : ""}
    <p class="ouv-compte">${i + 1}/${OUV.ordre.length}</p>
    ${sortie ? `<div class="ouv-indices" aria-live="polite"></div>` : ""}
    <div class="ouv-carte${ri >= 4 ? " holo" : ""}${sortie ? " cachee" : ""}">
      <div class="ouv-face ouv-dos"><span>EPOK</span></div>
      <div class="ouv-face ouv-recto"><span class="c-cadre">${IMG} class="c-img" src="${imageCarte(n)}" alt="${esc(c.nom)}">
        <span class="c-repli"><b>${esc(c.nom)}</b><small>PV ${c.pv}</small></span></span></div>
    </div>
    <p class="ouv-legende"></p>`;
  const el = scene.querySelector(".ouv-carte");
  const retourner = (attente, duree) => ouvMinuteur(() => {
    el.style.setProperty("--duree", duree + "ms");
    el.classList.add("tournee");
    ouvMinuteur(() => ouvRevelee(n), duree);
  }, attente);
  if(ri <= 1) retourner(120, 380);
  else if(ri === 2) retourner(450, 800);
  else {
    /* Les indices : la bande des dates et de la nationalite, les PV, puis
       le portrait flou qui se precise. */
    const ind = scene.querySelector(".ouv-indices");
    const indices = [decoupe(n, "dates", "ouv-indice"), decoupe(n, "pv", "ouv-indice petit"), decoupe(n, "portrait", "ouv-indice portrait")];
    indices.forEach((h, k) => ouvMinuteur(() => { ind.insertAdjacentHTML("beforeend", h); }, 500 + k * 1000));
    ouvMinuteur(() => { ind.classList.add("part"); el.classList.remove("cachee"); }, 500 + indices.length * 1000 + 300);
    retourner(500 + indices.length * 1000 + 900, 1200);
  }
}

function ouvRevelee(n){
  if(!OUV) return;
  const el = document.querySelector("#ouverture-pli .ouv-carte");
  if(el) el.classList.add("revelee");
  const leg = document.querySelector("#ouverture-pli .ouv-legende");
  const c = carteN(n), dejaN = OUV.ordre.slice(0, OUV.i).filter(x => x === n).length + (OUV.avant[n] || 0);
  /* Deja dans l'album : un tampon « Deja tiree » en plein milieu. */
  if(dejaN && el) el.querySelector(".ouv-recto").insertAdjacentHTML("beforeend", `<span class="c-tampon" aria-hidden="true">Déjà tirée</span>`);
  if(leg) leg.innerHTML = `<span class="ouv-rar">${RARETES[rangRarete(c.r)].nom}</span>${dejaN ? ` <span class="c-nb en-ligne">&times;${dejaN + 1}</span>` : ` <span class="bulle bulle-or">Nouvelle&#8239;!</span>`}
    <span class="ouv-toucher">Touchez pour continuer</span>`;
}

function ouvBilan(){
  if(!OUV) return;
  ouvArreter();
  OUV.i = OUV.ordre.length;
  const v = document.getElementById("ouverture-pli");
  v.dataset.niveau = "bilan";
  const scene = v.querySelector(".ouv-scene");
  scene.removeAttribute("data-action");
  scene.innerHTML = `<p class="ouv-titre">Pack du jour</p>
    <div class="pli-jour">${OUV.ordre.map((n, k) => miniCarte(n, 1, (OUV.avant[n] || OUV.ordre.slice(0, k).indexOf(n) >= 0) ? "deja" : "neuve")).join("")}</div>
    <button class="bouton-plein" data-action="ouv-fermer" style="margin-top:18px">Ranger dans l’album</button>`;
  const passer = v.querySelector(".ouv-passer"); if(passer) passer.remove();
}

function fermerOuverture(){
  ouvArreter();
  OUV = null;
  const v = document.getElementById("ouverture-pli");
  if(v) v.remove();
  document.body.classList.remove("ouv-active");
  if(typeof sauverEtat === "function") sauverEtat(true);
  if(typeof rendre === "function") rendre();
}

function actionCartes(a, el){
  if(a === "pli-ouvrir"){ ouvrirPli(); return true; }
  if(a === "ouv-suite"){ ouvSuite(); return true; }
  if(a === "ouv-passer"){ ouvBilan(); return true; }
  if(a === "ouv-fermer"){ fermerOuverture(); return true; }
  if(a === "carte-voir"){ if(!OUV) voirCarte(+el.dataset.n, el); return true; }
  if(a === "carte-fermer"){ fermerBulle("fenetre-carte"); return true; }
  if(a === "album-filtre"){ ALBUM.filtre = el.dataset.r; rendreCartes(); return true; }
  if(a === "album-vue"){ ALBUM.vue = el.dataset.vue === "toutes" ? "toutes" : "miennes"; rendreCartes(); return true; }
  return false;
}

/* Une image absente (APK hors ligne, carte pas encore publiee) laisse
   place a un recto dessine : nom, dates et PV sur la couleur de la rarete.
   Ecoute globale, en capture : la page n'a aucun attribut onerror (la
   politique de securite du site les interdit). */
if(typeof document !== "undefined") document.addEventListener("error", ev => {
  const t = ev.target;
  if(t && t.classList && t.classList.contains("c-img")) t.closest(".c-cadre").classList.add("sans-image");
}, true);
/* =====================================================================
   4. LOGIQUE DE L'APPLICATION
   ---------------------------------------------------------------------
   Sommaire :
     4.1  Reglages et etat persistant (localStorage + export/import)
     4.2  Progression : lue, validee, fil conseille, serie
     4.3  Utilitaires d'affichage
     4.4  Onglet Accueil
     4.5  Onglet Cours (catalogue, frise, fiche, lecture)
     4.6  Moteur de QCM (construction, validation, correction)
     4.7  Onglet Quiz (QCM de seance et quiz compose)
     4.8  Navigation, defilement et evenements

   PRINCIPE DE PARCOURS
   ---------------------------------------------------------------------
   Aucune seance n'est jamais verrouillee. On peut ouvrir la cinquieme
   avant la deuxieme : le programme d'un cours est un ordre conseille,
   pas une serrure. En contrepartie, l'application tient deux etats
   distincts et les montre partout :
       non lue   — jamais ouverte
       lue       — lue, mais le QCM n'a pas ete passe
       validee   — QCM passe
   Sauter des seances ne les marque donc jamais comme faites : elles
   restent explicitement << non lues >>, et un bandeau le rappelle en
   tete de toute lecture prise hors du fil.
   ===================================================================== */

/* ---------- 4.1  Reglages et etat persistant ---------- */

/* Rythme conseille : l'accueil rappelle qu'une seance a deja ete lue
   aujourd'hui. C'est un rappel, non un verrou : rien n'est bloque. */
const UNE_SEANCE_PAR_JOUR = true;

/* Nombre de seances par cours, et donc duree d'une << semaine Epok >> :
   une semaine se compte en seances, pas en jours de calendrier. */
const SEANCES_PAR_COURS = 6;

/* Trois crans de corps de texte. Lire huit cents mots sur un telephone
   au fond d'une salle des profs n'appelle pas la meme taille que le
   soir dans un fauteuil. */
const ECHELLES = [0.9, 1, 1.15];

/* Les deux polices de lecture. << ecran >> est celle du systeme : ni
   chargee, ni choisie, c'est celle que le lecteur a sous les yeux toute
   la journee, donc celle a laquelle son oeil est fait. Elle est le
   defaut parce qu'une lineale a graisse uniforme garde ses delies a dix-
   sept pixels la ou une serif a forte modulation les perd. << papier >>
   rend la serif d'origine a qui prefere le livre a l'ecran. */
const POLICES = [["ecran", "écran"], ["papier", "papier"]];

const CLE_STOCKAGE = "epok.progression.v1";
/* L'application s'est d'abord appelee Clio : on recupere la progression
   enregistree sous l'ancienne cle, puis on la reecrit sous la nouvelle. */
const CLE_ANCIENNE = "clio.progression.v1";

/* Etat vierge. Toute lecture de l'etat passe par cet objet de reference,
   ce qui evite les undefined lors d'une montee de version.

   Une seance enregistree vaut :
     { lu:"AAAA-MM-JJ" }                        seance lue, QCM non passe
     { lu, date, justes, total, tentatives, meilleur }   seance validee
   Un cours porte en plus, une fois l'epreuve finale tentee :
     epreuve:{ date, justes, total, tentatives, meilleur }
     maitrise:"AAAA-MM-JJ"    jour du premier sans-faute a l'epreuve
   Les enregistrements des versions precedentes n'ont pas de champ << lu >>
   mais ont un champ << justes >> : ils sont donc lus comme valides, ce
   qui est exact. */
function etatVierge(){
  return {
    v: 2,
    reglages: {
      uneSeanceParJour: UNE_SEANCE_PAR_JOUR,
      classement: "theme",      // "theme" | "periode" | "frise"
      hasardNeuf: true,
      theme: "auto",            // "auto" | "clair" | "sombre"
      echelle: 1,
      police: "ecran",
      /* Mode relecture : fait apparaitre dans le texte les points que la
         redaction a signales comme douteux ou discutes. Utile a l'auteur,
         inutile au lecteur : il est donc ferme par defaut. */
      relecture: false,
      /* Lecture a voix haute : vitesse, voix retenue sur l'appareil, et
         debit observe, qui sert a placer le curseur et a sauter de dix
         secondes sans que le moteur sache dire ou il en est. */
      vitesseVoix: 1,
      voixNom: "",
      signesSeconde: SIGNES_PAR_SECONDE,
      /* « culture » : le catalogue ; « brevet » : les revisions de 3e
         (voir z0f_brevet.js) ; null : pas encore choisi, l'ecran de choix
         s'affiche au premier lancement. */
      mode: null
    },
    brevet: { chapitres: {}, cartes: {}, dateExamen: null },
    cours: {},          // { idCours: { seances:{ "1":{...} }, termine:"AAAA-MM-JJ"|null, epreuve?, maitrise? } }
    historique: [],     // [{ d, type, coursId, seance, justes, total }]
    questions: {},      // { "idCours#seance#index": { r:ratees, j:reussies } }
    verifies: {},       // { "idCours#seance#rang": true } : points relus
    dernier: null,      // { coursId, seance } : derniere seance ouverte
    palierMax: 0,       // plus haut palier de rang atteint : on n'en redescend pas
    visites: {},        // { "AAAA-MM-JJ": nombre d'ouvertures } : pour les statistiques du professeur
    classe: "",         // « 3e B » : facultatif, pour que le professeur trie ses eleves par classe
    quotidien: {},      // { "AAAA-MM-JJ": { justes, temps, fini, choix, envoye, enCours, rang, classes } } : quiz du jour (z0k_quotidien.js)
    qjSemaines: {},     // { lundi: { rang, classes, points, final } } : historique des classements de la semaine
    collection: { graine: "", plis: {} }   // cartes EPOK : { graine, plis: { "AAAA-MM-JJ": [n, n, n] } } (z0l_cartes.js)
  };
}

/* Le navigateur accepte-t-il d'enregistrer ? Certains refusent le
   stockage local quand la page est ouverte depuis un fichier (file://)
   ou en navigation privee. Sans ce drapeau, la progression repartirait
   de zero a chaque ouverture, sans que rien ne le signale. */
let STOCKAGE_OK = true;

let ETAT = chargerEtat();

function chargerEtat(){
  const base = etatVierge();
  try{
    let brut = localStorage.getItem(CLE_STOCKAGE);
    if(!brut){
      brut = localStorage.getItem(CLE_ANCIENNE);
      if(brut) localStorage.setItem(CLE_STOCKAGE, brut);
    }
    if(!brut) return base;
    const lu = JSON.parse(brut);
    if(!lu || typeof lu !== "object") return base;
    return fusionnerEtat(base, lu);
  }catch(e){
    // localStorage indisponible (navigation privee, fichier local bride...)
    STOCKAGE_OK = false;
    console.warn("Epok : progression illisible, on repart d'un etat vierge.", e);
    return base;
  }
}

function fusionnerEtat(base, lu){
  const e = base;
  if(lu.reglages && typeof lu.reglages === "object"){
    const g = lu.reglages;
    e.reglages.uneSeanceParJour = g.uneSeanceParJour !== false;
    e.reglages.classement = ["theme","periode","frise"].indexOf(g.classement) >= 0
                            ? g.classement : "theme";
    e.reglages.hasardNeuf = g.hasardNeuf !== false;
    e.reglages.theme = ["auto","clair","sombre"].indexOf(g.theme) >= 0 ? g.theme : "auto";
    e.reglages.echelle = ECHELLES.indexOf(g.echelle) >= 0 ? g.echelle : 1;
    e.reglages.police = POLICES.some(p => p[0] === g.police) ? g.police : "ecran";
    e.reglages.relecture = g.relecture === true;
    e.reglages.vitesseVoix = VITESSES.indexOf(g.vitesseVoix) >= 0 ? g.vitesseVoix : 1;
    e.reglages.voixNom = typeof g.voixNom === "string" ? g.voixNom : "";
    e.reglages.signesSeconde = (typeof g.signesSeconde === "number"
      && g.signesSeconde > 5 && g.signesSeconde < 40) ? g.signesSeconde : SIGNES_PAR_SECONDE;
    e.reglages.mode = (g.mode === "brevet" || g.mode === "culture") ? g.mode : null;
  }
  /* Progression d'avant le choix du mode (octobre 2026) : elle vient du
     catalogue, on reste en mode Culture sans reposer la question. */
  if(!e.reglages.mode){
    const b = lu.brevet || {};
    const deja = (lu.cours && Object.keys(lu.cours).length) || (Array.isArray(lu.historique) && lu.historique.length);
    const brevet = b.chapitres && Object.keys(b.chapitres).length;
    if(deja || brevet) e.reglages.mode = brevet && !deja ? "brevet" : "culture";
  }
  if(lu.brevet && typeof lu.brevet === "object"){
    const b = lu.brevet;
    e.brevet.chapitres = (b.chapitres && typeof b.chapitres === "object") ? b.chapitres : {};
    e.brevet.cartes = (b.cartes && typeof b.cartes === "object") ? b.cartes : {};
    e.brevet.dateExamen = (typeof b.dateExamen === "string" && /^\d{4}-\d{2}-\d{2}$/.test(b.dateExamen)) ? b.dateExamen : null;
  }
  if(lu.cours && typeof lu.cours === "object") e.cours = lu.cours;
  if(Array.isArray(lu.historique)) e.historique = lu.historique;
  if(lu.questions && typeof lu.questions === "object") e.questions = lu.questions;
  if(lu.verifies && typeof lu.verifies === "object") e.verifies = lu.verifies;
  if(lu.dernier && typeof lu.dernier === "object") e.dernier = lu.dernier;
  /* Une progression d'avant octobre 2026 n'a pas de palier garanti :
     null le signale a migrerPalier(), qui le calcule avec les anciens
     seuils des que le catalogue est lisible. */
  e.palierMax = (typeof lu.palierMax === "number" && lu.palierMax >= 0) ? Math.floor(lu.palierMax) : null;
  e.visites = nettoyerVisites(lu.visites);
  e.classe = nettoyerClasse(lu.classe);
  e.quotidien = nettoyerQuotidien(lu.quotidien);
  e.qjSemaines = nettoyerSemainesQJ(lu.qjSemaines);
  e.collection = nettoyerCollection(lu.collection);
  return e;
}

/* La classe s'ecrit << 3A >>, << 3F >> (ou << 3e2 >> la ou les classes sont
   numerotees), suivie de l'annee scolaire, ajoutee toute seule : << 3A
   (2026-2027) >>. Le professeur compare ainsi ses eleves d'une annee sur
   l'autre. L'annee scolaire commence en aout, a la veille de la rentree. */
function anneeScolaire(d){
  d = d || new Date();
  const debut = d.getMonth() >= 7 ? d.getFullYear() : d.getFullYear() - 1;
  return debut + "-" + (debut + 1);
}
const CLASSE_FORME = /^([3-6])\s*(?:e|ème|eme|°)?\s*([A-Za-z]|\d{1,2})$/i;
/* << 3e b >>, << 3B >>, << 3ème B >> -> << 3B (2026-2027) >> ; vide -> "" ;
   une autre forme -> null. Une annee deja ecrite est remplacee par
   l'annee en cours : on reenregistre sa classe a chaque rentree. */
function formaterClasse(saisie, d){
  const s = String(saisie || "").replace(/\([^)]*\)/g, "").trim();
  if(!s) return "";
  const m = CLASSE_FORME.exec(s);
  if(!m) return null;
  const groupe = /\d/.test(m[2]) ? "e" + m[2] : m[2].toUpperCase();
  return m[1] + groupe + " (" + anneeScolaire(d) + ")";
}
function classeSansAnnee(c){ return String(c || "").replace(/\s*\([^)]*\)\s*$/, ""); }
function nettoyerClasse(c){ return typeof c === "string" ? c.trim().replace(/\s+/g, " ").slice(0, 20) : ""; }

/* Jours d'ouverture de l'application, avec leur nombre : le professeur en
   tire l'activite de la classe. On ne garde que les 400 derniers jours. */
/* Le plafond vit dans la fonction : chargerEtat() l'appelle au tout debut
   du script, avant que toute constante declaree plus bas n'existe. */
function nettoyerVisites(v){
  const VISITES_MAX = 400;
  const r = {};
  if(!v || typeof v !== "object") return r;
  Object.keys(v).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k) && Number.isInteger(v[k]) && v[k] > 0)
    .sort().slice(-VISITES_MAX).forEach(k => { r[k] = v[k]; });
  return r;
}
/* Une ouverture : au lancement, puis a chaque retour apres une demi-heure
   d'absence. */
let VISITE_DERNIERE = 0;
const VISITE_ECART = 30 * 60 * 1000;
function noterVisite(){
  if(Date.now() - VISITE_DERNIERE < VISITE_ECART) return;
  VISITE_DERNIERE = Date.now();
  const j = aujourdhui();
  ETAT.visites = ETAT.visites || {};
  ETAT.visites[j] = (ETAT.visites[j] || 0) + 1;
  ETAT.visites = nettoyerVisites(ETAT.visites);
  sauverEtat();
}

function sauverEtat(depuisSynchro){
  /* Toute progression passe par ici : c'est donc ici que l'insigne de
     l'en-tete se met a jour, quel que soit l'ecran qui a sauvegarde, et
     d'ici que part l'envoi au serveur quand un compte est connecte (sauf
     si la sauvegarde vient justement de la synchronisation). */
  noterPalier();
  majInsigne();
  try{
    localStorage.setItem(CLE_STOCKAGE, JSON.stringify(ETAT));
    if(!depuisSynchro) planifierSynchro();
    return true;
  }catch(e){
    STOCKAGE_OK = false;
    console.warn("Epok : sauvegarde impossible.", e);
    return false;
  }
}

/* Charte et corps de texte : poses sur <html>, d'ou les regles CSS les
   lisent. Le meme travail est fait par le petit script de l'en-tete,
   avant le premier affichage ; ici on le refait a chaud, quand le
   lecteur change de reglage. */
function appliquerCharte(){
  const h = document.documentElement;
  if(ETAT.reglages.theme === "auto") h.removeAttribute("data-theme");
  else h.setAttribute("data-theme", ETAT.reglages.theme);
  h.style.setProperty("--echelle", ETAT.reglages.echelle);
  h.setAttribute("data-police", ETAT.reglages.police);
}

/* ---------- 4.2  Progression ---------- */

function iso(d){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function aujourdhui(){ return iso(new Date()); }

function coursParId(id){ return COURS.find(c => c.id === id) || null; }

function fiche(coursId){
  if(!ETAT.cours[coursId]) ETAT.cours[coursId] = { seances:{}, termine:null };
  if(!ETAT.cours[coursId].seances) ETAT.cours[coursId].seances = {};
  return ETAT.cours[coursId];
}

/* Enregistrement brut d'une seance, ou null si elle n'a jamais ete
   touchee. Toutes les questions d'etat passent par ici. */
function infoSeance(coursId, numero){
  const f = ETAT.cours[coursId];
  return (f && f.seances && f.seances[numero]) || null;
}

/* Validee : le QCM a ete passe au moins une fois. */
function estFaite(coursId, numero){
  const s = infoSeance(coursId, numero);
  return !!s && typeof s.justes === "number";
}

/* Reussie : le QCM de la seance passe sans aucune faute, revision
   comprise (10/10, ou 5/5 pour la premiere seance, qui n'a pas de
   revision). C'est ce qui ouvre la seance suivante. Les QCM passes avant
   cette regle n'ont garde que la note des cinq questions de la seance :
   pour eux, on s'y fie faute de mieux. */
function seanceReussie(coursId, numero){
  const s = infoSeance(coursId, numero);
  if(!s || typeof s.justes !== "number") return false;
  if(typeof s.parfait === "boolean") return s.parfait;
  return s.total > 0 && Math.max(s.justes, s.meilleur || 0) >= s.total;
}
/* Une seance s'ouvre quand la precedente est reussie. Une seance deja lue
   reste ouverte : on ne reprend pas ce qui a ete accorde avant la regle. */
function seanceOuverte(coursId, numero){
  return numero <= 1 || estLue(coursId, numero) || seanceReussie(coursId, numero - 1);
}

/* Lue : ouverte et parcourue jusqu'au bout, QCM passe ou non. */
function estLue(coursId, numero){
  const s = infoSeance(coursId, numero);
  return !!s && (!!s.lu || typeof s.justes === "number");
}

function nbFaites(coursId){
  const c = coursParId(coursId);
  if(!c) return 0;
  return c.seances.filter(s => estFaite(coursId, s.numero)).length;
}
function nbLues(coursId){
  const c = coursParId(coursId);
  if(!c) return 0;
  return c.seances.filter(s => estLue(coursId, s.numero)).length;
}
/* Les numeros des seances jamais lues : ce que le bandeau << hors fil >>
   doit nommer, et ce que la fiche doit compter. */
function seancesNonLues(coursId){
  const c = coursParId(coursId);
  if(!c) return [];
  return c.seances.filter(s => !estLue(coursId, s.numero)).map(s => s.numero);
}

/* Marque une seance comme lue. Renvoie vrai si c'est un changement :
   l'appelant n'a ainsi a rafraichir l'ecran que lorsqu'il le faut. */
function marquerLue(coursId, numero){
  if(estLue(coursId, numero)) return false;
  const f = fiche(coursId);
  const s = f.seances[numero] || {};
  s.lu = aujourdhui();
  f.seances[numero] = s;
  sauverEtat();
  return true;
}

/* Premiere seance dont le QCM n'a pas ete passe ; null si le cours est
   entierement valide. C'est cette definition qui fait qu'un cours est
   << termine >>. */
function prochaineSeance(coursId){
  const c = coursParId(coursId);
  if(!c) return null;
  for(const s of c.seances){ if(!seanceReussie(coursId, s.numero)) return s.numero; }
  return null;
}

/* Fil conseille : premiere seance jamais lue. C'est ce que l'accueil
   propose, et ce que la fiche souligne d'un lisere. */
function filLecture(coursId){
  const c = coursParId(coursId);
  if(!c) return null;
  for(const s of c.seances){ if(!estLue(coursId, s.numero)) return s.numero; }
  return null;
}

function coursTermine(coursId){ return prochaineSeance(coursId) === null; }

/* Maitrise : le cours est valide pour de bon, par un sans-faute a
   l'epreuve finale. C'est un cran au-dessus de << termine >> (les six QCM
   passes, quel qu'ait ete le score) ; on ne le retire jamais, un echec
   ulterieur a l'epreuve n'y change rien. */
const EPREUVE_PAR_SEANCE = 2;   // 2 questions tirees dans chacune des 6 seances
function coursMaitrise(coursId){
  const f = ETAT.cours[coursId];
  return !!(f && f.maitrise);
}
/* L'epreuve s'ouvre quand les six seances sont lues : elle porte sur tout
   le cours, et l'on peut la tenter sans avoir passe les QCM un par un. */
function epreuveOuverte(coursId){ return nbLues(coursId) >= SEANCES_PAR_COURS; }
function coursCommence(coursId){ return nbLues(coursId) > 0 || nbFaites(coursId) > 0; }

/* Les jours ou une seance a ete lue ou son QCM passe. Sert a la date de
   la derniere seance (rappel de rythme, pastille de l'accueil). */
function joursSeances(){
  const jours = {};
  for(const id in ETAT.cours){
    const f = ETAT.cours[id];
    if(!f || !f.seances) continue;
    for(const n in f.seances){
      const s = f.seances[n];
      if(s && s.lu) jours[s.lu] = true;
      if(s && s.date) jours[s.date] = true;
    }
  }
  return jours;
}
/* Tous les jours d'activite, en ensemble : seances, mais aussi tout quiz
   (QCM, quiz compose, grand et giga quiz, QCM et frises du Brevet, inscrits
   a l'historique), le Quiz of the Day, les fiches du Brevet lues et les
   cartes memoire revues. Sert au ruban « Votre semaine » et a la serie. */
function joursActifs(){
  const jours = joursSeances();
  (ETAT.historique || []).forEach(h => { if(h && h.d) jours[h.d] = true; });
  Object.keys(ETAT.quotidien || {}).forEach(d => { jours[d] = true; });
  const b = ETAT.brevet || {};
  Object.values(b.chapitres || {}).forEach(c => { if(c && typeof c.lu === "string") jours[c.lu] = true; });
  Object.values(b.cartes || {}).forEach(c => { if(c && typeof c.d === "string") jours[c.d] = true; });
  return jours;
}

/* Serie : nombre de jours consecutifs travailles jusqu'a aujourd'hui.
   Une journee encore vide ne rompt pas la serie tant qu'hier est plein :
   la chaine ne se casse qu'au premier jour entierement saute. */
function serie(){
  const jours = joursActifs();
  const d = new Date();
  if(!jours[iso(d)]) d.setDate(d.getDate() - 1);
  let n = 0;
  while(jours[iso(d)]){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* Les sept derniers jours, du plus ancien au plus recent. */
function semaine(){
  const jours = joursActifs();
  const sem = [];
  const noms = ["D","L","M","M","J","V","S"];
  for(let k = 6; k >= 0; k--){
    const d = new Date();
    d.setDate(d.getDate() - k);
    sem.push({ cle:iso(d), nom:noms[d.getDay()], actif:!!jours[iso(d)], aujourdhui:k === 0 });
  }
  return sem;
}

function dateDerniereSeance(){
  const jours = Object.keys(joursSeances());
  if(!jours.length) return null;
  return jours.sort()[jours.length - 1];
}

/* Rappel de rythme : vrai si une seance a deja ete lue aujourd'hui et
   que le reglage est actif. Ne bloque rien, n'affiche qu'un rappel. */
function rythmeAtteint(){
  if(!ETAT.reglages.uneSeanceParJour) return false;
  return dateDerniereSeance() === aujourdhui();
}

/* Cours actuellement suivi : le dernier ouvert s'il n'est pas termine,
   sinon le premier cours commence et non termine, sinon le premier
   cours jamais commence. */
/* Six seances lues et six QCM passes : le cours est termine, mais il
   n'est valide qu'apres un sans-faute a l'epreuve finale. Tant qu'elle
   n'est pas reussie, l'accueil garde ce cours et n'en propose pas d'autre. */
function coursAValider(coursId){ return coursTermine(coursId) && !coursMaitrise(coursId); }

function coursEnCours(){
  const dernier = ETAT.dernier && ETAT.dernier.coursId ? coursParId(ETAT.dernier.coursId) : null;
  /* L'epreuve a passer d'abord, meme si l'on a ouvert un autre cours depuis. */
  if(dernier && coursAValider(dernier.id)) return dernier;
  const aValider = COURS.find(c => coursAValider(c.id));
  if(aValider) return aValider;
  if(dernier && !coursTermine(dernier.id)) return dernier;
  const entame = COURS.find(c => coursCommence(c.id) && !coursTermine(c.id));
  if(entame) return entame;
  /* Un nouveau cours : la suite du dernier valide (meme serie, meme
     periode), sinon le debut du catalogue. */
  const valides = COURS.filter(c => coursMaitrise(c.id))
    .sort((a, b) => String(ETAT.cours[a.id].maitrise).localeCompare(String(ETAT.cours[b.id].maitrise)));
  const suite = valides.length ? coursSuggere(valides[valides.length - 1].id) : null;
  return suite || premierChrono(COURS.filter(c => !coursCommence(c.id)));
}

/* Le premier d'une liste de cours dans l'ordre du catalogue : le theme
   d'abord (THEMES est chronologique), puis la date de depart. Un nouvel
   eleve commence ainsi par << 1789 : la rupture >>, et non par le premier
   cours ecrit (les annees 1920) ni par la premiere industrialisation, qui
   part de 1780 mais court jusqu'en 1850. */
function rangTheme(c){
  const i = THEMES.findIndex(t => t.nom === c.theme);
  return i < 0 ? THEMES.length : i;
}
function premierChrono(liste){
  return liste.reduce((m, c) => !m || rangTheme(c) < rangTheme(m)
    || (rangTheme(c) === rangTheme(m) && anneeDepart(c) < anneeDepart(m)) ? c : m, null);
}

/* Suggestion apres un cours termine : meme periode d'abord, puis
   n'importe quel cours non commence. */
function coursSuggere(apresId){
  const ref = coursParId(apresId);
  const libres = COURS.filter(c => c.id !== apresId && !coursCommence(c.id));
  if(ref){
    /* D'abord la suite du meme theme -- le volume suivant d'une serie --,
       puis un cours de la meme periode. */
    const memeTheme = libres.find(c => c.theme === ref.theme);
    if(memeTheme) return memeTheme;
    const memePeriode = libres.find(c => c.periode === ref.periode);
    if(memePeriode) return memePeriode;
  }
  return premierChrono(libres);
}

/* Etat d'une seance, pour l'affichage uniquement :
     faite  — QCM passe
     lue    — lue, QCM en attente
     fil    — non lue, et c'est la prochaine du fil conseille
     neuve  — non lue, hors du fil
   Aucun de ces etats n'empeche d'ouvrir la seance. */
function etatSeance(coursId, numero){
  if(seanceReussie(coursId, numero)) return "faite";
  if(estFaite(coursId, numero)) return "refaire";
  if(!seanceOuverte(coursId, numero)) return "fermee";
  if(estLue(coursId, numero)) return "lue";
  return filLecture(coursId) === numero ? "fil" : "neuve";
}

const LIBELLE_ETAT = { faite:"réussie", refaire:"QCM à refaire", fermee:"fermée", lue:"lue", fil:"à lire", neuve:"non lue" };

/* Score moyen, en pourcentage, sur tous les QCM enregistres. */
function scoreMoyen(){
  const h = ETAT.historique.filter(x => x.total > 0);
  if(!h.length) return null;
  let j = 0, t = 0;
  h.forEach(x => { j += x.justes; t += x.total; });
  return t ? Math.round(100*j/t) : null;
}

/* ---------- Points et rangs ----------

   Les points se DEDUISENT de la progression enregistree : aucun compteur
   n'est stocke. Ils ne peuvent donc ni se desynchroniser, ni se perdre a
   l'import, et la progression deja faite compte des l'installation.

   Par seance          lue : 2
                       QCM passe : 1, plus 3 par bonne reponse (sur les 5
                       questions propres de la seance), plus 5 si sans-faute
   Par cours           termine (six QCM passes) : 30 ; maitrise : 100
   Grand quiz          2 par bonne reponse sur 30, plus 20 si sans-faute
   Giga quiz           3 par bonne reponse sur les questions du cours, plus
                       sa part des 60 points du sans-faute (voir plus bas)
   Seul le MEILLEUR score d'une seance compte : repasser un QCM ne rapporte
   rien de plus, et aucun point ne se perd jamais.
   Bareme d'octobre 2026 : lire rapportait 10, passer un QCM 5 et une bonne
   reponse 1 ; ce sont desormais les bonnes reponses qui comptent le plus.
   Le rang deja atteint reste garanti (palierMax). */
const PTS_LUE = 2, PTS_QCM = 1, PTS_BONNE = 3, PTS_SANS_FAUTE = 5, PTS_TERMINE = 30, PTS_MAITRISE = 100;

/* ---------- Grand quiz et giga quiz (octobre 2026) ----------
   Deux quiz facultatifs, ouverts aux cours termines, qui ne servent qu'a
   gagner des points et a mieux retenir.
   Grand quiz : les trente questions d'un cours, melangees. 80 points au
     plus par cours.
   Giga quiz : soixante questions reparties a parts egales entre deux,
     trois ou quatre cours termines (30, 20 ou 15 chacun). Chaque cours
     est credite de ses bonnes reponses, et le sans-faute se partage :
     au plus 120 points par cours dans un giga a deux, 240 par giga.
   Un cours n'est credite qu'une fois de chaque sorte : on garde son
   meilleur resultat, et refaire ne rapporte que ce qui le depasse. */
const GRAND_NB = 30, PTS_GRAND = 2, PTS_GRAND_SANS_FAUTE = 20;
const GIGA_NB = 60, GIGA_MIN = 2, GIGA_MAX = 4, PTS_GIGA = 3, PTS_GIGA_SANS_FAUTE = 60;

function quizBonusOuvert(coursId){ return coursTermine(coursId); }
function ptsGrand(g){
  if(!g || typeof g.meilleur !== "number") return 0;
  return PTS_GRAND * g.meilleur + (g.total > 0 && g.meilleur >= g.total ? PTS_GRAND_SANS_FAUTE : 0);
}
/* Un enregistrement de giga decrit le meilleur passage du cours :
   ses bonnes reponses, et si le quiz entier etait un sans-faute, avec le
   nombre de cours entre lesquels ce bonus s'est partage. */
function ptsGiga(g){
  if(!g || typeof g.justes !== "number") return 0;
  return PTS_GIGA * g.justes + (g.sansFaute && g.nb > 0 ? Math.round(PTS_GIGA_SANS_FAUTE / g.nb) : 0);
}

function pointsCours(coursId){
  const c = coursParId(coursId);
  if(!c) return 0;
  let p = 0;
  c.seances.forEach(s => {
    if(estLue(coursId, s.numero)) p += PTS_LUE;
    const i = infoSeance(coursId, s.numero);
    if(i && typeof i.justes === "number"){
      const m = Math.max(i.justes, i.meilleur || 0);
      p += PTS_QCM + PTS_BONNE * m;
      if(i.total > 0 && m >= i.total) p += PTS_SANS_FAUTE;
    }
  });
  if(coursTermine(coursId)) p += PTS_TERMINE;
  if(coursMaitrise(coursId)) p += PTS_MAITRISE;
  const f = ETAT.cours[coursId];
  if(f){ p += ptsGrand(f.grand) + ptsGiga(f.giga); }
  return p;
}
function pointsTotal(){
  let p = 0;
  COURS.forEach(c => { p += pointsCours(c.id); });
  return p + pointsBrevet() + pointsQuotidien();
}

/* Onze rangs, trois niveaux chacun : le niveau 3 est le plus haut, et au
   dela on passe au niveau 1 du rang suivant. Soit 33 paliers. Le dessin
   de chaque badge est dans z0e_badges.js. */
const RANGS = [
  { nom:"Bois" }, { nom:"Fer" }, { nom:"Bronze" }, { nom:"Argent" }, { nom:"Or" },
  { nom:"Platine" }, { nom:"Diamant" }, { nom:"Élite" }, { nom:"Master" },
  { nom:"SuperMaster" }, { nom:"God" }
];
const NIVEAUX_PAR_RANG = 3;
const NB_PALIERS = RANGS.length * NIVEAUX_PAR_RANG;      // 33

/* Seuil du palier i (0 = Bois 1). Une courbe en carre : les premiers
   paliers tombent vite, ce qui encourage, puis l'ecart s'allonge. Les
   seuils sont FIXES : ajouter des cours ne fait jamais redescendre.

   God 3 demandait 22 000 points, environ 90 % du maximum d'un catalogue
   de 88 cours. L'arrivee du grand et du giga quiz (octobre 2026) a porte
   ce maximum de 280 a 480 points par cours (268 a 468 avec le bareme
   d'octobre 2026, qui donne plus aux bonnes reponses qu'a la lecture) ;
   le sommet est donc releve a
   30 000 : environ 63 cours parfaits avec les deux quiz, ou tout le
   catalogue sans eux. Pour que ce relevement ne coute un niveau a
   personne, le plus haut palier atteint est memorise (palierMax). */
const SEUIL_MAX = 30000, ANCIEN_SEUIL_MAX = 22000;
function seuilAvec(max, i){ return Math.round(max * Math.pow(i / (NB_PALIERS - 1), 2) / 10) * 10; }
function seuilPalier(i){ return seuilAvec(SEUIL_MAX, i); }
function indicePalier(pts, max){
  let i = 0;
  while(i < NB_PALIERS - 1 && pts >= seuilAvec(max, i + 1)) i++;
  return i;
}

/* Le rang du lecteur : ses points, et jamais moins que son palier garanti. */
function rangActuel(){ return rangDe(pointsTotal(), ETAT.palierMax || 0); }

/* Memorise le palier quand il monte. Appele a chaque sauvegarde. */
function noterPalier(){
  if(typeof COURS === "undefined") return;
  const i = indicePalier(pointsTotal(), SEUIL_MAX);
  if(typeof ETAT.palierMax !== "number" || i > ETAT.palierMax) ETAT.palierMax = Math.max(i, ETAT.palierMax || 0);
}

/* Progression d'avant octobre 2026 (ou import d'une telle progression) :
   on fixe le palier garanti avec les ANCIENS seuils, ceux sous lesquels
   le rang a ete gagne. On n'ecrit que s'il y a quelque chose a garantir. */
function migrerPalier(){
  if(typeof ETAT.palierMax === "number") return;
  const pts = pointsTotal();
  ETAT.palierMax = Math.max(indicePalier(pts, ANCIEN_SEUIL_MAX), indicePalier(pts, SEUIL_MAX));
  if(ETAT.palierMax > 0) sauverEtat();
}

function libellePalier(i){
  return RANGS[Math.floor(i / NIVEAUX_PAR_RANG)].nom + " " + (i % NIVEAUX_PAR_RANG + 1);
}

/* Palier atteint pour un nombre de points, et ce qui reste jusqu'au
   suivant. plancher : palier garanti, en dessous duquel on ne descend pas
   (le rang affiche est alors au-dessus de ce que les points donneraient,
   et la jauge part de zero). */
function rangDe(pts, plancher){
  const i = Math.max(indicePalier(pts, SEUIL_MAX), Math.min(plancher || 0, NB_PALIERS - 1));
  const debut = seuilPalier(i);
  const suivant = i < NB_PALIERS - 1 ? seuilPalier(i + 1) : null;
  return { i, pts, rang: RANGS[Math.floor(i / NIVEAUX_PAR_RANG)], niveau: i % NIVEAUX_PAR_RANG + 1,
           libelle: libellePalier(i), debut, suivant,
           suivantLibelle: suivant === null ? null : libellePalier(i + 1) };
}

/* Badge du palier i : la forme et le motif disent le rang, les trois
   losanges et les ornements disent le niveau. */
function emblemeRang(i, taille){
  return dessinerBadge(Math.floor(i / NIVEAUX_PAR_RANG), i % NIVEAUX_PAR_RANG + 1, taille);
}

/* Insigne de l'en-tete : badge du rang et points, sur chaque ecran. */
function majInsigne(){
  const el = document.getElementById("insigne");
  if(!el || typeof COURS === "undefined") return;
  const pts = pointsTotal(), R = rangActuel();
  /* Meme taille sur tous les onglets : l'en-tete est le meme partout. */
  /* On ne remplace son contenu que s'il change : remplace entre le doigt
     pose et le doigt leve, l'insigne perdait l'appui (la fenetre des rangs
     ne s'ouvrait qu'au 2e essai). */
  const vu = R.i + "|" + pts;
  if(el.dataset.vu !== vu){
    el.innerHTML = emblemeRang(R.i, 52) + `<span class="pts">${pts.toLocaleString("fr-FR")} pts</span>`;
    el.dataset.vu = vu;
  }
  el.setAttribute("aria-label", "Rang " + R.libelle + ", " + pts + " points. Voir le détail du rang");
}

/* Le rang courant et la progression vers le suivant : en tete de la carte
   de l'accueil comme de la fenetre des rangs. */
function teteRang(taille){
  const pts = pointsTotal(), R = rangActuel();
  const reste = R.suivant === null ? 0 : R.suivant - pts;
  return `<div class="rang-tete">
      ${emblemeRang(R.i, taille || 56)}
      <div class="corps">
        <p class="minuscule" style="margin:0">Votre rang</p>
        <h2>${R.libelle}</h2>
        <p class="minuscule" style="margin:2px 0 0">${pts.toLocaleString("fr-FR")} point${pts > 1 ? "s" : ""}</p>
      </div>
    </div>
    ${ R.suivant === null
      ? `<p class="secondaire" style="margin:12px 0 0">Rang maximal atteint.</p>`
      : `${jauge(Math.max(0, pts - R.debut), R.suivant - R.debut)}
         <p class="rang-bas minuscule"><span>encore ${reste.toLocaleString("fr-FR")} pt${reste > 1 ? "s" : ""}</span>
           <span>${R.suivantLibelle}</span></p>` }`;
}
/* L'echelle des onze rangs et le bareme des points. */
function echelleEtBareme(){
  const pts = pointsTotal(), R = rangActuel();
  const echelle = RANGS.map((r, k) => {
    const i = k * NIVEAUX_PAR_RANG;
    const actuel = Math.floor(R.i / NIVEAUX_PAR_RANG) === k;
    return `<li class="${pts >= seuilPalier(i) || R.i >= i ? "atteint" : ""}${actuel ? " actuel" : ""}">
      ${emblemeRang(i, 30)}<span class="nom">${r.nom}</span>
      <span class="seuil">${actuel ? "vous êtes ici &#8226; " : ""}dès ${seuilPalier(i).toLocaleString("fr-FR")} pts</span></li>`;
  }).join("");
  return `<ul class="echelle">${echelle}</ul>
      <p class="capitales" style="margin:14px 0 6px">Comment gagner des points</p>
      <dl class="bareme">
        <dt>Séance lue</dt><dd>${PTS_LUE} pts</dd>
        <dt>QCM passé</dt><dd>${PTS_QCM} pt${PTS_QCM > 1 ? "s" : ""}</dd>
        <dt>&#8195;par bonne réponse</dt><dd>+${PTS_BONNE} pts</dd>
        <dt>&#8195;si sans-faute</dt><dd>+${PTS_SANS_FAUTE} pts</dd>
        <dt>Cours terminé</dt><dd>${PTS_TERMINE} pts</dd>
        <dt>Cours maîtrisé</dt><dd>${PTS_MAITRISE} pts</dd>
        <dt>Grand quiz (30 questions)</dt><dd>${PTS_GRAND} pts par bonne réponse</dd>
        <dt>&#8195;si sans-faute</dt><dd>+${PTS_GRAND_SANS_FAUTE} pts</dd>
        <dt>Giga quiz (60 questions)</dt><dd>${PTS_GIGA} pts par bonne réponse</dd>
        <dt>&#8195;si sans-faute</dt><dd>+${PTS_GIGA_SANS_FAUTE} pts</dd>
        <dt>Quiz composé</dt><dd>0 pt, pour le plaisir</dd>
        <dt>Brevet&#8239;: fiche lue</dt><dd>${B_PTS_LUE} pts</dd>
        <dt>&#8195;QCM de chapitre</dt><dd>${B_PTS_QCM} pt${B_PTS_QCM > 1 ? "s" : ""} + ${PTS_BONNE} par bonne réponse</dd>
        <dt>&#8195;si sans-faute</dt><dd>+${B_PTS_SANS_FAUTE} pts</dd>
        <dt>Quiz of the Day</dt><dd>${QJ_PTS} pts par bonne réponse</dd>
        <dt>&#8195;podium du jour (1<sup>er</sup>, 2<sup>e</sup>, 3<sup>e</sup>)</dt><dd>${qjPodium(QJ_PODIUM_JOUR)} pts</dd>
        <dt>&#8195;podium de la semaine</dt><dd>${qjPodium(QJ_PODIUM_SEMAINE)} pts</dd>
      </dl>
      <p class="minuscule" style="margin:10px 0 0">Seul votre meilleur score compte&#8239;: refaire
        un QCM ne rapporte rien de plus, et aucun point ne se perd jamais. Le grand et le giga
        quiz s’ouvrent quand un cours est terminé&#8239;; chaque cours n’y est crédité qu’une fois,
        à son meilleur résultat. Les bonus du podium du Quiz of the Day sont acquis à minuit (jour) et le
        dimanche à minuit (semaine). Un rang atteint reste acquis.</p>`;
}
/* Carte de l'accueil : le rang courant, la progression vers le suivant,
   et, repliee, l'echelle complete avec le bareme. Le volet reste comme le
   lecteur l'a laisse, meme quand l'accueil se redessine (synchronisation). */
let RANG_OUVERT = false;
function carteRang(){
  return `<div class="carte rang avec-aide">
    <span class="aide-coin">${aideBouton("rang")}</span>
    ${teteRang(56)}
    <details class="rang-volet"${RANG_OUVERT ? " open" : ""}>
      <summary>Tous les rangs et le barème</summary>
      ${echelleEtBareme()}
    </details>
  </div>`;
}
/* Fenetre des rangs, ouverte d'un appui sur l'insigne de l'en-tete. */
function ouvrirRangs(){
  fermerBulle("fenetre-aide");
  const v = ouvrirEnBulle("fenetre-rangs", `<button class="bouton petit discret fr-fermer" data-action="rangs-fermer" aria-label="Fermer">&#10005; Fermer</button>
    ${teteRang(64)}
    <div class="fr-corps">${echelleEtBareme()}</div>`, "fr-boite carte rang", document.getElementById("insigne"));
  v.setAttribute("aria-label", "Rangs et barème");
}
function fermerRangs(){ fermerBulle("fenetre-rangs"); }
if(typeof document !== "undefined"){
  document.addEventListener("toggle", ev => {
    if(ev.target && ev.target.classList && ev.target.classList.contains("rang-volet")) RANG_OUVERT = ev.target.open;
  }, true);
  document.addEventListener("keydown", ev => { if(ev.key === "Escape") fermerRangs(); });
}

/* Totaux de l'accueil, calcules en un seul parcours du catalogue. */
function bilan(){
  let lues = 0, faites = 0, termines = 0, commences = 0, maitrises = 0;
  COURS.forEach(c => {
    const l = nbLues(c.id), f = nbFaites(c.id);
    lues += l; faites += f;
    if(coursMaitrise(c.id)) maitrises++;
    if(coursTermine(c.id)) termines++;
    else if(l > 0) commences++;
  });
  return { lues, faites, termines, commences, maitrises,
           total: COURS.length, seances: COURS.length * SEANCES_PAR_COURS };
}

/* Libelle d'une ligne d'historique, selon le type de quiz. */
function nomQuiz(h){
  const co = coursParId(h.coursId);
  if(h.type === "compose") return "Quiz composé";
  if(h.type === "epreuve") return co ? tx(co.titre) + " &#8212; épreuve finale" : "Épreuve finale";
  if(h.type === "grand") return co ? tx(co.titre) + " &#8212; grand quiz" : "Grand quiz";
  if(h.type === "b-qcm"){ const ch = chapitreParId(h.coursId); return "Brevet &#8212; " + (ch ? tx(ch.titre) : "QCM"); }
  if(h.type === "b-reperes") return "Brevet &#8212; repères";
  if(h.type === "b-frise") return "Brevet &#8212; frise des repères";
  if(h.type === "giga") return "Giga quiz" + (Array.isArray(h.cours) ? " &#8212; " + h.cours.length + " cours" : "");
  return co ? tx(co.titre) + " &#8212; séance " + h.seance : "Séance";
}

function cleQuestion(coursId, seance, index){ return coursId + "#" + seance + "#" + index; }

/* ---------- Points a verifier ----------
   La redaction laisse dans le texte des commentaires HTML signalant un
   chiffre discute, une date incertaine ou une attribution contestee. Ils
   sont invisibles a la lecture, ce qui est exactement ce qu'il faut pour
   un lecteur et exactement ce qu'il ne faut pas pour un relecteur. Le
   mode relecture les fait sortir.

   Depuis octobre 2026, la regle est qu'aucun point douteux ne reste dans
   un cours publie : valider.js refuse les marqueurs, et l'entree
   Relecture disparait des reglages quand il n'y a rien a relire. Le
   mecanisme reste en place pour le cas ou un cours en porterait. */
const MOTIF_VERIF = /<!--\s*A VERIFIER\s*:?\s*([\s\S]*?)-->/g;

/* Les marqueurs d'une seance, contenu puis anecdote, dans l'ordre ou ils
   apparaissent. L'ordre fait la cle : il doit rester stable d'un rendu a
   l'autre pour que la case cochee designe toujours le meme point.

   Ils sont releves par source/decouper.js et poses dans le catalogue :
   l'ecran des points a verifier n'a donc pas besoin des contenus, qui ne
   sont plus la au demarrage. */
function marqueursSeance(s){ return s.marq || []; }

function cleVerif(coursId, numero, rang){ return coursId + "#" + numero + "#" + rang; }

function nbMarqueurs(){
  let n = 0;
  COURS.forEach(c => c.seances.forEach(s => { n += marqueursSeance(s).length; }));
  return n;
}

/* Tout le catalogue, a plat : un objet par point a verifier. */
function tousMarqueurs(){
  const out = [];
  COURS.forEach(c => c.seances.forEach(s => {
    marqueursSeance(s).forEach((texte, rang) => {
      out.push({ coursId:c.id, titre:c.titre, numero:s.numero, titreSeance:s.titre,
                 rang, texte, fait: !!ETAT.verifies[cleVerif(c.id, s.numero, rang)] });
    });
  }));
  return out;
}

/* Remplace les commentaires par un bloc visible, ou les laisse invisibles.
   On numerote au passage : le numero affiche dans la seance est celui de
   la liste, ce qui permet de passer de l'une a l'autre sans chercher. */
function poserMarqueurs(html, depart){
  let n = depart;
  return String(html).replace(MOTIF_VERIF, (tout, texte) => {
    n++;
    return !ETAT.reglages.relecture ? tout
      : '<span class="verif"><b>' + n + '</b> ' + esc(texte.trim()) + '</span>';
  });
}

/* ---------- 4.3  Utilitaires d'affichage ---------- */

function esc(s){
  return String(s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]
  ));
}

/* Typographie francaise : espace insecable a l'interieur des guillemets
   et devant les ponctuations doubles, pour eviter qu'un << ; >> ou un
   guillemet fermant ne se retrouve seul en debut de ligne. */
function typo(s){
  return String(s)
    .replace(/« /g, "« ")
    .replace(/ »/g, " »")
    .replace(/ ([;:?!])/g, " $1");
}

/* Texte destine a l'affichage : typographie puis echappement. */
function tx(s){ return esc(typo(s)); }

/* Dernier passage sur l'ecran rendu, sur le texte seul (jamais sur les
   attributs) : la typographie de typo() pour les phrases ecrites en dur
   dans les gabarits et pour les fiches, l'apostrophe courbe que les
   premiers cours tapaient droite, et le << e >> des ordinaux (XIXe, 3e),
   que les libelles en capitales changeaient en << XIXE >>. */
const LETTRE = "A-Za-zÀ-ÖØ-öø-ÿŒœ";
/* << l'<strong>offensive</strong> >> : l'apostrophe finit son noeud de texte. */
const APOSTROPHE_DROITE = new RegExp("([" + LETTRE + "])'(?=[" + LETTRE + "]|$)", "g");
const ORDINAL = /\b(\d+|[IVX]+)(er|re|e)\b/g;
function typoEcran(racine){
  if(!racine) return;
  if(racine.nodeType === 3) racine = racine.parentElement;
  if(!racine || racine.nodeType !== 1) return;
  const marche = document.createTreeWalker(racine, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement && n.parentElement.closest("svg, script, style, textarea, code, .ord")
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const textes = [];
  for(let n = marche.nextNode(); n; n = marche.nextNode()) textes.push(n);
  for(const n of textes){
    const v = typo(n.nodeValue.replace(APOSTROPHE_DROITE, "$1’"));
    if(v !== n.nodeValue) n.nodeValue = v;
    ORDINAL.lastIndex = 0;
    if(!ORDINAL.test(v) || getComputedStyle(n.parentElement).textTransform !== "uppercase") continue;
    const frag = document.createDocumentFragment();
    let i = 0;
    v.replace(ORDINAL, (m, nb, suffixe, pos) => {
      frag.appendChild(document.createTextNode(v.slice(i, pos) + nb));
      const s = document.createElement("span");
      s.className = "ord"; s.textContent = suffixe;
      frag.appendChild(s);
      i = pos + m.length;
      return m;
    });
    frag.appendChild(document.createTextNode(v.slice(i)));
    n.parentNode.replaceChild(frag, n);
  }
}
/* Bien des ecrans se redessinent en partie, sans repasser par rendre() :
   les resultats du catalogue, la correction d'un quiz, les ecrans poses
   par-dessus (compte, statistiques, tutoriel). Un observateur leur
   applique le meme passage. Il converge : un texte deja traite ne change
   plus, et les << e >> isoles dans .ord sont ecartes. */
if(typeof MutationObserver !== "undefined" && typeof document !== "undefined"){
  new MutationObserver(lot => {
    for(const m of lot) for(const n of m.addedNodes) typoEcran(n);
  }).observe(document.documentElement, { childList:true, subtree:true });
}

/* Un titre dont les dates finales, entre parentheses, ne doivent pas se
   couper en fin de ligne : << (1914- >> puis << 1918) >> a la ligne. */
function txDates(s){
  return tx(s).replace(/ (\([^()]*\d{4}[^()]*\))$/, ' <span class="nobr">$1</span>');
}

function filet(texte, aide){
  return texte ? `<div class="filet"><span>${tx(texte)}${aide ? aideBouton(aide) : ""}</span></div>`
               : `<div class="filet"><span class="losange">&#10086;</span></div>`;
}

function jauge(fait, total){
  const pc = total ? Math.round(100*fait/total) : 0;
  return `<div class="jauge"><div style="width:${pc}%"></div></div>`;
}

/* Anneau grave : un cercle de progression avec son chiffre au centre.
   Le trait est un cercle dont on ne dessine qu'une fraction, par le jeu
   de stroke-dasharray ; aucune image, aucune dependance. */
function anneau(fait, total, taille){
  const t = taille || 54;
  const r = (t - 6) / 2;
  const tour = 2 * Math.PI * r;
  const pc = total ? fait/total : 0;
  const fini = total > 0 && fait >= total;
  return `<span class="anneau${fini ? " fini" : ""}" style="width:${t}px;height:${t}px">
    <svg width="${t}" height="${t}" viewBox="0 0 ${t} ${t}" aria-hidden="true" focusable="false">
      <circle class="fond" cx="${t/2}" cy="${t/2}" r="${r}"></circle>
      <circle class="trait" cx="${t/2}" cy="${t/2}" r="${r}"
        stroke-dasharray="${tour.toFixed(1)}"
        stroke-dashoffset="${(tour * (1 - pc)).toFixed(1)}"></circle>
    </svg>
    <span class="chiffre">${fini ? "&#10003;" : fait + "/" + total}</span>
  </span>`;
}

/* Anneau d'un cours : deux bandes concentriques.
     exterieure (or)      les seances lues
     interieure (bordeaux) celles dont le QCM est passe
   Au centre, le nombre de seances lues. Quand les six QCM sont passes,
   l'anneau passe au vert avec une coche ; quand l'epreuve finale a ete
   reussie sans faute, il porte une etoile : le cours est maitrise. */
function anneauCours(coursId, taille){
  const t = taille || 54;
  const lues = nbLues(coursId), faites = nbFaites(coursId);
  const total = SEANCES_PAR_COURS;
  const maitre = coursMaitrise(coursId);
  const fini = faites >= total;
  const e = t >= 56 ? 5 : 4;           // epaisseur d'une bande
  const r1 = (t - e) / 2;              // bande exterieure
  const r2 = r1 - e - 1.5;             // bande interieure
  const bande = (r, f, cls) => {
    const tour = 2 * Math.PI * r;
    return `<circle class="bande-fond" cx="${t/2}" cy="${t/2}" r="${r}" stroke-width="${e}"></circle>
      <circle class="bande ${cls}" cx="${t/2}" cy="${t/2}" r="${r}" stroke-width="${e}"
        stroke-dasharray="${tour.toFixed(1)}"
        stroke-dashoffset="${(tour * (1 - f / total)).toFixed(1)}"></circle>`;
  };
  const libelle = lues + " séance" + (lues > 1 ? "s" : "") + " lue" + (lues > 1 ? "s" : "") +
    " sur " + total + ", " + faites + " QCM validé" + (faites > 1 ? "s" : "") +
    (maitre ? ", cours maîtrisé" : "");
  return `<span class="anneau double${t >= 56 ? " grand" : ""}${fini ? " fini" : ""}${maitre ? " maitre" : ""}"
      style="width:${t}px;height:${t}px" role="img" aria-label="${libelle}">
    <svg width="${t}" height="${t}" viewBox="0 0 ${t} ${t}" aria-hidden="true" focusable="false">
      ${bande(r1, lues, "lues")}${bande(r2, faites, "faites")}
    </svg>
    <span class="chiffre" aria-hidden="true">${maitre ? "&#9733;" : fini ? "&#10003;" : lues + "/" + total}</span>
  </span>`;
}

function dateLisible(iso){
  if(!iso) return "";
  const [a,m,j] = iso.split("-");
  return j + "/" + m + "/" + a;
}

function melanger(tab){
  const t = tab.slice();
  for(let i=t.length-1;i>0;i--){
    const k = Math.floor(Math.random()*(i+1));
    [t[i],t[k]] = [t[k],t[i]];
  }
  return t;
}

/* Enumeration a la francaise : 2, 3 et 4. Sert a nommer les seances
   sautees sans produire << 2, 3, 4, >>. */
function enumerer(tab){
  if(!tab.length) return "";
  if(tab.length === 1) return String(tab[0]);
  return tab.slice(0,-1).join(", ") + " et " + tab[tab.length-1];
}

/* Annee de depart d'un cours, lue sur son champ << dates >>, pour le
   classement de la frise. Tous les libelles commencent par une annee a
   quatre chiffres ; a defaut, le cours est renvoye en fin de frise. */
function anneeDepart(c){
  const m = /\d{4}/.exec(c.dates || "");
  return m ? Number(m[0]) : 9999;
}

/* ---------- 4.4  Onglet Accueil ---------- */

/* Ce que l'accueil propose de faire tout de suite : reprendre le fil
   la ou il s'est arrete, ou passer le QCM d'une seance deja lue. */
/* La prochaine chose a faire, dans l'ordre : la premiere seance pas encore
   reussie, a lire si elle ne l'est pas, sinon son QCM a (re)passer. */
function reprise(c){
  for(const s of c.seances){
    if(seanceReussie(c.id, s.numero)) continue;
    return { numero:s.numero, mode: estLue(c.id, s.numero) ? "qcm" : "lire" };
  }
  return null;
}

function rendreAccueil(){
  if(modeBrevet()) return rendreAccueilBrevet();
  const c = coursEnCours();
  const parts = [];

  /* Avertissement visible : sans stockage, chaque fermeture efface tout.
     Le signaler dans la console ne servirait a rien sur un telephone. */
  if(!STOCKAGE_OK){
    parts.push(`<div class="avis"><strong>Ce navigateur n’enregistre pas votre progression.</strong>

  parts.push(rappelCompte());
  /* Le Quiz of the Day en tete : un encart a part, qu'on ne peut pas manquer. */
  parts.push(carteQuizJour());

  /* -- Reprendre : la carte la plus importante de l'application -- */
  parts.push(`<div class="filet"><span>${c && coursAValider(c.id) ? "À valider"
    : c && !coursCommence(c.id) ? "Commencer" : "Reprendre"}</span></div>`);

      restent accessibles pour réviser, et de nouveaux cours s’ajoutent à chaque mise à jour.</p>
      <button class="bouton" data-action="onglet" data-onglet="quiz">Réviser au quiz</button></div>`);
  }else{
    const r = reprise(c);
    const n = r ? r.numero : 1;
    const s = c.seances.find(x => x.numero === n) || c.seances[0];
    const nonLues = seancesNonLues(c.id);
    parts.push(`<div class="carte">
      <div class="reprise">
        ${anneauCours(c.id, 58)}
        <div class="corps">
          <p class="minuscule" style="margin:0 0 2px">${tx(c.periode)} &#8226; ${tx(c.dates)}</p>

        </div>
      </div>
      <p class="minuscule" style="margin:12px 0 10px">
        ${nbLues(c.id)} séance${nbLues(c.id) > 1 ? "s" : ""} lue${nbLues(c.id) > 1 ? "s" : ""} sur ${SEANCES_PAR_COURS}, ${nbFaites(c.id)} QCM validé${nbFaites(c.id) > 1 ? "s" : ""}${
          /* Nommer les seances sautees n'a de sens qu'une fois le cours
             entame : sur un cours neuf, ce serait lister les six. */
          nonLues.length && nonLues.length < SEANCES_PAR_COURS
            ? " &#8226; non lues&#8239;: " + enumerer(nonLues) : ""
        }</p>
      ${ rythmeAtteint()
        ? `<p class="minuscule" style="margin:0 0 10px"><em>Vous avez déjà travaillé aujourd’hui.
             Rien ne vous empêche de continuer&#8239;: le rythme n’est qu’un repère.</em></p>`
        : "" }
      <div class="rang-boutons">
        ${ r && r.mode === "qcm"
          ? `${avisRefaire(c.id, n)}<button class="bouton-plein" data-action="quiz-seance" data-cours="${esc(c.id)}"
               data-seance="${n}" style="flex:1 1 100%">${estFaite(c.id, n) ? "Refaire" : "Passer"} le QCM de la séance ${n}</button>
             <button class="bouton" data-action="reprendre" data-cours="${esc(c.id)}"
               data-seance="${n}" style="flex:1 1 100%">Relire la séance</button>`
          : `<button class="bouton-plein" data-action="reprendre" data-cours="${esc(c.id)}"
               data-seance="${n}" style="flex:1 1 100%">Lire la séance ${n}</button>` }

     cours, et la forme des sept derniers jours. */
  const n = serie();

  parts.push(filet("Votre semaine", "semaine"));

    <div class="serie${n > 0 ? " vive" : ""}">

        <path d="M12 21c-1.8 0-3.2-1.4-3.2-3.3 0-1.9 1.6-2.9 2.2-4.5.9 1.4 4.2 2.4 4.2 4.5 0 1.9-1.4 3.3-3.2 3.3z"/>
      </svg>
      <div>

      </div>

        <div class="minuscule" style="margin:0">${
          sem.filter(j => j.actif).length } jour${
          sem.filter(j => j.actif).length > 1 ? "s" : "" } sur 7</div>
        <div class="minuscule" style="margin:0">${
          dateDerniereSeance()
            ? "dernière séance&#8239;: " + dateLisible(dateDerniereSeance())
            : "votre première séance ouvrira la série"}</div>
      </div>
    </div>
    <div class="ruban">${sem.map(j =>
      `<div class="jour${j.actif ? " actif" : ""}${j.aujourdhui ? " aujourdhui" : ""}">

  /* -- Progression d'ensemble -- */
  const b = bilan();
  const moy = scoreMoyen();
  parts.push(filet("Progression"));
  parts.push(`<div class="carte">
    <div class="stats">
      <div class="stat"><div class="v">${b.lues}</div><div class="l">Séances lues</div></div>
      <div class="stat"><div class="v">${b.termines}</div><div class="l">Cours terminés</div></div>
      ${moy === null ? "" :
        `<div class="stat"><div class="v">${moy}%</div><div class="l">Score moyen</div></div>`}
    </div>
    ${jauge(b.lues, b.seances)}

        b.maitrises ? " &#8226; " + b.maitrises + " maîtrisé" + (b.maitrises > 1 ? "s" : "") : ""}.
      ${moy === null ? "Le score moyen apparaîtra après votre premier QCM." : ""}

  /* -- Suggestion apres un cours termine -- */
  const termines = COURS.filter(x => coursMaitrise(x.id));
  if(termines.length && !(c && coursAValider(c.id))){
    const dernierTermine = termines[termines.length-1];

    if(sug && (!c || sug.id !== c.id)){
      parts.push(filet("Pour continuer"));
      parts.push(`<div class="carte">

        <button class="bouton" data-action="fiche" data-cours="${esc(sug.id)}">Ouvrir la fiche</button>
      </div>`);

  parts.push(carteBonusRestants());

  /* -- Derniers QCM : les trois derniers, pour memoire -- */
  const qcm = ETAT.historique.filter(h => h.total > 0);
  if(qcm.length){

      </li>`;
    }).join("") + `</ul></div>`);
  }

  /* -- Classement general, tout en bas (z0j_classement.js) -- */
  parts.push(carteClassement());

  document.getElementById("vue-accueil").innerHTML = parts.join("");

/* Le cours termine dont l'epreuve finale reste a reussir : l'accueil ne
   propose rien d'autre tant qu'elle n'est pas passee sans faute. */
function carteAValider(c){
  const e = (ETAT.cours[c.id] || {}).epreuve;
  const n = SEANCES_PAR_COURS * EPREUVE_PAR_SEANCE;
  return `<div class="carte a-valider">
    <div class="reprise">
      ${anneauCours(c.id, 58)}
      <div class="corps">
        <p class="minuscule" style="margin:0 0 2px">${tx(c.periode)} &#8226; ${tx(c.dates)}</p>
        <h2 style="font-size:22px">${tx(c.titre)}</h2>
        <p style="margin:6px 0 0"><span class="etiq a-valider">pas encore validé</span></p>
      </div>
    </div>
    <p class="secondaire" style="margin:12px 0 10px">Les 6 séances et leurs QCM sont faits. Pour valider
      le cours, il reste l’<strong>épreuve finale</strong>&#8239;: ${n} questions, ${EPREUVE_PAR_SEANCE} par séance,
      à réussir sans faute. Recommencez autant de fois qu’il faut&#8239;: le tirage change à chaque fois.
      Le cours suivant vous sera proposé ensuite.</p>
    ${e ? `<p class="minuscule" style="margin:0 0 10px">Meilleur score&#8239;: ${e.meilleur}/${e.total}
      &#8226; ${e.tentatives} tentative${e.tentatives > 1 ? "s" : ""}</p>` : ""}
    <div class="rang-boutons">
      <button class="bouton-plein" data-action="quiz-epreuve" data-cours="${esc(c.id)}"
        style="flex:1 1 100%">Passer l’épreuve finale</button>
      <button class="bouton discret petit" data-action="fiche" data-cours="${esc(c.id)}"
        style="flex:1 1 100%">Revoir les 6 séances</button>
    </div>
  </div>`;
}

/* Les cours termines dont il reste un quiz bonus : le grand quiz du cours,
   ou un giga quiz ou il n'a pas encore figure. En bas de l'accueil, pour
   qu'aucun ne soit oublie. */
function carteBonusRestants(){
  const finis = COURS.filter(c => coursTermine(c.id));
  const restants = finis.map(c => ({ c, f: ETAT.cours[c.id] || {} })).filter(o => !o.f.grand || !o.f.giga);
  if(!restants.length) return "";
  const gigaOuvert = finis.length >= GIGA_MIN;
  const maxG = PTS_GRAND * GRAND_NB + PTS_GRAND_SANS_FAUTE, maxGiga = PTS_GIGA * GIGA_NB + PTS_GIGA_SANS_FAUTE;
  /* Deux cases cote a cote, toujours : ce qui est fait se coche, ce qui
     n'est pas encore ouvert le dit, sans disparaitre. */
  const kase = (nom, action, id, fait, detail, ferme) => `<button type="button" class="bonus-case${fait ? " faite" : ""}"
      data-action="${action}" data-cours="${esc(id)}"${ferme ? " disabled" : ""}>
      <span class="bc-nom">${fait ? "&#10003; " : ""}${nom}</span><span class="bc-pts">${detail}</span></button>`;
  return filet("Quiz bonus à faire") + `<div class="carte">
    <p class="secondaire" style="margin:0 0 4px">Des points à gagner sur vos cours terminés.</p>
    <ul class="liste bonus-restants">${restants.map(({ c, f }) => `<li><p class="t">${txDates(c.titre)}</p>
      <div class="bonus-duo">
        ${kase("Grand quiz", "quiz-grand", c.id, !!f.grand,
          f.grand ? ptsGrand(f.grand) + "/" + maxG + " pts" : "jusqu’à " + maxG + " pts")}
        ${kase("Giga quiz", "giga-vers", c.id, !!f.giga,
          f.giga ? ptsGiga(f.giga) + " pts" : gigaOuvert ? "jusqu’à " + maxGiga + " pts" : "dès " + GIGA_MIN + " cours terminés",
          !f.giga && !gigaOuvert)}
      </div></li>`).join("")}</ul></div>`;
}

  document.getElementById("vue-reglages").innerHTML = parts.join("");
}

/* ---------- 4.5  Onglet Cours ---------- */

/* Ecran courant de l'onglet Cours. */
let ECRAN = { nom:"catalogue", coursId:null, seance:null };
/* Entree de lecture du catalogue : "theme", "periode" ou "frise". */
let CLASSEMENT = ETAT.reglages.classement || "theme";
/* Le tirage au hasard se limite-t-il aux cours jamais commences ? */
let HASARD_NEUF = ETAT.reglages.hasardNeuf !== false;
/* Les sections du sommaire ouvertes a l'ecran. Rien n'est enregistre :
   chaque ouverture de l'application repart du sommaire replie, qui est la
   vue d'ensemble, et deplier est l'affaire d'un doigt. */
const OUVERTS = new Set();
/* Recherche libre dans le catalogue, et filtre d'avancement. */
let RECHERCHE = "";
let AVANCEMENT = "tous";   // "tous" | "encours" | "neufs" | "termines"

/* Comparaison insensible aux accents et a la casse : chercher
   << decolonisation >> doit trouver << Décolonisations >>. */
function sansAccent(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}

/* Les cours retenus par la recherche et l'avancement. Le
   tirage au hasard s'appuie sur cette meme definition : ce qui sort est
   toujours pris parmi ce que l'on a sous les yeux. */
function coursAffiches(){
  const q = sansAccent(RECHERCHE.trim());
  return COURS.filter(c => {
    if(AVANCEMENT === "termines" && !coursTermine(c.id)) return false;
    if(AVANCEMENT === "maitrises" && !coursMaitrise(c.id)) return false;
    if(AVANCEMENT === "neufs" && coursCommence(c.id)) return false;
    if(AVANCEMENT === "encours" && (!coursCommence(c.id) || coursTermine(c.id))) return false;
    if(q){
      const foin = sansAccent([c.titre, c.problematique, c.dates, c.theme, c.periode,
                               c.note || ""].join(" "));
      if(foin.indexOf(q) < 0) return false;
    }
    return true;
  });
}

/* Tire un cours parmi ceux affiches, eventuellement restreint a ceux
   qu'on n'a jamais ouverts. Renvoie null s'il n'y a aucun candidat. */
function tirerCours(){
  let candidats = coursAffiches();
  if(HASARD_NEUF) candidats = candidats.filter(c => !coursCommence(c.id));
  if(!candidats.length) return null;
  return candidats[Math.floor(Math.random() * candidats.length)];
}

function rendreCours(){
  const vue = document.getElementById("vue-cours");
  if(ECRAN.nom === "b-fiche") return rendreFicheBrevet(vue);
  if(modeBrevet() && ECRAN.nom === "catalogue") return rendreChapitres(vue);
  if(ECRAN.nom === "fiche") return rendreFiche(vue);
  if(ECRAN.nom === "lecture") return rendreLecture(vue);
  if(ECRAN.nom === "relecture") return rendreRelecture(vue);
  return rendreCatalogue(vue);
}

/* --- Liste des points a verifier -------------------------------------
   Un plan de travail, non un rapport : chaque point se coche, le compte
   se met a jour, et un bouton ouvre la seance concernee a l'endroit ou
   le point se trouve. */
function rendreRelecture(vue){
  const tous = tousMarqueurs();
  const faits = tous.filter(x => x.fait).length;
  const parts = [];
  parts.push(`<div class="fil"><button class="bouton petit discret retour" data-action="onglet" data-onglet="accueil">
    <span aria-hidden="true">&#8592;</span><span class="nom">Accueil</span></button></div>`);
  parts.push(`<div class="filet"><span>Points à vérifier</span></div>`);
  parts.push(`<div class="carte">
    <div class="reprise">
      ${anneau(faits, tous.length, 58)}
      <div class="corps">
        <p class="minuscule" style="margin:0"><strong>${faits}</strong> point(s) relu(s)
          sur ${tous.length}</p>
        <p class="secondaire" style="margin:6px 0 0">Chaque ligne signale une date, un chiffre
          ou une attribution que la rédaction a jugés douteux ou discutés. Cochez ce que vous
          avez vérifié&#8239;: la liste garde la trace.</p>
      </div>
    </div>
    <div class="champ" style="margin-top:10px">
      <span class="txt"><strong>Afficher les repères dans les séances</strong>
        <small>Les mêmes points apparaissent alors en marge du texte, numérotés comme ici.</small></span>
      <button class="interrupteur" role="switch" data-action="bascule-relecture"
