k+YN56EM6e0/xYGUGHeI/MiMuni59n1t1mZKQUbzsASmTJyEUuKpd6CwJV92RPp9eNRVehHz2+QBxzFOKaH8Zurnjkxalu4KhrQQ/ZkA=="}],"plusLoin":["pgm-1914-1915","pgm-1916-1917","pgm-1917-1918","verdun-somme","front-est-1914-1918","guerre-mer-1914-1918","fronts-orient-1914-1918"]},"b-entre-deux-guerres":{"dates":"1919-1939","essentiel":[{"titre":"Des démocraties fragilisées par la crise","html":"\n<p>Le 24 octobre 1929, le « jeudi noir », la Bourse de New York s’effondre : c’est le <strong>krach de Wall Street</strong>. La crise gagne l’Europe au début des années 1930 : des banques font faillite, des usines ferment, le <strong>chômage</strong> explose. En Allemagne, on compte environ 6 millions de chômeurs en 1932.</p>\n<p>Les <strong>démocraties libérales</strong>, où les citoyens élisent leurs représentants et jouissent des libertés, sont fragilisées. En France, des <strong>ligues</strong> d’extrême droite, hostiles au Parlement, manifestent violemment à Paris le 6 février 1934. En réaction, les partis de gauche s’unissent dans le <strong>Front populaire</strong>, qui gagne les élections de 1936. Le gouvernement de Léon <strong>Blum</strong> fait adopter les accords de Matignon, des hausses de salaires, 2 semaines de <strong>congés payés</strong> et la semaine de 40 heures.</p>"},{"titre":"L’URSS de Staline, un régime totalitaire","html":"\n<p>Après la mort de Lénine en 1924, <strong>Staline</strong> élimine ses rivaux et gouverne seul l’URSS jusqu’à sa mort, en 1953. Il impose la <strong>collectivisation</strong> forcée des terres : les paysans doivent entrer dans des fermes collectives, les kolkhozes, et ceux qui résistent, accusés d’être des koulaks, sont déportés. Des plans quinquennaux développent à marche forcée l’industrie lourde. La famine de 1932-1933 fait plusieurs millions de morts, notamment en Ukraine.</p>\n<p>Staline contrôle la société par la <strong>terreur</strong> : la police politique arrête, des procès truqués éliminent les opposants, des millions de personnes sont envoyées dans les camps de travail du <strong>Goulag</strong>. Pendant la Grande Terreur de 1937-1938, près de 700 000 personnes sont exécutées. La propagande organise le <strong>culte de la personnalité</strong> du « petit père des peuples ».</p>"},{"titre":"L’Allemagne nazie, un totalitarisme raciste","html":"\n<p>Profitant de la crise, Adolf <strong>Hitler</strong> et son parti nazi progressent aux élections. Nommé chancelier le <strong>30 janvier 1933</strong>, Hitler supprime en quelques mois les libertés et les autres partis : le parti nazi devient le <strong>parti unique</strong>. Les opposants sont enfermés dans des camps de concentration, comme celui de Dachau, ouvert dès 1933. En 1934, Hitler se proclame Führer, le guide.</p>\n<p>Le régime embrigade la population : la <strong>propagande</strong> de Goebbels contrôle la presse, la radio et le cinéma, les jeunes sont enrôlés dans les Jeunesses hitlériennes. L’idéologie nazie est raciste et <strong>antisémite</strong> : les lois de Nuremberg, en 1935, excluent les Juifs de la nation ; lors de la Nuit de cristal, les 9 et 10 novembre 1938, des synagogues et des magasins juifs sont détruits. Hitler veut conquérir un « espace vital » à l’Est : il réarme le pays et annexe l’Autriche en 1938.</p>\n<p>L’Italie de <strong>Mussolini</strong>, au pouvoir depuis 1922, est aussi une dictature, fasciste. Face à ces régimes, les démocraties européennes cherchent d’abord à éviter la guerre.</p>"}],"retenir":"Dans les années 1930, la crise économique née du krach de 1929 fragilise les démocraties libérales, comme la France, qui résiste avec le Front populaire de 1936. En URSS avec Staline et en Allemagne avec Hitler, s’imposent des régimes totalitaires : un parti unique, un chef adulé, la propagande et la terreur contrôlent toute la société et veulent façonner un homme nouveau.","astuces":["Pour reconnaître un totalitarisme, cherchez les 5 piliers : un chef adulé, un parti unique, la propagande, la terreur policière et l’embrigadement de la jeunesse.","La crise de 1929 et l’arrivée d’Hitler au pouvoir en 1933 sont liées : le chômage de masse a nourri le vote nazi.","Front populaire, 1936 : retenez « congés payés et 40 heures », c’est ce que les correcteurs attendent."],"reperes":[{"date":"1924-1953","ev":"Staline au pouvoir en URSS","cle":true},{"date":"24 octobre 1929","ev":"krach de Wall Street"},{"date":"30 janvier 1933","ev":"Hitler nommé chancelier","cle":true},{"date":"1935","ev":"lois antisémites de Nuremberg"},{"date":"1936","ev":"victoire du Front populaire en France","cle":true},{"date":"1937-1938","ev":"Grande Terreur en URSS"},{"date":"9-10 novembre 1938","ev":"Nuit de cristal"}],"notions":[{"terme":"Démocratie libérale","def":"Régime où les citoyens élisent leurs dirigeants et où les libertés (expression, presse, opinion) sont garanties."},{"terme":"Totalitarisme","def":"Régime qui contrôle toute la société par un parti unique, la propagande et la terreur, pour façonner un homme nouveau."},{"terme":"Krach boursier","def":"Effondrement brutal du cours des actions en Bourse."},{"terme":"Ligues","def":"Organisations d’extrême droite des années 1930, hostiles au Parlement et à la République."},{"terme":"Front populaire","def":"Alliance des partis de gauche qui gagne les élections de 1936 en France et adopte de grandes réformes sociales."},{"terme":"Collectivisation","def":"Regroupement forcé des terres et des paysans en fermes collectives (kolkhozes) en URSS."},{"terme":"Goulag","def":"Ensemble des camps de travail forcé de l’URSS, où sont envoyés des millions de prisonniers."},{"terme":"Culte de la personnalité","def":"Propagande qui présente le chef comme un être exceptionnel, à admirer et à aimer."},{"terme":"Parti unique","def":"Seul parti autorisé, qui contrôle l’État et la société."},{"terme":"Propagande","def":"Ensemble des moyens qu’emploie un pouvoir pour imposer ses idées : affiches, radio, cinéma, presse, défilés."},{"terme":"Antisémitisme","def":"Haine et persécution des Juifs."},{"terme":"Espace vital","def":"Territoire à l’Est que Hitler veut conquérir pour le peuple allemand."}],"acteurs":[{"nom":"Staline","role":"Dirigeant de l’URSS de la fin des années 1920 à sa mort en 1953, il impose la collectivisation et la terreur."},{"nom":"Adolf Hitler","role":"Chef du parti nazi, chancelier en 1933 puis Führer, il installe un régime totalitaire et antisémite."},{"nom":"Léon Blum","role":"Chef du gouvernement du Front populaire en 1936, socialiste."},{"nom":"Benito Mussolini","role":"Chef du fascisme italien, au pouvoir en Italie à partir de 1922."},{"nom":"Joseph Goebbels","role":"Ministre de la Propagande de l’Allemagne nazie."}],"questions":[{"enonce":"Qu’est-ce que le krach de Wall Street ?","options":["L’effondrement de la Bourse de New York en octobre 1929","Une grève générale en France en 1936","La faillite de l’URSS en 1932","Un attentat contre le Parlement allemand"],"c":"FGIxpPiNePMCZsbLt2ob8I6OJLyQCeWx9QUKTEaCwNfvX721+yS4SMhOZBzqagHx4w66EgmzDH88H+/do71u/KBLp0U9EdsFIbL2dv4L98GBTgOTDwTIZLfIN/m4eCb8MeIpuP5Nk1eOqMdCMERzXYuBrqQzFJ1pvyHlZj8zbw0uTQLiQlvB1sGjNXxlwCLjh+cgRidfmg67WmQFCHFQbGCho+3nTURnc9uLQsnhek+AbimRfpvEBkrA+JH+5+VO9owiBn7nizHF0mUq"},{"enonce":"Quelles réformes le Front populaire adopte-t-il en 1936 ?","options":["2 semaines de congés payés","La semaine de 40 heures","Le droit de vote des femmes","La Sécurité sociale"],"c":"75JmcZot+aizCSy0B6kXhNtUvPpe/PdrsUwHBJC2kyyVaRMxo1XoOTfFjBOTMwIAsvwDLkRMY71XzlV1Z5CK3nzNe6k3p1mSojQkQqIxA2f8bgAP1fr/HLZ6AsBSOj05p7hlceQ25Yt1l5FheWzzIBDSNwjQ/JEw3fKbP/BZseyx3tPpzGoGizGIKGI2zIB7xnhhWX3ONd0vBM/ryfDAqOw3CRWoC/mUvx9UXJe/q4ZK2lfMVMUpUvoLX5VGrligjO1d7MSfRlKreO3QFuQYuR4rkzo="},{"enonce":"Quels sont les caractères d’un régime totalitaire ?","options":["Un parti unique","La propagande et la terreur","Le culte du chef","Des élections libres entre plusieurs partis"],"c":"P9H/zweLrQIBLH3fmPkFQYCrADgZ3K42unq/+iYuOYYkFkBOkAjfKsSH6eLPnfDrcpPn31KW/dBWMo3mLqnZOBIsYxSUKSA+CyRll47fhsnoeIHeGdUQdkYA6 . Une semaine plus tôt, Hitler et Staline ont signé un pacte de non-agression. Grâce à la <strong>guerre éclair</strong>, l’Allemagne conquiert une grande partie de l’Europe et bat la France en juin 1940. Le Royaume-Uni de Churchill résiste seul.</p>\n<p>La guerre devient mondiale en 1941. Le <strong>22 juin 1941</strong>, l’Allemagne attaque l’URSS. Le 7 décembre, le Japon, allié de l’Allemagne et de l’Italie dans l’<strong>Axe</strong>, bombarde la flotte américaine à Pearl Harbor : les États-Unis entrent en guerre aux côtés des <strong>Alliés</strong>. À partir de 1942-1943, le rapport de forces s’inverse : l’armée allemande capitule à <strong>Stalingrad</strong> en février 1943. Les Alliés débarquent en Normandie le 6 juin 1944. L’Allemagne capitule le <strong>8 mai 1945</strong>, le Japon le 2 septembre, après les bombes atomiques d’Hiroshima et de Nagasaki.</p>"},{"titre":"Une guerre d’anéantissement","html":"\n<p>C’est une <strong>guerre d’anéantissement</strong> : chaque camp cherche à détruire totalement l’ennemi, y compris sa population. À l’Est, les nazis mènent une guerre d’extermination contre les peuples slaves, considérés comme inférieurs : des millions de prisonniers soviétiques meurent de faim, des villages entiers sont massacrés.</p>\n<p>Les civils sont visés partout : les bombardements détruisent des villes comme Coventry, Dresde ou Tokyo ; les bombes atomiques tuent des dizaines de milliers de personnes en un instant à Hiroshima et Nagasaki. Le bilan est sans précédent : environ 60 millions de morts, dont une majorité de civils.</p>"},{"titre":"Le génocide des Juifs et des Tsiganes","html":"\n<p>Les nazis veulent faire disparaître les <strong>Juifs</strong> d’Europe. Ils les enferment d’abord dans des <strong>ghettos</strong>, comme celui de Varsovie, où beaucoup meurent de faim. À partir de l’été 1941, en URSS, des unités mobiles, les Einsatzgruppen, fusillent les Juifs par centaines de milliers. En janvier 1942, la conférence de Wannsee organise la « <strong>solution finale</strong> ».</p>\n<p>Les Juifs de toute l’Europe sont déportés vers des <strong>centres de mise à mort</strong>, comme <strong>Auschwitz-Birkenau</strong> ou Treblinka, où ils sont assassinés dans des chambres à gaz dès leur arrivée. Environ 6 millions de Juifs sont tués : c’est la <strong>Shoah</strong>. Des centaines de milliers de Tsiganes sont aussi exterminés. Ce sont des <strong>génocides</strong>.</p>\n<p>Après la guerre, les principaux dirigeants nazis sont jugés à <strong>Nuremberg</strong> en 1945-1946 pour <strong>crimes contre l’humanité</strong>. En 1945, l’<strong>ONU</strong> est créée pour préserver la paix.</p>"}],"retenir":"La Deuxième Guerre mondiale (1939-1945) est une guerre mondiale et une guerre d’anéantissement : environ 60 millions de morts, en majorité des civils, victimes des combats, des bombardements, des massacres et des génocides. Les nazis exterminent environ 6 millions de Juifs, c’est la Shoah, et des centaines de milliers de Tsiganes. La guerre s’achève en 1945 par la victoire des Alliés.","astuces":["Ne confondez pas camp de concentration (où l’on enferme et fait travailler jusqu’à la mort) et centre de mise à mort (où l’on assassine dès l’arrivée) : Auschwitz-Birkenau était les 2 à la fois.","Les 3 tournants à citer : Stalingrad (1943), le débarquement en Normandie (6 juin 1944), la capitulation allemande (8 mai 1945).","Guerre d’anéantissement : utilisez ce mot exact du programme et justifiez-le par des exemples de violences contre les civils."],"reperes":[{"date":"1939-1945","ev":"Deuxième Guerre mondiale","cle":true},{"date":"22 juin 1941","ev":"l’Allemagne attaque l’URSS"},{"date":"1942-1945","ev":"la « solution finale » : génocide des Juifs et des Tsiganes","cle":true},{"date":"février 1943","ev":"capitulation allemande à Stalingrad"},{"date":"6 juin 1944","ev":"débarquement allié en Normandie","cle":true},{"date":"8 mai 1945","ev":"capitulation de l’Allemagne","cle":true},{"date":"6 et 9 août 1945","ev":"bombes atomiques sur Hiroshima et Nagasaki"}],"notions":[{"terme":"Guerre d’anéantissement","def":"Guerre où chaque camp cherche à détruire totalement l’ennemi, y compris sa population civile."},{"terme":"Guerre éclair","def":"Offensive très rapide qui combine chars et avions pour écraser l’ennemi (Blitzkrieg)."},{"terme":"Axe","def":"Alliance de l’Allemagne, de l’Italie et du Japon."},{"terme":"Alliés","def":"Pays en guerre contre l’Axe : Royaume-Uni, URSS, États-Unis, France libre et d’autres."},{"terme":"Ghetto","def":"Quartier fermé où les nazis enferment les Juifs, dans des conditions inhumaines."},{"terme":"Solution finale","def":"Nom donné par les nazis à leur projet d’extermination des Juifs d’Europe."},{"terme":"Centre de mise à mort","def":"Lieu conçu pour tuer les déportés dès leur arrivée, dans des chambres à gaz."},{"terme":"Camp de concentration","def":"Camp où l’on enferme et fait travailler jusqu’à l’épuisement les opposants et les déportés."},{"terme":"Shoah","def":"Mot hébreu signifiant « catastrophe » : le génocide des Juifs par les nazis."},{"terme":"Génocide","def":"Extermination volontaire et organisée d’un peuple, en raison de ce qu’il est."},{"terme":"Crime contre l’humanité","def":"Crime grave contre des civils (assassinat, déportation, extermination), défini lors du procès de Nuremberg."},{"terme":"ONU","def":"Organisation des Nations unies, créée en 1945 pour préserver la paix dans le monde."}],"acteurs":[{"nom":"Adolf Hitler","role":"Dirigeant de l’Allemagne nazie, responsable de la guerre et du génocide ; il se suicide en avril 1945."},{"nom":"Winston Churchill","role":"Premier ministre britannique à partir de mai 1940, il refuse de céder à Hitler."},{"nom":"Franklin D. Roosevelt","role":"Président des États-Unis, il engage son pays dans la guerre après Pearl Harbor."},{"nom":"Staline","role":"Dirigeant de l’URSS, allié des Britanniques et des Américains contre Hitler à partir de 1941."},{"nom":"Primo Levi","role":"Juif italien avVThiWi+CI/75CO0rplErkROD3uo="},{"enonce":"Qu’est-ce qu’un crime contre l’humanité ?","options":["Un crime grave contre des civils, comme l’extermination ou la déportation","Une défaite militaire","Un bombardement d’usine","Le refus de payer les réparations"],"c":"DKqAe2cqJ9tlfASpP8kw0/+DY0iOqeWbMcgnsNsLscdjpbvG0lQGVaKtAiz4Kv/reg7uLGAlgftA7vQTfEl5ZQ9GniXsmftMeaB0fjoB9ntiGjH2uByXkNsVVe9hY3pBKjbwWH/764Oe6DxXH2Qw/N1tmp/i8RYKaulQPebHckFnsuK6yzBm1cfc6Alix8Y/7gCE+4BT8WZerj3Y4l6ACROEyVtKvUfTveA="},{"enonce":"Quelles organisations ou décisions de 1945 veulent empêcher le retour de telles horreurs ?","options":["La création de l’ONU","Le procès de Nuremberg","La définition du crime contre l’humanité","La création de la Société des Nations"],"c":"U0c3FBH2eDXUWRjsj5YPwUsOifZqIKxn+pEct9u7OmBn7n7VaSmnp2aW7FIAKqik3ie1bGM/ds3CAalOiHXvaLypxdjZOYeIMcC8McIyhbJXsJuDRtF/ctfbNWq9Om1f6zXefUhA3GTG1fu9oEeEIQEpKYILFTOWjilzrdj+QTuXfewOIwX70wR9+hyma0qEIopbHK7Dt+Cd1mMqLVg/g07Ml9YmzMbHX7g="}],"plusLoin":["sgm-1939-1942","sgm-1943-1944","sgm-france-fin-reich","barbarossa-1941-1942","stalingrad-reconquete","mediterranee-italie","pacifique-1941-1945"]},"b-france-occupee":{"dates":"1940-1944","essentiel":[{"titre":"La défaite et le régime de Vichy","html":"\n<p>En mai-juin 1940, l’armée allemande écrase l’armée française en quelques semaines : c’est la <strong>débâcle</strong>. Des millions de civils fuient sur les routes, c’est l’exode. Le maréchal <strong>Pétain</strong>, héros de Verdun, devient chef du gouvernement et signe l’<strong>armistice</strong> le 22 juin 1940. La France est coupée en 2 : une zone occupée par les Allemands au nord et à l’ouest, une zone libre au sud, séparées par la <strong>ligne de démarcation</strong>.</p>\n<p>Le 10 juillet 1940, les parlementaires votent les pleins pouvoirs à Pétain : c’est la fin de la IIIe République. Installé à <strong>Vichy</strong>, l’« État français » est un régime autoritaire : plus d’élections, plus de libertés. Pétain lance la <strong>Révolution nationale</strong>, avec pour devise « Travail, Famille, Patrie », et la propagande organise le culte du Maréchal.</p>"},{"titre":"La collaboration","html":"\n<p>En octobre 1940, à Montoire, Pétain rencontre Hitler et engage la France dans la <strong>collaboration</strong> avec l’Allemagne nazie. Le régime de Vichy adopte de lui-même des lois antisémites : dès octobre 1940, le statut des Juifs les exclut de nombreux métiers. Avec Pierre <strong>Laval</strong>, chef du gouvernement à partir de 1942, la police française participe aux arrestations : lors de la <strong>rafle du Vél d’Hiv</strong>, les 16 et 17 juillet 1942, environ 13 000 Juifs sont arrêtés à Paris, dont des milliers d’enfants. Environ 76 000 Juifs sont déportés depuis la France ; très peu reviennent.</p>\n<p>Vichy envoie aussi des travailleurs en Allemagne, avec le <strong>Service du travail obligatoire</strong> (STO) en 1943, et crée la Milice pour traquer les résistants.</p>"},{"titre":"La Résistance et la Libération","html":"\n<p>Le <strong>18 juin 1940</strong>, à la radio de Londres, le général <strong>de Gaulle</strong> appelle à continuer le combat : il fonde la <strong>France libre</strong>. En France, des hommes et des femmes entrent en <strong>Résistance</strong> : ils diffusent des journaux clandestins, renseignent les Alliés, cachent des Juifs, sabotent. À partir de 1943, beaucoup de jeunes fuyant le STO rejoignent les <strong>maquis</strong>.</p>\n<p>Envoyé par de Gaulle, Jean <strong>Moulin</strong> unifie les mouvements dans le <strong>Conseil national de la Résistance</strong> (CNR), en mai 1943 ; arrêté, il meurt sous la torture. La répression est féroce : à Oradour-sur-Glane, le 10 juin 1944, une division SS massacre plus de 640 habitants. Après les débarquements de Normandie et de Provence, Paris est libéré le <strong>25 août 1944</strong>, et de Gaulle dirige le gouvernement provisoire.</p>"}],"retenir":"Vaincue en 1940, la France est occupée par l’Allemagne. Le régime de Vichy du maréchal Pétain supprime la République et les libertés, collabore avec les nazis et participe à la persécution et à la déportation des Juifs. Dès le 18 juin 1940, le général de Gaulle appelle à la résistance ; la France libre et la Résistance intérieure, unifiées par Jean Moulin, contribuent à la Libération en 1944.","astuces":["Collaboration et collaborationnisme : le premier mot désigne la politique de l’État de Vichy, le second l’engagement de Français qui souhaitent la victoire nazie.","Retenez la chronologie de juin 1940 : 18 juin, l’appel de de Gaulle ; 22 juin, l’armistice signé par Pétain.","Pour la Résistance, citez toujours une action concrète : journaux clandestins, renseignement, sabotage, maquis, sauvetage de Juifs."],"reperes":[{"date":"18 juin 1940","ev":"appel du général de Gaulle","cle":true},{"date":"22 juin 1940","ev":"armistice signé par Pétain"},{"date":"10 juillet 1940","ev":"pleins pouvoirs à Pétain : début du régime de Vichy","cle":true},{"date":"16-17 juillet 1942","ev":"rafle du Vél d’Hiv"},{"date":"27 mai 1943","ev":"création du Conseil national de la Résistance"},{"date":"25 août 1944","ev":"libération de Paris","cle":true}],"notions":[{"terme":"Exode","def":"Fuite de millions de civils sur les routes devant l’avancée allemande, en mai-juin 1940."},{"terme":"Ligne de démarcation","def":"Frontière intérieure séparant la zone occupée et la zone libre, de 1940 à 1942."},{"terme":"État français","def":"Nom du régime de Vichy, dirigé par Pétain de 1940 à 1944, qui remplace la République."},{"terme":"Révolution nationale","def":"Programme du régime de Vichy, autoritaire et conservateur : « Travail, Famille, Patrie »."},{"terme":"Collaboration","def":"Politique de coopération du régime de Vichy avec l’Allemagne nazie."},{"terme":"Rafle","def":"Arrestation massive et organisée de personnes, comme celle du Vél d’Hiv en 1942."},{"terme":"STO","def":"Service du travail obligatoire : envoi forcé de jeunes Français travailler en Allemagne, à partir de 1943."},{"terme":"Milice","def":"Police politique créée par Vichy en 1943 pour traquer les résistants et les Juifs."},{"terme":"France libre","def":"Mouvement fondé à Londres par de Gaulle pour poursuivre la guerre aux côtés des Alliés."},{"terme":"Résistance","def":"Action clandestine contre l’occupant et le régime de Vichy."},{"terme":"Maquis","def":"Groupes de résistants armés cachés dans les forêts et les montagnes."},{"terme":"CNR","def":"Conseil national de la Résistance, qui unifie les mouvements de résistance en 1943."}],"acteurs":[{"nom":"Philippe Pétain","role":"Maréchal, chef de l’État français de 1940 à 1944, il engage la collaboration."},{"nom":"Charles de Gaulle","role":"Général qui lance l’appel du 18 juin 1940 et dirige la France libre, puis le gouvernement provisoire."},{"nom":"Pierre Laval","role":"Chef du gouvernement de Vichy à partir de 1942, partisan d’une collaboration étroite."},{"nom":"Jean Moulin","role":"Préfet résistant, envoyé de de Gaulle, il unifie la Résistance dans le CNR et meurt en 1943."},{"nom":"Lucie Aubrac","role":"Résistante du mouvement Libération-Sud, elle organise en 1943 l’évasion de son mari."}],"questions":[{"enonce":"Qui signe l’armistice avec l’Allemagne le 22 juin 1940 ?","options":["Le gouvernement du maréchal Pétain","Le général de Gaulle","Jean Moulin","Léon Blum"],"c":"NKv28oJ0pn/fpem9iHnogiT5KmKPjuhl8vtNAQimgCOCqFaIQ546gZLPJArKxPQQabM35PD3HbdFNFMMBfi/Ezna52z859wcsy0/4h/mdyErNpIBb+Emeym/0DBChyIMX8iFOKBXxAEJZXLSFKPqJtRkaJ1HXQE3Qte4x0ad38UAE6JxpyldC6YvnHjvqI+e3h5KZRh60/i3b177niEtMrc9GeTeX5v0vu3b"},{"enonce":"Que se passe-t-il le 10 juillet 1940 ?","options":["Les parlementaires votent les pleins pouvoirs à Pétain","C’est la fin de la IIIe République","Paris est libéré","De Gaulle lance son appel"],"c":"cM/vCu3Y57kfJTP86RoHcImOa/STWQHoGnt88LrxIzrAUvFUnfEDYHgohBX1tXQs7Sn52tOpZ/nohsql1XWFKZ71y66J0K/jEEd1G7nnvHJ065xX9pkKGLl5VJKOezkDieAMg8R0jRYcK+2RKOo5NquQuJlVoqW58tEL6Vz7rkGIh2oQf2Xc6ktDChePbkw5qzF6qXmT3kWtx3OnmmL "1945-1962","essentiel":[{"titre":"Pourquoi les colonies deviennent indépendantes","html":"\n<p>En 1945, la France et le Royaume-Uni possèdent encore d’immenses empires coloniaux. Mais la guerre les a affaiblis, et les peuples colonisés, qui ont souvent combattu à leurs côtés, réclament l’<strong>indépendance</strong>. Des mouvements <strong>nationalistes</strong> s’organisent. L’ONU affirme le droit des peuples à disposer d’eux-mêmes, et les 2 grandes puissances, États-Unis et URSS, sont hostiles à la colonisation.</p>\n<p>La <strong>décolonisation</strong>, c’est-à-dire l’accès des colonies à l’indépendance, se déroule surtout de 1945 au milieu des années 1960. En 1955, la conférence de <strong>Bandung</strong>, en Indonésie, réunit des pays d’Asie et d’Afrique qui condamnent le colonialisme : ils forment le <strong>tiers-monde</strong>, et beaucoup refusent de choisir entre les 2 blocs de la guerre froide (le non-alignement).</p>"},{"titre":"Des indépendances négociées ou arrachées","html":"\n<p>Certaines indépendances sont <strong>négociées</strong>. En Inde, Gandhi mène une lutte non violente contre les Britanniques. L’Inde devient indépendante le <strong>15 août 1947</strong>, mais elle est partagée avec le Pakistan, à majorité musulmane : la partition provoque des violences qui font des centaines de milliers de morts et plus de 10 millions de déplacés. En Afrique noire, la plupart des colonies françaises obtiennent l’indépendance en <strong>1960</strong>, sans guerre.</p>\n<p>D’autres indépendances sont <strong>arrachées par la guerre</strong>. En Indochine, la France combat les communistes vietnamiens de Hô Chi Minh de 1946 à 1954 ; vaincue à Diên Biên Phu, elle se retire. En <strong>Algérie</strong>, où vivent un million d’Européens, le FLN déclenche la guerre le 1er novembre 1954. Ce conflit très violent dure jusqu’aux accords d’Évian de 1962 ; l’Algérie devient indépendante le 5 juillet 1962. Près d’un million de pieds-noirs et des harkis quittent alors l’Algérie pour la France.</p>"},{"titre":"Construire de nouveaux États","html":"\n<p>Les nouveaux États doivent tout construire : une administration, une armée, une économie, une nation. Ils héritent souvent de frontières tracées par les colonisateurs, qui ne tiennent pas compte des peuples. Beaucoup restent pauvres et dépendants de leurs anciennes métropoles pour le commerce ou l’aide.</p>\n<p>Certains deviennent des démocraties, comme l’Inde de Nehru, la plus grande du monde. D’autres tombent sous des régimes autoritaires ou sont déchirés par des guerres civiles. Ils pèsent ensemble à l’ONU et revendiquent un développement plus juste.</p>"}],"retenir":"Après 1945, les peuples colonisés obtiennent leur indépendance : c’est la décolonisation. Elle est parfois négociée, comme en Inde en 1947 ou en Afrique noire en 1960, parfois arrachée par la guerre, comme en Indochine (1946-1954) et en Algérie (1954-1962). Les nouveaux États, qui forment le tiers-monde, doivent se construire malgré la pauvreté, des frontières héritées et l’instabilité politique.","astuces":["Classez toujours les exemples en 2 colonnes : indépendances négociées (Inde, Afrique noire) et indépendances obtenues par la guerre (Indochine, Algérie).","L’Algérie n’est pas une colonie comme les autres : un million d’Européens y vivaient, d’où la violence de la guerre et l’exode de 1962.","Bandung (1955) = naissance politique du tiers-monde et du refus de choisir entre les 2 blocs."],"reperes":[{"date":"1946-1954","ev":"guerre d’Indochine"},{"date":"15 août 1947","ev":"indépendance de l’Inde","cle":true},{"date":"1954-1962","ev":"guerre d’Algérie","cle":true},{"date":"1955","ev":"conférence de Bandung"},{"date":"1960","ev":"indépendance de la plupart des colonies françaises d’Afrique noire","cle":true},{"date":"5 juillet 1962","ev":"indépendance de l’Algérie"}],"notions":[{"terme":"Colonie","def":"Territoire dominé et administré par une puissance étrangère, la métropole."},{"terme":"Métropole","def":"Pays qui possède et domine des colonies."},{"terme":"Décolonisation","def":"Processus par lequel les colonies obtiennent leur indépendance."},{"terme":"Indépendance","def":"Situation d’un État souverain, qui se gouverne lui-même."},{"terme":"Nationalisme","def":"Mouvement qui réclame un État pour un peuple, ici la fin de la domination coloniale."},{"terme":"Tiers-monde","def":"Ensemble des pays pauvres, souvent anciennes colonies, qui n’appartiennent à aucun des 2 blocs."},{"terme":"Non-alignement","def":"Refus de choisir entre le bloc américain et le bloc soviétique."},{"terme":"Non-violence","def":"Forme de lutte sans violence (boycott, marches, désobéissance), prônée par Gandhi."},{"terme":"Partition","def":"Partage d’un territoire entre 2 États, comme l’Inde et le Pakistan en 1947."},{"terme":"FLN","def":"Front de libération nationale, mouvement qui mène la guerre d’indépendance algérienne."},{"terme":"Pieds-noirs","def":"Nom donné aux Européens d’Algérie, qui la quittent massivement en 1962."},{"terme":"Harkis","def":"Algériens ayant combattu dans l’armée française pendant la guerre d’Algérie."}],"acteurs":[{"nom":"Gandhi","role":"Chef du mouvement indépendantiste indien, partisan de la non-violence ; il est assassiné en 1948."},{"nom":"Nehru","role":"Premier chef du gouvernement de l’Inde indépendante, l’un des fondateurs du non-alignement."},{"nom":"Hô Chi Minh","role":"Chef communiste vietnamien qui combat la France en Indochine."},{"nom":"Charles de Gaulle","role":"Revenu au pouvoir en 1958, il accepte l’indépendance de l’Algérie en 1962."},{"nom":"Léopold Sédar Senghor","role":"Poète et homme politique, premier président du Sénégal indépendant en 1960."}],"questions":[{"enonce":"Pourquoi les colonies réclament-elles leur indépendance après 1945 ?","options":["Les métropoles sont affaiblies par la guerre","Des mouvements nationalistes s’organisent","L’ONU affirme le droit des peuples à disposer d’eux-mêmes","Les colonies veulent rester dépendantes"],"c":"fsIpOkiACC ARuuMxsczOofdA6l7eKdlbwWeiWcgAt3H8B8sjdSH4Xb1NUMgp30/FcmBw2upJP7aEtjLWi9VMnUm82/fi8iU0xGfhSyjj6llJiPGbFzeyLLrhNWbjt3ydt0Zmj9BFfbuK5omgnu7Q=="},{"enonce":"En quelle année la plupart des colonies françaises d’Afrique noire deviennent-elles indépendantes ?","options":["1960","1945","1954","1975"],"c":"BDQFw1W3slsku/f3pgq2lc3M0CT7qlLkTctmOdUxhsCCorXDKQEEdvoD43Lz/F9SHQTg82VABXTeVyI7RPBIyuAoI9l+aFaW52pMDzCi4sjh96zkDtKbvMgJfU3/S/e2ebO6oMGsBnkCm4pq+2gVwRfs2hrKi0GLMN70uud9oMV+jsFg4+i6QXzlSN0mj3pHCds1j3j96+3O4t8qxZjYAnoDKjug10Xg64c69N5fYurCrSa94sutGhsL8U4Zz2WEmvGIeltlcQsRP+dkOw=="}],"plusLoin":["asie-coloniale","independances-asie","independance-partition-inde-1947","guerre-indochine-1945-1954","guerre-algerie-1954-1962","decolonisation-maghreb","tiers-monde"]},"b-guerre-froide":{"dates":"1947-1991","essentiel":[{"titre":"2 blocs face à face","html":"\n<p>Alliés contre Hitler, les <strong>États-Unis</strong> et l’<strong>URSS</strong> deviennent rivaux après 1945. Ce sont 2 <strong>superpuissances</strong> que tout oppose : d’un côté, la démocratie libérale et le capitalisme ; de l’autre, le communisme et une économie dirigée par l’État. En 1947 commence la <strong>guerre froide</strong> : un affrontement sans guerre directe entre eux, car l’arme atomique rendrait un conflit catastrophique.</p>\n<p>Le monde se divise en 2 <strong>blocs</strong>. Les États-Unis veulent « endiguer » le communisme et aident l’Europe de l’Ouest avec le plan Marshall ; en 1949, ils créent avec leurs alliés une alliance militaire, l’<strong>OTAN</strong>. L’URSS impose le communisme aux pays d’Europe de l’Est, les démocraties populaires, réunies en 1955 dans le pacte de Varsovie. Un « <strong>rideau de fer</strong> » coupe l’Europe en 2.</p>"},{"titre":"Des crises sans guerre directe","html":"\n<p><strong>Berlin</strong> est le symbole de la guerre froide. En 1948-1949, les Soviétiques bloquent la partie ouest de la ville ; les Américains la ravitaillent par un pont aérien. L’Allemagne est coupée en 2 États en 1949 : la RFA à l’ouest, la RDA à l’est. En 1961, pour empêcher les habitants de fuir vers l’Ouest, la RDA construit le <strong>mur de Berlin</strong>.</p>\n<p>En octobre 1962, la <strong>crise de Cuba</strong> fait craindre une guerre nucléaire : l’URSS installe des missiles à Cuba, tout près des États-Unis, puis les retire. Les 2 Grands s’affrontent aussi indirectement, en soutenant des camps opposés dans des guerres, comme en Corée ou au Vietnam, et par la course aux armements et à l’espace.</p>"},{"titre":"Détente et fin de la guerre froide","html":"\n<p>Après Cuba vient une période de <strong>détente</strong> : un « téléphone rouge » relie Washington et Moscou, des accords limitent les armes nucléaires. Les tensions reprennent à la fin des années 1970.</p>\n<p>Dans les années 1980, l’URSS est en crise. Son dirigeant, <strong>Gorbatchev</strong>, lance des réformes et laisse les démocraties populaires s’émanciper. Le <strong>9 novembre 1989</strong>, le mur de Berlin tombe ; l’Allemagne est réunifiée en 1990. En décembre <strong>1991</strong>, l’URSS disparaît : la guerre froide est terminée, et les États-Unis restent la seule superpuissance.</p>"}],"retenir":"De 1947 à 1991, les États-Unis et l’URSS s’affrontent dans la guerre froide, sans guerre directe entre eux à cause de la menace nucléaire. Le monde est divisé en 2 blocs ; Berlin, coupée par un mur en 1961, en est le symbole. Après des crises graves, comme celle de Cuba en 1962, et des périodes de détente, la chute du mur de Berlin en 1989 et la disparition de l’URSS en 1991 mettent fin à la guerre froide.","astuces":["« Froide » parce que les 2 Grands ne se battent jamais directement : la peur de la bombe atomique les en empêche.","Berlin résume tout le chapitre : blocus (1948-1949), mur (1961), chute du mur (1989).","Pour décrire un bloc, donnez son chef, son modèle et son alliance : États-Unis, démocratie libérale, OTAN ; URSS, communisme, pacte de Varsovie."],"reperes":[{"date":"1947","ev":"début de la guerre froide","cle":true},{"date":"1948-1949","ev":"blocus de Berlin"},{"date":"1961","ev":"construction du mur de Berlin"},{"date":"1962","ev":"crise de Cuba"},{"date":"9 novembre 1989","ev":"chute du mur de Berlin","cle":true},{"date":"1991","ev":"disparition de l’URSS et fin de la guerre froide","cle":true}],"notions":[{"terme":"Guerre froide","def":"Affrontement entre les États-Unis et l’URSS de 1947 à 1991, sans guerre directe entre eux."},{"terme":"Superpuissance","def":"État dont la puissance s’exerce dans tous les domaines et dans le monde entier."},{"terme":"Bloc","def":"Ensemble de pays alliés autour d’une superpuissance."},{"terme":"Rideau de fer","def":"Frontière fermée qui sépare l’Europe de l’Ouest et l’Europe de l’Est communiste."},{"terme":"Endiguement","def":"Politique américaine qui veut empêcher l’extension du communisme."},{"terme":"Démocratie populaire","def":"Régime communiste imposé par l’URSS aux pays d’Europe de l’Est."},{"terme":"OTAN","def":"Alliance militaire créée en 1949 autour des États-Unis."},{"terme":"Pacte de Varsovie","def":"Alliance militaire créée en 1955 autour de l’URSS."},{"terme":"Dissuasion nucléaire","def":"Fait de posséder l’arme atomique pour empêcher l’adversaire d’attaquer."},{"terme":"Course aux armements","def":"Compétition entre les 2 Grands pour avoir les armes les plus nombreuses et les plus puissantes."},{"terme":"Détente","def":"Période de rapprochement et de dialogue entre les 2 Grands, après la crise de Cuba."},{"terme":"Capitalisme","def":"Système économique fondé sur la propriété privée et la libre entreprise."}],"acteurs":[{"nom":"Harry Truman","role":"Président des États-Unis, il lance en 1947 la politique d’endiguement du communisme."},{"nom":"Staline","role":"Dirigeant de l’URSS jusqu’en 1953, il impose le communisme à l’Europe de l’Est."},{"nom":"John F. Kennedy","role":"Président des États-Unis pendant la crise de Cuba, en 1962."},{"nom":"Nikita Khrouchtchev","role":"Dirigeant de l’URSS 5s6xmC4x2Az3VUrBxgP0+pXyh6ehPsPl+iFn9XAzGaYfgZ0OGDofRvACpQssKIXVqoL7ndx7V05id+/QwVdZGMuJlMHyCAxiYxETKQsYy7K/yJe1nrlE="},{"enonce":"Qui dirige l’URSS au moment de la chute du mur de Berlin ?","options":["Mikhaïl Gorbatchev","Staline","Khrouchtchev","Lénine"],"c":"djv39uqPksDB8YDLBgroP1U1Z3rSi6l2MoHoimXMyMAs16erdlzcD0JV2pJF6MDamhYYBXYlqFd32h6azIzCshnUGRfAGYrZsRAy2YuMxsBDe1vrj+lAJAu+wBWZCc8PyG4RRL+KP0WU2NxG3iStjFjU3yXkRWQW160iIRqyml8SpYWeFdxCgL6RWFnz8PC3f9MwvfH8A0XOKbubTw5AnWhOpJe2CqbsFA/XgC8z4A=="},{"enonce":"Qu’est-ce que la détente ?","options":["Une période de dialogue et d’accords entre les 2 Grands","La fin de la guerre froide en 1991","Une alliance militaire","Le blocus de Berlin"],"c":"QE5vwwq6PZV0SceN0F1F46dfeGlsnVtieruG1w/ORQPI1H5ztHebyaJIu+8GWKS90duAM3wEEsDKt2QH3gxtRprv8SfCW/fHiwzuF3rW+iBVQdranQmk3TF6Q7ScakSMx49GNmKMXhX9j3bpnopK0KV+BhSl0DDUWIMsFjR9hkzTxQhwsYFZkW0RCMGXO27lZmvdlD5rNGUiw1moQq+lm/xjOJqVIqaSRQEce/GbudfGbqzQawauL2P87oHSgniKz8Cbnqjz3iUn3kP5KWwXzno+frEeCA=="}],"plusLoin":["guerre-froide-1","guerre-froide-2","berlin-1945-1990","cuba-detente-1959-1975","coree-1950-1953","vietnam-1945-1975","armements-espace-1945-1991","tensions-fin-urss-1979-1991"]},"b-europe":{"dates":"1950-2020","essentiel":[{"titre":"Faire l’Europe pour la paix","html":"\n<p>Après 2 guerres mondiales, des Européens veulent rendre la guerre impossible entre leurs pays. Le <strong>9 mai 1950</strong>, le ministre français Robert <strong>Schuman</strong>, inspiré par Jean <strong>Monnet</strong>, propose de mettre en commun le charbon et l’acier de la France et de l’Allemagne. En 1951 naît la <strong>CECA</strong>, avec 6 pays : la France, la RFA, l’Italie, la Belgique, les Pays-Bas et le Luxembourg.</p>\n<p>Le 25 mars <strong>1957</strong>, les 6 signent les <strong>traités de Rome</strong>, qui créent la Communauté économique européenne (<strong>CEE</strong>) : un marché commun où les marchandises circulent sans droits de douane. Une politique agricole commune, la PAC, est lancée en 1962. La construction européenne est aussi liée à la guerre froide : elle unit l’Europe de l’Ouest face au bloc soviétique.</p>"},{"titre":"Élargir et approfondir","html":"\n<p>L’Europe s’<strong>élargit</strong> : le Royaume-Uni, l’Irlande et le Danemark entrent en 1973, la Grèce en 1981, l’Espagne et le Portugal en 1986. Après la fin de la guerre froide, l’Union accueille les pays d’Europe de l’Est : 10 nouveaux membres en 2004, puis d’autres. Elle compte 28 pays en 2013, puis 27 après la sortie du Royaume-Uni, le <strong>Brexit</strong>, en 2020.</p>\n<p>Elle s’<strong>approfondit</strong> aussi. Depuis 1979, les citoyens élisent le Parlement européen. Le traité de <strong>Maastricht</strong>, en 1992, crée l’<strong>Union européenne</strong> et une citoyenneté européenne. L’espace <strong>Schengen</strong> supprime les contrôles aux frontières entre les pays membres. L’<strong>euro</strong>, monnaie unique, circule depuis le 1er janvier <strong>2002</strong>.</p>"},{"titre":"Une construction discutée","html":"\n<p>L’Union européenne fait débat. Certains veulent une Europe plus unie, presque fédérale ; d’autres veulent que les États gardent l’essentiel de leur souveraineté. En 2005, les Français rejettent par référendum un projet de constitution européenne. Les crises, financière à partir de 2008 ou migratoire, nourrissent l’<strong>euroscepticisme</strong>. En 2016, les Britanniques votent pour quitter l’Union.</p>\n<p>L’Union reste pourtant un espace de paix, de libre circulation et de prospérité, que de nombreux pays souhaitent rejoindre.</p>"}],"retenir":"Pour garantir la paix après 1945, 6 pays d’Europe de l’Ouest, dont la France et l’Allemagne, s’unissent : CECA en 1951, CEE avec les traités de Rome en 1957. La construction européenne s’élargit, jusqu’à 28 puis 27 pays, et s’approfondit : Union européenne avec le traité de Maastricht en 1992, espace Schengen, euro en 2002. Elle reste discutée entre partisans d’une Europe plus unie et défenseurs de la souveraineté des États.","astuces":["Élargir, c’est ajouter des pays ; approfondir, c’est mettre plus de choses en commun (monnaie, frontières, lois). Les correcteurs aiment voir les 2 mots.","3 dates suffisent pour la frise : 1957 (traités de Rome), 1992 (Maastricht), 2002 (euro).","Les 6 pays fondateurs : la France, la RFA, l’Italie et le Benelux (Belgique, Pays-Bas, Luxembourg)."],"reperes":[{"date":"9 mai 1950","ev":"déclaration Schuman"},{"date":"1957","ev":"traités de Rome : naissance de la CEE","cle":true},{"date":"1992","ev":"traité de Maastricht : naissance de l’Union européenne","cle":true},{"date":"2002","ev":"l’euro entre en circulation","cle":true},{"date":"2004","ev":"entrée de 10 nouveaux pays, surtout d’Europe de l’Est"},{"date":"2020","ev":"sortie du Royaume-Uni (Brexit)"}],"notions":[{"terme":"CECA","def":"Communauté européenne du charbon et de l’acier, créée en 1951 par 6 pays."},{"terme":"CEE","def":"Communauté économique européenne, créée par les traités de Rome en 1957."},{"terme":"Marché commun","def":"Espace où les marchandises circulent librement, sans droits de douane."},{"terme":"Union européenne","def":"Nom de la construction européenne depuis le traité de Maastricht (1992)."},{"terme":"Élargissement","def":"Entrée de nouveaux pays dans la construction européenne."},{"terme":"Approfondissement","def":"Renforcement de ce que les pays membres mettent en commun."},{"terme":"Euro","def":"Monnaie unique d’une partie des pays de l’Union, en circulation depuis 2002."},{"terme":"Espace Schengen","def":"Espace sans contrôle aux frontières intérieures entre les pays membres."},{"terme":"Citoyenneté européenne","def":"Droits des citoyens des pays membres : circuler, s’installer, voter aux élections européennes et locales."},{"terme":"PAC","def":"Politique agricole commune, lancée en 1962 pour moderniser et soutenir l’agriculture."},{"terme":"Souveraineté","def":"Pouvoir d’un État de décider seul de ses lois et de sa politique."},{"terme":"Euroscepticisme g> fait environ 800 000 morts en 3 mois.</p>"},{"titre":"Le terrorisme islamiste","html":"\n<p>Le <strong>11 septembre 2001</strong>, des terroristes du réseau <strong>al-Qaida</strong> détournent des avions et frappent les États-Unis, notamment les tours du World Trade Center à New York : près de 3 000 personnes sont tuées. Les États-Unis interviennent en Afghanistan en 2001, puis en Irak en 2003, cette fois sans l’accord de l’ONU.</p>\n<p>Le <strong>terrorisme</strong> islamiste frappe aussi l’Europe. En 2014, l’organisation <strong>État islamique</strong> s’empare d’une partie de l’Irak et de la Syrie ; elle organise des attentats, comme ceux de Paris le 13 novembre 2015, qui font 130 morts.</p>"},{"titre":"Un monde multipolaire","html":"\n<p>Le monde devient <strong>multipolaire</strong> : plusieurs puissances comptent. La <strong>Chine</strong> devient une grande puissance économique, l’Inde et le Brésil sont des puissances émergentes. La <strong>Russie</strong> veut retrouver sa puissance : elle annexe la Crimée en 2014 et envahit l’<strong>Ukraine</strong> le 24 février 2022, ramenant la guerre en Europe.</p>\n<p>De nouveaux enjeux concernent toute la planète, comme le <strong>réchauffement climatique</strong> : en 2015, l’accord de Paris engage presque tous les pays à réduire leurs émissions de gaz à effet de serre. Les conflits et la pauvreté jettent aussi sur les routes des millions de <strong>réfugiés</strong>. L’ONU, souvent paralysée par les désaccords entre les grandes puissances, peine à régler ces crises.</p>"}],"retenir":"Depuis la fin de la guerre froide en 1991, le monde n’est plus bipolaire. Les États-Unis sont d’abord la seule superpuissance, mais de nouveaux conflits éclatent, souvent à l’intérieur des États (ex-Yougoslavie, génocide des Tutsi au Rwanda en 1994), et le terrorisme islamiste frappe, notamment le 11 septembre 2001. Le monde devient multipolaire, avec l’affirmation de la Chine et le retour de la puissance russe.","astuces":["Bipolaire (2 pôles : États-Unis et URSS, jusqu’en 1991), puis multipolaire (plusieurs puissances) : ce passage est le fil du chapitre.","Pour un conflit, donnez toujours 3 éléments : où, quand, qui s’affronte.","Ne confondez pas la guerre du Golfe (1991, avec l’accord de l’ONU) et la guerre d’Irak (2003, sans son accord)."],"reperes":[{"date":"1991","ev":"guerre du Golfe"},{"date":"1994","ev":"génocide des Tutsi au Rwanda","cle":true},{"date":"1995","ev":"massacre de Srebrenica"},{"date":"11 septembre 2001","ev":"attentats terroristes aux États-Unis","cle":true},{"date":"2003","ev":"guerre d’Irak"},{"date":"2015","ev":"accord de Paris sur le climat"},{"date":"24 février 2022","ev":"invasion de l’Ukraine par la Russie"}],"notions":[{"terme":"Hyperpuissance","def":"Puissance sans rival, comme les États-Unis dans les années 1990."},{"terme":"Monde multipolaire","def":"Monde où plusieurs puissances comptent, et non plus 2."},{"terme":"Mondialisation","def":"Intensification des échanges de marchandises, de capitaux, de personnes et d’informations à l’échelle du monde."},{"terme":"Puissance émergente","def":"Pays en forte croissance qui pèse de plus en plus dans le monde, comme la Chine, l’Inde ou le Brésil."},{"terme":"Terrorisme","def":"Usage de la violence contre des civils pour semer la peur et imposer des idées."},{"terme":"Islamisme","def":"Idéologie politique qui veut imposer une lecture radicale de l’islam à la société."},{"terme":"Purification ethnique","def":"Expulsion ou massacre d’une population pour qu’un territoire ne compte plus qu’un seul peuple."},{"terme":"Génocide","def":"Extermination volontaire et organisée d’un peuple, en raison de ce qu’il est."},{"terme":"Casques bleus","def":"Soldats envoyés par l’ONU pour maintenir la paix."},{"terme":"Conflit asymétrique","def":"Conflit entre une armée régulière et un groupe armé qui ne combat pas de la même manière."},{"terme":"Réfugié","def":"Personne qui fuit son pays à cause de la guerre ou des persécutions."},{"terme":"Réchauffement climatique","def":"Hausse des températures moyennes due aux gaz à effet de serre rejetés par les activités humaines."}],"acteurs":[{"nom":"George W. Bush","role":"Président des États-Unis lors des attentats de 2001, il lance les guerres d’Afghanistan et d’Irak."},{"nom":"Oussama ben Laden","role":"Chef du réseau terroriste al-Qaida, responsable des attentats du 11 septembre 2001."},{"nom":"Vladimir Poutine","role":"Dirigeant de la Russie depuis 2000, il annexe la Crimée en 2014 et envahit l’Ukraine en 2022."},{"nom":"Nelson Mandela","role":"Militant contre l’apartheid, il devient en 1994 le premier président noir de l’Afrique du Sud."},{"nom":"Xi Jinping","role":"Dirigeant de la Chine depuis 2012, qui affirme la puissance chinoise dans le monde."}],"questions":[{"enonce":"Quelle puissance domine le monde au lendemain de la guerre froide ?","options":["Les États-Unis","La Russie","La Chine","L’Union européenne"],"c":"TYXnPBVbPXZidKHlnEKjfaeOKiR2nJhix4LWcBIm7aYwzMdFJfLDvyqne8zKMw3B5E7MuWUbg3UGbxQrpmTxP8JMn8wJQM0A62GYg4/uAwnprJH2OBtbL7biX+wVBT2x6Igk+AV6vl/1D3/kQV9CYL1EK4DAAH24ptJOo5yqNVMe2mR0D8zzkFDm+BrJiHueEm68nm/Pa+Cb3Lbt/pplIr1ujy4jvxhpsKZdGJZ2/gnxPYyJLQHMSIwg/v/rNOkmGGT+srSgrTx+7hWQH3RAJw=="},{"enonce":"Qu’est-ce que la guerre du Golfe de 1991 ?","options":["Une intervention d’une coalition menée par les États-Unis pour libérer le Koweït","Une intervention autorisée par l’ONU","L’invasion de l’Irak en 2003","Une guerre entre l’URSS et les États-Unis"],"c":"Yy6thnLRsmFMUd6yzKtfq7tRwCVPY19koVdv8/id/0Dqa66TTouFNvDLEo1lTzKfzWCYIXAhGPcmZhpSkTo55XeDljRUeiz8rUrgrfTblWsIvmiOeX/clAX+RQvpJ/jPn98Z/07lDWzT5b/Lsu7pwGS65PQ06EkbZXFrtTb6Wd2UU/0YtDGKH9U1VoPARP9ME18SY76NPBsVXaMg0kyajmLv7LINb//8/GgpOYei1/6fTHo7Jw=="},{"enonce":"Que se passe-t-il au Rwanda en 1994 ?","options":["Le génocide des Tutsi, qui fait environ 800 000 morts","Une guerre contre la France","L’indépendance du pays","Un attentat d’al-Qaida"],"c":"iN75ogbfTLyYLTLCJs3lDDzt9MgehZyG/SsZAft9Y04ZE9b les collaborateurs : c’est l’<strong>épuration</strong>. Pétain est condamné à mort en 1945, peine commuée en détention à vie ; Laval est exécuté.</p>\n<p>La démocratie s’élargit : par une ordonnance du 21 avril 1944, les <strong>femmes</strong> obtiennent enfin le <strong>droit de vote</strong> et d’éligibilité. Elles votent pour la première fois aux élections municipales du 29 avril 1945. Le suffrage devient vraiment universel.</p>"},{"titre":"Une démocratie sociale","html":"\n<p>Le gouvernement applique le programme du <strong>Conseil national de la Résistance</strong>, adopté en mars 1944, qui voulait une démocratie à la fois politique et sociale. Les ordonnances d’octobre 1945 créent la <strong>Sécurité sociale</strong> : elle protège les travailleurs et leurs familles contre la maladie, les accidents du travail et la vieillesse, et verse des allocations familiales. Le ministre communiste Ambroise <strong>Croizat</strong> la met en place.</p>\n<p>L’État prend aussi en main de grandes entreprises : ce sont les <strong>nationalisations</strong>, comme celle de Renault, des houillères (le charbon), des grandes banques, de l’électricité et du gaz. Des comités d’entreprise donnent une place aux salariés. L’État devient un <strong>État-providence</strong>, qui protège et guide la reconstruction.</p>"},{"titre":"La IVe République","html":"\n<p>En octobre 1945, les Français refusent par référendum de revenir à la IIIe République et élisent une assemblée chargée d’écrire une nouvelle constitution. En désaccord avec les partis, de Gaulle démissionne en janvier 1946. La <strong>Constitution de la IVe République</strong> est adoptée par référendum le 13 octobre 1946. Son préambule proclame des droits sociaux, comme le droit au travail, le droit de grève et l’égalité entre les femmes et les hommes.</p>\n<p>C’est un <strong>régime parlementaire</strong> : l’Assemblée nationale domine, les gouvernements tombent souvent. D’abord alliés, les 3 grands partis, communiste, socialiste et démocrate-chrétien, se divisent en 1947 avec la guerre froide : les ministres communistes quittent le gouvernement en mai 1947.</p>"}],"retenir":"De 1944 à 1947, la France rétablit la République et la refonde. Les femmes obtiennent le droit de vote en 1944. Inspirée par le programme du CNR, la démocratie devient sociale : Sécurité sociale en 1945, nationalisations, État-providence. La IVe République, adoptée en 1946, est un régime parlementaire dont le préambule garantit de nouveaux droits sociaux.","astuces":["Refonder la République = 3 idées : rétablir la démocratie, l’élargir aux femmes, la rendre sociale.","Ne confondez pas l’ordonnance qui donne le droit de vote aux femmes (21 avril 1944) et leur premier vote (29 avril 1945).","La Sécurité sociale est la mesure la plus attendue au brevet : dites ce qu’elle protège (maladie, vieillesse, accidents du travail, famille)."],"reperes":[{"date":"15 mars 1944","ev":"programme du Conseil national de la Résistance"},{"date":"21 avril 1944","ev":"droit de vote des femmes","cle":true},{"date":"29 avril 1945","ev":"premier vote des femmes, aux élections municipales"},{"date":"octobre 1945","ev":"création de la Sécurité sociale","cle":true},{"date":"13 octobre 1946","ev":"Constitution de la IVe République","cle":true},{"date":"mai 1947","ev":"départ des ministres communistes du gouvernement"}],"notions":[{"terme":"GPRF","def":"Gouvernement provisoire de la République française, dirigé par de Gaulle de 1944 à janvier 1946."},{"terme":"Épuration","def":"Punition des Français qui ont collaboré avec l’occupant."},{"terme":"Suffrage universel","def":"Droit de vote accordé à tous les citoyens adultes, hommes et femmes."},{"terme":"Sécurité sociale","def":"Système qui protège les travailleurs et leurs familles contre la maladie, les accidents, la vieillesse, et verse les allocations familiales."},{"terme":"Nationalisation","def":"Passage d’une entreprise privée sous le contrôle de l’État."},{"terme":"État-providence","def":"État qui intervient pour protéger les citoyens et réduire les inégalités."},{"terme":"Comité d’entreprise","def":"Instance qui associe les représentants des salariés à la vie de l’entreprise."},{"terme":"Constitution","def":"Texte qui fixe l’organisation des pouvoirs et les droits des citoyens."},{"terme":"Préambule","def":"Texte placé en tête de la Constitution de 1946, qui proclame des droits sociaux."},{"terme":"Référendum","def":"Vote par lequel les citoyens répondent directement par oui ou par non à une question."},{"terme":"Régime parlementaire","def":"Régime où le gouvernement dépend de la confiance de l’Assemblée élue."},{"terme":"IVe République","def":"Régime politique de la France de 1946 à 1958."}],"acteurs":[{"nom":"Charles de Gaulle","role":"Chef du GPRF de 1944 à janvier 1946, il rétablit la République."},{"nom":"Ambroise Croizat","role":"Ministre communiste du Travail, il met en place la Sécurité sociale."},{"nom":"Pierre Laroque","role":"Haut fonctionnaire, concepteur de l’organisation de la Sécurité sociale."},{"nom":"Jean Monnet","role":"Chargé à partir de 1946 du plan de modernisation et de reconstruction de l’économie."}],"questions":[{"enonce":"Quand les femmes obtiennent-elles le droit de vote en France ?","options":["En 1944","En 1789","En 1936","En 1958"],"c":"Ch1mCa8agFDtuj5lFBLX/yeuCVASZYhF6uTAHyTEEFHjPVpkjYfKzK6a2u+HoQzKpCQfYqL/yH4fyRd8xTwByE6otaivzpBSkfbGvFvbF3g3j7wFlSe3BAMAN0db5OJwxnGT1YnO/scawsutHN6AgsgJGaQZ0IT9b6IVfS+qpUqrcC1Fbe0aWWkPgzEw+RHvy7FkRqCVJdSvU83QVJejdA4JjYpJZ2IB4caiSbC6K5CNzkKFas9BJsK0JS6vdaJKYfvLhHHzRB2W3W39vg=="},{"enonce":"Qu’est-ce que l’épuration ?","options":["La punition des collaborateurs à la Libération","La création de la Sécurité sociale","Le départ des ministres communistes","Le droit de vote des femmes"],"c":"9yEcJovUq/yaRkP3fabjSu7aFro4N+h7ajsBKPQBhxcp8r0qRvLxFrX/9m+1s33SF2lsdWqHqzp60LirKJfaGrZOltB8vYN498+X5MfMgqChZI0N8Cj0q9skBTF1poqfqKChGIgQjZi5sd4qN/JmMcM3n+RaeLO4Aof25jaUTpAU1U1pd9STG3XvmEexZ9M6xyPV6W8gViLgg  la Constitution de 1946 ?","options":["Le droit au travail et le droit de grève","L’égalité entre les femmes et les hommes","Des droits sociaux nouveaux","Le rétablissement de la monarchie"],"c":"u4dDSFtjRHKIVQaP1eZmCTnioIMgLZ9mPUs02oqxHUSUfSMFytOa4h4Hk22pCMFn9ihDhbNs7n0Qll6DOYV3f2Ig3yPfWC1WKQI5Ox9tvUgyzE/qd31Ebo3T679fC7Z4mOw/pOfstBiiYlgA6l7ZXJFRVeJfyqvMbv3Z6/gRwYHQw/gEvFxHgSPDASmXemjJtAHa2F2c3HywXiSIgNzKEs+LEx9t1SDS2hLrygSisS7gMuGCaXR2Al7rZzx+YHaIuYF8mjp9ufI="},{"enonce":"Qu’est-ce qu’un régime parlementaire ?","options":["Un régime où le gouvernement dépend de la confiance de l’Assemblée","Un régime dirigé par un roi","Un régime sans élections","Un régime où le président a tous les pouvoirs"],"c":"xY9TMBQrsxjxAgYPOeOJa7eVQSJWXXPUNhKI+Uzk9bMaOvYgqXfAADIX/L2j1OmbLKcmtClyhLAG4l6AOQzOQp/AQ9pTtNhn7CSoiY7aosDdgNVTuyr9XagtJWUh20WbLwi1vN4JkWnZaYxX8HmoDXMsujqORe1+4Ek3x8dMsoBUQwr7BruUQOwyFCsjPIU4A1geJ5LMVh1YN+WTmK32qIU0KhKn4pruhJZLLUL9yRlCnmw+RTSAhXiblnN8lm5Y4riZfEBo4rXsKqCxbQ=="},{"enonce":"Pourquoi de Gaulle quitte-t-il le pouvoir en janvier 1946 ?","options":["Il est en désaccord avec les partis sur les institutions","Il a perdu une guerre","Il est condamné par la justice","Il part diriger l’ONU"],"c":"FEzy1/S2+d0bVN/KWMh5LgVfNQyTLyB6dVx5LxLrYf9KQaxMJrvr4gk97CcW7tBRiwbcQ9VPfpKmAO9K4freoY9SUm248Pqwr5qSuQqXp/7iw9SjTS5ecSEdJXZQN19K/xf+iz+IiIlxiMA0uqOw0SgkGGDNuW1tctGkIWiO/hk1c/kHdhIGPCQDBgYnGSP4ppP1HqVDpiyg/PrBeLM2yB2/PWb6hELKug=="},{"enonce":"Que se passe-t-il en mai 1947 ?","options":["Les ministres communistes quittent le gouvernement","La guerre froide divise les partis","Les femmes votent pour la première fois","La Ve République est créée"],"c":"BzOGEQzDjDphKD1wbRM/zave6cuQbTq8mPrkDmTXZ0DDCAcrUl7zOZz+CmE5PZX47EDrZKV/Ef55cb/sxTE9Z2JDCvqkROt5mhARV40cFK7TwVDSffF0t6OQ+eoZZNGuC3DGlzXy/SjlEDE8uMJvUhMLyddSHBpajaKPb1kG1AhpffGzCWH/ZflsJJi/Bf8E6ZZWenNHsLz5vvK/JnJyjiGxMNCzHwAYh17SvZhGYXGMyybHX7705H9h5ko="}],"plusLoin":["resistance-1940-1944","sgm-france-fin-reich"]},"b-ve-republique":{"dates":"1958-2002","essentiel":[{"titre":"La République gaullienne","html":"\n<p>En mai 1958, la guerre d’Algérie provoque une crise grave : à Alger, des militaires et des Européens se soulèvent. La IVe République fait appel au général <strong>de Gaulle</strong>. Il fait adopter par référendum, le 28 septembre 1958, une nouvelle <strong>Constitution</strong> : c’est la naissance de la <strong>Ve République</strong>. Elle renforce le pouvoir exécutif, en particulier celui du président de la République, qui nomme le Premier ministre, peut dissoudre l’Assemblée nationale et consulter les Français par <strong>référendum</strong>.</p>\n<p>De Gaulle met fin à la guerre d’Algérie en 1962. La même année, il fait adopter par référendum l’élection du président au <strong>suffrage universel direct</strong> : en 1965, il est réélu face à François Mitterrand. En <strong>mai 1968</strong>, une révolte des étudiants puis une grève générale ébranlent son pouvoir. Désavoué par un référendum, il démissionne en 1969.</p>"},{"titre":"Les successeurs du général","html":"\n<p>Georges <strong>Pompidou</strong> (1969-1974), puis Valéry <strong>Giscard d’Estaing</strong> (1974-1981) gouvernent avec la droite. Pompidou poursuit la modernisation industrielle du pays. Giscard d’Estaing modernise la société : majorité à 18 ans en 1974, loi Veil sur l’interruption volontaire de grossesse en 1975. Mais la crise économique, avec les chocs pétroliers, fait monter le chômage, et l’opposition de gauche progresse.</p>"},{"titre":"Alternance et cohabitation","html":"\n<p>Le 10 mai <strong>1981</strong>, le socialiste François <strong>Mitterrand</strong> est élu président : c’est la première <strong>alternance</strong> de la Ve République, la gauche arrive au pouvoir. Elle abolit la peine de mort en 1981, augmente les droits des salariés et engage la décentralisation.</p>\n<p>En <strong>1986</strong>, la droite gagne les élections législatives : Mitterrand doit nommer un Premier ministre de droite, Jacques Chirac. C’est la première <strong>cohabitation</strong> : le président et le gouvernement sont de camps opposés. Il y en aura 2 autres, en 1993 et en 1997. Les institutions s’adaptent : depuis 2002, le mandat du président dure 5 ans, le <strong>quinquennat</strong>, adopté par référendum en 2000. La Ve République a montré sa solidité.</p>"}],"retenir":"Fondée en 1958 par le général de Gaulle, la Ve République renforce le pouvoir du président de la République, élu au suffrage universel direct depuis 1962. Après de Gaulle, ses institutions résistent aux changements : alternance en 1981 avec l’élection de François Mitterrand, cohabitations à partir de 1986, quinquennat depuis 2002.","astuces":["Alternance : le pouvoir passe d’un camp politique à l’autre (1981). Cohabitation : un président et un gouvernement de camps opposés (1986).","Les 2 dates clés de de Gaulle : 1958 (nouvelle Constitution), 1962 (président élu au suffrage universel direct).","Pour montrer la force du président, citez ses pouvoirs : nommer le Premier ministre, dissoudre l’Assemblée, recourir au référendum."],"reperes":[{"date":"1958","ev":"naissance de la Ve République","cle":true},{"date":"1962","ev":"élection du président au suffrage universel direct","cle":true},{"date":"mai 1968","ev":"révolte étudiante et grève générale"},{"date":"10 mai 1981","ev":"élection de François Mitterrand : première alternance","cle":true},{"date":"1986","ev":"première cohabitation","cle":true},{"date":"2000","ev":"adoption du quinquennat par référendum"}],"notions":[{"terme":"Ve République","def":"Régime politique de la France depuis la Constitution de 1958."},{"terme":"Constitution","def":"Texte qui fixe l’organisation des pouvoirs et les droits des citoyens."},{"terme":"Suffrage universel direct","def":"Élection où tous les citoyens votent eux-mêmes pour choisir un dirigeant."},{"terme":"Référendum","def":"Vote par lequel les citoyens répondent directement par oui ou par non à une question."},{"terme":"Pouvoir exécutif","def":"Pouvoir d’appliquer les lois et de gouverner : président et gouvernement."},{"terme":"Dissolution","def":"Pouvoir du président de mettre fin au mandat des députés et de provoquer de nouvelles élections."},{"terme":"Premier ministre","def":"Chef du gouvernement, nommé par le président de la République."},{"terme":"Alternance","def":"Passage du pouvoir d’un camp politique à un autre par les élections."},{"terme":"Cohabitation","def":"Situation où le président et le gouvernement appartiennent à des camps opposés."},{"terme":"Majorité","def":"Ensemble des députés qui soutiennent le gouvernement."},{"terme":"Quinquennat","def":"Mandat présidentiel de 5 ans, en vigueur depuis 2002."},{"terme":"Décentralisation","def":"Transfert de pouvoirs de l’État vers les régions, les départements et les communes (lois de 1982)."}],"acteurs":[{"nom":"Charles de Gaulle","role":"Fondateur de la Ve République, président de 1959 à 1969."},{"nom":"Georges Pompidou","role":"Président de la République de 1969 à sa mort en 1974."},{"nom":"Valéry Giscard d’Estaing","role":"Président de 1974 à 1981, il abaisse la majorité à 18 ans."},{"nom":"François Mitterrand","role":"Président socialiste de 1981 à 1995, élu lors de la première alternance."},{"nom":"Jacques Chirac","role":"Premier ministre de la première cohabitation en 1986, président de 1995 à 2007."}],"questions":[{"enonce":"Dans quel contexte naît la Ve République ?","options":["La crise provoquée par la guerre d’Algérie en 1958","La victoire du Front populaire","La fin de la Deuxième Guerre mondiale","La chute du mur de Berlin"],"c":"I8tgdfZ5VtKYxhcgTsyFEnDFNcION3xLKFhcJ4IQc9OJtKxQqZLabcbSX/Nn+f/6zet94OykvpTBmyxZC0H/JmhJbs1uB24csz8/9YUJclJensL+GMpJVIBvkdsoMMapHpMf3KvHHiRwWRZmTAgJNfloq9K4j8YZt93d+BS90jROsJwPkyYGhTH1eGGDqY0oPzJ/JIOpMZ7OsnfrX8NxRr6CHHcrrCoEutLfq4UygbjkexybwRRWDlSVZHg4H5CE"},{"enonce":"Quels pouvoirs la Constitution de 1958 donne-t-elle au président ?","options":["Nommer le Premier ministre","Dissoudre  Premier ministre","2 présidents en même temps"],"c":"gmPkug7oMWoohhKhaY6VQovk3PUX24E0RH0xy34uOV87M3b16qhUCT+mKZTJnd1WRYQ7DH+rY0mibFCsW06Wpf1Tf5IflMpgWyU2OSdL2xDau3dvGypQOuZ26KIgJRTGISuNg+ORaxCmWpsKWVGqnz5bfg1jmvHimsZU4Ce3fJ3wW4GTPt8Ogk8MNuYiHr228v8k0/d7xvpXkUBDMFz1OyUzok2aDRVpUWjYnW8="},{"enonce":"Quelles réformes la gauche fait-elle adopter en 1981 et 1982 ?","options":["L’abolition de la peine de mort","La décentralisation","De nouveaux droits pour les salariés","Le droit de vote des femmes"],"c":"gXJbRtHEPafJAhE2+IH2MrMVr4ptoPin4umZDVOi9iwM/mwkOC63W0UWP0RvbEDGySfDs8ZI0sJSGmEcE1u2MmxtbHBr1yzj3Mi+Yzd9BO8ffW8dGZ0w2TAzw10NQwl3tVECfy/pxdxsIOrQ2K+3F/CVBV6PIzTbnEwvy0SsMRUaSAa9Y8skeszGkMlCpMigcuoSjzNjUxRRrmS947ghZTvn17uGhjM="},{"enonce":"Qui succède directement à de Gaulle en 1969 ?","options":["Georges Pompidou","François Mitterrand","Valéry Giscard d’Estaing","Jacques Chirac"],"c":"XrRPgdKstiO1XGlzCzhfRyd5R6sm4XxnybKuqBtU7q1nyv9YXOjBMqLC6NU7s8o49Z2xbDxD9Tzoypd0ZP3QxFBSr+3b11JgL2wDf/+UL3AYtEHIpyqKePg1w+wvY3n4UmYPKIMw1lKG7LN7eC5rPuvDpkmYpJjwfN21OaSk92gkDTv56GFao0VUUwlxrMQUTgsQq5bgFICgkwoNTh8="},{"enonce":"Qu’est-ce que le quinquennat ?","options":["Un mandat présidentiel de 5 ans","Un mandat de 7 ans","Une période de 5 gouvernements","Une réforme de la Sécurité sociale"],"c":"lprzDUCGJxqLD72baKVk3NSS2hJzkiBDn6QW0mxhsmFCM1/5HfJd3eWzgSY3NXpd+3hIcfnkCIleYCjzp+N5/yiLAgheKL/rKZUV+1oEAHNtCtfG38jeQEVb7MK0Asosg1SvVnAgL71yW44YEkGorYxMMWybsv8i7a9D0rZys8bUe68gOguP79Dcz8MShpan0e/15fQuHKL028cCqoFBaGHohn7oaxk3dxiZRt7wFHTt"},{"enonce":"Pourquoi dit-on que la Ve République a montré sa solidité ?","options":["Elle a supporté l’alternance de 1981","Elle a résisté aux cohabitations","Elle a survécu au départ de son fondateur","Elle n’a jamais été modifiée"],"c":"ZAhS1IYRnipekk1yuh13sf5EneKeochbqOS6pHWYN2/ZQtGQJib9WaaxVcC5+s80iK1pmr1ETHep4HTWsT2+pLXMXeA9ta/WDjOECqnOxCKGZTzydtpRbEkoFkeX8i+i3Z5CsWPcI+0ag4pjZzjS8CC0orH2KPYlselv5Gin0ZijSPhDMbZA7h3OWMRQPnSldy7zPdBDxE+/K/6ycTSJnCVSFiSCHwiRS82NT9C9jta0lWcZu/o0nJ2k0ifLS8hvUAm6EbQQ"}],"plusLoin":["guerre-algerie-1954-1962"]},"b-societe":{"dates":"1950-1980","essentiel":[{"titre":"Une société transformée","html":"\n<p>De 1945 au milieu des années 1970, la France connaît une forte croissance économique : ce sont les « <strong>Trente Glorieuses</strong> ». Le niveau de vie augmente, le chômage est faible. Le <strong>baby-boom</strong> rajeunit la population. Les campagnes se vident au profit des villes : c’est l’<strong>exode rural</strong>, et de grands ensembles sont construits pour loger les nouveaux citadins.</p>\n<p>La France entre dans la <strong>société de consommation</strong> : réfrigérateur, machine à laver, voiture et télévision se répandent dans les foyers. L’économie fait appel à des travailleurs <strong>immigrés</strong>, venus d’Italie, d’Espagne, du Portugal, du Maghreb. Une culture jeune s’affirme, avec ses musiques et ses modes ; en <strong>mai 1968</strong>, une révolte des étudiants conteste l’autorité et la société traditionnelle.</p>"},{"titre":"La place des femmes change","html":"\n<p>Les femmes sont de plus en plus nombreuses à faire des études et à travailler. Pourtant, en 1950, le mari peut encore s’opposer à ce que sa femme exerce un métier. Une loi de 1965 permet aux femmes mariées de travailler et d’ouvrir un compte en banque sans son accord.</p>\n<p>Les <strong>mouvements féministes</strong>, comme le Mouvement de libération des femmes (MLF), créé en 1970, réclament l’égalité et le droit de disposer de leur corps. La loi Neuwirth autorise la <strong>contraception</strong> en 1967. En <strong>1975</strong>, la <strong>loi Veil</strong>, défendue par la ministre Simone Veil, autorise l’interruption volontaire de grossesse (IVG). La même année, le divorce par consentement mutuel est créé.</p>"},{"titre":"Des réponses politiques à une société nouvelle","html":"\n<p>Les gouvernements adaptent les lois à ces changements. En 1974, la majorité est abaissée de 21 à 18 ans : les jeunes votent plus tôt. Un secrétariat d’État à la Condition féminine est créé la même année. En 1976, le regroupement familial permet aux travailleurs immigrés de faire venir leur famille. En 1983, une loi impose l’égalité professionnelle entre les femmes et les hommes.</p>\n<p>Mais à partir de 1973, les <strong>chocs pétroliers</strong> mettent fin aux Trente Glorieuses : l’économie ralentit et le <strong>chômage de masse</strong> s’installe.</p>"}],"retenir":"Des années 1950 aux années 1980, la société française se transforme : croissance des Trente Glorieuses, baby-boom, exode rural, société de consommation, immigration de travail. La place des femmes progresse : droit de travailler sans l’accord du mari (1965), contraception (1967), IVG avec la loi Veil (1975). Les pouvoirs publics adaptent les lois, mais la crise des années 1970 apporte le chômage de masse.","astuces":["Pour l’émancipation des femmes, une suite simple : 1965 (travailler et avoir un compte en banque sans l’accord du mari), 1967 (contraception), 1975 (loi Veil).","Trente Glorieuses : environ 30 années de forte croissance, de 1945 aux chocs pétroliers de 1973.","Le sujet demande des « réponses politiques » : citez toujours une loi précise et son année."],"reperes":[{"date":"1965","ev":"les femmes mariées peuvent travailler sans l’accord de leur mari"},{"date":"1967","ev":"loi Neuwirth sur la contraception"},{"date":"mai 1968","ev":"révolte étudiante et grève générale","cle":true},{"date":"1973","ev":"premier choc pétrolier, fin des Trente Glorieuses"},{"date":"1974","ev":"majorité à 18 ans"},{"date":"1975","ev":"loi Veil sur l’IVG","cle":true}],"notions":[{"terme":"Trente Glorieuses","def":"Période de forte croissance économique en France, de 1945 au milieu des années 1970."},{"terme":"Baby-boom","def":"Forte hausse des naissances après la Deuxième Guerre mondiale."},{"terme":"Exode rural","def":"Départ des habitants des campagnes vers les villes."},{"terme":"Société de consommation","def":"Société où l’achat de biens toujours plus nombreux devient central."},{"terme":"Immigration","def":"Arrivée de personnes venues d’un autre pays pour s’y installer."},{"terme":"Regroupement familial","def":"Droit pour un immigré installé en France de faire venir sa famille (1976)."},{"terme":"Émancipation","def":"Fait de se libérer d’une domination ou d’une tutelle."},{"terme":"Féminisme","def":"Mouvement qui lutte pour l’égalité entre les femmes et les hommes."},{"terme":"Contraception","def":"Moyens d’éviter une grossesse, autorisés en France en 1967."},{"terme":"IVG","def":"Interruption volontaire de grossesse, légalisée par la loi Veil en 1975."},{"terme":"Choc pétrolier","def":"Hausse brutale du prix du pétrole, en 1973 et en 1979."},{"terme":"Chômage de masse","def":"Chômage touchant durablement une part importante de la population active."}],"acteurs":[{"nom":"Simone Veil","role":"Ministre de la Santé, elle fait voter en 1975 la loi qui légalise l’IVG."},{"nom":"Lucien Neuwirth","role":"Député qui fait adopter en 1967 la loi autorisant la contraception."},{"nom":"Gisèle Halimi","role":"Avocate féministe, elle défend en 1972 au procès de Bobigny une jeune fille poursuivie pour avortement."},{"nom":"Simone de Beauvoir","role":"Écrivaine, autrice du Deuxième Sexe (1949), figure du féminisme."},{"nom":"Françoise Giroud","role":"Journaliste, première secrétaire d’État à la Condition féminine en 1974."}],"questions":[{"enonce":"Qu’appelle-t-on les Trente Glorieuses ?","options":["Une période de forte croissance économique de 1945 au milieu des années 1970","30 années de guerre","Une loi sur l’égalité","Le règne de 30 présidents"],"c":"ZOI8LNnzHXcOS6zlN+/dZ44ktnlyPxlB0Nq42QuwXlR/0wRkzQqKO5ODRbeprazDL2GlZSm7uUUv+bCTP3JD6aFau0yF+jSPImGCp6xK1Pj0x9fcUgA2tH13SdRATmEovcncnV7gG+hSiJkGP1jsZcmtb1nlpe/SExF4fapa46pC3A4DEpOaAcY3KvW8UWKj4/TG+pZ4kbXuKNalGKEqHmGS40dPUX0="},{"enonce":"Quelles transformations connaît la société française pendant les Trente Glorieuses ?","options":["Le baby-boom","L’ex WsFYJWEG4JbgtSKiKNoGP6oqwqJxFwtYAePwm9NyhVawRy4yX6N/kxzOSe8chz67rY5VAHSUHyckUlShF/pkizzVl06FkbW8pkybHcW8kj3xinHjcPKMLFE="}],"plusLoin":[]},"g-aires-urbaines":{"essentiel":[{"titre":"Une France très urbaine","html":"\n<p>La France est un pays urbain : plus de 9 habitants sur 10 vivent dans l’aire d’attraction d’une ville. Une <strong>aire urbaine</strong> comprend une <strong>ville-centre</strong>, sa <strong>banlieue</strong> et une <strong>couronne périurbaine</strong>, faite de communes plus rurales dont une grande partie des habitants travaille dans la ville. Depuis 2020, l’Insee parle d’« aires d’attraction des villes ».</p>\n<p>Cette géographie est le fruit de l’<strong>urbanisation</strong> : au XXe siècle, l’exode rural a vidé les campagnes au profit des villes. Aujourd’hui, les villes continuent de s’étendre, et leur influence s’exerce bien au-delà de leurs limites.</p>"},{"titre":"Des métropoles dans la mondialisation","html":"\n<p>Les grandes villes concentrent les emplois, les sièges d’entreprises, les universités, les hôpitaux, les aéroports internationaux : c’est la <strong>métropolisation</strong>. <strong>Paris</strong> domine : son aire d’attraction compte environ 13 millions d’habitants. C’est une <strong>ville mondiale</strong>, qui accueille des sièges de grandes entreprises, des institutions internationales et des millions de touristes.</p>\n<p>Derrière Paris, des <strong>métropoles régionales</strong> comme Lyon, Marseille, Toulouse, Lille, Bordeaux ou Nantes attirent habitants et entreprises. Les métropoles de l’Ouest et du Sud ont une croissance rapide. Elles sont reliées entre elles et à l’Europe par les lignes à grande vitesse et les aéroports.</p>"},{"titre":"Étalement urbain et mobilités","html":"\n<p>Beaucoup de familles s’installent dans des maisons individuelles en périphérie, où le terrain est moins cher : c’est la <strong>périurbanisation</strong>. Les villes s’étalent, consomment des terres agricoles et naturelles : c’est l’<strong>étalement urbain</strong>, qui conduit à l’artificialisation des sols. Chaque jour, des millions de personnes font l’aller-retour entre leur domicile et leur travail : ce sont les <strong>mobilités pendulaires</strong>, souvent en voiture, avec des embouteillages et de la pollution.</p>\n<p>Les villes cherchent à devenir plus durables : tramways, pistes cyclables, écoquartiers, rénovation des grands ensembles de banlieue. Dans certains quartiers anciens des centres, l’arrivée d’habitants plus aisés fait monter les prix : c’est la gentrification.</p>"}],"retenir":"La France est un pays urbain : plus de 9 habitants sur 10 vivent dans l’aire d’attraction d’une ville. Les métropoles, Paris, ville mondiale, et les grandes métropoles régionales, concentrent les populations, les emplois et les fonctions de commandement. Les villes s’étalent par la périurbanisation, ce qui multiplie les mobilités pendulaires et pose des défis de développement durable.","astuces":["Pour décrire une aire urbaine, partez du centre vers l’extérieur : ville-centre, banlieue, couronne périurbaine.","Métropolisation = concentration des hommes, des richesses et des pouvoirs dans les grandes villes ; citez toujours Paris et au moins 2 métropoles régionales.","Sur un croquis, Paris se représente par le plus gros figuré : c’est la seule ville mondiale du pays."],"reperes":[{"date":"Paris","ev":"ville mondiale, aire d’attraction d’environ 13 millions d’habitants","cle":true},{"date":"Lyon","ev":"2e aire urbaine de France","cle":true},{"date":"Marseille","ev":"grande métropole méditerranéenne et premier port français"},{"date":"Lille","ev":"métropole frontalière, tournée vers la Belgique"},{"date":"Bordeaux","ev":"métropole de l’Ouest en forte croissance, à 2 heures de Paris en TGV"},{"date":"Nantes","ev":"métropole dynamique de l’Ouest"}],"notions":[{"terme":"Aire urbaine","def":"Ensemble formé par une ville-centre, sa banlieue et sa couronne périurbaine (aire d’attraction d’une ville)."},{"terme":"Ville-centre","def":"Commune principale d’une aire urbaine, la plus peuplée."},{"terme":"Banlieue","def":"Communes urbanisées qui entourent la ville-centre."},{"terme":"Couronne périurbaine","def":"Communes plus rurales autour de la ville, dont une grande partie des actifs travaille dans l’aire urbaine."},{"terme":"Urbanisation","def":"Augmentation de la part de la population qui vit en ville."},{"terme":"Métropole","def":"Grande ville qui concentre population, emplois et fonctions de commandement, et rayonne sur un vaste territoire."},{"terme":"Métropolisation","def":"Concentration des hommes, des activités et des pouvoirs dans les métropoles."},{"terme":"Ville mondiale","def":"Ville dont l’influence s’étend au monde entier, comme Paris."},{"terme":"Périurbanisation","def":"Installation des citadins dans les communes rurales autour des villes."},{"terme":"Étalement urbain","def":"Extension des villes sur les espaces agricoles et naturels qui les entourent."},{"terme":"Mobilité pendulaire","def":"Trajet quotidien aller-retour entre le domicile et le lieu de travail."},{"terme":"Gentrification","def":"Arrivée d’habitants plus aisés dans un quartier populaire, qui en transforme la population et fait monter les prix."}],"acteurs":[{"nom":"Les communes et les métropoles","role":"Elles décident de l’urbanisme (plans locaux d’urbanisme) et organisent les transports urbains."},{"nom":"L’État","role":"Il finance de grands équipements et la rénovation des quartiers en difficulté."},{"nom":"Les habitants","role":"Ils choisissent où vivre et comment se déplacer, et participent aux débats sur les projets."},{"nom":"Les entreprises et les promoteurs","role":"Ils construisent logements, bureaux et zones commerciales."}],"questions":[{"enonce":"Quelle part de la population française vit dans l’aire d’attraction d’une ville ?","options":["Plus de 9 habitants sur 10","La moitié","Un tiers","Un habitant sur 10"],"c":"1rdgOFppTrWBLpGJkV0Vs8a1iffjZ8fvX+SZFp4JCe6A6H58UyXCzBQifvpIeEPU1jk9Tkm ire</strong>. Les vignobles de Bordeaux, de Champagne ou de Bourgogne exportent dans le monde entier.</p>\n<p>Cette <strong>agriculture productiviste</strong>, soutenue par la politique agricole commune européenne, pose des problèmes : pollution des eaux, comme les algues vertes en Bretagne, endettement des agriculteurs. L’agriculture biologique et les circuits courts progressent, tout comme les produits sous label de qualité, qui valorisent un terroir.</p>"},{"titre":"Le poids des services et du tourisme","html":"\n<p>Plus des 3 quarts des emplois relèvent aujourd’hui du <strong>secteur tertiaire</strong> : commerce, transports, santé, éducation, banque, administration. Les services les plus qualifiés se concentrent dans les métropoles, dans des <strong>quartiers d’affaires</strong> comme La Défense, près de Paris.</p>\n<p>La France est la première destination <strong>touristique</strong> du monde. Paris, les littoraux, les montagnes et les sites du patrimoine attirent des millions de visiteurs. Tous ces espaces productifs sont insérés dans la <strong>mondialisation</strong> : ils exportent, attirent des investissements étrangers, mais subissent aussi la concurrence et les délocalisations. Les espaces productifs les mieux placés sont ceux qui sont proches des métropoles, des grands ports et des axes de transport.</p>"}],"retenir":"Les espaces productifs français se transforment avec la mondialisation. Les vieilles régions industrielles se reconvertissent, tandis que l’industrie se concentre dans les zones industrialo-portuaires et les technopôles. La France est la première puissance agricole de l’Union européenne, grâce à une agriculture productiviste. Les services, majoritaires, et le tourisme, dont la France est la première destination mondiale, se concentrent surtout dans les métropoles et les espaces attractifs.","astuces":["Pour un espace productif, répondez toujours à 3 questions : que produit-on, où, et comment cet espace est-il relié au monde ?","Technopôle = entreprises + universités + recherche au même endroit ; zone industrialo-portuaire = usines au bord d’un grand port.","Un exemple précis vaut mieux qu’une généralité : Toulouse et Airbus, la Beauce et les céréales, la Bretagne et l’élevage."],"reperes":[{"date":"Toulouse","ev":"capitale de l’aéronautique, autour d’Airbus","cle":true},{"date":"La Défense","ev":"grand quartier d’affaires près de Paris","cle":true},{"date":"Beauce","ev":"grande plaine céréalière du Bassin parisien"},{"date":"Bretagne","ev":"région d’élevage intensif et d’agroalimentaire"},{"date":"Dunkerque","ev":"zone industrialo-portuaire sur la mer du Nord"},{"date":"Sophia Antipolis","ev":"technopôle près de Nice"}],"notions":[{"terme":"Espace productif","def":"Espace aménagé pour produire des richesses : agricoles, industrielles ou de services."},{"terme":"Désindustrialisation","def":"Recul de l’industrie dans l’économie et l’emploi d’une région."},{"terme":"Reconversion","def":"Changement d’activité d’une région ou d’un site après la fermeture des anciennes industries."},{"terme":"Technopôle","def":"Espace qui regroupe entreprises de haute technologie, universités et centres de recherche."},{"terme":"Zone industrialo-portuaire","def":"Zone industrielle installée dans un grand port, tournée vers les échanges mondiaux."},{"terme":"Agriculture productiviste","def":"Agriculture qui cherche les rendements les plus élevés grâce aux machines, aux engrais et à la spécialisation."},{"terme":"Agroalimentaire","def":"Industrie qui transforme les produits agricoles en produits alimentaires."},{"terme":"Secteur tertiaire","def":"Ensemble des activités de services : commerce, transports, santé, éducation, banque."},{"terme":"Quartier d’affaires","def":"Quartier qui concentre des sièges d’entreprises et des bureaux."},{"terme":"Mondialisation","def":"Mise en relation des territoires du monde par les échanges de marchandises, de capitaux, de personnes et d’informations."},{"terme":"Délocalisation","def":"Transfert d’une activité vers un pays où la production coûte moins cher."},{"terme":"Circuit court","def":"Vente directe ou avec un seul intermédiaire entre le producteur et le consommateur."}],"acteurs":[{"nom":"Les entreprises","role":"Elles produisent, investissent, choisissent où s’installer, comme Airbus à Toulouse."},{"nom":"L’État","role":"Il aide la reconversion des régions industrielles et soutient la recherche."},{"nom":"Les régions","role":"Elles soutiennent le développement économique et la formation sur leur territoire."},{"nom":"L’Union européenne","role":"Elle soutient les agriculteurs par la politique agricole commune."},{"nom":"Les agriculteurs","role":"Ils exploitent les terres et adaptent leurs pratiques, du productivisme au bio."}],"questions":[{"enonce":"Qu’est-ce que la désindustrialisation ?","options":["Le recul de l’industrie et de ses emplois dans une région","La création de nouvelles usines","Le développement de l’agriculture","La hausse du tourisme"],"c":"UXkfX5a2411DW6oKreNdGGmzZuY+BYHpjJYiABiRx/9tH+Tv5qErA0kqMkmYKCZctmUsGxx7DawZpJhxkvgZhT8BDGJZW9kx9TU2t85TC4d+p1LuMS8RJHo/ve3y6VKzHM2IZgkuU8E7hzxVWq9SZ8twrE6+DzCm0DEDJJBz3xMXb9IO0z8Ruc+wCFy/HjUd1TnOzfrx78UapXRj9DkmmVnV2V016Ttn/kmlM5ZCeZvsMBepH6lKHA=="},{"enonce":"Qu’est-ce qu’un technopôle ?","options":["Un espace qui réunit entreprises de haute technologie, universités et laboratoires","Une grande ferme mécanisée","Une station de ski","Un ancien bassin minier"],"c":"dXh5m1dO3cmeSO4nQs18f8Tzcr+6/++tmOI0OiWMSNNpRfZziu0GSYHk5bbooeJvU7Uk1pgRLCNwFgqfyoUUsSqg5OyccBiT6EIKtv4LfnpmX3Px4jpJ53LIEpconKygdL2penmP7OD3Zcdd/pkWzogTTYA7/34SflT8EWDEpQGlbiOpzkULAVsmJy55odfzJWU+i/bzgNagToQ/nly1f2YxzY12xRysreMKtXwsDsVR2b+q3YcLgnjJjt/u8GPOlNKIETXZgDai9S76GuUAn900+tqvyyS6WrnqGXt+z9IJZ8Z/9xqtXR9T1A=="},{"enonce":"Où l’industrie se concentre-t-elle aujourd’hui ?","options":["Dans les zones industrialo-portuaires","Dans les technopôles","Autour des métropoles","Uniquement dans les anciens bassins miniers"],"c":"pqacrM
