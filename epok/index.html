        aria-checked="${ETAT.reglages.relecture ? "true" : "false"}"
        aria-label="Afficher les repères dans les séances"></button>
    </div>
  </div>`);

  if(!tous.length){
    parts.push(`<p class="vide">Aucun point en attente.</p>`);
    vue.innerHTML = parts.join("");
    return;
  }

  let coursCourant = null, rangSeance = 0, derniereSeance = null;
  tous.forEach(x => {
    if(x.coursId !== coursCourant){
      coursCourant = x.coursId;
      const dedans = tous.filter(y => y.coursId === x.coursId);
      parts.push(filet(x.titre));
      parts.push(`<p class="minuscule" style="margin:-6px 0 10px">${
        dedans.filter(y => y.fait).length} relu(s) sur ${dedans.length}</p>`);
    }
    if(derniereSeance !== x.coursId + "#" + x.numero){
      derniereSeance = x.coursId + "#" + x.numero;
      parts.push(`<p class="capitales" style="margin:12px 0 6px">Séance ${x.numero}
        &#8212; ${tx(x.titreSeance)}</p>`);
    }
    rangSeance = x.rang + 1;
    parts.push(`<label class="coche verif-ligne${x.fait ? " fait" : ""}">
      <input type="checkbox" data-verif="${esc(cleVerif(x.coursId, x.numero, x.rang))}"
        ${x.fait ? "checked" : ""}>
      <span><span class="num-verif">${rangSeance}</span>${esc(x.texte)}
        <br><button class="bouton petit discret" style="margin-top:6px"
          data-action="lire" data-cours="${esc(x.coursId)}" data-seance="${x.numero}"
        >Ouvrir la séance ${x.numero}</button></span>
    </label>`);
  });
  vue.innerHTML = parts.join("");
}

/* --- Catalogue ------------------------------------------------------
   Les commandes (recherche, classement, filtres) sont rendues une fois ;
   seule la liste des resultats est redessinee a chaque frappe. Sans
   cette separation, le champ de recherche perdrait le curseur a chaque
   lettre tapee. */
function rendreCatalogue(vue){
  const parts = [];
  /* Le denombrement se loge dans le filet de section au lieu de prendre
     une ligne a lui. */
  parts.push(`<div class="filet"><span>Catalogue &#8226; ${COURS.length} cours</span></div>`);

  parts.push(`<div class="recherche">
    <svg class="loupe" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L20.5 20.5"/></svg>
    <input type="search" id="champ-recherche" value="${esc(RECHERCHE)}"
      placeholder="Un titre, une date, un thème…"
      autocomplete="off" autocorrect="off" spellcheck="false"
      aria-label="Chercher un cours">
    <button type="button" class="effacer" data-action="vider-recherche"
      aria-label="Effacer la recherche"
      style="display:${RECHERCHE ? "block" : "none"}">&#10005;</button>
  </div>`);

  /* Trois entrees pour le meme catalogue. La chronologie range le regime
     nazi, le stalinisme et le franquisme dans un seul << 1914-1945 >> ;
     le theme les rapproche et separe au contraire les deux guerres
     mondiales de leurs voisines ; la frise, elle, ne respecte que les
     dates. Les pastilles de theme qui suivaient ont disparu : elles
     doublaient le sommaire par sections, et leurs noms longs y etaient
     coupes. Chercher un theme par son nom filtre de la meme facon. */
  parts.push(`<div class="seg">` +
    [["theme","thème"],["periode","période"],["frise","frise"]].map(x =>
    `<button type="button" data-action="classement" data-classement="${x[0]}"
      aria-pressed="${CLASSEMENT === x[0] ? "true" : "false"}">${x[1]}</button>`
    ).join("") + `</div>`);

  parts.push(`<div class="barre-cat">
    <select class="choix" data-action="avancement" aria-label="N’afficher que certains cours">` +
    [["tous","Tous les cours"],["encours","Commencés"],
     ["neufs","Jamais ouverts"],["termines","Terminés"],
     ["maitrises","Maîtrisés"]].map(x =>
    `<option value="${x[0]}"${AVANCEMENT === x[0] ? " selected" : ""}>${x[1]}</option>`
    ).join("") + `</select>
    <span id="zone-pli"></span>
  </div>`);

  parts.push(`<div id="resultats"></div>`);

  /* Pour les jours sans : un cours tire au sort parmi ceux affiches. Sa
     carte porte a la fois le bouton et le choix qui le regle. */
  parts.push(filet("Pas d’idée ?"));   /* filet() echappe : l'espace fine est ecrite telle quelle */
  parts.push(`<div class="carte hasard">
    <p class="secondaire">Le sort choisit un cours pour vous, parmi ceux affichés ci-dessus&#8239;:</p>
    <div class="seg seg-petit" role="group" aria-label="Tirer parmi">
      <button type="button" data-action="hasard-portee" data-neuf="1"
        aria-pressed="${HASARD_NEUF ? "true" : "false"}">jamais commencés</button>
      <button type="button" data-action="hasard-portee" data-neuf="0"
        aria-pressed="${HASARD_NEUF ? "false" : "true"}">tous</button>
    </div>
    <div id="avis-hasard"></div>
    <button class="bouton-plein" data-action="hasard">Tirer un cours au hasard</button>
  </div>`);

  vue.innerHTML = parts.join("");
  rendreResultats();
}

/* Carte de l'epreuve finale, en bas de la fiche d'un cours. Trois etats :
   fermee (six seances pas encore lues), ouverte, ou deja reussie. */
function carteEpreuve(c){
  const f = ETAT.cours[c.id] || {};
  const e = f.epreuve;
  const n = SEANCES_PAR_COURS * EPREUVE_PAR_SEANCE;
  const essais = e
    ? `<p class="minuscule" style="margin:10px 0 0">Meilleur score&#8239;: ${e.meilleur}/${e.total}
        &#8226; ${e.tentatives} tentative${e.tentatives > 1 ? "s" : ""}</p>` : "";
  const bouton = (plein, libelle) => `<div class="saut"></div>
    <button class="bouton${plein ? "-plein" : ""}" data-action="quiz-epreuve"
      data-cours="${esc(c.id)}">${libelle}</button>`;

  if(coursMaitrise(c.id)){
    return `<div class="carte maitrise">
      <h3>Cours maîtrisé &#9733;</h3>
      <p class="secondaire" style="margin:0">Sans-faute à l’épreuve finale le ${dateLisible(f.maitrise)}.
        Cette validation est définitive&#8239;; l’épreuve reste ouverte pour réviser.</p>
      ${essais}${bouton(false, "Repasser l’épreuve")}
    </div>`;
  }
  if(epreuveOuverte(c.id)){
    return `<div class="carte">
      <h3>Valider le cours pour de bon</h3>
      <p class="secondaire" style="margin:0">${n} questions tirées au sort dans les 6 séances,
        ${EPREUVE_PAR_SEANCE} par séance. <strong>Un seul sans-faute</strong> suffit à valider
        définitivement le cours&#8239;; sinon, recommencez autant de fois qu’il faut, le tirage change.</p>
      ${essais}${bouton(true, "Passer l’épreuve finale")}
    </div>`;
  }
  const lues = nbLues(c.id);
  return `<div class="carte">
    <h3>Valider le cours pour de bon</h3>
    <p class="secondaire" style="margin:0">L’épreuve finale s’ouvre quand les 6 séances sont lues
      (${lues}/${SEANCES_PAR_COURS}). Un seul sans-faute sur ${n} questions valide alors
      définitivement le cours.</p>
  </div>`;
}

/* Carte des quiz bonus, sous l'epreuve finale : grand quiz du cours, et
   ce que le cours a deja rapporte en giga. Fermee tant que le cours n'est
   pas termine. */
function carteGrand(c){
  const f = ETAT.cours[c.id] || {};
  const max = PTS_GRAND * GRAND_NB + PTS_GRAND_SANS_FAUTE;
  if(!quizBonusOuvert(c.id)){
    return `<div class="carte">
      <h3>Grand quiz</h3>
      <p class="secondaire" style="margin:0">Les ${GRAND_NB} questions du cours, mélangées, pour
        gagner jusqu’à ${max} points de plus. Il s’ouvre quand les 6 QCM de séance sont passés
        (${nbFaites(c.id)}/${SEANCES_PAR_COURS}), comme le giga quiz.</p>
    </div>`;
  }
  const g = f.grand, gi = f.giga;
  return `<div class="carte">
    <h3>Grand quiz</h3>
    <p class="secondaire" style="margin:0">Les ${GRAND_NB} questions du cours, mélangées.
      ${PTS_GRAND} points par bonne réponse, ${PTS_GRAND_SANS_FAUTE} de plus pour un sans-faute&#8239;:
      jusqu’à ${max} points. Seul votre meilleur score compte.</p>
    ${g ? `<p class="minuscule" style="margin:10px 0 0">Meilleur score&#8239;: ${g.meilleur}/${g.total}
        &#8226; ${ptsGrand(g)}/${max} pts acquis &#8226; ${g.tentatives} tentative${g.tentatives > 1 ? "s" : ""}</p>` : ""}
    <p class="minuscule" style="margin:6px 0 0">Giga quiz&#8239;: ${gi
      ? ptsGiga(gi) + " pts acquis pour ce cours (" + gi.justes + "/" + gi.total + ")"
      : "ce cours n’a pas encore été joué"}. Le giga se lance depuis l’onglet Quiz.</p>
    <div class="saut"></div>
    <button class="bouton${g ? "" : "-plein"}" data-action="quiz-grand" data-cours="${esc(c.id)}">${
      g ? "Refaire le grand quiz" : "Lancer le grand quiz"}</button>
  </div>`;
}

/* Carte d'un cours dans le catalogue : anneau, dates, titre,
   problematique et etat d'avancement. */
function carteCours(c){
  const lues = nbLues(c.id);
  const fini = coursTermine(c.id);
  const nonLues = SEANCES_PAR_COURS - lues;
  return `<button class="cours-carte" data-action="fiche" data-cours="${esc(c.id)}">
    ${anneauCours(c.id, 46)}
    <span class="corps">
      <span class="dates">${tx(c.dates)}</span>
      <span class="t">${txDates(c.titre)}</span>
      <span class="pb">${tx(c.problematique)}</span>
      ${ /* Un cours jamais ouvert n'a besoin d'aucune etiquette : son anneau
            vide le dit deja. Le << 6 seances, 30 questions >> d'avant etait
            le meme sur chaque carte ; la note de serie reste sur la fiche. */
        coursMaitrise(c.id) ? `<span class="bas"><span class="etiq maitre">maîtrisé</span></span>`
        : fini ? `<span class="bas"><span class="etiq faite">terminé</span><span class="etiq a-valider">épreuve à réussir</span></span>`
        : lues ? `<span class="bas"><span class="etiq lue">${lues} lue${lues > 1 ? "s" : ""}</span>
                 <span class="etiq">${nonLues} non lue${nonLues > 1 ? "s" : ""}</span></span>`
        : "" }
    </span>
  </button>`;
}

function rendreResultats(){
  const zone = document.getElementById("resultats");
  if(!zone) return;
  const liste = coursAffiches();
  const parts = [];

  if(!liste.length){
    parts.push(`<p class="vide">Aucun cours ne correspond${
      RECHERCHE ? " à « " + esc(RECHERCHE) + " »" : ""}. Élargissez la recherche ou les filtres.</p>`);
    zone.innerHTML = parts.join("");
    return;
  }

  /* Le detail ne sert qu'a mesurer l'effet d'un filtre : sans filtre, le
     total figure deja dans le titre de section. */
  if(liste.length !== COURS.length){
    parts.push(`<p class="minuscule" style="margin:0 0 10px">${liste.length} cours sur ${COURS.length}
      &#8226; ${liste.length * SEANCES_PAR_COURS} séances &#8226;
      ${liste.length * SEANCES_PAR_COURS * 5} questions</p>`);
  }

  if(CLASSEMENT === "frise"){
    /* La frise suit l'ordre des periodes, qui est deja chronologique,
       et range chaque periode par annee de depart. */
    PERIODES.forEach(p => {
      const dedans = liste.filter(c => c.periode === p)
                          .sort((a,b) => anneeDepart(a) - anneeDepart(b));
      if(!dedans.length) return;
      parts.push(`<div class="frise">
        <div class="frise-ere"><span class="nom">${esc(p)}</span></div>` +
        dedans.map(c => {
          const etat = coursTermine(c.id) ? "fait" : (coursCommence(c.id) ? "entame" : "");
          return `<div class="frise-item ${etat}">${carteCours(c)}</div>`;
        }).join("") + `</div>`);
    });
  }else{
    const champ = CLASSEMENT === "periode" ? "periode" : "theme";
    const groupes = CLASSEMENT === "periode" ? PERIODES.slice()
                                             : THEMES.map(t => t.nom);
    const vides = [];
    /* Le sommaire ne sert que sur le catalogue entier. Des qu'une
       recherche ou un filtre a reduit la liste, les sections s'affichent a
       plat : replier un resultat de recherche serait le cacher deux fois. */
    const sommaire = !RECHERCHE && AVANCEMENT === "tous";
    /* Onze sections a ouvrir une par une pour parcourir le catalogue
       entier : la commande tient en une ligne et evite onze gestes. */
    const zonePli = document.getElementById("zone-pli");
    if(zonePli){
      const pleins = groupes.filter(g => liste.some(c => c[champ] === g));
      const tous = pleins.length > 0 && pleins.every(g => OUVERTS.has(g));
      zonePli.innerHTML = sommaire
        ? `<button type="button" class="lien" data-action="tout-plier" data-tous="${tous ? "1" : "0"}">${
            tous ? "Tout replier" : "Tout déplier"}</button>` : "";
    }
    /* Dans le sommaire par theme, chaque theme se range sous la periode ou
       il s'ancre : avec des centaines de themes, une liste plate ne se
       parcourrait plus. */
    let periodeCourante = null;
    groupes.forEach(g => {
      const dedans = liste.filter(c => c[champ] === g);
      if(!dedans.length){ vides.push(g); return; }
      if(sommaire && CLASSEMENT !== "periode"){
        const t = THEMES.find(x => x.nom === g);
        const per = t && t.periode;
        if(per && per !== periodeCourante){
          periodeCourante = per;
          parts.push(`<p class="cat-periode">${tx(per)}</p>`);
        }
      }
      if(!sommaire){
        parts.push(filet(g));
        parts.push(`<div class="grille">` + dedans.map(carteCours).join("") + `</div>`);
        return;
      }
      const ouvert = OUVERTS.has(g);
      const entames = dedans.filter(c => coursCommence(c.id)).length;
      parts.push(`<div class="section-cat${ouvert ? " ouverte" : ""}">
        <button type="button" class="pli" data-action="plier"
            data-groupe="${esc(g)}" aria-expanded="${ouvert ? "true" : "false"}">
          <span class="pli-txt">
            <span class="pli-nom">${txDates(g)}</span>
            <span class="pli-compte">${dedans.length} cours${
              entames ? " &#8226; <b>" + entames + " commencé" + (entames > 1 ? "s" : "") + "</b>" : ""
            }</span>
          </span>
          <span class="pli-fleche" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M4 2 L8 6 L4 10"/></svg></span>
        </button>
        ${ouvert ? `<div class="grille">` + dedans.map(carteCours).join("") + `</div>` : ""}
      </div>`);
    });
    /* Les groupes sans aucun cours ne meritent pas une section vide a
       faire defiler, mais une ligne : l'Antiquite n'est pas absente du
       projet, elle n'est pas encore ecrite. */
    if(vides.length && sommaire){
      parts.push(`<p class="bientot"><span class="etiq bientot">bientôt</span><br>${vides.map(esc).join(" &#8226; ")}</p>`);
    }
  }

  zone.innerHTML = parts.join("");
  CESURE.poser(zone);
}

/* --- Fiche d'un cours ----------------------------------------------- */
function rendreFiche(vue){
  const c = coursParId(ECRAN.coursId);
  if(!c){ ECRAN = {nom:"catalogue"}; return rendreCours(); }
  const parts = [];
  const lues = nbLues(c.id);
  const reussies = c.seances.filter(x => seanceReussie(c.id, x.numero)).length;
  const r = reprise(c);

  const chapRetour = modeBrevet() ? chapitrePourCours(c.id) : null;
  parts.push(chapRetour
    ? `<div class="fil"><button class="bouton petit discret retour" data-action="b-fiche" data-chap="${esc(chapRetour.id)}">
        <span aria-hidden="true">&#8592;</span><span class="nom">Fiche du chapitre</span></button></div>`
    : `<div class="fil"><button class="bouton petit discret retour" data-action="catalogue">
        <span aria-hidden="true">&#8592;</span><span class="nom">Catalogue</span></button></div>`);
  parts.push(`<div class="carte">
    <p class="minuscule">${tx(c.periode)} &#8226; ${tx(c.dates)}${c.note ? " &#8226; " + tx(c.note) : ""}</p>
    <h2>${tx(c.titre)}</h2>
    <p class="secondaire" style="font-style:italic">${tx(c.problematique)}</p>
    <div class="reprise" style="align-items:center;margin-top:12px">
      ${anneauCours(c.id, 56)}
      <div class="corps">
        <p class="minuscule" style="margin:0">
          <i class="puce"></i><strong>${lues}</strong> séance${lues > 1 ? "s" : ""} lue${lues > 1 ? "s" : ""} sur ${SEANCES_PAR_COURS}<br>
          <i class="puce bd"></i><strong>${reussies}</strong> QCM réussi${reussies > 1 ? "s" : ""} sans faute${
            coursMaitrise(c.id)
              ? `<br><strong>Cours maîtrisé</strong> le ${dateLisible(ETAT.cours[c.id].maitrise)}` : ""}</p>
      </div>
    </div>
    ${ r && r.mode === "lire"
      ? `<div class="saut"></div>
         <button class="bouton-plein" data-action="lire" data-cours="${esc(c.id)}"
           data-seance="${r.numero}">Lire la séance ${r.numero}</button>`
      : r
        ? `<div class="saut"></div>${avisRefaire(c.id, r.numero)}
           <button class="bouton-plein" data-action="quiz-seance" data-cours="${esc(c.id)}"
             data-seance="${r.numero}">${estFaite(c.id, r.numero) ? "Refaire" : "Passer"} le QCM de la séance ${r.numero}</button>`
        : coursAValider(c.id)
          ? `<div class="saut"></div><p class="minuscule" style="margin:0 0 8px"><span class="etiq a-valider">pas encore validé</span>
               Il reste l’épreuve finale, à réussir sans faute.</p>
             <button class="bouton-plein" data-action="quiz-epreuve" data-cours="${esc(c.id)}">Passer l’épreuve finale</button>`
          : "" }
  </div>`);

  /* Le pont inverse de << Pour aller plus loin >> : ce cours approfondit
     un chapitre du brevet. Une simple note d'information. */
  const auBrevet = chapitresAvecCours(c.id);
  if(auBrevet.length){
    parts.push(`<div class="note-brevet"><strong>Au programme du brevet.</strong> Ce cours approfondit ${
      auBrevet.length > 1 ? "les chapitres de 3e" : "le chapitre de 3e"} ${
      auBrevet.map(ch => "«&#8239;" + tx(ch.titre) + "&#8239;»").join(" et ")}.</div>`);
  }

  /* Les seances s'enchainent : chacune s'ouvre quand le QCM de la
     precedente est reussi sans faute. */
  parts.push(`<p class="minuscule" style="margin:0 0 12px">Chaque séance s’ouvre quand le QCM de la
    précédente est réussi sans faute (10/10).</p>`);

  parts.push(filet("Les 6 séances"));
  parts.push(`<ul class="liste">` + c.seances.map(s => {
    const e = etatSeance(c.id, s.numero);
    const note = infoSeance(c.id, s.numero);
    const classes = ["ligne"];
    if(e === "faite") classes.push("faite");
    if(e === "lue") classes.push("lue");
    if(e === "fil") classes.push("fil");
    if(e === "neuve") classes.push("neuve");
    if(e === "refaire") classes.push("refaire");
    if(e === "fermee") classes.push("fermee");
    return `<li><button class="${classes.join(" ")}"
      data-action="lire" data-cours="${esc(c.id)}" data-seance="${s.numero}">
      <span class="num"><span>${e === "faite" ? "&#10003;" : s.numero}</span></span>
      <span class="corps"><span class="t">${tx(s.titre)}</span>
        ${note && typeof note.justes === "number"
          ? `<span class="minuscule">QCM ${note.qt ? note.qj + "/" + note.qt : note.justes + "/" + note.total}${
              note.date ? " &#8226; " + dateLisible(note.date) : ""}</span>`
          : (note && note.lu
            ? `<span class="minuscule">lue le ${dateLisible(note.lu)} &#8212; QCM en attente</span>`
            : `<span class="minuscule">lecture et QCM&#8239;: environ 6 minutes</span>`)}
      </span>
      <span class="etat">${LIBELLE_ETAT[e]}</span>
    </button></li>`;
  }).join("") + `</ul>`);

  parts.push(filet("Épreuve finale", "epreuve"));
  parts.push(carteEpreuve(c));
  parts.push(filet("Quiz bonus"));
  parts.push(carteGrand(c));

  parts.push(filet("Sources du cours"));
  parts.push(`<div class="carte"><ul class="sources">` +
    c.sources.map(s => `<li>${tx(s)}</li>`).join("") + `</ul>
    <p class="minuscule">Ouvrages de référence utilisés pour la rédaction des séances.</p></div>`);

  vue.innerHTML = parts.join("");
}

/* --- Lecture d'une seance -------------------------------------------- */

/* Prepare le contenu d'une seance : pose un identifiant sur chaque
   partie titree (pour le sommaire), releve ces titres, et compte les
   mots hors tableaux et croquis -- un croquis porte beaucoup de courts
   libelles qui fausseraient la duree de lecture annoncee. */
function preparerContenu(html){
  const boite = document.createElement("div");
  boite.innerHTML = typo(poserMarqueurs(html, 0));
  const titres = [];
  boite.querySelectorAll("h3").forEach((h, i) => {
    h.id = "partie-" + (i+1);
    titres.push({ id:h.id, texte:h.textContent });
  });
  const nu = boite.cloneNode(true);
  nu.querySelectorAll("figure,table,.verif").forEach(n => n.remove());
  const mots = (nu.textContent || "").trim().split(/\s+/).filter(Boolean).length;
  return { html:boite.innerHTML, titres, mots };
}

function rendreLecture(vue){
  const c = coursParId(ECRAN.coursId);
  const s = c ? c.seances.find(x => x.numero === ECRAN.seance) : null;
  if(!s){ ECRAN = {nom:"catalogue"}; return rendreCours(); }

  /* Le contenu arrive dans un fichier a part. Tant qu'il n'est pas la,
     on tient l'ecran : rendre() a lance le chargement et rappellera. */
  if(typeof s.contenu !== "string"){
    vue.innerHTML = `<div class="fil">
      <button class="bouton petit discret retour" data-action="fiche" data-cours="${esc(c.id)}">
        <span aria-hidden="true">&#8592;</span><span class="nom">${tx(c.titre)}</span></button>
    </div>` + (EPOK.estPerdu(c.id)
      ? `<div class="avis">Le texte de ce cours n’a pas pu être lu. Le fichier
         <code>${esc(EPOK.DOSSIER + c.id)}.js</code> est introuvable ou illisible&#8239;:
         l’application est peut-être incomplète. Le reste du catalogue reste consultable.</div>`
      : `<p class="secondaire" style="margin:24px 0">Ouverture de la séance&#8230;</p>`);
    return;
  }

  /* Seance verrouillee : le QCM de la precedente n'est pas encore reussi. */
  if(!seanceOuverte(c.id, s.numero)){
    const p = s.numero - 1;
    vue.innerHTML = `<div class="fil">
      <button class="bouton petit discret retour" data-action="fiche" data-cours="${esc(c.id)}">
        <span aria-hidden="true">&#8592;</span><span class="nom">${tx(c.titre)}</span></button></div>
      <div class="carte a-valider"><h3>Séance ${s.numero} verrouillée</h3>
        <p class="secondaire">Elle s’ouvrira quand vous aurez réussi sans faute le QCM de la séance ${p}.</p>
        ${avisRefaire(c.id, p)}
        ${estLue(c.id, p)
          ? `<button class="bouton-plein" data-action="quiz-seance" data-cours="${esc(c.id)}" data-seance="${p}">${
              estFaite(c.id, p) ? "Refaire" : "Passer"} le QCM de la séance ${p}</button>`
          : `<button class="bouton-plein" data-action="lire" data-cours="${esc(c.id)}" data-seance="${p}">Lire la séance ${p}</button>`}
      </div>`;
    return;
  }

  ETAT.dernier = { coursId:c.id, seance:s.numero };
  sauverEtat();

  const prepare = preparerContenu(s.contenu);
  const minutes = Math.max(1, Math.round(prepare.mots / 190));
  const etat = etatSeance(c.id, s.numero);
  /* Les seances non lues qui precedent celle-ci : c'est tout l'objet du
     bandeau << hors fil >>. */
  const avant = c.seances.filter(x => x.numero < s.numero && !estLue(c.id, x.numero))
                         .map(x => x.numero);
  const precedente = c.seances.find(x => x.numero === s.numero - 1);
  const suivante = c.seances.find(x => x.numero === s.numero + 1);

  const parts = [];
  /* Ecouter plutot que lire : la voix de l'appareil, aucun fichier audio.
     La commande tient sur la meme ligne que le retour et les reglages.
     Elle occupait auparavant une ligne a elle seule, soixante pixels sur
     les huit cents de l'ecran, juste avant le texte qu'on vient ouvrir. */
  parts.push(`<div class="fil">
    <button class="bouton petit discret retour" data-action="fiche" data-cours="${esc(c.id)}">
      <span aria-hidden="true">&#8592;</span><span class="nom">${tx(c.titre)}</span></button>
    <button class="bouton petit ecoute" data-action="voix"
      title="Écouter la séance"><span aria-hidden="true">&#9655;</span>
      <span class="nom">Écouter</span></button>
    <button class="bouton petit discret carre" data-action="bascule-theme"
      aria-label="Changer l’apparence" title="Papier ou veillée">&#9790;</button>
    <button class="bouton petit discret carre" data-action="cycle-echelle"
      aria-label="Changer la taille du texte" title="Taille du texte">A</button>
  </div><div id="avis-voix"></div>`);

  parts.push(`<div class="carte">
    <p class="minuscule">Séance ${s.numero} sur ${SEANCES_PAR_COURS} &#8226;
      ${prepare.mots} mots &#8226; environ ${minutes} minutes
      ${etat === "faite" ? "&#8226; <strong>validée</strong>" :
        etat === "lue" ? "&#8226; <strong>déjà lue</strong>" : ""}</p>
    <h2>${tx(s.titre)}</h2>
  </div>`);

  if(avant.length){
    const pl = avant.length > 1;
    parts.push(`<div class="hors-fil">Vous lisez la séance ${s.numero} alors que
      ${pl ? "les séances" : "la séance"} <strong>${enumerer(avant)}</strong>
      ${pl ? "ne sont" : "n’est"} pas encore ${pl ? "lues" : "lue"}.
      C’est permis&#8239;: ${pl ? "elles resteront marquées non lues" : "elle restera marquée non lue"}
      dans la fiche du cours, et rien ne vous obligera à y revenir.</div>`);
  }

  parts.push(`<div class="probleme"><strong>Problématique.</strong> ${tx(s.problematique)}</div>`);

  /* Sommaire des parties : sur telephone, c'est le seul moyen de revenir
     a la partie III sans faire defiler a l'aveugle. */
  if(prepare.titres.length > 1){
    parts.push(`<details class="sommaire"><summary>Sommaire de la séance</summary>
      <ol>${prepare.titres.map(t =>
        `<li><a href="#${t.id}">${esc(t.texte)}</a></li>`).join("")}</ol></details>`);
  }

  /* Le cours en entier d'abord. */
  parts.push(`<article class="lecture">${prepare.html}</article>`);

  /* Puis l'anecdote, jamais evaluee. */
  parts.push(`<div class="anecdote"><span class="titre">Anecdote &#8212; hors programme</span>${
    typo(poserMarqueurs(s.anecdote, (s.contenu.match(MOTIF_VERIF) || []).length))}</div>`);

  /* Repere de fin de lecture : des qu'il entre dans l'ecran, la seance
     passe en << lue >>. Marquer a l'ouverture aurait compte comme lue
     une seance seulement entrevue. */
  parts.push(`<div id="fin-lecture" style="height:1px"></div>`);

  /* Et seulement tout en bas, l'acces au QCM. */
  parts.push(filet(""));
  const rev = s.numero > 1 ? 10 : 5;
  parts.push(`<div class="carte">
    <h3>Vérifier sa compréhension</h3>
    <p class="secondaire">${rev} questions&#8239;: les 5 de cette séance${
      s.numero > 1 ? ", plus les 5 de la séance précédente en révision" : ""}.
      Comptez environ 3 minutes.</p>
    ${ s.numero > 1 && !estLue(c.id, s.numero - 1)
      ? `<p class="minuscule"><em>La séance ${s.numero-1} n’a pas été lue&#8239;: ses 5 questions
         de révision resteront dans le QCM, et leur correction vous en donnera l’essentiel.</em></p>`
      : "" }
    <button class="bouton-plein" data-action="quiz-seance" data-cours="${esc(c.id)}" data-seance="${s.numero}">Accéder au QCM</button>
    ${ !estLue(c.id, s.numero)
      ? `<div class="saut"></div>
         <button class="bouton" data-action="marquer-lue" data-cours="${esc(c.id)}"
           data-seance="${s.numero}">Marquer comme lue sans faire le QCM</button>` : "" }
  </div>`);

  /* Aller d'une seance a l'autre sans repasser par la fiche. */
  parts.push(`<div class="rang-boutons" style="margin-bottom:10px">
    ${precedente ? `<button class="bouton petit discret" data-action="lire" data-cours="${esc(c.id)}"
      data-seance="${precedente.numero}" style="flex:1">&#8592; Séance ${precedente.numero}</button>` : ""}
    ${suivante ? `<button class="bouton petit discret" data-action="lire" data-cours="${esc(c.id)}"
      data-seance="${suivante.numero}" style="flex:1">${seanceOuverte(c.id, suivante.numero) ? "" : "&#128274; "}Séance ${suivante.numero} &#8594;</button>` : ""}
  </div>`);

  vue.innerHTML = parts.join("");
  /* Chaque figure s'ouvre en grand d'un appui (voir ouvrirFigure). */
  vue.querySelectorAll(".lecture figure.croquis").forEach(f => {
    if(!f.querySelector("svg")) return;
    f.dataset.action = "figure-agrandir";
    const b = document.createElement("button");
    b.type = "button"; b.className = "fz-ouvrir"; b.dataset.action = "figure-agrandir";
    b.innerHTML = `<span aria-hidden="true">&#10530;</span> Agrandir`;
    f.insertBefore(b, f.querySelector("figcaption"));
  });
}

/* ---------- 4.6  Moteur de QCM ---------- */

/* QUIZ courant :
   { type, coursId, seance, items:[...], reponses:{i:[indices]}, corrige:bool, resultat:{} }
   Chaque item : { coursId, seance, index, q, ordre }  (ordre = ordre
   d'affichage melange des 4 propositions, pour eviter la memorisation
   d'une position). */
let QUIZ = null;

function faireItem(coursId, seance, index, q){
  return { coursId, seance, index, q, ordre: melanger([0,1,2,3]) };
}

/* QCM de seance : les 5 questions de la seance + les 5 de la precedente. */
function construireQuizSeance(coursId, numero){
  const c = coursParId(coursId);
  const items = [];
  const s = c.seances.find(x => x.numero === numero);
  s.questions.forEach((q,i) => items.push(faireItem(coursId, numero, i, q)));
  if(numero > 1){
    const p = c.seances.find(x => x.numero === numero-1);
    if(p) p.questions.forEach((q,i) => items.push(faireItem(coursId, numero-1, i, q)));
  }
  return { type:"seance", coursId, seance:numero, items, reponses:{}, corrige:false, resultat:null };
}

/* Epreuve finale : EPREUVE_PAR_SEANCE questions tirees au sort dans chacune
   des six seances, puis melangees. Le tirage change a chaque tentative :
   un sans-faute ne s'obtient pas en retenant l'ordre d'une grille. */
function construireQuizEpreuve(coursId){
  const c = coursParId(coursId);
  const items = [];
  c.seances.forEach(s => {
    const idx = melanger(s.questions.map((q,i) => i)).slice(0, EPREUVE_PAR_SEANCE);
    idx.forEach(i => items.push(faireItem(coursId, s.numero, i, s.questions[i])));
  });
  return { type:"epreuve", coursId, seance:null, items:melanger(items),
           reponses:{}, corrige:false, resultat:null };
}

/* Grand quiz : toutes les questions du cours, melangees. */
function construireQuizGrand(coursId){
  const c = coursParId(coursId);
  const items = [];
  c.seances.forEach(s => s.questions.forEach((q,i) => items.push(faireItem(coursId, s.numero, i, q))));
  return { type:"grand", coursId, seance:null, items:melanger(items),
           reponses:{}, corrige:false, resultat:null };
}

/* Giga quiz : GIGA_NB questions, a parts egales entre les cours (30, 20
   ou 15 chacun), tirees au sort dans chacun puis melangees ensemble. Les
   questions sont reparties sur les six seances de chaque cours. */
function construireQuizGiga(ids){
  const part = Math.floor(GIGA_NB / ids.length);
  let items = [];
  ids.forEach(id => {
    const c = coursParId(id);
    const tous = [];
    c.seances.forEach(s => s.questions.forEach((q,i) => tous.push(faireItem(id, s.numero, i, q))));
    /* Tirage par seance, en tournant : 15 questions donnent 2 ou 3 par
       seance, jamais 5 d'une seule et 0 d'une autre. */
    const parSeance = c.seances.map(s => melanger(tous.filter(it => it.seance === s.numero)));
    const pris = [];
    for(let k = 0; pris.length < part && k < 5; k++){
      melanger(parSeance.slice()).forEach(l => { if(pris.length < part && l[k]) pris.push(l[k]); });
    }
    items = items.concat(pris);
  });
  return { type:"giga", coursId:null, cours:ids.slice(), seance:null, items:melanger(items),
           reponses:{}, corrige:false, resultat:null };
}

/* Quiz compose : tirage parmi les questions des cours coches.
   Les questions deja ratees sont remontees en priorite. */
function construireQuizCompose(ids, nombre, toutInclure){
  let pool = [];
  ids.forEach(id => {
    const c = coursParId(id);
    if(!c) return;
    c.seances.forEach(s => {
      if(!toutInclure && !estLue(id, s.numero)) return;
      s.questions.forEach((q,i) => pool.push(faireItem(id, s.numero, i, q)));
    });
  });
  if(!pool.length) return null;

  /* Priorite = (nombre d'echecs) - (nombre de reussites) sur la question.
     Tri decroissant, avec un aleatoire pour departager les ex aequo. */
  pool = pool.map(it => {
    const st = ETAT.questions[cleQuestion(it.coursId, it.seance, it.index)] || {r:0,j:0};
    return { it, p: (st.r||0) - (st.j||0), h: Math.random() };
  }).sort((a,b) => (b.p - a.p) || (a.h - b.h)).map(x => x.it);

  const n = (nombre === "toutes") ? pool.length : Math.min(Number(nombre), pool.length);
  const choisies = melanger(pool.slice(0, n));
  return { type:"compose", coursId:null, seance:null, items:choisies, reponses:{}, corrige:false, resultat:null };
}

/* Un cours dont le fichier manque ne peut pas fournir ses questions. On
   le dit a l'endroit ou le quiz devait partir, plutot que de laisser un
   bouton sans effet. */
function avisQuizPerdu(ids){
  const zone = document.getElementById("avis-compose")
            || document.getElementById("avis-voix");
  const texte = `<div class="avis">Le texte de ${ids.length > 1 ? "certains cours" : "ce cours"}
    n’a pas pu être lu&#8239;: l’application est peut-être incomplète. Les questions
    ne peuvent pas être tirées.</div>`;
  if(zone) zone.innerHTML = texte;
  else alert("Le texte de ce cours n’a pas pu être lu : l’application est peut-être incomplète.");
}

/* Combien de questions ont recu au moins une coche. */
function nbRepondues(){
  if(!QUIZ) return 0;
  return QUIZ.items.filter((it,i) => (QUIZ.reponses[i] || []).length).length;
}

/* Bandeau d'avancement, mis a jour a chaque coche sans redessiner le
   quiz : redessiner decocherait les cases et ferait sauter la page. */
function majAvancement(){
  const z = document.getElementById("avancement");
  if(!z || !QUIZ) return;
  const n = nbRepondues(), t = QUIZ.items.length;
  z.innerHTML = `<div class="texte"><span>Avancement</span><span><b>${n}</b> / ${t}</span></div>
    ${jauge(n, t)}`;
}

function rendreQuizEnCours(){
  const q = QUIZ;
  const parts = [];
  const titreQuiz = q.type === "seance"
    ? tx(coursParId(q.coursId).titre) + " &#8212; séance " + q.seance
    : q.type === "epreuve"
    ? tx(coursParId(q.coursId).titre) + " &#8212; épreuve finale"
    : q.type === "grand"
    ? tx(coursParId(q.coursId).titre) + " &#8212; grand quiz"
    : q.type === "giga"
    ? "Giga quiz &#8212; " + q.cours.length + " cours"
    : (q.type === "b-qcm" || q.type === "b-reperes")
    ? titreQuizBrevet(q)
    : "Quiz composé";

  parts.push(`<div class="fil"><button class="bouton petit discret" data-action="quiz-abandonner">&#8592; Quitter</button></div>`);
  parts.push(`<div class="carte">
    <p class="minuscule">${q.items.length} questions</p>
    <h2>${titreQuiz}</h2>
    <p class="secondaire" style="margin:0">${q.type === "b-reperes" ? "Une seule bonne réponse par question."
      : "Chaque question peut appeler une ou plusieurs bonnes réponses."}
    Toutes les questions doivent recevoir au moins une coche.${
      q.type === "epreuve"
        ? " <strong>Un sans-faute valide le cours pour de bon&#8239;;</strong> au moindre écart, vous pourrez recommencer avec un nouveau tirage."
        : q.type === "grand"
        ? " <strong>" + PTS_GRAND + " points par bonne réponse, " + PTS_GRAND_SANS_FAUTE + " de plus pour un sans-faute&#8239;;</strong> seul votre meilleur score compte."
        : q.type === "giga"
        ? " <strong>" + PTS_GIGA + " points par bonne réponse, " + PTS_GIGA_SANS_FAUTE + " de plus pour un sans-faute&#8239;;</strong> chaque cours garde son meilleur résultat."
        : ""}</p>
    ${q.type === "giga" ? `<p class="minuscule" style="margin:8px 0 0">${q.cours.map(id => tx(coursParId(id).titre)).join(" &#8226; ")}</p>` : ""}
  </div>`);
  parts.push(`<div class="avancement" id="avancement"></div>`);

  q.items.forEach((it,i) => {
    const revision = (q.type === "seance" && it.seance !== q.seance);
    const coches = q.reponses[i] || [];
    parts.push(`<div class="question" id="q-${i}">
      <p class="enonce">${i+1}. ${tx(it.q.enonce)}</p>
      <p class="consigne">${revision ? "Révision &#8212; séance " + it.seance + " &#8226; "
        : (q.type === "epreuve" || q.type === "grand") ? "Séance " + it.seance + " &#8226; "
        : q.type === "giga" ? tx(coursParId(it.coursId).titre) + " &#8226; "
        : q.type === "b-reperes" ? "Repère &#8226; une seule réponse" : ""}${q.type === "b-reperes" ? "" : "plusieurs réponses possibles"}</p>
      ${it.ordre.map(oi => `<label class="option">
          <input type="checkbox" data-question="${i}" data-option="${oi}" ${coches.indexOf(oi) >= 0 ? "checked" : ""}>
          <span>${tx(it.q.options[oi])}</span>
        </label>`).join("")}
      <p class="erreur" id="err-${i}" style="display:none">Cochez au moins une proposition pour cette question.</p>
    </div>`);
  });

  parts.push(`<div class="saut"></div>`);
  parts.push(`<button class="bouton-plein" data-action="quiz-valider">Valider</button>`);
  parts.push(`<div id="avis-validation"></div>`);
  document.getElementById("vue-quiz").innerHTML = parts.join("");
  majAvancement();
}

/* Validation : refus si une question est sans reponse. */
function validerQuiz(){
  const q = QUIZ;
  let premierManque = -1;
  q.items.forEach((it,i) => {
    const coches = q.reponses[i] || [];
    const err = document.getElementById("err-"+i);
    const bloc = document.getElementById("q-"+i);
    if(!coches.length){
      if(premierManque < 0) premierManque = i;
      if(err) err.style.display = "block";
      if(bloc) bloc.classList.add("en-erreur");
    }else{
      if(err) err.style.display = "none";
      if(bloc) bloc.classList.remove("en-erreur");
    }
  });

  if(premierManque >= 0){
    const avis = document.getElementById("avis-validation");
    const vides = q.items.filter((it,i) => !(q.reponses[i]||[]).length).length;
    if(avis) avis.innerHTML = `<div class="avis">Quiz incomplet&#8239;: ${vides} question${vides > 1 ? "s" : ""} sans réponse.</div>`;
    const cible = document.getElementById("q-"+premierManque);
    if(cible) cible.scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }

  /* Correction : une question n'est juste que si l'ensemble coche est
     exactement l'ensemble correct. */
  const details = q.items.map((it,i) => {
    const coches = (q.reponses[i]||[]).slice().sort((a,b)=>a-b);
    const bonnes = it.q.correctes.slice().sort((a,b)=>a-b);
    const juste = coches.length === bonnes.length && coches.every((v,k) => v === bonnes[k]);
    return { it, i, coches, bonnes, juste };
  });

  const justes = details.filter(d => d.juste).length;
  q.corrige = true;
  q.resultat = { justes, total: details.length, details };

  enregistrerResultat(q);
  rendreCorrection();
}

function enregistrerResultat(q){
  const jour = aujourdhui();
  const ptsAvant = pointsTotal();
  const rangAvant = rangActuel().i;

  /* Statistiques par question, pour remonter les ratees dans les quiz composes. */
  q.resultat.details.forEach(d => {
    const cle = cleQuestion(d.it.coursId, d.it.seance, d.it.index);
    const st = ETAT.questions[cle] || {r:0,j:0};
    if(d.juste) st.j = (st.j||0)+1; else st.r = (st.r||0)+1;
    ETAT.questions[cle] = st;
  });

  if(q.type === "seance"){
    /* Note de la seance : uniquement ses propres questions, hors revision. */
    const propres = q.resultat.details.filter(d => d.it.seance === q.seance);
    const j = propres.filter(d => d.juste).length;
    const f = fiche(q.coursId);
    const ancienne = f.seances[q.seance] || {};
    f.seances[q.seance] = {
      /* Passer le QCM vaut lecture : on ne peut pas y repondre sans
         avoir ouvert la seance. La date de lecture est conservee si
         elle existait deja. */
      lu: ancienne.lu || jour,
      date: jour,
      justes: j,
      total: propres.length,
      tentatives: (ancienne.tentatives ? ancienne.tentatives : 0) + 1,
      meilleur: Math.max(j, ancienne.meilleur ? ancienne.meilleur : 0),
      /* Le QCM entier, revision comprise : sans faute, il ouvre la seance
         suivante, et ce qui est acquis le reste. */
      parfait: ancienne.parfait === true || q.resultat.justes === q.resultat.total,
      qj: Math.max(q.resultat.justes, ancienne.qj || 0),
      qt: q.resultat.total
    };
    if(coursTermine(q.coursId) && !f.termine) f.termine = jour;
    ETAT.dernier = { coursId:q.coursId, seance:q.seance };
  }else if(q.type === "epreuve"){
    /* Une seule epreuve reussie sans faute suffit, et pour toujours : on
       garde le meilleur score et le nombre de tentatives, et la maitrise,
       une fois acquise, ne se perd pas. */
    const f = fiche(q.coursId);
    const e = f.epreuve || {};
    const r = q.resultat;
    q.etaitMaitre = !!f.maitrise;
    f.epreuve = {
      date: jour, justes: r.justes, total: r.total,
      tentatives: (e.tentatives || 0) + 1,
      meilleur: Math.max(r.justes, e.meilleur || 0)
    };
    if(r.total > 0 && r.justes === r.total && !f.maitrise) f.maitrise = jour;
  }else if(q.type === "b-qcm" || q.type === "b-reperes"){
    enregistrerBrevet(q, jour);
  }else if(q.type === "grand"){
    const f = fiche(q.coursId);
    const g = f.grand || {};
    const r = q.resultat;
    q.ancienGrand = ptsGrand(f.grand);
    f.grand = {
      date: jour, justes: r.justes, total: r.total,
      tentatives: (g.tentatives || 0) + 1,
      meilleur: Math.max(r.justes, g.meilleur || 0)
    };
  }else if(q.type === "giga"){
    /* Chaque cours est credite a part : ses bonnes reponses, et sa part du
       sans-faute si le quiz entier en est un. Le passage n'est retenu pour
       un cours que s'il y rapporte plus que son meilleur precedent. */
    const r = q.resultat, nb = q.cours.length;
    const sansFaute = r.total > 0 && r.justes === r.total;
    q.parCours = q.cours.map(id => {
      const siens = r.details.filter(d => d.it.coursId === id);
      const j = siens.filter(d => d.juste).length;
      const f = fiche(id);
      const avant = f.giga || null;
      const essai = { date: jour, justes: j, total: siens.length, nb, sansFaute,
                      tentatives: (avant && avant.tentatives || 0) + 1 };
      const pa = ptsGiga(avant), pe = ptsGiga(essai);
      if(!avant || pe > pa) f.giga = essai;
      else f.giga = Object.assign({}, avant, { tentatives: essai.tentatives });
      return { id, justes: j, total: siens.length, pts: pe, gain: Math.max(0, pe - pa), meilleur: Math.max(pa, pe) };
    });
  }

  noterPalier();
  q.gain = { avant: ptsAvant, apres: pointsTotal(), rangAvant, rangApres: rangActuel().i };

  const ligne = {
    d: jour, type: q.type, coursId: q.coursId, seance: q.seance,
    justes: q.resultat.justes, total: q.resultat.total
  };
  if(q.type === "giga") ligne.cours = q.cours.slice();
  ETAT.historique.push(ligne);
  if(ETAT.historique.length > 300) ETAT.historique = ETAT.historique.slice(-300);
  sauverEtat();
}

function listeReponses(it, indices, classe){
  if(!indices.length) return `<span class="rep ${classe}">aucune</span>`;
  return indices.map(k => `<span class="rep ${classe}">${tx(it.q.options[k])}</span>`).join("");
}

function blocCorrection(d){
  return `<div class="corr">
    <p class="enonce">${d.i+1}. ${tx(d.it.q.enonce)}</p>
    ${d.juste ? "" : `<p class="ligne-rep"><b>Vous avez coché</b>${listeReponses(d.it, d.coches, "faux")}</p>`}
    <p class="ligne-rep"><b>${d.juste ? "Réponse" : "Bonne réponse"}</b>${listeReponses(d.it, d.bonnes, "juste")}</p>
    <p class="expl">${tx(d.it.q.explication)}</p>
  </div>`;
}

function rendreCorrection(){
  const q = QUIZ, r = q.resultat;
  const pc = r.total ? Math.round(100*r.justes/r.total) : 0;
  const faux = r.details.filter(d => !d.juste);
  const bons = r.details.filter(d => d.juste);
  const parts = [];

  parts.push(`<div class="score${faux.length ? "" : " parfait"}">
    <div class="chiffre">${r.justes} / ${r.total}</div>
    <p class="minuscule" style="margin:6px 0 0">${pc} % de réponses exactes</p>
    <p class="secondaire" style="margin:8px 0 0">${
      faux.length ? faux.length + (faux.length > 1 ? " questions à revoir ci-dessous." : " question à revoir ci-dessous.") : "Aucune erreur&#8239;: tout est juste."
    }</p>
  </div>`);

  if(q.type === "epreuve"){
    parts.push(!faux.length
      ? (q.etaitMaitre
          ? `<div class="carte maitrise"><h3>Sans-faute &#9733;</h3>
             <p class="secondaire" style="margin:0">Ce cours était déjà maîtrisé&#8239;; vous le confirmez.</p></div>`
          : `<div class="carte maitrise"><h3>Cours maîtrisé &#9733;</h3>
             <p class="secondaire" style="margin:0">Sans-faute à l’épreuve finale&#8239;: ce cours est validé
             pour de bon.</p></div>`)
      : `<div class="carte"><p class="secondaire" style="margin:0">${
          q.etaitMaitre
            ? "La maîtrise de ce cours reste acquise&#8239;; ce score n’y change rien."
            : "Il faut un sans-faute pour valider le cours. Relisez les corrections ci-dessous, puis recommencez&#8239;: le tirage sera différent."
        }</p></div>`);
  }

  /* Points gagnes par ce quiz, et changement de rang le cas echeant. */
  if(q.type === "grand"){
    const f = ETAT.cours[q.coursId] || {};
    const m = f.grand ? f.grand.meilleur : r.justes;
    parts.push(`<p class="minuscule" style="text-align:center;margin:0 0 14px">Meilleur score au grand quiz&#8239;:
      ${m}/${r.total} &#8226; ${ptsGrand(f.grand)} point${ptsGrand(f.grand) > 1 ? "s" : ""} acquis sur
      ${PTS_GRAND * GRAND_NB + PTS_GRAND_SANS_FAUTE}</p>`);
  }
  if(q.type === "giga" && q.parCours){
    parts.push(`<div class="carte"><h3>Cours par cours</h3><ul class="giga-bilan">${q.parCours.map(x =>
      `<li><span class="t">${tx(coursParId(x.id).titre)}</span>
        <span class="minuscule">${x.justes}/${x.total} &#8226; ${x.gain > 0 ? "+" + x.gain + " pt" + (x.gain > 1 ? "s" : "")
          : "meilleur résultat déjà acquis (" + x.meilleur + " pts)"}</span></li>`).join("")}</ul></div>`);
  }

  if(q.gain && q.type !== "compose"){
    const g = q.gain.apres - q.gain.avant;
    const avant = rangDe(q.gain.avant, q.gain.rangAvant), apres = rangDe(q.gain.apres, q.gain.rangApres);
    if(g > 0){
      parts.push(`<div class="carte${apres.i > avant.i ? " maitrise" : ""} gain">
        ${emblemeRang(apres.i, 46)}
        <div class="corps">
          <h3>${apres.i > avant.i ? "Rang supérieur&#8239;!" : "+" + g + " point" + (g > 1 ? "s" : "")}</h3>
          <p class="secondaire" style="margin:0">${
            apres.i > avant.i
              ? avant.libelle + " &#8594; <strong>" + apres.libelle + "</strong> &#8226; +" + g + " point" + (g > 1 ? "s" : "")
              : apres.libelle + " &#8226; " + q.gain.apres.toLocaleString("fr-FR") + " points"}</p>
        </div>
      </div>`);
    }else{
      parts.push(`<p class="minuscule" style="text-align:center;margin:0 0 14px">Aucun point de plus&#8239;:
        seul votre meilleur score compte.</p>`);
    }
  }

  if(q.type === "seance"){
    const propres = r.details.filter(d => d.it.seance === q.seance);
    const jp = propres.filter(d => d.juste).length;
    parts.push(`<p class="minuscule" style="text-align:center;margin:-8px 0 16px">
      Séance ${q.seance}&#8239;: ${jp}/${propres.length}${
        r.details.length > propres.length
          ? " &#8226; révision séance " + (q.seance-1) + "&#8239;: " + (r.justes-jp) + "/" + (r.details.length-propres.length)
          : ""}
    </p>`);
  }

  if(faux.length){
    parts.push(filet("Ce qu’il faut reprendre"));
    parts.push(faux.map(blocCorrection).join(""));
  }
  if(bons.length){
    parts.push(`<details class="justes"><summary>${bons.length > 1 ? `Voir les ${bons.length} questions justes` : "Voir la question juste"}</summary>
      ${bons.map(blocCorrection).join("")}</details>`);
  }

  /* Apres un QCM de seance, l'enchainement naturel est la seance
     suivante : on l'offre directement plutot que de renvoyer a la fiche. */
  const co = q.type === "seance" || q.type === "epreuve" || q.type === "grand" ? coursParId(q.coursId) : null;
  const reussie = q.type === "seance" && seanceReussie(q.coursId, q.seance);
  const suite = co && reussie ? co.seances.find(x => x.numero === q.seance + 1) : null;
  if(q.type === "seance" && !reussie){
    const apres = co && co.seances.find(x => x.numero === q.seance + 1);
    parts.push(`<div class="carte a-valider" style="margin-top:16px">
      <h3>Encore un essai</h3>
      <p class="secondaire" style="margin:0">Il faut ${q.resultat.total}/${q.resultat.total} pour ${apres
        ? "ouvrir la séance " + apres.numero : "terminer le cours"}. Relisez les corrections ci-dessus,
        puis refaites le QCM&#8239;: ce sont les mêmes questions, dans un autre ordre.</p>
    </div>`);
  }

  /* Le moment ou l'epreuve s'ouvre : on le dit ici, a la sortie du QCM,
     plutot que de laisser le lecteur la chercher en bas d'une fiche. */
  if(q.type === "seance" && epreuveOuverte(q.coursId) && !coursMaitrise(q.coursId)){
    parts.push(`<div class="carte" style="margin-top:16px">
      <h3>L’épreuve finale est ouverte</h3>
      <p class="secondaire" style="margin:0">Les 6 séances sont lues. Un sans-faute sur
        ${SEANCES_PAR_COURS * EPREUVE_PAR_SEANCE} questions valide le cours pour de bon.</p>
      <div class="saut"></div>
      <button class="bouton-plein" data-action="quiz-epreuve" data-cours="${esc(q.coursId)}">Passer l’épreuve finale</button>
    </div>`);
  }

  parts.push(`<div class="rang-boutons" style="margin-top:16px">
    ${q.type === "epreuve" && faux.length ? `<button class="bouton-plein" data-action="quiz-epreuve"
        data-cours="${esc(q.coursId)}" style="flex:1 1 100%">Recommencer l’épreuve</button>` : ""}
    ${q.type === "grand" && faux.length ? `<button class="bouton-plein" data-action="quiz-grand"
        data-cours="${esc(q.coursId)}" style="flex:1 1 100%">Refaire le grand quiz</button>` : ""}
    ${q.type === "giga" ? `<button class="bouton-plein" data-action="quiz-menu"
        style="flex:1 1 100%">Nouveau giga quiz</button>` : ""}
    ${q.type === "b-qcm" ? `${q.validation ? `<div class="carte b-val-avis" style="flex:1 1 100%">${pastilleValidation(q.coursId)}<p style="margin:0">${messageValidation(q.coursId, q.validation, "qcm")}</p></div>`
        : faux.length ? `<p class="secondaire" style="flex:1 1 100%;margin:0">Il faut 10/10 pour valider le chapitre.</p>` : ""}
      ${faux.length ? `<button class="bouton-plein" data-action="b-qcm" data-chap="${esc(q.coursId)}"
        style="flex:1 1 100%">Refaire le QCM</button>` : ""}
      ${!faux.length && !tourChapitre(q.coursId).frise && !chapitreMaitrise(q.coursId) ? `<button class="bouton-plein" data-action="b-frise" data-chap="${esc(q.coursId)}"
        style="flex:1 1 100%">Faire la frise des repères</button>` : ""}
        <button class="bouton" data-action="b-fiche" data-chap="${esc(q.coursId)}" style="flex:1 1 100%">Fiche du chapitre</button>` : ""}
    ${q.type === "b-reperes" ? `<button class="bouton-plein" data-action="b-reperes"
        style="flex:1 1 100%">Nouvel entraînement</button>` : ""}
    ${q.type === "seance" && !reussie ? `<button class="bouton-plein" data-action="quiz-seance" data-cours="${esc(q.coursId)}"
        data-seance="${q.seance}" style="flex:1 1 100%">Refaire le QCM de la séance ${q.seance}</button>
      <button class="bouton" data-action="lire" data-cours="${esc(q.coursId)}"
        data-seance="${q.seance}" style="flex:1 1 100%">Relire la séance ${q.seance}</button>` : ""}
    ${suite ? `<button class="bouton-plein" data-action="lire" data-cours="${esc(co.id)}"
        data-seance="${suite.numero}" style="flex:1 1 100%">Lire la séance ${suite.numero}</button>` : ""}
    ${co ? `<button class="bouton" data-action="fiche" data-cours="${esc(co.id)}" style="flex:1">Fiche du cours</button>` : ""}
    <button class="bouton${suite || co ? "" : "-plein"}" data-action="quiz-terminer" style="flex:1">Accueil</button>
    <button class="bouton discret petit" data-action="quiz-menu" style="flex:1 1 100%">${
      modeBrevet() ? "Retour aux révisions" : "Nouveau quiz composé"}</button>
  </div>`);

  const vue = document.getElementById("vue-quiz");
  vue.innerHTML = parts.join("");
  CESURE.poser(vue);
  window.scrollTo(0,0);
}

/* ---------- 4.7  Onglet Quiz : menu du quiz compose ---------- */

let COMPOSE = { coches:[], nombre:"10", tout:false };
let QCM_COURS = null;   // le cours choisi pour refaire un QCM de seance
let GIGA = { coches:[] };

/* Grand et giga quiz dans l'onglet Quiz. Seuls les cours termines y
   figurent ; chacun dit ce qu'il a deja rapporte. */
function menuQuizBonus(){
  const parts = [];
  const ouverts = COURS.filter(co => quizBonusOuvert(co.id));
  const maxG = PTS_GRAND * GRAND_NB + PTS_GRAND_SANS_FAUTE;
  GIGA.coches = GIGA.coches.filter(id => ouverts.some(co => co.id === id));

  parts.push(filet("Grand quiz", "grand"));
  parts.push(`<div class="carte">
    <p class="secondaire">Les ${GRAND_NB} questions d’un cours terminé, mélangées&#8239;:
      ${PTS_GRAND} points par bonne réponse et ${PTS_GRAND_SANS_FAUTE} de plus pour un sans-faute,
      soit jusqu’à ${maxG} points par cours. Seul le meilleur score de chaque cours compte.</p>
    ${ ouverts.length
      ? `<select id="sel-grand">${ouverts.map(co => {
          const f = ETAT.cours[co.id] || {};
          return `<option value="${esc(co.id)}">${tx(co.titre)} &#8212; ${ptsGrand(f.grand)}/${maxG} pts</option>`;
        }).join("")}</select>
        <div class="saut"></div>
        <button class="bouton" data-action="quiz-grand-choisi">Lancer le grand quiz</button>`
      : `<p class="minuscule" style="margin:0">Il s’ouvre dès qu’un cours est terminé&#8239;: les 6 QCM de séance passés.</p>` }
  </div>`);

  parts.push(filet("Giga quiz", "giga"));
  parts.push(`<div class="carte" id="carte-giga">
    <p class="secondaire">${GIGA_NB} questions mêlant ${GIGA_MIN} à ${GIGA_MAX} cours terminés, à parts
      égales&#8239;: ${PTS_GIGA} points par bonne réponse et ${PTS_GIGA_SANS_FAUTE} de plus pour un sans-faute,
      soit jusqu’à ${PTS_GIGA * GIGA_NB + PTS_GIGA_SANS_FAUTE} points. Chaque cours garde son meilleur
      résultat&#8239;: le rejouer ne rapporte que ce qui le dépasse.</p>
    ${ ouverts.length >= GIGA_MIN
      ? ouverts.map(co => {
          const f = ETAT.cours[co.id] || {};
          return `<label class="coche">
            <input type="checkbox" data-giga="${esc(co.id)}" ${GIGA.coches.indexOf(co.id) >= 0 ? "checked" : ""}>
            <span>${tx(co.titre)}<br><span class="minuscule">${f.giga
              ? ptsGiga(f.giga) + " pts déjà acquis en giga" : "jamais joué en giga"}</span></span>
          </label>`;
        }).join("") + `<div class="saut"></div>
        <button class="bouton-plein" data-action="quiz-giga">Lancer le giga quiz</button>
        <div id="avis-giga"></div>`
      : `<p class="minuscule" style="margin:0">Il s’ouvre dès que ${GIGA_MIN} cours sont terminés
          (${ouverts.length}/${GIGA_MIN}).</p>` }
  </div>`);
  return parts;
}

function rendreQuiz(){
  if(QUIZ && QUIZ.corrige) return rendreCorrection();
  if(QUIZ) return rendreQuizEnCours();
  if(BCARTES) return rendreCartesBrevet();
  if(BFRISE) return rendreFrise();
  if(modeBrevet()) return rendreMenuBrevet();
  return rendreMenuQuiz();
}

function rendreMenuQuiz(){
  const parts = [];
  const c = coursEnCours();

  parts.push(filet("QCM de séance", "seance"));
  if(c){
    const r = reprise(c);
    parts.push(`<div class="carte">
      <h3>${tx(c.titre)}</h3>
      <p class="secondaire">Le QCM d’une séance s’ouvre à la fin de sa lecture&#8239;: 5 questions de la séance,
      et 5 de la précédente en révision.</p>
      ${ r
        ? (r.mode === "qcm"
          ? `${avisRefaire(c.id, r.numero)}<button class="bouton-plein" data-action="quiz-seance" data-cours="${esc(c.id)}"
               data-seance="${r.numero}">${estFaite(c.id, r.numero) ? "Refaire le QCM" : "QCM"} de la séance ${r.numero}</button>`
          : `<button class="bouton" data-action="reprendre" data-cours="${esc(c.id)}"
               data-seance="${r.numero}">Lire la séance ${r.numero}</button>`)
        : coursAValider(c.id)
          ? `<p class="minuscule">Six QCM passés&#8239;: il reste l’épreuve finale pour valider le cours.</p>
             <button class="bouton-plein" data-action="quiz-epreuve" data-cours="${esc(c.id)}">Passer l’épreuve finale</button>`
          : `<p class="minuscule">Cours terminé.</p>` }
    </div>`);
  }

  /* Refaire un QCM de seance. D'abord ceux qui restent a reussir, un
     bouton chacun : c'est presque toujours celui que l'on cherche. Puis
     n'importe quel QCM deja ouvert, en deux gestes, le cours puis la
     seance, au lieu d'une liste de toutes les seances lues, qui
     s'allongeait de six lignes par cours. */
  const aRefaire = [];
  COURS.forEach(co => co.seances.forEach(x => {
    /* Celui que la carte du dessus propose deja n'est pas repete. */
    const enTete = c && co.id === c.id && reprise(c) && reprise(c).numero === x.numero;
    if(estFaite(co.id, x.numero) && !seanceReussie(co.id, x.numero) && !enTete) aRefaire.push({ co, x });
  }));
  if(aRefaire.length){
    parts.push(`<div class="carte a-valider"><h3>QCM à refaire</h3>
      <p class="secondaire" style="margin:0 0 8px">Il faut un sans-faute pour ouvrir la séance suivante.</p>
      ${aRefaire.map(({ co, x }) => { const i = infoSeance(co.id, x.numero); return `<button class="ligne refaire" data-action="quiz-seance"
        data-cours="${esc(co.id)}" data-seance="${x.numero}"><span class="num"><span>${x.numero}</span></span>
        <span class="corps"><span class="t">${tx(co.titre)}</span><span class="minuscule">Séance ${x.numero} &#8226; meilleur score ${
          i.qt ? i.qj + "/" + i.qt : i.justes + "/" + i.total}</span></span></button>`; }).join("")}
    </div>`);
  }
  const ouverts = COURS.filter(co => co.seances.some(x => estLue(co.id, x.numero)));
  if(ouverts.length){
    const choisi = ouverts.find(co => co.id === QCM_COURS) || (c && ouverts.find(co => co.id === c.id)) || ouverts[ouverts.length - 1];
    parts.push(`<div class="carte">
      <h3>Refaire un QCM de séance</h3>
      <select id="sel-qcm-cours" data-action="qcm-cours" aria-label="Cours">
        ${ouverts.map(co => `<option value="${esc(co.id)}"${co.id === choisi.id ? " selected" : ""}>${tx(co.titre)}</option>`).join("")}
      </select>
      <div class="qcm-seances" role="group" aria-label="Séance">
        ${choisi.seances.map(x => {
          const lue = estLue(choisi.id, x.numero), ok = seanceReussie(choisi.id, x.numero);
          return `<button class="qcm-num${ok ? " faite" : estFaite(choisi.id, x.numero) ? " refaire" : ""}" data-action="quiz-seance"
            data-cours="${esc(choisi.id)}" data-seance="${x.numero}"${lue ? "" : " disabled"}
            aria-label="QCM de la séance ${x.numero}">${ok ? "&#10003;" : ""}${x.numero}</button>`;
        }).join("")}
      </div>
      <p class="minuscule" style="margin:8px 0 0">Touchez le numéro de la séance. &#10003;&#8239;: réussi sans faute.</p>
    </div>`);
  }

  parts.push(...menuQuizBonus());

  parts.push(filet("Quiz composé", "compose"));
  parts.push(`<div class="carte avec-bulle">
    <span class="bulle bulle-gris">0 pt &#8226; pour le plaisir</span>
    <p class="secondaire">Cochez un ou plusieurs cours. Les questions sont tirées au hasard parmi ceux-ci,
    en remontant en priorité celles que vous avez déjà ratées.</p>
    <div class="rang-boutons" style="margin:0 0 10px">
      <button class="bouton petit discret" data-action="compose-tous">Tout cocher</button>
      <button class="bouton petit discret" data-action="compose-aucun">Tout décocher</button>
      <button class="bouton petit discret" data-action="compose-lus">Les cours commencés</button>
    </div>
    ${(() => {
      /* Les cours commences d'abord ; les autres, que l'on ne tire qu'avec
         << Inclure tout >>, sous un pli : la liste complete des 68 cours
         faisait de l'onglet Quiz une page de plusieurs metres. */
      const coche = co => COMPOSE.coches.indexOf(co.id) >= 0;
      const ligne = co => {
        const dispo = nbLues(co.id);
        return `<label class="coche">
        <input type="checkbox" data-compose="${esc(co.id)}" ${coche(co) ? "checked" : ""}>
        <span>${tx(co.titre)}<br><span class="minuscule">${dispo} séance${dispo > 1 ? "s" : ""} lue${dispo > 1 ? "s" : ""} &#8226; ${co.seances.length*5} questions au total</span></span>
      </label>`;
      };
      const vus = COURS.filter(co => nbLues(co.id) > 0 || coche(co));
      const autres = COURS.filter(co => vus.indexOf(co) < 0);
      return (vus.length ? vus.map(ligne).join("")
                         : `<p class="minuscule">Aucun cours commencé pour l’instant.</p>`) +
        (autres.length ? `<details class="compose-autres"><summary>Les cours jamais ouverts (${autres.length})</summary>
          ${autres.map(ligne).join("")}</details>` : "");
    })()}

    <div class="champ">
      <span class="txt"><strong>Nombre de questions</strong></span>
    </div>
    <select id="sel-nombre">
      <option value="10" ${COMPOSE.nombre === "10" ? "selected" : ""}>10 questions</option>
      <option value="20" ${COMPOSE.nombre === "20" ? "selected" : ""}>20 questions</option>
      <option value="toutes" ${COMPOSE.nombre === "toutes" ? "selected" : ""}>Toutes les questions</option>
    </select>

    <label class="coche" style="margin-top:10px">
      <input type="checkbox" id="compose-tout" ${COMPOSE.tout ? "checked" : ""}>
      <span>Inclure tout<br><span class="minuscule">Par défaut, seules les séances déjà lues sont tirées.</span></span>
    </label>

    <div class="saut"></div>
    <button class="bouton-plein" data-action="quiz-composer">Lancer le quiz</button>
    <div id="avis-compose"></div>
  </div>`);

  /* Historique. */
  const qcm = ETAT.historique.filter(x => x.total > 0);
  if(qcm.length){
    parts.push(filet("Historique"));
    const h = qcm.slice(-12).reverse();
    parts.push(`<div class="carte nue"><ul class="liste">` + h.map(x => {
      const nom = nomQuiz(x);
      const pc = x.total ? Math.round(100*x.justes/x.total) : 0;
      return `<li class="ligne${pc >= 80 ? " faite" : ""}" style="cursor:default">
        <span class="num"><span>${pc}</span></span>
        <span class="corps"><span class="t">${nom}</span>
        <span class="minuscule">${x.justes}/${x.total} &#8226; ${dateLisible(x.d)}</span></span></li>`;
    }).join("") + `</ul></div>`);
  }

  document.getElementById("vue-quiz").innerHTML = parts.join("");
}

/* ---------- 4.8  Navigation, defilement et evenements ---------- */

let ONGLET = "accueil";

/* Le cours dont l'ecran courant reclame le contenu, ou null. Seule la
   lecture en a besoin : le catalogue, la fiche et le menu des quiz se
   contentent du catalogue. */
function coursRequis(){
  return (ONGLET === "cours" && ECRAN.nom === "lecture") ? (ECRAN.coursId || null) : null;
}

/* Attend que les cours demandes soient la, puis execute la suite. Quand
   tout est deja charge -- le cas ordinaire -- rien n'est differe : le
   comportement reste celui d'avant le decoupage. */
function avecLesCours(ids, suite, echec){
  const manquants = ids.filter(id => !EPOK.estCharge(id));
  if(!manquants.length){ suite(); return; }
  EPOK.chargerTous(manquants).then(perdus => {
    if(perdus.length && echec) echec(perdus);
    else if(!perdus.length) suite();
  });
}

function rendre(){
  /* Premier lancement : rien d'autre tant que le mode n'est pas choisi. */
  if(!ETAT.reglages.mode){ afficherChoixMode(); return; }
  cacherChoixMode();
  /* Juste apres le choix du mode : creer un compte ou se connecter. */
  if(doitProposerCompte()) afficherEcranCompte();
  document.body.dataset.onglet = ONGLET;   /* pilote l'en-tete compact */
  document.body.dataset.mode = ETAT.reglages.mode;
  const sous = document.querySelector(".entete .sous");
  /* Deux lignes courtes : elles tiennent entre la marque et l'insigne,
     centres a cote d'elles. */
  if(sous) sous.innerHTML = modeBrevet() ? "Révisions du brevet<br>histoire-géographie de 3e"
                                         : "Culture historique<br>une séance par jour";
  /* Le filet de defilement n'a de sens que pendant la lecture d'une seance. */
  document.body.dataset.lecture =
    (ONGLET === "cours" && ECRAN.nom === "lecture") ? "1" : "0";

  /* Un ecran de lecture ouvert sur un cours pas encore charge lance son
     chargement et se redessine a l'arrivee. Ce point unique couvre toutes
     les entrees : un clic, le bouton Retour du telephone, ou la reprise de
     la derniere seance a l'ouverture de l'application. */
  const requis = coursRequis();
  if(requis && !EPOK.estCharge(requis) && !EPOK.estPerdu(requis)){
    EPOK.charger(requis).then(() => { if(coursRequis() === requis) rendre(); });
  }

  if(ONGLET === "accueil") rendreAccueil();
  else if(ONGLET === "cours") rendreCours();
  else if(ONGLET === "reglages") rendreReglages();
  else if(ONGLET === "cartes") rendreCartes();
  else rendreQuiz();

  /* Pastille de rappel sur l'accueil : rien n'a encore ete lu aujourd'hui. */
  /* En mode Brevet, la pastille dit qu'il reste des cartes a revoir. */
  const rienAujourdhui = modeBrevet() ? cartesDues().length > 0 : dateDerniereSeance() !== aujourdhui();
  const ongletAllume = ONGLET;
  document.querySelectorAll(".onglets button").forEach(b => {
    if(b.dataset.onglet === ongletAllume) b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
    const point = b.querySelector(".point");
    /* Sur Cartes : le pli du jour attend d'etre ouvert. */
    const voulu = (b.dataset.onglet === "accueil" && rienAujourdhui && ongletAllume !== "accueil")
      || (b.dataset.onglet === "cartes" && ongletAllume !== "cartes" && typeof pliOuvert === "function" && CARTES.length && !pliOuvert());
    if(voulu && !point){
      const p = document.createElement("span");
      p.className = "point"; p.setAttribute("aria-hidden","true");
      b.appendChild(p);
    }else if(!voulu && point){ point.remove(); }
  });

  document.querySelectorAll(".vue").forEach(v => v.classList.remove("active"));
  const vueActive = document.getElementById("vue-" + ONGLET);
  vueActive.classList.add("active");
  typoEcran(vueActive);
  /* La cesure se pose apres coup, sur le rendu : un seul endroit pour
     tous les ecrans, et le texte stocke reste indemne de tirets. */
  CESURE.poser(vueActive);
  /* Quitter la séance écoutée arrête la voix : sans cela elle continuerait
     de dire un texte que l'on a cessé d'avoir sous les yeux. */
  VOIX.verifierEcran();
  majDefilement();
  majInsigne();
  /* Premiere entree : la visite guidee (z0i_tuto.js). */
  lancerTutoSiBesoin();
}

function aller(onglet, haut){
  ONGLET = onglet;
  rendre();
  inscrireNav();
  if(haut !== false) window.scrollTo(0,0);
}

/* --- Figures agrandies -------------------------------------------------
   Sur un telephone, une carte ou une frise tient dans 330 px : ses
   libelles y font sept ou huit pixels, et l'application Android ne permet
   pas de zoomer. Un appui ouvre la figure en plein ecran, deux ou trois
   fois plus large, et on la parcourt du doigt. La figure s'inscrit dans
   l'historique : le bouton Retour du telephone la referme, sans quitter
   la seance ni perdre l'endroit ou l'on en etait. */
const ZOOM_FIGURE_MAX = 3;
function ouvrirFigure(fig){
  const svg = fig && fig.querySelector("svg");
  if(!svg || document.getElementById("figure-zoom")) return;
  const legende = fig.querySelector("figcaption");
  const voile = document.createElement("div");
  voile.id = "figure-zoom";
  voile.setAttribute("role", "dialog");
  voile.setAttribute("aria-modal", "true");
  voile.setAttribute("aria-label", "Figure agrandie");
  voile.innerHTML = `<div class="fz-barre">
      <button class="bouton petit discret carre" data-action="figure-zoom" data-pas="-1" aria-label="Réduire">&#8722;</button>
      <button class="bouton petit discret carre" data-action="figure-zoom" data-pas="1" aria-label="Agrandir">+</button>
      <span class="fz-aide">Faites glisser pour parcourir</span>
      <button class="bouton-plein petit" data-action="figure-fermer">Fermer</button></div>
    <div class="fz-zone"><div class="fz-contenu"></div></div>
    ${legende ? `<div class="fz-legende">${legende.innerHTML}</div>` : ""}`;
  voile.querySelector(".fz-contenu").appendChild(svg.cloneNode(true));
  document.body.appendChild(voile);
  zoomFigure(voile, 2);
  try{ history.pushState({ epok:2 }, ""); }catch(e){}
  voile.querySelector('[data-action="figure-fermer"]').focus({ preventScroll:true });
}
function zoomFigure(voile, z){
  z = Math.min(ZOOM_FIGURE_MAX, Math.max(1, z));
  voile.dataset.zoom = String(z);
  voile.querySelector(".fz-contenu").style.width = (z * 100) + "%";
  voile.querySelectorAll('[data-action="figure-zoom"]').forEach(b => {
    b.disabled = (b.dataset.pas === "-1" && z === 1) || (b.dataset.pas === "1" && z === ZOOM_FIGURE_MAX);
  });
}
/* Renvoie vrai si une figure etait ouverte. */
function fermerFigure(){
  const v = document.getElementById("figure-zoom");
  if(!v) return false;
  v.remove();
  return true;
}
/* Fermer par le bouton : on remonte l'historique, et c'est popstate qui
   retire la figure, comme pour le bouton Retour du telephone. */
if(typeof document !== "undefined")
  document.addEventListener("keydown", ev => { if(ev.key === "Escape" && document.getElementById("figure-zoom")) quitterFigure(); });
function quitterFigure(){
  if(history.state && history.state.epok === 2) history.back();
  else fermerFigure();
}

/* Sous le bouton d'un QCM a refaire : le meilleur score atteint et ce qu'il
   faut pour passer. Rien pour un QCM jamais passe. */
function avisRefaire(coursId, numero){
  const s = infoSeance(coursId, numero);
  if(!s || typeof s.justes !== "number") return "";
  const t = s.qt || (numero > 1 ? 10 : 5);
  return `<p class="minuscule" style="margin:0 0 8px;flex:1 1 100%">Meilleur score&#8239;: ${s.qj !== undefined ? s.qj : s.justes}/${t}
    &#8226; il faut ${t}/${t} pour ouvrir la séance suivante.</p>`;
}

/* Ouvre la lecture d'une seance depuis n'importe quel onglet. */
function ouvrirSeance(coursId, numero){
  ECRAN = { nom:"lecture", coursId, seance:Number(numero) };
  aller("cours");
}

/* --- Defilement : filet de progression, bouton de retour en haut, et
   bascule automatique en << lue >> ------------------------------------
   Une seance n'est marquee lue que lorsque son repere de fin entre dans
   l'ecran. Marquer a l'ouverture compterait comme lue une seance
   seulement entrevue, et le compte des seances non lues perdrait tout
   son sens. */
function majDefilement(){
  const y = window.scrollY || document.documentElement.scrollTop || 0;
  document.body.dataset.haut = y > 600 ? "1" : "0";

  if(ONGLET !== "cours" || ECRAN.nom !== "lecture") return;

  const art = document.querySelector(".lecture");
  const jaugeEl = document.getElementById("jauge-lecture");
  if(art && jaugeEl){
    const haut = art.getBoundingClientRect().top + y;
    const vu = Math.min(Math.max(y + window.innerHeight - haut, 0), art.offsetHeight);
    const pc = art.offsetHeight ? Math.round(100 * vu / art.offsetHeight) : 0;
    jaugeEl.style.width = pc + "%";
  }

  const repere = document.getElementById("fin-lecture");
  if(repere && repere.getBoundingClientRect().top < window.innerHeight){
    if(marquerLue(ECRAN.coursId, ECRAN.seance)){
      const b = document.querySelector('[data-action="marquer-lue"]');
      if(b) b.outerHTML = `<p class="minuscule" style="margin:10px 0 0">
        &#10003; Séance marquée comme lue.</p>`;
    }
  }
}

/* ---------- Bouton Retour du telephone ----------
   Epok tient dans une seule page : sans rien faire, le bouton Retour
   quitterait l'application d'un coup, depuis n'importe quel ecran. On
   inscrit donc chaque navigation dans l'historique du navigateur.
   Retour ramene alors a l'ecran precedent, et seulement depuis
   l'accueil -- la premiere entree -- il sort de l'application.
   Un quiz en cours n'est jamais inscrit : il ne peut pas etre
   reconstitue depuis l'historique, et revenir en arriere pendant un
   quiz, c'est le quitter. */

let enRetour = false;          /* vrai pendant le traitement d'un retour */

function etatNav(){
  return { epok:1, onglet:ONGLET, nom:ECRAN.nom,
           coursId:ECRAN.coursId || null, seance:ECRAN.seance || null };
}

function memeEcran(a, b){
  return !!a && a.epok === 1 && a.onglet === b.onglet && a.nom === b.nom
         && a.coursId === b.coursId && a.seance === b.seance;
}

/* Inscrit l'ecran courant, sauf s'il est deja la derniere entree : sans
   ce garde-fou, revenir deux fois au meme ecran empilerait des doublons,
   et il faudrait autant d'appuis sur Retour pour les defaire. */
function inscrireNav(){
  if(enRetour) return;
  try{
    const e = etatNav();
    if(memeEcran(history.state, e)) return;
    history.pushState(e, "");
  }catch(err){ /* historique indisponible : la navigation marche quand meme */ }
}

if(typeof window !== "undefined" && window.addEventListener){
  window.addEventListener("popstate", function(ev){
    if(fermerFigure()) return;   /* le Retour referme d'abord une figure agrandie */
    if(!ev.state || ev.state.epok !== 1) return;   /* entree etrangere */
    enRetour = true;
    QUIZ = null;
    ONGLET = ev.state.onglet;
    ECRAN = { nom:ev.state.nom, coursId:ev.state.coursId, seance:ev.state.seance };
    rendre();
    window.scrollTo(0,0);
    enRetour = false;
  });
  window.addEventListener("scroll", majDefilement, { passive:true });
  window.addEventListener("resize", majDefilement, { passive:true });
}

document.addEventListener("click", function(ev){
  const el = ev.target.closest("[data-action]");
  if(!el) return;
  const a = el.dataset.action;
  if(actionAide(a, el) || actionTuto(a) || actionBrevet(a, el) || actionCompte(a, el) || actionQuizJour(a, el) || actionSanction(a) || actionCartes(a, el)) return;

  /* -- Navigation generale -- */
  if(a === "onglet"){ if(el.dataset.onglet === "cours") ECRAN = {nom:"catalogue"}; aller(el.dataset.onglet); }

  /* -- Navigation dans les cours -- */
  else if(a === "catalogue"){ ECRAN = {nom:"catalogue"}; aller("cours"); }
  else if(a === "tout-plier"){
    if(el.dataset.tous === "1"){ OUVERTS.clear(); }
    else{
      const champ = CLASSEMENT === "periode" ? "periode" : "theme";
      coursAffiches().forEach(c => OUVERTS.add(c[champ]));
    }
    rendreResultats();
  }
  else if(a === "plier"){
    const g = el.dataset.groupe;
    if(OUVERTS.has(g)) OUVERTS.delete(g); else OUVERTS.add(g);
    /* Seuls les resultats se redessinent : la barre de tri ne bouge
       pas, et la page ne saute pas sous le doigt. */
    rendreResultats();
  }
  else if(a === "avancement"){ /* liste déroulante : voir l’écouteur de change */ }
  else if(a === "vider-recherche"){ RECHERCHE = ""; rendreCours(); }
  else if(a === "hasard"){
    const tire = tirerCours();
    if(!tire){
      const z = document.getElementById("avis-hasard");
      if(z) z.innerHTML = `<div class="avis" style="margin:0 0 14px">` + (HASARD_NEUF
        ? `Tous les cours affichés sont déjà commencés. Choisissez « tous »,
           ou élargissez la recherche.`
        : `Aucun cours à tirer ici. Élargissez la recherche.`) + `</div>`;
      return;
    }
    ECRAN = { nom:"fiche", coursId:tire.id };
    aller("cours");
  }
  else if(a === "hasard-portee"){
    HASARD_NEUF = el.dataset.neuf === "1";
    ETAT.reglages.hasardNeuf = HASARD_NEUF;
    sauverEtat();
    rendreCours();
  }
  else if(a === "classement"){
    CLASSEMENT = el.dataset.classement;
    ETAT.reglages.classement = CLASSEMENT;
    sauverEtat();
    rendreCours();
  }
  else if(a === "fiche"){ ECRAN = {nom:"fiche", coursId:el.dataset.cours}; aller("cours"); }
  else if(a === "lire" || a === "reprendre"){ ouvrirSeance(el.dataset.cours, el.dataset.seance); }
  else if(a === "marquer-lue"){
    marquerLue(el.dataset.cours, Number(el.dataset.seance));
    rendreCours();
  }

  /* -- Lecture a voix haute -- */
  else if(a === "voix"){ VOIX.basculer(); }
  else if(a === "voix-stop"){ VOIX.arreter(); }
  else if(a === "voix-pause"){ VOIX.basculerPause(); }
  else if(a === "voix-saut"){ VOIX.sauter(Number(el.dataset.delta)); }
  else if(a === "voix-reculer"){ VOIX.reculer(); }
  else if(a === "voix-avancer"){ VOIX.avancer(); }
  else if(a === "voix-vitesse"){ VOIX.changerVitesse(); }
  else if(a === "vitesse-voix"){
    ETAT.reglages.vitesseVoix = Number(el.dataset.vitesse);
    sauverEtat();
    if(VOIX.actif) VOIX.relancer();
    rendre();  /* l'ecran ou l'on est : les reglages, le plus souvent */
  }
  else if(a === "voix-essai"){
    const z = document.getElementById("avis-essai-voix");
    if(z) z.innerHTML = VOIX.essayer()
      ? `<p class="minuscule" style="margin:8px 0 0">La voix dit une phrase d’essai.</p>`
      : `<div class="avis" style="margin:8px 0 0">Aucune voix n’est disponible sur cet
         appareil. Sur Android, elle s’installe par Réglages &#8250; Général &#8250;
         Synthèse vocale.</div>`;
  }

  /* -- Quiz -- */
  else if(a === "quiz-seance"){
    const cid = el.dataset.cours, num = Number(el.dataset.seance);
    avecLesCours([cid], () => { QUIZ = construireQuizSeance(cid, num); aller("quiz"); },
                 () => avisQuizPerdu([cid]));
  }
  else if(a === "figure-agrandir") ouvrirFigure(el.closest("figure"));
  else if(a === "figure-zoom"){
    const v = document.getElementById("figure-zoom");
    if(v) zoomFigure(v, Number(v.dataset.zoom) + Number(el.dataset.pas));
  }
  else if(a === "figure-fermer") quitterFigure();
  else if(a === "voir-rang") ouvrirRangs();
  else if(a === "rangs-fermer") fermerRangs();
  else if(a === "quiz-epreuve"){
    const cid = el.dataset.cours;
    avecLesCours([cid], () => { QUIZ = construireQuizEpreuve(cid); aller("quiz"); },
                 () => avisQuizPerdu([cid]));
  }
  else if(a === "quiz-grand" || a === "quiz-grand-choisi"){
    const cid = a === "quiz-grand" ? el.dataset.cours : document.getElementById("sel-grand").value;
    if(!quizBonusOuvert(cid)) return;
    avecLesCours([cid], () => { QUIZ = construireQuizGrand(cid); aller("quiz"); },
                 () => avisQuizPerdu([cid]));
  }
  else if(a === "giga-vers"){
    /* Depuis l'accueil : le cours est coche d'avance, reste a choisir les autres. */
    const id = el.dataset.cours;
    if(GIGA.coches.indexOf(id) < 0) GIGA.coches.push(id);
    QUIZ = null;
    aller("quiz");
    const g = document.getElementById("carte-giga");
    if(g) g.scrollIntoView({ block:"start" });
  }
  else if(a === "quiz-giga"){
    const ids = GIGA.coches.filter(quizBonusOuvert);
    if(ids.length < GIGA_MIN || ids.length > GIGA_MAX){
      document.getElementById("avis-giga").innerHTML = `<div class="avis">Cochez de ${GIGA_MIN} à ${GIGA_MAX}
        cours (${ids.length} coché${ids.length > 1 ? "s" : ""}).</div>`;
      return;
    }
    avecLesCours(ids, () => { QUIZ = construireQuizGiga(ids); aller("quiz"); },
                 perdus => avisQuizPerdu(perdus));
  }
  else if(a === "quiz-seance-choisie"){
    const v = document.getElementById("sel-seance").value.split("|");
    avecLesCours([v[0]], () => { QUIZ = construireQuizSeance(v[0], Number(v[1])); aller("quiz"); },
                 () => avisQuizPerdu([v[0]]));
  }
  else if(a === "compose-tous"){ COMPOSE.coches = COURS.map(c => c.id); rendreQuiz(); }
  else if(a === "compose-aucun"){ COMPOSE.coches = []; rendreQuiz(); }
  else if(a === "compose-lus"){
    COMPOSE.coches = COURS.filter(c => coursCommence(c.id)).map(c => c.id);
    rendreQuiz();
  }
  else if(a === "quiz-composer"){
    const nombre = document.getElementById("sel-nombre").value;
    const tout = document.getElementById("compose-tout").checked;
    COMPOSE.nombre = nombre; COMPOSE.tout = tout;
    if(!COMPOSE.coches.length){
      document.getElementById("avis-compose").innerHTML =
        `<div class="avis">Cochez au moins un cours.</div>`;
      return;
    }
    avecLesCours(COMPOSE.coches.slice(), () => {
      const q = construireQuizCompose(COMPOSE.coches, nombre, tout);
      if(!q){
