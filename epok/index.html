function qjRemplirOnglet(){
  const zone = document.getElementById("qj-classement");
  if(!zone || !QJ) return;
  if(QJ.onglet === "hier") return qjCorrigeHier(zone);
  if(QJ.onglet === "historique") return qjHistorique(zone);
  if(!compteConnecte()){ zone.innerHTML = `<p class="minuscule">Connectez-vous pour voir les classements.</p>`; return; }
  const jour = QJ.onglet === "jour";
  /* Classement d'un jour passe : choisi par son numero dans le menu. */
  const dateVue = jour && QJ.jourVu ? QJ.jourVu : QJ.date;
  const cle = jour ? "jour/" + dateVue : "semaine/" + qjLundi(QJ.date);
  const e = (ETAT.quotidien || {})[dateVue] || null;
  const jours = Object.keys(ETAT.quotidien || {}).filter(d => ETAT.quotidien[d].fini && qjLundi(d) === qjLundi(QJ.date));
  const ptsSem = jours.reduce((t, d) => t + QJ_PTS * ETAT.quotidien[d].justes, 0);
  const tpsSem = jours.reduce((t, d) => t + ETAT.quotidien[d].temps, 0);
  const monScore = jour ? (e && e.fini ? e.justes * 1000 + (999 - e.temps) : null) : (jours.length ? ptsSem * 10000 + (9999 - tpsSem) : null);
  const choix = jour ? qjMenuJours(dateVue) : "";
  zone.innerHTML = choix + `<p class="minuscule">Chargement du classement…</p>`;
  qjBrancherMenu();
  chargerClassementQJ(cle, qjPeutPublier() ? monScore : null).then(r => {
    if(!QJ || !document.getElementById("qj-classement")) return;
    if(jour && (QJ.jourVu || QJ.date) !== dateVue) return;   // un autre jour a ete choisi entre-temps
    if(!r || r.erreur){ zone.innerHTML = choix + `<p class="minuscule">${esc(r ? (estProf() ? r.erreur : "Classement indisponible pour l’instant.") : "")}</p>`; qjBrancherMenu(); return; }
    const moi = COMPTE.user.uid;
    const paliers = QJ.paliers || {};
    paliers[moi] = rangActuel().i;
    const lignes = r.liste.map((x, i) => `<li${x.uid === moi ? ` class="moi"` : ""}><span class="st-num">${i + 1}</span>
      <span class="st-nom"><strong>${esc(x.nom)}${x.uid === moi ? " (vous)" : ""}</strong><small>${jour
        ? Math.floor(x.temps / 60) + " min " + String(x.temps % 60).padStart(2, "0")
        : x.jours + " jour" + (x.jours > 1 ? "s" : "") + " joué" + (x.jours > 1 ? "s" : "")}</small></span>
      <span class="qj-badge" data-uid="${esc(x.uid)}">${badgeClassement(paliers[x.uid])}</span><span class="st-pts">${jour ? x.justes + "/" + QJ_NB : x.points + " pts"}</span></li>`).join("");
    const moiDedans = r.liste.some(x => x.uid === moi);
    if(r.devant !== null && monScore !== null) qjNoterRang(jour, dateVue, r.devant + 1, Math.max(r.total, r.devant + 1), ptsSem);
    zone.innerHTML = choix + (lignes ? `<ol class="st-classement qj-liste">${lignes}</ol>` : `<p class="secondaire">Personne n’est ${jour && dateVue !== aujourdhui() ? "classé ce jour-là" : "encore classé " + (jour ? "aujourd’hui" : "cette semaine")}.</p>`)
      + (r.devant !== null && !moiDedans && monScore !== null ? `<p class="minuscule"><strong>Vous&#8239;: ${r.devant + 1}<sup>e</sup></strong> sur ${Math.max(r.total, r.devant + 1)}</p>` : "")
      + `<p class="minuscule">${jour ? "À score égal, le plus rapide passe devant." : "La semaine va du lundi au dimanche, minuit."}</p>`;
    qjBrancherMenu();
    /* Les badges des autres joueurs arrivent ensuite, sans retarder la liste. */
    const manquants = r.liste.map(x => x.uid).filter(u => !(u in paliers));
    if(manquants.length) paliersDe(manquants).then(p => {
      if(!QJ) return;
      QJ.paliers = Object.assign(QJ.paliers || {}, p);
      Object.keys(p).forEach(u => document.querySelectorAll("#qj-classement .qj-badge").forEach(el => {
        if(el.dataset.uid === u) el.innerHTML = badgeClassement(p[u]);
      }));
    });
  });
}

/* Menu des quiz passes, du plus recent au #1. */
function qjMenuJours(dateVue){
  const auj = aujourdhui(), l = [];
  const d = new Date(auj + "T12:00:00");
  for(let k = 0; k < 400; k++){
    const j = iso(d), n = qjNumero(j);
    if(!n) break;
    l.push(`<option value="${j}"${j === dateVue ? " selected" : ""}>${QJ_NOM} #${n} &#8226; ${
      j === auj ? "aujourd’hui" : new Date(j + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" })}${
      (ETAT.quotidien || {})[j] && ETAT.quotidien[j].fini ? " &#10003;" : ""}</option>`);
    d.setDate(d.getDate() - 1);
  }
  return l.length > 1 ? `<label class="qj-choix"><span class="minuscule">Voir le classement du</span>
    <select id="qj-jour-choix">${l.join("")}</select></label>` : "";
}
function qjBrancherMenu(){
  const s = document.getElementById("qj-jour-choix");
  if(s) s.onchange = () => { if(!QJ) return; QJ.jourVu = s.value === aujourdhui() ? null : s.value; qjRemplirOnglet(); };
}

/* Le corrige d'hier : les dix questions, la bonne reponse, et la sienne. */
function qjCorrigeHier(zone){
  const hier = qjHier(), e = (ETAT.quotidien || {})[hier];
  zone.innerHTML = `<p class="minuscule">Chargement du corrigé…</p>`;
  qjQuestions(hier).then(items => {
    if(!QJ || QJ.onglet !== "hier") return;
    zone.innerHTML = `<p class="minuscule">${e ? "Votre score d’hier&#8239;: " + e.justes + "/" + QJ_NB + "." : "Vous n’avez pas joué hier."}</p>` +
      items.map((it, i) => {
        const vos = e && e.choix && e.choix[i];
        const bien = !!vos && qjJuste(it, vos);
        return `<div class="corr qj-corr${bien ? " ok" : ""}"><p class="enonce"><strong>${i + 1}. ${tx(it.q.enonce)}</strong></p>
          <p class="minuscule" style="margin:0 0 6px">${tx(it.titre)}</p>
          <p class="ligne-rep"><b>Bonne réponse</b>${it.q.correctes.map(k => `<span class="rep juste">${tx(it.q.options[k])}</span>`).join("")}</p>
          ${vos ? `<p class="ligne-rep"><b>Votre réponse</b>${vos.length
            ? vos.map(k => `<span class="rep ${it.q.correctes.indexOf(k) >= 0 ? "juste" : "faux"}">${tx(it.q.options[k])}</span>`).join("")
            : `<span class="rep faux">aucune (temps écoulé ou quiz arrêté)</span>`}</p>` : ""}
          ${it.q.explication ? `<p class="expl">${tx(it.q.explication)}</p>` : ""}</div>`;
      }).join("");
  });
}

/* ---------- Le deroulement ---------- */

function qjCommencer(){
  if(!QJ || qjAujourdhui()) return qjAfficher();
  QJ.prepare = true; qjAfficher();
  qjQuestions(QJ.date).then(items => {
    if(!QJ) return;
    QJ.prepare = false;
    if(items.length < QJ_NB){ QJ.raison = "Le quiz n’a pas pu être préparé\u202f: certains cours sont introuvables."; QJ.vue = "classement"; return qjAfficher(); }
    QJ.items = items; QJ.i = 0; QJ.choix = []; QJ.temps = [];
    /* Commence pour de bon : enregistre tout de suite. */
    ETAT.quotidien = ETAT.quotidien || {};
    ETAT.quotidien[QJ.date] = { justes: 0, temps: 0, fini: false, choix: [], envoye: false };
    sauverEtat();
    qjProteger(true);
    QJ.vue = "question";
    qjQuestionSuivante();
  });
}

function qjProteger(oui){
  try{ if(window.PontEpok && PontEpok.ecranProtege) PontEpok.ecranProtege(!!oui); }catch(e){}
  document.body.classList.toggle("qj-actif", !!oui);
}

function qjQuestionSuivante(){
  clearInterval(QJ.minuteur);
  QJ.vue = "question";
  QJ.debutQ = Date.now();
  /* La question affichee est notee : si l'application est fermee pendant
     qu'elle est a l'ecran, elle sera comptee fausse a la reprise. */
  const e = ETAT.quotidien[QJ.date];
  if(e){ e.enCours = QJ.i; sauverEtat(); }
  qjAfficherQuestion();
  QJ.minuteur = setInterval(qjTic, 200);
}
function qjTic(){
  if(!QJ || QJ.vue !== "question") return;
  const reste = QJ_SECONDES - (Date.now() - QJ.debutQ) / 1000;
  const barre = document.querySelector("#quiz-jour .qj-barre i"), n = document.querySelector("#quiz-jour .qj-sec");
  if(barre) barre.style.width = Math.max(0, reste / QJ_SECONDES * 100) + "%";
  if(n) n.textContent = Math.max(0, Math.ceil(reste));
  if(reste <= 0) qjRepondre(null);
}
function qjAfficherQuestion(){
  const it = QJ.items[QJ.i];
  qjEcran().innerHTML = `<div class="qj-boite qj-question">
    <div class="qj-tete"><span>${qjNumero(QJ.date) ? "#" + qjNumero(QJ.date) + " &#8226; " : ""}Question ${QJ.i + 1} / ${QJ_NB}</span><span class="qj-sec">${QJ_SECONDES}</span></div>
    <div class="qj-barre"><i style="width:100%"></i></div>
    <p class="minuscule" style="margin:10px 0 4px">${tx(it.titre)}</p>
    <h3>${tx(it.q.enonce)}</h3>
    <p class="consigne">${it.banque ? "Une seule réponse" : "Une ou plusieurs réponses"}</p>
    ${it.ordre.map(o => `<label class="option"><input type="${it.banque ? "radio" : "checkbox"}" name="qj" data-qj="${o}"><span>${tx(it.q.options[o])}</span></label>`).join("")}
    <button class="bouton-plein" data-action="qj-valider" style="margin-top:12px">Valider</button>
  </div>`;
}
/* choix : les options cochees, ou null quand le temps est ecoule. */
function qjRepondre(choix){
  if(!QJ || QJ.vue !== "question") return;
  clearInterval(QJ.minuteur);
  QJ.choix[QJ.i] = choix === null ? [] : choix;
  QJ.temps[QJ.i] = Math.min(QJ_SECONDES, Math.round((Date.now() - QJ.debutQ) / 1000));
  QJ.i++;
  qjEnregistrer(false);
  if(QJ.i >= QJ_NB) return qjFinir();
  qjQuestionSuivante();
}
function qjJuste(it, choix){
  const a = (choix || []).slice().sort().join(), b = it.q.correctes.slice().sort().join();
  return !!choix && choix.length > 0 && a === b;
}
function qjEnregistrer(fini){
  const justes = QJ.items.reduce((t, it, i) => t + (qjJuste(it, QJ.choix[i]) ? 1 : 0), 0);
  const temps = QJ.temps.reduce((t, x) => t + (x || 0), 0) + (fini ? (QJ_NB - QJ.temps.length) * QJ_SECONDES : 0);
  ETAT.quotidien[QJ.date] = { justes, temps: Math.min(QJ_NB * QJ_SECONDES, temps), fini, choix: QJ.choix.slice(), envoye: false };
  sauverEtat();
}
function qjFinir(raison){
  clearInterval(QJ.minuteur);
  qjProteger(false);
  qjEnregistrer(true);
  QJ.vue = "classement"; QJ.onglet = "jour"; QJ.raison = raison || null;
  publierQuotidien().then(() => { if(QJ && QJ.vue === "classement" && QJ.onglet === "jour") qjRemplirOnglet(); });
  qjAfficher();
  majInsigne();
}
/* Systeme anti-triche : quitter pendant une question la compte fausse,
   comme si le chrono tombait a zero. Le quiz attend ensuite, sur un ecran
   de pause, que l'on demande la question suivante. */
function qjSuspendre(raison){
  if(!QJ || QJ.vue !== "question") return;
  clearInterval(QJ.minuteur);
  QJ.choix[QJ.i] = [];
  QJ.temps[QJ.i] = QJ_SECONDES;
  QJ.i++;
  qjEnregistrer(false);
  if(QJ.i >= QJ_NB) return qjFinir("Système anti-triche\u202f: vous avez quitté l’application pendant la dernière question, elle est comptée fausse.");
  QJ.vue = "pause";
  QJ.raison = raison || "Vous avez quitté l’application ou la fenêtre pendant une question.";
  qjAfficher();
}
/* Reprendre le quiz du jour commence plus tot (ecran ferme, application
   relancee). Une question qui etait a l'ecran au depart compte fausse. */
function qjReprendre(){
  const e = qjAujourdhui();
  if(!e || e.fini) return qjOuvrir();
  QJ = { date: aujourdhui(), vue: "intro", onglet: "jour", items: null, prepare: true };
  qjAfficher();
  qjQuestions(QJ.date).then(items => {
    if(!QJ) return;
    QJ.prepare = false;
    if(items.length < QJ_NB){ QJ.raison = "Le quiz n’a pas pu être préparé."; QJ.vue = "classement"; return qjAfficher(); }
    QJ.items = items;
    QJ.choix = (e.choix || []).slice(0, QJ_NB).map(c => c || []);
    QJ.i = QJ.choix.length;
    QJ.temps = QJ.choix.map(() => 0);
    if(QJ.temps.length) QJ.temps[0] = e.temps || 0;
    qjProteger(true);
    if(e.enCours === QJ.i){
      QJ.vue = "question";
      return qjSuspendre("La question en cours quand vous avez quitté l’application ne peut pas être rejouée.");
    }
    if(QJ.i >= QJ_NB) return qjFinir();
    QJ.vue = "pause"; QJ.raison = null;
    qjAfficher();
  });
}

/* Note sa place du jour ou de la semaine. Elle devient definitive une fois
   le jour (ou la semaine) passe : on ne la relit plus. */
function qjNoterRang(jour, date, rang, classes, points){
  const auj = aujourdhui();
  if(jour){
    const e = (ETAT.quotidien || {})[date];
    if(!e || !e.fini || (e.rangFinal && e.rang)) return;
    if(e.rang === rang && e.classes === classes && e.rangFinal === (date < auj)) return;
    e.rang = rang; e.classes = classes; e.rangFinal = date < auj;
  } else {
    const l = qjLundi(date), w = ETAT.qjSemaines = ETAT.qjSemaines || {};
    if(w[l] && w[l].final) return;
    const fin = l < qjLundi(auj);
    if(w[l] && w[l].rang === rang && w[l].classes === classes && w[l].final === fin) return;
    w[l] = { rang, classes, points: points || 0, final: fin };
  }
  sauverEtat();
}
/* Les places pas encore definitives (jour en cours, ou jour passe jamais
   relu), lues au serveur : au plus quatorze requetes par ouverture. */
function qjMajRangs(){
  if(!qjPeutPublier()) return Promise.resolve(false);
  const auj = aujourdhui(), lundi = qjLundi(auj), taches = [];
  Object.keys(ETAT.quotidien || {}).sort().reverse().forEach(d => {
    const e = ETAT.quotidien[d];
    if(!e.fini || !e.envoye || e.rangFinal) return;
    taches.push(() => chargerClassementQJ("jour/" + d, e.justes * 1000 + (999 - e.temps))
      .then(r => { if(r && !r.erreur && r.devant !== null) qjNoterRang(true, d, r.devant + 1, Math.max(r.total, r.devant + 1)); }));
  });
  const semaines = {};
  Object.keys(ETAT.quotidien || {}).forEach(d => { const e = ETAT.quotidien[d]; if(e.fini) (semaines[qjLundi(d)] = semaines[qjLundi(d)] || []).push(e); });
  Object.keys(semaines).sort().reverse().forEach(l => {
    const w = (ETAT.qjSemaines || {})[l];
    if(w && w.final) return;
    if(!semaines[l].some(e => e.envoye)) return;   // semaine jamais publiee : rien a relire
    const pts = semaines[l].reduce((t, e) => t + QJ_PTS * e.justes, 0), tps = semaines[l].reduce((t, e) => t + e.temps, 0);
    taches.push(() => chargerClassementQJ("semaine/" + l, pts * 10000 + (9999 - tps))
      .then(r => { if(r && !r.erreur && r.devant !== null) qjNoterRang(false, l, r.devant + 1, Math.max(r.total, r.devant + 1), pts); }));
  });
  return Promise.all(taches.slice(0, 14).map(t => t())).then(() => true, () => false);
}
/* Relue a chaque synchronisation, au plus toutes les dix minutes : c'est
   ce qui rend definitives les places des jours et semaines passes, donc
   les bonus du premier, sans ouvrir l'historique. */
let QJ_RANGS_LUS = 0;
function qjMajRangsDiscret(){
  if(Date.now() - QJ_RANGS_LUS < 10 * 60 * 1000) return;
  QJ_RANGS_LUS = Date.now();
  qjMajRangs();
}
function qjHistorique(zone){
  const dessiner = () => {
    if(!QJ || QJ.onglet !== "historique" || !document.getElementById("qj-classement")) return;
    const jours = Object.keys(ETAT.quotidien || {}).filter(d => ETAT.quotidien[d].fini).sort().reverse();
    const sem = Object.keys(ETAT.qjSemaines || {}).sort().reverse();
    const date = d => new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
    const medaille = ["&#127942; ", "&#129352; ", "&#129353; "];
    const place = (r, n, final, table) => r ? `${final && r <= 3 ? medaille[r - 1] : ""}${r}<sup>e</sup> sur ${n}${final ? (qjBonus(table, r) ? ` <small>+${qjBonus(table, r)}</small>` : "") : " <small>(provisoire)</small>"}` : `<small>non classé</small>`;
    zone.innerHTML = !jours.length ? `<p class="secondaire">Vous n’avez pas encore joué. Votre place de chaque jour et de chaque semaine s’inscrira ici.</p>` :
      (sem.length ? `<p class="capitales" style="margin:4px 0 6px">Vos semaines</p><ol class="qj-histo">${sem.map(l => { const w = ETAT.qjSemaines[l];
        return `<li><span>Semaine du ${date(l)}</span><span>${w.points} pts</span><span>${place(w.rang, w.classes, w.final, QJ_PODIUM_SEMAINE)}</span></li>`; }).join("")}</ol>` : "")
      + `<p class="capitales" style="margin:12px 0 6px">Vos jours</p><ol class="qj-histo">${jours.map(d => { const e = ETAT.quotidien[d], n = qjNumero(d);
        return `<li><span>${n ? "#" + n + " &#8226; " : ""}${date(d)}</span><span>${e.justes}/${QJ_NB}</span><span>${place(e.rang, e.classes, e.rangFinal, QJ_PODIUM_JOUR)}</span></li>`; }).join("")}</ol>`
      + (compteConnecte() ? "" : `<p class="minuscule">Connectez-vous pour être classé.</p>`);
  };
  dessiner();
  qjMajRangs().then(dessiner);
}

function actionQuizJour(a, el){
  if(a === "qj-ouvrir"){ qjOuvrir("intro"); return true; }
  if(a === "qj-reprendre"){ qjReprendre(); return true; }
  if(a === "qj-suivante"){ if(QJ && QJ.vue === "pause") qjQuestionSuivante(); return true; }
  if(a === "qj-classements"){ qjOuvrir("classement"); return true; }
  if(a === "qj-commencer"){ qjCommencer(); return true; }
  if(a === "qj-valider"){
    const choix = [...document.querySelectorAll("#quiz-jour input[data-qj]:checked")].map(x => Number(x.dataset.qj));
    qjRepondre(choix);
    return true;
  }
  if(a === "qj-onglet"){ QJ.onglet = el.dataset.onglet; qjAfficher(); return true; }
  if(a === "qj-fermer"){ qjFermer(); return true; }
  return false;
}

  /* Quitter la fenetre ou l'application pendant une question. */
  document.addEventListener("visibilitychange", () => { if(document.hidden) qjSuspendre(); });
  window.addEventListener("blur", () => qjSuspendre());
  window.addEventListener("pagehide", () => qjSuspendre());
  /* L'APK previent aussi quand l'application passe en arriere-plan. */
  window.epokPause = () => qjSuspendre();
  /* Le bouton Retour du telephone : il referme l'ecran (pendant une
     question, celle-ci est comptee fausse et le quiz se met en pause). */
  window.addEventListener("popstate", () => {
    if(!document.getElementById("quiz-jour")) return;
    if(QJ && QJ.vue === "question"){ qjSuspendre("Vous avez quitté la question en cours."); try{ history.pushState({ epok: 3 }, ""); }catch(e){} return; }
    qjProteger(false);
    const v = document.getElementById("quiz-jour"); if(v) v.remove(); QJ = null; rendre();
  });
  /* A minuit, un nouveau quiz : l'accueil se redessine s'il est affiche. */
  let jourVu = null;
  setInterval(() => {
    const j = aujourdhui();
    if(jourVu && j !== jourVu && !QJ && typeof ONGLET !== "undefined" && ONGLET === "accueil") rendre();
    jourVu = j;
  }, 60000);
}
