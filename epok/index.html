/* Messages lisibles pour les erreurs de Firebase. Pour la connexion, on
   ne dit pas si c'est l'adresse ou le mot de passe qui est faux. */
function messageErreurCompte(e){
  const c = (e && e.code) || "";
  if(c === "auth/invalid-email") return "Cette adresse e-mail n’est pas valide.";
  if(c === "auth/email-already-in-use") return "Un compte existe déjà avec cette adresse. Connectez-vous, ou utilisez « Mot de passe oublié ».";
  if(c === "auth/weak-password") return "Mot de passe trop faible : " + MDP_MIN + " caractères au moins.";
  if(c === "auth/invalid-credential" || c === "auth/invalid-login-credentials" || c === "auth/wrong-password" || c === "auth/user-not-found")
    return "Adresse ou mot de passe incorrect. Pas encore de compte EPOK ? Créez-en un (onglet « Créer un compte ») ou utilisez « Continuer avec Google » : votre mot de passe Google ne marche pas ici.";
  if(c === "auth/missing-password") return "Indiquez votre mot de passe.";
  if(c === "auth/admin-restricted-operation") return "La création de comptes est fermée sur le serveur pour l’instant. Prévenez votre professeur.";
  if(c === "auth/unauthorized-domain") return "Ce site n’est pas autorisé à créer des comptes. Prévenez votre professeur.";
  if(c === "auth/internal-error") return "Le serveur des comptes n’a pas répondu. Réessayez dans un instant.";
  if(c === "auth/user-disabled") return "Ce compte a été désactivé.";
  if(c === "auth/too-many-requests") return "Trop d’essais. Patientez quelques minutes, ou réinitialisez votre mot de passe.";
  if(c === "auth/network-request-failed") return "Pas de connexion à Internet. Réessayez une fois en ligne.";
  if(c === "auth/operation-not-allowed") return "La connexion par e-mail n’est pas encore activée sur le serveur.";
  /* Inattendue : on montre son code, pour pouvoir la reconnaitre. */
  return "Erreur" + (c ? " (" + c + ")" : "") + " : " + ((e && e.message) || "inconnue") + ".";
}

function lireChamp(id){ const el = document.getElementById(id); return el ? el.value : ""; }

/* Une demande au serveur : on bloque les boutons le temps qu'elle dure.
   Les mots de passe tapes sont remis dans leurs cases apres coup (le
   formulaire est redessine) et l'erreur est amenee sous les yeux. */
function demandeCompte(promesse, reussite, garder){
  COMPTE.attente = true; COMPTE.erreur = null; COMPTE.info = null; majVuesCompte();
  if(garder) garder();
  return promesse.then(r => { if(reussite) reussite(r); }, e => { COMPTE.erreur = messageErreurCompte(e); })
    .finally(() => { COMPTE.attente = false; majVuesCompte(); if(COMPTE.erreur){ if(garder) garder(); montrerErreurCompte(); } });
}
/* Remet les mots de passe tapes dans le formulaire redessine. */
function gardeMdp(mdp, mdp2){
  return () => {
    const a = document.getElementById("compte-mdp"), b = document.getElementById("compte-mdp2");
    if(a && mdp) a.value = mdp;
    if(b && mdp2) b.value = mdp2;
  };
}
/* Une erreur s'affiche juste au-dessus du bouton ; on l'amene a l'ecran. */
function montrerErreurCompte(garder){
  majVuesCompte();
  if(garder) garder();
  const a = document.querySelector(".form-compte [role='alert']");
  if(a && a.scrollIntoView) a.scrollIntoView({ block: "center", behavior: "smooth" });
}

const MESSAGE_CLASSE = "Écrivez votre classe sous la forme 3A, 3F… (le niveau puis la lettre), ou laissez la case vide.";

function creerCompteEmail(){
  if(!compteDisponible() || COMPTE.attente) return;
  const nom = (COMPTE.nom = lireChamp("compte-nom").trim().replace(/\s+/g, " ").slice(0, 60));
  COMPTE.classe = lireChamp("compte-classe").trim().slice(0, 20);
  const classe = formaterClasse(COMPTE.classe);
  const email = (COMPTE.email = lireChamp("compte-email").trim());
  const mdp = lireChamp("compte-mdp"), mdp2 = lireChamp("compte-mdp2");
  COMPTE.info = null;
  const garder = gardeMdp(mdp, mdp2), refuser = m => { COMPTE.erreur = m; montrerErreurCompte(garder); };
  if(nom.length < 2) return refuser("Indiquez votre prénom et votre nom.");
  const refus = nomInapproprie(nom);
  if(refus) return refuser(refus);
  if(classe === null) return refuser(MESSAGE_CLASSE);
  if(!email) return refuser("Indiquez votre adresse e-mail.");
  if(mdp.length < MDP_MIN) return refuser("Mot de passe trop court : " + MDP_MIN + " caractères au moins.");
  if(mdp !== mdp2) return refuser("Les 2 mots de passe ne sont pas identiques.");
  return demandeCompte(COMPTE.auth.createUserWithEmailAndPassword(email, mdp), r => {
    /* Un e-mail de confirmation prouve que l'adresse est bien la sienne :
       c'est elle qui servira si le mot de passe est oublie. */
    if(r && r.user && r.user.sendEmailVerification) r.user.sendEmailVerification().catch(() => {});
    if(classe){ ETAT.classe = classe; sauverEtat(); }
    /* Le nom, pour que le professeur reconnaisse l'eleve. */
    if(r && r.user && r.user.updateProfile) r.user.updateProfile({ displayName: nom })
      .then(() => planifierSynchro(300), () => {});
  }, garder);
}

function connexionEmail(){
  if(!compteDisponible() || COMPTE.attente) return;
  const email = (COMPTE.email = lireChamp("compte-email").trim());
  const mdp = lireChamp("compte-mdp");
  COMPTE.info = null;
  const garder = gardeMdp(mdp);
  if(!email || !mdp){ COMPTE.erreur = "Indiquez votre adresse e-mail et votre mot de passe."; return montrerErreurCompte(garder); }
  return demandeCompte(COMPTE.auth.signInWithEmailAndPassword(email, mdp), null, garder);
}

/* Firebase envoie lui-meme un lien de reinitialisation sur l'adresse du
   compte. Le message est le meme que l'adresse existe ou non : on ne
   revele pas qui a un compte. */
function motDePasseOublie(){
  if(!compteDisponible() || COMPTE.attente) return;
  const email = (COMPTE.email = lireChamp("compte-email").trim());
  if(!email){ COMPTE.erreur = "Indiquez l’adresse e-mail de votre compte."; COMPTE.info = null; return majVuesCompte(); }

  return demandeCompte(COMPTE.auth.sendPasswordResetEmail(email).catch(e => {
    if(e && e.code === "auth/user-not-found") return null;   // meme reponse

function deconnexion(){

/* ---------- Le document du serveur (API REST de Firestore) ---------- */

function urlDocument(){
  return "https://firestore.googleapis.com/v1/projects/" + encodeURIComponent(CONFIG_COMPTE.projectId)
    + "/databases/(default)/documents/progressions/" + encodeURIComponent(COMPTE.user.uid);
}
function requete(methode, suite, corps){
  /* Deconnecte entre-temps (la synchronisation etait deja partie). */
  if(!COMPTE.user) return Promise.reject(Object.assign(new Error("déconnecté"), { deconnecte: true }));
  return COMPTE.user.getIdToken().then(jeton => fetch(urlDocument() + (suite || ""), {
    method: methode,
    headers: { "Authorization": "Bearer " + jeton, "Content-Type": "application/json" },
    body: corps ? JSON.stringify(corps) : undefined
  }));
}
function erreurHttp(r){
  return r.json().catch(() => ({})).then(j => {
    throw new Error((j && j.error && j.error.message) || ("réponse " + r.status));
  });
}
/* La progression est rangee en texte JSON dans un champ « etat » : un
   seul champ, que Firestore n'a pas a decomposer. */
function lireDistant(){
  return requete("GET").then(r => {
    if(r.status === 404) return null;
    if(!r.ok) return erreurHttp(r);
    return r.json().then(j => (j.fields && j.fields.etat && j.fields.etat.stringValue)
      ? JSON.parse(j.fields.etat.stringValue) : null);
  });
}
function ecrireDistant(texte){
  return requete("PATCH", "?updateMask.fieldPaths=etat&updateMask.fieldPaths=maj", {
    fields: { etat: { stringValue: texte }, maj: { timestampValue: new Date().toISOString() } }
  }).then(r => r.ok ? true : erreurHttp(r));
}
function effacerDistant(){
  /* La ligne du classement part avec la progression. */
  if(typeof urlDocuments === "function" && COMPTE.user)
    requeteJeton("DELETE", urlDocuments("/classement/" + encodeURIComponent(COMPTE.user.uid))).catch(() => {});
  if(typeof effacerQuotidien === "function" && COMPTE.user) effacerQuotidien();
  return requete("DELETE").then(r => (r.ok || r.status === 404) ? true : erreurHttp(r));
}

/* Droit a l'effacement : la copie du serveur, puis le compte lui-meme.
   Firebase n'accepte de supprimer un compte que peu apres une connexion ;
   sinon la copie est effacee et l'eleve est invite a se reconnecter pour
   finir. */
function supprimerCompte(){
  if(!compteConnecte()) return;
  if(!confirm("Supprimer votre compte et la copie de votre progression sur le serveur ? La progression de ce téléphone est conservée.")) return;
  clearTimeout(COMPTE.minuteur);
  effacerDistant().then(() => COMPTE.user.delete().then(() => {
    COMPTE.user = null; COMPTE.erreur = null; majVuesCompte();
  }, e => {
    const recent = e && e.code === "auth/requires-recent-login";
    return deconnexion().then(() => {
      COMPTE.erreur = recent
        ? "La copie de votre progression est effacée du serveur. Pour supprimer aussi le compte, reconnectez-vous puis recommencez aussitôt."
        : "Suppression du compte impossible : " + (e && e.message ? e.message : "erreur inconnue");
      majVuesCompte();
    });
  })).catch(e => {
    COMPTE.erreur = "Suppression impossible : " + (e && e.message ? e.message : "erreur inconnue");
    majVuesCompte();
  });
}

/* ---------- Synchronisation ---------- */

function planifierSynchro(delai){
  if(!compteConnecte()) return;
  clearTimeout(COMPTE.minuteur);
  COMPTE.minuteur = setTimeout(synchroniser, delai === undefined ? DELAI_SYNCHRO : delai);
}

/* Lit le document du serveur, le fusionne dans la progression locale,
   enregistre le resultat dans le telephone puis le renvoie au serveur. */
function synchroniser(){
  if(!compteConnecte()) return Promise.resolve(false);
  if(COMPTE.enCours){ COMPTE.encore = true; return Promise.resolve(false); }
  COMPTE.enCours = true;
  clearTimeout(COMPTE.minuteur);
  majVuesCompte(true);
  return lireSanction().then(sanction => {
    /* Compte supprime par l'administrateur : on n'ecrit plus rien. */
    if(sanction && sanction.etat === "supprime"){ appliquerSuppression(); throw Object.assign(new Error("compte supprimé"), { supprime: true }); }
    return lireDistant();
  }).then(lu => {
    const avant = JSON.stringify(progressionAEnvoyer());
    if(lu && typeof lu === "object"){
      ETAT = fusionnerProgressions(ETAT, fusionnerEtat(etatVierge(), lu));
    }
    const apres = JSON.stringify(progressionAEnvoyer());
    if(apres !== avant){ sauverEtat(true); rafraichirApresSynchro(); }
    return ecrireDistant(apres);
  }).then(() => {
    COMPTE.derniere = new Date();
    COMPTE.erreur = null;
    /* Sa ligne du classement general suit (z0j_classement.js). */
    if(typeof publierClassement === "function") publierClassement();
    if(typeof publierQuotidien === "function") publierQuotidien().then(() => { if(typeof qjMajRangsDiscret === "function") qjMajRangsDiscret(); });
    return true;
  }).catch(e => {
    if(e && e.supprime) return false;
    if(!compteConnecte()) return false;   /* deconnexion pendant la synchronisation : rien a signaler */
    COMPTE.erreur = navigator.onLine === false
      ? "Hors ligne : la synchronisation reprendra au retour du réseau."
      : "Synchronisation impossible" + (e && e.message ? " : " + e.message : ".");
    return false;
  }).finally(() => {
    COMPTE.enCours = false;
    majVuesCompte(true);
    if(COMPTE.encore){ COMPTE.encore = false; planifierSynchro(); }
  });
}

/* Apres une fusion qui a change la progression, l'ecran se redessine,
   sauf au milieu d'un quiz, d'une seance de cartes ou d'une lecture, ou
   l'on se contente de mettre l'insigne a jour. */
function rafraichirApresSynchro(){
  const occupe = (QUIZ && !QUIZ.corrige) || BCARTES || (BFRISE && !BFRISE.verifie) || (ECRAN && ECRAN.nom === "lecture" && ONGLET === "cours");
  if(occupe) majInsigne(); else rendre();
}

/* ---------- Affichage ---------- */

function depuis(date){
  const s = Math.round((Date.now() - date.getTime()) / 1000);
  if(s < 60) return "à l’instant";
  if(s < 3600) return "il y a " + Math.round(s / 60) + " min";
  return "à " + date.getHours() + " h " + String(date.getMinutes()).padStart(2, "0");
}

/* Rappel discret sur l'accueil, tant que l'on n'est pas connecte. */
/* Adresse pas encore confirmee : l'e-mail de confirmation arrive souvent
   dans les spams. Affiche sur l'accueil et dans la carte Compte. */
function adresseAConfirmer(){ return compteConnecte() && COMPTE.user.emailVerified === false; }
function blocConfirmation(){

    <p style="margin:0 0 10px"><strong>Confirmez votre adresse e-mail</strong> pour apparaître au classement. Un lien vous a été envoyé à

    </div>
    ${COMPTE.info ? `<p class="minuscule" style="margin:10px 0 0">${esc(COMPTE.info)}</p>` : ""}

function rappelCompte(){
  const avert = bandeauSanction();
  if(avert) return avert;
  if(adresseAConfirmer()) return `<div class="carte rappel-compte">${blocConfirmation()}</div>`;
  if(!compteDisponible() || compteConnecte()) return "";
  return `<div class="carte rappel-compte"><p class="secondaire" style="margin:0 0 10px">Ne perdez pas votre
    progression&#8239;: créez un compte pour la sauvegarder.</p>
    <button class="bouton" data-action="onglet-reglages">Créer un compte ou se connecter</button></div>`;
}

/* discret : appel de la synchronisation (au retour sur l'app, puis toutes
   les 15 s). L'accueil ne se redessine alors que si ce qu'il montre du
   compte a change : sinon la page « clignotait » et un appui en cours
   (sur l'insigne, par exemple) se perdait. */
function majVuesCompte(discret){
  /* La connexion du professeur fait apparaitre son espace et tous les
     chapitres : on redessine alors l'ecran entier. */
  const prof = typeof estProfesseur === "function" && estProfesseur();
  if(prof !== COMPTE.etaitProf){ COMPTE.etaitProf = prof; if(typeof ONGLET !== "undefined" && ETAT.reglages.mode){ rendre(); return; } }
  const accueil = document.getElementById("carte-compte-accueil");
  if(accueil) accueil.innerHTML = formulaireCompte();
  const carte = document.getElementById("carte-compte");
  if(carte){ carte.outerHTML = carteCompte() || "<span id=\"carte-compte\"></span>"; return; }
  const u = COMPTE.user, vu = [compteConnecte(), u && u.uid, u && u.displayName, u && u.emailVerified, prof, COMPTE.erreur].join("|");
  if(discret && typeof ONGLET !== "undefined" && ONGLET === "accueil" && COMPTE.accueilVu === vu) return;
  COMPTE.accueilVu = vu;
  if(typeof ONGLET !== "undefined" && (ONGLET === "reglages" || ONGLET === "accueil")) rendre();
}

function actionCompte(a, el){
  if(a === "compte-connexion"){ connexionGoogle(); return true; }
  if(a === "compte-forme"){
    const email = document.getElementById("compte-email");
    if(email) COMPTE.email = email.value.trim();
    COMPTE.forme = el && el.dataset.forme || "creer"; COMPTE.erreur = null; COMPTE.info = null;
    majVuesCompte(); return true;
  }
  if(a === "compte-creer"){ creerCompteEmail(); return true; }
  if(a === "classement-public"){
    ETAT.reglages.classementPublic = !!(el && el.checked);
    sauverEtat();
    publierClassement().then(() => chargerClassement(true));
    publierQuotidien();
    majVuesCompte();
    return true;
  }
  if(a === "compte-classe"){
    const classe = formaterClasse(lireChamp("compte-classe-ajout"));
    COMPTE.info = null; COMPTE.erreur = null;
    if(classe === null){ COMPTE.erreur = MESSAGE_CLASSE; majVuesCompte(); return true; }
    ETAT.classe = classe;
    sauverEtat();
    majVuesCompte();
    return true;
  }
  if(a === "compte-nom" && compteConnecte()){
    const nom = lireChamp("compte-nom-ajout").trim().replace(/\s+/g, " ").slice(0, 60);
    if(nom.length < 2){ COMPTE.erreur = "Indiquez votre prénom et votre nom."; majVuesCompte(); return true; }
    const refus = nomInapproprie(nom);
    if(refus){ COMPTE.erreur = refus; majVuesCompte(); return true; }
    demandeCompte(COMPTE.user.updateProfile({ displayName: nom }), () => {
      fermerAvisSanction();
      planifierSynchro(300);
      /* La ligne du classement prend aussitot le nouveau nom. */
      if(typeof publierClassement === "function") publierClassement().then(() => chargerClassement(true));
      if(typeof publierQuotidien === "function") publierQuotidien();
    });
    return true;
  }
  if(a === "compte-verif-envoyer" && compteConnecte()){
    demandeCompte(COMPTE.user.sendEmailVerification(), () => {
      COMPTE.info = "E-mail renvoyé. Regardez dans vos spams, puis cliquez sur le lien.";
    });
    return true;
  }
  if(a === "compte-verif-relire" && compteConnecte()){
    demandeCompte(COMPTE.user.reload().then(() => COMPTE.user.getIdToken(true)), () => {
      COMPTE.info = COMPTE.user.emailVerified ? null : "Pas encore confirmée : cliquez sur le lien de l’e-mail (regardez dans vos spams), puis réessayez.";
      if(typeof rendre === "function") rendre();
    });
    return true;
  }
  if(a === "compte-entrer"){ connexionEmail(); return true; }
  if(a === "compte-oubli"){ motDePasseOublie(); return true; }
  if(a === "onglet-reglages"){ aller("reglages"); return true; }
  if(a === "compte-deconnexion"){ deconnexion(); return true; }
  if(a === "compte-synchro"){ synchroniser(); majVuesCompte(); return true; }
  if(a === "compte-supprimer"){ supprimerCompte(); return true; }
  return false;
}

if(typeof document !== "undefined"){

  else setTimeout(compteInit, 0);

/* ======================================================================
   STATISTIQUES DE MES ELEVES (compte professeur)

   Le professeur lit toutes les progressions rangees dans Firestore
   (progressions/{uid}) ; les regles du serveur le lui permettent, a lui
   seul. Chaque document porte la progression de l'eleve, avec son nom et
   son adresse (profil) et ses jours d'ouverture (visites) : tout le reste
   se calcule ici, dans le telephone du professeur, avec les fonctions
   memes de l'application (points, rang, chapitre reussi...), appliquees
   tour a tour a chaque progression.

   Rien n'est ecrit : l'ecran ne fait que lire.
   ====================================================================== */

const STATS = { enCours: false, erreur: null, eleves: null, maj: null, jour: null, classe: null, annee: null };

/* Les eleves ecrivent leur classe a leur facon : « 3e B », « 3eB », « 3 b ».
   On les regroupe sur une cle sans espaces ni casse. */
function cleClasse(c){ return String(c || "").toUpperCase().replace(/[^0-9A-Z]/g, ""); }
/* L'annee scolaire que l'application ajoute a la classe : << 3A (2026-2027) >>. */
function anneeDeClasse(c){ return (/\((\d{4}-\d{4})\)\s*$/.exec(c || "") || [])[1] || ""; }

function urlListeProgressions(page){
  return "https://firestore.googleapis.com/v1/projects/" + encodeURIComponent(CONFIG_COMPTE.projectId)
    + "/databases/(default)/documents/progressions?pageSize=100" + (page ? "&pageToken=" + encodeURIComponent(page) : "");
}

/* Toutes les progressions, page par page. */
function lireToutesProgressions(){
  const docs = [];
  const page = jeton => COMPTE.user.getIdToken()
    .then(j => fetch(urlListeProgressions(jeton), { headers: { "Authorization": "Bearer " + j } }))
    .then(r => {
      if(r.status === 403) throw new Error("refus");
      if(!r.ok) return r.json().catch(() => ({})).then(j => { throw new Error((j.error && j.error.message) || "réponse " + r.status); });
      return r.json();
    })
    .then(j => {
      (j.documents || []).forEach(d => docs.push(d));
      return j.nextPageToken ? page(j.nextPageToken) : docs;
    });
  return page(null);
}

/* Calcule une fonction de l'application sur la progression d'un eleve. */
function avecEtat(e, f){
  const garde = ETAT;
  ETAT = e;
  try{ return f(); } finally { ETAT = garde; }
}

/* Une fiche par eleve, tiree de son document. */
function ficheEleve(doc){
  let lu = null;
  try{ lu = JSON.parse(((doc.fields || {}).etat || {}).stringValue || "null"); }catch(e){}
  if(!lu || typeof lu !== "object") return null;
  const e = fusionnerEtat(etatVierge(), lu);
  if(e.palierMax === null) e.palierMax = 0;
  const profil = (lu.profil && typeof lu.profil === "object") ? lu.profil : {};
  const email = String(profil.email || "");
  /* Jours d'activite : les ouvertures notees, et, pour les progressions
     plus anciennes, les jours ou un quiz a ete fait. */
  const jours = Object.assign({}, e.visites);
  (e.historique || []).forEach(h => { if(h && /^\d{4}-\d{2}-\d{2}$/.test(h.d) && !jours[h.d]) jours[h.d] = 1; });
  return avecEtat(e, () => ({
    uid: String(doc.name || "").split("/").pop(),
    nom: String(profil.nom || "").trim() || (email ? email.split("@")[0] : "élève sans nom"),
    nomBrut: String(profil.nom || "").trim(),
    classe: e.classe || "",
    email,
    points: pointsTotal(),
    rang: rangActuel(),
    jours,
    brevet: chapitresRediges().map(c => ({ id: c.id, lu: !!etatChapitre(c.id).lu, moitie: validationsChapitre(c.id) === 1, reussi: chapitreMaitrise(c.id) })),
    cours: Object.keys(e.cours).filter(id => coursParId(id))
      .map(id => ({ id, commence: coursCommence(id), termine: coursTermine(id) })),
    maj: ((doc.fields || {}).maj || {}).timestampValue || null
  }));
}

function chargerStats(){
  if(!estProfesseur() || STATS.enCours) return;
  STATS.enCours = true; STATS.erreur = null; rendreStats();
  Promise.all([lireToutesProgressions(), chargerSanctions()]).then(([docs, sanctions]) => {
    const profs = (CONFIG_COMPTE.professeurs || []).map(a => String(a).toLowerCase());
    STATS.eleves = docs.map(ficheEleve).filter(f => f && profs.indexOf(f.email.toLowerCase()) < 0);
    STATS.sanctions = sanctions || {};
    STATS.maj = new Date();
  }).catch(e => {
    STATS.erreur = e && e.message === "refus"
      ? "Firebase refuse la lecture des progressions. Dans la console Firebase, Firestore, onglet Règles, collez les nouvelles règles qui autorisent le professeur à les lire, puis cliquez Publier."
      : "Lecture impossible : " + (e && e.message ? e.message : "erreur inconnue") + ".";
  }).finally(() => { STATS.enCours = false; rendreStats(); });
}

/* ---------- Calculs ---------- */

function joursAvant(n){ const d = new Date(); d.setDate(d.getDate() - n); return iso(d); }

function activite(eleves){
  const auj = aujourdhui(), s7 = joursAvant(6), s30 = joursAvant(29);
  const actifs = (debut) => eleves.filter(e => Object.keys(e.jours).some(j => j >= debut && j <= auj)).length;
  const ouvertures = (debut) => eleves.reduce((t, e) => t + Object.keys(e.jours).filter(j => j >= debut && j <= auj)
    .reduce((s, j) => s + e.jours[j], 0), 0);
  const serie = [];
  for(let i = 29; i >= 0; i--){
    const j = joursAvant(i);
    serie.push({ j, n: eleves.filter(e => e.jours[j]).length, o: eleves.reduce((t, e) => t + (e.jours[j] || 0), 0) });
  }
  return { jour: actifs(auj), semaine: actifs(s7), mois: actifs(s30),
           oJour: ouvertures(auj), oSemaine: ouvertures(s7), oMois: ouvertures(s30), serie };
}

function dateCourte(j){
  const m = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "7.", "oct.", "nov.", "déc."];
  const [a, mo, d] = j.split("-").map(Number);
  return d + " " + m[mo - 1];
}

/* Barres des eleves actifs par jour, sur trente jours. Une seule serie :
   pas de legende, le titre la nomme ; la valeur s'affiche au toucher. */
function graphiqueActivite(serie){
  const L = 340, H = 130, haut = 18, bas = 22, g = 8, pas = (L - g * 2) / serie.length, larg = Math.max(3, pas - 2);
  const max = Math.max(1, ...serie.map(s => s.n));
  const y = v => haut + (H - haut - bas) * (1 - v / max);
  const barres = serie.map((s, i) => {
    const x = g + i * pas, h = (H - bas) - y(s.n);
    const choisi = STATS.jour === s.j;
    return `<g class="st-barre${choisi ? " choisi" : ""}" data-action="b-stats-jour" data-jour="${s.j}">`
      + `<rect x="${(x - 1).toFixed(1)}" y="${haut}" width="${(pas).toFixed(1)}" height="${H - bas - haut}" fill="transparent"/>`
      + (s.n ? `<rect x="${x.toFixed(1)}" y="${y(s.n).toFixed(1)}" width="${larg.toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" rx="2" class="st-plein"/>` : "")
      + `<title>${dateCourte(s.j)} : ${s.n} élève${s.n > 1 ? "s" : ""}</title></g>`;
  }).join("");
  const axe = `<line x1="${g}" x2="${L - g}" y1="${H - bas}" y2="${H - bas}" class="st-axe"/>`;
  const etiq = [0, 14, 29].map(i => `<text x="${(g + i * pas + larg / 2).toFixed(1)}" y="${H - 6}" class="st-lettre"`
    + ` text-anchor="${i === 0 ? "start" : i === 29 ? "end" : "middle"}">${i === 29 ? "aujourd’hui" : dateCourte(serie[i].j)}</text>`).join("");
  const maxi = `<text x="${g}" y="${haut - 6}" class="st-lettre">max. ${max} élève${max > 1 ? "s" : ""} par jour</text>`;
  return `<svg viewBox="0 0 ${L} ${H}" class="st-graphe" role="img" aria-label="Élèves actifs par jour sur 30 jours">${maxi}${barres}${axe}${etiq}</svg>`;
}

/* ---------- Ecran ---------- */

function tuile(valeur, libelle, detail){
  return `<div class="st-tuile"><b>${valeur}</b><span>${libelle}</span>${detail ? `<small>${detail}</small>` : ""}</div>`;
}

function contenuStats(){
  const parts = [`<div class="st-tete"><button class="bouton petit discret" data-action="b-stats-fermer">&#8592; Retour</button>
    <button class="bouton petit" data-action="b-stats-actualiser"${STATS.enCours ? " disabled" : ""}>Actualiser</button></div>
    <h2 style="margin:6px 0 2px">Statistiques</h2>`];
  if(STATS.enCours && !STATS.eleves) parts.push(`<p class="secondaire">Lecture des progressions…</p>`);
  if(STATS.erreur) parts.push(`<p class="avis">${esc(STATS.erreur)}</p>`);
  if(!STATS.eleves) return parts.join("");
  /* Filtre par annee scolaire, des qu'il y en a deux : comparer ses eleves
     d'une annee sur l'autre. */
  const annees = [...new Set(STATS.eleves.map(e => anneeDeClasse(e.classe)).filter(Boolean))].sort().reverse();
  if(STATS.annee && annees.indexOf(STATS.annee) < 0) STATS.annee = null;
  if(annees.length > 1){
    parts.push(`<div class="st-classes" role="group" aria-label="Filtrer par année scolaire">
      <button class="st-puce${STATS.annee === null ? " actif" : ""}" data-action="b-stats-annee" data-annee="*">Toutes les années</button>
      ${annees.map(a => `<button class="st-puce${STATS.annee === a ? " actif" : ""}" data-action="b-stats-annee" data-annee="${esc(a)}">${esc(a)} (${
        STATS.eleves.filter(e => anneeDeClasse(e.classe) === a).length})</button>`).join("")}
    </div>`);
  }
  const tous = STATS.annee ? STATS.eleves.filter(e => anneeDeClasse(e.classe) === STATS.annee) : STATS.eleves;
  /* Filtre par classe : une pastille par classe declaree. */
  const classes = {};
  tous.forEach(e => { const k = cleClasse(e.classe); if(!classes[k]) classes[k] = { k, nom: e.classe || "Sans classe", n: 0 }; classes[k].n++; });
  const liste = Object.values(classes).sort((a, b) => (a.k === "") - (b.k === "") || a.nom.localeCompare(b.nom, "fr", { numeric: true }));
  if(STATS.classe !== null && !classes[STATS.classe]) STATS.classe = null;
  const E = STATS.classe === null ? tous : tous.filter(e => cleClasse(e.classe) === STATS.classe);
  if(liste.length > 1 || (liste.length === 1 && liste[0].k !== "")){
    parts.push(`<div class="st-classes" role="group" aria-label="Filtrer par classe">
      <button class="st-puce${STATS.classe === null ? " actif" : ""}" data-action="b-stats-classe" data-classe="*">Tous (${tous.length})</button>
      ${liste.map(c => `<button class="st-puce${STATS.classe === c.k ? " actif" : ""}" data-action="b-stats-classe" data-classe="${esc(c.k)}">${esc(c.nom)} (${c.n})</button>`).join("")}
    </div>`);
  }
  parts.push(`<p class="minuscule" style="margin:0 0 12px">Mise à jour ${depuis(STATS.maj)}${STATS.enCours ? " • actualisation…" : ""}.
    Un élève compte dès que son compte a été synchronisé une fois.</p>`);
  if(!E.length){ parts.push(`<p class="secondaire">Aucun élève n’a encore de compte synchronisé.</p>`); return parts.join(""); }

  const A = activite(E);
  parts.push(filet("Fréquentation"));
  parts.push(`<div class="st-tuiles">${tuile(E.length, "comptes")}${tuile(A.jour, "actifs aujourd’hui", A.oJour + " ouverture" + (A.oJour > 1 ? "s" : ""))}
    ${tuile(A.semaine, "actifs sur 7 jours", A.oSemaine + " ouverture" + (A.oSemaine > 1 ? "s" : ""))}
    ${tuile(A.mois, "actifs sur 30 jours", A.oMois + " ouverture" + (A.oMois > 1 ? "s" : ""))}</div>`);
  const choisi = STATS.jour && A.serie.find(s => s.j === STATS.jour);
  parts.push(`<div class="carte"><p class="capitales" style="margin:0 0 6px">Élèves actifs par jour, sur 30 jours</p>
    ${graphiqueActivite(A.serie)}
    <p class="minuscule" style="margin:6px 0 0">${choisi
      ? dateCourte(choisi.j) + "&#8239;: " + choisi.n + " élève" + (choisi.n > 1 ? "s" : "") + " actif" + (choisi.n > 1 ? "s" : "") + ", " + choisi.o + " ouverture" + (choisi.o > 1 ? "s" : "")
      : "Touchez une barre pour voir le détail du jour."}</p></div>`);

  parts.push(filet("Classement"));
  const tri = E.slice().sort((a, b) => b.points - a.points || a.nom.localeCompare(b.nom, "fr"));
  parts.push(`<div class="carte"><ol class="st-classement">${tri.map((e, i) => `<li>
    <span class="st-num">${i + 1}</span>
    <span class="st-nom"><strong>${esc(e.nom)}</strong><small>${esc(e.rang.libelle)}${e.classe ? " &#8226; " + esc(e.classe) : ""}</small></span>
    <span class="st-pts">${e.points.toLocaleString("fr-FR")} pts</span></li>`).join("")}</ol></div>`);

  parts.push(filet("Comptes et noms"));
  parts.push(contenuComptes(E));

  const brevet = E.filter(e => e.brevet.some(c => c.lu || c.moitie || c.reussi));
  if(brevet.length){
    parts.push(filet("Mode Brevet"));
    parts.push(`<div class="carte"><p class="minuscule" style="margin:0 0 8px">${brevet.length} élève${brevet.length > 1 ? "s" : ""}
      en mode Brevet. Une validation&#8239;: QCM à 10/10 et frise sans faute&#8239;; 2 validations à 24 heures d’écart&#8239;: chapitre maîtrisé.</p>
      <table class="st-table"><thead><tr><th>Chapitre</th><th>Fiche lue</th><th>1/2</th><th>2/2</th></tr></thead><tbody>${
      chapitresRediges().map(c => {
        const lus = brevet.filter(e => (e.brevet.find(x => x.id === c.id) || {}).lu).length;
        const mi = brevet.filter(e => (e.brevet.find(x => x.id === c.id) || {}).moitie).length;
        const ok = brevet.filter(e => (e.brevet.find(x => x.id === c.id) || {}).reussi).length;
        return `<tr><td>${tx(c.titre)}</td><td>${lus}</td><td>${mi}</td><td><strong>${ok}</strong></td></tr>`;
      }).join("")}</tbody></table></div>`);
  }

  const parCours = {};
  E.forEach(e => e.cours.forEach(c => {
    const p = parCours[c.id] || (parCours[c.id] = { commence: 0, termine: 0 });
    if(c.commence) p.commence++;
    if(c.termine) p.termine++;
  }));
  const cours = COURS.filter(c => parCours[c.id] && parCours[c.id].commence);
  if(cours.length){
    parts.push(filet("Mode Culture"));
    parts.push(`<div class="carte"><table class="st-table"><thead><tr><th>Cours</th><th>Commencé</th><th>Terminé</th></tr></thead><tbody>${
      cours.map(c => `<tr><td>${tx(c.titre)}</td><td>${parCours[c.id].commence}</td><td><strong>${parCours[c.id].termine}</strong></td></tr>`).join("")
    }</tbody></table></div>`);
  }
  return parts.join("");
}

/* Quel nom pour quelle adresse, les noms suspects en tete, et les
   sanctions : avertir (24 h pour changer de nom), lever, supprimer. */
function contenuComptes(E){
  const S = STATS.sanctions || {};
  const etat = e => {
    const x = S[e.uid];
    if(!x) return "";
    if(x.etat === "supprime") return `<span class="st-etiq rouge">supprimé</span>`;
    if(x.nom && x.nom !== e.nomBrut) return `<span class="st-etiq vert">nom changé</span>`;
    const fini = x.limite && new Date(x.limite) < new Date();
    return `<span class="st-etiq${fini ? " rouge" : " or"}">${fini ? "délai dépassé" : "averti, jusqu’au " + new Date(x.limite).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</span>`;
  };
  const suspect = e => !!nomInapproprie(e.nomBrut) || !e.nomBrut;
  const tri = E.slice().sort((a, b) => (suspect(b) - suspect(a)) || (!!S[b.uid] - !!S[a.uid]) || a.nom.localeCompare(b.nom, "fr"));
  const supprimes = Object.keys(S).filter(uid => S[uid].etat === "supprime" && !E.some(e => e.uid === uid));
  return `<div class="carte"><p class="minuscule" style="margin:0 0 10px">Au classement, chacun apparaît sous son prénom et l’initiale de son nom.
    Un nom suspect est signalé&#8239;; «&#8239;Avertir&#8239;» laisse 24 heures pour le changer, avec un message à la prochaine ouverture d’EPOK.</p>
    <ul class="st-comptes">${tri.map(e => {
      const x = S[e.uid];
      return `<li${suspect(e) ? ` class="suspect"` : ""}>
        <span class="st-nom"><strong>${esc(e.nomBrut || "(sans nom)")}</strong>${suspect(e) ? ` <span class="st-etiq rouge">nom suspect</span>` : ""} ${etat(e)}
          <small>${esc(e.email || "adresse inconnue")}${e.classe ? " &#8226; " + esc(e.classe) : ""}${e.nomBrut ? " &#8226; classement&#8239;: " + esc(pseudoClassement(e.nomBrut)) : ""}</small></span>
        <span class="st-actions">${x && x.etat === "avertissement"
          ? `<button class="bouton petit" data-action="b-compte-lever" data-uid="${esc(e.uid)}">Lever</button>`
          : `<button class="bouton petit" data-action="b-compte-avertir" data-uid="${esc(e.uid)}">Avertir (24 h)</button>`}
          <button class="bouton petit discret danger" data-action="b-compte-supprimer" data-uid="${esc(e.uid)}">Supprimer</button></span></li>`;
    }).join("")}</ul>
    ${supprimes.length ? `<p class="minuscule" style="margin:10px 0 0">Comptes supprimés&#8239;: ${supprimes.map(uid => esc(S[uid].nom + " (" + S[uid].email + ")")).join(", ")}.</p>` : ""}
    ${STATS.message ? `<p class="avis${/^Échec/.test(STATS.message) ? "" : " ok"}" style="margin:10px 0 0">${esc(STATS.message)}</p>` : ""}
  </div>`;
}
function actionCompteProf(a, uid){
  const e = (STATS.eleves || []).find(x => x.uid === uid);
  if(!e) return;
  let p;
  if(a === "b-compte-avertir"){
    if(!confirm("Avertir « " + (e.nomBrut || e.email) + " » ? Il aura 24 heures pour changer de nom.")) return;
    p = avertirCompte(e).then(() => "Avertissement envoyé : « " + (e.nomBrut || e.email) + " » le verra à sa prochaine ouverture d’EPOK.");
  }else if(a === "b-compte-lever"){
    p = leverSanction(uid).then(() => "Avertissement levé.");
  }else{
    if(!confirm("Supprimer le compte de « " + (e.nomBrut || e.email) + " » (" + e.email + ") ? Son nom disparaît du classement et sa progression du serveur.")) return;
    p = supprimerCompteJoueur(e).then(() => "Compte supprimé : « " + (e.nomBrut || e.email) + " ». Pour effacer aussi son adresse de Firebase, ouvrez la console Firebase, onglet Authentication.");
  }
  STATS.message = null;
  p.then(m => { STATS.message = m; }, err => { STATS.message = "Échec : " + (err && err.message ? err.message : "erreur inconnue") + "."; })
   .then(() => chargerStats());
}

function rendreStats(){
  const ecran = document.getElementById("stats-prof");
  if(ecran) ecran.innerHTML = `<div class="st-corps">${contenuStats()}</div>`;
}
function ouvrirStats(){
  if(!estProfesseur()) return;
  let ecran = document.getElementById("stats-prof");
  if(!ecran){
    ecran = document.createElement("div");
    ecran.id = "stats-prof";
    ecran.setAttribute("role", "dialog");
    ecran.setAttribute("aria-label", "Statistiques");
    document.body.appendChild(ecran);
    document.body.dataset.choix = "1";
  }
  rendreStats();
  ecran.scrollTop = 0;
  chargerStats();
}
function fermerStats(){
  const ecran = document.getElementById("stats-prof");
  if(ecran) ecran.remove();
  if(!document.getElementById("choix-mode") && !document.getElementById("ecran-compte")) delete document.body.dataset.choix;
}

function actionStats(a, el){
  if(a === "b-prof-stats"){ ouvrirStats(); return true; }
  if(a === "b-stats-fermer"){ fermerStats(); return true; }
  if(a === "b-stats-actualiser"){ chargerStats(); return true; }
  if(a === "b-stats-annee"){ STATS.annee = el.dataset.annee === "*" ? null : el.dataset.annee; STATS.classe = null; STATS.jour = null; rendreStats(); return true; }
  if(a === "b-stats-classe"){ STATS.classe = el.dataset.classe === "*" ? null : el.dataset.classe; STATS.jour = null; rendreStats(); return true; }
  if(a === "b-compte-avertir" || a === "b-compte-lever" || a === "b-compte-supprimer"){ actionCompteProf(a, el.dataset.uid); return true; }
  if(a === "b-stats-jour"){ STATS.jour = STATS.jour === el.dataset.jour ? null : el.dataset.jour; rendreStats(); return true; }
  return false;
}

/* ---------- Lancement ---------- */

function ecranBloquant(){
  return ["choix-mode", "ecran-compte", "stats-prof", "tuto"].some(id => document.getElementById(id));
}
function lancerTuto(nom, force){
  if(TUTO || typeof document === "undefined") return false;
  if(!force && (tutoCoupe() || tutosVus()[nom] || ecranBloquant())) return false;
  const etapes = etapesTuto(nom);
  if(!etapes.length) return false;
  TUTO = { nom, etapes, i: 0 };
  const voile = document.createElement("div");
  voile.id = "tuto";
  voile.setAttribute("role", "dialog");
  voile.setAttribute("aria-modal", "true");
  voile.setAttribute("aria-label", "Tutoriel");
  voile.innerHTML = `<div class="tuto-trou"></div><div class="tuto-bulle" role="document"></div>`;
  document.body.appendChild(voile);
  montrerEtape();
  return true;
}
/* Apres chaque affichage : la visite de bienvenue si elle n'a pas ete vue. */
function lancerTutoSiBesoin(){
  if(!ETAT.reglages.mode || TUTO || tutoCoupe() || tutosVus()[ETAT.reglages.mode]) return;
  setTimeout(() => { if(!ecranBloquant()) lancerTuto(ETAT.reglages.mode); }, 450);
}

function fermerTuto(){
  if(!TUTO) return;
  marquerTuto(TUTO.nom);
  TUTO = null;
  const v = document.getElementById("tuto");
  if(v) v.remove();
}

/* ---------- Affichage d'une etape ---------- */

function montrerEtape(){
  const voile = document.getElementById("tuto");
  if(!TUTO || !voile) return;
  const e = TUTO.etapes[TUTO.i];
  if(e.onglet && typeof ONGLET !== "undefined" && ONGLET !== e.onglet) aller(e.onglet);
  let cible = e.cible ? e.cible() : null;
  /* Une cible absente (pas de carte du jour, par exemple) : on passe a la
     bulle seule, au centre, plutot que de montrer un trou vide. */
  if(cible && !cible.getClientRects().length) cible = null;
  const derniere = TUTO.i === TUTO.etapes.length - 1;
  const bulle = voile.querySelector(".tuto-bulle");
  bulle.innerHTML = `<p class="tuto-pas">${TUTO.i + 1} / ${TUTO.etapes.length}</p>
    <h3>${e.titre}</h3><p class="tuto-texte">${e.texte}</p>
    <div class="tuto-boutons">
      ${derniere ? "" : `<button class="lien tuto-passer" data-action="tuto-passer">Passer</button>`}
      ${TUTO.i > 0 ? `<button class="bouton petit" data-action="tuto-retour">Retour</button>` : ""}
      <button class="bouton-plein petit" data-action="tuto-suivant">${derniere ? (e.fin || "Terminer") : "Suivant"}</button>
    </div>`;
  const placer = () => placerEtape(voile, cible);
  if(cible){
    const r = cible.getBoundingClientRect();
    const haut = window.innerHeight;
    if(r.top < 70 || r.bottom > haut - 90){
      cible.scrollIntoView({ block: r.height > haut * 0.5 ? "start" : "center" });
      setTimeout(placer, 260);
      voile.classList.add("attente");
      return;
    }
  }
  placer();
}

function placerEtape(voile, cible){
  voile.classList.remove("attente");
  const trou = voile.querySelector(".tuto-trou");
  const bulle = voile.querySelector(".tuto-bulle");
  const L = window.innerWidth, H = window.innerHeight, marge = 8;
  if(!cible){
    voile.classList.add("sans-cible");
    trou.style.cssText = "";
    bulle.style.cssText = "";
    bulle.querySelector(".bouton-plein").focus({ preventScroll: true });
    return;
  }
  voile.classList.remove("sans-cible");
  const r = cible.getBoundingClientRect();
  /* Un element plus haut que l'ecran (une longue partie de fiche) : on
     n'en eclaire que le debut visible. */
  const top = Math.max(r.top - marge, 4), bas = Math.min(r.bottom + marge, H - 4);
  const x = Math.max(r.left - marge, 4), droite = Math.min(r.right + marge, L - 4);
  trou.style.cssText = `top:${top}px;left:${x}px;width:${droite - x}px;height:${bas - top}px`;
  const larg = Math.min(340, L - 24);
  bulle.style.width = larg + "px";
  bulle.style.left = Math.min(Math.max(12, (x + droite) / 2 - larg / 2), L - larg - 12) + "px";
  const hb = bulle.offsetHeight;
  /* Sous la cible, sinon au-dessus ; une cible trop haute pour laisser
     la place : la bulle se pose en bas de l'ecran, par-dessus. */
  if(bas + 12 + hb < H - 8){ bulle.style.top = (bas + 12) + "px"; bulle.style.bottom = "auto"; }
  else if(top - 12 - hb > 8){ bulle.style.top = (top - 12 - hb) + "px"; bulle.style.bottom = "auto"; }
  else { bulle.style.top = "auto"; bulle.style.bottom = "12px"; }
  bulle.querySelector(".bouton-plein").focus({ preventScroll: true });
}

function actionTuto(a){
  if(a === "tuto-suivant"){
    if(!TUTO) return true;
    if(TUTO.i >= TUTO.etapes.length - 1){ fermerTuto(); return true; }
    TUTO.i++; montrerEtape(); return true;
  }
  if(a === "tuto-retour"){ if(TUTO && TUTO.i > 0){ TUTO.i--; montrerEtape(); } return true; }
  if(a === "tuto-passer"){ fermerTuto(); return true; }
  if(a === "revoir-tuto"){
    const v = tutosVus(); delete v[ETAT.reglages.mode]; delete v.fiche;
    try{ localStorage.setItem(CLE_TUTO, JSON.stringify(v)); }catch(e){}
    aller("accueil");
    setTimeout(() => lancerTuto(ETAT.reglages.mode, true), 300);
    return true;
  }
  return false;
}

if(typeof window !== "undefined"){
  window.addEventListener("resize", () => { if(TUTO) montrerEtape(); });
  document.addEventListener("keydown", ev => { if(TUTO && ev.key === "Escape") fermerTuto(); });
}

/* ======================================================================
   AIDE EN BULLE (octobre 2026)

   Un petit « ? » a cote de chaque exercice rappelle comment il marche.

   fenetre des rangs s'ouvre de la meme facon. Sans animation si le

/* Le petit bouton « ? ». */

/* Le dernier point touche : c'est de la que la bulle eclate. */
let POINT_TOUCHE = null;
if(typeof document !== "undefined") document.addEventListener("pointerdown", ev => { POINT_TOUCHE = { x: ev.clientX, y: ev.clientY, t: Date.now() }; }, true);
function pointDOrigine(el){
  if(POINT_TOUCHE && Date.now() - POINT_TOUCHE.t < 1500) return POINT_TOUCHE;
  if(el && el.getBoundingClientRect){ const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
  return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
}
/* Animations des bulles par l'API Web Animations (valeurs calculees ici,
   sans variables CSS ni clip-path dans des @keyframes, que certains
   navigateurs ne jouent pas). Sans cette API, la fenetre s'ouvre et se
   ferme simplement. */
function anime(el, images, opts){
  try { return el.animate ? el.animate(images, Object.assign({ fill: "both" }, opts)) : null; } catch(e){ return null; }
}
function eclatEnPlus(classe, x, y, t){
  const e = document.createElement("span");
  e.className = classe;
  e.style.cssText = `left:${x - t / 2}px;top:${y - t / 2}px;width:${t}px;height:${t}px`;
  document.body.appendChild(e);
  return e;
}
/* Ouverture : une bulle eclate au point touche, ses gouttes d'or partent
   vers l'exterieur et la fenetre en jaillit. La fermeture rejoue
   exactement la meme animation, a l'envers et a la meme vitesse : la
   fenetre rentre dans son point d'origine, les gouttes y reviennent et la
   bulle se reforme. */
const BULLE_DUREE = 720, BULLE_FERME = 240;
/* La meme courbe, vue a l'envers : ce qui finissait en douceur demarre
   d'un coup quand l'animation est jouee a rebours. */
function courbeMiroir(c){
  const m = /cubic-bezier\(([^)]+)\)/.exec(c);
  if(m){ const [a, b, x, y] = m[1].split(",").map(Number); return `cubic-bezier(${1 - x},${1 - y},${1 - a},${1 - b})`; }
  return c === "ease-out" ? "ease-in" : c === "ease-in" ? "ease-out" : c;
}
function animerBulle(v, sens){
  const b = v._bulle, boite = v.firstElementChild, envers = sens === "reverse";
  if(!b || !boite) return false;
  /* A l'ouverture, chaque morceau a sa place dans le temps. A la
     fermeture, tout part aussitot (aucun temps mort apres l'appui sur la
     croix) et finit ensemble : la fenetre rentre dans son point, les
     gouttes y reviennent, la bulle se reforme en dernier. */
  const T = envers ? BULLE_FERME : BULLE_DUREE;
  const joue = (el, images, duree, retard, courbe) => {
    const d = envers ? Math.min(duree, T) : duree;
    return anime(el, images, { duration: d, delay: envers ? T - d : retard, easing: envers ? courbeMiroir(courbe) : courbe, direction: sens });
  };
  if(!joue(v, [{ backgroundColor: "rgba(0,0,0,0)" }, { backgroundColor: "rgba(0,0,0,.55)" }], 300, 0, "linear")) return false;
  joue(boite, [
    { transform: `translate(${b.dx}px,${b.dy}px) scale(.04)`, borderRadius: "50%", opacity: .3 },
    { transform: "translate(0,0) scale(1.03)", borderRadius: b.rayon, opacity: 1, offset: .75 },
    { transform: "translate(0,0) scale(1)", borderRadius: b.rayon, opacity: 1 }], 480, 90, "cubic-bezier(.2,.8,.3,1)");
  const eclats = [eclatEnPlus("eclat-bulle", b.x, b.y, 46)];
  joue(eclats[0], [{ transform: "scale(.5)", opacity: 1 }, { transform: "scale(1.18)", opacity: 1, offset: .55 }, { transform: "scale(1.7)", opacity: 0 }],
    240, 0, "ease-out");
  b.gouttes.forEach(([gx, gy, t]) => {
    const g = eclatEnPlus("eclat-goutte", b.x, b.y, t);
    joue(g, [{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: `translate(${gx}px,${gy}px) scale(.15)`, opacity: 0 }],
      600, 120, "cubic-bezier(.12,.75,.3,1)");
    eclats.push(g);
  });
  setTimeout(() => eclats.forEach(x => x.remove()), T + 80);
  return true;
}
function ouvrirEnBulle(id, contenu, classeBoite, el){
  fermerBulle(id, true);
  const o = pointDOrigine(el);
  const v = document.createElement("div");
  v.id = id;
  v.className = "eclat";
  v.setAttribute("role", "dialog"); v.setAttribute("aria-modal", "true");
  v.style.setProperty("--x", o.x + "px"); v.style.setProperty("--y", o.y + "px");
  v.innerHTML = `<div class="eclat-boite ${classeBoite || "carte"}">${contenu}</div>`;
  v.addEventListener("click", ev => { if(ev.target === v) fermerBulle(id); });
  document.body.appendChild(v);
  const boite = v.firstElementChild, r = boite.getBoundingClientRect();
  const gouttes = [];
  for(let i = 0; i < 12; i++){
    const a = (i / 12) * Math.PI * 2 + Math.random() * 0.4, d = 55 + Math.random() * 45;
    gouttes.push([Math.cos(a) * d, Math.sin(a) * d, 4 + Math.random() * 5]);
  }
  v._bulle = { x: o.x, y: o.y, dx: o.x - (r.left + r.width / 2), dy: o.y - (r.top + r.height / 2),
    rayon: getComputedStyle(boite).borderRadius || "0px", gouttes };
  animerBulle(v, "normal");
  const b = v.querySelector("[data-action$='-fermer']"); if(b) b.focus({ preventScroll: true });
  return v;
}
/* Fermeture : l'ouverture a l'envers. La fenetre perd aussitot son id :
   pour le reste de l'app, elle est deja fermee. */
function fermerBulle(id, net){
  const v = id ? document.getElementById(id) : [...document.querySelectorAll(".eclat:not(.eclat-ferme)")].pop();
  if(!v) return;
  v.removeAttribute("id"); v.setAttribute("aria-hidden", "true"); v.classList.add("eclat-ferme");
  if(net) return v.remove();
  /* Les animations d'ouverture encore en cours s'arretent, pour que
     l'envers parte de l'etat affiche. */
  (v.getAnimations ? [v, v.firstElementChild] : []).forEach(e => e && e.getAnimations && e.getAnimations().forEach(a => a.cancel()));
  if(!animerBulle(v, "reverse")) return v.remove();
  setTimeout(() => v.remove(), BULLE_FERME);
}
function ouvrirAide(cle, el){
  const a = AIDES[cle];
  if(!a) return;
  ouvrirEnBulle("fenetre-aide", `<button class="bouton petit discret fr-fermer" data-action="aide-fermer">&#10005; Fermer</button>
    <h3 class="aide-titre"><span class="aide-btn statique" aria-hidden="true">?</span>${a.titre}</h3>${a.corps()}`, "carte fenetre-aide", el);
}
function actionAide(a, el){
  if(a === "aide"){ ouvrirAide(el.dataset.aide, el); return true; }
  if(a === "aide-fermer"){ fermerBulle("fenetre-aide"); return true; }
  return false;
}
if(typeof document !== "undefined") document.addEventListener("keydown", ev => { if(ev.key === "Escape") fermerBulle("fenetre-aide"); });

/* ======================================================================
   CLASSEMENT GENERAL

   Un seul classement, pour tous les eleves connectes, par points, en bas
   de l'accueil des deux modes : pas de classement par classe ni par mode.
   Chaque eleve y publie le strict necessaire, dans un document a part,
   classement/{uid} : son prenom et l'initiale de son nom (« Lea M. »),
   ses points et son palier. Sa progression, son adresse e-mail et sa
   classe restent dans progressions/{uid}, que lui seul et le professeur
   lisent. Les regles Firestore (serveur/firestore.rules) laissent tout
   eleve connecte lire le classement et chacun n'ecrire que sa ligne.

   La ligne part a chaque synchronisation. Depuis octobre 2026, tout le
   monde y figure, professeur compris : ses eleves le voient et peuvent le
   depasser. Les noms sont filtres et moderes (voir « Moderation »).
   ====================================================================== */

const CLASSEMENT_TOP = 10;
const CLASSEMENT_FRAIS = 5 * 60 * 1000;   // relu au plus toutes les 5 minutes
const CLASSEMENT_GENERAL = { liste: null, total: null, devant: null, maj: 0, enCours: false, erreur: null };

function urlDocuments(suite){
  return "https://firestore.googleapis.com/v1/projects/" + encodeURIComponent(CONFIG_COMPTE.projectId)
    + "/databases/(default)/documents" + (suite || "");
}
function requeteJeton(methode, url, corps){
  if(!COMPTE.user) return Promise.reject(new Error("déconnecté"));
  return COMPTE.user.getIdToken().then(jeton => fetch(url, {
    method: methode,
    headers: { "Authorization": "Bearer " + jeton, "Content-Type": "application/json" },
    body: corps ? JSON.stringify(corps) : undefined
  }));
}

/* « Lea Martin » -> « Lea M. » : assez pour se reconnaitre entre
   camarades, pas assez pour identifier un mineur aupres d'un inconnu. */
function pseudoClassement(nom){
  const mots = String(nom || "").trim().replace(/\s+/g, " ").split(" ").filter(Boolean);
  if(!mots.length) return "";
  const prenom = mots[0].slice(0, 30);
  return mots.length > 1 ? prenom + " " + mots[mots.length - 1].charAt(0).toUpperCase() + "." : prenom;
}
/* Tout le monde figure au classement (octobre 2026) : on ne propose plus
   de s'en retirer. */
function participeClassement(){ return true; }
function estProf(){ return typeof estProfesseur === "function" && estProfesseur(); }

/* Envoie (ou efface) la ligne de l'eleve. Appele apres chaque
   synchronisation reussie ; une erreur ici ne gene jamais la progression. */
function publierClassement(){
  if(!compteConnecte()) return Promise.resolve(false);
  const url = urlDocuments("/classement/" + encodeURIComponent(COMPTE.user.uid));
  const pseudo = pseudoClassement(COMPTE.user.displayName);
  if(!participeClassement() || !pseudo)
    return requeteJeton("DELETE", url).then(() => true, () => false);
  /* « maj » est l'heure du serveur, pas celle du telephone (qu'un tricheur
     regle a sa guise) : les regles s'en servent pour borner la hausse des
     points au temps ecoule depuis la ligne precedente. */
  return requeteJeton("POST", urlDocuments(":commit"), { writes: [{
    update: {
      name: "projects/" + CONFIG_COMPTE.projectId + "/databases/(default)/documents/classement/" + COMPTE.user.uid,
      fields: {
        nom: { stringValue: pseudo },
        points: { integerValue: String(Math.max(0, Math.round(pointsTotal()))) },
        palier: { integerValue: String(rangActuel().i) }
      }
    },
    updateMask: { fieldPaths: ["nom", "points", "palier"] },
    updateTransforms: [{ fieldPath: "maj", setToServerValue: "REQUEST_TIME" }]
  }] }).then(r => r.ok, () => false);
}

/* Les dix premiers, le nombre d'inscrits et le nombre d'eleves devant soi :
   trois requetes, dont deux comptages que Firestore fait sans tout lire. */
function chargerClassement(force){
  if(!compteConnecte() || CLASSEMENT_GENERAL.enCours) return;
  if(!force && CLASSEMENT_GENERAL.liste && Date.now() - CLASSEMENT_GENERAL.maj < CLASSEMENT_FRAIS) return;
  CLASSEMENT_GENERAL.enCours = true;
  const de = { from: [{ collectionId: "classement" }] };
  const top = { structuredQuery: Object.assign({}, de, {
    orderBy: [{ field: { fieldPath: "points" }, direction: "DESCENDING" }], limit: CLASSEMENT_TOP }) };
  const compter = ou => ({ structuredAggregationQuery: { structuredQuery: Object.assign({}, de, ou ? { where: ou } : {}),
    aggregations: [{ alias: "n", count: {} }] } });
  const plusQueMoi = { fieldFilter: { field: { fieldPath: "points" }, op: "GREATER_THAN",
    value: { integerValue: String(Math.round(pointsTotal())) } } };
  const lireJson = r => r.ok ? r.json() : r.json().catch(() => ({})).then(j => {
    throw Object.assign(new Error((j && j.error && j.error.message) || "réponse " + r.status), { statut: r.status }); });
  const nombre = rep => Number(((((rep || [])[0] || {}).result || {}).aggregateFields || {}).n
    ? rep[0].result.aggregateFields.n.integerValue : 0);
  Promise.all([
    requeteJeton("POST", urlDocuments(":runQuery"), top).then(lireJson),
    requeteJeton("POST", urlDocuments(":runAggregationQuery"), compter(null)).then(lireJson),
    requeteJeton("POST", urlDocuments(":runAggregationQuery"), compter(plusQueMoi)).then(lireJson)
  ]).then(([lignes, tous, devant]) => {
    CLASSEMENT_GENERAL.liste = (lignes || []).filter(x => x.document).map(x => {
      const f = x.document.fields || {};
      return { uid: decodeURIComponent(x.document.name.split("/").pop()),
               nom: (f.nom && f.nom.stringValue) || "?",
               points: Number((f.points && f.points.integerValue) || 0),
               palier: Number((f.palier && f.palier.integerValue) || 0) };
    });
    CLASSEMENT_GENERAL.total = nombre(tous);
    CLASSEMENT_GENERAL.devant = nombre(devant);
    CLASSEMENT_GENERAL.erreur = null;
  }).catch(e => {
    CLASSEMENT_GENERAL.erreur = e && e.statut === 403
      ? "Firebase refuse la lecture du classement : les règles Firestore doivent être republiées (voir docs/compte-google.md)."
      : "Classement indisponible pour l’instant.";
  }).finally(() => {
    CLASSEMENT_GENERAL.enCours = false;
    CLASSEMENT_GENERAL.maj = Date.now();
    const zone = document.getElementById("carte-classement");
    if(zone) zone.innerHTML = contenuClassement();
  });
}

function contenuClassement(){
  if(CLASSEMENT_GENERAL.erreur && !CLASSEMENT_GENERAL.liste)
    return `<p class="minuscule" style="margin:0">${esc(estProf() ? CLASSEMENT_GENERAL.erreur : "Classement indisponible pour l’instant.")}</p>`;
  if(!CLASSEMENT_GENERAL.liste) return `<p class="minuscule" style="margin:0">Chargement du classement…</p>`;
  const moi = COMPTE.user ? COMPTE.user.uid : "";
  const parts = [];
  if(!CLASSEMENT_GENERAL.liste.length) parts.push(`<p class="secondaire" style="margin:0">Personne n’est encore classé.</p>`);
  else parts.push(`<ol class="st-classement">${CLASSEMENT_GENERAL.liste.map((e, i) => `<li${e.uid === moi ? ` class="moi"` : ""}>
      <span class="st-num">${i + 1}</span>
      <span class="st-nom"><strong>${esc(e.nom)}${e.uid === moi ? " (vous)" : ""}</strong><small>${esc(libellePalier(Math.min(e.palier, NB_PALIERS - 1)))}</small></span>
      ${badgeClassement(e.palier)}<span class="st-pts">${e.points.toLocaleString("fr-FR")} pts</span></li>`).join("")}</ol>`);
  const pseudo = pseudoClassement(COMPTE.user && COMPTE.user.displayName);
  if(!participeClassement()) parts.push(`<p class="minuscule" style="margin:8px 0 0">Vous n’apparaissez pas dans le classement (Réglages, carte Compte).</p>`);
  else if(!pseudo) parts.push(`<p class="minuscule" style="margin:8px 0 0">Indiquez votre prénom et votre nom dans Réglages, carte Compte, pour apparaître dans le classement.</p>`);
  else if(!CLASSEMENT_GENERAL.liste.some(e => e.uid === moi)) parts.push(`<p class="minuscule" style="margin:8px 0 0"><strong>Vous&#8239;: ${
      (CLASSEMENT_GENERAL.devant || 0) + 1}<sup>e</sup></strong> sur ${Math.max(CLASSEMENT_GENERAL.total || 0, (CLASSEMENT_GENERAL.devant || 0) + 1)}
      &#8226; ${Math.round(pointsTotal()).toLocaleString("fr-FR")} pts</p>`);
  return parts.join("");
}

/* Le badge du rang d'un joueur, juste avant son score, dans tous les
   classements : chacun voit aussi les badges qu'il n'a pas encore. */
function badgeClassement(palier){
  if(typeof palier !== "number" || !(palier >= 0)) return `<span class="st-badge"></span>`;
  return `<span class="st-badge">${emblemeRang(Math.min(Math.floor(palier), NB_PALIERS - 1), 36)}</span>`;
}
/* Les paliers de quelques joueurs, lus dans leur ligne du classement
   general (une seule requete) : { uid: palier }. Un joueur qui n'y figure
   pas n'a pas de badge ; une erreur n'en affiche aucun. */
function paliersDe(uids){
  uids = uids.filter(Boolean);
  if(!uids.length || !compteConnecte()) return Promise.resolve({});
  const racine = urlDocuments("").replace("https://firestore.googleapis.com/v1/", "");
  return requeteJeton("POST", urlDocuments(":batchGet"), { documents: uids.map(u => racine + "/classement/" + encodeURIComponent(u)) })
    .then(r => r.ok ? r.json() : [])
    .then(l => {
      const p = {};
      (l || []).forEach(x => { if(x && x.found){ const f = x.found.fields || {};
        p[decodeURIComponent(x.found.name.split("/").pop())] = Number((f.palier && f.palier.integerValue) || 0); } });
      return p;
    }, () => ({}));
}

/* La carte, en bas de l'accueil. Sans compte configure ni connecte : rien. */
function carteClassement(){
  if(!compteConfigure() || !compteConnecte()) return "";
  chargerClassement(false);
  return filet("Classement général", "classement") + `<div class="carte" id="carte-classement">${contenuClassement()}</div>`;
}

/* ======================================================================
   MODERATION DES NOMS (octobre 2026)

   Le nom du compte s'affiche au classement : il doit etre un vrai prenom

   - supprimer le compte : sanctions/{uid} passe a « supprime », et ses
     lignes de classement et sa progression sont effacees du serveur. A sa
     prochaine ouverture, l'application le deconnecte et n'ecrit plus rien
     (les regles Firestore refusent aussi ses ecritures). Le compte
     Firebase lui-meme ne peut etre efface que par lui-meme ou depuis la

  "porno", "merde", "batard", "couill", "salaud", "hitler", "fuck", "bitch", "nigg"];
function normaliserNom(t){
  return String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}
/* Renvoie la raison du refus, ou null si le nom est acceptable. */
function nomInapproprie(nom){
  const brut = String(nom || "").trim();
  if(brut.length < 2) return "Indiquez votre prénom et votre nom.";
  if(/[0-9@#$%*_=+<>{}\[\]|\\\/~^&]|https?:|www\./i.test(brut))
    return "Indiquez votre vrai prénom et votre nom, sans chiffres ni symboles.";
  const mots = normaliserNom(brut).split(/[^a-z]+/).filter(Boolean);
  const colle = mots.join("");
  if(mots.some(m => MOTS_INTERDITS.has(m)) || RACINES_INTERDITES.some(r => colle.indexOf(r) >= 0) || /(.)\1{3,}/.test(colle))
    return "Ce nom n’est pas accepté. Indiquez votre vrai prénom et votre nom : un nom faux ou déplacé entraîne la suppression du compte.";
  return null;
}

/* ======================================================================
   QUIZ DU JOUR

   Dix questions de culture generale historique, preparees a l'avance pour
   chaque jour (voir << La banque >> plus bas), les memes pour tout le monde
   ce jour-la : une tres facile, trois faciles, trois moyennes et trois
   difficiles, de dix themes differents, toutes periodes confondues. Les
   quiz sont numerotes du #1 (21 octobre 2026) au #437 (31 decembre 2027).
   Affiche sous le nom << Quiz of the Day #N >>.
   Une seule tentative par jour, trente secondes par question ; a zero, la
   question est perdue, meme si une reponse est cochee. Trois points par
   bonne reponse (le meme bareme que les QCM), ajoutes au rang. Le quiz
   change a minuit.

   Contre la triche :
   - quitter l'application ou la fenetre (autre onglet, autre application,
     ecran d'accueil du telephone) pendant une question la compte fausse,
     comme si le chrono tombait a zero ; au retour, on reprend a la
     question suivante (meme apres avoir ferme l'application, le jour
     meme : la question affichee est notee dans enCours) ;
   - dans l'APK, les captures d'ecran sont bloquees pendant le quiz
     (FLAG_SECURE, par PontEpok.ecranProtege) ; un navigateur, lui, ne
     permet pas de les empecher ;
   - le quiz compte comme commence des la premiere question : le fermer ou
     relancer l'application ne permet pas de le refaire ; a minuit, un quiz
     inacheve est clos, les questions restantes comptees fausses ;
   - le corrige n'est visible que le lendemain, pour que les reponses ne
     circulent pas le jour meme.

   Classements du jour et de la semaine (du lundi au dimanche a minuit),
   dans Firestore : jour/{date}/scores/{uid} et semaine/{lundi}/scores/{uid}.
   Ces collections restent sur le serveur : c'est l'archive du futur << mur
   des champions >>. Chaque joueur garde aussi son historique : sa place de
   chaque jour joue (ETAT.quotidien[date].rang / classes) et de chaque
   semaine (ETAT.qjSemaines[lundi]), definitive une fois le jour ou la
   semaine passes. Le professeur joue et figure au classement comme tout
   le monde.
   A score egal, le plus rapide passe devant : le champ << score >> melange
   les deux, pour un seul tri, sans index compose.
   ====================================================================== */

const QJ_NB = 10, QJ_SECONDES = 30, QJ_PTS = 3;
/* Bonus (octobre 2026) : le premier du classement d'un jour, une fois ce
   jour fini, gagne 50 points ; le premier de la semaine, une fois le
   dimanche passe, 100. Ils se deduisent des places definitives gardees
   dans l'historique (rang 1, rangFinal / final). */
/* Bonus du podium (1er, 2e, 3e), du jour et de la semaine. */
const QJ_PODIUM_JOUR = [50, 25, 10], QJ_PODIUM_SEMAINE = [100, 50, 25];
function qjBonus(table, rang){ return (rang >= 1 && table[rang - 1]) || 0; }
function qjPodium(table){ return table.map(n => "+" + n).join(" &#183; "); }
let QJ = null;   // { date, items, i, choix:[], temps:[], debutQ, minuteur, vue, onglet, raison }

/* ---------- Le tirage du jour ---------- */

function qjGraine(texte){
  let h = 1779033703;
  for(let i = 0; i < texte.length; i++){ h = Math.imul(h ^ texte.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}
/* Une question qui renvoie a ce qu'on vient de lire (<< cette seance >>,
   << la carte >>) n'a pas de sens hors de son cours : on l'ecarte. */
const QJ_HORS_CONTEXTE = /\b(cette|la|de la) s[ée]ance\b|\bce cours\b|ci-dessus|ci-dessous|\b(la|cette) (carte|frise)\b|\b(le|ce) (tableau|texte|document|graphique)\b/i;

/* Les cours candidats d'un jour : chacun recoit un rang tire de la date et
   de son identifiant. Ajouter un cours au catalogue ne bouleverse donc pas
   le tirage des autres. */
function qjCandidats(date){
  return COURS.map(c => ({ c, r: qjGraine(date + "|" + c.id)() }))
    .sort((a, b) => a.r - b.r).slice(0, 16).map(x => x.c);
}
/* ---------- La banque ----------
   Les questions de chaque jour sont preparees a l'avance dans une banque
   de culture generale historique (source/quotidien/) : un fichier par
   mois, assets/quotidien/AAAA-MM.js, charge a la demande comme un cours
   (balise script, ou PontEpok.lireQuotidien dans l'APK). Un jour absent
   de la banque retombe sur un tirage dans les questions des cours. */
const QJ_BANQUE = {};          // { "2026-10": { "2026-10-21": [[niv, theme, enonce, bonne, f1, f2, f3, expl], ...] } }
const QJ_NIVEAUX = { T: "Très facile", F: "Facile", M: "Moyenne", D: "Difficile" };
const QJ_NUMEROS = {};         // { "2026-10-21": 1, ... } : le numero du quiz, tel que dans packs.txt
window.EPOK_QJ_RECEVOIR = paquet => {
  if(!paquet || !paquet.mois || !paquet.jours) return;
  const jours = {};
  Object.keys(paquet.jours).forEach(j => {
    const x = paquet.jours[j];
    jours[j] = typeof x === "string" ? VOILE.devoiler(x, "qj#" + j) : x;   // jour voile (z0a_voile.js)
  });
  QJ_BANQUE[paquet.mois] = jours;
  Object.assign(QJ_NUMEROS, paquet.numeros || {});
};
/* Numero du quiz d'un jour : celui de la banque, sinon compte depuis le
   premier (21 octobre 2026). Avant cette date, pas de numero. */
const QJ_PREMIER = Date.UTC(2026, 9, 21);
function qjNumero(date){
  if(QJ_NUMEROS[date]) return QJ_NUMEROS[date];
  const t = Date.UTC(+date.slice(0, 4), +date.slice(5, 7) - 1, +date.slice(8, 10));
  const n = Math.round((t - QJ_PREMIER) / 864e5) + 1;
  return n >= 1 ? n : null;
}
const QJ_NOM = "Quiz of the Day";
function qjTitre(date){ const n = qjNumero(date); return QJ_NOM + (n ? " #" + n : ""); }
const qjMoisEnCours = {};
function qjChargerMois(mois){
  if(QJ_BANQUE[mois] || !/^\d{4}-\d{2}$/.test(mois)) return Promise.resolve(!!QJ_BANQUE[mois]);
  if(qjMoisEnCours[mois]) return qjMoisEnCours[mois];
  return qjMoisEnCours[mois] = new Promise(fini => {
    let rendu = false;
    const secours = () => {
      if(QJ_BANQUE[mois]) return true;
      try{
        if(typeof PontEpok === "undefined" || !PontEpok.lireQuotidien) return false;
        const t = PontEpok.lireQuotidien(mois), a = t.indexOf("(") + 1, b = t.lastIndexOf(")");
        if(a > 0 && b > a) window.EPOK_QJ_RECEVOIR(JSON.parse(t.slice(a, b)));
      }catch(e){}
      return !!QJ_BANQUE[mois];
    };
    const rendre = () => { if(rendu) return; rendu = true; clearTimeout(minuteur); delete qjMoisEnCours[mois]; fini(secours()); };
    const minuteur = setTimeout(rendre, 10000);
    const b = document.createElement("script");
    b.onload = rendre; b.onerror = rendre;
    b.src = "quotidien/" + mois + ".js";
    document.head.appendChild(b);
  });
}
/* Les dix questions du jour tirees de la banque, ou null. La bonne reponse
   y est ecrite en premier : l'ordre affiche est melange, fixe pour le jour. */
function qjDeLaBanque(date){
  const l = (QJ_BANQUE[date.slice(0, 7)] || {})[date];
  if(!l || l.length < QJ_NB) return null;
  return l.slice(0, QJ_NB).map((x, k) => {
    const alea = qjGraine(date + "@" + k);
    return { banque: true, niveau: x[0], theme: x[1], titre: QJ_NIVEAUX[x[0]] + " • " + x[1],
             q: { enonce: x[2], options: x.slice(3, 7), correctes: [0], explication: x[7] },
             ordre: [0, 1, 2, 3].map(o => ({ o, r: alea() })).sort((a, b) => a.r - b.r).map(y => y.o) };
  });
}

/* Un jour au-dela de la banque preparee (le lot suivant n'est pas encore
   la) reprend le quiz du meme rang dans le cycle precedent, 72 jours plus
   tot, jusqu'a retrouver un jour prepare : toujours des questions de
   culture generale, jamais celles des cours. Avant le premier quiz, ou si
   rien n'est trouve, on retombe sur un tirage dans les cours. */
const QJ_CYCLE = 72;
function qjQuestions(date, essais){
  essais = essais || 0;
  return qjChargerMois(date.slice(0, 7)).then(() => {
    const l = qjDeLaBanque(date);
    if(l) return l;
    const n = qjNumero(date);
    if(n && n > QJ_CYCLE && essais < 12){
      const d = new Date(date + "T12:00:00"); d.setDate(d.getDate() - QJ_CYCLE);
      return qjQuestions(iso(d), essais + 1);
    }
    return qjQuestionsDesCours(date);
  });
}
function qjQuestionsDesCours(date){
  return new Promise(res => {
    const cands = qjCandidats(date);
    const fin = () => {
      const items = [];
      for(const c0 of cands){
        if(items.length >= QJ_NB) break;
        const c = coursParId(c0.id);
        if(!c || !c.seances.every(s => s.questions)) continue;
        const alea = qjGraine(date + "#" + c.id);
        const toutes = [];
        c.seances.forEach(s => s.questions.forEach((q, index) => { if(!QJ_HORS_CONTEXTE.test(q.enonce)) toutes.push({ s, q, index }); }));
        if(!toutes.length) continue;
        const pris = toutes[Math.floor(alea() * toutes.length)];
        const ordre = [0, 1, 2, 3].map(o => ({ o, r: alea() })).sort((a, b) => a.r - b.r).map(x => x.o);
        items.push({ coursId: c.id, titre: c.titre, seance: pris.s.numero, index: pris.index, q: pris.q, ordre });
      }
      res(items);
    };
    avecLesCours(cands.map(c => c.id), fin, fin);
  });
}

/* ---------- Ce qui est garde ---------- */

function qjAujourdhui(){ return (ETAT.quotidien || {})[aujourdhui()] || null; }
function pointsQuotidien(){
  let p = 0;
  Object.values(ETAT.quotidien || {}).forEach(e => {
    p += QJ_PTS * (e.justes || 0);
    if(e.rangFinal) p += qjBonus(QJ_PODIUM_JOUR, e.rang);
  });
  Object.values(ETAT.qjSemaines || {}).forEach(w => { if(w && w.final) p += qjBonus(QJ_PODIUM_SEMAINE, w.rang); });
  return p;
}
function nettoyerQuotidien(q){
  const r = {};
  if(!q || typeof q !== "object") return r;
  Object.keys(q).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k)).sort().slice(-400).forEach(k => {
    const e = q[k] || {};
    r[k] = { justes: Math.max(0, Math.min(QJ_NB, Math.round(Number(e.justes) || 0))),
             temps: Math.max(0, Math.min(QJ_NB * QJ_SECONDES, Math.round(Number(e.temps) || 0))),
             fini: e.fini === true,
             choix: Array.isArray(e.choix) ? e.choix.slice(0, QJ_NB).map(c => Array.isArray(c) ? c.filter(Number.isInteger).slice(0, 4) : null) : [],
             envoye: e.envoye === true };
    if(Number.isInteger(e.enCours) && e.enCours >= 0 && e.enCours < QJ_NB) r[k].enCours = e.enCours;
    if(Number.isInteger(e.rang) && e.rang > 0){ r[k].rang = e.rang; r[k].classes = Math.max(e.rang, Number(e.classes) || 0); r[k].rangFinal = e.rangFinal === true; }
  });
  return r;
}
/* Historique des semaines : { lundi: { rang, classes, points, final } }. */
function nettoyerSemainesQJ(q){
  const r = {};
  if(!q || typeof q !== "object") return r;
  Object.keys(q).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k)).sort().slice(-120).forEach(k => {
    const e = q[k] || {};
    if(!Number.isInteger(e.rang) || e.rang < 1) return;
    r[k] = { rang: e.rang, classes: Math.max(e.rang, Number(e.classes) || 0), points: Math.max(0, Number(e.points) || 0), final: e.final === true };
  });
  return r;
}
function fusionnerSemainesQJ(a, b){
  const r = Object.assign({}, a || {});
  Object.keys(b || {}).forEach(k => { if(!r[k] || (b[k].final && !r[k].final)) r[k] = b[k]; });
  return r;
}
/* Fusion de deux appareils : pour chaque jour, le meilleur des deux, et un
   jour commence sur l'un l'est aussi sur l'autre. */
function fusionnerQuotidien(a, b){
  const r = {};
  new Set(Object.keys(a || {}).concat(Object.keys(b || {}))).forEach(k => {
    const x = (a || {})[k], y = (b || {})[k];
    r[k] = !x ? y : !y ? x : ((y.justes || 0) > (x.justes || 0) ? Object.assign({}, y, { fini: x.fini || y.fini }) : Object.assign({}, x, { fini: x.fini || y.fini }));
  });
  return r;
}

/* Un quiz commence et pas fini un jour passe : il est clos tel quel, les
   questions restantes comptees fausses. Celui du jour reste ouvert : on le
   reprend a la question suivante (qjReprendre). */
function qjCloreAbandons(){
  let change = false;
  const auj = aujourdhui();
  Object.keys(ETAT.quotidien || {}).forEach(d => {
    const e = ETAT.quotidien[d];
    if(e.fini || d >= auj) return;
    delete e.enCours;
    e.temps = Math.min(QJ_NB * QJ_SECONDES, e.temps + Math.max(0, QJ_NB - (e.choix || []).length) * QJ_SECONDES);
    e.fini = true; change = true;
  });
  if(change) sauverEtat();
}

/* Le lundi de la semaine d'une date : la semaine va du lundi au dimanche. */
function qjLundi(date){
  const d = new Date(date + "T12:00:00");
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return iso(d);
}
function qjHier(){ const d = new Date(); d.setDate(d.getDate() - 1); return iso(d); }
function qjAvantMinuit(){
  const n = new Date(), m = new Date(n); m.setHours(24, 0, 0, 0);
  const min = Math.max(1, Math.round((m - n) / 60000));
  return min >= 60 ? Math.floor(min / 60) + " h " + String(min % 60).padStart(2, "0") : min + " min";
}

/* ---------- Classements ---------- */

function qjPeutPublier(){
  return typeof compteConnecte === "function" && compteConnecte()
    && participeClassement() && !!pseudoClassement(COMPTE.user && COMPTE.user.displayName);
}
/* La ligne du jour se cree une seule fois (les regles refusent de la
   modifier) ; celle de la semaine se recalcule a partir des jours joues. */
function publierQuotidien(){
  qjCloreAbandons();
  /* Un eleve qui se retire du classement : ses lignes du jour et de la
     semaine partent avec. */
  if(compteConnecte() && !participeClassement()) return effacerQuotidien();
  if(!qjPeutPublier()) return Promise.resolve(false);
  const uid = encodeURIComponent(COMPTE.user.uid), nom = pseudoClassement(COMPTE.user.displayName);
  const envois = [];
  const lundi = qjLundi(aujourdhui());
  Object.keys(ETAT.quotidien || {}).forEach(d => {
    const e = ETAT.quotidien[d];
    if(!e.fini || e.envoye || qjLundi(d) !== lundi) return;
    envois.push(requeteJeton("PATCH", urlDocuments("/jour/" + d + "/scores/" + uid) + "?currentDocument.exists=false", { fields: {
      nom: { stringValue: nom }, justes: { integerValue: String(e.justes) }, temps: { integerValue: String(e.temps) },
      score: { integerValue: String(e.justes * 1000 + (999 - e.temps)) }, maj: { timestampValue: new Date().toISOString() } } })
      .then(r => { if(r.ok || r.status === 409 || r.status === 400){ e.envoye = true; sauverEtat(true); } }, () => {}));
  });
  const jours = Object.keys(ETAT.quotidien || {}).filter(d => ETAT.quotidien[d].fini && qjLundi(d) === lundi);
  if(jours.length){
    const pts = jours.reduce((t, d) => t + QJ_PTS * ETAT.quotidien[d].justes, 0);
    const temps = jours.reduce((t, d) => t + ETAT.quotidien[d].temps, 0);
    envois.push(requeteJeton("PATCH", urlDocuments("/semaine/" + lundi + "/scores/" + uid), { fields: {
      nom: { stringValue: nom }, points: { integerValue: String(pts) }, jours: { integerValue: String(jours.length) },
      temps: { integerValue: String(temps) }, score: { integerValue: String(pts * 10000 + (9999 - temps)) },
      maj: { timestampValue: new Date().toISOString() } } }).catch(() => {}));
  }
  return Promise.all(envois).then(() => true);
}

function effacerQuotidien(){
  if(!compteConnecte()) return Promise.resolve(false);
  const uid = encodeURIComponent(COMPTE.user.uid);
  return Promise.all([
    requeteJeton("DELETE", urlDocuments("/jour/" + aujourdhui() + "/scores/" + uid)),
    requeteJeton("DELETE", urlDocuments("/semaine/" + qjLundi(aujourdhui()) + "/scores/" + uid))
  ]).then(() => true, () => false);
}
function chargerClassementQJ(chemin, monScore){
  if(!compteConnecte()) return Promise.resolve(null);
  const de = { from: [{ collectionId: "scores" }] };
  const lire = r => r.ok ? r.json() : Promise.reject(Object.assign(new Error("réponse " + r.status), { statut: r.status }));
  const nombre = rep => Number(((((rep || [])[0] || {}).result || {}).aggregateFields || {}).n ? rep[0].result.aggregateFields.n.integerValue : 0);
  const base = urlDocuments("/" + chemin);
  return Promise.all([
    requeteJeton("POST", base + ":runQuery", { structuredQuery: Object.assign({}, de, {
      orderBy: [{ field: { fieldPath: "score" }, direction: "DESCENDING" }], limit: 10 }) }).then(lire),
    requeteJeton("POST", base + ":runAggregationQuery", { structuredAggregationQuery: { structuredQuery: de,
      aggregations: [{ alias: "n", count: {} }] } }).then(lire),
    monScore === null ? Promise.resolve(null) :
    requeteJeton("POST", base + ":runAggregationQuery", { structuredAggregationQuery: { structuredQuery: Object.assign({}, de, {
      where: { fieldFilter: { field: { fieldPath: "score" }, op: "GREATER_THAN", value: { integerValue: String(monScore) } } } }),
      aggregations: [{ alias: "n", count: {} }] } }).then(lire)
  ]).then(([lignes, tous, devant]) => {
    const v = (f, k) => Number((f[k] && f[k].integerValue) || 0);
    return { liste: (lignes || []).filter(x => x.document).map(x => { const f = x.document.fields || {};
               return { uid: decodeURIComponent(x.document.name.split("/").pop()), nom: (f.nom && f.nom.stringValue) || "?",
                        justes: v(f, "justes"), points: v(f, "points"), jours: v(f, "jours"), temps: v(f, "temps") }; }),
             total: nombre(tous), devant: devant === null ? null : nombre(devant) };
  }).catch(e => ({ erreur: e && e.statut === 403
    ? "Firebase refuse la lecture de ce classement : les règles Firestore doivent être republiées."
    : "Classement indisponible pour l’instant." }));
}

/* ---------- L'ecran du quiz, pose par-dessus l'application ---------- */

function qjEcran(){
  let v = document.getElementById("quiz-jour");
  if(!v){
    v = document.createElement("div");
    v.id = "quiz-jour";
    v.setAttribute("role", "dialog"); v.setAttribute("aria-modal", "true"); v.setAttribute("aria-label", QJ_NOM);
    document.body.appendChild(v);
    try{ history.pushState({ epok: 3 }, ""); }catch(e){}
  }
  return v;
}
function qjFermer(){
  if(QJ && QJ.vue === "question") return qjSuspendre("Vous avez quitté la question en cours.");
  qjProteger(false);
  const v = document.getElementById("quiz-jour");
  if(v) v.remove();
  QJ = null;
  if(history.state && history.state.epok === 3){ try{ history.back(); }catch(e){} }
  rendre();
}

function qjOuvrir(vue){
  qjCloreAbandons();
  QJ = { date: aujourdhui(), vue: vue || (qjAujourdhui() ? "classement" : "intro"), onglet: "jour", items: null };

}

        <li><strong>${QJ_SECONDES} secondes</strong> par question. À zéro, la question est perdue, même si une réponse est cochée.</li>
        <li><strong>Une seule tentative</strong> par jour&#8239;: le quiz compte dès la première question.</li>
        <li><strong>Système anti-triche</strong>&#8239;: si vous quittez l’application ou la fenêtre pendant une question, le chrono tombe à zéro et cette question est comptée fausse. À votre retour, vous reprenez à la question suivante.</li>
        <li>${QJ_PTS} points par bonne réponse, ajoutés à votre rang. Le corrigé sera visible demain.</li>
        <li><strong>2 classements</strong>&#8239;: celui du jour (au nombre de bonnes réponses, puis au temps) et celui de la semaine, du lundi au dimanche. Votre historique garde votre place de chaque jour joué et de chaque semaine.</li>
        <li><strong>Bonus du podium</strong>&#8239;: 1<sup>er</sup>, 2<sup>e</sup> et 3<sup>e</sup> du jour gagnent ${QJ_PODIUM_JOUR.join(", ").replace(/, (\d+)$/, " et $1")} points à minuit&#8239;; ceux de la semaine ${QJ_PODIUM_SEMAINE.join(", ").replace(/, (\d+)$/, " et $1")} points le dimanche à minuit.</li>

      <p class="minuscule">Score provisoire&#8239;: ${qjAujourdhui() ? qjAujourdhui().justes : 0}/${QJ_NB}. Restez dans l’application jusqu’à la fin du quiz.</p>

  if(e) parts.push(`<div class="score"><span class="chiffre">${e.justes} / ${QJ_NB}</span>
      <p class="minuscule" style="margin:4px 0 0">+${QJ_PTS * e.justes} points &#8226; ${Math.floor(e.temps / 60)} min ${String(e.temps % 60).padStart(2, "0")}</p></div>

      <button type="button" data-action="qj-onglet" data-onglet="jour" aria-pressed="${QJ.onglet === "jour"}">Jour</button>
      <button type="button" data-action="qj-onglet" data-onglet="semaine" aria-pressed="${QJ.onglet === "semaine"}">Cette semaine</button>
